<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queen Clothing Simulator</title>
<style>
  :root { color-scheme: dark; --gold: #e2c47e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140e12; font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; color: #efe6d8; }
  canvas { display: block; touch-action: none; }
  #panel { position: absolute; top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .card { background: rgba(24, 16, 20, 0.86); backdrop-filter: blur(6px); border: 1px solid rgba(226, 196, 126, 0.18); border-radius: 10px; padding: 10px 12px; }
  .card h2 { margin: 0 0 6px; font: 600 11px -apple-system, "Segoe UI", Helvetica, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); display: flex; justify-content: space-between; cursor: pointer; user-select: none; }
  .card h2 .chev { color: #998; }
  .card.collapsed .body { display: none; }
  .card.collapsed h2 { margin-bottom: 0; }
  h1 { font-size: 19px; margin: 0 0 2px; font-weight: normal; color: var(--gold); }
  .sub { font-size: 12px; color: #bfb2a2; margin: 0; line-height: 1.35; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 12px -apple-system, "Segoe UI", Helvetica, sans-serif; color: #d9cfc2; margin-top: 7px; }
  label .val { color: #fff; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--gold); }
  input[type=color] { width: 44px; height: 20px; border: 1px solid #5a4a3e; border-radius: 4px; background: none; padding: 0; }
  select { background: #2e2228; color: #f2ece4; border: 1px solid #5c4a3f; border-radius: 5px; font-size: 12px; padding: 2px 4px; }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button { background: #33262c; color: #f2ece4; border: 1px solid #5c4a3f; border-radius: 6px; padding: 5px 9px; font: 12px -apple-system, "Segoe UI", Helvetica, sans-serif; cursor: pointer; }
  button:hover { background: #45333b; }
  button.on { background: #6e4a1e; border-color: var(--gold); }
  .eras { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
  .eras button { padding: 5px 0; }
  #info { position: absolute; right: 12px; bottom: 12px; width: 340px; z-index: 2; }
  #info h3 { margin: 0 0 2px; font-weight: normal; color: var(--gold); font-size: 17px; }
  #info p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; }
  #info .honest { font: 11px -apple-system, "Segoe UI", sans-serif; color: #a99c8c; margin-top: 8px; }
  .titleRow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #ctlToggle, #infoMore { display: none; flex: none; padding: 3px 8px; }
  #groups { display: flex; flex-direction: column; gap: 8px; }
  #err { display: none; position: absolute; top: 12px; right: 12px; max-width: 420px; background: #5a1b1b; color: #fff; padding: 10px; border-radius: 8px; z-index: 5; font: 12px monospace; white-space: pre-wrap; }
  #toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(24, 16, 20, 0.92); border: 1px solid var(--gold); border-radius: 8px; padding: 6px 12px; font: 13px -apple-system, sans-serif; opacity: 0; transition: opacity 0.3s; z-index: 4; pointer-events: none; }
  @media (max-width: 720px) {
    #panel { width: calc(100% - 24px); max-height: 46%; }
    #info { left: 12px; right: 12px; width: auto; bottom: 8px; }
    #info p { font-size: 12px; }
    #ctlToggle, #infoMore { display: inline-block; }
    #panel.folded .ctl { display: none; }   /* phones: title and era strip only, until ☰ Controls */
    #info:not(.open) .more { display: none; }
  }
</style>
</head>
<body>
<div id="panel" class="folded">
  <div class="card">
    <div class="titleRow"><h1>Queen Clothing Simulator</h1><button id="ctlToggle">☰ Controls</button></div>
    <p class="sub ctl">Royal gowns from 1500 to 2000. Pick an era, morph through time and tweak everything. Drag to orbit, scroll to zoom.</p>
    <div class="eras" id="eras"></div>
    <div class="ctl">
    <label>Year <span class="val" id="yearVal">1600</span></label>
    <input type="range" id="year" min="1500" max="2000" step="5" value="1600">
    <label>X-ray underpinnings <span class="val" id="xrayVal">0.00</span></label>
    <input type="range" id="xray" min="0" max="1" step="0.01" value="0">
    <div class="row">
      <button id="modeStudio" class="on">Studio</button><button id="modeGallery">Gallery</button><button id="overview" style="display:none">Overview</button>
    </div>
    <div class="row">
      <button id="diceEra">🎲 Within era</button><button id="diceWild">🎲 Wild</button><button id="copyLink">Copy link</button><button id="resetEra">Reset era</button>
    </div>
    </div>
  </div>
  <div id="groups" class="ctl"></div>
</div>
<div id="info" class="card"><div class="titleRow"><h3 id="infoTitle"></h3><button id="infoMore">more</button></div><div class="more"><div class="sub" id="infoDates"></div><p id="infoNote"></p><p class="honest">Stylised reconstruction for play; proportions and details are simplified.</p></div></div>
<div id="toast"></div>
<div id="err"></div>
<script id="shared-code">
// ============================================================ test harness
const QueenTests = {
  cases: [],
  add(name, fn) { this.cases.push([name, fn]); },
  run() {
    let pass = 0, fail = 0;
    for (const [name, fn] of this.cases) {
      try { fn(); pass++; console.log('ok   ' + name); }
      catch (e) { fail++; console.log('FAIL ' + name + ': ' + e.message); }
    }
    console.log(`${pass} passed, ${fail} failed`);
    return fail === 0;
  },
};
function assert(c, m) { if (!c) throw new Error(m || 'assertion failed'); }
function assertNear(a, b, eps, m) { if (!(Math.abs(a - b) <= eps)) throw new Error(`${m || 'not near'}: ${a} vs ${b} (eps ${eps})`); }
const QC = {};
// ============================================================ part 1: parameter model, eras, morph, hash, dice
Object.assign(QC, (() => {
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a * (1 - t) + b * t;
  function smoothstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function decimals(step) { const s = String(step), i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; }
  function snap(v, d) {
    const n = Math.round((clamp(v, d.min, d.max) - d.min) / d.step);
    return +clamp(d.min + n * d.step, d.min, d.max).toFixed(decimals(d.step));
  }

  // -------- colours
  const HEX = /^#[0-9a-f]{6}$/;
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
  function rgbToHex(c) { return '#' + c.map(x => Math.round(clamp(x, 0, 1) * 255).toString(16).padStart(2, '0')).join(''); }
  const toLin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const toSrgb = c => (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
  function mixHex(a, b, t) {
    if (t <= 0) return a; if (t >= 1) return b;
    const A = hexToRgb(a).map(toLin), B = hexToRgb(b).map(toLin);
    return rgbToHex(A.map((x, i) => toSrgb(lerp(x, B[i], t))));
  }
  function rgbToHsl([r, g, b]) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function hslToRgb([h, s, l]) {
    if (s === 0) return [l, l, l];
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3), f(h), f(h - 1 / 3)];
  }
  function jitterHex(hex, rng, amt) {
    const [h, s, l] = rgbToHsl(hexToRgb(hex));
    return rgbToHex(hslToRgb([(h + (rng() * 2 - 1) * 0.07 * amt + 1) % 1, clamp(s + (rng() * 2 - 1) * 0.12 * amt, 0, 1), clamp(l + (rng() * 2 - 1) * 0.08 * amt, 0, 1)]));
  }

  // -------- schema
  const PATTERNS = ['plain', 'damask', 'trellis', 'floral', 'brocade', 'stripes', 'jewelgrid'];

  const SCHEMA = [

    C('bodiceColor', 'Fabric', 'Bodice'), C('bodiceAccent', 'Fabric', 'Bodice accent'),
    CH('pattern', 'Fabric', PATTERNS, 'Gown pattern'),
    CH('forePattern', 'Fabric', PATTERNS, 'Forepart pattern'),
    N('patternScale', 'Fabric', 0.4, 2.5, 0.05, 'Pattern scale'),
    CH('material', 'Fabric', ['satin', 'velvet', 'brocade', 'taffeta'], 'Material'),
    N('sheen', 'Fabric', 0, 1, 0.01, 'Sheen'),
    N('braidBands', 'Trim', 0, 6, 1, 'Hem braid bands'),
    C('braidColor', 'Trim', 'Braid'),
    N('frontTrim', 'Trim', 0, 0.08, 0.002, 'Opening trim (m)'),
    N('pearlRows', 'Trim', 0, 3, 1, 'Pearl rows'),
    N('jewelDensity', 'Trim', 0, 1, 0.01, 'Jewels on skirt'),
    N('fringe', 'Trim', 0, 1, 0.01, 'Fringe'),
    N('bowsOnSkirt', 'Trim', 0, 12, 1, 'Skirt bows'),
    N('sash', 'Trim', 0, 1, 0.01, 'Order sash'),
    C('sashColor', 'Trim', 'Sash'),
    N('necklaces', 'Jewels', 0, 6, 1, 'Pearl ropes'),
    N('pearlLength', 'Jewels', 0, 1, 0.01, 'Rope length'),
    CH('crown', 'Jewels', ['none', 'tudor', 'diadem', 'tiara', 'coronation'], 'Crown'),
    N('crownScale', 'Jewels', 0.6, 1.4, 0.01, 'Crown size'),
    CH('gloves', 'Jewels', ['none', 'wrist', 'opera'], 'Gloves'),
    CH('sceptreOrb', 'Jewels', ['none', 'sceptre', 'orb', 'both'], 'Sceptre & orb'),
    CH('handFan', 'Jewels', ['off', 'on'], 'Hand fan'),
    CH('hairStyle', 'Hair & face', ['gable', 'curls', 'pouf', 'chignon', 'upswept', 'modern'], 'Hair style'),
    C('hairColor', 'Hair & face', 'Hair'),
    N('poufHeight', 'Hair & face', 0, 1, 0.01, 'Pouf height'),
    C('skinTone', 'Hair & face', 'Skin'),
    N('faceMakeup', 'Hair & face', 0, 1, 0.01, 'Court make-up'),
    CH('motionMode', 'Motion', ['still', 'turntable', 'walk', 'twirl'], 'Motion', { global: true, def: 'turntable' }),
    N('speed', 'Motion', 0.2, 2, 0.05, 'Speed', { global: true, def: 1 }),
    N('wind', 'Motion', 0, 1, 0.01, 'Wind', { global: true, def: 0.15 }),
    N('swing', 'Motion', 0, 1, 0.01, 'Looseness', { global: true, def: 0.6 }),
    N('damping', 'Motion', 0, 1, 0.01, 'Damping', { global: true, def: 0.45 }),
  ];
  const SCHEMA_BY_KEY = {};
  for (const d of SCHEMA) SCHEMA_BY_KEY[d.key] = d;

  // -------- eras (notes are our own words)
  const ERAS = [
    { year: 1500, name: 'Tudor', dates: 'c. 1500–1560',
      note: 'Early Tudor court dress: a stiff cone of a skirt held out by a Spanish farthingale of graduated hoops, a square neckline, wide trumpet sleeves turned back in fur or brocade, and a gable hood framing the face. The gown often opened at the front over a separate forepart of richer cloth.',
      params: { waistY: 1, waist: 0.112, hipShelf: 0.2, hemRadius: 0.55, curve: 0, pannier: 0, bustle: 0, trainLength: 0.35, frontOpen: 0.45, flounces: 0, flounceDepth: 0.12, hemFullness: 0.3,
        bust: 0.13, corsetShape: 'cone', neckShape: 'square', neckDepth: 0.08, neckWidth: 0.11, pointDepth: 0.03, stomacher: 0.8, stomacherBows: 0,
        sleeveLength: 1, shoulderPuff: 0.1, upperFull: 0.1, cuffFlare: 0.65, engageantes: 0, sleeveSlash: 2,
        ruff: 0, ruffLayers: 1, fanCollar: 0, bertha: 0, highCollar: 0,

        gownColor: '#7a1424', gownAccent: '#c9a245', foreColor: '#c9a24a', foreAccent: '#7a1424', bodiceColor: '#7a1424', bodiceAccent: '#c9a245',
        pattern: 'plain', forePattern: 'brocade', patternScale: 1, material: 'velvet', sheen: 0.7,
        braidBands: 1, braidColor: '#d4af37', frontTrim: 0.03, pearlRows: 1, jewelDensity: 0.05, fringe: 0, bowsOnSkirt: 0, sash: 0, sashColor: '#2a5aa8',

        hairStyle: 'gable', hairColor: '#6b3a1e', poufHeight: 0, skinTone: '#ecc4aa', faceMakeup: 0.25 } },
    { year: 1600, name: 'Elizabethan', dates: 'c. 1580–1620',
      note: 'Late Elizabethan: the French wheel farthingale threw the skirt out flat at the hips before it dropped straight to the floor. Starched cartwheel ruffs, wired lace fans behind the head, jewel-studded silk and long ropes of pearls turned the queen into an icon.',
      params: { waistY: 1, waist: 0.105, hipShelf: 0.46, hemRadius: 0.49, curve: 0, pannier: 0, bustle: 0, trainLength: 0.2, frontOpen: 0, flounces: 0, flounceDepth: 0.12, hemFullness: 0.45,

        sleeveLength: 1, shoulderPuff: 0.65, upperFull: 0.45, cuffFlare: 0, engageantes: 0.15, sleeveSlash: 0,
        ruff: 0.8, ruffLayers: 2, fanCollar: 0.9, bertha: 0, highCollar: 0,
        mantle: 0, mantleWidth: 0.5, ermine: 0.1, mantleColor: '#3a1830',
        gownColor: '#f2eee4', gownAccent: '#b3122b', foreColor: '#f2eee4', foreAccent: '#b3122b', bodiceColor: '#f2eee4', bodiceAccent: '#b3122b',
        pattern: 'jewelgrid', forePattern: 'jewelgrid', patternScale: 1.3, material: 'satin', sheen: 0.6,
        braidBands: 0, braidColor: '#d4af37', frontTrim: 0.02, pearlRows: 2, jewelDensity: 0.1, fringe: 0, bowsOnSkirt: 0, sash: 0, sashColor: '#2a5aa8',
        necklaces: 5, pearlLength: 1, crown: 'tudor', crownScale: 0.8, gloves: 'none', sceptreOrb: 'none', handFan: 'on',
        hairStyle: 'curls', hairColor: '#b5532a', poufHeight: 0, skinTone: '#f2dccd', faceMakeup: 0.9 } },
    { year: 1700, name: 'Rococo', dates: 'c. 1720–1780',
      note: 'The robe à la française at its mid-century height: side hoops called panniers made the skirt very wide but flat front to back. The gown opened over a matching petticoat and a stomacher laced with a ladder of bows, with tiers of lace at the elbow and a tall powdered coiffure.',
      params: { waistY: 1.02, waist: 0.1, hipShelf: 0.28, hemRadius: 0.38, curve: 0.1, pannier: 1, bustle: 0, trainLength: 0.5, frontOpen: 0.55, flounces: 2, flounceDepth: 0.1, hemFullness: 0.6,
        bust: 0.12, corsetShape: 'cone', neckShape: 'square', neckDepth: 0.09, neckWidth: 0.12, pointDepth: 0.09, stomacher: 1, stomacherBows: 6,
        sleeveLength: 0.5, shoulderPuff: 0, upperFull: 0.05, cuffFlare: 0.35, engageantes: 1, sleeveSlash: 0,
        ruff: 0, ruffLayers: 1, fanCollar: 0, bertha: 0, highCollar: 0,
        mantle: 0, mantleWidth: 0.5, ermine: 0.1, mantleColor: '#2b4a7a',
        gownColor: '#b8d2e3', gownAccent: '#e8a0b0', foreColor: '#f1ece2', foreAccent: '#e8a0b0', bodiceColor: '#b8d2e3', bodiceAccent: '#e8a0b0',
        pattern: 'floral', forePattern: 'floral', patternScale: 1, material: 'taffeta', sheen: 0.5,
        braidBands: 0, braidColor: '#f1ece2', frontTrim: 0.04, pearlRows: 0, jewelDensity: 0, fringe: 0, bowsOnSkirt: 6, sash: 0, sashColor: '#2a5aa8',

        hairStyle: 'pouf', hairColor: '#e8e2d8', poufHeight: 0.8, skinTone: '#f0d2c0', faceMakeup: 0.5 } },

        bust: 0.13, corsetShape: 'hourglass', neckShape: 'offshoulder', neckDepth: 0.12, neckWidth: 0.13, pointDepth: 0.06, stomacher: 0, stomacherBows: 0,
        sleeveLength: 0.22, shoulderPuff: 0.2, upperFull: 0, cuffFlare: 0.15, engageantes: 0.4, sleeveSlash: 0,
        ruff: 0, ruffLayers: 1, fanCollar: 0, bertha: 0.8, highCollar: 0,
        mantle: 0.7, mantleWidth: 0, ermine: 0.05, mantleColor: '#7e2234',
        gownColor: '#f3efe6', gownAccent: '#d8cdb8', foreColor: '#f3efe6', foreAccent: '#d8cdb8', bodiceColor: '#f3efe6', bodiceAccent: '#d8cdb8',

  const skin = skinMat(p);
  Q.add(new THREE.Mesh(toGeom(QC.buildTorsoBand(p, 64, 40, () => f.waistY - 0.02, () => f.neckY, 0)), skin));
  const nh = f.headY - f.neckY + 0.02;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.06, nh, 24, 1, true), skin);
  neck.position.set(0, f.neckY - 0.02 + nh / 2, -0.004); Q.add(neck);
  const headMat = new THREE.MeshPhysicalMaterial({ map: faceTex(p.skinTone, p.faceMakeup), roughness: 0.5, sheen: 0.4, sheenColor: new THREE.Color('#ffd0c0'), clearcoat: 0.15 });
  Q.add(blob(headMat, QC.HEAD[0], QC.HEAD[1], QC.HEAD[2], 0, f.headY, 0));
  Q.add(blob(skin, 0.011, 0.02, 0.014, 0, f.headY - 0.012, 0.088));    // nose
  Q.add(blob(skin, 0.13, 0.1, 0.11, 0, f.waistY - 0.1, -0.005));        // pelvis, only seen in x-ray
  const shoe = new THREE.MeshStandardMaterial({ color: '#3a2a22', roughness: 0.6 });
  const glove = new THREE.Color('#f6f2ea'), sk = new THREE.Color(p.skinTone);
  const gloved = t => (p.gloves === 'opera' && t > 0.42) || (p.gloves === 'wrist' && t > 0.86);
  const armMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.5, sheen: 0.3, sheenColor: new THREE.Color('#ffd0c0') });
  const handMat = p.gloves !== 'none' ? new THREE.MeshStandardMaterial({ color: '#f6f2ea', roughness: 0.6 }) : skin;
  for (const s of [1, -1]) {
    const lh = f.waistY - 0.14, leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.035, lh, 16), skin);
    leg.position.set(0.075 * s, lh / 2 + 0.03, 0); Q.add(leg);
    Q.add(blob(shoe, 0.035, 0.03, 0.08, 0.075 * s, 0.03, 0.03));
    const curve = armCurve(p, s);
    Q.add(new THREE.Mesh(tubeGeom(curve, 0, 1, QC.armRadius, 48, 16, t => (gloved(t) ? glove : sk)), armMat));
    const end = curve.getPointAt(1), tan = curve.getTangentAt(1);
    const hand = blob(handMat, 0.024, 0.017, 0.05, 0, 0, 0);
    hand.position.copy(end).addScaledVector(tan, 0.03); hand.lookAt(hand.position.clone().add(tan)); Q.add(hand);
  }
  buildHair(Q, p, f);
  buildCrown(Q, p, f);
}
function hairTopY(p, f) {
  const y = f.headY;
  switch (p.hairStyle) {
    case 'pouf': return y + 0.09 + 0.12 * (0.4 + p.poufHeight) * 0.95;
    case 'curls': return y + 0.135;
    case 'upswept': return y + 0.15;
    case 'gable': return y + 0.14;
    default: return y + 0.12;
  }
}
function buildHair(Q, p, f) {
  const H = QC.HEAD, y = f.headY;
  const hm = new THREE.MeshStandardMaterial({ color: p.hairColor, roughness: 0.55 });
  const add = (sx, sy, sz, x, yy, z, m = hm) => Q.add(blob(m, sx, sy, sz, x, y + yy, z));
  if (p.hairStyle === 'gable') {
    const velvet = new THREE.MeshPhysicalMaterial({ color: '#1a1214', roughness: 0.8, sheen: 1, sheenColor: new THREE.Color('#5a4a50') });
    add(H[0] * 1.13, H[1] * 1.08, H[2] * 1.1, 0, 0.012, -0.022, velvet);
    const shape = new THREE.Shape([[-0.105, -0.11], [-0.105, 0.07], [0, 0.15], [0.105, 0.07], [0.105, -0.11]].map(a => new THREE.Vector2(a[0], a[1])));
    shape.holes.push(new THREE.Path([[-0.078, -0.11], [0.078, -0.11], [0.078, 0.06], [0, 0.12], [-0.078, 0.06]].map(a => new THREE.Vector2(a[0], a[1]))));
    const frame = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.035, bevelEnabled: false }), new THREE.MeshStandardMaterial({ color: '#d4af37', metalness: 0.8, roughness: 0.35 }));
    frame.position.set(0, y, 0.035); Q.add(frame);
    const veil = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.025), velvet);
    veil.position.set(0, y - 0.07, -0.11); veil.rotation.x = 0.18; Q.add(veil);
    return;
  }
  add(H[0] * 1.07, H[1] * 1.03, H[2] * 1.05, 0, 0.018, -0.014);   // cap over the top and back
  if (p.hairStyle === 'curls') {
    for (let k = 0; k < 15; k++) { const a = lerp(-1.35, 1.35, k / 14); add(0.024, 0.022, 0.022, 0.082 * Math.sin(a), 0.06 + 0.035 * Math.cos(a), 0.06 * Math.cos(a) - 0.005); }
    add(0.085, 0.06, 0.085, 0, 0.085, -0.01);
  } else if (p.hairStyle === 'pouf') {
    const hgt = 0.12 * (0.4 + p.poufHeight);
    add(0.092, hgt, 0.098, 0, 0.09, -0.012);
    for (const s of [1, -1]) for (let k = 0; k < 3; k++) {
      const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.016, 0.05, 4, 10), hm);
      c.rotation.x = Math.PI / 2; c.position.set(s * (0.088 + 0.004 * k), y + 0.01 - 0.033 * k, -0.02); Q.add(c);
    }
    const feather = new THREE.MeshStandardMaterial({ color: '#fbf8f2', roughness: 0.9 });
    const accentFeather = new THREE.MeshStandardMaterial({ color: p.gownAccent, roughness: 0.9 });
    for (const [rz, rx, len, m] of [[-0.3, -0.5, 0.095, feather], [-0.75, -0.3, 0.08, accentFeather], [-1.1, -0.65, 0.065, feather]]) {   // plume on the left of the pouf
      const fe = blob(m, 0.012, len, 0.006, 0, 0, 0); fe.rotation.set(rx, 0, rz);
      fe.position.set(0.045, y + 0.06 + hgt, -0.045).addScaledVector(new THREE.Vector3(0, 1, 0).applyEuler(fe.rotation), len * 0.85); Q.add(fe);
    }
  } else if (p.hairStyle === 'chignon') {
    const bun = new THREE.Mesh(new THREE.TorusGeometry(0.034, 0.02, 10, 24), hm); bun.position.set(0, y - 0.03, -0.1); Q.add(bun);
    for (const s of [1, -1]) for (let k = 0; k < 3; k++) add(0.016, 0.022, 0.016, s * 0.08, -0.04 - 0.035 * k, -0.01);
  } else if (p.hairStyle === 'upswept') {
    add(0.098, 0.075, 0.1, 0, 0.065, 0); add(0.04, 0.03, 0.04, 0, 0.13, -0.015);
  } else {
    add(0.093, 0.085, 0.1, 0, 0.035, -0.008);
    for (const s of [1, -1]) add(0.03, 0.05, 0.06, s * 0.085, -0.02, -0.01);
  }
}
function buildCrown(Q, p, f) {
  if (p.crown === 'none') return;
  const g = new THREE.Group(), gold = goldMat(), GEMS = ['#b3122b', '#1f4fa8', '#138a52'];
  const gem = c => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.1, clearcoat: 1, emissive: c, emissiveIntensity: 0.15 });
  const arcPts = (R, a0, a1, y, n = 32) => Array.from({ length: n + 1 }, (_, k) => { const a = lerp(a0, a1, k / n); return new THREE.Vector3(R * Math.sin(a), y, R * Math.cos(a)); });
  const tube = (pts, r, closed = false, mat = gold) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed), pts.length * 3, r, 8, closed), mat);
  const ball = (mat, r, x, y, z) => { const m = new THREE.Mesh(SPHERE, mat); m.scale.setScalar(r); m.position.set(x, y, z); return m; };
  if (p.crown === 'tiara') {
    const R = 0.088; g.add(tube(arcPts(R, -1.35, 1.35, 0), 0.004));
    for (let k = 0; k <= 12; k++) {
      const a = lerp(-1.3, 1.3, k / 12), h = 0.018 + 0.035 * Math.cos(a) ** 4;
      const sp = new THREE.Mesh(new THREE.ConeGeometry(0.0045, h, 6), gold); sp.position.set(R * Math.sin(a), h / 2, R * Math.cos(a)); g.add(sp);
      g.add(ball(gem(k % 3 ? '#e6eeff' : GEMS[(k / 3) % 3]), 0.0055, R * Math.sin(a), h, R * Math.cos(a)));   // mostly diamonds
    }
    g.position.set(0, f.headY + 0.072, 0.012); g.rotation.x = -0.3;
  } else if (p.crown === 'diadem') {
    const R = 0.072, pm = pearlMat(); g.add(tube(arcPts(R, 0, TAU, 0), 0.004, true));
    for (let k = 0; k < 16; k++) {
      const a = (k / 16) * TAU, h = 0.012 + 0.012 * (k % 2);
      const sp = new THREE.Mesh(new THREE.ConeGeometry(0.004, h, 6), gold); sp.position.set(R * Math.sin(a), h / 2, R * Math.cos(a)); g.add(sp);
      g.add(ball(pm, 0.0045, R * Math.sin(a), h + 0.002, R * Math.cos(a)));
    }
    g.position.set(0, hairTopY(p, f) - 0.03, -0.008);
  } else {   // tudor imperial crown or coronation crown
    const R = 0.074;
    g.add(tube(arcPts(R, 0, TAU, 0), 0.006, true), tube(arcPts(R, 0, TAU, 0.03), 0.004, true));
    const band = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.03, 40, 1, true), gold); band.position.y = 0.015; g.add(band);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(R * 0.95, 24, 12, 0, TAU, 0, Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: p.crown === 'coronation' ? '#4a1a5e' : '#8a1020', roughness: 0.8, sheen: 1, sheenColor: new THREE.Color('#ff9090') }));
    cap.scale.y = 0.85; cap.position.y = 0.02; g.add(cap);
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * TAU, x = R * Math.sin(a), z = R * Math.cos(a);
      if (k % 2 === 0) {
        const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.034, 0.004), gold), c2 = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.01, 0.004), gold);
        c1.position.set(x, 0.047, z); c2.position.set(x, 0.05, z); c1.rotation.y = c2.rotation.y = a; g.add(c1, c2);
      } else { const fl = new THREE.Mesh(new THREE.ConeGeometry(0.009, 0.03, 6), gold); fl.position.set(x, 0.045, z); g.add(fl); }
      g.add(ball(gem(GEMS[k % 3]), 0.0065, x * 1.06, 0.015, z * 1.06));
    }
    for (const a of [0, Math.PI / 2]) {   // two depressed arches crossing over the top
      const pts = Array.from({ length: 25 }, (_, k) => { const t = lerp(-Math.PI / 2, Math.PI / 2, k / 24), r = R * Math.sin(t); return new THREE.Vector3(r * Math.sin(a), 0.03 + 0.075 * Math.cos(t) - 0.018 * Math.cos(t) ** 8, r * Math.cos(a)); });
      g.add(tube(pts, 0.0045));
    }
    g.add(ball(gold, 0.014, 0, 0.1, 0));
    const x1 = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.03, 0.006), gold); x1.position.y = 0.125;
    const x2 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.006, 0.006), gold); x2.position.y = 0.128; g.add(x1, x2);
    if (p.crown === 'coronation') g.add(tube(arcPts(R * 1.05, 0, TAU, -0.002), 0.012, true, new THREE.MeshStandardMaterial({ map: ermineTex(8, 1), roughness: 0.95 })));
    g.position.set(0, hairTopY(p, f) - 0.03, -0.008);
  }
  g.scale.setScalar(p.crownScale); Q.add(g);
}

// ------------------------------------------------------------------ queen: gown core
function buildGown(Q, p, f) {
  const tile = TILE(p), U = Math.max(4, Math.round(14 / p.patternScale));
  const gown = fabricMat(p, p.pattern, p.gownColor, p.gownAccent, U, 1 / tile);
  Q.add(new THREE.Mesh(toGeom(QC.buildSkirtGrid(p, 160, 64, { gap: true })), gown), { cloth: true, outer: true });
  if (p.frontOpen > 0.01) {
    const fore = fabricMat(p, p.forePattern, p.foreColor, p.foreAccent, U, 1 / tile);
    Q.add(new THREE.Mesh(toGeom(QC.buildSkirtGrid(p, 96, 48, { inset: 0.985, noTrain: true, folds: false })), fore), { cloth: true, outer: true });
  }
  const bu = Math.max(2, Math.round(0.8 / tile));
  const bod = fabricMat(p, p.pattern, p.bodiceColor, p.bodiceAccent, bu, 1 / tile);
  const sto = fabricMat(p, p.forePattern, p.foreColor, p.foreAccent, bu, 1 / tile);
  Q.add(new THREE.Mesh(toGeom(QC.buildBodiceGrid(p)), [bod, sto]), { outer: true });
  Q.mats = { gown, bod, tile, U };
}

// ------------------------------------------------------------------ queen: details
const PEARL = sharedGeo(new THREE.SphereGeometry(1, 12, 8));
const JEWEL = sharedGeo(new THREE.OctahedronGeometry(1));
let BOW = null;
function bowGeo() {
  if (BOW) return BOW;
  const parts = [];
  for (const s of [1, -1]) {
    const loop = new THREE.TorusGeometry(0.28, 0.1, 8, 20); loop.scale(1, 0.6, 0.5); loop.rotateZ(s * 0.25); loop.translate(s * 0.3, 0, 0); parts.push(loop);
    const tail = new THREE.BoxGeometry(0.12, 0.45, 0.04); tail.rotateZ(s * 0.35); tail.translate(s * 0.12, -0.3, 0); parts.push(tail);
  }
  parts.push(new THREE.SphereGeometry(0.12, 12, 8));
  BOW = sharedGeo(mergeGeometries(parts.map(g => (g.index ? g.toNonIndexed() : g))));   // mixed indexing makes mergeGeometries return null
  return BOW;
}
const at = (x, y, z, s = 1, ry = 0, rx = 0) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, 0, 'YXZ')), new THREE.Vector3(s, s, s));
function instanced(geo, mat, mats) { const m = new THREE.InstancedMesh(geo, mat, mats.length); mats.forEach((M, i) => m.setMatrixAt(i, M)); m.instanceMatrix.needsUpdate = true; return m; }
const outward = (q, d) => { const r = Math.hypot(q[0], q[2]) || 1, k = (r + d) / r; return [q[0] * k, q[1], q[2] * k]; };

function buildDetails(Q, p, f) {
  const { gown, tile } = Q.mats, gap = p.frontOpen > 0.01, R = QC.mulberry32(17);
  const braidM = (rx, ry) => new THREE.MeshStandardMaterial({ color: p.braidColor, map: braidTex(rx, ry), metalness: 0.6, roughness: 0.38, side: THREE.DoubleSide });

  // ---- sleeves + engageantes
  for (const s of [1, -1]) {
    const curve = armCurve(p, s), L = p.sleeveLength * 0.9;
    Q.add(new THREE.Mesh(tubeGeom(curve, 0, L, t => QC.sleeveRadius(t, p), 64, 28), fabricMat(p, p.pattern, p.bodiceColor, p.bodiceAccent, 2, 1 / tile)), { outer: true });
    if (p.engageantes > 0.01) {
      const P = curve.getPointAt(L), T = curve.getTangentAt(L);
      const d = T.clone().multiplyScalar(0.35).add(new THREE.Vector3(0, -1, -0.25)).normalize();
      const r0 = QC.sleeveRadius(L, p) * 0.92;
      for (let k = 0; k < 3; k++) {
        const r1 = r0 + (0.03 + 0.05 * p.engageantes) * (1 + 0.3 * k), len = (0.05 + 0.09 * p.engageantes) * (1 + 0.25 * k);
        const cone = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, len, 36, 1, true), laceMat(4 + k, 1));
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), d);   // wide (scalloped) end points along d
        cone.position.copy(P).addScaledVector(d, len / 2 - 0.01 + 0.012 * k);
        Q.add(cone, { outer: true, shadow: false });
      }
    }
  }

  // ---- collars
  if (p.ruff > 0.01) for (let k = 0; k < p.ruffLayers; k++) {
    const rm = new THREE.MeshPhysicalMaterial({ color: '#fbf8f1', map: laceTex(1, 1), alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.7, sheen: 0.3 });
    const ring = QC.buildRuffRing(p, k); ring.seam = true;   // the ring is closed; shared code reports seam:false
    Q.add(new THREE.Mesh(toGeom(ring), rm), { outer: true });
  }
  if (p.fanCollar > 0.01) {
    const Rf = 0.12 + 0.3 * p.fanCollar, tilt = 0.35;
    const pt = (s, t) => { const a = lerp(-1.9, 1.9, s), rho = Rf * (0.12 + 0.88 * t), u = rho * Math.sin(a), w = rho * Math.cos(a);
      return [u, f.shoulderY + 0.03 + w * Math.cos(tilt), -0.06 - w * Math.sin(tilt) + 0.45 * u * u]; };
    Q.add(new THREE.Mesh(toGeom(QC.gridMesh(64, 10, (s, t) => [...pt(s, t), s * 8, 1 - t])), laceMat(1, 1)), { outer: true, shadow: false });
    const rimPts = Array.from({ length: 65 }, (_, k) => new THREE.Vector3(...pt(k / 64, 1)));
    Q.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rimPts), 128, 0.0018, 5), goldMat()), { outer: true });
  }
  if (p.bertha > 0.01) {
    const depth = 0.03 + 0.11 * p.bertha, rs = QC.sleeveRadius(0.06, p);
    const m = QC.gridMesh(120, 6, (s, t) => {
      const phi = Math.PI + s * TAU, y = QC.necklineTop(phi, p) + 0.008 - t * depth;
      const side = Math.abs(Math.sin(phi)) ** 3;
      const q = QC.torsoPoint(phi, Math.max(y, f.waistY), p, 0.012 + 0.035 * t * t + side * (rs + 0.01) + 0.006 * t * Math.sin(phi * 60));
      return [q[0], q[1], q[2], s * 24, 1 - t];
    });
    m.seam = true;
    Q.add(new THREE.Mesh(toGeom(m), laceMat(1, 1)), { outer: true, shadow: false });
  }
  if (p.highCollar > 0.01) {
    const h = 0.02 + 0.045 * p.highCollar, tex = laceTex(10, -1); tex.offset.y = 1;   // scallops at the top
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.062, h, 40, 1, true), new THREE.MeshStandardMaterial({ color: '#f7f2e8', map: tex, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.75 }));
    c.position.set(0, f.neckY - 0.012 + h / 2, -0.004);
    Q.add(c, { outer: true, shadow: false });
  }

  // ---- mantle of estate with ermine
  if (p.mantle > 0.01) {
    const MC = 48, MR = 72;
    const mm = new THREE.MeshPhysicalMaterial({ color: p.mantleColor, roughness: 0.8, sheen: 1, sheenRoughness: 0.4, sheenColor: new THREE.Color(p.mantleColor).lerp(new THREE.Color('#ffffff'), 0.5), side: THREE.DoubleSide });
    Q.add(new THREE.Mesh(toGeom(QC.gridMesh(MC, MR, (s, t) => [...QC.mantlePoint(s, t, p), s, t])), mm), { cloth: true, outer: true });
    if (p.ermine > 0.005) {
      const lift = (q, d) => { const o = outward(q, d); if (o[1] < 0.05) o[1] += 0.004; return o; };
      const pathLen = f.shoulderY - QC.HEM_Y + p.mantle;
      for (const edge of [0, 1]) {
        const m = QC.gridMesh(4, MR, (a, t) => {
          const c = QC.mantlePoint(0.5, t, p), width = Math.hypot(c[0], c[2]) * QC.mantleHalfSpan(t, p) * 2;
          const ds = Math.min(0.5, p.ermine / Math.max(width, 0.05)), s = edge ? 1 - ds * a : ds * a;

        });
        Q.add(new THREE.Mesh(toGeom(m), new THREE.MeshStandardMaterial({ map: ermineTex(1, 1), roughness: 0.95, side: THREE.DoubleSide })), { cloth: true, outer: true });
      }
      const tb = 1 - Math.min(0.5, p.ermine / pathLen);
      const hem = QC.gridMesh(MC, 3, (s, a) => [...lift(QC.mantlePoint(s, lerp(tb, 1, a), p), 0.005), s * 12, (a * p.ermine) / 0.25]);
      Q.add(new THREE.Mesh(toGeom(hem), new THREE.MeshStandardMaterial({ map: ermineTex(1, 1), roughness: 0.95, side: THREE.DoubleSide })), { cloth: true, outer: true });
    }

  // ---- flounces + fringe
  for (let k = 0; k < p.flounces; k++) {
    const d = p.flounceDepth, v0 = p.flounces === 1 ? 0.97 - d : lerp(0.32, 0.97 - d, k / (p.flounces - 1));
    const m = QC.buildSkirtGrid(p, 200, 10, { gap: true, v0, v1: v0 + d, offset: 0.008 + 0.004 * k, flare: 0.03, ruffle: true, lift: 0.003 * (k + 1) });
    Q.add(new THREE.Mesh(toGeom(m), gown), { cloth: true, outer: true });
    if (p.fringe > 0.01) {
      const C = m.cols + 1, j = m.rows, len = 0.015 + 0.06 * p.fringe, pts = [];
      for (let i = 0; i < C - 1; i++) for (let s = 0; s < 3; s++) {
        const a = (j * C + i) * 3, b = a + 3, t = s / 3;
        const x = lerp(m.pos[a], m.pos[b], t), y = lerp(m.pos[a + 1], m.pos[b + 1], t), z = lerp(m.pos[a + 2], m.pos[b + 2], t);
        pts.push(x, y, z, x * 1.01, Math.max(0.004, y - len), z * 1.01);
      }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      Q.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: p.braidColor })), { cloth: true, outer: true });
    }
  }

  // ---- braid: hem bands and the edges of the opening (or a centre-front band)
  for (let k = 0; k < p.braidBands; k++) {
    const vc = 0.985 - k * 0.06;
    Q.add(new THREE.Mesh(toGeom(QC.buildSkirtGrid(p, 200, 2, { gap: true, v0: vc - 0.014, v1: vc, offset: 0.004, uvBand: true, uScale: 200 })), braidM(1, 1)), { cloth: true, outer: true });
  }
  if (p.frontTrim > 0.001) {
    const w = p.frontTrim, rAt = (v, th) => Math.max(0.08, QC.skirtRadius(v, th, p));
    const spans = gap
      ? [v => { const g = QC.halfGap(v, p); return [g, g + w / rAt(v, g)]; }, v => { const g = QC.halfGap(v, p); return [QC.TAU - g - w / rAt(v, -g), QC.TAU - g]; }]

// ------------------------------------------------------------------ gallery
const galleryQueens = [];
const GALLERY_OVERVIEW = { pos: [-1.9, 6, 15.4], target: [-1.9, 1, -2.6] };   // wide enough for all six, arc centred in the area beside the panel
function buildGallery() {
  if (galleryQueens.length) return;
  const rugMat = new THREE.MeshStandardMaterial({ color: '#5a1a28', roughness: 0.9 }), rimMat = goldMat();
  QC.galleryLayout(6).forEach((s, i) => {
    const rug = new THREE.Mesh(new THREE.CircleGeometry(1.15, 64), rugMat); rug.rotation.x = -Math.PI / 2; rug.position.set(s.x, 0.004, s.z); rug.receiveShadow = true; gallery.add(rug);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.01, 6, 96), rimMat); ring.rotation.x = Math.PI / 2; ring.position.set(s.x, 0.006, s.z); gallery.add(ring);
    const q = new Queen(); q.base.set(s.x, 0.006, s.z); q.baseYaw = s.yaw; q.t = i * 1.7; q.xray = S.xray; q.root.userData.slot = i;
    galleryQueens.push(q); gallery.add(q.root);
    const sp = new THREE.SpotLight(0xffe8d0, 25, 9, 0.38, 0.7, 1.5); sp.position.set(s.x * 0.8, 5.5, s.z * 0.8 + 1.2); sp.target.position.set(s.x, 0.8, s.z); gallery.add(sp, sp.target);
  });
  const sun = new THREE.DirectionalLight(0xfff0e0, 1.2); sun.position.set(3, 9, 6); sun.target.position.set(0, 0, -3);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 6, bottom: -6, near: 1, far: 25 }); sun.shadow.camera.updateProjectionMatrix();
  gallery.add(sun, sun.target);
}
let tween = null;
function flyTo(dst) { tween = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...dst.pos), t1: new THREE.Vector3(...dst.target) }; }
function updateCamTween(dt) {
  if (!tween) return;
  tween.t = Math.min(1, tween.t + dt / 0.8);
  const e = tween.t < 0.5 ? 2 * tween.t ** 2 : 1 - (-2 * tween.t + 2) ** 2 / 2;
  camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
  if (tween.t >= 1) tween = null;
}
function focusSlot(i) {
  const s = QC.galleryLayout(6)[i], dir = new THREE.Vector3(-s.x, 0, 2 - s.z).normalize();
  const target = [s.x, 0.95, s.z];
  flyTo({ pos: fitPos([s.x + dir.x * 4.2, 1.5, s.z + dir.z * 4.2], target), target });
  S.active = i; syncUI(); saveHash();
}
function setMode(m) {
  S.mode = m; studio.visible = m === 'studio'; gallery.visible = m === 'gallery'; key.visible = m === 'studio';
  if (m === 'gallery') { buildGallery(); flyTo(GALLERY_OVERVIEW); } else { tween = null; setCam('three'); }
  $('modeStudio').classList.toggle('on', m === 'studio'); $('modeGallery').classList.toggle('on', m === 'gallery');
  $('overview').style.display = m === 'gallery' ? '' : 'none';
  scene.fog.near = m === 'gallery' ? 18 : 10; scene.fog.far = m === 'gallery' ? 44 : 26; controls.maxDistance = m === 'gallery' ? 20 : 16;
  applyXray();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.opacity = 0), 1600); }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || S.mode !== 'gallery' || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(galleryQueens.map(q => q.root), true)[0];
  if (!hit) return;
  let o = hit.object; while (o && o.userData.slot === undefined) o = o.parent;
  if (o) focusSlot(o.userData.slot);
});

// ------------------------------------------------------------------ app state
const S = {
  slots: QC.ERAS.map((e, i) => QC.paramsForEra(i)),
  slotEra: QC.ERAS.map((e, i) => i),
  slotYear: QC.ERAS.map(e => e.year),
  active: 1, mode: 'studio', xray: 0,
};
const cur = () => S.slots[S.active];
let hashTimer = 0;
// ?year and ?era are dropped once the gown lives in the hash, so a reload restores the hashed gown instead of overriding it
function shareURL() {
  const sp = new URLSearchParams(location.search); sp.delete('year'); sp.delete('era');
  const q = sp.toString();
  return location.href.split(/[?#]/)[0] + (q ? '?' + q : '') + '#' + QC.encodeHash(cur(), S.slotEra[S.active]);
}
function saveHashNow() { try { history.replaceState(null, '', shareURL()); } catch { /* sandboxed or data: pages refuse replaceState */ } }
function saveHash() { clearTimeout(hashTimer); hashTimer = setTimeout(saveHashNow, 250); }
function setSlot(p, era, year) { S.slots[S.active] = p; S.slotEra[S.active] = era; S.slotYear[S.active] = year; syncUI(); saveHash(); }
function setParam(k, v) {
  if (QC.SCHEMA_BY_KEY[k].global) { for (const s of S.slots) s[k] = v; syncUI(); saveHash(); return; }   // motion: no rebuild
  setSlot(Object.assign({}, cur(), { [k]: v }), S.slotEra[S.active], null);
}

// ------------------------------------------------------------------ UI
const ui = {};
let emitting = null;   // the control whose own input event is running; syncUI leaves it alone (Safari doesn't focus buttons, so focus can't tell)
const emit = (el, fn) => () => { emitting = el; try { fn(); } finally { emitting = null; } };
function fmt(d, v) { return d.kind !== 'num' ? v : d.step >= 1 ? String(v) : (+v).toFixed(Math.min(3, QC.decimals(d.step))); }
function buildUI() {
  QC.ERAS.forEach((e, i) => {
    const b = document.createElement('button'); b.textContent = e.year; b.title = e.name;
    b.onclick = () => setSlot(QC.paramsForEra(i, cur()), i, e.year);
    $('eras').appendChild(b); ui['era' + i] = b;
  });
  $('year').oninput = emit($('year'), () => { const y = +$('year').value; setSlot(QC.paramsAtYear(y, cur()), QC.nearestEra(y), y); });
  for (const g of QC.GROUPS) {
    const card = document.createElement('div'); card.className = 'card' + (g === 'Silhouette' ? '' : ' collapsed');
    const h = document.createElement('h2'); h.innerHTML = `<span>${g}</span><span class="chev">▾</span>`; h.onclick = () => card.classList.toggle('collapsed');
    const body = document.createElement('div'); body.className = 'body';
    card.append(h, body); $('groups').appendChild(card);
    for (const d of QC.SCHEMA.filter(d => d.group === g)) {
      const lab = document.createElement('label'), name = document.createElement('span'); name.textContent = d.label; lab.appendChild(name);
      let input, val = null;
      if (d.kind === 'num') {
        val = document.createElement('span'); val.className = 'val'; lab.appendChild(val);
        input = document.createElement('input'); input.type = 'range'; input.min = d.min; input.max = d.max; input.step = d.step;
        input.oninput = emit(input, () => setParam(d.key, +input.value));
        body.append(lab, input);
      } else if (d.kind === 'color') {
        input = document.createElement('input'); input.type = 'color'; input.oninput = emit(input, () => setParam(d.key, input.value));
        lab.appendChild(input); body.appendChild(lab);
      } else {
        input = document.createElement('select');
        for (const o of d.options) { const op = document.createElement('option'); op.value = op.textContent = o; input.appendChild(op); }
        input.onchange = emit(input, () => setParam(d.key, input.value)); lab.appendChild(input); body.appendChild(lab);
      }
      ui[d.key] = { input, val, d };
    }
  }
}
function syncUI() {
  const p = cur();
  for (const d of QC.SCHEMA) { const c = ui[d.key]; if (emitting !== c.input) c.input.value = p[d.key]; if (c.val) c.val.textContent = fmt(d, p[d.key]); }
  const y = S.slotYear[S.active], E = QC.ERAS[S.slotEra[S.active]];
  if (y !== null && emitting !== $('year')) $('year').value = y;
  $('yearVal').textContent = y === null ? 'custom' : String(y);
  QC.ERAS.forEach((e, i) => ui['era' + i].classList.toggle('on', y === e.year));
  $('infoTitle').textContent = (y !== null && y !== E.year ? `c. ${y} · ` : '') + E.name;
  $('infoDates').textContent = E.dates + (y === null ? ' · customised' : y !== E.year ? ' · morphing' : '');
  $('infoNote').textContent = E.note;
}

// ------------------------------------------------------------------ loop
function syncQueens() {
  if (S.mode === 'studio') { if (studioQueen.p !== cur()) studioQueen.build(cur()); }
  else galleryQueens.forEach((q, i) => { if (q.p !== S.slots[i]) q.build(S.slots[i]); });
}
const clock = new THREE.Clock();
function tick(dt) {
  syncQueens();
  if (S.mode === 'studio') studioQueen.step(dt, cur());
  else galleryQueens.forEach((q, i) => q.step(dt, S.slots[i], true));
  updateCamTween(dt);
  controls.update();
}
function render() { renderer.render(scene, camera); flushDispose(); }   // old queen parts die only after the new ones drew
function frame() { requestAnimationFrame(frame); tick(Math.min(clock.getDelta(), 0.05)); render(); }

// ------------------------------------------------------------------ init
buildUI();
$('xray').oninput = () => { S.xray = +$('xray').value; $('xrayVal').textContent = S.xray.toFixed(2); applyXray(); };
if (qs.has('xray')) { S.xray = QC.clamp(+qs.get('xray') || 0, 0, 1); $('xray').value = S.xray; $('xrayVal').textContent = S.xray.toFixed(2); }
const seed = () => (Date.now() ^ (Math.random() * 1e9)) >>> 0;
$('diceEra').onclick = () => setSlot(QC.randomCommission(QC.mulberry32(seed()), 'within', S.slotEra[S.active], cur()), S.slotEra[S.active], null);
$('diceWild').onclick = () => setSlot(QC.randomCommission(QC.mulberry32(seed()), 'wild', S.slotEra[S.active], cur()), S.slotEra[S.active], null);
$('resetEra').onclick = () => { const e = S.slotEra[S.active]; setSlot(QC.paramsForEra(e, cur()), e, QC.ERAS[e].year); };
$('copyLink').onclick = async () => {
  saveHashNow();
  const url = shareURL();   // not location.origin: that is "null" on file:// in Firefox
  try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch { toast('Copy failed: the link is in the address bar'); }
};
$('modeStudio').onclick = () => setMode('studio');
$('modeGallery').onclick = () => setMode('gallery');
$('overview').onclick = () => flyTo(GALLERY_OVERVIEW);
$('ctlToggle').onclick = () => $('ctlToggle').classList.toggle('on', !$('panel').classList.toggle('folded'));
$('infoMore').onclick = () => { $('infoMore').textContent = $('info').classList.toggle('open') ? 'less' : 'more'; };
const qEra = parseInt(qs.get('era'), 10);
if (qEra >= 0 && qEra < 6) S.active = qEra;
if (location.hash.length > 1) {
  const h = QC.decodeHash(location.hash);
  S.active = h.era; S.slots[h.era] = h.params;
  const local = Object.assign({}, h.params); for (const d of QC.SCHEMA) if (d.global) local[d.key] = d.def;   // motion keys don't make a gown custom
  S.slotYear[h.era] = QC.encodeHash(local, h.era) === 'e=' + h.era ? QC.ERAS[h.era].year : null;
  for (const d of QC.SCHEMA) if (d.global) for (const s of S.slots) s[d.key] = h.params[d.key];
}
if (qs.has('year')) { const y = QC.clamp(+qs.get('year') || 1600, 1500, 2000); S.slots[S.active] = QC.paramsAtYear(y, cur()); S.slotEra[S.active] = QC.nearestEra(y); S.slotYear[S.active] = y; }
if (QC.SCHEMA_BY_KEY.motionMode.options.includes(qs.get('motion'))) for (const s of S.slots) s.motionMode = qs.get('motion');
setCam(qs.get('cam') || 'three');
if (qs.get('mode') === 'gallery') {
  setMode('gallery');
  const fq = parseInt(qs.get('focus'), 10);
  if (fq >= 0 && fq < 6) focusSlot(fq);
  updateCamTween(1);   // jump straight to the destination for headless shots
}
syncUI();
studioQueen.xray = S.xray;
for (let i = 0, n = Math.round((+qs.get('warm') || 0) * 60); i < n; i++) tick(1 / 60);
tick(0);
render();
window.__qc = { S, tick, step: tick, render, flushDispose, pendingDispose, setParam, setSlot, studioQueen, renderer, scene, camera };
requestAnimationFrame(frame);
</script>
</body>
</html>
