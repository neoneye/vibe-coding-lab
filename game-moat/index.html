// Cheap per-tick refresh. Never rebuilds the panel, so a slider survives a drag.
function refreshReadouts() {
  const s = ui.state;
  if (!s || !$("ro-day")) return;
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set("ro-feed", s.lastFedDay === 0 ? "not since handover" : (s.day - s.lastFedDay) + " day(s) ago");
  set("ro-hunger", Math.round(meanHunger(s) * 100) + "%");
  set("ro-ambient", s.env.ambient.toFixed(1) + " °C");
  set("ro-water", s.env.waterTemp.toFixed(1) + " °C");
  set("ro-ammonia", Math.round(s.env.ammonia * 100) + "%");
  set("ro-turbidity", Math.round(s.env.turbidity * 100) + "%");
  set("ro-weather", s.env.weather + (s.env.powered ? "" : " · no power"));
  set("ro-handlers", String(s.staff.handlers));
  set("ro-guards", String(s.staff.guards));
  set("ro-pr", s.staff.pr ? "retained" : "none");
  set("ro-fatigue", Math.round(s.staff.fatigue * 100) + "%");
  set("ro-day", `${s.day} of ${s.contractDays}`);
  set("ro-sat", Math.round(s.satisfaction) + "%");
  set("ro-animals", `${s.crocs.filter(c => c.present).length} present · ${s.licensedHeadcount} licensed`);
  const ab = $("ro-ammonia-bar");
  if (ab) { ab.style.width = (s.env.ammonia * 100) + "%"; ab.style.background = s.env.ammonia > 0.55 ? "var(--alert)" : "var(--accent)"; }
  const fb = $("ro-fatigue-bar");
  if (fb) { fb.style.width = (s.staff.fatigue * 100) + "%"; fb.style.background = s.staff.fatigue > 0.6 ? "var(--alert)" : "var(--accent)"; }
  const st = $("ro-structures");
  if (st) {
    st.innerHTML = (s.structures || []).map(x => {
      const known = x.knownIntegrity;
      const txt = known === null || known === undefined ? "not inspected" : Math.round(known * 100) + "%";
      const cls = known !== null && known !== undefined && known < 0.35 ? ' style="color:var(--alert)"' : "";
      return `<div class="readout"><span class="k">${x.name}</span><span${cls}>${txt}</span></div>`;
    }).join("") || `<div class="hint">No structures surveyed.</div>`;
  }
}

function renderTopbar() {
  const s = ui.state;
  if (!s) {
    $("clock").textContent = "—";
    $("activity-readout").textContent = "—";
    $("census-readout").textContent = "—";
    $("hours-readout").textContent = "—";
    return;
  }
  const band = activityBand(s.activity);
  $("clock").textContent = `Day ${s.day} · ${String(s.hour).padStart(2, "0")}:00`;
  $("activity-readout").innerHTML = `<span class="band-${band}">${s.activity} ${BAND_LABEL[band]}</span>`;
  $("census-readout").textContent = ui.censusObs
    ? (ui.censusObs.kind === "range" ? `${ui.censusObs.low}–${ui.censusObs.high} observed` : `${ui.censusObs.counted} of ${ui.censusObs.expected}`)
    : "not yet taken";
  $("hours-readout").textContent = `${hoursRemaining(s)} of ${s.hours.budget}`;
  for (const b of $("speed-controls").children) b.classList.toggle("on", Number(b.dataset.speed) === ui.speed);
}

function renderLog() {
  const s = ui.state;
  if (!s) return;
  $("log").innerHTML = `<div class="section"><h3>Facility log</h3></div>` +
    s.log.slice(-70).reverse().map(e => `
      <div class="entry ${e.kind}">
        <div class="ts">Day ${e.day} · ${String(e.hour).padStart(2, "0")}:${e.kind === "census" ? "14" : "00"}</div>
        <div>${esc(e.text)}</div>
      </div>`).join("");
}

// ============ canvas ============
function fitCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

const TAU = Math.PI * 2;

function render(dt) {
  renderTopbar();
  const s = ui.state;
  if (!s) return;
  const { ctx, w, h } = fitCanvas($("moat"));
  advanceAnimation(s, dt || 0);
  drawMoat(ctx, w, h, s);
}

// Render-only motion. The simulation never reads these, so smoothing the picture
// cannot affect determinism. Torpid animals barely move, which is the clearest
// read on the dial the player gets.
function advanceAnimation(s, dt) {
  const secs = Math.min(dt, 100) / 1000;
  for (const c of s.crocs) {
    if (c.ang === undefined) { c.ang = c.x * TAU; c.rad = c.y; c.platform = null; }
    const speed = c.state === "patrolling" ? 0.055 + (s.activity / 100) * 0.16
      : c.state === "submerged" ? 0.012 + (s.activity / 100) * 0.03 : 0;
    c.ang = (c.ang + speed * secs * (c.id % 2 ? 1 : -1) + TAU) % TAU;
    const targetRad = c.state === "basking" ? 0.08 : c.state === "patrolling" ? 0.5 : c.rad;
    c.rad += (targetRad - c.rad) * Math.min(1, secs * 1.2);
  }
}

// Flat two-tone top-down silhouette: tail about half the total length, tapered
// torso, four short limbs. Naturalistic shading would fight the control-room register.
function crocSprite(ctx, x, y, ang, L, body, back) {
  const W = L * 0.24;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = body;
  // tail
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, 0);
  ctx.lineTo(-L * 0.08, -W * 0.46);
  ctx.lineTo(-L * 0.08, W * 0.46);
  ctx.closePath();
  ctx.fill();
  // limbs
  for (const [lx, ly] of [[0.16, 1], [0.16, -1], [-0.06, 1], [-0.06, -1]]) {
    ctx.beginPath();
    ctx.moveTo(L * lx, ly * W * 0.3);
    ctx.lineTo(L * (lx - 0.09), ly * W * 0.95);
    ctx.lineTo(L * (lx + 0.03), ly * W * 0.9);
    ctx.closePath();
    ctx.fill();
  }
  // torso
  ctx.beginPath();
  ctx.ellipse(L * 0.07, 0, L * 0.27, W * 0.56, 0, 0, TAU);
  ctx.fill();
  // head
  ctx.fillStyle = back;
  ctx.beginPath();
  ctx.moveTo(L * 0.3, -W * 0.36);
  ctx.lineTo(L * 0.53, -W * 0.15);
  ctx.lineTo(L * 0.53, W * 0.15);
  ctx.lineTo(L * 0.3, W * 0.36);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMoat(ctx, w, h, s) {
  const cx = w / 2, cy = h / 2;
  const outer = Math.min(w, h) * 0.43;
  const width = outer * 0.35;
  const inner = outer - width;
  const turb = clamp01(s.env.turbidity);
  const level = clamp01(s.env.waterLevel);

  ctx.clearRect(0, 0, w, h);

  // --- ground and compound ---
  ctx.fillStyle = "#1a1d1f";
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#242826";
  ctx.beginPath(); ctx.arc(cx, cy, outer + width * 0.5, 0, TAU); ctx.fill();

  // --- water (layer 1). Clear teal to opaque brown as turbidity rises. ---
  const wr = outer - width * (1 - level) * 0.12;      // a flood creeps up the coping
  const wi = inner + width * (1 - level) * 0.12;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, wr, 0, TAU);
  ctx.arc(cx, cy, wi, 0, TAU, true);
  ctx.clip();
  ctx.fillStyle = `rgb(${Math.round(38 + turb * 54)}, ${Math.round(78 - turb * 30)}, ${Math.round(82 - turb * 44)})`;
  ctx.fillRect(0, 0, w, h);
  // a few slack surface bands, fainter in murk
  ctx.globalAlpha = 0.06 * (1 - turb * 0.7);
  ctx.strokeStyle = "#cfe6e2";
  for (let r = wi + 6; r < wr; r += 11) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const mid = (wi + wr) / 2;
  const place = (c) => {
    const r = wi + clamp01(c.rad) * (wr - wi);
    return [cx + Math.cos(c.ang) * r, cy + Math.sin(c.ang) * r];
  };
  const sizeOf = (c) => clamp(width * 0.30 * (c.length / 3.4), 7, width * 0.62);

  // --- submerged animals (layer 2). Murky water genuinely hides them. ---
  ctx.globalAlpha = 0.22 + 0.34 * (1 - turb);
  for (const c of s.crocs) {
    if (!c.present || c.state !== "submerged") continue;
    const [x, y] = place(c);
    crocSprite(ctx, x, y, c.ang + Math.PI / 2, sizeOf(c), "#22403c", "#1d3835");
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- banks and structures (layer 3) ---
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#3a4048";                          // coping stone
  ctx.beginPath(); ctx.arc(cx, cy, outer, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, inner, 0, TAU); ctx.stroke();

  // the compound: a secure facility, drawn as a site plan rather than a picture
  ctx.fillStyle = "#2b2f33";
  ctx.beginPath(); ctx.arc(cx, cy, inner - 2, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#383e44"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, inner * 0.86, 0, TAU); ctx.stroke();   // inner wall
  const bw = inner * 0.78, bh = inner * 0.30;
  for (const oy of [-bh * 1.05, bh * 0.15]) {                            // two cell blocks
    ctx.fillStyle = "#33383e";
    ctx.fillRect(cx - bw / 2, cy + oy, bw, bh * 0.8);
    ctx.strokeStyle = "#414850";
    ctx.strokeRect(cx - bw / 2, cy + oy, bw, bh * 0.8);
    ctx.strokeStyle = "#3a4047";                                          // cell divisions
    for (let i = 1; i < 9; i++) {
      const x = cx - bw / 2 + (bw / 9) * i;
      ctx.beginPath(); ctx.moveTo(x, cy + oy); ctx.lineTo(x, cy + oy + bh * 0.8); ctx.stroke();
    }
  }
  ctx.fillStyle = "#5f5a50";
  ctx.font = "9px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.fillText("BLOCK A", cx, cy - bh * 1.05 - 5);
  ctx.fillText("BLOCK B", cx, cy + bh * 0.15 - 5);
  ctx.fillText("EXERCISE YARD", cx, cy + bh * 1.35);

  // basking platforms on the inner bank, capacity-limited
  const platforms = Math.max(0, Math.min(s.facility.baskingPlatforms, 26));
  const platPos = [];
  for (let i = 0; i < platforms; i++) {
    const a = (i / platforms) * TAU + 0.15;
    const r = inner + width * 0.17;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    platPos.push([px, py, a]);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = "#514c40";
    ctx.fillRect(-width * 0.15, -width * 0.07, width * 0.3, width * 0.14);
    ctx.restore();
  }

  // service bridge: has to exist, is the obvious weak point, the client insists it be decorative
  const bridge = (s.structures || []).find(x => x.id === "service-bridge");
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = "#4a4438";
  ctx.fillRect(inner - 4, -width * 0.12, width + 8, width * 0.24);
  ctx.strokeStyle = "#5d5647"; ctx.lineWidth = 1;
  ctx.strokeRect(inner - 4, -width * 0.12, width + 8, width * 0.24);
  ctx.restore();

  // culvert grates at the compass points
  const grate = (s.structures || []).find(x => x.id === "culvert-grate");
  for (let i = 0; i < 4; i++) {
    const a = i * (TAU / 4) + Math.PI / 4;
    const px = cx + Math.cos(a) * (outer + 1), py = cy + Math.sin(a) * (outer + 1);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a);
    ctx.fillStyle = "#3f4650";
    ctx.fillRect(-2, -7, 12, 14);
    ctx.strokeStyle = "#585f6a"; ctx.lineWidth = 1;
    for (let g = -5; g <= 5; g += 3) { ctx.beginPath(); ctx.moveTo(-1, g); ctx.lineTo(9, g); ctx.stroke(); }
    ctx.restore();
  }

  // --- surfaced animals (layer 4) ---
  let basked = 0;
  for (const c of s.crocs) {
    if (!c.present || c.state === "hidden" || c.state === "submerged") continue;
    let x, y, ang;
    if (c.state === "basking" && basked < platPos.length) {
      const [px, py, pa] = platPos[basked++];
      x = px; y = py; ang = pa + Math.PI / 2;
    } else {
      [x, y] = place(c); ang = c.ang + Math.PI / 2;
    }
    crocSprite(ctx, x, y, ang, sizeOf(c), c.state === "basking" ? "#6d6a4a" : "#3f6350", "#2c4a3c");
  }

  // --- staff (layer 5) ---
  ctx.fillStyle = "#b8b0a0";
  for (let i = 0; i < s.staff.handlers; i++) {
    const a = (i / Math.max(1, s.staff.handlers)) * TAU + s.hour * 0.09;
    const r = outer + width * 0.28;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 2.6, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "#7f93a8";                            // guards posted at the bridge
  for (let i = 0; i < s.staff.guards; i++) {
    ctx.beginPath();
    ctx.arc(cx + (i - (s.staff.guards - 1) / 2) * 9, cy - outer - width * 0.16, 2.6, 0, TAU);
    ctx.fill();
  }

  // --- overlays (layer 6) ---
  ctx.textAlign = "left";
  ctx.font = "10px ui-monospace, monospace";
  const failing = (s.structures || []).filter(x => x.knownIntegrity !== null && x.knownIntegrity !== undefined && x.knownIntegrity < 0.35);
  if (failing.length) {
    ctx.fillStyle = "#b4544a";
    ctx.fillText(`INTEGRITY BELOW THRESHOLD: ${failing.map(f => f.name).join(", ").toUpperCase()}`, 12, h - 26);
  }
  if (ui.censusObs && ui.censusObs.short) {
    ctx.fillStyle = "#b4544a";
    ctx.fillText("MORNING COUNT SHORT — ONE OR MORE ANIMALS UNACCOUNTED", 12, h - 12);
  }
  if (!s.env.powered) {
    ctx.fillStyle = "#c8a45c";
    ctx.fillText("SUPPLY FAILURE — HEATERS AND PUMPS OFFLINE", 12, 18);
  }
  const band = activityBand(s.activity);
  ctx.fillStyle = "#6a655a";
  ctx.fillText(`${s.env.waterTemp.toFixed(1)} °C · ${BAND_LABEL[band].toUpperCase()}`, 12, h - 40);
}

// ============ briefing ============
function openBriefing() {
  ui.modalOpen = true;
  ui.censusObs = null;
  ui.censusDone = false;
  ui.censusResponded = false;
  ui.choiceResolved = false;
  $("modal").hidden = false;
  renderBriefing();
}


function closeBriefing() {
  ui.modalOpen = false;
  $("modal").hidden = true;
  refreshReadouts();
  renderLog();
}

function renderBriefing() {
  const s = ui.state;
  const censusRows = Object.entries(CENSUS_DEPTHS).map(([key, d]) => {
    const ok = censusAvailable(s, key) && hoursRemaining(s) >= d.hours;
    const why = !censusAvailable(s, key) ? "water too murky" : hoursRemaining(s) < d.hours ? "insufficient hours" : "";
    return `<div class="opt ${ui.censusObs && ui.censusObs.depth === key ? "chosen" : ""}">
      <div><div class="lbl">${d.label}</div><div class="desc">${key === "cursory" ? "A number you cannot rely on." : key === "standard" ? "A count, and whether it is short." : "Exact count with per-animal health flags."}${why ? " — " + why : ""}</div></div>
      <button data-census="${key}" ${ok && !ui.censusDone ? "" : "disabled"}>${d.hours} hr</button>
    </div>`;
  }).join("");

  const actionRows = BRIEFING_ACTIONS.map(a => {
    const spent = s.hours.allocations[a.id] || 0;
    return `<div class="opt ${spent ? "chosen" : ""}">
      <div><div class="lbl">${a.label}</div><div class="desc">${a.description}</div></div>
      <div class="alloc">
        <span class="cost">${a.hours} hr</span>
        <button data-alloc-minus="${a.id}" ${spent ? "" : "disabled"}>−</button>
        <span class="n">${spent ? spent + " hr" : "—"}</span>
        <button data-alloc-plus="${a.id}" ${hoursRemaining(s) >= a.hours ? "" : "disabled"}>+</button>
      </div>
    </div>`;
  }).join("");

  const obs = ui.censusObs;
  const censusResult = obs ? `
    <div class="section"><h3>Count</h3>
      <div style="margin-bottom:8px">${esc(censusNarrative(s, obs))}</div>
      ${obs.healthFlags.length ? `<div class="hint">${obs.healthFlags.map(f => esc(f.name + " — " + f.note)).join("<br>")}</div>` : ""}
      ${obs.short && !ui.censusResponded ? renderCensusResponses() : ""}
    </div>` : "";

  // Overnight events the player must answer before the day can start.
  const inc = ui.overnightIncident;
  const pendingChoice = inc && inc.choices && !ui.choiceResolved;
  const overnight = inc ? `
    <div class="section"><h3>Overnight</h3>
      <div class="lbl" style="margin-bottom:2px">${esc(inc.title)}</div>
      <div class="hint" style="margin-bottom:8px">${esc(ui.overnightText || "")}</div>
      ${pendingChoice ? inc.choices.map((c, i) =>
        `<div class="opt"><div><div class="lbl">${esc(c.label)}</div>${c.hours ? `<div class="desc">${c.hours} handler-hours</div>` : ""}</div><button data-choice="${i}">Select</button></div>`
      ).join("") : ""}
    </div>` : "";

  $("modal-body").innerHTML = `
    <h2>Morning briefing — day ${s.day}</h2>
    <div class="sub">${s.hours.budget} handler-hours available. ${hoursRemaining(s)} unspent.</div>
    ${overnight}
    <div class="section"><h3>Census</h3>${censusRows}</div>
    ${censusResult}
    <div class="section"><h3>Allocations</h3>${actionRows}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="primary" id="begin-day" ${pendingChoice ? "disabled" : ""}>Begin day</button>
    </div>`;

  $("modal-body").querySelectorAll("[data-choice]").forEach(b => b.addEventListener("click", () => {
    const c = inc.choices[Number(b.dataset.choice)];
    if (c.hours) s.hours.spent = Math.min(s.hours.budget, s.hours.spent + c.hours);
    c.apply(s);
    ui.choiceResolved = true;
    renderBriefing();
  }));
  $("modal-body").querySelectorAll("[data-resp]").forEach(b => b.addEventListener("click", () => {
    censusResponse(s, b.dataset.resp);
    ui.censusResponded = true;
    renderBriefing();
  }));

  $("modal-body").querySelectorAll("[data-census]").forEach(b => b.addEventListener("click", () => {
    ui.censusObs = runCensus(s, b.dataset.census);
    ui.censusDone = true;
    logEvent(s, censusNarrative(s, ui.censusObs), "census");
    renderBriefing();
  }));
  $("modal-body").querySelectorAll("[data-alloc-plus]").forEach(b => b.addEventListener("click", () => {
    allocateHours(s, b.dataset.allocPlus);
    renderBriefing();
  }));
  $("modal-body").querySelectorAll("[data-alloc-minus]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.allocMinus;
    const a = BRIEFING_ACTIONS.find(x => x.id === id);
    s.hours.allocations[id] = Math.max(0, (s.hours.allocations[id] || 0) - a.hours);
    if (!s.hours.allocations[id]) delete s.hours.allocations[id];
    s.hours.spent = Math.max(0, s.hours.spent - a.hours);
    renderBriefing();
  }));
  $("begin-day").addEventListener("click", () => { closeBriefing(); setSpeed(1); });
}

function renderCensusResponses() {
  return `<div style="margin-top:8px">
    <div class="hint" style="margin-bottom:6px">The count is short. It may be a miscount. It may not.</div>
    <div class="opt"><div><div class="lbl">Assume miscount, proceed</div><div class="desc">Free. If wrong, the animal surfaces somewhere in a few days.</div></div><button data-resp="assume-miscount">Proceed</button></div>
    <div class="opt"><div><div class="lbl">Re-count thoroughly</div><div class="desc">Three handler-hours, and everything else waits.</div></div><button data-resp="recount">3 hr</button></div>
    <div class="opt"><div><div class="lbl">Drain and search</div><div class="desc">The whole day. The client watches the moat empty.</div></div><button data-resp="drain-search">Full day</button></div>
    <div class="opt"><div><div class="lbl">Report to the client now</div><div class="desc">Costs standing immediately. Halves the penalty if it is real.</div></div><button data-resp="report-client">Report</button></div>
  </div>`;
}

// ============ loop ============
function setSpeed(n) {
  ui.speed = n;
  renderTopbar();
}

// The operating day runs 06:00 to 06:00. The night passes unattended; the manager
// arrives at six with a clipboard, which is when the day is planned and paid for.
// ============ close-out ============
function openCloseOut(s) {
  ui.modalOpen = true;
  setSpeed(0);
  $("modal").hidden = false;
  const r = gradeContract(s);

  const progress = loadProgress();
  if (!r.terminated && !progress.completed.includes(s.clientId)) progress.completed.push(s.clientId);
  const prior = progress.grades[s.clientId];
  if (!prior || LETTERS.indexOf(r.letter) < LETTERS.indexOf(prior)) progress.grades[s.clientId] = r.letter;
  saveProgress(progress);
  clearSave();

  // The things that happened and were never discovered. Revealed only now.
  const flags = s.redFlags.length ? `
    <div class="section"><h3>Matters not raised at the time</h3>
      ${s.redFlags.map(f => `<div class="entry serious"><div class="ts">Day ${f.day}</div><div>${esc(f.text)}</div></div>`).join("")}
    </div>` : `<div class="hint" style="margin-top:10px">Nothing occurred that was not written down. This is the best outcome available.</div>`;

  $("modal-body").innerHTML = `
    <h2>${r.terminated ? "Contract terminated" : "Contract close-out"}</h2>
    <div class="sub">${esc(r.client)}</div>
    <pre class="card">${esc(renderReportCard(r))}</pre>
    ${flags}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="primary" id="back-to-contracts">Return to contracts</button>
    </div>`;
  $("back-to-contracts").addEventListener("click", () => openContractSelect());
}

function onMorningBriefing(s) {
  applyBriefingMaintenance(s);
  applyVetVisit(s);
  decayStructures(s);
  resolvePending(s);
  // Silent incidents (an animal leaving via a failed grate) write no record on
  // purpose. Announcing them here would hand the player what the census exists to
  // withhold, so the briefing shows an event only if it actually logged one.
  const logBefore = s.log.length;
  const fired = maybeFireIncident(s);
  ui.overnightIncident = fired && s.log.length > logBefore ? fired : null;
  ui.overnightText = ui.overnightIncident ? s.log[s.log.length - 1].text : "";
  maybeAttemptIntrusion(s);
  tickWeather(s);
  endDay(s);
  if (contractOver(s)) { openCloseOut(s); return; }
  beginDay(s);
  saveGame(s);
  setSpeed(0);
  openBriefing();
}

function frame(now) {
  if (!ui.last) ui.last = now;
  const dt = Math.min(now - ui.last, 250);
  ui.last = now;
  if (ui.speed > 0 && !ui.modalOpen && ui.state && ui.state.status === "running") {
    ui.acc += dt * ui.speed;
    while (ui.acc >= 1000) {              // 1 real second = 1 in-game hour at 1x
      ui.acc -= 1000;
      tickHour(ui.state);
      if (ui.state.hour === 6) { onMorningBriefing(ui.state); break; }
    }
    refreshReadouts();
    if (ui.state.log.length !== ui.logLen) { ui.logLen = ui.state.log.length; renderLog(); }
  }
  render(ui.modalOpen ? 0 : dt * Math.max(ui.speed, 0));
  requestAnimationFrame(frame);
}

// ============ campaign progress ============
// All storage access is guarded: opened from a file:// URL with storage disabled,
// the game degrades to a single session rather than a blank screen.
const PROGRESS_KEY = "moat.progress";

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* storage unavailable */ }
  return { completed: [], grades: {} };
}

function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }
  catch (e) { /* storage unavailable */ }
}

const SAVE_KEY = "moat.save";

function saveGame(s) {
  try {
    // contract is a reference into CLIENTS; rehydrated on load rather than stored.
    const { contract, ...rest } = s;
    localStorage.setItem(SAVE_KEY, JSON.stringify(rest));
  } catch (e) { /* storage unavailable */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    applyClientToState(s);
    return s;
  } catch (e) { return null; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage unavailable */ }
}

function seedFor(clientId) {
  let h = 2166136261;
  for (const ch of clientId) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0) % 100000;
}

function openContractSelect() {
  ui.modalOpen = true;
  ui.state = null;
  setSpeed(0);
  $("modal").hidden = false;
  const progress = loadProgress();
  const cards = CLIENTS.map(c => {
    const unlocked = clientUnlocked(progress, c.id);
    const grade = progress.grades[c.id];
    return `<div class="opt" style="align-items:flex-start">
      <div style="flex:1">
        <div class="lbl">${esc(c.name)}${grade ? ` <span style="color:var(--accent)">— closed at ${grade}</span>` : ""}</div>
        <div class="desc" style="margin:2px 0 4px">${esc(c.site)} · ${c.days} days · ${c.crocCount} animals · ${esc(c.difficulty)}</div>
        <div class="desc">${esc(unlocked ? c.blurb : "Requires completion of the preceding five contracts.")}</div>
      </div>
      <button data-contract="${c.id}" ${unlocked ? "" : "disabled"}>Accept</button>
    </div>`;
  }).join("");

  const saved = loadGame();
  const resume = saved ? `
    <div class="opt" style="border-color:var(--accent)">
      <div><div class="lbl">Resume — ${esc(getClient(saved.clientId).site)}</div>
      <div class="desc">Day ${saved.day} of ${saved.contractDays}.</div></div>
      <button id="resume-btn">Resume</button>
    </div>` : "";

  $("modal-body").innerHTML = `
    <h2>Contracts</h2>
    <div class="sub">A fence merely delays an intruder. A moat makes a statement. A statement requires paperwork.</div>
    ${resume}
    ${cards}
    <div class="section" style="margin-top:12px">
      <div class="ctrl-head"><span>Seed</span><span class="val" id="seed-val"></span></div>
      <div class="hint">Runs are reproducible. The seed is printed on the close-out report.</div>
      <input id="seed-input" type="text" style="width:100%;margin-top:5px;background:#1f232a;border:1px solid var(--line);color:var(--fg);font:inherit;padding:4px 6px">
    </div>`;

  if (saved) $("resume-btn").addEventListener("click", () => {
    ui.state = saved;
    ui.censusObs = null; ui.overnightIncident = null; ui.logLen = 0;
    renderControls();
    renderLog();
    openBriefing();
  });

  $("modal-body").querySelectorAll("[data-contract]").forEach(b => b.addEventListener("click", () => {
    const raw = $("seed-input").value.trim();
    const seed = raw === "" ? seedFor(b.dataset.contract) : (parseInt(raw, 10) || seedFor(b.dataset.contract));
    startContract(b.dataset.contract, seed);
  }));
}

function startContract(clientId, seed) {
  ui.state = createState({ seed, clientId });
  ui.censusObs = null;
  ui.overnightIncident = null;
  ui.logLen = 0;
  logEvent(ui.state, `Contract commenced. ${getClient(clientId).site}. ${ui.state.crocs.length} animals on site against a licensed figure of ${ui.state.licensedHeadcount}.`, "info");
  beginDay(ui.state);
  renderControls();
  renderLog();
  openBriefing();
}

$("speed-controls").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) setSpeed(Number(b.dataset.speed));
});

openContractSelect();
requestAnimationFrame(frame);
</script>
</body>
