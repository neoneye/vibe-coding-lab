<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOAT</title>
<style>
:root {
  --bg: #15171b;
  --panel: #1b1e23;
  --panel-2: #21252b;
  --line: #2e343c;
  --fg: #d5d1c6;
  --muted: #857f72;
  --accent: #c8a45c;
  --alert: #b4544a;
  --good: #6f8f6a;
  --water: #2c4a4e;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit; color: var(--fg); background: #252a31;
  border: 1px solid var(--line); padding: 4px 9px; cursor: pointer;
}
button:hover:not(:disabled) { background: #2f353e; border-color: #414a55; }
button:disabled { opacity: 0.35; cursor: default; }
button.primary { background: #3a4a38; border-color: #4d6249; }
button.primary:hover { background: #46583f; }
h1, h2, h3 { margin: 0; font-weight: 600; }

#app { display: grid; grid-template-columns: 290px 1fr 320px; grid-template-rows: auto 1fr; height: 100vh; }
#topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 7px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
#topbar .brand { font-weight: 700; letter-spacing: 0.22em; color: var(--accent); }
#topbar .tagline { color: var(--muted); font-size: 11px; font-style: italic; }
#topbar .stat { white-space: nowrap; }
#topbar .stat b { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; }
#speed-controls { margin-left: auto; display: flex; gap: 4px; }
#speed-controls button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }

/* min-height:0 is load-bearing: without it the grid rows size to content and a long
   log stretches the whole layout, taking the canvas with it. */
#controls, #log, #view { min-height: 0; min-width: 0; }
#controls, #log { overflow-y: auto; background: var(--panel); }
#controls { border-right: 1px solid var(--line); padding: 10px 12px; }
#log { border-left: 1px solid var(--line); padding: 10px 12px; }
#view { display: flex; align-items: stretch; justify-content: center; padding: 10px; overflow: hidden; }
#moat { flex: 1 1 auto; display: block; }

.section { margin-bottom: 15px; }
.section > h3 {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.13em;
  color: var(--muted); border-bottom: 1px solid var(--line);
  padding-bottom: 3px; margin-bottom: 7px;
}
.ctrl { margin-bottom: 9px; }
.ctrl-head { display: flex; justify-content: space-between; gap: 8px; }
.ctrl-head .val { color: var(--accent); }
.ctrl input[type=range] { width: 100%; margin: 2px 0 0; accent-color: var(--accent); }
.hint { color: var(--muted); font-size: 11px; line-height: 1.4; }

.readout { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
.readout .k { color: var(--muted); }
.bar { height: 5px; background: #262b32; margin-top: 3px; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.band-torpid { color: #6d8fa8; } .band-low { color: #8aa07e; }
.band-optimal { color: var(--good); } .band-aggressive { color: var(--accent); }
.band-frenzied { color: var(--alert); }

.entry { padding: 5px 0; border-bottom: 1px solid #23272d; }
.entry .ts { color: var(--muted); font-size: 11px; }
.entry.minor .ts { color: var(--accent); }
.entry.serious { border-left: 2px solid var(--alert); padding-left: 7px; }
.entry.serious .ts, .entry.fatal .ts { color: var(--alert); }
.entry.fatal { border-left: 2px solid var(--alert); padding-left: 7px; background: #2a1e1e; }
.entry.census { border-left: 2px solid #4a6270; padding-left: 7px; }
.entry.maintenance .ts { color: #7d8a95; }
.entry.day { border-bottom: 1px solid var(--line); opacity: 0.55; }
.entry.day > div:last-child { font-size: 11px; }

#modal {
  position: fixed; inset: 0; background: rgba(10, 11, 13, 0.86);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
}
#modal[hidden] { display: none; }
#modal-body {
  background: var(--panel); border: 1px solid var(--line); padding: 18px 20px;
  max-width: 720px; width: 100%; max-height: 92vh; overflow-y: auto;
}
#modal-body h2 { font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
#modal-body .sub { color: var(--muted); margin-bottom: 14px; }
.opt {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border: 1px solid var(--line); padding: 7px 10px; margin-bottom: 6px; background: #1f232a;
}
.opt .lbl { font-weight: 600; }
.opt .desc { color: var(--muted); font-size: 11px; }
.opt .cost { color: var(--accent); white-space: nowrap; }
.opt.chosen { border-color: var(--accent); background: #262a24; }
.alloc { display: flex; align-items: center; gap: 5px; }
.alloc .n { min-width: 34px; text-align: right; color: var(--accent); }
pre.card {
  background: #14161a; border: 1px solid var(--line); padding: 14px;
  white-space: pre; overflow-x: auto; font-size: 13px; line-height: 1.6;
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <span class="brand">MOAT</span>
    <span class="tagline">A fence merely delays an intruder.</span>
    <span class="stat"><b>Time</b> <span id="clock">—</span></span>
    <span class="stat"><b>Activity</b> <span id="activity-readout">—</span></span>
    <span class="stat"><b>Census</b> <span id="census-readout">—</span></span>
    <span class="stat"><b>Hours</b> <span id="hours-readout">—</span></span>
    <span id="speed-controls">
      <button data-speed="0">Pause</button>
      <button data-speed="1">1&times;</button>
      <button data-speed="4">4&times;</button>
      <button data-speed="16">16&times;</button>
    </span>
  </header>
  <aside id="controls"></aside>
  <main id="view"><canvas id="moat"></canvas></main>
  <aside id="log"></aside>
  <div id="modal" hidden><div id="modal-body"></div></div>
</div>
<script id="shared-code">
"use strict";
// ============ test registry ============
const MoatTests = {
  tests: [],
  add(name, fn) { this.tests.push({ name, fn }); },
  run() {
    let failed = 0;
    for (const t of this.tests) {
      try { t.fn(); console.log(`PASS ${t.name}`); }
      catch (e) { failed++; console.error(`FAIL ${t.name}: ${e.message}`); }
    }
    if (failed === 0) console.log(`ALL ${this.tests.length} TESTS PASSED`);
    return failed === 0;
  },
};
function assert(cond, msg) { if (!cond) throw new Error(msg || "assert failed"); }
function assertEq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error(`${msg || "assertEq"}: ${sa} !== ${sb}`);
}
function assertClose(a, b, eps, msg) {
  if (Math.abs(a - b) > eps) throw new Error(`${msg || "assertClose"}: ${a} vs ${b} (eps ${eps})`);
}

// ============ seeded RNG (mulberry32 on state) ============
function rngNext(state) {
  let t = (state.rngState = (state.rngState + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(state, n) { return Math.floor(rngNext(state) * n); }

// ============ tests: rng ============
MoatTests.add("rng is deterministic for a given seed", () => {
  const a = { rngState: 12345 }, b = { rngState: 12345 };
  const seqA = [0, 0, 0, 0, 0].map(() => rngNext(a));
  const seqB = [0, 0, 0, 0, 0].map(() => rngNext(b));
  assertEq(seqA, seqB, "same seed must give same sequence");
});
MoatTests.add("rng differs across seeds and stays in range", () => {
  const a = { rngState: 1 }, b = { rngState: 2 };
  assert(rngNext(a) !== rngNext(b), "different seeds should diverge");
  const s = { rngState: 99 };
  for (let i = 0; i < 500; i++) {
    const v = rngNext(s);
    assert(v >= 0 && v < 1, `rngNext out of range: ${v}`);
    const k = rngInt(s, 7);
    assert(Number.isInteger(k) && k >= 0 && k < 7, `rngInt out of range: ${k}`);
  }
});

// ============ thermal response and the torpor dial ============
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function clamp01(v) { return clamp(v, 0, 1); }
function lerp(a, b, t) { return a + (b - a) * t; }

// Ectotherm response curve. Dead below 16 C, plateau 30-34 C, heat stress above 35 C.
function tempResponse(effTemp) {
  if (effTemp <= 16) return 0;
  if (effTemp < 30) return clamp01((effTemp - 16) / 14);
  if (effTemp <= 34) return 1;
  return clamp01(lerp(1, 0.25, (effTemp - 34) / 8));
}

// Crocodiles are crepuscular/nocturnal: quiet at midday, active at dusk and after dark.
function dielFactor(hour) {
  const h = ((hour % 24) + 24) % 24;
  if (h >= 10 && h < 16) return 0.78;          // midday lull
  if (h >= 19 || h < 2) return 1.18;           // dusk into night
  if (h >= 4 && h < 8) return 1.1;             // dawn
  return 0.95;
}

function computeActivity({ waterTemp, baskingAccess, hunger, hour, seasonFactor, health }) {
  // Basking lets an animal run warmer than the water it sits in.
  const effTemp = waterTemp + 4.5 * clamp01(baskingAccess);
  const thermal = tempResponse(effTemp);
  const appetite = 0.6 + 0.55 * clamp01(hunger);   // hungry animals are alert
  const vigour = 0.45 + 0.55 * clamp01(health);
  // Gain trimmed so the frenzied band is reached only by genuine extremes rather
  // than by any warm hungry evening, which otherwise saturates the top of the range.
  const raw = 82 * thermal * appetite * dielFactor(hour) * clamp(seasonFactor, 0.5, 1.2) * vigour;
  return clamp(Math.round(raw), 0, 100);
}

function activityBand(activity) {
  if (activity < 25) return "torpid";
  if (activity < 45) return "low";
  if (activity < 70) return "optimal";
  if (activity < 90) return "aggressive";
  return "frenzied";
}

const BAND_LABEL = {
  torpid: "Torpid", low: "Low", optimal: "Optimal", aggressive: "Aggressive", frenzied: "Frenzied",
};

// ============ tests: torpor dial ============
MoatTests.add("activityBand maps the spec's ranges", () => {
  assertEq(activityBand(0), "torpid");
  assertEq(activityBand(24), "torpid");
  assertEq(activityBand(25), "low");
  assertEq(activityBand(44), "low");
  assertEq(activityBand(45), "optimal");
  assertEq(activityBand(69), "optimal");
  assertEq(activityBand(70), "aggressive");
  assertEq(activityBand(89), "aggressive");
  assertEq(activityBand(90), "frenzied");
  assertEq(activityBand(100), "frenzied");
});

MoatTests.add("cold water makes crocodiles torpid", () => {
  const a = computeActivity({ waterTemp: 14, baskingAccess: 0, hunger: 1, hour: 20, seasonFactor: 0.85, health: 1 });
  assertEq(activityBand(a), "torpid", `expected torpid, got ${a}`);
});

MoatTests.add("warm water with moderate hunger reaches the optimal band", () => {
  const a = computeActivity({ waterTemp: 29, baskingAccess: 0.6, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
  assertEq(activityBand(a), "optimal", `expected optimal, got ${a}`);
});

MoatTests.add("warm, hungry and nocturnal pushes past optimal", () => {
  const warmHungryNight = computeActivity({ waterTemp: 31, baskingAccess: 0.8, hunger: 1, hour: 21, seasonFactor: 1, health: 1 });
  assert(warmHungryNight >= 70, `expected aggressive or above, got ${warmHungryNight}`);
});

MoatTests.add("activity rises monotonically with water temperature up to the optimum", () => {
  let prev = -1;
  for (let t = 14; t <= 30; t++) {
    const a = computeActivity({ waterTemp: t, baskingAccess: 0.5, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
    assert(a >= prev, `activity dipped at ${t} degrees: ${a} < ${prev}`);
    prev = a;
  }
});

MoatTests.add("heat stress above 35 degrees reduces activity", () => {
  const opt = computeActivity({ waterTemp: 32, baskingAccess: 0.5, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
  const hot = computeActivity({ waterTemp: 40, baskingAccess: 0.5, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
  assert(hot < opt, `overheated animals should be less active: ${hot} vs ${opt}`);
});

MoatTests.add("hunger raises activity and feeding lowers it", () => {
  const base = { waterTemp: 29, baskingAccess: 0.5, hour: 12, seasonFactor: 1, health: 1 };
  const hungry = computeActivity({ ...base, hunger: 1 });
  const fed = computeActivity({ ...base, hunger: 0 });
  assert(hungry > fed, `hungry animals must be more active: ${hungry} vs ${fed}`);
});

MoatTests.add("poor health suppresses activity", () => {
  const base = { waterTemp: 29, baskingAccess: 0.5, hunger: 0.6, hour: 12, seasonFactor: 1 };
  assert(computeActivity({ ...base, health: 0.3 }) < computeActivity({ ...base, health: 1 }), "sick animals must be less active");
});

MoatTests.add("crocodiles are crepuscular: dusk beats midday", () => {
  assert(dielFactor(20) > dielFactor(12), "dusk should exceed midday");
  assert(dielFactor(5) > dielFactor(12), "dawn should exceed midday");
  for (let h = 0; h < 24; h++) {
    const d = dielFactor(h);
    assert(d >= 0.7 && d <= 1.2, `dielFactor(${h}) out of range: ${d}`);
  }
});

MoatTests.add("activity is always clamped to 0..100", () => {
  const extremes = [
    { waterTemp: -5, baskingAccess: 0, hunger: 0, hour: 3, seasonFactor: 0.85, health: 0 },
    { waterTemp: 60, baskingAccess: 1, hunger: 1, hour: 21, seasonFactor: 1, health: 1 },
    { waterTemp: 33, baskingAccess: 1, hunger: 1, hour: 20, seasonFactor: 1, health: 1 },
  ];
  for (const e of extremes) {
    const a = computeActivity(e);
    assert(a >= 0 && a <= 100, `activity out of range: ${a}`);
  }
});

// ============ constants ============
const CROC_NAMES = [
  "Ambrose", "Beatrix", "Cornelius", "Dagmar", "Edwina", "Ferdinand",
  "Griselda", "Horace", "Ingeborg", "Jasper", "Klaus", "Lavinia",
  "Mortimer", "Nerissa", "Ozymandias", "Perpetua", "Quintus", "Rosalind",
  "Sigmund", "Theodora", "Ulric", "Vespasia", "Wilhelm", "Xanthe",
];
const HOURS_PER_DAY = 24;

// ============ state construction ============
function createState({ seed, clientId, crocCount }) {
  const state = {
    seed, rngState: seed >>> 0, clientId,
    day: 1, hour: 6, contractDays: 40,
    crocs: [], licensedHeadcount: crocCount,
    facility: {
      heaterSetpoint: 26, shadeCoverage: 0.4, waterDepth: 2.0,
      filtration: 0.6, baskingPlatforms: Math.ceil(crocCount * 0.6),
      feedIntervalDays: 5, feedVolume: 1.0,
    },
    env: {
      baseAmbient: 24, ambient: 24, waterTemp: 24, turbidity: 0.45, ammonia: 0.1,
      waterLevel: 0.55, weather: "clear", weatherDaysLeft: 0, powered: true,
    },
    staff: { handlers: 3, vet: 0.5, guards: 2, pr: 0, fatigue: 0.1 },
    hours: { budget: 0, spent: 0, allocations: {} },
    structures: [], money: 50000, satisfaction: 70, activity: 0,
    lastFedDay: 0, feedTimesLog: [],
    log: [], redFlags: [], pending: [],
    ledger: {
      minor: 0, serious: 0, fatal: 0, breaches: 0, breachesSuccessful: 0,
      welfareFindings: 0, welfareCritical: 0, lostAnimals: 0, fatalities: 0,
    },
    status: "running",
  };
  for (let i = 0; i < crocCount; i++) {
    state.crocs.push({
      id: i + 1,
      name: CROC_NAMES[i % CROC_NAMES.length] + (i >= CROC_NAMES.length ? " II" : ""),
      sex: rngNext(state) < 0.45 ? "f" : "m",
      length: 2.4 + rngNext(state) * 2.2,
      health: 0.88 + rngNext(state) * 0.12,
      hunger: 0.25 + rngNext(state) * 0.2,
      bodyTemp: 24, stress: 0.1,
      state: "submerged", present: true,
      x: 0.05 + rngNext(state) * 0.9, y: 0.05 + rngNext(state) * 0.9,
    });
  }
  state.structures = createStructures(state);
  state.env.ambient = ambientTemp(state);
  state.env.waterTemp = waterTempFor(state);
  recomputeActivity(state);
  return state;
}

function logEvent(state, text, kind) {
  state.log.push({ day: state.day, hour: state.hour, text, kind: kind || "info" });
  if (state.log.length > 400) state.log.shift();
}

// ============ environment ============
function ambientTemp(state) {
  const seasonal = Math.sin(((state.day % 360) / 360) * Math.PI * 2) * 6;
  const daily = Math.sin(((state.hour - 9) / 24) * Math.PI * 2) * 5;
  const weatherOffset = { clear: 0, rain: -3, storm: -5, coldsnap: -14, heat: 9 }[state.env.weather] || 0;
  const base = state.env.baseAmbient !== undefined ? state.env.baseAmbient : 24;
  return base + seasonal + daily + weatherOffset;
}

// Heaters only add heat, and only while there is power to run them.
function waterTempFor(state) {
  const air = state.env.ambient;
  const set = state.facility.heaterSetpoint;
  if (set <= air || !state.env.powered) return air;
  return air + (set - air) * 0.75;
}

function baskingAccessFor(state) {
  const wanting = state.crocs.filter(c => c.present).length;
  if (wanting === 0) return 1;
  const capacity = state.facility.baskingPlatforms;
  const shadePenalty = clamp01(state.facility.shadeCoverage) * 0.25;
  return clamp01(capacity / wanting) * (1 - shadePenalty);
}

function meanOf(state, key) {
  const present = state.crocs.filter(c => c.present);
  if (present.length === 0) return 0;
  return present.reduce((sum, c) => sum + c[key], 0) / present.length;
}
function meanHunger(state) { return meanOf(state, "hunger"); }
function meanHealth(state) { return meanOf(state, "health"); }

function seasonFactorFor(state) {
  return state.env.ambient < 18 ? 0.85 : 1;
}

function recomputeActivity(state) {
  state.activity = computeActivity({
    waterTemp: state.env.waterTemp,
    baskingAccess: baskingAccessFor(state),
    hunger: meanHunger(state),
    hour: state.hour,
    seasonFactor: seasonFactorFor(state),
    health: meanHealth(state),
  });
  return state.activity;
}

// ============ hourly tick ============
function tickHour(state) {
  state.hour++;
  if (state.hour >= HOURS_PER_DAY) { state.hour = 0; state.day++; }

  state.env.ambient = ambientTemp(state);
  state.env.waterTemp = waterTempFor(state);

  // Water quality: waste in, filtration out. Calibrated so the default filtration
  // setting exactly holds twelve animals — overstocking or a cut budget is what breaks it.
  const load = state.crocs.filter(c => c.present).length * 0.0011;
  const cleared = state.facility.filtration * (state.env.powered ? 0.022 : 0);
  state.env.ammonia = clamp01(state.env.ammonia + load - cleared);
  // Turbidity tracks ammonia and settles slowly toward what filtration allows.
  const targetTurbidity = clamp01(0.75 - state.facility.filtration * 0.55 + state.env.ammonia * 0.3);
  state.env.turbidity += (targetTurbidity - state.env.turbidity) * 0.02;

  updateCrocs(state);
  recomputeActivity(state);
}

function updateCrocs(state) {
  const feedable = state.env.waterTemp >= 20;
  for (const c of state.crocs) {
    if (!c.present) continue;
    c.bodyTemp += (state.env.waterTemp - c.bodyTemp) * 0.12;
    // Metabolism runs on temperature: cold animals barely burn anything.
    const metabolic = feedable ? 0.0032 * clamp01((state.env.waterTemp - 18) / 14) : 0.0002;
    c.hunger = clamp01(c.hunger + metabolic);

    // Health pressures: ammonia, starvation, crowding stress, cold.
    let drift = 0.0004;                                   // baseline recovery
    if (state.env.ammonia > 0.5) drift -= (state.env.ammonia - 0.5) * 0.0035;
    if (c.hunger > 0.85) drift -= (c.hunger - 0.85) * 0.006;
    if (state.env.waterTemp < 18) drift -= (18 - state.env.waterTemp) * 0.0006;
    if (c.stress > 0.6) drift -= (c.stress - 0.6) * 0.002;
    c.health = clamp01(c.health + drift);

    const crowding = clamp01(1 - baskingAccessFor(state));
    c.stress = clamp01(c.stress + crowding * 0.0015 - 0.0008);

    // Behaviour state, used by the renderer and the census.
    if (state.env.waterTemp < 20) c.state = "submerged";
    else if (state.hour >= 9 && state.hour < 16 && rngNext(state) < 0.35) c.state = "basking";
    else if (rngNext(state) < 0.2) c.state = "hidden";
    else if (state.activity > 55 && rngNext(state) < 0.4) c.state = "patrolling";
    else c.state = "submerged";
  }
}

// ============ feeding ============
// Feeding clusters every animal at the north gate for roughly forty minutes, during
// which the rest of the perimeter is unguarded. A regular schedule is a timetable
// the other side can read.
function feedAnimals(state) {
  if (state.env.waterTemp < 20) {
    logEvent(state, "Feed attempted. The animals are too cold to take food. The meat was withdrawn.", "info");
    return false;
  }
  for (const c of state.crocs) {
    if (c.present) c.hunger = clamp01(c.hunger - state.facility.feedVolume * 0.5);
  }
  state.lastFedDay = state.day;
  state.feedTimesLog.push(state.day);
  state.feedWindowUntilHour = state.hour + 1;
  recomputeActivity(state);
  logEvent(state, `Feed completed. ${state.crocs.filter(c => c.present).length} animals at the north gate for approximately forty minutes.`, "info");
  return true;
}

// ============ tests: state and tick ============
MoatTests.add("createState builds the requested number of crocodiles", () => {
  const s = createState({ seed: 7, clientId: "voss", crocCount: 12 });
  assertEq(s.crocs.length, 12);
  assertEq(s.day, 1);
  assertEq(s.hour, 6);
  assert(s.crocs.every(c => c.present), "all animals start present");
  assert(s.crocs.every(c => c.health > 0.8), "animals start healthy");
  assertEq(new Set(s.crocs.map(c => c.id)).size, 12, "ids must be unique");
});

MoatTests.add("createState is reproducible from its seed", () => {
  const a = createState({ seed: 42, clientId: "voss", crocCount: 12 });
  const b = createState({ seed: 42, clientId: "voss", crocCount: 12 });
  assertEq(a.crocs.map(c => c.length), b.crocs.map(c => c.length));
});

MoatTests.add("tickHour advances the clock and rolls over the day", () => {
  const s = createState({ seed: 1, clientId: "voss", crocCount: 12 });
  s.hour = 23;
  const day = s.day;
  tickHour(s);
  assertEq(s.hour, 0);
  assertEq(s.day, day + 1);
});

MoatTests.add("hunger rises while unfed", () => {

// ============ the morning census ============
// The count is an observation, not a state read. It can only ever undercount, so
// "12 of 12" proves everything is present and a short count is always ambiguous.
const CENSUS_DEPTHS = {
  cursory:  { hours: 0.25, label: "Cursory (15 min)",  missMultiplier: 6 },
  standard: { hours: 1,    label: "Standard (1 hr)",   missMultiplier: 1 },
  thorough: { hours: 3,    label: "Thorough (3 hr)",   missMultiplier: 0.15 },
};

function censusAvailable(state, depth) {
  if (depth === "thorough") return state.env.turbidity <= 0.3;
  return Boolean(CENSUS_DEPTHS[depth]);
}

// Probability that a present animal is missed by the observer. Turbidity dominates
// and does so steeply: clear water is nearly reliable, murky water is where a
// headcount stops being a fact. Kept low per animal so that across a full moat a
// short count stays a rare, alarming event rather than daily background noise.
function missChance(state, croc, depth) {
  const d = CENSUS_DEPTHS[depth];
  const water = 0.08 * Math.pow(clamp01(state.env.turbidity), 2.25);
  const concealment = croc.state === "hidden" ? 1 : croc.state === "submerged" ? 0.4 : 0;
  return clamp01(water * d.missMultiplier * (1 + concealment) * (1 + clamp01(state.staff.fatigue)));
}

function runCensus(state, depth) {
  const d = CENSUS_DEPTHS[depth] || CENSUS_DEPTHS.standard;
  state.hours.spent += d.hours;

  const present = state.crocs.filter(c => c.present);
  const missedIds = [];
  for (const c of present) {
    if (rngNext(state) < missChance(state, c, depth)) missedIds.push(c.id);
  }
  const counted = present.length - missedIds.length;
  const expected = state.licensedHeadcount;

  const obs = {
    depth, expected, counted, actualPresent: present.length,
    missedIds, healthFlags: [], kind: "count", low: counted, high: counted,
    short: counted < expected,
  };

  if (depth === "cursory") {
    // Too quick to commit to a number; the observer offers a band around what they saw.
    const spread = 1 + rngInt(state, 2);
    obs.kind = "range";
    obs.low = Math.max(0, counted - spread);
    obs.high = counted + spread;
    obs.short = obs.high < expected;
  }

  if (depth === "thorough") {
    for (const c of present) {
      if (c.health < 0.7) obs.healthFlags.push({ id: c.id, name: c.name, note: "condition below standard" });
      else if (c.hunger > 0.9) obs.healthFlags.push({ id: c.id, name: c.name, note: "has not fed in some time" });
      else if (c.stress > 0.7) obs.healthFlags.push({ id: c.id, name: c.name, note: "showing stress behaviour" });
    }
  }
  return obs;
}

function censusNarrative(state, obs) {
  const clarity = state.env.turbidity > 0.6 ? " Water clarity poor." : "";
  if (obs.kind === "range") {
    return `${obs.low}–${obs.high} animals observed. The count was not held long enough to be worth much.${clarity}`;
  }
  if (!obs.short) {
    const flags = obs.healthFlags.length
      ? ` ${obs.healthFlags.length} animal(s) flagged for review.`
      : "";
    return `${obs.counted} of ${obs.expected} confirmed.${flags}${clarity}`;
  }
  return `${obs.counted} of ${obs.expected} — ${obs.expected - obs.counted} unaccounted.${clarity}`;
}

// ============ handler hours: the day's currency ============
// One pool funds the census, inspection, maintenance, the vet and the airspace
// watch. A thorough count is three hours not spent looking at culvert 4.
const BRIEFING_ACTIONS = [
  { id: "inspect-structure", label: "Inspect a structure", hours: 1.5,
    description: "Reveals true integrity for one perimeter element." },
  { id: "grate-maintenance", label: "Grate and culvert maintenance", hours: 2,
    description: "Restores culvert integrity. Nobody wants to spend the morning on it." },
  { id: "bank-repair", label: "Bank and fence repair", hours: 2.5,
    description: "Restores bank angle and fence line. Silt builds a ramp if left." },
  { id: "vet-visit", label: "Veterinary call-out", hours: 2,
    description: "Treats the worst-affected animal. Costs money as well as hours." },
  { id: "airspace-watch", label: "Airspace watch", hours: 1,
    description: "Someone looks up. Nobody budgets for this." },
  { id: "staff-rest", label: "Rostered rest", hours: 1.5,
    description: "Hours spent not working. Reduces fatigue, which is how incidents start." },
];

function dailyHandlerHours(state) {
  const raw = state.staff.handlers * 6;
  return Math.round(raw * (1 - clamp01(state.staff.fatigue) * 0.45) * 4) / 4;
}

function hoursRemaining(state) {
  return Math.round((state.hours.budget - state.hours.spent) * 100) / 100;
}

function beginDay(state) {
  state.hours.budget = dailyHandlerHours(state);
  state.hours.spent = 0;
  state.hours.allocations = {};
  logEvent(state, `${state.hours.budget} handler-hours rostered.`, "day");
}

function allocateHours(state, actionId, amount) {
  const action = BRIEFING_ACTIONS.find(a => a.id === actionId);
  if (!action) return false;
  const cost = amount === undefined ? action.hours : amount;
  if (cost > hoursRemaining(state) + 1e-9) return false;
  state.hours.spent += cost;
  state.hours.allocations[actionId] = (state.hours.allocations[actionId] || 0) + cost;
  return true;
}

function endDay(state) {
  const load = state.hours.budget > 0 ? clamp01(state.hours.spent / state.hours.budget) : 0;
  const rest = (state.hours.allocations["staff-rest"] || 0) * 0.04;
  state.staff.fatigue = clamp01(state.staff.fatigue + load * 0.12 - 0.07 - rest);
}

// ============ containment structures ============
// The perimeter is not the moat. It is everything the moat touches, and every part
// of it decays behind a value the player cannot see without spending hours on it.
// Rates are set so that an element left alone crosses the danger threshold around
// day 25-30 of a contract. Slower than this and neglect never costs anything.
const STRUCTURE_DEFS = [
  { id: "overflow-drain", name: "Overflow and storm drains", decayPerDay: 0.018, escapeRoute: true },
  { id: "culvert-grate",  name: "Culvert grates",            decayPerDay: 0.024, escapeRoute: true },
  { id: "service-bridge", name: "Service bridge",            decayPerDay: 0.012, escapeRoute: false },
  { id: "bank-fence",     name: "Bank angle and fence line", decayPerDay: 0.020, escapeRoute: true },
];

function createStructures(state) {
  return STRUCTURE_DEFS.map(def => ({
    id: def.id, name: def.name,
    integrity: 0.9 + rngNext(state) * 0.1,
    knownIntegrity: null,
    lastInspectedDay: 0,
  }));
}

function decayStructures(state) {
  const weather = state.env.weather;
  for (const st of state.structures) {
    const def = STRUCTURE_DEFS.find(d => d.id === st.id);
    let rate = def.decayPerDay * (0.6 + rngNext(state) * 0.8);
    if (weather === "storm") rate *= st.id === "overflow-drain" ? 3.5 : 1.8;
    else if (weather === "rain") rate *= st.id === "overflow-drain" ? 1.8 : 1.2;
    // Silt builds a ramp: dirty water degrades the bank faster.
    if (st.id === "bank-fence") rate *= 1 + state.env.ammonia;
    st.integrity = clamp01(st.integrity - rate);
  }
}

function inspectStructure(state, id) {
  const st = state.structures.find(x => x.id === id);
  if (!st) return 0;
  st.knownIntegrity = st.integrity;
  st.lastInspectedDay = state.day;
  logEvent(state, `${st.name} inspected. Integrity ${(st.integrity * 100).toFixed(0)} per cent.`, "maintenance");
  return st.integrity;
}

function repairStructure(state, id, amount) {
  const st = state.structures.find(x => x.id === id);
  if (!st) return;
  st.integrity = clamp01(st.integrity + amount);
  st.knownIntegrity = st.integrity;
}

function weakestStructure(state) {
  return state.structures.reduce((a, b) => (a.integrity <= b.integrity ? a : b));
}

function applyBriefingMaintenance(state) {
  const alloc = state.hours.allocations;
  if (alloc["inspect-structure"]) {
    // Inspect whatever has gone longest without being looked at.
    const target = state.structures.reduce((a, b) => (a.lastInspectedDay <= b.lastInspectedDay ? a : b));
    inspectStructure(state, target.id);
  }
  if (alloc["grate-maintenance"]) {
    repairStructure(state, "culvert-grate", 0.35);
    repairStructure(state, "overflow-drain", 0.15);
    logEvent(state, "Replaced grate, culvert 4 (north). Previous grate found displaced, not damaged. No animals unaccounted for at time of inspection. Recommend reviewing what displaced it.", "maintenance");
  }
  if (alloc["bank-repair"]) {
    repairStructure(state, "bank-fence", 0.4);
    repairStructure(state, "service-bridge", 0.2);
  }
}

// ============ incident engine ============
// Incidents fire from a weighted table conditioned on current state. No incident is
// random noise: every weight is gated on something the player did or failed to do.
function addRedFlag(state, text) {
  state.redFlags.push({ day: state.day, text });
}

function setWeather(state, weather, days) {
  state.env.weather = weather;
  state.env.weatherDaysLeft = days;
}

const INCIDENTS = [
  {
    id: "cold-snap", cooldown: 12, category: "environmental",
    title: "Cold snap forecast for the next three days",
    weight: (s) => (s.env.ambient < 22 && s.env.weather !== "coldsnap" ? 3 : 0.5),
    apply: (s) => {
      setWeather(s, "coldsnap", 3);
      logEvent(s, "Cold snap forecast. Three days. The animals will stop moving and the moat will stop working at the same time.", "minor");
      s.ledger.minor++;
    },
  },
  {
    id: "power-cut", cooldown: 18, category: "environmental",
    title: "Supply failure at the site transformer",
    weight: (s) => (s.facility.heaterSetpoint > 15 || s.facility.filtration > 0.3 ? 2 : 0.4),
    apply: (s) => {
      s.env.powered = false;
      s.pending.push({ day: s.day + 2, kind: "power-restored" });
      logEvent(s, "Supply failure at the site transformer. Heaters and pumps are offline. Contractor attending within forty-eight hours.", "serious");
      s.ledger.serious++;
    },
  },
  {
    id: "heavy-rain", cooldown: 5, category: "environmental",
    title: "Heavy rain overnight",
    weight: (s) => (s.env.weather === "rain" || s.env.weather === "storm" ? 3 : 1.5),
    apply: (s) => {
      setWeather(s, "storm", 2);
      const drain = s.structures.find(st => st.id === "overflow-drain");
      const rise = 0.12 + (1 - drain.integrity) * 0.25;
      s.env.waterLevel = clamp01(s.env.waterLevel + rise);
      logEvent(s, `Heavy rain overnight. Water line up. Freeboard to the coping stone now ${((1 - s.env.waterLevel) * 100).toFixed(0)} per cent of nominal.`, "minor");
      s.ledger.minor++;
    },
  },
  {
    id: "algae-bloom", cooldown: 10, category: "environmental",
    title: "Filter media clogged, bloom developing",
    weight: (s) => (s.facility.filtration < 0.4 || s.env.ammonia > 0.5 ? 2.5 : 0),
    apply: (s) => {
      s.env.ammonia = clamp01(s.env.ammonia + 0.25);
      s.env.turbidity = clamp01(s.env.turbidity + 0.3);
      s.pending.push({ day: s.day + 4, kind: "bloom-worsens" });
      logEvent(s, "Filter media clogged. Bloom developing. Four days before this becomes an inspector's finding.", "minor");
      s.ledger.minor++;
    },
  },
  {
    id: "territorial-fight", cooldown: 7, category: "animal",
    title: "Territorial dispute at the basking platforms",
    weight: (s) => {
      const males = s.crocs.filter(c => c.present && c.sex === "m").length;
      if (males < 2) return 0;
      const crowding = 1 - baskingAccessFor(s);
      return crowding > 0.25 ? crowding * 6 : 0;
    },
    apply: (s) => {
      const present = s.crocs.filter(c => c.present);
      const victim = present[rngInt(s, present.length)];
      victim.health = clamp01(victim.health - 0.28);
      victim.stress = clamp01(victim.stress + 0.35);
      logEvent(s, `Territorial dispute at the platforms. ${victim.name} came off worse. Veterinary attention advised.`, "serious");
      s.ledger.serious++;
      s.ledger.welfareFindings++;
    },
  },
  {
    id: "hunger-strike", cooldown: 12, category: "animal",
    title: "One animal has refused food",
    weight: (s) => (s.crocs.some(c => c.present && c.hunger > 0.7) ? 1.5 : 0),
    apply: (s) => {
      const candidates = s.crocs.filter(c => c.present && c.hunger > 0.7);
      const c = candidates[rngInt(s, candidates.length)];
      logEvent(s, `${c.name} has refused food for three weeks. This is within normal range for the species. It does not look within normal range.`, "info");
    },
  },
  {
    id: "nesting", cooldown: 30, category: "animal",
    title: "A clutch has been laid behind the north planting",
    weight: (s) => {
      const females = s.crocs.filter(c => c.present && c.sex === "f" && c.health > 0.8).length;
      return females >= 1 && s.env.waterTemp > 27 ? 1.2 : 0;
    },
    apply: (s) => {
      const hatchlings = 3 + rngInt(s, 4);
      const startId = Math.max(...s.crocs.map(c => c.id)) + 1;
      for (let i = 0; i < hatchlings; i++) {
        s.crocs.push({
          id: startId + i, name: `Hatchling ${startId + i}`, sex: rngNext(s) < 0.5 ? "f" : "m",
          length: 0.3, health: 0.9, hunger: 0.3, bodyTemp: s.env.waterTemp, stress: 0.1,
          state: "hidden", present: true, x: rngNext(s), y: rngNext(s),
        });
      }
      logEvent(s, `A clutch has hatched behind the north planting. ${hatchlings} animals. The facility is now over its licensed headcount and the permit is annual.`, "serious");
      s.ledger.serious++;
    },
  },
  {
    id: "the-learner", cooldown: 999, category: "animal",
    title: "One animal has learned the feeding schedule",
    weight: (s) => (s.facility.feedIntervalDays <= 6 && s.day > 10 ? 1.8 : 0),
    apply: (s) => {
      s.learnerActive = true;
      const present = s.crocs.filter(c => c.present);
      const c = present[rngInt(s, present.length)];
      logEvent(s, `${c.name} has begun waiting at the feed gate at the same hour each day, whether or not it is a feed day.`, "info");
    },
  },
  {
    id: "escape-via-drain", cooldown: 9, category: "animal",
    title: "Route open at a degraded structure",
    weight: (s) => {
      const routes = s.structures.filter(st => {
        const def = STRUCTURE_DEFS.find(d => d.id === st.id);
        return def.escapeRoute && st.integrity < 0.3;
      });
      if (routes.length === 0) return 0;
      const worst = Math.min(...routes.map(r => r.integrity));
      return (0.3 - worst) * 25;
    },
    apply: (s) => {
      const present = s.crocs.filter(c => c.present);
      if (present.length === 0) return;
      // Smaller animals leave first: a juvenile fits a gap an adult cannot.
      const sorted = [...present].sort((a, b) => a.length - b.length);
      const leaver = sorted[0];
      leaver.present = false;
      s.ledger.lostAnimals++;
      s.escapedIds = s.escapedIds || [];
      s.escapedIds.push(leaver.id);
      s.pending.push({ day: s.day + 2 + rngInt(s, 4), kind: "sighting-reported", crocId: leaver.id });
      // Deliberately silent: the player finds out at the morning census, or does not.
      addRedFlag(s, `${leaver.name} left the facility via a degraded structure on day ${s.day}.`);
    },
  },
];

// A transformer that fails every fortnight is not a facility, it is a farce. Each
// incident sits out a cooldown after firing so the log reads like a year of records.
const DEFAULT_COOLDOWN = 6;

function onCooldown(state, incident) {
  const last = (state.incidentHistory || {})[incident.id];
  if (last === undefined) return false;
  return state.day - last < (incident.cooldown || DEFAULT_COOLDOWN);
}

function incidentWeights(state) {
  const bias = (state.contract && state.contract.incidentBias) || {};
  return INCIDENTS
    .filter(incident => !onCooldown(state, incident))
    .map(incident => ({ incident, weight: incident.weight(state) * (bias[incident.id] || 1) }))
    .filter(w => w.weight > 0);
}

function pickIncident(state) {
  const weights = incidentWeights(state);
  if (weights.length === 0) return null;
  const total = weights.reduce((sum, w) => sum + w.weight, 0);
  let roll = rngNext(state) * total;
  for (const w of weights) {
    roll -= w.weight;
    if (roll <= 0) return w.incident;
  }
  return weights[weights.length - 1].incident;
}

function applyIncident(state, incident) {
  incident.apply(state);
}

function maybeFireIncident(state) {
  // A well-run facility should be quiet. Pressure rises only with neglect, so the
  // log fills up because of the player rather than because of the calendar.
  const pressure = 0.16
    + (1 - meanHealth(state)) * 0.4
    + clamp01(state.staff.fatigue) * 0.3
    + (1 - weakestStructure(state).integrity) * 0.3;
  if (rngNext(state) > clamp01(pressure)) return null;
  const incident = pickIncident(state);
  if (incident) {
    applyIncident(state, incident);
    state.incidentHistory = state.incidentHistory || {};
    state.incidentHistory[incident.id] = state.day;
  }
  return incident;
}

function applyVetVisit(state) {
  if (!state.hours.allocations["vet-visit"]) return;
  const present = state.crocs.filter(c => c.present);
  if (present.length === 0) return;
  const worst = present.reduce((a, b) => (a.health <= b.health ? a : b));
  worst.health = clamp01(worst.health + 0.3);
  worst.stress = clamp01(worst.stress - 0.2);
  state.money -= 1200;
  logEvent(state, `Veterinary call-out. ${worst.name} examined and treated.`, "maintenance");
}

function resolvePending(state) {
  const due = state.pending.filter(p => p.day <= state.day);
  state.pending = state.pending.filter(p => p.day > state.day);
  for (const p of due) {
    if (p.kind === "power-restored") {
      state.env.powered = true;
      logEvent(state, "Supply restored. Pumps and heaters back on line.", "info");
    } else if (p.kind === "bloom-worsens") {
      state.env.ammonia = clamp01(state.env.ammonia + 0.3);
      state.ledger.welfareFindings++;
      logEvent(state, "Water quality has continued to deteriorate. This is now documented.", "serious");
    } else if (p.kind === "sighting-reported") {
      const c = state.crocs.find(x => x.id === p.crocId);
      logEvent(state, `A member of the grounds staff reports seeing an animal outside the perimeter, near the service road. ${c ? c.name : "One animal"} remains unaccounted for.`, "serious");
      state.satisfaction -= 15;
      state.ledger.serious++;
    }
  }
}

function tickWeather(state) {
  if (state.env.weatherDaysLeft > 0) {
    state.env.weatherDaysLeft--;
    if (state.env.weatherDaysLeft === 0) state.env.weather = "clear";
  }
}

// ============ tests: incident engine ============
MoatTests.add("every incident declares the required fields", () => {
  assert(INCIDENTS.length >= 9, `expected at least 9 incidents, got ${INCIDENTS.length}`);
  const seen = new Set();
  for (const inc of INCIDENTS) {
    assert(typeof inc.id === "string" && !seen.has(inc.id), `duplicate or missing id: ${inc.id}`);
    seen.add(inc.id);
    assert(["environmental", "animal", "human", "external"].includes(inc.category), `${inc.id} bad category`);
    assert(typeof inc.title === "string" && inc.title.length > 0, `${inc.id} needs a title`);
    assert(typeof inc.weight === "function", `${inc.id} needs a weight function`);
    assert(typeof inc.apply === "function", `${inc.id} needs an apply function`);
  }
});

MoatTests.add("incident copy stays deadpan", () => {
  for (const inc of INCIDENTS) {
    assert(!/[!]/.test(inc.title), `${inc.id} title uses an exclamation mark`);
  }
});

MoatTests.add("weights are never negative", () => {
  const s = createState({ seed: 1, clientId: "voss", crocCount: 12 });
  for (const inc of INCIDENTS) {
    const w = inc.weight(s);
    assert(w >= 0 && Number.isFinite(w), `${inc.id} produced weight ${w}`);
  }
});

MoatTests.add("no incident is random noise: preconditions gate the weight", () => {
  const s = createState({ seed: 2, clientId: "voss", crocCount: 12 });
  const byId = id => INCIDENTS.find(i => i.id === id);

  // A territorial fight needs males and insufficient basking capacity.
  s.facility.baskingPlatforms = 40;
  assertEq(byId("territorial-fight").weight(s), 0, "ample basking means no fight");
  s.facility.baskingPlatforms = 1;
  assert(byId("territorial-fight").weight(s) > 0, "crowding must make a fight possible");

  // Algae bloom needs poor filtration.
  s.facility.filtration = 1; s.env.ammonia = 0.05;
  assertEq(byId("algae-bloom").weight(s), 0, "clean water does not bloom");
  s.facility.filtration = 0.05; s.env.ammonia = 0.7;
  assert(byId("algae-bloom").weight(s) > 0, "neglected water must bloom");

  // An escape via drain needs a degraded escape route.
  s.structures.forEach(st => { st.integrity = 1; });
  assertEq(byId("escape-via-drain").weight(s), 0, "sound structures do not leak crocodiles");
  s.structures.find(st => st.id === "culvert-grate").integrity = 0.1;
  assert(byId("escape-via-drain").weight(s) > 0, "a failed grate must open a route");
});

MoatTests.add("incidentWeights excludes impossible incidents", () => {
  const s = createState({ seed: 3, clientId: "voss", crocCount: 12 });
  s.structures.forEach(st => { st.integrity = 1; });
  const ids = incidentWeights(s).map(w => w.incident.id);
  assert(!ids.includes("escape-via-drain"), "zero-weight incidents must not be candidates");
});

MoatTests.add("pickIncident is reproducible for a given seed", () => {
  const mk = () => {
    const s = createState({ seed: 77, clientId: "voss", crocCount: 12 });
    s.structures.find(st => st.id === "culvert-grate").integrity = 0.1;
    s.facility.baskingPlatforms = 1;
    return s;
  };
  const a = mk(), b = mk();
  const ra = [0, 0, 0, 0, 0].map(() => { const i = pickIncident(a); return i ? i.id : null; });
  const rb = [0, 0, 0, 0, 0].map(() => { const i = pickIncident(b); return i ? i.id : null; });
  assertEq(ra, rb);
});

MoatTests.add("a cold snap drives the moat torpid", () => {
  const s = createState({ seed: 4, clientId: "voss", crocCount: 12 });
  s.env.baseAmbient = 24; s.facility.heaterSetpoint = 0;
  INCIDENTS.find(i => i.id === "cold-snap").apply(s);
  for (let h = 0; h < 24; h++) tickHour(s);
  assertEq(activityBand(s.activity), "torpid", `expected torpid, got ${s.activity}`);
});

MoatTests.add("a power cut stops heating and filtration together", () => {
  const s = createState({ seed: 5, clientId: "voss", crocCount: 12 });
  s.facility.filtration = 1; s.facility.heaterSetpoint = 30;
  s.env.baseAmbient = 12; s.env.ammonia = 0.2;
  INCIDENTS.find(i => i.id === "power-cut").apply(s);
  const ammoniaBefore = s.env.ammonia;
  for (let h = 0; h < 24; h++) tickHour(s);
  assertEq(s.env.powered, false);
  assert(s.env.waterTemp < 20, `unheated water must fall: ${s.env.waterTemp}`);
  assert(s.env.ammonia > ammoniaBefore, "filtration is off, so quality must degrade");
});

MoatTests.add("heavy rain raises the water level toward the coping stone", () => {
  const s = createState({ seed: 6, clientId: "voss", crocCount: 12 });
  const before = s.env.waterLevel;
  INCIDENTS.find(i => i.id === "heavy-rain").apply(s);
  assert(s.env.waterLevel > before, "rain must raise the water line");
});

MoatTests.add("nesting puts the facility over its licensed headcount", () => {
  const s = createState({ seed: 8, clientId: "voss", crocCount: 12 });
  s.crocs[0].sex = "f"; s.crocs[0].health = 0.95;
  const licensed = s.licensedHeadcount;
  INCIDENTS.find(i => i.id === "nesting").apply(s);
  assert(s.crocs.filter(c => c.present).length > licensed, "a clutch exceeds the permit");
});

MoatTests.add("an escape removes an animal and records it as unaccounted", () => {
  const s = createState({ seed: 9, clientId: "voss", crocCount: 12 });
  s.structures.find(st => st.id === "culvert-grate").integrity = 0.05;
  INCIDENTS.find(i => i.id === "escape-via-drain").apply(s);
  assertEq(s.crocs.filter(c => c.present).length, 11);
  assertEq(s.ledger.lostAnimals, 1);
});

MoatTests.add("an escape is not announced to the player", () => {
  const s = createState({ seed: 10, clientId: "voss", crocCount: 12 });
  s.structures.find(st => st.id === "culvert-grate").integrity = 0.05;
  const logBefore = s.log.length;
  INCIDENTS.find(i => i.id === "escape-via-drain").apply(s);
  assertEq(s.log.length, logBefore, "the player learns this from the census, not a notification");
  assert(s.redFlags.length > 0, "an undiscovered escape is a red flag");
});

MoatTests.add("the vet call-out treats the worst-affected animal", () => {
  const s = createState({ seed: 11, clientId: "voss", crocCount: 12 });
  s.crocs[3].health = 0.25;
  s.hours.allocations = { "vet-visit": 2 };
  applyVetVisit(s);
  assert(s.crocs[3].health > 0.25, "the vet must treat the sickest animal");
});
</script>
<script>
"use strict";
// ============ UI state ============
const ui = {
  state: null, speed: 1, acc: 0, last: 0, modalOpen: false,
  censusObs: null, censusDone: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ============ facility controls ============
const SLIDERS = [
  { key: "heaterSetpoint", label: "Heater setpoint", min: 10, max: 34, step: 1, unit: " °C",
    hint: "Below 20 °C the animals stop feeding and the moat stops working." },
  { key: "shadeCoverage", label: "Shade coverage", min: 0, max: 1, step: 0.05, pct: true,
    hint: "Shade prevents heat stress and keeps animals off the platforms." },
  { key: "waterDepth", label: "Water depth", min: 0.8, max: 4, step: 0.1, unit: " m",
    hint: "Deep water suits the animals. A competent swimmer passes beneath a basking one." },
  { key: "filtration", label: "Filtration", min: 0, max: 1, step: 0.05, pct: true,
    hint: "Clear water is countable and expensive. Murky water conceals and comforts." },
  { key: "baskingPlatforms", label: "Basking platforms", min: 0, max: 40, step: 1,
    hint: "Capacity-limited. Animals compete for spots, and losers fight." },
  { key: "feedIntervalDays", label: "Feed interval", min: 1, max: 14, step: 1, unit: " d",
    hint: "A regular schedule is a timetable. An irregular one is a welfare penalty." },
  { key: "feedVolume", label: "Feed volume", min: 0.4, max: 1.6, step: 0.1,
    hint: "Well fed is placid and undefended. Hungry is alert and dangerous." },
];

function sliderValue(sp, v) {
  if (sp.pct) return Math.round(v * 100) + "%";
  return (sp.step < 1 ? v.toFixed(1) : String(Math.round(v))) + (sp.unit || "");
}

function renderControls() {
  const s = ui.state;
  const box = $("controls");
  if (!s) { box.innerHTML = ""; return; }

  const rows = SLIDERS.map(sp => `
    <div class="ctrl">
      <div class="ctrl-head"><span>${sp.label}</span><span class="val" data-val="${sp.key}">${sliderValue(sp, s.facility[sp.key])}</span></div>
      <input type="range" data-key="${sp.key}" min="${sp.min}" max="${sp.max}" step="${sp.step}" value="${s.facility[sp.key]}">
      <div class="hint">${sp.hint}</div>
    </div>`).join("");

  const ro = (k, id) => `<div class="readout"><span class="k">${k}</span><span id="${id}">—</span></div>`;
  box.innerHTML = `
    <div class="section"><h3>Facility</h3>${rows}</div>
    <div class="section"><h3>Feeding</h3>
      ${ro("Last feed", "ro-feed")}
      ${ro("Mean hunger", "ro-hunger")}
      <button id="feed-btn" style="width:100%;margin-top:6px">Feed now</button>
      <div class="hint" style="margin-top:4px">Every animal clusters at the north gate for forty minutes.</div>
    </div>
    <div class="section"><h3>Water &amp; air</h3>
      ${ro("Ambient", "ro-ambient")}
      ${ro("Water", "ro-water")}
      ${ro("Ammonia", "ro-ammonia")}
      <div class="bar"><i id="ro-ammonia-bar"></i></div>
      ${ro("Turbidity", "ro-turbidity")}
      ${ro("Weather", "ro-weather")}
    </div>
    <div class="section"><h3>Perimeter</h3><div id="ro-structures"></div></div>
    <div class="section"><h3>Staff</h3>
      ${ro("Handlers", "ro-handlers")}
      ${ro("Guards", "ro-guards")}
      ${ro("PR officer", "ro-pr")}
      ${ro("Fatigue", "ro-fatigue")}
      <div class="bar"><i id="ro-fatigue-bar"></i></div>
    </div>
    <div class="section"><h3>Contract</h3>
      ${ro("Day", "ro-day")}
      ${ro("Satisfaction", "ro-sat")}
      ${ro("Animals", "ro-animals")}
    </div>`;

  for (const input of box.querySelectorAll("input[type=range]")) {
    input.addEventListener("input", () => {
      const sp = SLIDERS.find(x => x.key === input.dataset.key);
      s.facility[sp.key] = parseFloat(input.value);
      box.querySelector(`[data-val="${sp.key}"]`).textContent = sliderValue(sp, s.facility[sp.key]);
      s.env.waterTemp = waterTempFor(s);
      recomputeActivity(s);
      renderTopbar();
    });
  }
  const feed = $("feed-btn");
  if (feed) feed.addEventListener("click", () => { feedAnimals(s); refreshReadouts(); renderLog(); });
  refreshReadouts();
}

// Cheap per-tick refresh. Never rebuilds the panel, so a slider survives a drag.
function refreshReadouts() {
  const s = ui.state;
  if (!s || !$("ro-day")) return;
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set("ro-feed", s.lastFedDay === 0 ? "not since handover" : (s.day - s.lastFedDay) + " day(s) ago");
  set("ro-hunger", Math.round(meanHunger(s) * 100) + "%");
  set("ro-ambient", s.env.ambient.toFixed(1) + " °C");
  set("ro-water", s.env.waterTemp.toFixed(1) + " °C");
  set("ro-ammonia", Math.round(s.env.ammonia * 100) + "%");
  set("ro-turbidity", Math.round(s.env.turbidity * 100) + "%");
  set("ro-weather", s.env.weather + (s.env.powered ? "" : " · no power"));
  set("ro-handlers", String(s.staff.handlers));
  set("ro-guards", String(s.staff.guards));
  set("ro-pr", s.staff.pr ? "retained" : "none");
  set("ro-fatigue", Math.round(s.staff.fatigue * 100) + "%");
  set("ro-day", `${s.day} of ${s.contractDays}`);
  set("ro-sat", Math.round(s.satisfaction) + "%");
  set("ro-animals", `${s.crocs.filter(c => c.present).length} present · ${s.licensedHeadcount} licensed`);
  const ab = $("ro-ammonia-bar");
  if (ab) { ab.style.width = (s.env.ammonia * 100) + "%"; ab.style.background = s.env.ammonia > 0.55 ? "var(--alert)" : "var(--accent)"; }
  const fb = $("ro-fatigue-bar");
  if (fb) { fb.style.width = (s.staff.fatigue * 100) + "%"; fb.style.background = s.staff.fatigue > 0.6 ? "var(--alert)" : "var(--accent)"; }
  const st = $("ro-structures");
  if (st) {
    st.innerHTML = (s.structures || []).map(x => {
      const known = x.knownIntegrity;
      const txt = known === null || known === undefined ? "not inspected" : Math.round(known * 100) + "%";
      const cls = known !== null && known !== undefined && known < 0.35 ? ' style="color:var(--alert)"' : "";
      return `<div class="readout"><span class="k">${x.name}</span><span${cls}>${txt}</span></div>`;
    }).join("") || `<div class="hint">No structures surveyed.</div>`;
  }
}

function renderTopbar() {
  const s = ui.state;
  if (!s) return;
  const band = activityBand(s.activity);
  $("clock").textContent = `Day ${s.day} · ${String(s.hour).padStart(2, "0")}:00`;
  $("activity-readout").innerHTML = `<span class="band-${band}">${s.activity} ${BAND_LABEL[band]}</span>`;
  $("census-readout").textContent = ui.censusObs
    ? (ui.censusObs.kind === "range" ? `${ui.censusObs.low}–${ui.censusObs.high} observed` : `${ui.censusObs.counted} of ${ui.censusObs.expected}`)
    : "not yet taken";
  $("hours-readout").textContent = `${hoursRemaining(s)} of ${s.hours.budget}`;
  for (const b of $("speed-controls").children) b.classList.toggle("on", Number(b.dataset.speed) === ui.speed);
}

function renderLog() {
  const s = ui.state;
  if (!s) return;
  $("log").innerHTML = `<div class="section"><h3>Facility log</h3></div>` +
    s.log.slice(-70).reverse().map(e => `
      <div class="entry ${e.kind}">
        <div class="ts">Day ${e.day} · ${String(e.hour).padStart(2, "0")}:${e.kind === "census" ? "14" : "00"}</div>
        <div>${esc(e.text)}</div>
      </div>`).join("");
}

// ============ canvas ============
function fitCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

const TAU = Math.PI * 2;

function render(dt) {
  renderTopbar();
  const s = ui.state;
  if (!s) return;
  const { ctx, w, h } = fitCanvas($("moat"));
  advanceAnimation(s, dt || 0);
  drawMoat(ctx, w, h, s);
}

// Render-only motion. The simulation never reads these, so smoothing the picture
// cannot affect determinism. Torpid animals barely move, which is the clearest
// read on the dial the player gets.
function advanceAnimation(s, dt) {
  const secs = Math.min(dt, 100) / 1000;
  for (const c of s.crocs) {
    if (c.ang === undefined) { c.ang = c.x * TAU; c.rad = c.y; c.platform = null; }
    const speed = c.state === "patrolling" ? 0.055 + (s.activity / 100) * 0.16
      : c.state === "submerged" ? 0.012 + (s.activity / 100) * 0.03 : 0;
    c.ang = (c.ang + speed * secs * (c.id % 2 ? 1 : -1) + TAU) % TAU;
    const targetRad = c.state === "basking" ? 0.08 : c.state === "patrolling" ? 0.5 : c.rad;
    c.rad += (targetRad - c.rad) * Math.min(1, secs * 1.2);
  }
}

// Flat two-tone top-down silhouette: tail about half the total length, tapered
// torso, four short limbs. Naturalistic shading would fight the control-room register.
function crocSprite(ctx, x, y, ang, L, body, back) {
  const W = L * 0.24;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = body;
  // tail
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, 0);
  ctx.lineTo(-L * 0.08, -W * 0.46);
  ctx.lineTo(-L * 0.08, W * 0.46);
  ctx.closePath();
  ctx.fill();
  // limbs
  for (const [lx, ly] of [[0.16, 1], [0.16, -1], [-0.06, 1], [-0.06, -1]]) {
    ctx.beginPath();
    ctx.moveTo(L * lx, ly * W * 0.3);
    ctx.lineTo(L * (lx - 0.09), ly * W * 0.95);
    ctx.lineTo(L * (lx + 0.03), ly * W * 0.9);
    ctx.closePath();
    ctx.fill();
  }
  // torso
  ctx.beginPath();
  ctx.ellipse(L * 0.07, 0, L * 0.27, W * 0.56, 0, 0, TAU);
  ctx.fill();
  // head
  ctx.fillStyle = back;
  ctx.beginPath();
  ctx.moveTo(L * 0.3, -W * 0.36);
  ctx.lineTo(L * 0.53, -W * 0.15);
  ctx.lineTo(L * 0.53, W * 0.15);
  ctx.lineTo(L * 0.3, W * 0.36);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMoat(ctx, w, h, s) {
  const cx = w / 2, cy = h / 2;
  const outer = Math.min(w, h) * 0.43;
  const width = outer * 0.35;
  const inner = outer - width;
  const turb = clamp01(s.env.turbidity);
  const level = clamp01(s.env.waterLevel);

  ctx.clearRect(0, 0, w, h);

  // --- ground and compound ---
  ctx.fillStyle = "#1a1d1f";
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#242826";
  ctx.beginPath(); ctx.arc(cx, cy, outer + width * 0.5, 0, TAU); ctx.fill();

  // --- water (layer 1). Clear teal to opaque brown as turbidity rises. ---
  const wr = outer - width * (1 - level) * 0.12;      // a flood creeps up the coping
  const wi = inner + width * (1 - level) * 0.12;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, wr, 0, TAU);
  ctx.arc(cx, cy, wi, 0, TAU, true);
  ctx.clip();
  ctx.fillStyle = `rgb(${Math.round(38 + turb * 54)}, ${Math.round(78 - turb * 30)}, ${Math.round(82 - turb * 44)})`;
  ctx.fillRect(0, 0, w, h);
  // a few slack surface bands, fainter in murk
  ctx.globalAlpha = 0.06 * (1 - turb * 0.7);
  ctx.strokeStyle = "#cfe6e2";
  for (let r = wi + 6; r < wr; r += 11) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const mid = (wi + wr) / 2;
  const place = (c) => {
    const r = wi + clamp01(c.rad) * (wr - wi);
    return [cx + Math.cos(c.ang) * r, cy + Math.sin(c.ang) * r];
  };
  const sizeOf = (c) => clamp(width * 0.30 * (c.length / 3.4), 7, width * 0.62);

  // --- submerged animals (layer 2). Murky water genuinely hides them. ---
  ctx.globalAlpha = 0.22 + 0.34 * (1 - turb);
  for (const c of s.crocs) {
    if (!c.present || c.state !== "submerged") continue;
    const [x, y] = place(c);
    crocSprite(ctx, x, y, c.ang + Math.PI / 2, sizeOf(c), "#22403c", "#1d3835");
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- banks and structures (layer 3) ---
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#3a4048";                          // coping stone
  ctx.beginPath(); ctx.arc(cx, cy, outer, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, inner, 0, TAU); ctx.stroke();

  // the compound: a secure facility, drawn as a site plan rather than a picture
  ctx.fillStyle = "#2b2f33";
  ctx.beginPath(); ctx.arc(cx, cy, inner - 2, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#383e44"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, inner * 0.86, 0, TAU); ctx.stroke();   // inner wall
  const bw = inner * 0.78, bh = inner * 0.30;
  for (const oy of [-bh * 1.05, bh * 0.15]) {                            // two cell blocks
    ctx.fillStyle = "#33383e";
    ctx.fillRect(cx - bw / 2, cy + oy, bw, bh * 0.8);
    ctx.strokeStyle = "#414850";
    ctx.strokeRect(cx - bw / 2, cy + oy, bw, bh * 0.8);
    ctx.strokeStyle = "#3a4047";                                          // cell divisions
    for (let i = 1; i < 9; i++) {
      const x = cx - bw / 2 + (bw / 9) * i;
      ctx.beginPath(); ctx.moveTo(x, cy + oy); ctx.lineTo(x, cy + oy + bh * 0.8); ctx.stroke();
    }
  }
  ctx.fillStyle = "#5f5a50";
  ctx.font = "9px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.fillText("BLOCK A", cx, cy - bh * 1.05 - 5);
  ctx.fillText("BLOCK B", cx, cy + bh * 0.15 - 5);
  ctx.fillText("EXERCISE YARD", cx, cy + bh * 1.35);

  // basking platforms on the inner bank, capacity-limited
  const platforms = Math.max(0, Math.min(s.facility.baskingPlatforms, 26));
  const platPos = [];
  for (let i = 0; i < platforms; i++) {
    const a = (i / platforms) * TAU + 0.15;
    const r = inner + width * 0.17;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    platPos.push([px, py, a]);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = "#514c40";
    ctx.fillRect(-width * 0.15, -width * 0.07, width * 0.3, width * 0.14);
    ctx.restore();
  }

  // service bridge: has to exist, is the obvious weak point, the client insists it be decorative
  const bridge = (s.structures || []).find(x => x.id === "service-bridge");
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = "#4a4438";
  ctx.fillRect(inner - 4, -width * 0.12, width + 8, width * 0.24);
  ctx.strokeStyle = "#5d5647"; ctx.lineWidth = 1;
  ctx.strokeRect(inner - 4, -width * 0.12, width + 8, width * 0.24);
  ctx.restore();

  // culvert grates at the compass points
  const grate = (s.structures || []).find(x => x.id === "culvert-grate");
  for (let i = 0; i < 4; i++) {
    const a = i * (TAU / 4) + Math.PI / 4;
    const px = cx + Math.cos(a) * (outer + 1), py = cy + Math.sin(a) * (outer + 1);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a);
    ctx.fillStyle = "#3f4650";
    ctx.fillRect(-2, -7, 12, 14);
    ctx.strokeStyle = "#585f6a"; ctx.lineWidth = 1;
    for (let g = -5; g <= 5; g += 3) { ctx.beginPath(); ctx.moveTo(-1, g); ctx.lineTo(9, g); ctx.stroke(); }
    ctx.restore();
  }

  // --- surfaced animals (layer 4) ---
  let basked = 0;
  for (const c of s.crocs) {
    if (!c.present || c.state === "hidden" || c.state === "submerged") continue;
    let x, y, ang;
    if (c.state === "basking" && basked < platPos.length) {
      const [px, py, pa] = platPos[basked++];
      x = px; y = py; ang = pa + Math.PI / 2;
    } else {
      [x, y] = place(c); ang = c.ang + Math.PI / 2;
    }
    crocSprite(ctx, x, y, ang, sizeOf(c), c.state === "basking" ? "#6d6a4a" : "#3f6350", "#2c4a3c");
  }

  // --- staff (layer 5) ---
  ctx.fillStyle = "#b8b0a0";
  for (let i = 0; i < s.staff.handlers; i++) {
    const a = (i / Math.max(1, s.staff.handlers)) * TAU + s.hour * 0.09;
    const r = outer + width * 0.28;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 2.6, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "#7f93a8";                            // guards posted at the bridge
  for (let i = 0; i < s.staff.guards; i++) {
    ctx.beginPath();
    ctx.arc(cx + (i - (s.staff.guards - 1) / 2) * 9, cy - outer - width * 0.16, 2.6, 0, TAU);
    ctx.fill();
  }

  // --- overlays (layer 6) ---
  ctx.textAlign = "left";
  ctx.font = "10px ui-monospace, monospace";
  const failing = (s.structures || []).filter(x => x.knownIntegrity !== null && x.knownIntegrity !== undefined && x.knownIntegrity < 0.35);
  if (failing.length) {
    ctx.fillStyle = "#b4544a";
    ctx.fillText(`INTEGRITY BELOW THRESHOLD: ${failing.map(f => f.name).join(", ").toUpperCase()}`, 12, h - 26);
  }
  if (ui.censusObs && ui.censusObs.short) {
    ctx.fillStyle = "#b4544a";
    ctx.fillText("MORNING COUNT SHORT — ONE OR MORE ANIMALS UNACCOUNTED", 12, h - 12);
  }
  if (!s.env.powered) {
    ctx.fillStyle = "#c8a45c";
    ctx.fillText("SUPPLY FAILURE — HEATERS AND PUMPS OFFLINE", 12, 18);
  }
  const band = activityBand(s.activity);
  ctx.fillStyle = "#6a655a";
  ctx.fillText(`${s.env.waterTemp.toFixed(1)} °C · ${BAND_LABEL[band].toUpperCase()}`, 12, h - 40);
}

// ============ briefing ============
function openBriefing() {
  ui.modalOpen = true;
  ui.censusObs = null;
  ui.censusDone = false;
  $("modal").hidden = false;
  renderBriefing();
}

function closeBriefing() {
  ui.modalOpen = false;
  $("modal").hidden = true;
  refreshReadouts();
  renderLog();
}

function renderBriefing() {
  const s = ui.state;
  const censusRows = Object.entries(CENSUS_DEPTHS).map(([key, d]) => {
    const ok = censusAvailable(s, key) && hoursRemaining(s) >= d.hours;
    const why = !censusAvailable(s, key) ? "water too murky" : hoursRemaining(s) < d.hours ? "insufficient hours" : "";
    return `<div class="opt ${ui.censusObs && ui.censusObs.depth === key ? "chosen" : ""}">
      <div><div class="lbl">${d.label}</div><div class="desc">${key === "cursory" ? "A number you cannot rely on." : key === "standard" ? "A count, and whether it is short." : "Exact count with per-animal health flags."}${why ? " — " + why : ""}</div></div>
      <button data-census="${key}" ${ok && !ui.censusDone ? "" : "disabled"}>${d.hours} hr</button>
    </div>`;
  }).join("");

  const actionRows = BRIEFING_ACTIONS.map(a => {
    const spent = s.hours.allocations[a.id] || 0;
    return `<div class="opt ${spent ? "chosen" : ""}">
      <div><div class="lbl">${a.label}</div><div class="desc">${a.description}</div></div>
      <div class="alloc">
        <span class="cost">${a.hours} hr</span>
        <button data-alloc-minus="${a.id}" ${spent ? "" : "disabled"}>−</button>
        <span class="n">${spent ? spent + " hr" : "—"}</span>
        <button data-alloc-plus="${a.id}" ${hoursRemaining(s) >= a.hours ? "" : "disabled"}>+</button>
      </div>
    </div>`;
  }).join("");

  const obs = ui.censusObs;
  const censusResult = obs ? `
    <div class="section"><h3>Count</h3>
      <div style="margin-bottom:8px">${esc(censusNarrative(s, obs))}</div>
      ${obs.healthFlags.length ? `<div class="hint">${obs.healthFlags.map(f => esc(f.name + " — " + f.note)).join("<br>")}</div>` : ""}
      ${obs.short ? renderCensusResponses() : ""}
    </div>` : "";

  $("modal-body").innerHTML = `
    <h2>Morning briefing — day ${s.day}</h2>
    <div class="sub">${s.hours.budget} handler-hours available. ${hoursRemaining(s)} unspent.</div>
    <div class="section"><h3>Census</h3>${censusRows}</div>
    ${censusResult}
    <div class="section"><h3>Allocations</h3>${actionRows}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="primary" id="begin-day">Begin day</button>
    </div>`;

  $("modal-body").querySelectorAll("[data-census]").forEach(b => b.addEventListener("click", () => {
    ui.censusObs = runCensus(s, b.dataset.census);
    ui.censusDone = true;
    logEvent(s, censusNarrative(s, ui.censusObs), "census");
    renderBriefing();
  }));
  $("modal-body").querySelectorAll("[data-alloc-plus]").forEach(b => b.addEventListener("click", () => {
    allocateHours(s, b.dataset.allocPlus);
    renderBriefing();
  }));
  $("modal-body").querySelectorAll("[data-alloc-minus]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.allocMinus;
    const a = BRIEFING_ACTIONS.find(x => x.id === id);
    s.hours.allocations[id] = Math.max(0, (s.hours.allocations[id] || 0) - a.hours);
    if (!s.hours.allocations[id]) delete s.hours.allocations[id];
    s.hours.spent = Math.max(0, s.hours.spent - a.hours);
    renderBriefing();
  }));
  $("begin-day").addEventListener("click", () => { closeBriefing(); setSpeed(1); });
}

function renderCensusResponses() {
  return `<div style="margin-top:8px">
    <div class="hint" style="margin-bottom:6px">The count is short. It may be a miscount. It may not.</div>
    <div class="opt"><div><div class="lbl">Assume miscount, proceed</div><div class="desc">Free. If wrong, the animal surfaces somewhere in a few days.</div></div><button data-resp="assume-miscount">Proceed</button></div>
    <div class="opt"><div><div class="lbl">Re-count thoroughly</div><div class="desc">Three handler-hours, and everything else waits.</div></div><button data-resp="recount">3 hr</button></div>
    <div class="opt"><div><div class="lbl">Drain and search</div><div class="desc">The whole day. The client watches the moat empty.</div></div><button data-resp="drain-search">Full day</button></div>
    <div class="opt"><div><div class="lbl">Report to the client now</div><div class="desc">Costs standing immediately. Halves the penalty if it is real.</div></div><button data-resp="report-client">Report</button></div>
  </div>`;
}

// ============ loop ============
function setSpeed(n) {
  ui.speed = n;
  renderTopbar();
}

// The operating day runs 06:00 to 06:00. The night passes unattended; the manager
// arrives at six with a clipboard, which is when the day is planned and paid for.
function onMorningBriefing(s) {
  applyBriefingMaintenance(s);
  applyVetVisit(s);
  decayStructures(s);
  resolvePending(s);
  ui.overnightIncident = maybeFireIncident(s);
  tickWeather(s);
  endDay(s);
  beginDay(s);
  setSpeed(0);
  openBriefing();
}

function frame(now) {
  if (!ui.last) ui.last = now;
  const dt = Math.min(now - ui.last, 250);
  ui.last = now;
  if (ui.speed > 0 && !ui.modalOpen && ui.state && ui.state.status === "running") {
    ui.acc += dt * ui.speed;
    while (ui.acc >= 1000) {              // 1 real second = 1 in-game hour at 1x
      ui.acc -= 1000;
      tickHour(ui.state);
      if (ui.state.hour === 6) { onMorningBriefing(ui.state); break; }
    }
    refreshReadouts();
    if (ui.state.log.length !== ui.logLen) { ui.logLen = ui.state.log.length; renderLog(); }
  }
  render(ui.modalOpen ? 0 : dt * Math.max(ui.speed, 0));
  requestAnimationFrame(frame);
}

function startContract(clientId, seed) {
  ui.state = createState({ seed, clientId, crocCount: 12 });
  beginDay(ui.state);
  renderControls();
  renderLog();
  openBriefing();
}

$("speed-controls").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) setSpeed(Number(b.dataset.speed));
});

startContract("voss", 1234);
requestAnimationFrame(frame);
</script>
