<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOAT</title>
<style>
:root { --bg: #16181c; --fg: #d7d3c8; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div id="app"></div>
<script id="shared-code">
"use strict";
// ============ test registry ============
const MoatTests = {
  tests: [],
  add(name, fn) { this.tests.push({ name, fn }); },
  run() {
    let failed = 0;
    for (const t of this.tests) {
      try { t.fn(); console.log(`PASS ${t.name}`); }
      catch (e) { failed++; console.error(`FAIL ${t.name}: ${e.message}`); }
    }
    if (failed === 0) console.log(`ALL ${this.tests.length} TESTS PASSED`);
    return failed === 0;
  },
};
function assert(cond, msg) { if (!cond) throw new Error(msg || "assert failed"); }
function assertEq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error(`${msg || "assertEq"}: ${sa} !== ${sb}`);
}
function assertClose(a, b, eps, msg) {
  if (Math.abs(a - b) > eps) throw new Error(`${msg || "assertClose"}: ${a} vs ${b} (eps ${eps})`);
}

// ============ seeded RNG (mulberry32 on state) ============
function rngNext(state) {
  let t = (state.rngState = (state.rngState + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(state, n) { return Math.floor(rngNext(state) * n); }

// ============ tests: rng ============
MoatTests.add("rng is deterministic for a given seed", () => {
  const a = { rngState: 12345 }, b = { rngState: 12345 };
  const seqA = [0, 0, 0, 0, 0].map(() => rngNext(a));
  const seqB = [0, 0, 0, 0, 0].map(() => rngNext(b));
  assertEq(seqA, seqB, "same seed must give same sequence");
});
MoatTests.add("rng differs across seeds and stays in range", () => {
  const a = { rngState: 1 }, b = { rngState: 2 };
  assert(rngNext(a) !== rngNext(b), "different seeds should diverge");
  const s = { rngState: 99 };
  for (let i = 0; i < 500; i++) {
    const v = rngNext(s);
    assert(v >= 0 && v < 1, `rngNext out of range: ${v}`);
    const k = rngInt(s, 7);
    assert(Number.isInteger(k) && k >= 0 && k < 7, `rngInt out of range: ${k}`);
  }
});

// ============ thermal response and the torpor dial ============
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function clamp01(v) { return clamp(v, 0, 1); }
function lerp(a, b, t) { return a + (b - a) * t; }

// Ectotherm response curve. Dead below 16 C, plateau 30-34 C, heat stress above 35 C.
function tempResponse(effTemp) {
  if (effTemp <= 16) return 0;
  if (effTemp < 30) return clamp01((effTemp - 16) / 14);
  if (effTemp <= 34) return 1;
  return clamp01(lerp(1, 0.25, (effTemp - 34) / 8));
}

// Crocodiles are crepuscular/nocturnal: quiet at midday, active at dusk and after dark.
function dielFactor(hour) {
  const h = ((hour % 24) + 24) % 24;
  if (h >= 10 && h < 16) return 0.78;          // midday lull
  if (h >= 19 || h < 2) return 1.18;           // dusk into night
  if (h >= 4 && h < 8) return 1.1;             // dawn
  return 0.95;
}

function computeActivity({ waterTemp, baskingAccess, hunger, hour, seasonFactor, health }) {
  // Basking lets an animal run warmer than the water it sits in.
  const effTemp = waterTemp + 4.5 * clamp01(baskingAccess);
  const thermal = tempResponse(effTemp);
  const appetite = 0.6 + 0.55 * clamp01(hunger);   // hungry animals are alert
  const vigour = 0.45 + 0.55 * clamp01(health);
  // Gain trimmed so the frenzied band is reached only by genuine extremes rather
  // than by any warm hungry evening, which otherwise saturates the top of the range.
  const raw = 82 * thermal * appetite * dielFactor(hour) * clamp(seasonFactor, 0.5, 1.2) * vigour;
  return clamp(Math.round(raw), 0, 100);
}

function activityBand(activity) {
  if (activity < 25) return "torpid";
  if (activity < 45) return "low";
  if (activity < 70) return "optimal";
  if (activity < 90) return "aggressive";
  return "frenzied";
}

const BAND_LABEL = {
  torpid: "Torpid", low: "Low", optimal: "Optimal", aggressive: "Aggressive", frenzied: "Frenzied",
};

// ============ tests: torpor dial ============
MoatTests.add("activityBand maps the spec's ranges", () => {
  assertEq(activityBand(0), "torpid");
  assertEq(activityBand(24), "torpid");
  assertEq(activityBand(25), "low");
  assertEq(activityBand(44), "low");
  assertEq(activityBand(45), "optimal");
  assertEq(activityBand(69), "optimal");
  assertEq(activityBand(70), "aggressive");
  assertEq(activityBand(89), "aggressive");
  assertEq(activityBand(90), "frenzied");
  assertEq(activityBand(100), "frenzied");
});

MoatTests.add("cold water makes crocodiles torpid", () => {
  const a = computeActivity({ waterTemp: 14, baskingAccess: 0, hunger: 1, hour: 20, seasonFactor: 0.85, health: 1 });
  assertEq(activityBand(a), "torpid", `expected torpid, got ${a}`);
});

MoatTests.add("warm water with moderate hunger reaches the optimal band", () => {
  const a = computeActivity({ waterTemp: 29, baskingAccess: 0.6, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
  assertEq(activityBand(a), "optimal", `expected optimal, got ${a}`);
});

MoatTests.add("warm, hungry and nocturnal pushes past optimal", () => {
  const warmHungryNight = computeActivity({ waterTemp: 31, baskingAccess: 0.8, hunger: 1, hour: 21, seasonFactor: 1, health: 1 });
  assert(warmHungryNight >= 70, `expected aggressive or above, got ${warmHungryNight}`);
});

MoatTests.add("activity rises monotonically with water temperature up to the optimum", () => {
  let prev = -1;
  for (let t = 14; t <= 30; t++) {
    const a = computeActivity({ waterTemp: t, baskingAccess: 0.5, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
    assert(a >= prev, `activity dipped at ${t} degrees: ${a} < ${prev}`);
    prev = a;
  }
});

MoatTests.add("heat stress above 35 degrees reduces activity", () => {
  const opt = computeActivity({ waterTemp: 32, baskingAccess: 0.5, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
  const hot = computeActivity({ waterTemp: 40, baskingAccess: 0.5, hunger: 0.5, hour: 12, seasonFactor: 1, health: 1 });
  assert(hot < opt, `overheated animals should be less active: ${hot} vs ${opt}`);
});

MoatTests.add("hunger raises activity and feeding lowers it", () => {
  const base = { waterTemp: 29, baskingAccess: 0.5, hour: 12, seasonFactor: 1, health: 1 };
  const hungry = computeActivity({ ...base, hunger: 1 });
  const fed = computeActivity({ ...base, hunger: 0 });
  assert(hungry > fed, `hungry animals must be more active: ${hungry} vs ${fed}`);
});

MoatTests.add("poor health suppresses activity", () => {
  const base = { waterTemp: 29, baskingAccess: 0.5, hunger: 0.6, hour: 12, seasonFactor: 1 };
  assert(computeActivity({ ...base, health: 0.3 }) < computeActivity({ ...base, health: 1 }), "sick animals must be less active");
});

MoatTests.add("crocodiles are crepuscular: dusk beats midday", () => {
  assert(dielFactor(20) > dielFactor(12), "dusk should exceed midday");
  assert(dielFactor(5) > dielFactor(12), "dawn should exceed midday");
  for (let h = 0; h < 24; h++) {
    const d = dielFactor(h);
    assert(d >= 0.7 && d <= 1.2, `dielFactor(${h}) out of range: ${d}`);
  }
});

MoatTests.add("activity is always clamped to 0..100", () => {
  const extremes = [
    { waterTemp: -5, baskingAccess: 0, hunger: 0, hour: 3, seasonFactor: 0.85, health: 0 },
    { waterTemp: 60, baskingAccess: 1, hunger: 1, hour: 21, seasonFactor: 1, health: 1 },
    { waterTemp: 33, baskingAccess: 1, hunger: 1, hour: 20, seasonFactor: 1, health: 1 },
  ];
  for (const e of extremes) {
    const a = computeActivity(e);
    assert(a >= 0 && a <= 100, `activity out of range: ${a}`);
  }
});

// ============ constants ============
const CROC_NAMES = [
  "Ambrose", "Beatrix", "Cornelius", "Dagmar", "Edwina", "Ferdinand",
  "Griselda", "Horace", "Ingeborg", "Jasper", "Klaus", "Lavinia",
  "Mortimer", "Nerissa", "Ozymandias", "Perpetua", "Quintus", "Rosalind",
  "Sigmund", "Theodora", "Ulric", "Vespasia", "Wilhelm", "Xanthe",
];
const HOURS_PER_DAY = 24;

// ============ state construction ============
function createState({ seed, clientId, crocCount }) {
  const state = {
    seed, rngState: seed >>> 0, clientId,
    day: 1, hour: 6, contractDays: 40,
    crocs: [], licensedHeadcount: crocCount,
    facility: {
      heaterSetpoint: 26, shadeCoverage: 0.4, waterDepth: 2.0,
      filtration: 0.6, baskingPlatforms: Math.ceil(crocCount * 0.6),
      feedIntervalDays: 5, feedVolume: 1.0,
    },
    env: {
      baseAmbient: 24, ambient: 24, waterTemp: 24, turbidity: 0.45, ammonia: 0.1,
      waterLevel: 0.55, weather: "clear", weatherDaysLeft: 0, powered: true,
    },
    staff: { handlers: 3, vet: 0.5, guards: 2, pr: 0, fatigue: 0.1 },
    hours: { budget: 0, spent: 0, allocations: {} },
    structures: [], money: 50000, satisfaction: 70, activity: 0,
    lastFedDay: 0, feedTimesLog: [],
    log: [], redFlags: [], pending: [],
    ledger: {
      minor: 0, serious: 0, fatal: 0, breaches: 0, breachesSuccessful: 0,
      welfareFindings: 0, welfareCritical: 0, lostAnimals: 0, fatalities: 0,
    },
    status: "running",
  };
  for (let i = 0; i < crocCount; i++) {
    state.crocs.push({
      id: i + 1,
      name: CROC_NAMES[i % CROC_NAMES.length] + (i >= CROC_NAMES.length ? " II" : ""),
      sex: rngNext(state) < 0.45 ? "f" : "m",
      length: 2.4 + rngNext(state) * 2.2,
      health: 0.88 + rngNext(state) * 0.12,
      hunger: 0.25 + rngNext(state) * 0.2,
      bodyTemp: 24, stress: 0.1,
      state: "submerged", present: true,
      x: 0.05 + rngNext(state) * 0.9, y: 0.05 + rngNext(state) * 0.9,
    });
  }
  state.env.ambient = ambientTemp(state);
  state.env.waterTemp = waterTempFor(state);
  recomputeActivity(state);
  return state;
}

function logEvent(state, text, kind) {
  state.log.push({ day: state.day, hour: state.hour, text, kind: kind || "info" });
  if (state.log.length > 400) state.log.shift();
}

// ============ environment ============
function ambientTemp(state) {
  const seasonal = Math.sin(((state.day % 360) / 360) * Math.PI * 2) * 6;
  const daily = Math.sin(((state.hour - 9) / 24) * Math.PI * 2) * 5;
  const weatherOffset = { clear: 0, rain: -3, storm: -5, coldsnap: -14, heat: 9 }[state.env.weather] || 0;
  const base = state.env.baseAmbient !== undefined ? state.env.baseAmbient : 24;
  return base + seasonal + daily + weatherOffset;
}

// Heaters only add heat, and only while there is power to run them.
function waterTempFor(state) {
  const air = state.env.ambient;
  const set = state.facility.heaterSetpoint;
  if (set <= air || !state.env.powered) return air;
  return air + (set - air) * 0.75;
}

function baskingAccessFor(state) {
  const wanting = state.crocs.filter(c => c.present).length;
  if (wanting === 0) return 1;
  const capacity = state.facility.baskingPlatforms;
  const shadePenalty = clamp01(state.facility.shadeCoverage) * 0.25;
  return clamp01(capacity / wanting) * (1 - shadePenalty);
}

function meanOf(state, key) {
  const present = state.crocs.filter(c => c.present);
  if (present.length === 0) return 0;
  return present.reduce((sum, c) => sum + c[key], 0) / present.length;
}
function meanHunger(state) { return meanOf(state, "hunger"); }
function meanHealth(state) { return meanOf(state, "health"); }

function seasonFactorFor(state) {
  return state.env.ambient < 18 ? 0.85 : 1;
}

function recomputeActivity(state) {
  state.activity = computeActivity({
    waterTemp: state.env.waterTemp,
    baskingAccess: baskingAccessFor(state),
    hunger: meanHunger(state),
    hour: state.hour,
    seasonFactor: seasonFactorFor(state),
    health: meanHealth(state),
  });
  return state.activity;
}

// ============ hourly tick ============
function tickHour(state) {
  state.hour++;
  if (state.hour >= HOURS_PER_DAY) { state.hour = 0; state.day++; }

  state.env.ambient = ambientTemp(state);
  state.env.waterTemp = waterTempFor(state);

  // Water quality: waste in, filtration out. Calibrated so the default filtration
  // setting exactly holds twelve animals — overstocking or a cut budget is what breaks it.
  const load = state.crocs.filter(c => c.present).length * 0.0011;
  const cleared = state.facility.filtration * (state.env.powered ? 0.022 : 0);
  state.env.ammonia = clamp01(state.env.ammonia + load - cleared);
  // Turbidity tracks ammonia and settles slowly toward what filtration allows.
  const targetTurbidity = clamp01(0.75 - state.facility.filtration * 0.55 + state.env.ammonia * 0.3);
  state.env.turbidity += (targetTurbidity - state.env.turbidity) * 0.02;

  updateCrocs(state);
  recomputeActivity(state);
}

function updateCrocs(state) {
  const feedable = state.env.waterTemp >= 20;
  for (const c of state.crocs) {
    if (!c.present) continue;
    c.bodyTemp += (state.env.waterTemp - c.bodyTemp) * 0.12;
    // Metabolism runs on temperature: cold animals barely burn anything.
    const metabolic = feedable ? 0.0032 * clamp01((state.env.waterTemp - 18) / 14) : 0.0002;
    c.hunger = clamp01(c.hunger + metabolic);

    // Health pressures: ammonia, starvation, crowding stress, cold.
    let drift = 0.0004;                                   // baseline recovery
    if (state.env.ammonia > 0.5) drift -= (state.env.ammonia - 0.5) * 0.0035;
    if (c.hunger > 0.85) drift -= (c.hunger - 0.85) * 0.006;
    if (state.env.waterTemp < 18) drift -= (18 - state.env.waterTemp) * 0.0006;
    if (c.stress > 0.6) drift -= (c.stress - 0.6) * 0.002;
    c.health = clamp01(c.health + drift);

    const crowding = clamp01(1 - baskingAccessFor(state));
    c.stress = clamp01(c.stress + crowding * 0.0015 - 0.0008);

    // Behaviour state, used by the renderer and the census.
    if (state.env.waterTemp < 20) c.state = "submerged";
    else if (state.hour >= 9 && state.hour < 16 && rngNext(state) < 0.35) c.state = "basking";
    else if (rngNext(state) < 0.2) c.state = "hidden";
    else if (state.activity > 55 && rngNext(state) < 0.4) c.state = "patrolling";
    else c.state = "submerged";
  }
}

// ============ tests: state and tick ============
MoatTests.add("createState builds the requested number of crocodiles", () => {
  const s = createState({ seed: 7, clientId: "voss", crocCount: 12 });
  assertEq(s.crocs.length, 12);
  assertEq(s.day, 1);
  assertEq(s.hour, 6);
  assert(s.crocs.every(c => c.present), "all animals start present");
  assert(s.crocs.every(c => c.health > 0.8), "animals start healthy");
  assertEq(new Set(s.crocs.map(c => c.id)).size, 12, "ids must be unique");
});

MoatTests.add("createState is reproducible from its seed", () => {
  const a = createState({ seed: 42, clientId: "voss", crocCount: 12 });
  const b = createState({ seed: 42, clientId: "voss", crocCount: 12 });
  assertEq(a.crocs.map(c => c.length), b.crocs.map(c => c.length));
});

MoatTests.add("tickHour advances the clock and rolls over the day", () => {
  const s = createState({ seed: 1, clientId: "voss", crocCount: 12 });
  s.hour = 23;
  const day = s.day;
  tickHour(s);
  assertEq(s.hour, 0);
  assertEq(s.day, day + 1);
});

MoatTests.add("hunger rises while unfed", () => {
  const s = createState({ seed: 3, clientId: "voss", crocCount: 12 });
  s.crocs.forEach(c => { c.hunger = 0.2; });
  s.env.waterTemp = 29;
  for (let i = 0; i < 72; i++) tickHour(s);
  assert(meanHunger(s) > 0.2, `hunger should rise when unfed, got ${meanHunger(s)}`);
});

MoatTests.add("crocodiles do not get hungry when too cold to feed", () => {
  const warm = createState({ seed: 3, clientId: "voss", crocCount: 12 });
  const cold = createState({ seed: 3, clientId: "voss", crocCount: 12 });
  for (const s of [warm, cold]) s.crocs.forEach(c => { c.hunger = 0.2; });
  warm.facility.heaterSetpoint = 30; cold.facility.heaterSetpoint = 0;
  warm.env.baseAmbient = 30; cold.env.baseAmbient = 12;
  for (let i = 0; i < 72; i++) { tickHour(warm); tickHour(cold); }
  assert(meanHunger(cold) < meanHunger(warm), "metabolism must slow in the cold");
});

MoatTests.add("basking access falls when platforms are scarce", () => {
  const s = createState({ seed: 5, clientId: "voss", crocCount: 12 });
  s.facility.baskingPlatforms = 12;
  const plenty = baskingAccessFor(s);
  s.facility.baskingPlatforms = 2;
  const scarce = baskingAccessFor(s);
  assert(scarce < plenty, `crowding must reduce basking access: ${scarce} vs ${plenty}`);
  assert(scarce >= 0 && plenty <= 1, "basking access stays in 0..1");
});

MoatTests.add("ammonia accumulates without filtration and clears with it", () => {
  const dirty = createState({ seed: 9, clientId: "voss", crocCount: 12 });
  const clean = createState({ seed: 9, clientId: "voss", crocCount: 12 });
  dirty.facility.filtration = 0; clean.facility.filtration = 1;
  dirty.env.ammonia = 0.3; clean.env.ammonia = 0.3;
  for (let i = 0; i < 120; i++) { tickHour(dirty); tickHour(clean); }
  assert(dirty.env.ammonia > clean.env.ammonia, `filtration must help: ${dirty.env.ammonia} vs ${clean.env.ammonia}`);
});

MoatTests.add("bad water quality erodes health", () => {
  const s = createState({ seed: 11, clientId: "voss", crocCount: 12 });
  s.facility.filtration = 0;
  s.env.ammonia = 0.95;
  const before = meanHealth(s);
  for (let i = 0; i < 240; i++) tickHour(s);
  assert(meanHealth(s) < before, `health should decline in filthy water: ${meanHealth(s)} vs ${before}`);
});

MoatTests.add("recomputeActivity stores the derived value on state", () => {
  const s = createState({ seed: 13, clientId: "voss", crocCount: 12 });
  s.env.ambient = 30; s.facility.heaterSetpoint = 30; s.hour = 20;
  s.env.waterTemp = waterTempFor(s);
  s.crocs.forEach(c => { c.hunger = 0.7; });
  const a = recomputeActivity(s);
  assertEq(a, s.activity);
  assert(a > 0, "warm hungry animals at dusk are not torpid");
});

MoatTests.add("logEvent records entries with a timestamp and kind", () => {
  const s = createState({ seed: 1, clientId: "voss", crocCount: 12 });
  logEvent(s, "Grate inspected, culvert 4.", "maintenance");
  assertEq(s.log.length, 1);
  assertEq(s.log[0].kind, "maintenance");
  assertEq(s.log[0].day, 1);
  assertEq(s.log[0].hour, 6);
});

// ============ the morning census ============
// The count is an observation, not a state read. It can only ever undercount, so
// "12 of 12" proves everything is present and a short count is always ambiguous.
const CENSUS_DEPTHS = {
  cursory:  { hours: 0.25, label: "Cursory (15 min)",  missMultiplier: 6 },
  standard: { hours: 1,    label: "Standard (1 hr)",   missMultiplier: 1 },
  thorough: { hours: 3,    label: "Thorough (3 hr)",   missMultiplier: 0.15 },
};

function censusAvailable(state, depth) {
  if (depth === "thorough") return state.env.turbidity <= 0.3;
  return Boolean(CENSUS_DEPTHS[depth]);
}

// Probability that a present animal is missed by the observer. Turbidity dominates
// and does so steeply: clear water is nearly reliable, murky water is where a
// headcount stops being a fact. Kept low per animal so that across a full moat a
// short count stays a rare, alarming event rather than daily background noise.
function missChance(state, croc, depth) {
  const d = CENSUS_DEPTHS[depth];
  const water = 0.08 * Math.pow(clamp01(state.env.turbidity), 2.25);
  const concealment = croc.state === "hidden" ? 1 : croc.state === "submerged" ? 0.4 : 0;
  return clamp01(water * d.missMultiplier * (1 + concealment) * (1 + clamp01(state.staff.fatigue)));
}

function runCensus(state, depth) {
  const d = CENSUS_DEPTHS[depth] || CENSUS_DEPTHS.standard;
  state.hours.spent += d.hours;

  const present = state.crocs.filter(c => c.present);
  const missedIds = [];
  for (const c of present) {
    if (rngNext(state) < missChance(state, c, depth)) missedIds.push(c.id);
  }
  const counted = present.length - missedIds.length;
  const expected = state.licensedHeadcount;

  const obs = {
    depth, expected, counted, actualPresent: present.length,
    missedIds, healthFlags: [], kind: "count", low: counted, high: counted,
    short: counted < expected,
  };

  if (depth === "cursory") {
    // Too quick to commit to a number; the observer offers a band around what they saw.
    const spread = 1 + rngInt(state, 2);
    obs.kind = "range";
    obs.low = Math.max(0, counted - spread);
    obs.high = counted + spread;
    obs.short = obs.high < expected;
  }

  if (depth === "thorough") {
    for (const c of present) {
      if (c.health < 0.7) obs.healthFlags.push({ id: c.id, name: c.name, note: "condition below standard" });
      else if (c.hunger > 0.9) obs.healthFlags.push({ id: c.id, name: c.name, note: "has not fed in some time" });
      else if (c.stress > 0.7) obs.healthFlags.push({ id: c.id, name: c.name, note: "showing stress behaviour" });
    }
  }
  return obs;
}

function censusNarrative(state, obs) {
  const clarity = state.env.turbidity > 0.6 ? " Water clarity poor." : "";
  if (obs.kind === "range") {
    return `${obs.low}–${obs.high} animals observed. The count was not held long enough to be worth much.${clarity}`;
  }
  if (!obs.short) {
    const flags = obs.healthFlags.length
      ? ` ${obs.healthFlags.length} animal(s) flagged for review.`
      : "";
    return `${obs.counted} of ${obs.expected} confirmed.${flags}${clarity}`;
  }
  return `${obs.counted} of ${obs.expected} — ${obs.expected - obs.counted} unaccounted.${clarity}`;
}

// ============ tests: census ============
function censusFixture(seed) {
  const s = createState({ seed, clientId: "voss", crocCount: 12 });
  s.env.turbidity = 0.2;
  s.staff.fatigue = 0;
  return s;
}

MoatTests.add("thorough census needs clear water", () => {
  const s = censusFixture(1);
  s.env.turbidity = 0.2;
  assertEq(censusAvailable(s, "thorough"), true);
  s.env.turbidity = 0.6;
  assertEq(censusAvailable(s, "thorough"), false);
  assertEq(censusAvailable(s, "standard"), true);
});

MoatTests.add("a thorough census in clear water finds every animal", () => {
  const s = censusFixture(2);
  const obs = runCensus(s, "thorough");

MoatTests.add("murky water causes false short counts even when nothing is missing", () => {

MoatTests.add("clear water produces fewer false short counts than murky water", () => {

MoatTests.add("the census never reports more animals than are present", () => {

MoatTests.add("a cursory range can hide a genuinely missing animal", () => {
  let reassured = 0;
  for (let seed = 1; seed <= 60; seed++) {

// ============ handler hours: the day's currency ============
// One pool funds the census, inspection, maintenance, the vet and the airspace
// watch. A thorough count is three hours not spent looking at culvert 4.
const BRIEFING_ACTIONS = [
  { id: "inspect-structure", label: "Inspect a structure", hours: 1.5,
    description: "Reveals true integrity for one perimeter element." },
  { id: "grate-maintenance", label: "Grate and culvert maintenance", hours: 2,
    description: "Restores culvert integrity. Nobody wants to spend the morning on it." },
  { id: "bank-repair", label: "Bank and fence repair", hours: 2.5,
    description: "Restores bank angle and fence line. Silt builds a ramp if left." },
  { id: "vet-visit", label: "Veterinary call-out", hours: 2,
    description: "Treats the worst-affected animal. Costs money as well as hours." },
  { id: "airspace-watch", label: "Airspace watch", hours: 1,
    description: "Someone looks up. Nobody budgets for this." },
  { id: "staff-rest", label: "Rostered rest", hours: 1.5,
    description: "Hours spent not working. Reduces fatigue, which is how incidents start." },
];

function dailyHandlerHours(state) {
  const raw = state.staff.handlers * 6;
  return Math.round(raw * (1 - clamp01(state.staff.fatigue) * 0.45) * 4) / 4;
}

function hoursRemaining(state) {
  return Math.round((state.hours.budget - state.hours.spent) * 100) / 100;
}

function beginDay(state) {
  state.hours.budget = dailyHandlerHours(state);
  state.hours.spent = 0;
  state.hours.allocations = {};
  logEvent(state, `Morning briefing. ${state.hours.budget} handler-hours available.`, "info");
}

function allocateHours(state, actionId, amount) {
  const action = BRIEFING_ACTIONS.find(a => a.id === actionId);
  if (!action) return false;
  const cost = amount === undefined ? action.hours : amount;
  if (cost > hoursRemaining(state) + 1e-9) return false;
  state.hours.spent += cost;
  state.hours.allocations[actionId] = (state.hours.allocations[actionId] || 0) + cost;
  return true;
}

function endDay(state) {
  const load = state.hours.budget > 0 ? clamp01(state.hours.spent / state.hours.budget) : 0;
  const rest = (state.hours.allocations["staff-rest"] || 0) * 0.04;
  state.staff.fatigue = clamp01(state.staff.fatigue + load * 0.12 - 0.07 - rest);
}

// ============ tests: handler hours ============
MoatTests.add("more handlers means more hours", () => {
  const s = createState({ seed: 1, clientId: "voss", crocCount: 12 });
  s.staff.fatigue = 0;
  s.staff.handlers = 2; const few = dailyHandlerHours(s);
  s.staff.handlers = 5; const many = dailyHandlerHours(s);
  assert(many > few, `more handlers must yield more hours: ${many} vs ${few}`);
});

MoatTests.add("fatigue reduces the available pool", () => {
  const s = createState({ seed: 1, clientId: "voss", crocCount: 12 });
  s.staff.handlers = 3;
  s.staff.fatigue = 0; const fresh = dailyHandlerHours(s);
  s.staff.fatigue = 0.9; const tired = dailyHandlerHours(s);
  assert(tired < fresh, `fatigue must cost hours: ${tired} vs ${fresh}`);
  assert(tired > 0, "a tired crew still turns up");
});

MoatTests.add("beginDay refills the pool and clears allocations", () => {
  const s = createState({ seed: 2, clientId: "voss", crocCount: 12 });
  s.hours.spent = 5; s.hours.allocations = { "vet-visit": 2 };
  beginDay(s);
  assertEq(s.hours.spent, 0);
  assertEq(s.hours.allocations, {});
  assert(s.hours.budget > 0, "pool must be refilled");
});

MoatTests.add("allocations draw down the same pool the census uses", () => {
  const s = createState({ seed: 3, clientId: "voss", crocCount: 12 });
  beginDay(s);
  const budget = s.hours.budget;
  runCensus(s, "thorough");                       // 3 hours
  assertClose(hoursRemaining(s), budget - 3, 0.001);
  assertEq(allocateHours(s, "vet-visit", 2), true);
  assertClose(hoursRemaining(s), budget - 5, 0.001);
});

MoatTests.add("allocation fails when the pool is exhausted", () => {
  const s = createState({ seed: 4, clientId: "voss", crocCount: 12 });
  beginDay(s);
  s.hours.spent = s.hours.budget - 0.5;
  assertEq(allocateHours(s, "grate-maintenance", 2), false);
  assertClose(hoursRemaining(s), 0.5, 0.001, "a failed allocation must not spend anything");
});

MoatTests.add("a long day raises fatigue and a short one lets it recover", () => {
  const busy = createState({ seed: 5, clientId: "voss", crocCount: 12 });
  const quiet = createState({ seed: 5, clientId: "voss", crocCount: 12 });
  for (const s of [busy, quiet]) { s.staff.fatigue = 0.4; beginDay(s); }
  busy.hours.spent = busy.hours.budget;
  quiet.hours.spent = 0;
  endDay(busy); endDay(quiet);
  assert(busy.staff.fatigue > quiet.staff.fatigue, "working the full pool must tire the crew");
  assert(quiet.staff.fatigue < 0.4, "a quiet day must let fatigue recover");
});

MoatTests.add("every briefing action declares hours and a description", () => {
  assert(BRIEFING_ACTIONS.length >= 6, "expected the full action list");
  for (const a of BRIEFING_ACTIONS) {
    assert(typeof a.id === "string" && a.id.length > 0, "action needs an id");
    assert(a.hours > 0, `${a.id} must cost hours`);
    assert(typeof a.description === "string" && a.description.length > 0, `${a.id} needs a description`);
  }
});
