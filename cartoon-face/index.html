<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Face Studio</title>
<style>
  :root {
    --bg: #12141a;
    --card: #1b1e26;
    --card2: #22262f;
    --line: #2d323d;
    --text: #e8eaf0;
    --dim: #9aa3b2;
    --accent: #7c5cff;
    --accent2: #ff5d8f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
    background: linear-gradient(90deg, rgba(124,92,255,.12), rgba(255,93,143,.10));
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .4px; }
  header span { color: var(--dim); font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(124,92,255,.14), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(255,93,143,.08), transparent 60%);
    min-width: 0;
  }
  .faceWrap { width: min(62vh, 520px); max-width: 94vw; }
  svg#face { width: 100%; height: auto; display: block; filter: drop-shadow(0 18px 40px rgba(0,0,0,.45)); }
  .shake { animation: shake .28s infinite; }
  @keyframes shake {
    0% { transform: translate(0,0); } 25% { transform: translate(-2.5px,1.5px); }
    50% { transform: translate(2.5px,-1.5px); } 75% { transform: translate(-1.5px,-2px); }
    100% { transform: translate(0,0); }
  }
  .panel {
    width: 400px; overflow-y: auto; border-left: 1px solid var(--line);
    background: var(--card); padding: 14px; flex-shrink: 0;
  }
  @media (max-width: 900px) {
    main { flex-direction: column; overflow-y: auto; }
    .stage { min-height: 60vh; }
    .panel { width: 100%; border-left: none; border-top: 1px solid var(--line); }
  }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--dim); margin: 18px 2px 8px;
  }
  h2:first-child { margin-top: 2px; }
  .exprGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .exprGrid button {
    font-size: 11px; padding: 6px 4px; border-radius: 8px; cursor: pointer;
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    transition: background .15s, border-color .15s, transform .05s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .exprGrid button:hover { border-color: var(--accent); }
  .exprGrid button:active { transform: scale(.96); }
  .exprGrid button.active {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    border-color: transparent; color: white; font-weight: 600;
  }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  .btn {
    flex: 1; padding: 8px 6px; border-radius: 9px; cursor: pointer; font-size: 12px;
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    transition: border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.on {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    border-color: transparent; font-weight: 600;
  }
  .ctl { display: grid; grid-template-columns: 88px 1fr 34px; align-items: center; gap: 8px; margin: 5px 0; }
  .ctl label { font-size: 11.5px; color: var(--dim); }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); height: 18px; }
  .ctl output { font-size: 10.5px; color: var(--text); text-align: right; opacity: .75; }
  select {
    width: 100%; padding: 7px 8px; border-radius: 8px; font-size: 12px;
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .swRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .sw {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; outline: 1px solid rgba(255,255,255,.15);
    transition: transform .1s;
  }
  .sw:hover { transform: scale(1.12); }
  .sw.sel { border-color: white; outline-color: white; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { font-size: 12px; color: var(--text); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .checks input { accent-color: var(--accent); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 16px; text-align: center; }

  .zzz { animation: zfloat 2.2s ease-in-out infinite; fill: #9fb4ff; }
  .zz2 { animation-delay: .35s; } .zz3 { animation-delay: .7s; }
  @keyframes zfloat {
    0% { opacity: 0; transform: translateY(8px); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-16px); }
  }
  .heartF { animation: hrise 1.8s ease-in-out infinite; }
  .h2a { animation-delay: .5s; } .h3a { animation-delay: 1s; }
  @keyframes hrise {
    0%,100% { opacity: 0; transform: translateY(10px) scale(.7); }
    40% { opacity: 1; } 80% { opacity: .4; transform: translateY(-14px) scale(1); }
  }
  .twinkle { animation: twk 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .tw2 { animation-delay: .6s; }
  @keyframes twk { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1.1);} }
  .drip { animation: drip 1.3s ease-in infinite; }
  @keyframes drip { 0% { opacity: 0; transform: translateY(0);} 25% {opacity: 1;} 100% { opacity: 0; transform: translateY(16px);} }
</style>
</head>
<body>

  <aside class="panel">

    </div>

    <div class="ctl"><label>Height</label><input type="range" data-k="brH" min="-8" max="9" step=".5" value="0"><output></output></div>
    <div class="ctl"><label>Arch</label><input type="range" data-k="brC" min="0" max="10" step=".5" value="4"><output></output></div>
    <div class="ctl"><label>Thickness</label><input type="range" data-k="brW" min="2.5" max="9" step=".5" value="5"><output></output></div>
    <div class="ctl"><label>Asymmetry</label><input type="range" data-k="brX" min="-1" max="1" step=".05" value="0"><output></output></div>

    <h2>Eyes</h2>

    <div class="ctl"><label>Eyelid</label><input type="range" data-k="lid" min="0" max="1" step=".02" value="0"><output></output></div>
    <div class="ctl"><label>Pupil X</label><input type="range" data-k="px" min="-1" max="1" step=".05" value="0"><output></output></div>
    <div class="ctl"><label>Pupil Y</label><input type="range" data-k="py" min="-1" max="1" step=".05" value="0"><output></output></div>
    <div class="ctl"><label>Pupil size</label><input type="range" data-k="ps" min=".5" max="1.5" step=".05" value="1"><output></output></div>

    <h2>Mouth</h2>
    <div class="ctl"><label>Smile</label><input type="range" data-k="mS" min="-1" max="1" step=".02" value=".12"><output></output></div>
    <div class="ctl"><label>Open</label><input type="range" data-k="mO" min="0" max="1" step=".02" value="0"><output></output></div>
    <div class="ctl"><label>Width</label><input type="range" data-k="mW" min=".3" max="1.3" step=".02" value=".62"><output></output></div>
    <div class="ctl"><label>Skew</label><input type="range" data-k="mK" min="-1" max="1" step=".05" value="0"><output></output></div>
    <div class="checks" style="margin-top:6px">
      <label><input type="checkbox" id="wavyC"> wavy mouth</label>
      <label><input type="checkbox" id="tongueC"> tongue</label>
    </div>

    <h2>Face</h2>
    <div class="ctl"><label>Nose shift</label><input type="range" data-k="nY" min="-8" max="8" step=".5" value="0"><output></output></div>
    <div class="ctl"><label>Blush</label><input type="range" data-k="bl" min="0" max="1" step=".05" value="0"><output></output></div>

    <h2>Hair</h2>
    <select id="hairS">
      <option value="none">Style: bald</option>
      <option value="short" selected>Style: short</option>
      <option value="spiky">Style: spiky</option>
      <option value="curly">Style: curly</option>
      <option value="bob">Style: bob</option>
      <option value="long">Style: long</option>
      <option value="ponytail">Style: ponytail</option>
      <option value="mohawk">Style: mohawk</option>
    </select>
    <div class="swRow" id="hairSw"></div>

    <h2>Nose</h2>
    <select id="noseS">
      <option value="button" selected>Nose: button</option>
      <option value="round">Nose: round</option>
      <option value="pointy">Nose: pointy</option>
      <option value="wide">Nose: wide</option>
    </select>

    <h2>Skin</h2>
    <div class="swRow" id="skinSw"></div>
    <h2>Iris color</h2>
    <div class="swRow" id="eyeSw"></div>
    <h2>Shirt</h2>
    <div class="swRow" id="shirtSw"></div>

    <p class="hint">Arrow keys switch expressions &middot; R = random</p>
  </aside>
</main>

  { name: "Angry", x: { vein: 1 }, n: { brA: 16, brH: -4, mS: -.5, mO: .15, mW: .7 } },
  { name: "Furious", x: { vein: 1 }, n: { brA: 20, brH: -6, mS: -.7, mO: .55, mW: .85, bl: .3 } },
  { name: "Raging", x: { vein: 1, shake: 1 }, n: { brA: 22, brH: -8, mS: -.9, mO: .8, mW: 1, bl: .5 } },
  { name: "Disgusted", w: 1, n: { nY: -6, brA: 8, lid: .45, mS: -.35, mK: -.5 } },
  { name: "Sick", w: 1, x: { sweat: 1 }, n: { lid: .5, mS: -.25, nY: -4, py: .3 } },
  { name: "Embarrassed", x: { sweat: 1 }, n: { bl: 1, mS: .15, mW: .45, lid: .3, brA: -6 } },
  { name: "Shy", m: "happy", n: { bl: .85, mS: .3, mW: .45, lid: .2 } },
  { name: "Winking", m: "winkL", n: { mS: .6, mK: .3, bl: .2 } },
  { name: "Playful", m: "winkR", x: { tongue: 1 }, n: { mS: .5, mO: .35, brX: .5 } },
  { name: "Mischievous", n: { mS: .6, mK: .7, brX: .8, lid: .25, mO: .15 } },
  { name: "Determined", n: { brA: 14, brH: -3, lid: .28, eo: .85, mS: -.05, mW: .5, ps: .9 } },
  { name: "Thinking", n: { px: -.5, py: -.5, brX: .6, mS: -.05, mW: .42, mK: -.3, lid: .2 } }
];

const cfg = { skinIdx: 0, hairIdx: 1, eyeIdx: 4, shirtIdx: 0, hair: "short", nose: "button", eyeMode: "normal", wavy: false, extras: {} };

const cur = Object.assign({}, NUMDEFS);
const tgt = Object.assign({}, NUMDEFS);
let exprIdx = 0;
let needsRender = true;
let autoTimer = null;
let blinkStart = -1;
let nextBlinkAt = performance.now() + 2500;

function darken(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * (1 - f));
  const g = Math.round(((n >> 8) & 255) * (1 - f));
  const b = Math.round((n & 255) * (1 - f));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

const CAP = "M 82,215 C 82,120 138,76 200,76 C 262,76 318,120 318,215 C 312,168 296,140 272,131 C 246,122 224,128 200,128 C 176,128 154,122 128,131 C 104,140 88,168 82,215 Z";

function hairMarkup(style, H) {
  const hs = darken(H, 0.3);
  let back = "", front = "";
  if (style === "short") front = `<path d="${CAP}" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
  else if (style === "spiky") {
    front = `<path d="M 82,215 L 92,148 L 110,170 L 120,112 L 140,140 L 156,96 L 176,128 L 198,84 L 218,126 L 238,94 L 256,132 L 276,102 L 292,144 L 306,120 L 318,215 C 312,168 296,140 272,131 C 246,122 224,128 200,128 C 176,128 154,122 128,131 C 104,140 88,168 82,215 Z" fill="${H}" stroke="${hs}" stroke-width="3" stroke-linejoin="round"/>`;
  } else if (style === "curly") {
    const pts = [[118,122],[150,100],[185,90],[220,92],[255,102],[284,124]];
    let c = `<path d="${CAP}" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
    for (const p of pts) c += `<circle cx="${p[0]}" cy="${p[1]}" r="23" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
    c += `<circle cx="103" cy="150" r="17" fill="${H}" stroke="${hs}" stroke-width="3"/><circle cx="299" cy="150" r="17" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
    front = c;
  } else if (style === "bob") {
    back = `<path d="M 200,62 C 112,62 70,134 72,214 C 73,262 84,300 104,312 L 296,312 C 316,300 327,262 328,214 C 330,134 288,62 200,62 Z" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
    front = `<path d="${CAP}" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
  } else if (style === "long") {
    back = `<path d="M 200,60 C 106,60 64,140 66,244 C 67,338 82,410 104,442 L 296,442 C 318,410 333,338 334,244 C 336,140 294,60 200,60 Z" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
    front = `<path d="${CAP}" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
  } else if (style === "ponytail") {
    back = `<path d="M 296,120 C 344,124 360,166 342,200 C 333,217 318,228 306,234" fill="none" stroke="${H}" stroke-width="17" stroke-linecap="round"/><circle cx="305" cy="121" r="20" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
    front = `<path d="${CAP}" fill="${H}" stroke="${hs}" stroke-width="3"/>`;
  } else if (style === "mohawk") {
    front = `<path d="M 146,130 L 160,58 L 176,106 L 192,34 L 208,102 L 224,48 L 238,110 L 252,66 L 256,130 Q 200,102 146,130 Z" fill="${H}" stroke="${hs}" stroke-width="3" stroke-linejoin="round"/>`;
  }
  return { back, front };
}

function applyPalette() {
  const skin = SKINS[cfg.skinIdx][1], shade = SKINS[cfg.skinIdx][2];
  const H = HAIRC[cfg.hairIdx];
  $id("head").setAttribute("fill", skin);
  $id("head").setAttribute("stroke", "#3a2a20");
  $id("head").setAttribute("stroke-width", "3");
  $id("neck").setAttribute("fill", skin);
  $id("neck").setAttribute("stroke", "#3a2a20");
  $id("neck").setAttribute("stroke-width", "3");
  $id("torso").setAttribute("fill", SHIRTC[cfg.shirtIdx]);
  $id("torso").setAttribute("stroke", darken(SHIRTC[cfg.shirtIdx], 0.35));
  $id("torso").setAttribute("stroke-width", "3");
  $id("chinShadow").setAttribute("fill", shade);
  let ears = "";
  for (const ex of [80, 320]) {
    ears += `<ellipse cx="${ex}" cy="245" rx="15" ry="21" fill="${skin}" stroke="#3a2a20" stroke-width="3"/><path d="M ${ex},240 q 6,5 0,11" fill="none" stroke="${shade}" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  $id("ears").innerHTML = ears;
  const hm = hairMarkup(cfg.hair, H);
  $id("hairBack").innerHTML = hm.back;
  $id("hairFront").innerHTML = hm.front;
}

function starPoints(rOut, rIn) {
  let s = "";
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? rOut : rIn;
    const a = (Math.PI / 5) * i - Math.PI / 2;
    s += (i === 0 ? "M" : "L") + (r * Math.cos(a)).toFixed(2) + "," + (r * Math.sin(a)).toFixed(2);
  }
  return s + " Z";
}
const STAR_D = starPoints(11, 4.6);
const SPIRAL_D = "M -1.6,0 a 1.6,1.6 0 1,1 3.2,0 a 3.5,3.5 0 1,1 -7,0 a 5.4,5.4 0 1,1 10.8,0 a 7.3,7.3 0 1,1 -14.6,0";
const HEART_D = "M0,6.4 C-8.5,-2.2 -4.8,-10 0,-4.8 C4.8,-10 8.5,-2.2 0,6.4 Z";

function eyeInner(side, v, skin) {
  const mode = cfg.eyeMode;
  let arcMode = null;
  if (mode === "happy" || mode === "squint" || mode === "closed") arcMode = mode;
  if (mode === "winkL" && side < 0) arcMode = "happy";
  if (mode === "winkR" && side > 0) arcMode = "happy";
  const ink = "#3a2a20";

  if (arcMode) {
    let d;
    if (arcMode === "happy") d = "M -14,4 Q 0,-10 14,4";
    else if (arcMode === "sad") d = "M -14,2 Q 0,12 14,2";
    else if (arcMode === "squint") d = "M -14,0 Q 0,-4 14,0";
    else d = "M -14,1 Q 0,4 14,1";
    return `<path d="${d}" fill="none" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`;
  }

  const openEff = v.eo * (1 - v.blinkV);
  const lidEff = Math.min(1, v.lid + v.blinkV);
  const ry = 17 * Math.min(1.35, Math.max(0, openEff));

  if (ry < 2.4) {
    return `<path d="M -15,1 Q 0,5 15,1" fill="none" stroke="${ink}" stroke-width="4.5" stroke-linecap="round"/>`;
  }

  const rx = 16;
  const px = v.px * 6, py = v.py * 5;
  let iris;
  if (mode === "heart") {
    iris = `<path d="${HEART_D}" transform="translate(${px},${py}) scale(1.15)" fill="#ff5d8f" stroke="#c94f7c" stroke-width="1.4"><\/path>`;
  } else if (mode === "star") {
    iris = `<path d="${STAR_D}" transform="translate(${px},${py})" fill="#ffd34d" stroke="#b8860b" stroke-width="1.4"><\/path>`;
  } else if (mode === "spiral") {
    iris = `<path d="${SPIRAL_D}" transform="translate(${px},${py}) scale(1.15)" fill="none" stroke="#4a4a55" stroke-width="2.4" stroke-linecap="round"><\/path>`;
  } else {
    const pr = 4.4 * v.ps;
    iris = `<circle r="9" fill="${EYEC[cfg.eyeIdx]}" stroke="${darken(EYEC[cfg.eyeIdx], 0.4)}" stroke-width="1.5"/><circle r="${pr.toFixed(2)}" fill="#14100e"/><circle cx="-3" cy="-3.5" r="2.4" fill="#fff" opacity=".92"/>`;
    iris = `<g transform="translate(${px},${py})">${iris}</g>`;
  }

  let lidSvg = "";
  if (lidEff > 0.03) {
    const cutY = -ry + lidEff * 2 * ry * 0.94;
    if (cutY > -ry + 0.5 && cutY < ry) {
      const frac = 1 - (cutY / ry) * (cutY / ry);
      if (frac > 0.001) {
        const hw = (rx * Math.sqrt(frac)).toFixed(2);
        lidSvg = `<path d="M ${-hw},${cutY.toFixed(2)} A ${rx} ${ry.toFixed(2)} 0 0 1 ${hw},${cutY.toFixed(2)} Z" fill="${skin}"/>` +
                 `<path d="M ${-hw},${cutY.toFixed(2)} A ${rx} ${ry.toFixed(2)} 0 0 1 ${hw},${cutY.toFixed(2)}" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
      }
    }
  }

  return `<ellipse rx="${rx}" ry="${ry.toFixed(2)}" fill="#ffffff" stroke="${ink}" stroke-width="3"/>` +
         iris + lidSvg;
}

function browD(sign, v) {
  const y0 = 172, span = 25;
  let bh = v.brH, ang = v.brA * Math.PI / 180;
  if (sign > 0) {
    bh = bh - v.brX * 8;
    ang = ang * 0.35 - v.brX * 0.21;
  }
  const innerX = sign < 0 ? 175 : 225;
  const outerX = sign < 0 ? 127 : 273;
  const iy = y0 + bh + Math.sin(ang) * span;
  const oy = y0 + bh - Math.sin(ang) * span;
  const mx = (innerX + outerX) / 2;
  const my = Math.min(iy, oy) - v.brC * 2.2;
  return `M ${outerX},${oy.toFixed(2)} Q ${mx},${my.toFixed(2)} ${innerX},${iy.toFixed(2)}`;
}

function mouthRender(v) {
  const mx = 200, my = 302;
  const w = 20 + 40 * v.mW;
  const cly = my - v.mS * 13 - v.mK * 7;
  const cry = my - v.mS * 13 + v.mK * 7;
  const tY = my + v.mS * 7 + 2;
  const bY = tY + 7 + v.mO * 54 + Math.max(0, -v.mS) * 14;
  const fillP = $id("mouthFill"), lineP = $id("mouthLine"), clipP = $id("mclipP");
  const teeth = $id("teeth"), tongue = $id("tongue");

  if (cfg.wavy) {
    const d = `M ${mx - w},${my} Q ${mx - w / 2},${my - 9} ${mx},${my} Q ${mx + w / 2},${my + 9} ${mx + w},${my}`;
    fillP.setAttribute("d", ""); teeth.style.display = "none"; tongue.style.display = "none";
    lineP.setAttribute("d", d); clipP.setAttribute("d", "");
    return;
  }

  if (v.mO > 0.04) {
    const d = `M ${mx - w},${cly.toFixed(2)} Q ${mx},${tY.toFixed(2)} ${mx + w},${cry.toFixed(2)} Q ${mx},${bY.toFixed(2)} ${mx - w},${cly.toFixed(2)} Z`;
    fillP.setAttribute("d", d);
    clipP.setAttribute("d", d);
    lineP.setAttribute("d", `M ${mx - w},${cly.toFixed(2)} Q ${mx},${tY.toFixed(2)} ${mx + w},${cry.toFixed(2)}`);
    if (v.mO > 0.22) {
      const midY = 0.25 * cly + 0.5 * tY + 0.25 * cry;
      teeth.setAttribute("x", String(mx - w + 2));
      teeth.setAttribute("width", String(2 * w - 4));
      teeth.setAttribute("y", fmt(Math.min(cly, cry, midY) - 2));
      teeth.setAttribute("height", "12");
      teeth.style.display = "";
    } else teeth.style.display = "none";
    if (cfg.extras.tongue && v.mO > 0.18) {
      tongue.setAttribute("cx", String(mx));
      tongue.setAttribute("cy", String(my + (bY - my) * 0.58));
      tongue.setAttribute("rx", String(w * 0.52));
      tongue.setAttribute("ry", String((bY - tY) * 0.36 + 4));
      tongue.style.display = "";
    } else tongue.style.display = "none";
  } else {
    fillP.setAttribute("d", ""); clipP.setAttribute("d", "");
    teeth.style.display = "none"; tongue.style.display = "none";
    lineP.setAttribute("d", `M ${mx - w},${cly.toFixed(2)} Q ${mx},${tY.toFixed(2)} ${mx + w},${cry.toFixed(2)}`);
  }
}

function noseRender(v) {
  const g = $id("noseG");
  const skin = SKINS[cfg.skinIdx][1], shade = SKINS[cfg.skinIdx][2];
  const y = 258 + v.nY;
  let inner = "";
  if (cfg.nose === "button") {
    inner = `<path d="M -8,${y} Q 0,${y + 7.5} 8,${y}" fill="none" stroke="#3a2a20" stroke-width="3.5" stroke-linecap="round"/>`;
  } else if (cfg.nose === "round") {
    inner = `<ellipse cx="0" cy="${y}" rx="8" ry="5.5" fill="${shade}" stroke="#3a2a20" stroke-width="2.5"/>`;
  } else if (cfg.nose === "pointy") {
    inner = `<path d="M -5,${y - 9} L 5,${y - 9} L 0,${y + 7} Z" fill="${shade}" stroke="#3a2a20" stroke-width="2.5" stroke-linejoin="round"/>`;
  } else {
    inner = `<path d="M -14,${y - 2} Q 0,${y + 11} 14,${y - 2}" fill="none" stroke="#3a2a20" stroke-width="3.5" stroke-linecap="round"/><circle cx="-7" cy="${y}" r="1.7" fill="#3a2a20"/><circle cx="7" cy="${y}" r="1.7" fill="#3a2a20"/>`;
  }
  g.innerHTML = inner;
}

function fxRender(extras) {
  const tear = `<path d="M0,-10 C5,-2 7,3 7,7 A7,7 0 1,1 -7,7 C-7,3 -5,-2 0,-10 Z" fill="#6ec6ff" stroke="#3aa0e8"/>`;
  $id("accL").innerHTML = extras.tears ? tear : "";
  $id("accL").style.display = extras.tears ? "" : "none";
  $id("accL").setAttribute("transform", "translate(150,238)");
  $id("accR").innerHTML = extras.tears ? tear : "";
  $id("accR").style.display = extras.tears ? "" : "none";
  $id("accR").setAttribute("transform", "translate(250,238)");
  $id("fxSweat").style.display = extras.sweat ? "" : "none";
  $id("fxVein").style.display = extras.vein ? "" : "none";
  $id("fxVein").setAttribute("transform", "translate(318,126)");
  $id("fxZzz").style.display = extras.zzz ? "" : "none";
  $id("fxHearts").style.display = extras.hearts ? "" : "none";
  $id("fxSparkle").style.display = extras.sparkle ? "" : "none";
  $id("faceWrap").classList.toggle("shake", !!extras.shake);
}

function render(now) {
  const v = {};
  for (const k of NUMKEYS) v[k] = cur[k];
  let bv = 0;
  if (blinkStart >= 0) {
    const t = (now - blinkStart) / 280;
    bv = t >= 1 ? 0 : Math.sin(Math.PI * Math.min(1, t));
    if (t >= 1) blinkStart = -1;
  }
  v.blinkV = cfg.eyeMode === "normal" ? bv : 0;

  const skin = SKINS[cfg.skinIdx][1];
  $id("eyeL").innerHTML = eyeInner(-1, v, skin);
  $id("eyeR").innerHTML = eyeInner(1, v, skin);
  $id("eyeL").setAttribute("transform", "translate(152,208)");
  $id("eyeR").setAttribute("transform", "translate(248,208)");

  $id("browL").setAttribute("d", browD(-1, v));
  $id("browR").setAttribute("d", browD(1, v));
  $id("browL").setAttribute("stroke-width", v.brW);
  $id("browR").setAttribute("stroke-width", v.brW);

  noseRender(v);
  mouthRender(v);

  const bOp = (v.bl * 0.55).toFixed(3);
  for (const id of ["blushL", "blushR"]) {
    $id(id).setAttribute("opacity", bOp);
  }
  fxRender(cfg.extras);
}

function settled() {
  for (const k of NUMKEYS) if (Math.abs(tgt[k] - cur[k]) > 0.001) return false;
  return true;
}

function loop(now) {
  if (blinkStart < 0 && now > nextBlinkAt) {
    blinkStart = now;
    nextBlinkAt = now + 2600 + Math.random() * 3800;
    needsRender = true;
  }
  if (!settled()) {
    for (const k of NUMKEYS) {
      cur[k] += (tgt[k] - cur[k]) * 0.14;
      if (Math.abs(tgt[k] - cur[k]) <= 0.001) cur[k] = tgt[k];
    }
    needsRender = true;
  }
  if (needsRender) {
    render(now);
    needsRender = false;
  }
  requestAnimationFrame(loop);
}

function syncUI() {
  document.querySelectorAll("input[type=range][data-k]").forEach((inp) => {
    inp.value = tgt[inp.dataset.k];
    inp.nextElementSibling.textContent = fmt(tgt[inp.dataset.k]);
  });
  $id("eyeModeS").value = cfg.eyeMode;
  $id("hairS").value = cfg.hair;
  $id("noseS").value = cfg.nose;
  $id("wavyC").checked = !!cfg.wavy;
  $id("tongueC").checked = !!cfg.extras.tongue;
}

function markActive(idx) {
  document.querySelectorAll("#exprGrid button").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
  });
}

function applyExpr(idx) {
  exprIdx = idx;
  const e = EXPR[idx];
  const n = Object.assign({}, NUMDEFS, e.n || {});
  for (const k of NUMKEYS) tgt[k] = n[k];
  cfg.eyeMode = e.m || "normal";
  cfg.wavy = !!e.w;
  cfg.extras = Object.assign({}, e.x || {});
  syncUI();
  markActive(idx);
  needsRender = true;
}

function buildExprGrid() {
  const grid = $id("exprGrid");
  grid.innerHTML = EXPR.map((e, i) => `<button>${e.name}</button>`).join("");
  grid.querySelectorAll("button").forEach((b, i) => {
    b.addEventListener("click", () => { stopAuto(); applyExpr(i); });
  });
}

function buildSwatches(rowId, colors, key, getSel, onPick) {
  const row = $id(rowId);
  row.innerHTML = colors.map((c, i) => `<button class="sw" data-i="${i}" style="background:${c}" title="${c}"></button>`).join("");
  row.querySelectorAll(".sw").forEach((b) => {
    b.addEventListener("click", () => {
      cfg[key] = parseInt(b.dataset.i, 10);
      row.querySelectorAll(".sw").forEach((x) => x.classList.remove("sel"));
      b.classList.add("sel");
      onPick();
    });
    if (getSel() === parseInt(b.dataset.i, 10)) b.classList.add("sel");
  });
}

function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; $id("autoB").classList.remove("on"); }
}

function toggleAuto() {
  if (autoTimer) stopAuto();
  else {
    autoTimer = setInterval(() => applyExpr((exprIdx + 1) % EXPR.length), 1500);
    $id("autoB").classList.add("on");
  }
}

function init() {
  buildExprGrid();
  buildSwatches("hairSw", HAIRC, "hairIdx", () => cfg.hairIdx, () => { applyPalette(); needsRender = true; });
  buildSwatches("skinSw", SKINS.map((s) => s[1]), "skinIdx", () => cfg.skinIdx, () => { applyPalette(); needsRender = true; });
  buildSwatches("eyeSw", EYEC, "eyeIdx", () => cfg.eyeIdx, () => { needsRender = true; });
  buildSwatches("shirtSw", SHIRTC, "shirtIdx", () => cfg.shirtIdx, () => { applyPalette(); needsRender = true; });

  document.querySelectorAll("input[type=range][data-k]").forEach((inp) => {
    inp.addEventListener("input", () => {
      tgt[inp.dataset.k] = parseFloat(inp.value);
      inp.nextElementSibling.textContent = fmt(parseFloat(inp.value));
      markActive(-1);
      needsRender = true;
    });
  });

  $id("eyeModeS").addEventListener("change", (e) => { cfg.eyeMode = e.target.value; needsRender = true; });
  $id("hairS").addEventListener("change", (e) => { cfg.hair = e.target.value; applyPalette(); needsRender = true; });
  $id("noseS").addEventListener("change", (e) => { cfg.nose = e.target.value; needsRender = true; });
  $id("wavyC").addEventListener("change", (e) => { cfg.wavy = e.target.checked; needsRender = true; });
  $id("tongueC").addEventListener("change", (e) => { cfg.extras.tongue = e.target.checked; needsRender = true; });

  $id("prevB").addEventListener("click", () => { stopAuto(); applyExpr((exprIdx - 1 + EXPR.length) % EXPR.length); });
  $id("nextB").addEventListener("click", () => { stopAuto(); applyExpr((exprIdx + 1) % EXPR.length); });
  $id("randB").addEventListener("click", () => {
    stopAuto();
    let r; do { r = Math.floor(Math.random() * EXPR.length); } while (r === exprIdx);
    applyExpr(r);
  });
  $id("autoB").addEventListener("click", toggleAuto);

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { stopAuto(); applyExpr((exprIdx + 1) % EXPR.length); }
    else if (e.key === "ArrowLeft") { stopAuto(); applyExpr((exprIdx - 1 + EXPR.length) % EXPR.length); }
    else if (e.key === "r" || e.key === "R") { $id("randB").click(); }
  });

  applyPalette();
  applyExpr(4);
  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
