<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motorcycle Decal Designer</title>
<style>
:root{--bg:#15171b;--pan:#1d2026;--pan2:#262a32;--line:#343944;--tx:#e6e8ec;--mut:#98a0ad;--hi:#ff7a1a;
  --c0:#d3122a;--c1:#1a1a1d;--c2:#f7c600;--c3:#101012;--c4:#f4f4f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:372px minmax(0,1fr);height:100vh}
#side{background:var(--pan);border-right:1px solid var(--line);overflow-y:auto;padding:10px 12px 40px}
#side h1{font-size:16px;margin:2px 0 2px;letter-spacing:.02em}
#side .sub{color:var(--mut);margin:0 0 10px}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#c7ccd6;padding:2px 0 6px;user-select:none}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;align-items:center;gap:8px;min-height:26px}
.row.wide{grid-template-columns:118px minmax(0,1fr)}
.row label{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row output{text-align:right;font-variant-numeric:tabular-nums;color:#cfd4dc}
input[type=range]{width:100%;accent-color:var(--hi);margin:0}
select,input[type=text],button{font:inherit;color:var(--tx);background:var(--pan2);border:1px solid var(--line);border-radius:5px;padding:4px 7px}
select,input[type=text]{width:100%;min-width:0}
button{cursor:pointer}
button:hover{border-color:#5a6272}
button.on{background:var(--hi);border-color:var(--hi);color:#160a00;font-weight:600}
.bikes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bikes button{text-align:left;padding:6px 8px;line-height:1.2}
.bikes button small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.bikes button.on small{color:#4a2500}
.slots{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.sw{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #0006;flex:none}
.sw.on{outline:2px solid #fff;outline-offset:1px}
input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;flex:none}
input[type=color].on{outline:2px solid #fff;outline-offset:1px}
.themecols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 2px}
.themecols div{text-align:center;color:var(--mut);font-size:10.5px}
.themecols input{width:100%;height:30px;display:block;margin-bottom:3px}
.layers{display:flex;flex-direction:column;gap:3px;margin:4px 0 8px}
.lay{display:grid;grid-template-columns:20px minmax(0,1fr) repeat(4,24px);gap:3px;align-items:center;background:var(--pan2);border:1px solid var(--line);border-radius:5px;padding:3px 4px;cursor:pointer}
.lay.sel{border-color:var(--hi);background:#33291f}
.lay span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay button{padding:1px 0;font-size:12px;line-height:18px}
.grp{color:#c7ccd6;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin:10px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:3px 8px;font-size:12px}
.hint{color:var(--mut);font-size:12px;margin:6px 0}
.loadrow{margin-top:8px}.loadrow button{width:100%}
.parts{display:flex;flex-direction:column;gap:4px}
.part{display:grid;grid-template-columns:16px minmax(0,1fr) 168px;gap:6px;align-items:center}
.part i{width:16px;height:16px;border-radius:3px;border:1px solid #0008}
.part span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view.drop::after{content:'Drop the .glb file to load it';position:absolute;inset:10px;border:2px dashed var(--hi);border-radius:10px;display:grid;place-items:center;font-size:18px;background:#0008;pointer-events:none}
#stage{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;min-width:0;height:100vh}
#top{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--pan);flex-wrap:wrap}
#top .sp{flex:1}
#view{position:relative;min-height:0;overflow:hidden}
#gl{display:block;width:100%;height:100%}
#sheet{position:absolute;inset:0;overflow:auto;background:#3a3d44;padding:16px}
#sheet svg{display:block;width:100%;height:auto;background:#fff;box-shadow:0 4px 24px #0008}
#note{position:absolute;left:12px;bottom:10px;color:#ffffffb0;font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#ffb4a8}
#gal{background:var(--pan);border-top:1px solid var(--line);padding:8px 12px 10px}
#galhead{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
#galhead b{white-space:nowrap}
#why{color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:8px;overflow-x:auto;padding-bottom:2px}
.card{background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;text-align:left}
.card.on{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.card canvas{display:block;width:100%;aspect-ratio:8/5;background:#111}
.card span{display:block;padding:3px 7px 5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}#stage{height:auto;grid-template-rows:auto 60vh auto}#side{order:2;border-right:0}}
body.bare #app{grid-template-columns:minmax(0,1fr)}body.bare #stage{grid-template-rows:minmax(0,1fr)}body.bare #side,body.bare #top,body.bare #gal,body.bare #note{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="stage">
    <div id="top">
      <button id="v3d" class="on">3D bike</button><button id="vsheet">Decal sheet</button>
      <button id="reset">Reset view</button>
      <span class="sp"></span>
      <button id="savePng">Save bike PNG</button><button id="saveSvg">Save sheet SVG</button><button id="saveSheetPng">Save sheet PNG</button>
    </div>
    <div id="view">
      <canvas id="gl"></canvas>
      <div id="sheet" hidden></div>
      <div id="note">Drag to orbit, scroll to zoom. Double-click the bike to move the selected layer there.</div>
      <div id="err" hidden></div>
    </div>
    <div id="gal">
      <div id="galhead"><b id="galtitle">Proposals</b><span id="why"></span><button id="more">More proposals</button></div>
      <div id="cards"></div>
    </div>
  </main>
</div>

<script id="shared-code">
// Motorcycle Decal Designer: bikes, layer generators, proposals and the decal sheet. Pure JS, no DOM, no three.js.
"use strict";
const OX=1100, OY=1350;                       // template origin in mm: x forward from the bike centre, y up from the ground
const mmX=x=>OX+x*1000, mmY=y=>OY-y*1000;
const f1=n=>String(Math.round(n*10)/10), f2=n=>String(Math.round(n*100)/100);
const lerp=(a,b,t)=>a+(b-a)*t;
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const SLOT_NAMES=['Primary','Secondary','Accent','Dark','Light'];
const THEMES=[
 {name:'Race red',c:['#d3122a','#1a1a1d','#f7c600','#101012','#f4f4f2']},
 {name:'Team blue',c:['#0b46b8','#19b0ff','#ffd21a','#0b1022','#f5f7fa']},
 {name:'Lime works',c:['#5cd40a','#16181a','#f2ff3a','#0c0d0c','#f1f5ee']},
 {name:'Hot rod',c:['#7a0c12','#ff7a00','#ffd400','#0d0d0f','#fff3d6']},
 {name:'Neon night',c:['#16122b','#ff2bd6','#19f0ff','#07060f','#eaeaff']},
 {name:'Stealth',c:['#1c1d20','#3a3d42','#ff3b1f','#0a0a0b','#b9bcc2']},
 {name:'Heritage green',c:['#0e3b2a','#c9a227','#b3261e','#101210','#faf5e6']},
 {name:'Endurance',c:['#1b3c8c','#d21f2b','#f2c400','#12131a','#f4f4f0']},
 {name:'Sunset',c:['#ff5a1f','#7a1fa2','#ffc21a','#1a1020','#fff1dc']},
 {name:'Arctic',c:['#2a7fc0','#9fd0ea','#ff7043','#1d2730','#f4f8fb']},
 {name:'Papaya',c:['#ff8a00','#00a0b8','#111318','#0c0d10','#f6f6f6']},
 {name:'Violet pearl',c:['#5b2a9d','#c0c4cc','#ff3d8b','#120a1c','#f3effa']}
];

const PANELS=['nose','fairing','tank','tail','fender','belly'];
const PANEL_NAMES={nose:'Nose',fairing:'Side fairing',tank:'Tank',tail:'Tail',fender:'Front fender',belly:'Belly pan'};

const BIKES=[
 {id:'ss600',name:'SS-600 Supersport',blurb:'Sharp nose, high tail',wb:1.38,rF:.30,rR:.31,tF:.06,tR:.09,rake:24,fork:.62,noseLen:0,noseDrop:-.01,screenH:.16,tankH:0,tailLen:0,tailRise:.03,tailBulk:0,fairLow:0,fairRear:0,width:1,blunt:0,e:.62,sy:.80,lamps:'slant',exh:'belly',spokes:5,mirrors:true,likes:['works','arrows','halftone','bolt']},
 {id:'hx1300',name:'HX-1300 Hypersport',blurb:'Long, low and rounded',wb:1.48,rF:.30,rR:.31,tF:.06,tR:.095,rake:25,fork:.62,noseLen:.06,noseDrop:-.05,screenH:.15,tankH:-.01,tailLen:.05,tailRise:-.03,tailBulk:.05,fairLow:.02,fairRear:-.05,width:1.08,blunt:.25,e:.72,sy:.79,lamps:'stack',exh:'sidebig',spokes:3,mirrors:true,likes:['flames','ghost','wave','stealth']},
 {id:'rc750',name:"RC-750 '90s Superbike",blurb:'Twin lamps, underseat pipes',wb:1.40,rF:.30,rR:.31,tF:.06,tR:.09,rake:24,fork:.62,noseLen:-.02,noseDrop:0,screenH:.18,tankH:.02,tailLen:-.02,tailRise:0,tailBulk:.03,fairLow:0,fairRear:0,width:1.02,blunt:.55,e:.55,sy:.80,lamps:'round2s',exh:'under',spokes:3,mirrors:true,likes:['slash','works','chequer','wave']},
 {id:'gp1000',name:"GP-1000 '80s Endurance",blurb:'Boxy fairing, bubble screen',wb:1.46,rF:.31,rR:.31,tF:.055,tR:.075,rake:27,fork:.64,noseLen:-.03,noseDrop:.02,screenH:.23,tankH:.03,tailLen:.04,tailRise:-.06,tailBulk:.04,fairLow:0,fairRear:0,width:1.06,blunt:1,e:.42,sy:.80,lamps:'round2',exh:'side',spokes:3,mirrors:false,likes:['tricolour','stripes','works','slash']},
 {id:'rs300',name:'RS-300 Lightweight',blurb:'Small, upright, narrow',wb:1.30,rF:.285,rR:.29,tF:.05,tR:.07,rake:25,fork:.58,noseLen:-.03,noseDrop:0,screenH:.15,tankH:-.02,tailLen:-.08,tailRise:.05,tailBulk:0,fairLow:-.01,fairRear:.03,width:.88,blunt:.1,e:.62,sy:.77,lamps:'slant',exh:'side',spokes:5,mirrors:true,likes:['arrows','bolt','halftone','stripes']}
];

// Catmull-Rom over rows of channels, N+1 samples
function crSample(rows,N){
  const n=rows.length,out=[];
  for(let i=0;i<=N;i++){
    const f=i/N*(n-1),k=Math.min(n-2,Math.floor(f)),t=f-k;
    const p0=rows[Math.max(0,k-1)],p1=rows[k],p2=rows[k+1],p3=rows[Math.min(n-1,k+2)];
    out.push(p1.map((b,c)=>{const a=p0[c],cc=p2[c],d=p3[c];return 0.5*(2*b+(-a+cc)*t+(2*a-5*b+4*cc-d)*t*t+(-a+3*b-3*cc+d)*t*t*t);}));
  }
  return out;
}
function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function polyD(p){ if(polyArea(p)<0)p=p.slice().reverse(); let d='M'+f1(p[0][0])+' '+f1(p[0][1]); for(let i=1;i<p.length;i++)d+='L'+f1(p[i][0])+' '+f1(p[i][1]); return d+'Z';}
function lineD(p,close){let d='M'+f1(p[0][0])+' '+f1(p[0][1]);for(let i=1;i<p.length;i++)d+='L'+f1(p[i][0])+' '+f1(p[i][1]);return d+(close?'Z':'');}

const NS=30;
// A panel is a strip between a bottom and a top side-view curve. rows: [xb,yb,xt,yt,w] (shell/keel) or [xb,yb,xt,yt,wBot,wTop] (slab), metres.
function buildBike(S){
  const af=[S.wb/2,S.rF],ar=[-S.wb/2,S.rR],rk=S.rake*Math.PI/180;
  const hx=af[0]-S.fork*Math.sin(rk),hy=af[1]+S.fork*Math.cos(rk),W=S.width;
  const nl=S.noseLen,nd=S.noseDrop,sh=S.screenH,th=S.tankH,tl=S.tailLen,tr=S.tailRise,tb=S.tailBulk,fl=S.fairLow,fr=S.fairRear,bl=S.blunt,sy=S.sy;
  const tipH=0.02+bl*0.17,tx=hx+0.34+nl,ty=hy-0.10+nd;
  const arc=(c,r,a)=>[c[0]+r*Math.cos(a*Math.PI/180),c[1]+r*Math.sin(a*Math.PI/180)];
  const P=[];
  P.push({id:'nose',kind:'shell',paint:true,rows:[
    [hx-0.12,hy-0.17,hx-0.05,hy+0.09,0.165*W],
    [hx+0.08,hy-0.21,hx+0.10,hy+0.07,0.165*W],
    [hx+0.23,hy-0.185+nd*0.5,hx+0.24,hy+nd*0.5,(0.125+bl*0.03)*W],
    [tx-0.035,ty-0.02-tipH/2,tx-0.035,ty+0.025+tipH/2,(0.07+bl*0.075)*W],
    [tx,ty-tipH/2,tx,ty+tipH/2,(0.012+bl*0.11)*W],
    [tx+0.012+bl*0.01,ty-tipH*0.4,tx+0.012+bl*0.01,ty+tipH*0.4,0.002]]});
  P.push({id:'screen',kind:'shell',paint:false,rows:[
    [hx-0.05,hy+0.075,hx-0.10,hy+0.075+sh,0.13*W],
    [hx+0.09,hy+0.055,hx+0.03,hy+0.055+sh*0.78,0.125*W],
    [hx+0.21,hy+0.005+nd*0.45,hx+0.19,hy+0.02+sh*0.22+nd*0.45,0.09*W],
    [hx+0.27,hy-0.04+nd*0.6,hx+0.275,hy-0.035+nd*0.6,0.02*W]]});
  const f0p=arc(af,S.rF+0.045,100),f1p=arc(af,S.rF+0.06,125),f2p=arc(af,S.rF+0.07,168);
  P.push({id:'fairing',kind:'slab',paint:true,rows:[
    [f0p[0],f0p[1],hx+0.29,Math.max(hy-0.17,f0p[1]+0.06),0.10*W,0.115*W],
    [f1p[0],f1p[1],hx+0.17,hy-0.165,0.115*W,0.14*W],
    [f2p[0],f2p[1],hx+0.02,hy-0.15,0.125*W,0.16*W],
    [0.24,0.27-fl,hx-0.14,hy-0.14,0.12*W,0.17*W],
    [0.0,0.25-fl,0.05,0.725,0.115*W,0.17*W],
    [-0.20+fr,0.28-fl,-0.10+fr,0.70,0.11*W,0.16*W],
    [-0.30+fr,0.38,-0.21+fr,0.56,0.11*W,0.14*W]]});
  P.push({id:'belly',kind:'keel',paint:true,rows:[
    [0.30,0.215-fl,0.33,0.30-fl*0.5,0.05*W],
    [0.16,0.15-fl,0.17,0.30-fl*0.5,0.105*W],
    [-0.12+fr*0.5,0.15-fl,-0.12+fr*0.5,0.30-fl*0.5,0.105*W],
    [-0.30+fr*0.5,0.23-fl,-0.31+fr*0.5,0.33,0.06*W]]});
  P.push({id:'tank',kind:'shell',paint:true,rows:[
    [hx-0.10,0.74,hx-0.11,0.87+th*0.4,0.09*W],
    [hx-0.22,0.72,hx-0.24,0.975+th,0.155*W],
    [hx-0.42,0.72,hx-0.42,0.96+th,0.165*W],
    [hx-0.57,sy-0.08,hx-0.585,sy+0.07+th*0.3,0.125*W],
    [hx-0.63,sy-0.06,hx-0.64,sy,0.08*W]]});
  P.push({id:'tail',kind:'shell',paint:true,rows:[
    [hx-0.58,sy-0.13,hx-0.62,sy-0.03,0.10*W],
    [hx-0.80,sy-0.09,hx-0.80,sy-0.005,0.13*W],
    [hx-0.98,sy-0.03+tr*0.4,hx-0.97,sy+0.07+tr*0.5+tb,0.115*W],
    [hx-1.18-tl*0.6,sy+0.04+tr*0.8,hx-1.18-tl*0.6,sy+0.15+tr+tb*0.6,0.085*W],
    [hx-1.30-tl,sy+0.09+tr,hx-1.30-tl,sy+0.17+tr,0.04*W]]});
  P.push({id:'seat',kind:'shell',paint:false,rows:[
    [hx-0.60,sy-0.03,hx-0.60,sy+0.02,0.10*W],
    [hx-0.76,sy-0.04,hx-0.76,sy+0.012,0.135*W],
    [hx-0.93,sy-0.02,hx-0.93,sy+0.035+tr*0.3,0.11*W]]});
  const fend=(c,r,w,angs,id,paint)=>P.push({id,kind:'shell',paint,rows:angs.map((a,i)=>{const b=arc(c,r+0.012,a),t=arc(c,r+0.04,a),e=(i===0||i===angs.length-1)?0.72:1;return [b[0],b[1],t[0],t[1],(w+0.018)*e];})});
  fend(af,S.rF,S.tF,[152,128,104,80,56,30],'fender',true);
  fend(ar,S.rR,S.tR,[140,120,100,80,62],'hugger',false);
  for(const p of P){
    p.e=S.e; p.st=crSample(p.rows,NS); for(const r of p.st){for(let c=4;c<r.length;c++)r[c]=Math.max(0.0008,r[c]);}
    const o=[]; for(let i=0;i<=NS;i++)o.push([mmX(p.st[i][0]),mmY(p.st[i][1])]); for(let i=NS;i>=0;i--)o.push([mmX(p.st[i][2]),mmY(p.st[i][3])]);
    const q=[]; for(const a of o){const b=q[q.length-1]; if(!b||Math.hypot(a[0]-b[0],a[1]-b[1])>0.6)q.push(a);}
    p.out=q; p.d=polyD(q);
    let X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9,cx=0,cy=0,A=0;
    for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length],k=a[0]*b[1]-b[0]*a[1];A+=k;cx+=(a[0]+b[0])*k;cy+=(a[1]+b[1])*k;X0=Math.min(X0,a[0]);Y0=Math.min(Y0,a[1]);X1=Math.max(X1,a[0]);Y1=Math.max(Y1,a[1]);}
    p.bb={X0:Math.floor(X0-5),Y0:Math.floor(Y0-5),X1:Math.ceil(X1+5),Y1:Math.ceil(Y1+5)}; p.bb.w=p.bb.X1-p.bb.X0; p.bb.h=p.bb.Y1-p.bb.Y0;
    p.anc=[cx/(3*A)-OX,OY-cy/(3*A)];
  }
  const by={}; for(const p of P)by[p.id]=p;
  const anc={}; for(const id of PANELS)anc[id]=by[id].anc;
  const tailTip=by.tail.rows[4];
  const sweep=Math.atan2(0.27-fl-tailTip[3],0.24-tailTip[2])*180/Math.PI*0.8;
  const belt=Math.atan2(anc.nose[1]-anc.tail[1],anc.nose[0]-anc.tail[0])*180/Math.PI;
  return {spec:S,panels:P,by,paintPanels:PANELS.map(id=>by[id]),anc,sweep,belt,af,ar,head:[hx,hy],tailTip:[tailTip[2],tailTip[3]]};
}

// Texture atlas: one tile per paintable panel, largest scale (px per mm) that fits.
function packTiles(B,size,pad){
  const ps=B.paintPanels.slice().sort((a,b)=>b.bb.h-a.bb.h);
  for(let k=2.0;k>0.3;k-=0.02){
    let x=pad,y=pad,rowH=0,ok=true;const tiles={};
    for(const p of ps){
      const w=Math.ceil(p.bb.w*k),h=Math.ceil(p.bb.h*k);
      if(x+w+pad>size){x=pad;y+=rowH+pad;rowH=0;}
      if(x+w+pad>size||y+h+pad>size){ok=false;break;}

GEN.dots=(L,G)=>{

function insetPoly(pts,dist){
  const n=pts.length,sg=polyArea(pts)>0?1:-1,out=[];

    const k=dist/Math.max(0.5,m[0]*n1[0]+m[1]*n1[1]);out.push([b[0]+m[0]*k,b[1]+m[1]*k]);

function layerRecs(L,B,C){

    return {sc,col,B,th,T:(u,v)=>{u*=sc;v*=sc*fv;return [AX+u*cs-v*sn,AY-(u*sn+v*cs)];}};};
  const items=GEN[L.type](L,mk(0,0)),op=L.op==null?1:L.op,out=[],o=it=>it.op==null?1:it.op;
  if(L.sh>0&&L.type!=='pin')for(const it of GEN[L.type](L,mk(L.sh*0.8,L.sh))){const r=Object.assign({},it,{op:o(it)*L.sho*op});if(r.fill)r.fill='#000000';if(r.stroke)r.stroke='#000000';out.push(r);}

  return out;

const STYLE_KEYS=Object.keys(STYLES);
function propose(key,B,seed){
  const R=rng32(seed*2654435761%4294967296),j=a=>(R()*2-1)*a,st=STYLES[key],p=st.make(B,R,j);
  return {key,name:st.name,why:st.why,base:p.base,layers:p.layers,trim:Object.assign({},DEF_TRIM,p.trim||{}),finish:Object.assign({},DEF_FINISH,p.finish||{})};
}
// Eight proposals: the bike's favourites first, the rest rotating with the page.
function proposalSet(B,page){
  const likes=B.spec.likes,rest=STYLE_KEYS.filter(k=>likes.indexOf(k)<0),keys=likes.slice();
  for(let i=0;i<4;i++)keys.push(rest[(page*4+i)%rest.length]);
  return keys.map((k,i)=>propose(k,B,page*97+i*13+1));
}

// ───────── decal sheet (SVG, millimetres) ─────────
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function recSVG(r,flip,defs){
  const op=(r.op!=null&&r.op<0.999)?' opacity="'+f2(r.op)+'"':'';
  if(r.text!=null){
    return '<text transform="translate('+f1(r.x)+' '+f1(r.y)+') rotate('+f1(-r.ang*180/Math.PI)+')'+(flip?' scale(-1 1)':'')+' skewX('+f1(-r.skew*180/Math.PI)+')" font-family="'+esc(r.font)+'" font-weight="'+r.weight+'" font-size="'+f1(r.size)+'" letter-spacing="'+f1(r.ls)+'" text-anchor="middle" dominant-baseline="central" fill="'+r.fill+'"'+(r.stroke?' stroke="'+r.stroke+'" stroke-width="'+f1(r.sw)+'" stroke-linejoin="round" paint-order="stroke"':'')+op+'>'+esc(r.text)+'</text>';
  }
  if(r.fill){let f=r.fill;
    if(typeof f!=='string'){const id='gr'+defs.length;defs.push('<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+f1(f.g[0])+'" y1="'+f1(f.g[1])+'" x2="'+f1(f.g[2])+'" y2="'+f1(f.g[3])+'"><stop offset="0" stop-color="'+f.c[0]+'"/><stop offset="1" stop-color="'+f.c[1]+'"/></linearGradient>');f='url(#'+id+')';}
    return '<path d="'+r.d+'" fill="'+f+'"'+op+'/>';}
  return '<path d="'+r.d+'" fill="none" stroke="'+r.stroke+'" stroke-width="'+f1(r.sw)+'" stroke-linejoin="'+(r.join||'miter')+'"'+op+'/>';
}
function sheetSVG(D,B,recs,title){
  const col=v=>(typeof v==='string'&&v[0]==='c')?D.colors[+v[1]]:v;
  const SW=2500,M=50,GAP=50,LAB=58,defs=[],body=[];
  const hasText=recs.map(rs=>rs.some(r=>r.text!=null));
  recs.forEach((rs,i)=>{ if(D.layers[i].off)return;
    defs.push('<g id="la'+i+'">'+rs.map(r=>recSVG(r,false,defs)).join('')+'</g>');
    if(hasText[i])defs.push('<g id="lb'+i+'">'+rs.map(r=>recSVG(r,true,defs)).join('')+'</g>');});
  for(const p of B.paintPanels)defs.push('<clipPath id="cp_'+p.id+'"><path d="'+p.d+'"/></clipPath>');
  const pieces=[];for(const side of ['right','left'])for(const p of B.paintPanels)if(!p.empty)pieces.push({p,side});
  pieces.sort((a,b)=>b.p.bb.h-a.p.bb.h);
  let x=M,y=M+70,rowH=0;
  for(const pc of pieces){
    const bb=pc.p.bb; if(x+bb.w+M>SW){x=M;y+=rowH+LAB+GAP;rowH=0;}
    const tf=pc.side==='right'?'translate('+(x-bb.X0)+' '+(y-bb.Y0)+')':'translate('+(x+bb.X1)+' '+(y-bb.Y0)+') scale(-1 1)';
    let g='<g transform="'+tf+'"><g clip-path="url(#cp_'+pc.p.id+')"><rect x="'+bb.X0+'" y="'+bb.Y0+'" width="'+bb.w+'" height="'+bb.h+'" fill="'+col(D.base[pc.p.id])+'"/>';
    D.layers.forEach((L,i)=>{if(!L.off&&L.panels[pc.p.id])g+='<use href="#'+(pc.side==='left'&&hasText[i]?'lb':'la')+i+'"/>';});
    g+='</g><path d="'+pc.p.d+'" fill="none" stroke="#e6007e" stroke-width="1.2"/></g>';
    g+='<text x="'+x+'" y="'+(y+bb.h+30)+'" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222">'+PANEL_NAMES[pc.p.id]+', '+pc.side+' side · '+(bb.w-10)+' × '+(bb.h-10)+' mm</text>';
    body.push(g);x+=bb.w+GAP;rowH=Math.max(rowH,bb.h);
  }
  const SH=y+rowH+LAB+90;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+SW+'mm" height="'+SH+'mm" viewBox="0 0 '+SW+' '+SH+'"><defs>'+defs.join('')+'</defs><rect width="'+SW+'" height="'+SH+'" fill="#ffffff"/>'
   +'<text x="'+M+'" y="'+(M+26)+'" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#111">'+esc(title)+'</text>'
   +body.join('')
   +'<g transform="translate('+M+' '+(SH-48)+')"><path d="M0 0H100M0 -8V8M100 -8V8" stroke="#111" stroke-width="2" fill="none"/><text x="116" y="8" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#222">100 mm · magenta line is the cut line · pieces are side projections of curved panels, so allow extra where a panel wraps over the top</text></g></svg>';
}

// ───────── painting the atlas ─────────
function drawRec(ctx,r,flip){
  ctx.globalAlpha=r.op==null?1:r.op;
  if(r.text!=null){
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(-r.ang);if(flip)ctx.scale(-1,1);ctx.transform(1,0,-Math.tan(r.skew),1,0,0);
    ctx.font=r.weight+' '+r.size+'px '+r.font;ctx.textAlign='center';ctx.textBaseline='middle';
    if('letterSpacing' in ctx)ctx.letterSpacing=r.ls+'px';
    if(r.stroke){ctx.lineJoin='round';ctx.lineWidth=r.sw;ctx.strokeStyle=r.stroke;ctx.strokeText(r.text,0,0);}
    ctx.fillStyle=r.fill;ctx.fillText(r.text,0,0);ctx.restore();return;
  }
  const p=r._p||(r._p=new Path2D(r.d));
  if(r.fill){
    if(typeof r.fill==='string')ctx.fillStyle=r.fill;else{const g=ctx.createLinearGradient(r.fill.g[0],r.fill.g[1],r.fill.g[2],r.fill.g[3]);g.addColorStop(0,r.fill.c[0]);g.addColorStop(1,r.fill.c[1]);ctx.fillStyle=g;}
    ctx.fill(p);
  }else{ctx.strokeStyle=r.stroke;ctx.lineWidth=r.sw;ctx.lineJoin=r.join||'miter';ctx.stroke(p);}
}
function paint(ctx,D,flip){
  const k=S.pack.k;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#222';ctx.fillRect(0,0,SZ,SZ);
  for(const p of S.B.paintPanels){
    const t=S.pack.tiles[p.id];ctx.save();ctx.beginPath();ctx.rect(t.x-PAD/2,t.y-PAD/2,t.w+PAD,t.h+PAD);ctx.clip();
    ctx.globalAlpha=1;ctx.fillStyle=col(D.base[p.id]);ctx.fillRect(t.x-PAD,t.y-PAD,t.w+2*PAD,t.h+2*PAD);
    ctx.setTransform(k,0,0,k,t.x-p.bb.X0*k,t.y-p.bb.Y0*k);
    D.layers.forEach((L,i)=>{if(L.off||!L.panels[p.id])return;for(const r of recs[i])drawRec(ctx,r,flip);});
    ctx.restore();
  }
}
function applyDesign(thumb){

// ───────── 3D bike ─────────
function panelGeo(p,tile){
  const st=p.st,NSs=st.length-1,NT=p.kind==='slab'?8:12,pos=[],uv=[],idx=[],k=S.pack.k;
  for(let i=0;i<=NSs;i++){const r=st[i];
    for(let j=0;j<=NT;j++){const t=j/NT;let x,y,z;
      if(p.kind==='slab'){x=lerp(r[0],r[2],t);y=lerp(r[1],r[3],t);z=lerp(r[4],r[5],t)+0.025*Math.sin(Math.PI*t);}
      else{const a=t*Math.PI/2,g=Math.pow(Math.sin(a),p.e),zf=Math.pow(Math.cos(a),p.e);
        if(p.kind==='shell'){x=lerp(r[0],r[2],g);y=lerp(r[1],r[3],g);}else{x=lerp(r[2],r[0],g);y=lerp(r[3],r[1],g);}
        z=r[4]*zf;}
      pos.push(x,y,z);
      if(tile)uv.push((tile.x+(mmX(x)-p.bb.X0)*k)/SZ,1-(tile.y+(mmY(y)-p.bb.Y0)*k)/SZ);else uv.push(0,0);
    }}
  for(let i=0;i<NSs;i++)for(let j=0;j<NT;j++){const a=i*(NT+1)+j,b=a+NT+1;idx.push(a,b,a+1,a+1,b,b+1);}
  const mk=sign=>{const g=new THREE.BufferGeometry(),pp=pos.slice();if(sign<0)for(let i=2;i<pp.length;i+=3)pp[i]=-pp[i];

// ───────── bike / proposals / thumbnails ─────────

function rangeRow(o,e,on){const [k,label,min,max,step]=e,inp=el('input',{type:'range',min,max,step,value:o[k]}),out=el('output',{text:fmt(o[k],step)});

    const pm=t=>new THREE.MeshPhysicalMaterial({map:t,side:THREE.DoubleSide,roughness:0.2,metalness:0.2,clearcoat:1,clearcoatRoughness:0.05,iridescenceIOR:1.6});
    M={paintA:pm(texA),paintB:pm(texB),plastic:std('#17181b',0.55,0.1),engine:std('#222429',0.6,0.5),rubber:std('#0b0b0c',0.92,0),rim:std('#111',0.35,0.6),tape:std('#fc0',0.5,0.1),
      frame:std('#2b2d31',0.4,0.7),fork:std('#c8a13a',0.3,0.8),seat:std('#141416',0.9,0),chrome:std('#d9dde2',0.12,1),steel:std('#b9bdc4',0.3,1),disc:std('#9da2aa',0.35,1),

      tailLamp:new THREE.MeshStandardMaterial({color:'#a00',emissive:'#f01',emissiveIntensity:0.9}),

    const theme=Math.max(0,Math.min(THEMES.length-1,+(Q.get('theme')||0)));
    S.design={bike:0,theme,colors:THEMES[theme].c.slice(),base:allPanels('c0'),layers:[],trim:clone(DEF_TRIM),finish:clone(DEF_FINISH)};
    resize();setBike(Math.max(0,Math.min(BIKES.length-1,+(Q.get('bike')||0))));
