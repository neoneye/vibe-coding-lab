<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161a">
<title>Humanoid Creator</title>
<style>
:root {
  color-scheme: dark;
  --bg: #14161a;
  --panel: #1b1e24;
  --card: #22262e;
  --line: rgba(255,255,255,.09);
  --text: #e9ecef;
  --soft: #b4bcc6;
  --muted: #7c8794;
  --hot: #ff5fa2;
  --hot2: #ffb3d3;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
body { display: grid; grid-template-columns: 384px 1fr; overflow: hidden; }
button, input, select { font: inherit; }
button, input[type="range"], input[type="checkbox"] { accent-color: var(--hot); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
#panel { height: 100vh; overflow-y: auto; padding: 14px 12px 40px 14px; background: var(--panel); border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: #444c58 transparent; }
#stage { position: relative; min-width: 0; height: 100vh; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#view:active { cursor: grabbing; }
#caption { position: absolute; left: 18px; bottom: 14px; right: 18px; color: rgba(255,255,255,.72); font-size: 11.5px; letter-spacing: .04em; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
#caption.dark { color: rgba(0,0,0,.6); text-shadow: none; }
#err { position: absolute; left: 18px; top: 18px; right: 18px; padding: 12px 14px; border-radius: 10px; background: #5a1e2c; color: #fff; }
h1 { margin: 2px 0 4px; font-size: 22px; letter-spacing: -.03em; }
.lead { margin: 0 0 12px; color: var(--soft); line-height: 1.45; font-size: 12px; }
.card { margin-bottom: 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--hot2); user-select: none; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary::after { content: "⌄"; margin-left: auto; color: var(--muted); font-size: 15px; line-height: 1; }
.card:not([open]) > summary::after { transform: rotate(-90deg); }
.card > summary .n { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.card-body { padding: 0 12px 12px; }
.title { padding: 10px 12px 8px; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--hot2); }
button.big { width: 100%; min-height: 46px; border: 1px solid rgba(255,95,162,.7); border-radius: 10px; background: linear-gradient(135deg, #b02a6b, #5a3aa8); color: #fff; font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
button.big:hover { filter: brightness(1.12); }
button.sm { min-height: 32px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.055); color: var(--soft); font-size: 11.5px; font-weight: 650; cursor: pointer; }
button.sm:hover { background: rgba(255,255,255,.12); color: #fff; }
button.sm:active, button.big:active { transform: translateY(1px); }
button.sm:disabled { opacity: .4; cursor: default; }
button.sm.on { border-color: rgba(255,95,162,.7); color: var(--hot2); background: rgba(255,95,162,.12); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.sub { margin: 10px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--soft); font-size: 12px; cursor: pointer; }
.field { margin-top: 9px; }
.field label { display: flex; justify-content: space-between; gap: 10px; color: var(--soft); font-size: 11.5px; }
.field output { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.field input[type="range"] { display: block; width: 100%; margin: 3px 0 0; height: 18px; cursor: pointer; }
.field select { width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #171a1f; cursor: pointer; }
.field.hue input[type="range"] { accent-color: #fff; }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(255,255,255,.25); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
body.bare { grid-template-columns: 1fr; }
body.bare #panel { display: none; }
@media (max-width: 800px) {
  body { grid-template-columns: 1fr; grid-template-rows: 56vh auto; overflow: auto; }
  #stage { height: 56vh; grid-row: 1; }
  body.bare { grid-template-rows: 100vh; }
  body.bare #stage { height: 100vh; }
  #panel { height: auto; grid-row: 2; border-right: 0; border-top: 1px solid var(--line); overflow: visible; }
}
</style>
</head>
<body>
<aside id="panel">
  <h1>Humanoid Creator</h1>
  <p class="lead">A parametric robot figure. Roll the whole body or one part at a time, load a preset, then fine-tune with the sliders. Drag the figure to turn it.</p>

  <div class="card">
    <div class="title">Randomize</div>
    <div class="card-body">
      <button class="big" id="rndAll">Random · all</button>
      <div class="grid4" id="rndParts"></div>
      <label class="check"><input type="checkbox" id="keepSex"> Keep male / female when rolling</label>
      <div class="grid4">
        <button class="sm" id="back" disabled>Back</button>
        <button class="sm" id="copy">Copy link</button>
        <button class="sm" id="save">Save PNG</button>
        <button class="sm" id="spin">Rotate</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">Presets</div>
    <div class="card-body"><div class="grid2" id="presets"></div></div>
  </div>

  <div id="groups"></div>
  <p class="hint">The link in the address bar always holds the current figure, so a bookmark or a copied link brings it back.</p>
</aside>
<main id="stage">
  <canvas id="view"></canvas>
  <div id="caption"></div>
  <div id="err" hidden></div>
</main>

<script id="shared-code">
// Humanoid Creator: parameter table, presets, randomizer and share-link codec. Pure JS, no three.js.
const HM = (() => {
  const GROUPS = [
    ["body", "Body"], ["head", "Head"], ["neck", "Neck"], ["torso", "Torso"], ["abdomen", "Abdomen"], ["hips", "Hips"],
    ["arms", "Arms"], ["hands", "Hands"], ["legs", "Legs"], ["feet", "Feet"], ["colour", "Colours"], ["detail", "Details"],
    ["pose", "Pose"], ["scene", "Scene"],
  ];
  // Groups that "Random · all" rolls. Pose and scene stay as they are.
  const ALL_GROUPS = ["body", "head", "neck", "torso", "abdomen", "hips", "arms", "hands", "legs", "feet", "colour", "detail"];
  const SEG = ["Shell", "Ribbed", "Struts", "Plated frame"];
  const PARAMS = [];
  // IMPORTANT: share links store one byte per parameter in this order. Only ever append new parameters at the end.
  const R = (k, g, label, min, max, def, rnd, hue) => PARAMS.push({ k, g, label, min, max, def, rnd: rnd || [min, max], hue: !!hue });
  const E = (k, g, label, opts, def, w) => PARAMS.push({ k, g, label, opts, def, w });

  R("sex", "body", "Male ↔ female", 0, 1, 1);
  R("build", "body", "Build: slender ↔ heavy", 0, 1, .35);
  R("headSize", "body", "Head size", .8, 1.35, 1, [.88, 1.2]);
  R("torsoLen", "body", "Torso length", .85, 1.2, 1, [.92, 1.1]);
  R("legLen", "body", "Leg length", .85, 1.25, 1.02, [.92, 1.2]);

  E("face", "head", "Face", ["Blank", "Visor", "Lamp eyes", "Mask face", "Cyclops lens", "Lamp eyes and grill"], 1, [1, 2, 2, 3, 1, 1.5]);
  E("headwear", "head", "Headwear", ["None", "Helmet", "Cap", "Bob hair", "Cable hair", "Crest", "Antenna"], 0, [3, 2, 1, 1.5, 1.5, 1, 1]);
  E("ears", "head", "Ears", ["None", "Discs", "Pods"], 0, [3, 1.5, 1]);
  R("headW", "head", "Head width", .8, 1.25, 1, [.88, 1.15]);
  R("headBox", "head", "Head boxiness", 0, 1, .1, [0, .7]);
  R("jaw", "head", "Jaw width", .5, 1.05, .8, [.6, 1]);
  R("cranium", "head", "Cranium length", 0, 1, .1, [0, .8]);
  R("eyeSize", "head", "Eye or visor size", .6, 1.7, 1);
  R("eyeGap", "head", "Eye spacing", .7, 1.4, 1, [.8, 1.25]);
  R("hairLen", "head", "Hair or crest length", .3, 1.7, 1);
  R("lips", "head", "Mask make-up", 0, 1, .7);

  E("neckType", "neck", "Neck", ["Smooth", "Ribbed", "Cables", "Piston spine"], 0);
  R("neckLen", "neck", "Neck length", .6, 2, 1, [.7, 1.7]);
  R("neckW", "neck", "Neck thickness", .55, 1.5, 1, [.6, 1.3]);
  R("collar", "neck", "Collar ring", 0, 1, .3);

  R("shoulders", "torso", "Shoulder width", .8, 1.35, 1, [.86, 1.25]);
  R("chestW", "torso", "Chest width", .8, 1.35, 1, [.88, 1.25]);
  R("chestD", "torso", "Chest depth", .8, 1.5, 1, [.85, 1.35]);
  R("bust", "torso", "Chest fullness", 0, 1.6, .7, [.1, 1.4]);
  R("crop", "torso", "Chest shell: long ↔ cropped", 0, 1, .5);
  R("chestBox", "torso", "Chest boxiness", 0, 1, .15, [0, .7]);
  E("shoulderType", "torso", "Shoulder joint", ["Ball", "Disc", "Pauldron", "Hidden"], 0);
  R("shoulderSize", "torso", "Shoulder joint size", .6, 1.7, 1, [.7, 1.6]);

  E("abType", "abdomen", "Abdomen", ["Shell", "Bellows", "Coil spring", "Cables", "Pistons", "Gear stack"], 0, [2, 1.5, 1.5, 2, 1.5, 1]);
  R("waist", "abdomen", "Waist width", .25, 1.3, .85, [.28, 1.15]);
  R("waistLen", "abdomen", "Abdomen length", .6, 1.9, 1, [.7, 1.7]);
  R("wiring", "abdomen", "Wiring variation", 0, 1, .3);

  E("pelvis", "hips", "Pelvis", ["Smooth shell", "Side plates", "Open frame", "Skirt"], 0, [3, 2, 2, 1]);
  R("hips", "hips", "Hip width", .7, 1.5, 1, [.78, 1.4]);
  R("hipJoint", "hips", "Hip joint size", .6, 1.8, 1, [.7, 1.6]);

  E("upperType", "arms", "Upper arm", SEG, 0);
  E("foreType", "arms", "Forearm", SEG, 0);
  R("armLen", "arms", "Arm length", .85, 1.22, 1, [.9, 1.15]);
  R("upperW", "arms", "Upper arm thickness", .55, 1.7, 1, [.65, 1.5]);
  R("elbow", "arms", "Elbow size", .6, 1.7, 1, [.7, 1.5]);
  R("foreW", "arms", "Forearm thickness", .55, 1.8, 1, [.65, 1.6]);
  R("flare", "arms", "Gauntlet flare", 0, 1, .1);

  E("handType", "hands", "Hands", ["Skeletal", "Gloved", "Gripper", "Ball"], 0, [3, 2, 1, .6]);
  R("handSize", "hands", "Hand size", .75, 1.6, 1, [.85, 1.4]);
  R("fingerLen", "hands", "Finger length", .7, 1.6, 1, [.8, 1.45]);
  R("curl", "hands", "Finger curl", 0, 1, .3, [.05, .7]);

  E("thighType", "legs", "Thigh", SEG, 0, [3, 1, 1, 1.5]);
  E("shinType", "legs", "Shin", SEG, 0, [3, 1, 1, 1.5]);
  R("thigh", "legs", "Thigh thickness", .55, 1.7, 1, [.65, 1.5]);
  R("knee", "legs", "Knee size", .6, 1.7, 1, [.7, 1.5]);
  R("shin", "legs", "Shin thickness", .55, 1.7, 1, [.65, 1.5]);
  R("calf", "legs", "Calf bulge", 0, 1, .4);

  E("footType", "feet", "Feet", ["Boot", "High heel", "Pad", "Two-toe"], 0, [3, 2, 1, 1]);
  R("footSize", "feet", "Foot size", .75, 1.45, 1, [.85, 1.3]);
  R("heel", "feet", "Heel height", 0, 1, .5);

  R("shellHue", "colour", "Shell hue", 0, 1, 0, null, true);
  R("shellSat", "colour", "Shell saturation", 0, 1, 0);
  R("shellLight", "colour", "Shell lightness", .02, .95, .06);
  R("gloss", "colour", "Gloss", 0, 1, .9, [.35, 1]);
  R("metal", "colour", "Metallic", 0, 1, .2);
  E("twoTone", "colour", "Second colour on", ["Nothing", "Legs", "Limbs", "Alternating"], 0, [3, 1, 1, 1]);
  R("secHue", "colour", "Second hue", 0, 1, 0, null, true);
  R("secSat", "colour", "Second saturation", 0, 1, 0);
  R("secLight", "colour", "Second lightness", .02, .95, .85);
  E("frame", "colour", "Frame metal", ["Dark steel", "Chrome", "Bronze", "Black", "White"], 0, [3, 3, 1.5, 2, 1]);
  R("accentHue", "colour", "Accent hue", 0, 1, .95, null, true);
  R("glow", "colour", "Glow", 0, 1, .6);
  R("skin", "colour", "Mask skin: porcelain ↔ dark", 0, 1, .3);
  R("hairHue", "colour", "Hair or cap hue", 0, 1, .92, null, true);
  R("hairLight", "colour", "Hair or cap lightness", .03, .9, .6);
  R("eyeHue", "colour", "Mask eye hue", 0, 1, .4, null, true);

  E("jointStyle", "detail", "Elbow and knee joints", ["Ball", "Disc hinge", "Hidden"], 0);
  E("lights", "detail", "Lights", ["None", "Chest", "Chest and shoulders", "Everywhere"], 0, [2, 2, 2, 1]);
  R("seams", "detail", "Panel seams", 0, 1, .3);
  R("stripes", "detail", "Accent bands", 0, 1, 0, [0, 1]);
  R("wear", "detail", "Wear and grime", 0, 1, 0, [0, .7]);

  R("armSpread", "pose", "Arms out", 0, 1, .12, [.05, .35]);
  R("elbowBend", "pose", "Elbow bend", 0, 1, .1, [0, .5]);
  R("stance", "pose", "Stance width", 0, 1, .32, [.15, .6]);
  R("headTurn", "pose", "Head turn", -1, 1, 0, [-.6, .6]);

  E("backdrop", "scene", "Backdrop", ["Studio grey", "Dark", "White", "Blueprint", "Sunset"], 0);

  const INDEX = Object.fromEntries(PARAMS.map((p, i) => [p.k, i]));
  const defaults = () => Object.fromEntries(PARAMS.map(p => [p.k, p.def]));
  const clampP = (p, v) => p.opts ? Math.min(p.opts.length - 1, Math.max(0, Math.round(v))) : Math.min(p.max, Math.max(p.min, v));

  function mulberry(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function pick(p, rnd) {
    if (p.opts) {
      const w = p.w || p.opts.map(() => 1);
      let x = rnd() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < w.length; i++) { x -= w[i]; if (x < 0) return i; }
      return w.length - 1;
    }
    return p.rnd[0] + (p.rnd[1] - p.rnd[0]) * rnd();
  }

  // Roll the listed groups in place. Everything else in P is left untouched.
  function randomize(P, groups, rnd = Math.random, keepSex = false) {
    const set = new Set(groups);
    for (const p of PARAMS) {
      if (!set.has(p.g)) continue;
      if (p.k === "sex" && keepSex) continue;
      P[p.k] = pick(p, rnd);
    }
    if (set.has("body") && !keepSex) {
      // Mostly clearly male or clearly female, sometimes in between.
      const r = rnd();
      P.sex = r < .42 ? .14 * rnd() : r < .84 ? 1 - .14 * rnd() : .3 + .4 * rnd();
    }
    if (set.has("colour")) {
      // Neutral shells (black, grey, white) about a third of the time, otherwise a saturated paint.
      if (rnd() < .36) { P.shellSat = .06 * rnd(); P.shellLight = [.04, .1, .3, .55, .82, .9][Math.floor(rnd() * 6)]; }
      else { P.shellSat = .35 + .6 * rnd(); P.shellLight = .28 + .4 * rnd(); }
      // Second colour: usually a neutral or a shade of the shell, sometimes a contrasting paint.
      const r2 = rnd();
      if (r2 < .5) { P.secSat = .05 * rnd(); P.secLight = rnd() < .5 ? .05 + .1 * rnd() : .78 + .14 * rnd(); }
      else if (r2 < .75) { P.secHue = P.shellHue; P.secSat = P.shellSat; P.secLight = Math.min(.95, Math.max(.02, P.shellLight + (P.shellLight > .45 ? -.28 : .3))); }
      else { P.secHue = (P.shellHue + .08 + .84 * rnd()) % 1; P.secSat = .3 + .6 * rnd(); P.secLight = .3 + .4 * rnd(); }
      // Accent and hair often pick up the shell hue, so most figures read as one palette.
      if (P.shellSat > .2 && rnd() < .35) P.accentHue = P.shellHue;
      if (P.shellSat > .2 && rnd() < .4) P.hairHue = P.shellHue;
      P.metal = rnd() < .6 ? .25 * rnd() : .6 + .4 * rnd();
    }
    if (set.has("detail")) { P.wear = .6 * rnd() ** 2.2; P.stripes = rnd() ** 1.8; }
    if (set.has("abdomen") && P.abType === 0) P.waist = Math.max(P.waist, .5);
    return P;
  }

  const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  function encode(P) {
    const bytes = PARAMS.map(p => p.opts ? clampP(p, P[p.k]) : Math.round((clampP(p, P[p.k]) - p.min) / (p.max - p.min) * 255));
    let s = "";
    for (let i = 0; i < bytes.length; i += 3) {
      const a = bytes[i], b = bytes[i + 1] ?? 0, c = bytes[i + 2] ?? 0;
      s += B64[a >> 2] + B64[((a & 3) << 4) | (b >> 4)] + B64[((b & 15) << 2) | (c >> 6)] + B64[c & 63];
    }
    return "h1." + PARAMS.length + "." + s;
  }
  // Returns null for anything that is not a link. Links from older versions (fewer parameters) keep defaults for the rest.
  function decode(str) {
    const m = /^h1\.(\d+)\.([A-Za-z0-9_-]+)$/.exec(String(str || "").replace(/^#/, ""));
    if (!m) return null;
    const n = Math.min(+m[1], PARAMS.length), s = m[2], bytes = [];
    for (let i = 0; i + 3 < s.length + 1 && i + 4 <= s.length; i += 4) {
      const q = [0, 1, 2, 3].map(j => B64.indexOf(s[i + j]));
      bytes.push((q[0] << 2) | (q[1] >> 4), ((q[1] & 15) << 4) | (q[2] >> 2), ((q[2] & 3) << 6) | q[3]);
    }
    if (bytes.length < n) return null;
    const P = defaults();
    for (let i = 0; i < n; i++) { const p = PARAMS[i]; P[p.k] = p.opts ? clampP(p, bytes[i]) : p.min + (p.max - p.min) * bytes[i] / 255; }
    return P;
  }

  // Presets are partial: anything not listed keeps its default. Names describe the look, loosely after the owner's reference images.
  const PRESETS = [
    ["Black mannequin", { sex: 1, crop: .2, build: .22, face: 1, eyeSize: 1.1, jaw: .66, headBox: .12, neckLen: 1.25, neckW: .8, collar: .35, bust: .45, waist: .78, hips: 1.12, thigh: 1.22, shin: .95, calf: .5, upperW: .9, foreType: 1, foreW: .85, elbow: .8, knee: .85, handType: 0, footType: 1, heel: .55, shellLight: .035, gloss: 1, metal: .15, frame: 3, accentHue: .95, glow: .7, seams: .2, shoulderSize: .85, legLen: 1.12 }],
    ["Blue helmet", { sex: 1, build: .4, face: 3, headwear: 1, lips: .8, skin: .32, eyeHue: .58, neckType: 2, neckLen: 1.2, bust: 1.15, crop: 0.45, chestD: 1.1, shoulderType: 2, shoulderSize: 1.3, abType: 3, waist: .62, waistLen: 1.3, wiring: .62, pelvis: 1, hips: 1.2, hipJoint: 1.2, upperType: 3, foreType: 0, foreW: 1.25, flare: .45, handType: 0, handSize: 1.15, thigh: 1.25, shellHue: .55, shellSat: .2, shellLight: .52, gloss: .72, metal: .7, frame: 1, wear: .35, seams: .6, backdrop: 1 }],

// ───────────────────────── scene ─────────────────────────
const BACK = [
  { top: "#4a4d52", mid: "#b9bcc0", low: "#6d7075", shadow: .42, exposure: 1 },
  { top: "#050608", mid: "#23272e", low: "#0b0c0f", shadow: .6, exposure: 1 },
  { top: "#dfe2e6", mid: "#ffffff", low: "#e9ebee", shadow: .22, exposure: 1 },
  { top: "#0b2c66", mid: "#184a94", low: "#103a7c", shadow: .3, exposure: 1 },
  { top: "#241338", mid: "#f08a4b", low: "#3a2030", shadow: .5, exposure: 1 },

let backKey = -1;
function applyBackdrop() {

  const b = BACK[P.backdrop], c = document.createElement("canvas"); c.width = 4; c.height = 256; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, b.top); g.addColorStop(.47, b.mid); g.addColorStop(.53, b.mid); g.addColorStop(.62, b.low); g.addColorStop(1, b.low);

}
function rebuild() {

}
function fit(h, aspect = camera.aspect) {

  const half = Math.tan(camera.fov * Math.PI / 360), dist = Math.max(h * .5 * 1.14 / half, lastW * 1.08 / (half * aspect));
  controls.target.set(0, h * .5, 0); camera.position.copy(controls.target).addScaledVector(dir, dist);
  if (Q.get("focus") === "head") { controls.target.set(0, h - .14, 0); camera.position.copy(controls.target).addScaledVector(dir, 1.25); }
  if (Q.get("focus") === "torso") { controls.target.set(0, h * .62, 0); camera.position.copy(controls.target).addScaledVector(dir, 2.6); } camera.updateProjectionMatrix(); controls.update();

function resize() {

}
// Export from a clean portrait canvas: no panel offset, figure centred, current viewing direction kept.
function savePNG() {
  const W = 1500, H = 2000, pr = renderer.getPixelRatio(), size = renderer.getSize(new THREE.Vector2());
  const keep = { pos: camera.position.clone(), tgt: controls.target.clone(), aspect: camera.aspect };
  renderer.setPixelRatio(1); renderer.setSize(W, H, false); camera.aspect = W / H; fit(lastH, W / H);
  renderer.render(scene, camera);

    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "humanoid-" + (presetName || HM.encode(P).slice(-10)).toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".png";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

// Review mode: ?sheet shows every preset in one image, ?sheet=random&seed=3 shows ten rolled figures, &group=head rolls one group.
function sheet() {

  const c = document.createElement("canvas"); c.width = W; c.height = ch * rows; c.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#111;z-index:9";

  renderer.setPixelRatio(1); renderer.setSize(cw, ch, false); camera.aspect = cw / ch; camera.updateProjectionMatrix();
  for (let i = 0; i < cols * rows; i++) {

    camera.position.set(...view);

    controls.autoRotate = true; controls.autoRotateSpeed = 2.2;

    keyLight.shadow.bias = -.0004; keyLight.shadow.normalBias = .012; keyLight.shadow.radius = 5; keyLight.target.position.set(0, .9, 0);
    const rim = new THREE.DirectionalLight(0xcfe0ff, 1.5); rim.position.set(-2.4, 2.2, -2.6);

      roll, frame, resize, renderer: () => renderer, camera: () => camera, controls: () => controls, scene: () => scene, fit: () => fit(lastH), savePNG,
