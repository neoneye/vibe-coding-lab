[package]
name = "tapecheck"
version = "0.1.0"
edition = "2021"
description = "Compiled interval checker for the sweep's proof tapes (dev/sweep_proof.js), a sibling of dev/sweep_proof_arb.py"

[dependencies]
inari = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
