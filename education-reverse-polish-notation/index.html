<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reverse Polish Notation</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --panel2: #f1efe9;
    --line: #e0dcd2;
    --text: #1e1d1a;
    --muted: #6d695f;
    --op: #c4561a;
    --op-bg: #fbe9dd;
    --num: #2763a8;
    --num-bg: #e3edf9;
    --var: #7b45b3;
    --var-bg: #efe6f9;
    --good: #23804a;
    --good-bg: #e2f3e8;
    --bad: #b9382a;
    --bad-bg: #fbe5e1;
    --hl: #e09a00;
    --edge: #b7b1a4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --panel: #1c1c19;
      --panel2: #24231f;
      --line: #34322c;
      --text: #e9e6de;
      --muted: #9c978b;
      --op: #f0965e;
      --op-bg: #3a2516;
      --num: #82b4f0;
      --num-bg: #182a3e;
      --var: #c49af0;
      --var-bg: #2b1f3b;
      --good: #6fcf8f;
      --good-bg: #16301f;
      --bad: #f08a7a;
      --bad-bg: #3a1c17;
      --hl: #f2c14e;
      --edge: #5d594f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  code, .mono { font-family: var(--mono); font-size: 0.93em; }
  code { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  header { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 0.2px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; padding: 18px 22px 60px; max-width: 1180px; }
  nav { position: sticky; top: 14px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 7px; color: var(--text); text-decoration: none; }
  nav a:hover { background: var(--panel2); }
  nav a.on { background: var(--panel); border: 1px solid var(--line); padding: 5px 9px; font-weight: 600; }
  nav a .n { color: var(--muted); font-variant-numeric: tabular-nums; width: 14px; flex: none; }
  nav a .t { flex: 1; }
  nav a .p { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  nav a .p.all { color: var(--good); }
  nav .sep { height: 1px; background: var(--line); margin: 8px 4px; }
  nav .keys { color: var(--muted); font-size: 12.5px; padding: 6px 10px; line-height: 1.6; }
  nav .reset { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px 10px; text-align: left; }
  main { min-width: 0; max-width: 860px; }
  .kicker { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
  h2 { margin: 2px 0 10px; font-size: 26px; }
  h3 { margin: 30px 0 10px; font-size: 18px; }
  .prose p, .prose li { max-width: 72ch; }
  .prose ol.rules { padding-left: 22px; }
  .prose ol.rules li { margin: 4px 0; }
  .aside { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--op); border-radius: 8px; padding: 10px 14px; margin: 14px 0; max-width: 72ch; }
  figure { margin: 14px 0; }
  figcaption { color: var(--muted); font-size: 13.5px; margin-bottom: 6px; }
  .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; font: inherit; font-size: 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.small { padding: 2px 8px; font-size: 12.5px; }
  button.seg.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* chips */
  .chips, .strip { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chip { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; font-family: var(--mono); font-size: 14px; border: 1.5px solid transparent; user-select: none; }
  .chip.num { background: var(--num-bg); color: var(--num); }
  .chip.var { background: var(--var-bg); color: var(--var); }
  .chip.op { background: var(--op-bg); color: var(--op); font-weight: 600; }
  .chip.bad, .chip.\( , .chip.\) { background: var(--bad-bg); color: var(--bad); }
  .strip .chip { cursor: pointer; transition: opacity 0.15s; }
  .strip .chip.todo { opacity: 0.38; }
  .strip .chip.cur { border-color: var(--hl); box-shadow: 0 0 0 2px color-mix(in srgb, var(--hl) 35%, transparent); }
  .strip .chip.err { border-color: var(--bad); opacity: 1; }

  /* viz */
  .viz { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; outline: none; min-width: 0; }
  .viz:focus-visible { border-color: var(--hl); }
  .ctrls { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .ctrls button { padding: 2px 9px; min-width: 34px; }
  .ctrls .counter { color: var(--muted); font-size: 12.5px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .say { min-height: 24px; font-size: 14.5px; }
  .say.bad { color: var(--bad); }
  .stacklbl { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 6px; }
  .stack { display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; padding: 10px 2px 4px; min-height: 70px; }
  .stack .empty { color: var(--muted); font-style: italic; padding: 20px 4px; }
  .scard { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 6px 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .scard.fresh { border-color: var(--hl); animation: pop 0.35s ease-out; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0.2; } to { transform: none; opacity: 1; } }
  .scard .val { font-family: var(--mono); font-size: 17px; font-weight: 600; }
  .scard .inf { font-family: var(--mono); font-size: 12px; color: var(--muted); max-width: 340px; text-align: center; }
  .scard .topt { position: absolute; top: -9px; right: 8px; background: var(--text); color: var(--bg); font-size: 10.5px; border-radius: 6px; padding: 0 6px; line-height: 17px; }
  details.trace summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.trace table { border-collapse: collapse; margin-top: 6px; font-size: 13px; width: 100%; }
  details.trace th { text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding: 3px 8px; }
  details.trace td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  details.trace td .chip { height: 22px; min-width: 22px; font-size: 13px; }
  details.trace tr { cursor: pointer; }
  details.trace tr.todo { opacity: 0.35; }
  details.trace tr.cur { background: color-mix(in srgb, var(--hl) 16%, transparent); }
  details.trace tr.err td { color: var(--bad); }

  /* tree */
  svg.tree { display: block; overflow: visible; }
  svg.tree .eg { stroke: var(--edge); stroke-width: 1.6; }
  svg.tree .eg.new { stroke: var(--hl); stroke-width: 2.4; }
  svg.tree .nd rect { stroke-width: 1.5; }
  svg.tree .nd text { font-family: var(--mono); font-size: 13.5px; text-anchor: middle; }
  svg.tree .nd.num rect { fill: var(--num-bg); stroke: var(--num); }
  svg.tree .nd.num text { fill: var(--num); }
  svg.tree .nd.var rect { fill: var(--var-bg); stroke: var(--var); }
  svg.tree .nd.var text { fill: var(--var); }
  svg.tree .nd.op rect { fill: var(--op-bg); stroke: var(--op); }
  svg.tree .nd.op text { fill: var(--op); font-weight: 600; }
  svg.tree .nd.new rect { stroke: var(--hl); stroke-width: 3; }
  svg.tree .nd.kid rect { stroke-width: 2.6; }
  svg.tree .nd.pending { opacity: 0.35; }
  svg.tree .vt { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
  svg.tree .badge circle { fill: var(--text); }
  svg.tree .badge text { fill: var(--bg); font-size: 10px; font-family: var(--mono); text-anchor: middle; }

  /* exercises */
  .ex { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
  .ex.done { border-left: 4px solid var(--good); }
  .ex .q { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .ex .qn { display: inline-flex; width: 24px; height: 24px; border-radius: 12px; align-items: center; justify-content: center; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; }
  .ex.done .qn { background: var(--good); color: var(--bg); border-color: var(--good); }
  .ex .qt { color: var(--muted); }
  .ex .expr { font-family: var(--mono); font-size: 18px; font-weight: 600; }
  .ex .vars { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  input.ans, input.vars { font-family: var(--mono); font-size: 16px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); flex: 1 1 260px; min-width: 0; }
  input.vars { font-size: 14px; flex: 0 1 260px; }
  input.ans:focus, input.vars:focus { outline: 2px solid color-mix(in srgb, var(--hl) 55%, transparent); border-color: var(--hl); }
  .fb { font-size: 14.5px; }
  .fb:empty { display: none; }
  .fb.good { color: var(--good); }
  .fb.bad { color: var(--bad); }
  .hintbox, .answer, .hinttext { background: var(--panel2); border-radius: 8px; padding: 8px 10px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; overflow-x: auto; }
  .answer { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .extra { display: flex; flex-direction: column; gap: 6px; }
  .extra:empty { display: none; }
  .livelbl { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; }
  .pager a { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; text-decoration: none; }
  .pager a:hover { border-color: var(--muted); }
  .treebox { overflow-x: auto; padding: 6px 0; }
  .outline { color: var(--muted); font-size: 13px; }
  .playout { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px; }

  @media (max-width: 760px) {
    header { padding: 14px 16px 10px; }
    .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 50px; gap: 12px; }
    nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    nav a { flex: none; }
    nav a .t, nav .keys, nav .sep, nav .reset { display: none; }
    nav a.play .t { display: inline; }
    .compare { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Reverse Polish Notation</h1>
  <p>Postfix notation, from <code>3 4 +</code> to the quadratic formula: one stack, two rules, and the syntax tree they build.</p>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script id="shared-code">
const RPN = (() => {
  const OPS = {
    '+': { arity: 2, prec: 1, assoc: 'L', comm: true, sym: '+', fn: (a, b) => a + b },
    '-': { arity: 2, prec: 1, assoc: 'L', comm: false, sym: '−', fn: (a, b) => a - b },
    '*': { arity: 2, prec: 2, assoc: 'L', comm: true, sym: '×', fn: (a, b) => a * b },
    '/': { arity: 2, prec: 2, assoc: 'L', comm: false, sym: '÷', fn: (a, b) => a / b },
    '^': { arity: 2, prec: 4, assoc: 'R', comm: false, sym: '^', fn: (a, b) => Math.pow(a, b) },
    'neg': { arity: 1, prec: 3, sym: 'neg', fn: a => -a },
    'sqrt': { arity: 1, prec: 5, sym: '√', fn: a => Math.sqrt(a) },
  };
  const ALIAS = { '×': '*', '·': '*', '÷': '/', '−': '-', '√': 'sqrt', '±': 'neg', 'chs': 'neg', '**': '^' };
  function opName(s) {
    if (OPS[s]) return s;
    const l = s.toLowerCase();
    return ALIAS[s] || ALIAS[l] || (OPS[l] ? l : null);
  }

  function fmt(x) {
    if (x === null || x === undefined) return '?';
    if (Number.isNaN(x)) return 'NaN';
    if (!Number.isFinite(x)) return x > 0 ? '∞' : '−∞';
    if (Object.is(x, -0)) x = 0;
    const a = Math.abs(x);
    const s = a !== 0 && (a >= 1e15 || a < 1e-6) ? String(Number(x.toPrecision(6))) : String(parseFloat(x.toPrecision(10)));
    return s.replace('-', '−');
  }

  // One lexer for both notations. Spaces separate numbers and names; around operators they're optional.
  const TOK = /\s*(?:(\d+(?:\.\d*)?|\.\d+)|([A-Za-z_][A-Za-z_0-9]*)|(\*\*|[+\-*\/×÷−^√·±()]))/y;
  function lex(src) {
    const tokens = [];
    let pos = 0;
    while (pos < src.length && !/^\s*$/.test(src.slice(pos))) {
      TOK.lastIndex = pos;
      const m = TOK.exec(src);
      if (!m) {
        const rest = src.slice(pos).trim();
        const text = rest.split(/\s+/)[0];
        tokens.push({ kind: 'bad', text });
        return { tokens, error: `“${text}” isn't a number, a variable name or an operator.` };
      }
      pos = TOK.lastIndex;
      if (m[1]) tokens.push({ kind: 'num', text: m[1], value: parseFloat(m[1]) });
      else if (m[2]) {
        const op = opName(m[2]);
        tokens.push(op ? { kind: 'op', op, text: m[2] } : { kind: 'var', name: m[2], text: m[2] });
      } else if (m[3] === '(' || m[3] === ')') tokens.push({ kind: m[3], text: m[3] });
      else tokens.push({ kind: 'op', op: opName(m[3]), text: m[3] });
    }
    return { tokens };
  }

  let nid = 0;
  const leafNum = value => ({ type: 'num', value, id: ++nid });
  const leafVar = name => ({ type: 'var', name, id: ++nid });
  const opNode = (op, children) => ({ type: 'op', op, children, id: ++nid });

  function evalNode(n, env) {
    if (n.type === 'num') return n.value;
    if (n.type === 'var') return env && Object.prototype.hasOwnProperty.call(env, n.name) ? env[n.name] : null;
    const vals = n.children.map(c => evalNode(c, env));
    return vals.some(v => v === null) ? null : OPS[n.op].fn(...vals);
  }

  function toInfix(n, ascii = false) {
    const S = ascii ? { '+': '+', '-': '-', '*': '*', '/': '/', '^': '^' } : { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' };
    const prec = x => x.type === 'op' ? OPS[x.op].prec : x.type === 'num' && x.value < 0 ? 3 : 9;
    const negLike = x => (x.type === 'op' && x.op === 'neg') || (x.type === 'num' && x.value < 0);
    function go(n) {
      if (n.type === 'num') return ascii ? String(n.value) : fmt(n.value);
      if (n.type === 'var') return n.name;
      if (n.op === 'neg') {
        const c = n.children[0], s = go(c);
        return (ascii ? '-' : '−') + (prec(c) <= 3 ? `(${s})` : s);
      }
      if (n.op === 'sqrt') {
        const c = n.children[0], s = go(c);
        return ascii ? `sqrt(${s})` : c.type === 'op' ? `√(${s})` : `√${s}`;
      }
      const [a, b] = n.children, o = OPS[n.op];
      const wa = prec(a) < o.prec || (prec(a) === o.prec && o.assoc === 'R') || (n.op === '^' && a.type === 'op' && a.op === 'sqrt');
      const wb = prec(b) < o.prec || (prec(b) === o.prec && o.assoc === 'L') || negLike(b);
      const sa = go(a), sb = go(b);
      return (wa ? `(${sa})` : sa) + (n.op === '^' ? '^' : ` ${S[n.op]} `) + (wb ? `(${sb})` : sb);
    }
    return go(n);
  }

  // A stack value as a reader wants to see it: its number, or its formula when a variable has no value.
  const short = n => (n.val !== null && n.val !== undefined) ? fmt(n.val) : n.type === 'op' ? `(${toInfix(n)})` : toInfix(n);

  function underflowMsg(op, have) {
    const o = OPS[op];
    let m = `${o.sym} needs ${o.arity === 2 ? 'two operands' : 'one operand'}, but the stack ${have === 0 ? 'is empty' : 'holds only one value'}.`;
    if (op === '-') m += ' In RPN “−” always subtracts; for a negative number push it and apply neg (e.g. 4 neg).';
    return m;
  }

  function opSay(n) {
    const o = OPS[n.op];
    const res = n.val !== null ? ` = ${fmt(n.val)}` : '';
    if (o.arity === 1) {
      const a = n.children[0];
      return n.op === 'neg' ? `neg pops ${short(a)} and pushes its negation${res}.` : `√ pops ${short(a)} and pushes √${short(a)}${res}.`;
    }
    const [a, b] = n.children;
    const expr = n.op === '^' ? `${short(a)}^${short(b)}` : `${short(a)} ${o.sym} ${short(b)}`;
    return `${o.sym} pops ${short(b)} (the top, its right operand), then ${short(a)} (its left operand), and pushes ${expr}${res}.`;
  }

  // The stack machine. Each step records the stack after the token, so the UI can scrub back and forth.
  function run(src, env = {}) {
    const lx = lex(src);
    const res = { tokens: lx.tokens, steps: [], final: [], error: null, errorAt: -1 };
    const stack = [];
    const fail = (i, msg) => { res.error = msg; res.errorAt = i; res.steps.push({ i, kind: 'error', stack: stack.slice(), used: [], say: msg }); };
    for (let i = 0; i < lx.tokens.length; i++) {
      const t = lx.tokens[i];
      if (t.kind === 'num' || t.kind === 'var') {
        const n = t.kind === 'num' ? leafNum(t.value) : leafVar(t.name);
        n.tok = i;
        n.val = evalNode(n, env);
        stack.push(n);
        const say = t.kind === 'num' ? `Push ${fmt(t.value)}.` : `Push ${t.name}${n.val !== null ? ` (= ${fmt(n.val)})` : ''}.`;
        res.steps.push({ i, kind: 'push', node: n, used: [], stack: stack.slice(), say });
      } else if (t.kind === 'op') {
        const o = OPS[t.op];
        if (stack.length < o.arity) { fail(i, underflowMsg(t.op, stack.length)); break; }
        const kids = stack.splice(stack.length - o.arity);
        const n = opNode(t.op, kids);
        n.tok = i;
        n.val = evalNode(n, env);
        stack.push(n);
        res.steps.push({ i, kind: 'op', node: n, used: kids, stack: stack.slice(), say: opSay(n) });
      } else if (t.kind === 'bad') {
        fail(i, lx.error); break;
      } else {
        fail(i, "Parentheses aren't part of RPN: the order of the tokens already fixes the grouping."); break;
      }
    }
    res.final = stack;
    return res;
  }

  // Pratt parser for ordinary infix. Unary minus binds below ^ (so -3^2 = -(3^2)), √ binds like a function call.
  function parseInfix(src) {
    const lx = lex(src);
    if (lx.error) throw new Error(lx.error);
    const t = lx.tokens;
    let k = 0;
    const BP = { '+': 10, '-': 10, '*': 20, '/': 20, '^': 30 };
    const startsOperand = x => x.kind === 'num' || x.kind === 'var' || x.kind === '(' || (x.kind === 'op' && x.op === 'sqrt');
    function nud(tok) {
      if (!tok) throw new Error('The expression ends too early.');
      if (tok.kind === 'num') return leafNum(tok.value);
      if (tok.kind === 'var') return leafVar(tok.name);
      if (tok.kind === '(') {
        const e = expr(0);
        const c = t[k++];
        if (!c || c.kind !== ')') throw new Error('A closing parenthesis is missing.');
        return e;
      }
      if (tok.kind === 'op') {
        if (tok.op === '-' || tok.op === 'neg') return opNode('neg', [expr(25)]);
        if (tok.op === '+') return expr(25);
        if (tok.op === 'sqrt') return opNode('sqrt', [expr(35)]);
      }
      throw new Error(`Unexpected “${tok.text}”.`);
    }
    function expr(rbp) {
      let left = nud(t[k++]);
      for (;;) {
        const x = t[k];
        if (!x) break;
        const explicit = x.kind === 'op' && BP[x.op] !== undefined;
        if (!explicit && !startsOperand(x)) break;
        const op = explicit ? x.op : '*'; // juxtaposition: 2a, 4ac, 2(3+4)
        const lbp = BP[op];
        if (lbp <= rbp) break;
        if (explicit) k++;
        left = opNode(op, [left, expr(op === '^' ? lbp - 1 : lbp)]);
      }
      return left;
    }
    const e = expr(0);
    if (k < t.length) throw new Error(`Unexpected “${t[k].text}”.`);
    return e;
  }

  function postorder(n, out = []) {
    if (n.type === 'op') n.children.forEach(c => postorder(c, out));
    out.push(n);
    return out;
  }
  const tokOf = n => n.type === 'num' ? String(n.value) : n.type === 'var' ? n.name : n.op;
  const toRPN = n => postorder(n).map(tokOf);
  const prettyTok = s => OPS[s] ? OPS[s].sym : s;
  const prettyRPN = toks => (typeof toks === 'string' ? toks.split(/\s+/) : toks).map(prettyTok).join(' ');

  function sameTree(a, b) {
    if (a.type !== b.type) return false;
    if (a.type === 'num') return a.value === b.value;
    if (a.type === 'var') return a.name === b.name;
    return a.op === b.op && a.children.every((c, i) => sameTree(c, b.children[i]));
  }
  // Same tree up to swapping the operands of + and ×.
  function canon(n) {
    if (n.type === 'num') return 'n' + n.value;
    if (n.type === 'var') return 'v' + n.name;
    const kids = n.children.map(canon);
    if (OPS[n.op].comm) kids.sort();
    return `${n.op}(${kids.join(',')})`;
  }
  function varsOf(n, set = new Set()) {
    if (n.type === 'var') set.add(n.name);
    if (n.type === 'op') n.children.forEach(c => varsOf(c, set));
    return set;
  }
  const close = (x, y, tol = 1e-9) => x === y || Math.abs(x - y) <= tol * Math.max(1, Math.abs(x), Math.abs(y));
  // Numerically equal at the given values and at a few random points.
  function equivalent(a, b, env = {}) {
    const names = [...new Set([...varsOf(a), ...varsOf(b)])];
    const trials = [];
    if (names.every(v => Object.prototype.hasOwnProperty.call(env, v))) trials.push(env);
    let seed = 12345;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    if (names.length) for (let i = 0; i < 4; i++) {
      const e = {};
      names.forEach(v => { e[v] = 1.3 + 3.4 * rnd(); });
      trials.push(e);
    }
    let compared = 0;
    for (const e of trials) {
      const x = evalNode(a, e), y = evalNode(b, e);
      if (x === null || y === null) return false;
      if (Number.isNaN(x) && Number.isNaN(y)) continue;
      if (!close(x, y)) return false;
      compared++;
    }
    return compared > 0;
  }

  function checkWrite(input, ex) {
    if (!input.trim()) return { ok: false, msg: 'Type an RPN expression first.' };
    const env = ex.vars || {};
    const r = run(input, env);
    if (r.error) return { ok: false, msg: r.error };
    if (r.final.length > 1) return { ok: false, msg: `${r.final.length} values are left on the stack. A finished RPN expression leaves exactly one, so ${r.final.length - 1 === 1 ? 'an operator is' : 'operators are'} missing.` };
    const user = r.final[0], target = parseInfix(ex.infix);
    const model = prettyRPN(toRPN(target));
    if (sameTree(user, target)) return { ok: true, exact: true, msg: 'Exactly right.' };
    if (canon(user) === canon(target)) return { ok: true, msg: `Correct. You swapped the operands of a + or ×, which can't change the result. Model answer: ${model}` };
    if (equivalent(user, target, env)) return { ok: true, msg: `Correct value with a differently shaped tree: yours reads ${toInfix(user)}. Model answer: ${model}` };
    const uv = evalNode(user, env), tv = evalNode(target, env);
    return { ok: false, msg: `That reads ${toInfix(user)}${uv !== null ? ' = ' + fmt(uv) : ''}, but the target is ${toInfix(target)}${tv !== null ? ' = ' + fmt(tv) : ''}.` };
  }

  function checkRead(input, ex) {
    const s = input.trim().replace(/−/g, '-');
    if (!s) return { ok: false, msg: 'Type a number or an infix expression first.' };
    const env = ex.vars || {};
    const target = run(ex.rpn, env).final[0];
    const tv = evalNode(target, env);
    if (/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) {
      if (tv === null) return { ok: false, msg: 'The variables here have no values, so write it as an infix expression instead.' };
      const v = parseFloat(s);
      if (Math.abs(v - tv) <= Math.max(1e-6, 1e-4 * Math.abs(tv))) return { ok: true, msg: `Right: ${fmt(tv)}. As infix that's ${toInfix(target)}.` };
      return { ok: false, msg: 'Not that value. Step through it to see where your reading parts ways with the stack.' };
    }
    let user;
    try { user = parseInfix(s); } catch (e) { return { ok: false, msg: `I couldn't read that as a number or as infix: ${e.message}` }; }
    const val = tv !== null ? ' = ' + fmt(tv) : '';
    if (canon(user) === canon(target)) return { ok: true, msg: `Right: ${toInfix(target)}${val}.` };
    if (equivalent(user, target, env)) return { ok: true, msg: `Equivalent. Read directly off the tree it's ${toInfix(target)}${val}.` };
    return { ok: false, msg: `Yours reads ${toInfix(user)}, which is not what this RPN computes.` };
  }

  // Next-token hint against the model answer.
  function hint(input, ex) {
    const E = toRPN(parseInfix(ex.infix));
    const U = lex(input).tokens.map(t => t.kind === 'num' ? String(t.value) : t.kind === 'var' ? t.name : t.kind === 'op' ? t.op : t.text);
    let k = 0;
    while (k < U.length && k < E.length && U[k] === E[k]) k++;
    if (!U.length) return `Start with ${prettyTok(E[0])}: the leftmost leaf of the tree comes first.`;
    if (k === U.length && k === E.length) return 'That matches the model answer. Press Check.';
    if (k === U.length) return `On track so far. Next token: ${prettyTok(E[k])}`;
    if (k === E.length) return `The model answer ends after ${k} tokens: ${prettyRPN(E)}`;
    return `Your first ${k} token${k === 1 ? '' : 's'} match the model answer. Token ${k + 1} should be ${prettyTok(E[k])}, not ${prettyTok(U[k])}.`;
  }

  // Lessons. Blocks: {html}, {example, vars?, caption?}, {compare: [rpn, rpn]}, {postorder: infix}.
  const LEVELS = [
    {
      id: 'operands-first', title: 'Operands first',
      blocks: [
        { html: `<p>Ordinary notation puts the operator <em>between</em> its operands: <code>3 + 4</code>. That's <b>infix</b>. RPN puts it <em>after</em> them: <code>3 4 +</code>. That's <b>postfix</b>. Read it as “take 3, take 4, add”.</p>
<p>Evaluating RPN takes one stack and two rules:</p>
<ol class="rules"><li>A <b>number</b> is pushed onto the stack.</li><li>An <b>operator</b> pops its operands off the top of the stack and pushes its result back.</li></ol>
<p>That's the whole algorithm. There's no precedence table, no parentheses and no lookahead. Step through it below with ▶ or the arrow keys. Every value on the stack is drawn as a small tree, and for now each one is a single node.</p>` },
        { example: '3 4 +' },
        { html: `<p>Watch what <code>+</code> does to the trees: it takes the two trees off the stack and makes them its children, then pushes back <em>one</em> tree with <code>+</code> at the root. Every level after this one repeats that move.</p>` },
      ],
      exercises: [
        { type: 'write', infix: '5 + 2', rpn: '5 2 +' },
        { type: 'write', infix: '9 * 6', rpn: '9 6 *' },
        { type: 'read', rpn: '8 2 +', infix: '8 + 2' },
      ],
    },
    {
      id: 'order-matters', title: 'Order matters: − and ÷',
      blocks: [
        { html: `<p>For <code>+</code> and <code>×</code> you can't tell which operand came off the stack first. For <code>−</code> and <code>÷</code> you can. The rule: <b>operands keep their infix left-to-right order.</b> <code>10 − 3</code> becomes <code>10 3 −</code>.</p>
<p>A stack pops in reverse, so the operator pops the <em>right</em> operand first (it's on top) and the left one second. In code: <code>b = pop(); a = pop(); push(a − b)</code>.</p>` },
        { example: '10 3 -' },
        { example: '3 10 -', caption: 'Same tokens with the numbers swapped: 3 − 10.' },
      ],
      exercises: [
        { type: 'write', infix: '8 - 5', rpn: '8 5 -' },
        { type: 'write', infix: '20 / 4', rpn: '20 4 /' },
        { type: 'write', infix: '1 - 9', rpn: '1 9 -' },
        { type: 'read', rpn: '2 10 /', infix: '2 / 10' },
      ],
    },
    {
      id: 'chaining', title: 'Chaining',
      blocks: [
        { html: `<p>A result goes back on the stack, so it can be the operand of the next operator. <code>3 4 + 5 ×</code> is “3 plus 4, then times 5”, which is <code>(3 + 4) × 5</code>. Infix needs those parentheses only because × would otherwise bind tighter. RPN never needs them.</p>` },
        { example: '3 4 + 5 *' },
        { html: `<p>A chain of subtractions works the same way. Infix's left-to-right rule (<code>10 − 2 − 3</code> means <code>(10 − 2) − 3</code>) is simply the order the RPN is written in.</p>` },
        { example: '10 2 - 3 -' },
        { html: `<p>This is a running total, one operator at a time. In the tree it builds a spine that leans left.</p>` },
      ],
      exercises: [
        { type: 'write', infix: '(2 + 3) * 4', rpn: '2 3 + 4 *' },
        { type: 'write', infix: '20 - 5 - 4', rpn: '20 5 - 4 -' },
        { type: 'write', infix: '20 / 4 + 1', rpn: '20 4 / 1 +' },
        { type: 'write', infix: '((1 + 2) * 3 - 4) / 5', rpn: '1 2 + 3 * 4 - 5 /' },
        { type: 'read', rpn: '6 2 / 1 -', infix: '6 / 2 - 1' },
      ],
    },
    {
      id: 'waiting', title: 'Operands that wait',
      blocks: [
        { html: `<p>So far every operator found exactly the operands it needed on the stack. That isn't required. You can push several values and leave some of them <em>waiting</em> while operators work on the top of the stack.</p>
<p><code>3 4 5 × +</code>: push 3, 4 and 5. <code>×</code> takes the two on top (4 and 5) and pushes 20. Then <code>+</code> takes 3 and 20. That's <code>3 + 4 × 5</code> = 23.</p>` },
        { example: '3 4 5 * +' },
        { html: `<p>Here the two orders side by side. The three numbers and the two operators are the same. Only the position of <code>+</code> differs, and that alone decides which tree you get:</p>` },
        { compare: ['3 4 + 5 *', '3 4 5 * +'] },
        { html: `<p><b>The order of the tokens encodes the shape of the tree.</b> That's why RPN has no parentheses and no precedence rules: whoever writes it settles the grouping by choosing when each operator appears.</p>
<p>The stack depth shows how much work is still pending. While the 3 sits at the bottom, the stack is saying “an addition is still coming”.</p>` },
      ],
      exercises: [
        { type: 'write', infix: '2 + 3 * 4', rpn: '2 3 4 * +' },
        { type: 'write', infix: '2 * (3 + 4)', rpn: '2 3 4 + *' },
        { type: 'write', infix: '10 - 2 * 3', rpn: '10 2 3 * -' },
        { type: 'write', infix: '10 - (2 - 3)', rpn: '10 2 3 - -' },
        { type: 'read', rpn: '1 2 3 * +', infix: '1 + 2 * 3' },
        { type: 'read', rpn: '8 4 2 / /', infix: '8 / (4 / 2)' },
      ],
    },
    {
      id: 'two-branches', title: 'Two branches',
      blocks: [
        { html: `<p>When both operands of an operator are expressions of their own, write the whole left side, then the whole right side, then the operator. <code>(1 + 2) × (3 + 4)</code> becomes <code>1 2 + 3 4 + ×</code>.</p>` },
        { example: '1 2 + 3 4 + *' },
        { html: `<p>After <code>1 2 +</code> the stack holds one finished subtree. <code>3 4 +</code> then builds a second subtree beside it while the first one waits, and the final <code>×</code> joins the two. Midway through, the stack is a <em>forest</em>: a list of finished subtrees waiting for operators to combine them.</p>` },
        { example: '2 3 * 4 5 * +' },
      ],
      exercises: [
        { type: 'write', infix: '(6 - 2) / (1 + 1)', rpn: '6 2 - 1 1 + /' },
        { type: 'write', infix: '(5 + 3) * (5 - 3)', rpn: '5 3 + 5 3 - *' },
        { type: 'write', infix: '8 / 2 - 6 / 3', rpn: '8 2 / 6 3 / -' },
        { type: 'write', infix: '(1 + 2) * (3 + 4) * (5 + 6)', rpn: '1 2 + 3 4 + * 5 6 + *' },
        { type: 'read', rpn: '9 3 / 2 2 * -', infix: '9 / 3 - 2 * 2' },
      ],
    },
    {
      id: 'powers-unary', title: 'Powers and one-operand operators',
      blocks: [
        { html: `<p><code>^</code> is a binary operator like the others: <code>2 3 ^</code> is 2³ = 8. Infix needs one more convention here, because powers group to the right: <code>2^3^2</code> means <code>2^(3^2)</code> = 512. In RPN there's no convention to remember. You write the grouping you mean:</p>` },
        { compare: ['2 3 2 ^ ^', '2 3 ^ 2 ^'] },
        { html: `<p>Some operators take <b>one</b> operand: <code>√</code> (type <code>sqrt</code>) and <code>neg</code> (change sign). They pop one value and push one value.</p>
<p><code>−</code> always means <em>subtract</em> in RPN. Infix overloads the minus sign: it negates in <code>−3</code> and subtracts in <code>5 − 3</code>. In postfix the two can't be told apart, so negation gets its own token. That's why RPN calculators have a separate change-sign key.</p>` },
        { example: '3 2 ^ 4 2 ^ + sqrt', caption: '√(3^2 + 4^2): the 3-4-5 triangle.' },
        { html: `<p>A classic infix trap: does <code>−3^2</code> mean <code>(−3)^2</code> = 9 or <code>−(3^2)</code> = −9? By convention it's −9. In RPN the two are different strings, so the question never comes up:</p>` },
        { compare: ['3 2 ^ neg', '3 neg 2 ^'] },
      ],
      exercises: [
        { type: 'write', infix: '2^10', rpn: '2 10 ^' },
        { type: 'write', infix: 'sqrt(5^2 + 12^2)', rpn: '5 2 ^ 12 2 ^ + sqrt' },
        { type: 'write', infix: '-(2 + 3)', rpn: '2 3 + neg' },
        { type: 'write', infix: '2^2^3', rpn: '2 2 3 ^ ^' },
        { type: 'write', infix: '(-2)^4', rpn: '2 neg 4 ^' },
        { type: 'read', rpn: '5 neg 2 * 1 +', infix: '-5 * 2 + 1' },
      ],
    },
    {
      id: 'formulas', title: 'Variables and real formulas',
      blocks: [
        { html: `<p>A variable is just another operand and is pushed like a number. Below, the variables have values, so the stack shows numbers while the tree keeps the names.</p>` },
        { example: 'c 9 * 5 / 32 +', vars: { c: 100 }, caption: 'Celsius to Fahrenheit, c × 9 ÷ 5 + 32, with c = 100.' },
        { html: `<p>Here's a method for translating any formula. Find the operator that's applied <em>last</em>. In infix that's the lowest-precedence operator outside all parentheses, and if there are several, the rightmost one (for the left-grouping operators). That operator is the root. Write its left operand in RPN, then its right operand in RPN, then the operator, and use the same method on each operand.</p>
<p>In <code>(−b + √(b^2 − 4ac)) / (2a)</code> the last operator is the outer <code>÷</code>. So the answer is <em>[the numerator in RPN] [the denominator in RPN]</em> <code>÷</code>. That's the last exercise on this page.</p>` },
      ],
      exercises: [
        { type: 'write', infix: '(a + b + c) / 3', rpn: 'a b + c + 3 /', vars: { a: 4, b: 8, c: 9 } },
        { type: 'write', infix: '(f - 32) * 5 / 9', rpn: 'f 32 - 5 * 9 /', vars: { f: 212 } },
        { type: 'read', rpn: 'p 1 r + n ^ *', infix: 'p * (1 + r)^n', vars: { p: 100, r: 0.1, n: 2 } },
        { type: 'write', infix: 'sqrt((x2 - x1)^2 + (y2 - y1)^2)', rpn: 'x2 x1 - 2 ^ y2 y1 - 2 ^ + sqrt', vars: { x1: 1, y1: 2, x2: 4, y2: 6 } },
        { type: 'write', infix: 'p * (1 + r / n)^(n * t)', rpn: 'p 1 r n / + n t * ^ *', vars: { p: 1000, r: 0.05, n: 12, t: 10 } },
        { type: 'write', infix: '(-b + sqrt(b^2 - 4*a*c)) / (2*a)', rpn: 'b neg b 2 ^ 4 a * c * - sqrt + 2 a * /', vars: { a: 1, b: -3, c: 2 } },
      ],
    },
    {
      id: 'algorithm', title: 'The algorithm, as a developer sees it',
      blocks: [
        { html: `<p>Everything so far is one fact seen from two sides:</p>
<ul><li><b>Writing</b> RPN is a <b>post-order traversal</b> of the syntax tree: the children first, left to right, then the node itself.</li>
<li><b>Reading</b> RPN is the stack machine from level 1. It rebuilds the tree bottom-up, taking the tokens in exactly the order the traversal emitted them.</li></ul>
<p>Step through the traversal below. The numbers on the nodes give the visit order. You can edit the infix to try your own.</p>` },
        { postorder: '(1 + 2) * (3 - 4 / 5)' },
        { html: `<p>The same stack machine turns RPN back into infix if you push <em>strings</em> instead of numbers: an operator pops two strings and pushes <code>"(" + a + op + b + ")"</code>. That's how the stack cards on this page get their infix captions, with parentheses only where precedence needs them.</p>
<p>To go straight from infix text to RPN without building a tree, use Dijkstra's <b>shunting-yard</b> algorithm. It holds operators back on a second stack until their right operand has been emitted.</p>
<div class="aside"><b>You've already seen this.</b> Stack-based virtual machines run postfix code. The JVM, CPython, .NET's CIL and WebAssembly all compile <code>a * (b + c)</code> to roughly <code>load a; load b; load c; add; mul</code>, which is the RPN <code>a b c + ×</code> spelled out as instructions. PostScript, Forth and Unix <code>dc</code> are languages you write in postfix directly. The name comes from Jan Łukasiewicz's <em>prefix</em> “Polish notation” of the 1920s. The reversed, postfix form was proposed for computers in the 1950s, notably by Charles Hamblin.</div>` },
      ],
      exercises: [
        { type: 'read', rpn: 'a b c + *', infix: 'a * (b + c)' },
        { type: 'read', rpn: 'a b c d - * +', infix: 'a + b * (c - d)' },
        { type: 'read', rpn: 'a b - c / d e + ^', infix: '((a - b) / c)^(d + e)' },
        { type: 'write', infix: 'a / (b * c) - d', rpn: 'a b c * / d -' },
        { type: 'write', infix: '(a - b) / (c - d)^2', rpn: 'a b - c d - 2 ^ /' },
      ],
    },
  ];

  return { OPS, fmt, lex, run, evalNode, toInfix, short, parseInfix, postorder, toRPN, prettyTok, prettyRPN, sameTree, canon, equivalent, checkWrite, checkRead, hint, LEVELS };
})();

const RPNTests = {
  run() {
    let pass = 0, fail = 0;
    const t = (name, cond) => { if (cond) pass++; else { fail++; console.log('FAIL', name); } };
    const v = s => { const r = RPN.run(s); return r.final.length ? r.final[r.final.length - 1].val : undefined; };

    t('add', v('3 4 +') === 7);
    t('subtract order', v('10 3 -') === 7 && v('3 10 -') === -7);
    t('divide order', v('2 10 /') === 0.2);
    t('spaces optional around operators', v('3 4+5*') === 35);
    t('aliases', v('6 3 ÷ 2 ×') === 4 && v('16 √') === 4 && v('16 sqrt') === 4 && v('5 neg') === -5 && v('2 3 **') === 8 && v('9 2 −') === 7 && v('5 chs') === -5);
    const u = RPN.run('3 +');
    t('underflow', u.error && u.errorAt === 1 && u.steps.length === 2 && u.steps[1].kind === 'error');
    t('minus underflow suggests neg', /neg/.test(RPN.run('-4').error));
    t('leftover is not an error', RPN.run('3 4').final.length === 2 && !RPN.run('3 4').error);
    t('bad token', !!RPN.run('3 4 $').error && RPN.run('3 4 $').errorAt === 2);
    t('parens rejected in RPN', !!RPN.run('3 ( 4').error);
    t('vars', RPN.run('a b +', { a: 2, b: 5 }).final[0].val === 7 && RPN.run('a 1 +').final[0].val === null);
    const r1 = RPN.run('1 2 + 3 *');
    t('step stacks', r1.steps.map(s => s.stack.length).join() === '1,2,1,2,1');
    t('op step records children', r1.steps[2].used.length === 2 && r1.steps[2].node.children[0] === r1.steps[0].node);

    const rp = s => RPN.toRPN(RPN.parseInfix(s)).join(' ');
    t('rpn precedence', rp('1+2*3') === '1 2 3 * +');
    t('rpn parens', rp('(1+2)*3') === '1 2 + 3 *');
    t('rpn left assoc', rp('10-2-3') === '10 2 - 3 -');

    t('rpn unary then times', rp('-2*3') === '2 neg 3 *');
    t('rpn negative exponent', rp('2^-1') === '2 1 neg ^');
    t('rpn implicit multiplication', rp('2a') === '2 a *' && rp('4ac') === '4 ac *' && rp('2(3+4)') === '2 3 4 + *' && rp('4 a c') === '4 a * c *');
    t('rpn sqrt binds like a call', rp('sqrt(x)^2') === 'x sqrt 2 ^' && rp('√x^2') === 'x sqrt 2 ^' && rp('√(x^2)') === 'x 2 ^ sqrt');
    t('rpn unicode', rp('6 ÷ 3 × 2 − 1') === '6 3 / 2 * 1 -');
    let threw = 0;
    for (const bad of ['1 +', '(1 + 2', '1 + 2)', '*3', '3 $']) { try { RPN.parseInfix(bad); } catch (e) { threw++; } }
    t('infix errors', threw === 5);

    const pi = s => RPN.toInfix(RPN.parseInfix(s));
    t('infix two branches', pi('(1+2)*(3+4)') === '(1 + 2) × (3 + 4)');
    t('infix drops redundant parens', pi('1+(2*3)') === '1 + 2 × 3' && pi('(10-2)-3') === '10 − 2 − 3');
    t('infix keeps needed parens', pi('10-(2-3)') === '10 − (2 − 3)' && pi('a+(b+c)') === 'a + (b + c)' && pi('8/(4/2)') === '8 ÷ (4 ÷ 2)');
    t('infix powers', pi('2^(3^2)') === '2^3^2' && pi('(2^3)^2') === '(2^3)^2');
    t('infix negation', pi('-(3^2)') === '−3^2' && pi('(-3)^2') === '(−3)^2' && pi('a+(-b)') === 'a + (−b)' && pi('-(2+3)') === '−(2 + 3)' && pi('-(-x)') === '−(−x)');
    t('infix sqrt', pi('sqrt(b^2-4*a*c)') === '√(b^2 − 4 × a × c)' && pi('sqrt(x)') === '√x' && pi('(sqrt x)^2') === '(√x)^2');
    const corpus = ['1+2*3', '(1+2)*3', '10-(2-3)', '2^3^2', '(2^3)^2', '-3^2', '(-3)^2', 'a+(-b)', '-(2+3)', 'sqrt(x)^2', 'sqrt(x^2)', '2^-1', '(-b + sqrt(b^2 - 4*a*c)) / (2*a)', 'p*(1+r/n)^(n*t)', 'a/(b*c)-d', '-x*y', '-(x*y)', 'a-(b+c)', 'a/(b/c)'];

      const n = RPN.parseInfix(s);
      t(`round trip ascii ${s}`, RPN.sameTree(n, RPN.parseInfix(RPN.toInfix(n, true))));
      t(`round trip pretty ${s}`, RPN.sameTree(n, RPN.parseInfix(RPN.toInfix(n))));
      t(`round trip rpn ${s}`, RPN.sameTree(n, RPN.run(RPN.toRPN(n).join(' ')).final[0]));
    }

    t('fmt', RPN.fmt(0.1 + 0.2) === '0.3' && RPN.fmt(-7) === '−7' && RPN.fmt(1 / 0) === '∞' && RPN.fmt(-0) === '0' && RPN.fmt(1000 * Math.pow(1 + 0.05 / 12, 120)) === '1647.009498' && RPN.fmt(null) === '?');

    const P = RPN.parseInfix;
    t('canon commutes + and ×', RPN.canon(P('2*(3+4)')) === RPN.canon(P('(4+3)*2')) && RPN.canon(P('a-b')) !== RPN.canon(P('b-a')));
    t('equivalent associativity', RPN.equivalent(P('a+(b+c)'), P('(a+b)+c')) && !RPN.equivalent(P('a-b'), P('b-a')));
    t('equivalent numbers', RPN.equivalent(P('2*3'), P('6')) && !RPN.equivalent(P('2*3'), P('7')));

    const W = { infix: '2*(3+4)' };
    t('write exact', RPN.checkWrite('2 3 4 + *', W).exact === true);
    t('write swapped', RPN.checkWrite('3 4 + 2 *', W).ok && /swapped/.test(RPN.checkWrite('3 4 + 2 *', W).msg));
    t('write wrong', !RPN.checkWrite('2 3 + 4 *', W).ok);
    t('write leftover', !RPN.checkWrite('2 3 4 +', W).ok && /left on the stack/.test(RPN.checkWrite('2 3 4 +', W).msg));
    t('write underflow', !RPN.checkWrite('2 +', W).ok);
    t('write equivalent tree', RPN.checkWrite('a b c + +', { infix: 'a+b+c' }).ok && !RPN.checkWrite('a b c + +', { infix: 'a+b+c' }).exact);
    t('write with vars', RPN.checkWrite('b neg b 2 ^ 4 a * c * - sqrt + 2 a * /', { infix: '(-b + sqrt(b^2 - 4*a*c)) / (2*a)', vars: { a: 1, b: -3, c: 2 } }).exact);
    const R = { rpn: '1 2 3 * +' };
    t('read number', RPN.checkRead('7', R).ok && !RPN.checkRead('9', R).ok);
    t('read infix', RPN.checkRead('1 + 2*3', R).ok && RPN.checkRead('3*2+1', R).ok && !RPN.checkRead('(1+2)*3', R).ok);
    t('read garbage', !RPN.checkRead('1 + ', R).ok);
    t('read vars need infix', !RPN.checkRead('5', { rpn: 'a b +' }).ok && RPN.checkRead('a+b', { rpn: 'a b +' }).ok);
    t('read rounding', RPN.checkRead('1647.01', { rpn: '1000 1 0.05 12 / + 120 ^ *' }).ok);

    const H = { infix: '(1+2)*3' };
    t('hint start', /Start with 1/.test(RPN.hint('', H)));
    t('hint next', /Next token: \+/.test(RPN.hint('1 2', H)));
    t('hint mismatch', /Token 3 should be \+, not 3/.test(RPN.hint('1 2 3', H)));
    t('hint done', /matches/.test(RPN.hint('1 2 + 3 *', H)));

    // Every lesson must be internally consistent: stored RPN = post-order of the infix, and examples run clean.
    const ids = new Set();
    for (const L of RPN.LEVELS) {
      t(`unique level id ${L.id}`, !ids.has(L.id)); ids.add(L.id);
      for (const b of L.blocks) {
        for (const src of b.example ? [b.example] : b.compare || []) {
          const r = RPN.run(src, b.vars || {});
          t(`example runs ${src}`, !r.error && r.final.length === 1);
        }
        if (b.postorder) t(`postorder parses ${b.postorder}`, !!RPN.parseInfix(b.postorder));
      }
      for (const ex of L.exercises) {
        const tree = RPN.parseInfix(ex.infix);
        t(`stored rpn ${ex.infix}`, RPN.toRPN(tree).join(' ') === ex.rpn);
        const r = RPN.run(ex.rpn, ex.vars || {});
        t(`exercise runs ${ex.rpn}`, !r.error && r.final.length === 1 && RPN.sameTree(r.final[0], tree));
        if (ex.vars) t(`vars bind all ${ex.rpn}`, r.final[0].val !== null && Number.isFinite(r.final[0].val));
        if (ex.type === 'write') t(`model answer passes ${ex.infix}`, RPN.checkWrite(ex.rpn, ex).exact === true);
        else t(`model reading passes ${ex.rpn}`, RPN.checkRead(ex.infix, ex).ok);
      }
    }
    const quad = RPN.run('b neg b 2 ^ 4 a * c * - sqrt + 2 a * /', { a: 1, b: -3, c: 2 }).final[0].val;
    t('quadratic root', quad === 2);

    console.log(`${pass} passed, ${fail} failed`);
    return fail === 0;
  },
};
</script>

<script>
(() => {
  const { OPS, LEVELS } = RPN;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');

  function build(el, attrs, kids) {
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  }
  const h = (tag, attrs, ...kids) => build(document.createElement(tag), attrs, kids);
  const sv = (tag, attrs, ...kids) => build(document.createElementNS(SVGNS, tag), attrs, kids);
  const btn = (label, onclick, cls) => h('button', { class: cls, onclick }, label);

  // ---- progress (per-viewer convenience; the page works without it) ----
  const STORE = 'rpn-tutorial-done';
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); } catch (e) { /* storage unavailable */ }
  function markDone(id) {
    if (done.has(id)) return;
    done.add(id);
    try { localStorage.setItem(STORE, JSON.stringify([...done])); } catch (e) { /* ignore */ }
    renderNav();
  }

  // ---- tokens and trees ----
  const labelOf = n => n.type === 'num' ? RPN.fmt(n.value) : n.type === 'var' ? n.name : OPS[n.op].sym;
  const tokText = t => t.kind === 'op' ? RPN.prettyTok(t.op) : t.kind === 'num' ? RPN.fmt(t.value) : t.text;
  const chip = (text, kind, extra) => h('span', { class: `chip ${kind}${extra ? ' ' + extra : ''}` }, text);
  const rpnChips = src => h('span', { class: 'chips' }, RPN.lex(src).tokens.map(t => chip(tokText(t), t.kind)));

  // Tidy-ish layout: leaves on consecutive slots, parents centred over their children.
  function treeSVG(root, o = {}) {
    const valOf = o.valOf || (n => n.val);
    const cls = o.cls || new Map();
    const pos = new Map(), nodes = [];
    let slot = 0, maxD = 0, maxW = 0, tagW = 0;
    const wOf = n => Math.max(26, labelOf(n).length * 8.2 + 14);
    (function lay(n, d, side) {
      nodes.push(n);
      maxD = Math.max(maxD, d);
      maxW = Math.max(maxW, wOf(n));
      if (n.type !== 'op') { pos.set(n, { x: slot++, d, side }); return; }
      n.children.forEach((c, i) => lay(c, d + 1, n.children.length === 1 ? 'C' : i ? 'R' : 'L'));
      const xs = n.children.map(c => pos.get(c).x);
      pos.set(n, { x: (xs[0] + xs[xs.length - 1]) / 2, d, side });
      const v = valOf(n);
      if (o.tags !== false && v !== null && v !== undefined) tagW = Math.max(tagW, (RPN.fmt(v).length + 1) * 6.4 + 6);
    })(root, 0, 'C');
    const SW = Math.max(40, maxW + 10), DY = 46, NH = 24, PX = Math.max(6, tagW - SW / 2 + 30), PY = 9;
    const W = slot * SW + 2 * PX, H = maxD * DY + NH + 2 * PY;
    const X = n => PX + pos.get(n).x * SW + SW / 2, Y = n => PY + pos.get(n).d * DY + NH / 2;
    const svg = sv('svg', { class: 'tree', width: W, height: H, viewBox: `0 0 ${W} ${H}` });
    for (const n of nodes) if (n.type === 'op') for (const c of n.children) {
      svg.append(sv('line', { class: 'eg' + (cls.get(n) === 'new' ? ' new' : ''), x1: X(n), y1: Y(n) + NH / 2, x2: X(c), y2: Y(c) - NH / 2 }));
    }
    for (const n of nodes) {
      const w = wOf(n), x = X(n), y = Y(n), v = valOf(n);
      const g = sv('g', { class: `nd ${n.type} ${cls.get(n) || ''}` },
        sv('rect', { x: x - w / 2, y: y - NH / 2, width: w, height: NH, rx: NH / 2 }),
        sv('text', { x, y: y + 4.6 }, labelOf(n)),
        sv('title', {}, n.type === 'op' ? `${RPN.toInfix(n)}${v !== null && v !== undefined ? ' = ' + RPN.fmt(v) : ''}` : labelOf(n)));
      svg.append(g);
      if (n.type === 'op' && o.tags !== false && v !== null && v !== undefined) {
        const left = pos.get(n).side === 'L';
        svg.append(sv('text', { class: 'vt', x: left ? x - w / 2 - 4 : x + w / 2 + 4, y: y + 4, 'text-anchor': left ? 'end' : 'start' }, '= ' + RPN.fmt(v)));
      }
      if (o.badge && o.badge.has(n)) {
        const bx = x - w / 2 + 2, by = y - NH / 2 + 1;
        svg.append(sv('g', { class: 'badge' }, sv('circle', { cx: bx, cy: by, r: 8 }), sv('text', { x: bx, y: by + 3.5 }, String(o.badge.get(n)))));
      }
    }
    return svg;
  }

  function stackCard(node, top, fresh) {
    const cls = new Map();
    if (fresh) {
      cls.set(node, 'new');
      if (node.type === 'op') node.children.forEach(c => cls.set(c, 'kid'));
    }
    return h('div', { class: 'scard' + (fresh ? ' fresh' : '') },
      top ? h('span', { class: 'topt' }, 'top') : null,
      h('div', { class: 'val' }, node.val !== null ? RPN.fmt(node.val) : RPN.toInfix(node)),
      node.type === 'op' && node.val !== null ? h('div', { class: 'inf' }, RPN.toInfix(node)) : null,
      treeSVG(node, { cls }));
  }

  // ---- the stepper: tokens, explanation, stack of trees, trace table ----
  function Viz({ trace = true, traceOpen = false, startAtEnd = false } = {}) {
    const strip = h('div', { class: 'strip' });
    const counter = h('span', { class: 'counter' });
    const bFirst = h('button', { title: 'Back to the start', onclick: () => go(0) }, '⏮');
    const bPrev = h('button', { title: 'Previous token (←)', onclick: () => go(step - 1) }, '◀');
    const bNext = h('button', { title: 'Next token (→)', onclick: () => go(step + 1) }, '▶');
    const bLast = h('button', { title: 'Jump to the end', onclick: () => go(r.steps.length) }, '⏭');
    const bPlay = h('button', { onclick: togglePlay }, 'Play');
    const say = h('div', { class: 'say' });
    const stackEl = h('div', { class: 'stack' });
    const tbody = h('tbody');
    const traceBox = trace ? h('details', { class: 'trace', open: traceOpen },
      h('summary', {}, 'Trace table'),
      h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, '#'), h('th', {}, 'token'), h('th', {}, 'action'), h('th', {}, 'stack after (bottom → top)'))), tbody)) : null;
    const el = h('div', { class: 'viz', tabindex: '0' },
      strip, h('div', { class: 'ctrls' }, bFirst, bPrev, bNext, bLast, bPlay, counter), say,
      h('div', { class: 'stacklbl' }, h('span', {}, 'stack: bottom'), h('span', {}, 'top →')), stackEl, traceBox);
    el.addEventListener('keydown', e => {
      if (e.target !== el) return;
      if (e.key === 'ArrowRight') { go(step + 1); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { go(step - 1); e.preventDefault(); }
    });
    let r = RPN.run(''), step = 0, timer = null;

    function set(src, env) { stop(); r = RPN.run(src, env || {}); step = startAtEnd ? r.steps.length : 0; render(); }
    function go(k) { step = Math.max(0, Math.min(r.steps.length, k)); render(); }
    function stop() { clearInterval(timer); timer = null; bPlay.textContent = 'Play'; }
    function togglePlay() {
      if (timer) return stop();
      if (step >= r.steps.length) go(0);
      bPlay.textContent = 'Pause';
      timer = setInterval(() => { go(step + 1); if (step >= r.steps.length) stop(); }, 800);
    }
    function render() {
      const n = r.steps.length;
      strip.replaceChildren(...r.tokens.map((t, i) => {
        const c = chip(tokText(t), t.kind, (i < step ? 'done' : 'todo') + (i === step - 1 ? ' cur' : '') + (i === r.errorAt ? ' err' : ''));
        c.title = 'Jump here';
        c.onclick = () => go(i + 1);
        return c;
      }));
      counter.textContent = `step ${step} of ${n}`;
      bFirst.disabled = bPrev.disabled = step === 0;
      bNext.disabled = bLast.disabled = step === n;
      bPlay.disabled = n === 0;
      const st = step ? r.steps[step - 1] : null;
      let msg = st ? st.say : n ? 'The stack starts empty. Press ▶ (or → with this panel focused) to read the first token.' : '';
      if (st && step === n && !r.error) {
        const k = r.final.length;
        msg += k === 1 ? ' Done: exactly one value is left, and it is the result.' : ` End of input with ${k} values on the stack: ${k - 1 === 1 ? 'an operator is' : (k - 1) + ' operators are'} missing.`;
      }
      say.className = 'say' + (st && st.kind === 'error' ? ' bad' : '');
      say.textContent = msg;
      const cur = st ? st.stack : [];
      stackEl.replaceChildren(...(cur.length
        ? cur.map((node, i) => stackCard(node, i === cur.length - 1, st && st.kind !== 'error' && node === st.node))
        : [h('div', { class: 'empty' }, 'empty')]));
      if (traceBox) tbody.replaceChildren(...r.steps.map((s, i) => h('tr', { class: (i === step - 1 ? 'cur' : '') + (i >= step ? ' todo' : '') + (s.kind === 'error' ? ' err' : ''), onclick: () => go(i + 1) },
        h('td', {}, String(i + 1)),
        h('td', {}, chip(tokText(r.tokens[s.i]), r.tokens[s.i].kind)),
        h('td', {}, s.kind === 'push' ? 'push' : s.kind === 'op' ? `pop ${OPS[s.node.op].arity}, push ${RPN.short(s.node)}` : 'error'),
        h('td', { class: 'mono' }, s.stack.map(RPN.short).join('   ')))));
    }
    render();
    return { el, set };
  }

  // ---- exercises ----
  function Exercise(ex, id, num) {
    const env = ex.vars || {};
    const card = h('div', { class: 'ex' + (done.has(id) ? ' done' : '') });
    const fb = h('div', { class: 'fb' });
    const extra = h('div', { class: 'extra' });
    const input = h('input', { class: 'ans', type: 'text', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off',
      placeholder: ex.type === 'write' ? 'type RPN, e.g. 1 2 +' : 'a number, or the same thing in infix' });
    const varsLine = Object.keys(env).length ? h('div', { class: 'vars' }, 'with ' + Object.entries(env).map(([k, v]) => `${k} = ${RPN.fmt(v)}`).join(', ')) : null;
    const setFb = res => {
      fb.className = 'fb ' + (res.ok ? 'good' : 'bad');
      fb.textContent = (res.ok ? '✓ ' : '✗ ') + res.msg;
      if (res.ok) { card.classList.add('done'); markDone(id); }
    };
    const clearFb = () => { fb.className = 'fb'; fb.textContent = ''; };

    if (ex.type === 'write') {
      const target = RPN.parseInfix(ex.infix);
      const viz = Viz({ trace: true, startAtEnd: true });
      const live = h('div', { hidden: true }, h('div', { class: 'livelbl' }, 'Your input, as the stack machine reads it:'), viz.el);
      const check = () => setFb(RPN.checkWrite(input.value, ex));
      let hints = 0;
      const hint = () => {
        hints++;
        if (hints === 1) {
          extra.prepend(h('div', { class: 'hintbox' },
            h('div', {}, "The tree you're aiming for. RPN lists it children first: the left subtree, then the right subtree, then the node."),
            treeSVG(target, { valOf: n => RPN.evalNode(n, env) })));
        } else {
          extra.querySelector('.hinttext')?.remove();
          extra.querySelector('.hintbox').after(h('div', { class: 'hinttext' }, RPN.hint(input.value, ex)));
        }
      };
      const answer = () => {
        extra.querySelector('.answer')?.remove();
        extra.append(h('div', { class: 'answer' }, 'Model answer:', rpnChips(ex.rpn),
          btn('Put it in the box', () => { input.value = ex.rpn; input.dispatchEvent(new Event('input')); input.focus(); }, 'small')));
      };
      input.addEventListener('input', () => { live.hidden = !input.value.trim(); viz.set(input.value, env); clearFb(); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      card.append(
        h('div', { class: 'q' }, h('span', { class: 'qn' }, String(num)), h('span', { class: 'qt' }, 'Write in RPN:'), h('span', { class: 'expr' }, RPN.toInfix(target))),
        varsLine,
        h('div', { class: 'row' }, input, btn('Check', check, 'primary'), btn('Hint', hint), btn('Answer', answer)),
        fb, extra, live);
    } else {
      const unbound = RPN.run(ex.rpn, env).final[0].val === null;
      const viz = Viz({ trace: true, traceOpen: true });
      const live = h('div', { hidden: true }, viz.el);
      const check = () => setFb(RPN.checkRead(input.value, ex));
      const show = () => { live.hidden = false; viz.set(ex.rpn, env); };
      input.addEventListener('input', clearFb);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      card.append(
        h('div', { class: 'q' }, h('span', { class: 'qn' }, String(num)), h('span', { class: 'qt' }, unbound ? 'Write this in ordinary infix:' : 'What does this compute?'), rpnChips(ex.rpn)),
        varsLine,
        h('div', { class: 'row' }, input, btn('Check', check, 'primary'), btn('Step through it', show)),
        fb, live);
    }
    return card;
  }

  // ---- post-order traversal demo ----
  function PostOrder(initial) {
    const input = h('input', { class: 'ans', type: 'text', value: initial, spellcheck: 'false', autocomplete: 'off' });
    const err = h('div', { class: 'fb bad' });
    const treeBox = h('div', { class: 'treebox' });
    const out = h('div', { class: 'strip' });
    const say = h('div', { class: 'say' });
    const counter = h('span', { class: 'counter' });
    const bPrev = h('button', { onclick: () => go(k - 1) }, '◀');
    const bNext = h('button', { onclick: () => go(k + 1) }, '▶');
    const bAll = h('button', { onclick: () => go(order.length) }, '⏭');
    const bFirst = h('button', { onclick: () => go(0) }, '⏮');
    let root = null, order = [], k = 0;
    function parse() {
      try { root = RPN.parseInfix(input.value); order = RPN.postorder(root); err.textContent = ''; }
      catch (e) { root = null; order = []; err.textContent = e.message; }
      k = 0;
      render();
    }
    function go(i) { k = Math.max(0, Math.min(order.length, i)); render(); }
    function render() {
      counter.textContent = `visited ${k} of ${order.length}`;
      bFirst.disabled = bPrev.disabled = k === 0;
      bNext.disabled = bAll.disabled = k === order.length;
      if (!root) { treeBox.replaceChildren(); out.replaceChildren(); say.textContent = ''; return; }
      const cls = new Map(), badge = new Map();
      order.forEach((n, i) => { cls.set(n, i < k ? '' : 'pending'); if (i < k) badge.set(n, i + 1); });
      if (k) cls.set(order[k - 1], 'new');
      treeBox.replaceChildren(treeSVG(root, { cls, badge, tags: false }));
      out.replaceChildren(h('span', { class: 'outline' }, 'emitted:'), ...order.map((n, i) => {
        const c = chip(labelOf(n), n.type, (i < k ? 'done' : 'todo') + (i === k - 1 ? ' cur' : ''));
        c.onclick = () => go(i + 1);
        return c;
      }));
      const n = order[k - 1];
      say.textContent = !n ? 'Post-order: for every node, visit its left subtree, then its right subtree, then the node itself. Emit each node when you visit it.'
        : n.type !== 'op' ? `Visit ${labelOf(n)}: a leaf, so emit it.${k === order.length ? '' : ''}`
        : `Visit ${labelOf(n)}: ${OPS[n.op].arity === 2 ? 'both of its subtrees are' : 'its subtree is'} already emitted, so emit ${labelOf(n)}.${k === order.length ? ' That was the root, so the emitted sequence is the complete RPN.' : ''}`;
    }
    input.addEventListener('input', parse);
    parse();
    return h('div', { class: 'viz' }, h('div', { class: 'row' }, h('span', { class: 'outline' }, 'infix:'), input), err, treeBox,
      h('div', { class: 'ctrls' }, bFirst, bPrev, bNext, bAll, counter), say, out);
  }

  // ---- pages ----
  function renderNav() {
    const cur = location.hash.slice(1) || '1';
    nav.replaceChildren(
      ...LEVELS.map((L, i) => {
        const got = L.exercises.filter((_, k) => done.has(`${L.id}:${k}`)).length;
        const all = got === L.exercises.length;
        return h('a', { href: `#${i + 1}`, class: cur === String(i + 1) ? 'on' : '' },
          h('span', { class: 'n' }, String(i + 1)), h('span', { class: 't' }, L.title),
          h('span', { class: 'p' + (all ? ' all' : '') }, all ? '✓' : `${got}/${L.exercises.length}`));
      }),
      h('div', { class: 'sep' }),
      h('a', { href: '#play', class: 'play' + (cur === 'play' ? ' on' : '') }, h('span', { class: 'n' }, '∗'), h('span', { class: 't' }, 'Playground')),
      h('div', { class: 'sep' }),
      h('div', { class: 'keys' }, 'Typing: ', h('code', {}, '*'), ' or ', h('code', {}, '×'), ', ', h('code', {}, '/'), ' or ', h('code', {}, '÷'), ', ', h('code', {}, '^'), ', ', h('code', {}, 'neg'), ', ', h('code', {}, 'sqrt'), '. Put spaces between numbers; around operators they are optional.'),
      ...(done.size ? [h('button', { class: 'reset', onclick: () => { if (!confirm('Clear all ticked-off exercises?')) return; done.clear(); try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } route(); } }, 'reset progress')] : []));
  }

  function renderLevel(i) {
    const L = LEVELS[i];
    main.replaceChildren(h('div', { class: 'kicker' }, `Level ${i + 1} of ${LEVELS.length}`), h('h2', {}, L.title));
    for (const b of L.blocks) {
      if (b.html) main.append(h('div', { class: 'prose', html: b.html }));
      else if (b.example) {
        const v = Viz({ trace: true, traceOpen: i < 2 });
        v.set(b.example, b.vars);
        const res = RPN.run(b.example, b.vars || {}).final[0];
        main.append(h('figure', {}, h('figcaption', {}, b.caption || `${RPN.prettyRPN(b.example)}  ≡  ${RPN.toInfix(res)}`), v.el));
      } else if (b.compare) {
        main.append(h('div', { class: 'compare' }, b.compare.map(src => {
          const v = Viz({ trace: false, startAtEnd: true });
          v.set(src);
          const res = RPN.run(src).final[0];
          return h('figure', {}, h('figcaption', {}, `${RPN.prettyRPN(src)}  ≡  ${RPN.toInfix(res)}`), v.el);
        })));
      } else if (b.postorder) main.append(PostOrder(b.postorder));
    }
    main.append(h('h3', {}, 'Your turn'));
    L.exercises.forEach((ex, k) => main.append(Exercise(ex, `${L.id}:${k}`, k + 1)));
    main.append(h('div', { class: 'pager' },
      i > 0 ? h('a', { href: `#${i}` }, `← ${i}. ${LEVELS[i - 1].title}`) : h('span'),
      i < LEVELS.length - 1 ? h('a', { href: `#${i + 2}` }, `${i + 2}. ${LEVELS[i + 1].title} →`) : h('a', { href: '#play' }, 'Playground →')));
  }

  function renderPlay() {
    let mode = 'infix';
    const input = h('input', { class: 'ans', type: 'text', spellcheck: 'false', autocomplete: 'off', value: '(-b + sqrt(b^2 - 4*a*c)) / (2*a)' });
    const vars = h('input', { class: 'vars', type: 'text', spellcheck: 'false', autocomplete: 'off', value: 'a=1 b=-3 c=2', placeholder: 'variables, e.g. a=1 b=-3' });
    const out = h('div', { class: 'playout' });
    const viz = Viz({ trace: true, traceOpen: true, startAtEnd: true });
    const bInfix = h('button', { class: 'seg on', onclick: () => setMode('infix') }, 'I type infix');
    const bRpn = h('button', { class: 'seg', onclick: () => setMode('rpn') }, 'I type RPN');
    function setMode(m) {
      if (m === mode) return;
      // carry the expression across so switching is a translation, not a reset
      try {
        if (m === 'rpn') input.value = RPN.toRPN(RPN.parseInfix(input.value)).join(' ');
        else { const r = RPN.run(input.value); if (!r.error && r.final.length === 1) input.value = RPN.toInfix(r.final[0], true); }
      } catch (e) { /* leave the text as it is */ }
      mode = m;
      bInfix.classList.toggle('on', m === 'infix');
      bRpn.classList.toggle('on', m === 'rpn');
      update();
    }
    function env() {
      const e = {};
      for (const m of vars.value.matchAll(/([A-Za-z_]\w*)\s*=\s*([-−]?(?:\d+\.?\d*|\.\d+))/g)) e[m[1]] = parseFloat(m[2].replace('−', '-'));
      return e;
    }
    function update() {
      const e = env();
      if (mode === 'infix') {
        try {
          const rpn = RPN.toRPN(RPN.parseInfix(input.value)).join(' ');
          out.replaceChildren(h('span', { class: 'outline' }, 'RPN:'), rpnChips(rpn));
          viz.set(rpn, e);
        } catch (err) {
          out.replaceChildren(h('span', { class: 'fb bad' }, err.message));
          viz.set('', e);
        }
      } else {
        const r = RPN.run(input.value, e);
        viz.set(input.value, e);
        if (r.error) out.replaceChildren(h('span', { class: 'fb bad' }, r.error));
        else if (r.final.length === 1) {
          const v = r.final[0].val;
          out.replaceChildren(h('span', { class: 'outline' }, 'infix:'), h('span', { class: 'mono' }, RPN.toInfix(r.final[0]) + (v !== null ? ` = ${RPN.fmt(v)}` : '')));
        } else out.replaceChildren(h('span', { class: 'outline' }, r.final.length ? `${r.final.length} values on the stack` : 'empty'));
      }
    }
    input.addEventListener('input', update);
    vars.addEventListener('input', update);
    main.replaceChildren(
      h('div', { class: 'kicker' }, 'Free play'), h('h2', {}, 'Playground'),
      h('div', { class: 'prose', html: '<p>Type infix to see its RPN and step through it, or type RPN directly to see what it means. Variables can get values in the second box. Switching modes translates what is in the box.</p>' }),
      h('div', { class: 'ex' }, h('div', { class: 'row' }, bInfix, bRpn), h('div', { class: 'row' }, input, vars), out),
      viz.el);
    update();
  }

  function route() {
    const key = location.hash.slice(1) || '1';
    const i = parseInt(key, 10) - 1;
    if (key === 'play') renderPlay();
    else if (i >= 0 && i < LEVELS.length) renderLevel(i);
    else { location.hash = '#1'; return; }
    renderNav();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
