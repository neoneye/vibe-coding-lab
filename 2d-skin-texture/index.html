<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D Skin Texture</title>
<style>
:root {
  --bg: #11141a; --panel: #1a1f29; --border: #2c3442;
  --text: #dde3ee; --muted: #8a94a6; --accent: #5aa9ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
h1 { font-size: 1.3rem; margin: 0 0 4px; }
.subtitle { color: var(--muted); margin: 0 0 16px; font-size: 0.9rem; }
.layout { display: flex; gap: 16px; align-items: flex-start; }
.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px;
}
.canvas-wrap { flex: 1; min-width: 0; display: flex; justify-content: center; }
#display-canvas { display: block; background: #000; border: 1px solid var(--border); }
.controls {
  flex: 0 0 340px; width: 340px; display: flex; flex-direction: column; gap: 12px;
  max-height: calc(100vh - 110px); overflow-y: auto;
}
fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 0; padding: 8px 12px; }
legend { color: var(--muted); font-size: 0.8rem; padding: 0 4px; }
label.slider { display: block; font-size: 0.85rem; margin: 6px 0; }
label.slider input[type="range"] { width: 100%; }
label.slider input[type="color"] { vertical-align: middle; margin-left: 6px; }
.buttons { display: flex; gap: 8px; margin-bottom: 6px; }
button {
  flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border);
  background: #232a37; color: var(--text); font-size: 0.9rem; cursor: pointer;
}
button:hover { background: #2c3545; }
table.readout { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
table.readout td { padding: 3px 0; }
table.readout td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>2D Skin Texture</h1>
<p class="subtitle">Seamlessly tiling procedural skin — veins and arteries, fine capillaries, subsurface translucency, vitiligo, pigment, freckles, pores, and bump-mapped lighting.</p>
<div class="layout">
  <div class="panel canvas-wrap">
    <canvas id="display-canvas" width="640" height="640"></canvas>
  </div>
  <div class="controls">
    <fieldset class="panel">
      <legend>Actions</legend>
      <div class="buttons">
        <button id="random-btn">Random</button>
        <button id="reset-btn">Reset</button>
      </div>
      <button id="save-btn">Save PNG</button>
      <label class="slider"><input type="checkbox" id="tile-preview"> Tile 2×2 preview</label>
    </fieldset>
    <fieldset class="panel">
      <legend>Noise</legend>
      <label class="slider">Seed: <span id="seed-value"></span>
        <input type="range" id="seed" min="0" max="99" step="1" value="42">
      </label>
      <label class="slider">Feature scale: <span id="scale-value"></span>
        <input type="range" id="scale" min="2" max="8" step="1" value="4">
      </label>
      <label class="slider">Detail: <span id="detail-value"></span>
        <input type="range" id="detail" min="1" max="4" step="1" value="3">
      </label>
    </fieldset>
    <fieldset class="panel">
      <legend>Pigment</legend>
      <label class="slider">Skin tone <input type="color" id="tone" value="#edb98a"></label>
      <label class="slider">Pigment variation: <span id="pigment-value"></span>
        <input type="range" id="pigment" min="0" max="100" step="1" value="35">
      </label>
      <label class="slider">Freckles: <span id="freckles-value"></span>
        <input type="range" id="freckles" min="0" max="100" step="1" value="25">
      </label>
    </fieldset>
    <fieldset class="panel">
      <legend>Blood vessels</legend>
      <label class="slider">Veins (return blood): <span id="vein-visibility-value"></span>
        <input type="range" id="vein-visibility" min="0" max="100" step="1" value="25">
      </label>
      <label class="slider">Arteries: <span id="arteries-value"></span>
        <input type="range" id="arteries" min="0" max="100" step="1" value="20">
      </label>
      <label class="slider">Capillaries (fine): <span id="capillaries-value"></span>
        <input type="range" id="capillaries" min="0" max="100" step="1" value="30">
      </label>
      <label class="slider">Width: <span id="vein-width-value"></span>
        <input type="range" id="vein-width" min="0" max="100" step="1" value="22">
      </label>
      <label class="slider">Scale: <span id="vein-scale-value"></span>
        <input type="range" id="vein-scale" min="1" max="10" step="1" value="5">
      </label>
      <label class="slider">Groove depth: <span id="vein-depth-value"></span>
        <input type="range" id="vein-depth" min="0" max="100" step="1" value="6">
      </label>
      <label class="slider">Vein color <input type="color" id="vein-color" value="#6b7fc4"></label>
    </fieldset>
    <fieldset class="panel">
      <legend>Vitiligo</legend>
      <label class="slider">Coverage: <span id="vitiligo-value"></span>
        <input type="range" id="vitiligo" min="0" max="100" step="1" value="10">
      </label>
      <label class="slider">Edge softness: <span id="vitiligo-softness-value"></span>
        <input type="range" id="vitiligo-softness" min="0" max="100" step="1" value="25">
      </label>
    </fieldset>
    <fieldset class="panel">
      <legend>Translucency</legend>
      <label class="slider">See-through: <span id="see-through-value"></span>
        <input type="range" id="see-through" min="0" max="100" step="1" value="45">
      </label>
    </fieldset>
    <fieldset class="panel">
      <legend>Bump &amp; Light</legend>
      <label class="slider">Undulation: <span id="undulation-value"></span>
        <input type="range" id="undulation" min="0" max="100" step="1" value="18">
      </label>
      <label class="slider">Pores: <span id="pores-value"></span>
        <input type="range" id="pores" min="0" max="100" step="1" value="45">
      </label>
      <label class="slider">Wrinkles: <span id="wrinkles-value"></span>
        <input type="range" id="wrinkles" min="0" max="100" step="1" value="5">
      </label>
      <label class="slider">Light azimuth: <span id="light-azimuth-value"></span>
        <input type="range" id="light-azimuth" min="0" max="360" step="1" value="135">
      </label>
      <label class="slider">Light elevation: <span id="light-elevation-value"></span>
        <input type="range" id="light-elevation" min="5" max="90" step="1" value="40">
      </label>
      <label class="slider">Specular: <span id="specular-value"></span>
        <input type="range" id="specular" min="0" max="100" step="1" value="30">
      </label>
    </fieldset>
    <fieldset class="panel">
      <legend>State</legend>
      <table class="readout">
        <tr><td>Fields built</td><td id="readout-fields">0</td></tr>
        <tr><td>Composite</td><td id="readout-ms">—</td></tr>
        <tr><td>Tile</td><td>512 × 512</td></tr>
      </table>
    </fieldset>
  </div>
</div>
<script id="engine-code">
"use strict";

// Seeded PRNG + shuffled permutation table for the periodic gradient noise.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makePerm(seed) {
  const rand = mulberry32(seed);
  const p = new Uint8Array(512);
  const base = new Uint8Array(256);
  for (let i = 0; i < 256; i++) base[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (rand() * (i + 1)) | 0;
    const t = base[i]; base[i] = base[j]; base[j] = t;
  }
  for (let i = 0; i < 256; i++) { p[i] = base[i]; p[256 + i] = base[i]; }
  return p;
}

const permCache = new Map();
function getPerm(seed) {
  let p = permCache.get(seed);
  if (!p) { p = makePerm(seed); permCache.set(seed, p); }
  return p;
}

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

function grad2(hash, x, y) {
  switch (hash & 7) {
    case 0: return x + y;
    case 1: return x - y;
    case 2: return -x + y;
    case 3: return -x - y;
    case 4: return x;
    case 5: return -x;
    case 6: return y;
    default: return -y;
  }
}

// Periodic 2D gradient noise: the lattice wraps at `period` cells, so a tile
// sampled over [0, freq) is perfectly seamless. Max periods stay <= 96 by
// construction (scale/vein-scale slider ranges), well inside the 512 table.
function noise2(x, y, period, perm) {
  let X = Math.floor(x), Y = Math.floor(y);
  const xf = x - X, yf = y - Y;
  const u = fade(xf), v = fade(yf);
  X = ((X % period) + period) % period;
  Y = ((Y % period) + period) % period;
  const X1 = (X + 1) % period, Y1 = (Y + 1) % period;
  const g00 = grad2(perm[perm[X] + Y], xf, yf);
  const g10 = grad2(perm[perm[X1] + Y], xf - 1, yf);
  const g01 = grad2(perm[perm[X] + Y1], xf, yf - 1);
  const g11 = grad2(perm[perm[X1] + Y1], xf - 1, yf - 1);
  const nx0 = g00 + u * (g10 - g00);
  const nx1 = g01 + u * (g11 - g01);
  return (nx0 + v * (nx1 - nx0)) * 0.71;
}

function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

function sstep(a, b, x) {
  let t = (x - a) / (b - a);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return t * t * (3 - 2 * t);
}

function mix3(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function sampleBilinear(data, size, x, y) {
  x -= Math.floor(x / size) * size;
  y -= Math.floor(y / size) * size;
  const x0 = x | 0, y0 = y | 0;
  const x1 = x0 + 1 === size ? 0 : x0 + 1;
  const y1 = y0 + 1 === size ? 0 : y0 + 1;
  const fx = x - x0, fy = y - y0;
  const r0 = y0 * size, r1 = y1 * size;
  const a = data[r0 + x0], b = data[r0 + x1], c = data[r1 + x0], d = data[r1 + x1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

// Each named field is a cached fbm grid rebuilt only when its inputs change;
// composite() blends them into albedo + height, then applies bump lighting.
class Field {
  constructor({ name, basePeriod, maxOctaves, seedOffset, gain = 0.55 }) {
    this.name = name;
    this.basePeriod = basePeriod;
    this.maxOctaves = maxOctaves;
    this.seedOffset = seedOffset;
    this.gain = gain;
    this.data = null;
    this.built = 0;
    this.key = null;
    this.curPeriod = 0;
  }

  invalidate(key) {
    if (key === this.key) return;
    this.key = key;
    this.built = 0;
    if (this.data) this.data.fill(0);
  }

  pending(octaves) {
    return Math.max(0, Math.min(octaves, this.maxOctaves) - this.built);
  }
}

class SkinEngine {
  static FIELDS = [
    new Field({ name: "warpX",     basePeriod: 3,  maxOctaves: 1, seedOffset: 11 }),
    new Field({ name: "warpY",     basePeriod: 3,  maxOctaves: 1, seedOffset: 23 }),
    new Field({ name: "vein",      basePeriod: 4,  maxOctaves: 3, seedOffset: 37, gain: 0.6 }),
    new Field({ name: "veinFine",  basePeriod: 12, maxOctaves: 1, seedOffset: 53 }),
    new Field({ name: "artery",    basePeriod: 5,  maxOctaves: 1, seedOffset: 167 }),
    new Field({ name: "capillary", basePeriod: 18, maxOctaves: 1, seedOffset: 179 }),
    new Field({ name: "pigment",   basePeriod: 3,  maxOctaves: 3, seedOffset: 71 }),
    new Field({ name: "vitiligo",  basePeriod: 4,  maxOctaves: 2, seedOffset: 89 }),
    new Field({ name: "freckle",   basePeriod: 24, maxOctaves: 1, seedOffset: 101 }),
    new Field({ name: "pore",      basePeriod: 48, maxOctaves: 1, seedOffset: 113 }),
    new Field({ name: "bump",      basePeriod: 3,  maxOctaves: 4, seedOffset: 131 }),
    new Field({ name: "wrinkle",   basePeriod: 9,  maxOctaves: 1, seedOffset: 149 }),
  ];

  constructor({ size }) {
    this.size = size;
    this.params = null;
    this._height = null;
    this._albedo = null;
  }

  setParams(p) {
    this.params = p;
    const common = p.seed + "|" + p.scale;
    for (const f of SkinEngine.FIELDS) {
      let key = common;
      if (f.maxOctaves > 1) key += "|" + p.detail;
      if (f.name === "vein" || f.name === "veinFine" || f.name === "artery") key += "|" + p.veinScale;
      f.invalidate(key);
    }
  }

  octavesFor(f) { return Math.min(f.maxOctaves, this.params.detail); }

  pendingCount() {
    let s = 0;
    for (const f of SkinEngine.FIELDS) s += f.pending(this.octavesFor(f));
    return s;
  }

  builtCount() { let s = 0; for (const f of SkinEngine.FIELDS) s += f.built; return s; }
  totalCount() { let s = 0; for (const f of SkinEngine.FIELDS) s += this.octavesFor(f); return s; }

  buildNextOctave() {
    for (const f of SkinEngine.FIELDS) {
      if (f.pending(this.octavesFor(f)) > 0) {
        this._buildOctave(f, f.built);
        return true;
      }
    }
    return false;
  }

  buildAll() { while (this.buildNextOctave()) { /* build */ } }

  _buildOctave(f, octave) {
    const size = this.size, p = this.params;
    if (!f.data || f.data.length !== size * size) f.data = new Float32Array(size * size);
    const scale = (f.name === "vein" || f.name === "veinFine" || f.name === "artery")
      ? p.veinScale / 5 : p.scale / 4;
    let period = Math.max(2, Math.round(f.basePeriod * scale));
    f.curPeriod = period;
    period <<= octave;
    const perm = getPerm(p.seed + f.seedOffset);
    const amp = Math.pow(f.gain, octave);
    const freq = period;
    const data = f.data, inv = 1 / size;
    let k = 0;
    for (let y = 0; y < size; y++) {
      const ny = y * inv * freq;
      for (let x = 0; x < size; x++, k++) {
        data[k] += amp * noise2(x * inv * freq, ny, freq, perm);
      }
    }
    f.built++;
  }

  composite() {
    const size = this.size, p = this.params;
    const n = size * size;
    const F = {};
    for (const f of SkinEngine.FIELDS) F[f.name] = f.data;

    if (!this._height || this._height.length !== n) {
      this._height = new Float32Array(n);
      this._albedo = new Float32Array(n * 3);
    }
    const height = this._height, albedo = this._albedo;
    const pixels = new Uint8ClampedArray(n * 4);

    const tone = p.tone, veinC = p.veinColor;
    const melanin = [tone[0] * 0.50, tone[1] * 0.44, tone[2] * 0.38];
    const freckleC = mix3([0.45, 0.30, 0.22], melanin, 0.35);
    const pale = mix3([0.98, 0.91, 0.88], tone, 0.55);

    const veinVis = p.veinVisibility / 100;
    const veinDepth = (p.veinDepth / 100) * 0.30;
    const pigAmt = p.pigment / 100;
    const freckleAmt = p.freckles / 100;
    const vitC = p.vitiligo / 100;
    const vitSoft = 0.04 + (p.vitiligoSoftness / 100) * 0.45;
    const seeThrough = p.seeThrough / 100;
    const undAmt = (p.undulation / 100) * 0.38;
    const poreAmt = p.pores / 100;
    const wrinkleAmt = p.wrinkles / 100;
    const specAmt = p.specular / 100;
    const az = p.lightAzimuth * Math.PI / 180;
    const el = p.lightElevation * Math.PI / 180;
    const lx = Math.cos(el) * Math.cos(az), ly = Math.cos(el) * Math.sin(az), lz = Math.sin(el);

    // Domain-warp amount for veins, expressed in pixels (0.3 lattice cells).
    // Note: F holds raw data arrays; curPeriod lives on the Field itself.
    const veinPeriod = SkinEngine.FIELDS.find(f => f.name === "vein").curPeriod;
    const warpPx = 0.30 * size / Math.max(2, veinPeriod);
    const BUMP_STR = 12;

    // Pass A: albedo + height.
    for (let y = 0, i = 0; y < size; y++) {
      for (let x = 0; x < size; x++, i++) {
        const wx = F.warpX[i] * warpPx, wy = F.warpY[i] * warpPx;
        const vn = sampleBilinear(F.vein, size, x + wx, y + wy);
        const vf = sampleBilinear(F.veinFine, size, x + wx, y + wy);
        const va = sampleBilinear(F.artery, size, x + wx, y + wy);
        const vc = sampleBilinear(F.capillary, size, x + wx, y + wy);
        // Soft wide streaks (blurred vessels seen through skin), not hard ridges.
        const softW = 0.03 + (p.veinWidth / 100) * 0.18;
        let soft = clamp01(1 - Math.abs(vn) / softW);
        soft = soft * soft * soft;
        const fineW = softW * 0.6;
        let fine = clamp01(1 - Math.abs(vf) / fineW) * 0.30;
        fine = fine * fine * (3 - 2 * fine);
        const vMask = Math.min(1, soft + fine * (0.2 + 0.8 * soft));
        // Arteries: finer pipes, warmer blood; capillaries: dense red micro-net.
        const artW = 0.02 + (p.veinWidth / 100) * 0.12;
        let art = clamp01(1 - Math.abs(va) / artW);
        art = art * art * art;
        const capW = 0.035 + (p.veinWidth / 100) * 0.045;
        let cap = clamp01(1 - Math.abs(vc) / capW);
        cap = cap * cap;

        const pm = clamp01(0.5 + F.pigment[i] * pigAmt * 1.6);
        let cr = tone[0] + (melanin[0] - tone[0]) * pm;
        let cg = tone[1] + (melanin[1] - tone[1]) * pm;
        let cb = tone[2] + (melanin[2] - tone[2]) * pm;

        const fr = sstep(0.30, 0.75, F.freckle[i]) * freckleAmt * (0.35 + 0.65 * pm);
        cr += (freckleC[0] - cr) * fr;
        cg += (freckleC[1] - cg) * fr;
        cb += (freckleC[2] - cb) * fr;

        let vmask = 0;
        if (vitC > 0) {
          const vThr = 0.55 - vitC * 2.0;
          vmask = sstep(vThr, vThr + vitSoft, F.vitiligo[i]);
          // Keep faint internal variation so patches don't look painted on.
          const paleVar = 0.94 + 0.10 * F.pigment[i];
          cr += (pale[0] * paleVar - cr) * vmask * 0.85;
          cg += (pale[1] * paleVar - cg) * vmask * 0.85;
          cb += (pale[2] * paleVar - cb) * vmask * 0.85;
        }

        const hide = 1 - 0.45 * pm;
        // Blend toward a skin-diluted vein hue so streaks stay translucent.
        const veinMixC = mix3(veinC, tone, 0.35);
        const vmix = Math.min(1, vMask * veinVis * hide * (0.45 + 0.55 * seeThrough) * (1 + 0.3 * vmask));
        cr += (veinMixC[0] - cr) * vmix;
        cg += (veinMixC[1] - cg) * vmix;
        cb += (veinMixC[2] - cb) * vmix;

        // Subsurface glow: red transmission strongest along veins and pale patches.
        const glow = vMask * seeThrough * (0.55 + 0.25 * vmask) * 0.35;
        cr += 0.50 * glow; cg += 0.12 * glow; cb += 0.10 * glow;

        // Arteries: finer, warmer pipes running near the veins.
        const artVis = p.arteries / 100;
        if (artVis > 0) {
          const artC = mix3([0.82, 0.34, 0.30], tone, 0.30);
          const amix = Math.min(1, art * artVis * hide * (0.40 + 0.60 * seeThrough));
          cr += (artC[0] - cr) * amix;
          cg += (artC[1] - cg) * amix;
          cb += (artC[2] - cb) * amix;
        }

        // Capillaries: faint dense red web, stronger where skin is pale/thin.
        const capVis = p.capillaries / 100;
        if (capVis > 0) {
          const capC = mix3([0.78, 0.36, 0.32], tone, 0.42);
          const cmix = Math.min(1, cap * capVis * (0.35 + 0.65 * seeThrough) * (1 + 0.4 * vmask));
          cr += (capC[0] - cr) * cmix;
          cg += (capC[1] - cg) * cmix;
          cb += (capC[2] - cb) * cmix;
        }

        const wreg = clamp01(0.5 + F.bump[i] * 0.8);
        const wl = sstep(0.88, 0.985, 1 - Math.abs(F.wrinkle[i])) * wrinkleAmt * wreg;
        const shade = 1 - wl * 0.10;
        cr *= shade; cg *= shade; cb *= shade;

        const pl = sstep(0.25, 0.85, F.pore[i]) * poreAmt;
        const pshade = 1 - pl * 0.09;
        cr *= pshade; cg *= pshade; cb *= pshade;

        let h = F.bump[i] * undAmt;
        h -= vMask * veinDepth;
        h -= art * veinDepth * 0.4;
        h -= wl * 0.08;
        h -= pl * 0.10;
        height[i] = h;
        albedo[i * 3] = cr;
        albedo[i * 3 + 1] = cg;
        albedo[i * 3 + 2] = cb;
      }
    }

    // Pass B: bump-mapped lighting (neighbors wrap, so the tile stays seamless).
    const hinv = 1 / Math.sqrt(lx * lx + ly * ly + (1 + lz) * (1 + lz));
    const hvx = lx * hinv, hvy = ly * hinv, hvz = (1 + lz) * hinv;

    for (let y = 0, i = 0; y < size; y++) {
      const yu = ((y - 1 + size) % size) * size;
      const yd = ((y + 1) % size) * size;
      const yr = y * size;
      for (let x = 0; x < size; x++, i++) {
        const xl = (x - 1 + size) % size;
        const xr = (x + 1) % size;
        const dhx = (height[yr + xr] - height[yr + xl]) * BUMP_STR;
        const dhy = (height[yd + x] - height[yu + x]) * BUMP_STR;
        const inv = 1 / Math.sqrt(dhx * dhx + dhy * dhy + 1);
        let diff = (-dhx * lx - dhy * ly + lz) * inv;
        if (diff < 0) diff = 0;
        const sd = (-dhx * hvx - dhy * hvy + hvz) * inv;
        const spec = sd > 0 ? Math.pow(sd, 32) * specAmt : 0;
        const li = 0.38 + 0.72 * diff;
        // Albedo/spec are 0..1 floats; scale to bytes here.
        pixels[i * 4] = (albedo[i * 3] * li + spec * 0.95) * 255;
        pixels[i * 4 + 1] = (albedo[i * 3 + 1] * li + spec * 0.88) * 255;
        pixels[i * 4 + 2] = (albedo[i * 3 + 2] * li + spec * 0.80) * 255;
        pixels[i * 4 + 3] = 255;
      }
    }
    return pixels;
  }
}

const SkinTests = {
  run() {
    const failures = [];
    const check = (name, cond) => {
      console.log((cond ? "PASS" : "FAIL") + " " + name);
      if (!cond) failures.push(name);
    };
    const DEFAULTS = {
      seed: 42, scale: 4, detail: 3,
      tone: [0.93, 0.73, 0.54], veinColor: [0.42, 0.50, 0.77],
      pigment: 35, freckles: 25,
      veinVisibility: 25, arteries: 20, capillaries: 30, veinWidth: 22, veinScale: 5, veinDepth: 6,
      vitiligo: 10, vitiligoSoftness: 25, seeThrough: 45,
      undulation: 18, pores: 45, wrinkles: 5,
      lightAzimuth: 135, lightElevation: 40, specular: 30,
    };

    {
      const perm = makePerm(7);
      let bounded = true;
      for (let i = 0; i < 2000; i++) {
        const v = noise2((i * 0.173) % 64, (i * 0.317) % 64, 16, perm);
        if (!(v >= -1.5 && v <= 1.5)) bounded = false;
      }
      check("noise2: bounded", bounded);
      const a = noise2(3.2, 0.7, 4, perm), b = noise2(3.2, 4.7, 4, perm);
      const c = noise2(0.7, 3.2, 4, perm), d = noise2(4.7, 3.2, 4, perm);
      check("noise2: periodic wrap", Math.abs(a - b) < 1e-9 && Math.abs(c - d) < 1e-9);
    }

    {
      const e = new SkinEngine({ size: 64 });
      e.setParams(Object.assign({}, DEFAULTS));
      e.buildAll();
      const vein = SkinEngine.FIELDS.find(f => f.name === "vein").data;
      let seam = 0, interior = 0;
      for (let y = 0; y < 64; y++) {
        seam = Math.max(seam, Math.abs(vein[y * 64] - vein[y * 64 + 63]));
        for (let x = 1; x < 64; x++) interior = Math.max(interior, Math.abs(vein[y * 64 + x] - vein[y * 64 + x - 1]));
      }
      check("field: seam no rougher than interior (" + seam.toFixed(3) + " vs " + interior.toFixed(3) + ")",
        seam <= interior + 1e-9);
    }

    {
      const mk = () => {
        const e = new SkinEngine({ size: 64 });
        e.setParams(Object.assign({}, DEFAULTS));
        e.buildAll();
        return e.composite();
      };
      const a = mk(), b = mk();
      let same = a.length === b.length;
      for (let i = 0; i < a.length && same; i++) if (a[i] !== b[i]) same = false;
      check("composite: deterministic", same);
      let ok = a.length === 64 * 64 * 4;
      for (let i = 3; i < a.length; i += 4) if (a[i] !== 255) ok = false;
      check("composite: opaque RGBA", ok);
    }

    {
      const e = new SkinEngine({ size: 64 });
      e.setParams(Object.assign({}, DEFAULTS, { vitiligo: 0, vitiligoSoftness: 100 }));
      e.buildAll();
      const p1 = e.composite();
      e.setParams(Object.assign({}, DEFAULTS, { vitiligo: 0, vitiligoSoftness: 0 }));
      const p2 = e.composite();
      let same = p1.length === p2.length;
      for (let i = 0; i < p1.length && same; i++) if (p1[i] !== p2[i]) same = false;
      check("composite: vitiligo 0 disables patches", same);
    }

    {
      const e = new SkinEngine({ size: 64 });
      e.setParams(Object.assign({}, DEFAULTS));
      e.buildAll();
      const px = e.composite();
      const g = (x, y) => px[(y * 64 + x) * 4 + 1];
      let seam = 0, interior = 0;
      for (let y = 0; y < 64; y++) {
        seam = Math.max(seam, Math.abs(g(0, y) - g(63, y)));
        for (let x = 1; x < 64; x++) interior = Math.max(interior, Math.abs(g(x, y) - g(x - 1, y)));
      }
      for (let x = 0; x < 64; x++) {
        seam = Math.max(seam, Math.abs(g(x, 0) - g(x, 63)));
        for (let y = 1; y < 64; y++) interior = Math.max(interior, Math.abs(g(x, y) - g(x, y - 1)));
      }
      check("composite: tiles seamlessly (" + seam + " vs " + interior + ")", seam <= interior);
    }

    console.log(failures.length === 0 ? "ALL TESTS PASSED" : failures.length + " FAILURES");
    return failures.length === 0;
  },
};

if (typeof window !== "undefined" && window.location && window.location.hash === "#test") {
  SkinTests.run();
}
</script>
<script>
"use strict";
const SIZE = 512;
const display = document.getElementById("display-canvas");
const displayCtx = display.getContext("2d");
const offscreen = document.createElement("canvas");
offscreen.width = SIZE;
offscreen.height = SIZE;
const offCtx = offscreen.getContext("2d");
const image = offCtx.createImageData(SIZE, SIZE);

const engine = new SkinEngine({ size: SIZE });
let needsComposite = true;
let needsPaint = true;
let lastPixels = null;

const readoutFields = document.getElementById("readout-fields");
const readoutMs = document.getElementById("readout-ms");

function resizeCanvas() {
  const wrap = display.parentElement;
  const avail = Math.max(320, Math.min(
    wrap.clientWidth - 26,
    window.innerHeight - display.getBoundingClientRect().top - 40
  ));
  const size = Math.floor(avail);
  if (display.width !== size) {
    display.width = size;
    display.height = size;
    needsPaint = true;
  }
}
window.addEventListener("resize", resizeCanvas);

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1, 3), 16) / 255,
    parseInt(hex.slice(3, 5), 16) / 255,
    parseInt(hex.slice(5, 7), 16) / 255,
  ];
}

const SLIDER_IDS = [
  "seed", "scale", "detail", "pigment", "freckles",
  "vein-visibility", "arteries", "capillaries", "vein-width", "vein-scale", "vein-depth",
  "vitiligo", "vitiligo-softness", "see-through",
  "undulation", "pores", "wrinkles",
  "light-azimuth", "light-elevation", "specular",
];
const SLIDER_FMT = {
  scale: v => v + "×",
  "light-azimuth": v => v + "°",
  "light-elevation": v => v + "°",
};

function currentParams() {
  const val = id => Number(document.getElementById(id).value);
  const p = {
    seed: val("seed"), scale: val("scale"), detail: val("detail"),
    tone: hexToRgb(document.getElementById("tone").value),
    veinColor: hexToRgb(document.getElementById("vein-color").value),
    pigment: val("pigment"), freckles: val("freckles"),
    veinVisibility: val("vein-visibility"), arteries: val("arteries"),
    capillaries: val("capillaries"), veinWidth: val("vein-width"),
    veinScale: val("vein-scale"), veinDepth: val("vein-depth"),
    vitiligo: val("vitiligo"), vitiligoSoftness: val("vitiligo-softness"),
    seeThrough: val("see-through"),
    undulation: val("undulation"), pores: val("pores"), wrinkles: val("wrinkles"),
    lightAzimuth: val("light-azimuth"), lightElevation: val("light-elevation"),
    specular: val("specular"),
  };
  for (const id of SLIDER_IDS) {
    const v = val(id);
    document.getElementById(id + "-value").textContent = (SLIDER_FMT[id] || (x => x))(v);
  }
  return p;
}

function markDirty() {
  engine.setParams(currentParams());
  needsComposite = true;
}
for (const id of SLIDER_IDS) document.getElementById(id).addEventListener("input", markDirty);
for (const id of ["tone", "vein-color"]) document.getElementById(id).addEventListener("input", markDirty);
document.getElementById("tile-preview").addEventListener("change", () => { needsPaint = true; });

const DEFAULTS = {
  seed: 42, scale: 4, detail: 3, tone: "#edb98a", pigment: 35, freckles: 25,
  "vein-visibility": 25, arteries: 20, capillaries: 30, "vein-width": 22, "vein-scale": 5, "vein-depth": 6,
  "vein-color": "#6b7fc4", vitiligo: 10, "vitiligo-softness": 25, "see-through": 45,
  undulation: 18, pores: 45, wrinkles: 5,
  "light-azimuth": 135, "light-elevation": 40, specular: 30,
};

function applyValues(vals) {
  for (const [id, v] of Object.entries(vals)) {
    const el = document.getElementById(id);
    if (el) el.value = v;
  }
  markDirty();
}

document.getElementById("reset-btn").addEventListener("click", () => applyValues(DEFAULTS));

const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = x => Math.round(255 * x).toString(16).padStart(2, "0");
  return "#" + to(f(0)) + to(f(8)) + to(f(4));
}

document.getElementById("random-btn").addEventListener("click", () => {
  applyValues({
    seed: rnd(0, 99), scale: rnd(3, 6), detail: rnd(2, 4),
    tone: hslToHex(rnd(8, 38), rnd(30, 60), rnd(55, 80)),
    pigment: rnd(10, 70),
    freckles: Math.random() < 0.4 ? 0 : rnd(10, 60),
    "vein-visibility": rnd(15, 70), arteries: rnd(0, 45), capillaries: rnd(10, 60),
    "vein-width": rnd(8, 45),
    "vein-scale": rnd(3, 8), "vein-depth": rnd(0, 45),
    "vein-color": hslToHex(rnd(200, 260), rnd(30, 60), rnd(45, 65)),
    vitiligo: Math.random() < 0.55 ? 0 : rnd(8, 45),
    "vitiligo-softness": rnd(15, 70),
    "see-through": rnd(15, 80),
    undulation: rnd(8, 45), pores: rnd(15, 70), wrinkles: rnd(0, 40),
    "light-azimuth": rnd(0, 359), "light-elevation": rnd(25, 70),
    specular: rnd(10, 55),
  });
});

document.getElementById("save-btn").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "skin-tile-seed" + document.getElementById("seed").value + ".png";
  a.href = offscreen.toDataURL("image/png");
  a.click();
});

function paint(pixels) {
  image.data.set(pixels);
  offCtx.putImageData(image, 0, 0);
  displayCtx.imageSmoothingEnabled = true;
  if (document.getElementById("tile-preview").checked) {
    const h = display.width / 2;
    for (const [dx, dy] of [[0, 0], [h, 0], [0, h], [h, h]]) {
      displayCtx.drawImage(offscreen, dx, dy, h, h);
    }
  } else {
    displayCtx.drawImage(offscreen, 0, 0, display.width, display.height);
  }
}

function frame() {
  if (engine.pendingCount() > 0) {
    const t0 = performance.now();
    while (engine.pendingCount() > 0 && performance.now() - t0 < 24) {
      engine.buildNextOctave();
    }
    needsComposite = true;
    readoutFields.textContent = engine.builtCount() + " / " + engine.totalCount() + " (building)";
  }
  if (needsComposite && engine.pendingCount() === 0) {
    const t0 = performance.now();
    lastPixels = engine.composite();
    readoutMs.textContent = (performance.now() - t0).toFixed(1) + " ms";
    readoutFields.textContent = engine.builtCount() + " / " + engine.totalCount();
    needsComposite = false;
    needsPaint = true;
  }
  if (needsPaint && lastPixels) {
    paint(lastPixels);
    needsPaint = false;
  }
  requestAnimationFrame(frame);
}

engine.setParams(currentParams());
resizeCanvas();
requestAnimationFrame(frame);
</script>
</body>
</html>
