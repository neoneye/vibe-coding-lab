<script id="shared-code">
"use strict";
// Pure model: rig routing, lift arithmetic, scene layout and rope path.
// No DOM. Units: kilograms-force for loads and strength, metres for geometry, y down.

function fmtKg(x) { return String(Math.round(x * 10) / 10); }

const Pulley = {
  STRENGTH_KG: 50,
  TRAVEL_M: 2.0,
  HAND_TRAVEL_M: 1.2,
  G: 9.81,
  MAX_SHEAVES: 4,

  // top/bottom = sheaves in the fixed block (under the beam) and the moving
  // block (above the hook). The rope alternates between the blocks from its
  // anchor, so it can only use min(bottom, top+1) bottom sheaves and
  // min(top, bottom+1) top sheaves; the rest are idle.
  route(top, bottom) {
    const usedBottom = Math.min(bottom, top + 1);
    const usedTop = Math.min(top, bottom + 1);
    const anchor = (usedTop > usedBottom || usedBottom === 0) ? "load" : "ceiling";
    const ma = 2 * usedBottom + (anchor === "load" ? 1 : 0);
    const pullDir = usedTop >= usedBottom && usedTop > 0 ? "down" : "up";
    return { top, bottom, usedTop, usedBottom, anchor, ma, pullDir, idleTop: top - usedTop, idleBottom: bottom - usedBottom };
  },
};

const PulleyTests = {
  run() {
    let pass = 0, fail = 0;
    const test = (name, fn) => {
      try { fn(); pass++; } catch (e) { fail++; console.log("FAIL " + name + ": " + e.message); }
    };
    const assert = (c, m) => { if (!c) throw new Error(m || "assertion failed"); };
    const near = (a, b, eps = 1e-9) => Math.abs(a - b) <= eps;

    test("route table", () => {
      const table = [
        [0, 0, 1, "up"], [1, 0, 1, "down"], [0, 1, 2, "up"], [1, 1, 2, "down"],
        [2, 1, 3, "down"], [1, 2, 4, "up"], [2, 2, 4, "down"], [3, 2, 5, "down"],
        [3, 3, 6, "down"], [4, 3, 7, "down"], [4, 4, 8, "down"], [2, 0, 1, "down"], [0, 2, 2, "up"],
      ];
      for (const [t, b, ma, dir] of table) {
        const r = Pulley.route(t, b);
        assert(r.ma === ma, `(${t},${b}) ma ${r.ma} != ${ma}`);
        assert(r.pullDir === dir, `(${t},${b}) dir ${r.pullDir} != ${dir}`);
      }
    });

    test("route anchors", () => {
      assert(Pulley.route(0, 0).anchor === "load", "bare hook anchors at load");
      assert(Pulley.route(1, 0).anchor === "load", "single fixed pulley anchors at hook");
      assert(Pulley.route(1, 1).anchor === "ceiling", "equal blocks anchor at ceiling");
      assert(Pulley.route(2, 1).anchor === "load", "top+1 anchors at load");
      assert(Pulley.route(0, 1).anchor === "ceiling", "movable pulley anchors at ceiling");
    });

    test("route idle sheaves", () => {
      let r = Pulley.route(2, 0);
      assert(r.usedTop === 1 && r.idleTop === 1 && r.idleBottom === 0, "one idle top");
      r = Pulley.route(0, 2);
      assert(r.usedBottom === 1 && r.idleBottom === 1 && r.idleTop === 0, "one idle bottom");
      r = Pulley.route(4, 1);
      assert(r.usedTop === 2 && r.idleTop === 2 && r.ma === 3, "4 top 1 bottom uses 2 top");
      r = Pulley.route(1, 4);
      assert(r.usedBottom === 2 && r.idleBottom === 2 && r.ma === 4 && r.pullDir === "up", "1 top 4 bottom uses 2 bottom");
      r = Pulley.route(4, 4);
      assert(r.idleTop === 0 && r.idleBottom === 0, "full rig has no idle sheaves");
    });

    test("fmtKg", () => {
      assert(fmtKg(50) === "50" && fmtKg(100 / 3) === "33.3" && fmtKg(12.5) === "12.5", "one decimal max");
    });

    console.log(`${pass} passed, ${fail} failed`);
    return fail === 0;
  },
};
</script>
