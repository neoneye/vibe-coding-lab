<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Yard</title>
<style>
  :root { --bg: #10141a; --panel: #171c24; --line: #2a323d; --text: #dde3ea; --muted: #8b95a1; --p1: #e2553f; --p2: #3f8fe2; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .pl { display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .pl.right { justify-content: flex-end; }
  .pl .name { font-weight: 700; letter-spacing: .5px; }
  #hud1 .name { color: var(--p1); } #hud2 .name { color: var(--p2); }
  .pips { display: inline-flex; gap: 4px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; opacity: .45; }
  .pip.on { background: currentColor; opacity: 1; }
  #hud1 .pips { color: var(--p1); } #hud2 .pips { color: var(--p2); }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stats b { color: var(--text); font-weight: 600; }
  #mid { text-align: center; font-variant-numeric: tabular-nums; }
  #clock { font-size: 22px; font-weight: 700; }
  #clock.hot { color: #ff7a4d; }
  #round { color: var(--muted); font-size: 12px; }
  #wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #cv { display: block; width: 100%; height: 100%; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #msg .box { background: rgba(14,18,24,.9); border: 1px solid var(--line); border-radius: 14px; padding: 20px 28px; text-align: center; max-width: min(620px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #msg h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 2px; }
  #msg h2 { margin: 0 0 6px; font-size: 24px; }
  #msg p { margin: 6px 0; color: #b9c2cc; }
  #msg .go { color: #ffd98a; font-weight: 600; margin-top: 12px; }
  #msg table { margin: 10px auto 4px; border-collapse: collapse; text-align: left; }
  #msg td, #msg th { padding: 3px 12px; }
  #msg th { color: var(--muted); font-weight: 500; }
  kbd { background: #232a34; border: 1px solid #3a4452; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font: 600 12.5px ui-monospace, Menlo, monospace; color: #e8edf3; }
  .c1 { color: var(--p1); font-weight: 700; } .c2 { color: var(--p2); font-weight: 700; }
  #foot { padding: 5px 16px; color: var(--muted); font-size: 12.5px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 6px 18px; flex-wrap: wrap; justify-content: center; }
  #net { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,10,14,.55); }
  #net.open { display: flex; }
  #net .box { background: #141920; border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; width: min(560px, 94vw); max-height: 96%; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #net h2 { margin: 0 0 6px; font-size: 20px; }
  #net p { margin: 6px 0; color: #b9c2cc; }
  #net textarea { width: 100%; height: 74px; background: #0d1116; color: #cfe3ff; border: 1px solid #3a4452; border-radius: 8px; padding: 6px 8px; font: 11.5px/1.35 ui-monospace, Menlo, monospace; resize: vertical; word-break: break-all; }
  #net button { background: #232a34; color: var(--text); border: 1px solid #3a4452; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  #net button:hover { border-color: #56637a; }
  #net button.main { background: #3a2f17; border-color: #e6b65c; color: #ffe3a8; }
  #net .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 2px; }
  #net .err { color: #ff8f7a; min-height: 1.4em; }
  #net label { display: flex; gap: 8px; align-items: flex-start; color: #b9c2cc; margin: 8px 0; }
  #net .step { color: #ffd98a; font-weight: 600; margin-top: 10px; }
  #netbar { color: #8fd19e; }
  #netbar.wait { color: #ffb469; }
  @media (max-width: 700px) { .stats { display: none; } #msg h1 { font-size: 26px; } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pl" id="hud1"><span class="name">RED</span><span class="pips"></span><span class="stats"></span></div>
    <div id="mid"><div id="clock">1:40</div><div id="round">Round 1</div></div>
    <div class="pl right" id="hud2"><span class="stats"></span><span class="pips"></span><span class="name">BLUE</span></div>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="msg"></div><div id="net"></div></div>
  <div id="foot">
    <span><span class="c1">Red</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> + <kbd>Space</kbd></span>
    <span><span class="c2">Blue</span> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> + <kbd>Enter</kbd></span>
    <span><kbd>P</kbd> pause</span><span><kbd>M</kbd> sound</span><span><kbd>R</kbd> new match</span><span><kbd>N</kbd> network game</span><span id="netbar"></span>
  </div>
</div>

<script id="shared-code">
// Blast Yard engine. Pure logic, no DOM. Positions are in cells; a cell's centre is at whole numbers.
const BY = (() => {
  "use strict";
  const W = 13, H = 11, TICK = 1 / 60;
  const FUSE = 2.3, FLAME = 0.5, ROUND = 100, DROP = 0.32, FALL = 0.55, CHAIN = 0.07;
  const FLOOR = 0, PILLAR = 1, CRATE = 2, FALLEN = 3;
  const ITEMS = ["", "bomb", "flame", "speed", "kick"];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // The order in which the yard closes in at the end of a round: round the outside, spiralling inwards.
  function spiral() {
    const out = [], seen = new Uint8Array(W * H);
    let x = 0, y = 0, d = 0;
    const step = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    for (let n = 0; n < W * H; n++) {
      out.push(y * W + x); seen[y * W + x] = 1;
      let nx = x + step[d][0], ny = y + step[d][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen[ny * W + nx]) { d = (d + 1) % 4; nx = x + step[d][0]; ny = y + step[d][1]; }
      x = nx; y = ny;
    }
    return out;
  }
  const SPIRAL = spiral();
  // Blocks come down two at a time, a cell and its opposite across the middle, so neither corner is reached first.
  const PAIRS = (() => { const out = [], seen = new Uint8Array(W * H); for (const a of SPIRAL) { if (seen[a]) continue; const b = W * H - 1 - a; seen[a] = seen[b] = 1; out.push(a === b ? [a] : [a, b]); } return out; })();
  const SPAWN = [[0, H - 1], [W - 1, 0]];   // bottom left and top right

  function createGame(seed, opts) {
    const o = Object.assign({ target: 3, crates: 0.8, itemChance: 0.42 }, opts || {});
    const g = { W, H, seed: seed | 0, wins: [0, 0], round: 0, target: o.target, opts: o, events: [], matchOver: false };
    g.rng = mulberry32(g.seed * 2654435761 + 17);
    startRound(g);
    return g;
  }
  function startRound(g) {
    g.round++;
    g.grid = new Uint8Array(W * H); g.item = new Uint8Array(W * H); g.hidden = new Uint8Array(W * H);
    g.fl = new Float32Array(W * H); g.burn = new Float32Array(W * H);
    g.bombs = []; g.falling = []; g.time = 0; g.phase = "play"; g.endT = -1; g.overT = 0; g.winner = -2; g.dropN = 0; g.bombId = 0;
    const safe = new Set();
    for (const s of SPAWN) for (const d of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) safe.add((s[0] + d[0]) + "," + (s[1] + d[1]));
    const weights = [0, 3, 3, 2, 1];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (x % 2 === 1 && y % 2 === 1) { g.grid[i] = PILLAR; continue; }
      if (safe.has(x + "," + y)) continue;
      if (g.rng() < g.opts.crates) {
        g.grid[i] = CRATE;
        if (g.rng() < g.opts.itemChance) { let r = g.rng() * 9, k = 1; while (r >= weights[k]) { r -= weights[k]; k++; } g.hidden[i] = k; }
      }
    }
    g.players = SPAWN.map((s, id) => ({ id, x: s[0], y: s[1], dir: id === 0 ? [1, 0] : [0, 1], alive: true, bombs: 1, range: 2, speed: 3.4, kick: false, moving: false, walk: 0, deadT: 0 }));
  }

  const solid = (g, x, y) => x < 0 || y < 0 || x >= W || y >= H || g.grid[y * W + x] !== FLOOR;
  function bombAt(g, x, y) { for (const b of g.bombs) if (Math.round(b.x) === x && Math.round(b.y) === y) return b; return null; }
  function blocked(g, p, x, y) { if (solid(g, x, y)) return true; const b = bombAt(g, x, y); return !!b && !b.pass.includes(p.id); }

  // Walk one step. Movement is along one axis; a player between two lanes slides into the one that lets them through.
  function movePlayer(g, p, dx, dy, step) {
    p.dir = [dx, dy];
    const A = dx ? "x" : "y", O = dx ? "y" : "x", d = dx || dy;
    const isB = (a, o) => dx ? blocked(g, p, a, o) : blocked(g, p, o, a);
    let lane = Math.round(p[O]); const off = p[O] - lane, ca = Math.round(p[A]);
    if (Math.abs(off) > 1e-6) {
      let target = lane;
      if (isB(ca + d, lane)) { const alt = lane + Math.sign(off); if (!isB(ca, alt) && !isB(ca + d, alt)) target = alt; else return false; }
      const mv = Math.min(step, Math.abs(p[O] - target));
      p[O] += Math.sign(target - p[O]) * mv; step -= mv;
      if (Math.abs(p[O] - target) < 1e-6) p[O] = target;
      if (step <= 1e-9) return true;
      lane = target;
    }
    let na = p[A] + d * step;
    if (isB(ca + d, lane)) {
      const rel = (p[A] - ca) * d;
      if (rel >= -1e-6) { if (rel < 0.05) tryKick(g, p, dx, dy); return false; }
      if ((na - ca) * d > 0) na = ca;
    }
    p[A] = na;
    return true;
  }
  function tryKick(g, p, dx, dy) {
    if (!p.kick) return;
    const cx = Math.round(p.x) + dx, cy = Math.round(p.y) + dy, b = bombAt(g, cx, cy);
    if (!b || b.vx || b.vy) return;
    if (bombStop(g, b, cx + dx, cy + dy)) return;
    b.vx = dx; b.vy = dy; b.pass = [];
    g.events.push({ type: "kick", x: cx, y: cy });
  }
  // Would a sliding bomb be stopped by this cell?
  function bombStop(g, b, x, y) {
    if (solid(g, x, y)) return true;
    const o = bombAt(g, x, y); if (o && o !== b) return true;
    return g.players.some(p => p.alive && Math.round(p.x) === x && Math.round(p.y) === y);
  }
  function placeBomb(g, p) {
    const x = Math.round(p.x), y = Math.round(p.y);
    if (bombAt(g, x, y) || g.bombs.filter(b => b.owner === p.id).length >= p.bombs) return false;
    g.bombs.push({ id: ++g.bombId, x, y, vx: 0, vy: 0, owner: p.id, t: FUSE, range: p.range,
      pass: g.players.filter(q => q.alive && Math.round(q.x) === x && Math.round(q.y) === y).map(q => q.id) });
    g.events.push({ type: "place", x, y });
    return true;
  }
  function flameCell(g, x, y) {
    const i = y * W + x;
    g.fl[i] = FLAME;
    if (g.item[i]) { g.item[i] = 0; g.events.push({ type: "itemBurn", x, y }); }
    for (const b of g.bombs) if (Math.round(b.x) === x && Math.round(b.y) === y) b.t = Math.min(b.t, CHAIN);
  }
  function explode(g, b) {
    const bx = Math.round(b.x), by = Math.round(b.y);
    g.bombs.splice(g.bombs.indexOf(b), 1);
    g.events.push({ type: "boom", x: bx, y: by, range: b.range });
    flameCell(g, bx, by);
    for (const d of DIRS) for (let k = 1; k <= b.range; k++) {
      const x = bx + d[0] * k, y = by + d[1] * k;
      if (x < 0 || y < 0 || x >= W || y >= H) break;
      const i = y * W + x, c = g.grid[i];
      if (c === PILLAR || c === FALLEN) break;
      if (c === CRATE) { if (g.burn[i] <= 0) { g.burn[i] = FLAME; g.events.push({ type: "crate", x, y }); } break; }
      flameCell(g, x, y);
    }
  }
  function kill(g, p, why) {
    if (!p.alive) return;
    p.alive = false; p.deadT = 0;
    g.events.push({ type: "die", id: p.id, x: p.x, y: p.y, why });
    if (g.endT < 0) g.endT = 1.1;
  }

  // One tick. inputs[i] = { dx, dy, bomb } for player i.
  function tick(g, inputs) {
    const dt = TICK;
    if (g.phase === "over") {   // the round is decided; let what is in the air come down
      g.overT += dt; fade(g, dt); for (const p of g.players) if (!p.alive) p.deadT += dt;
      for (const f of g.falling) { f.t -= dt; if (f.t <= 0) { g.grid[f.i] = FALLEN; g.events.push({ type: "land", x: f.i % W, y: (f.i / W) | 0 }); } }
      g.falling = g.falling.filter(f => f.t > 0);
      return;
    }
    g.time += dt;
    g.players.forEach((p, i) => {
      if (!p.alive) { p.deadT += dt; return; }
      const inp = inputs && inputs[i] || {};
      if (inp.bomb) placeBomb(g, p);
      p.moving = false;
      if (inp.dx || inp.dy) { const dx = inp.dx ? Math.sign(inp.dx) : 0, dy = dx ? 0 : Math.sign(inp.dy); p.moving = movePlayer(g, p, dx, dy, p.speed * dt); }
      if (p.moving) p.walk += dt * p.speed;
      const i2 = Math.round(p.y) * W + Math.round(p.x), it = g.item[i2];
      if (it) {
        g.item[i2] = 0;
        if (it === 1) p.bombs = Math.min(8, p.bombs + 1); else if (it === 2) p.range = Math.min(9, p.range + 1);
        else if (it === 3) p.speed = Math.min(6.2, p.speed + 0.55); else p.kick = true;
        g.events.push({ type: "pickup", id: p.id, item: ITEMS[it], x: p.x, y: p.y });
      }
    });
    // bombs: let go of players who have stepped off, slide, burn down
    for (const b of g.bombs) {
      b.pass = b.pass.filter(id => { const p = g.players[id]; return p.alive && Math.max(Math.abs(p.x - b.x), Math.abs(p.y - b.y)) < 0.9; });
      if (b.vx || b.vy) {
        const A = b.vx ? "x" : "y", v = b.vx || b.vy, c = Math.round(b[A]), before = (b[A] - c) * v;
        let n = b[A] + v * 7.5 * dt;
        if (before <= 1e-9 && (n - c) * v > 0) {
          const nx = Math.round(b.x) + b.vx, ny = Math.round(b.y) + b.vy;
          if (bombStop(g, b, nx, ny)) { n = c; b.vx = b.vy = 0; }
        }
        b[A] = n;
      }
      if (g.fl[Math.round(b.y) * W + Math.round(b.x)] > 0) b.t = Math.min(b.t, CHAIN);
      b.t -= dt;
    }
    for (let guard = 0; guard < 200; guard++) { const b = g.bombs.find(q => q.t <= 0); if (!b) break; explode(g, b); }
    fade(g, dt);
    // the yard closes in
    if (g.time >= ROUND) {
      while (g.dropN < PAIRS.length && g.time >= ROUND + g.dropN * DROP) {
        for (const i of PAIRS[g.dropN++]) if (g.grid[i] !== PILLAR && g.grid[i] !== FALLEN) { g.falling.push({ i, t: FALL }); g.events.push({ type: "drop", x: i % W, y: (i / W) | 0 }); }
      }
    }
    for (const f of g.falling) {
      f.t -= dt;
      if (f.t <= 0) {
        const x = f.i % W, y = (f.i / W) | 0;
        g.grid[f.i] = FALLEN; g.item[f.i] = 0; g.hidden[f.i] = 0; g.burn[f.i] = 0; g.fl[f.i] = 0;
        g.bombs = g.bombs.filter(b => !(Math.round(b.x) === x && Math.round(b.y) === y));
        for (const p of g.players) if (p.alive && Math.round(p.x) === x && Math.round(p.y) === y) kill(g, p, "crush");
        g.events.push({ type: "land", x, y });
      }
    }
    g.falling = g.falling.filter(f => f.t > 0);
    for (const p of g.players) if (p.alive && g.fl[Math.round(p.y) * W + Math.round(p.x)] > 0) kill(g, p, "flame");
    if (g.endT >= 0) {
      g.endT -= dt;
      if (g.endT <= 0) {
        const alive = g.players.filter(p => p.alive);
        g.winner = alive.length === 1 ? alive[0].id : -1;
        if (g.winner >= 0) g.wins[g.winner]++;
        g.matchOver = g.wins.some(w => w >= g.target);
        g.phase = "over"; g.overT = 0;
        g.events.push({ type: "roundEnd", winner: g.winner });
      }
    }
  }
  function fade(g, dt) {
    for (let i = 0; i < W * H; i++) {
      if (g.fl[i] > 0) g.fl[i] = Math.max(0, g.fl[i] - dt);
      if (g.burn[i] > 0) { g.burn[i] -= dt; if (g.burn[i] <= 0) { g.burn[i] = 0; if (g.grid[i] === CRATE) { g.grid[i] = FLOOR; g.item[i] = g.hidden[i]; g.hidden[i] = 0; } } }
    }
  }
  function nextRound(g) { if (g.matchOver) { g.wins = [0, 0]; g.round = 0; g.matchOver = false; } startRound(g); }

  // One tick for a networked game, where "next round" has to happen on the same tick for both: go is part of the input.
  function step(g, inputs) {
    if (g.phase === "over" && g.overT > 0.6 && inputs.some(i => i && i.go)) { nextRound(g); g.events.push({ type: "roundStart" }); return; }
    tick(g, inputs);
  }
  // A fingerprint of everything that matters, to notice two linked games drifting apart.
  function stateHash(g) {
    let h = 2166136261;
    const add = v => { h ^= v & 0xffff; h = Math.imul(h, 16777619); h ^= (v >> 16) & 0xffff; h = Math.imul(h, 16777619); };
    add(g.round); add(g.wins[0]); add(g.wins[1]); add(g.phase === "over" ? 1 : 0);
    for (const p of g.players) { add(Math.round(p.x * 4096)); add(Math.round(p.y * 4096)); add(p.alive ? 1 : 0); add(p.bombs); add(p.range); add(Math.round(p.speed * 100)); add(p.kick ? 1 : 0); }
    for (const b of g.bombs) { add(Math.round(b.x * 4096)); add(Math.round(b.y * 4096)); add(Math.round(b.t * 1000)); add(b.owner); }
    for (let i = 0; i < W * H; i++) add(g.grid[i] + g.item[i] * 8 + g.hidden[i] * 64 + (g.fl[i] > 0 ? 512 : 0));
    return h >>> 0;
  }
  // ---- two browsers, one game ----
  // Both run the same simulation and only swap key presses. My keys for tick n are sent `delay` ticks ahead, and a tick
  // is only simulated once the other side's keys for it have arrived, so both sides compute exactly the same game.
  function createLink(me, delay) { const D = delay || 3; return { me, D, L: 0, sent: D, mine: {}, theirs: {}, myHash: {}, theirHash: {}, desync: false }; }
  // Try to simulate one tick. sampleFn gives my keys, send transmits a message. Returns false while waiting for the other side.
  function linkStep(link, g, sampleFn, send) {
    if (link.sent <= link.L + link.D) { const k = sampleFn(); link.mine[link.sent] = k; send({ t: "i", n: link.sent, d: [k.dx | 0, k.dy | 0, k.bomb ? 1 : 0, k.go ? 1 : 0] }); link.sent++; }
    const L = link.L, live = L >= link.D;
    if (live && !link.theirs[L]) return false;
    const a = live ? link.mine[L] : {}, b = live ? link.theirs[L] : {};
    step(g, link.me === 0 ? [a, b] : [b, a]);
    delete link.mine[L]; delete link.theirs[L];
    link.L++;
    if (link.L % 120 === 0) { const h = stateHash(g); send({ t: "h", n: link.L, h }); compare(link, link.L, h, link.theirHash); link.myHash[link.L] = h; }
    return true;
  }
  function compare(link, n, h, other) { if (other[n] !== undefined) { if (other[n] !== h) link.desync = true; delete other[n]; delete link.myHash[n]; } }
  function linkReceive(link, m) {
    if (m.t === "i") link.theirs[m.n] = { dx: m.d[0], dy: m.d[1], bomb: !!m.d[2], go: !!m.d[3] };

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);

  // ---- the view: a camera straight above the middle of the yard ----
  // Everything has a height, so with perspective the blocks and figures lean away from the middle, and a slight
  // barrel distortion (the fish eye) bends the edges of the yard. Lengths are in cells; z is height above the ground.
  const CAM = 9, FISH = .07, WALL = .5, PIL = .55, CRT = .45;   // camera height, strength of the fish eye, block heights
  const CX = (W - 1) / 2, CY = (H - 1) / 2, RAD = Math.hypot(CX + 1.5, CY + 1.5);

  function draw() {

    const foot = "<p class='err' id='nerr'></p><div class='btns'><button id='nclose'>Close</button></div>";
    if (net.active) el.innerHTML = "<div class='box'><h2>Network game</h2><p>Connected. You are <span class='c" + (net.role + 1) + "'>" + NAMES[net.role] + "</span>.</p><div class='btns'><button id='ndrop'>Disconnect</button><button id='nclose'>Close</button></div></div>";
    else if (view === "host") el.innerHTML = "<div class='box'><h2>Host a game</h2><p class='step'>1. Send this invitation to the other player</p><textarea id='ncode' readonly>working…</textarea><div class='btns'><button id='ncopy'>Copy invitation</button></div><p class='step'>2. Paste the reply they send back</p><textarea id='nin' placeholder='BY1.…'></textarea><div class='btns'><button id='ngo' class='main'>Connect</button></div>" + foot + "</div>";
    else if (view === "join") el.innerHTML = "<div class='box'><h2>Join a game</h2><p class='step'>1. Paste the invitation the host sent you</p><textarea id='nin' placeholder='BY1.…'></textarea><div class='btns'><button id='ngo' class='main'>Make my reply</button></div><div id='nreply' style='display:none'><p class='step'>2. Send this reply back to the host</p><textarea id='ncode' readonly></textarea><div class='btns'><button id='ncopy'>Copy reply</button></div><p>The game starts by itself once the host has pasted it.</p></div>" + foot + "</div>";
    else el.innerHTML = "<div class='box'><h2>Play against another computer</h2><p>The two browsers connect directly to each other. There is no server to introduce them, so you swap two short codes by chat or mail: one player hosts and sends an invitation, the other answers with a reply. The host plays <span class='c1'>Red</span>, the guest <span class='c2'>Blue</span>, and each steers with either set of keys.</p>" + stunBox + "<div class='btns'><button id='nhost' class='main'>Host a game</button><button id='njoin'>Join a game</button></div>" + foot + "</div>";
    const on = (id, f) => { const b = $(id); if (b) b.onclick = () => Promise.resolve().then(f).catch(e => { const er = $("nerr"); if (er) er.textContent = e.message || String(e); }); };
    const stun = () => net.stun !== false;
    on("nclose", closePanel); on("ndrop", () => { netLost(); closePanel(); });
    on("nhost", async () => { net.stun = $("stun").checked; openPanel("host"); $("ncode").value = await netHost(stun()); });
    on("njoin", () => { net.stun = $("stun").checked; openPanel("join"); });
    on("ncopy", async () => { const t = $("ncode"); t.select(); try { await navigator.clipboard.writeText(t.value); $("ncopy").textContent = "Copied"; } catch (e) { $("nerr").textContent = "Select the code and copy it by hand."; } });
    on("ngo", async () => {
      const code = $("nin").value; if (!code.trim()) throw new Error("Paste the code first.");
      if (view === "host") { await netAccept(code); $("nerr").textContent = "Connecting…"; }
      else { $("ncode").value = await netJoin(code, stun()); $("nreply").style.display = "block"; }
    });
  }
  function netBar() {
    const el = $("netbar"), t = !net.active ? "" : net.stall > .4 ? "Waiting for the other player…" : "Connected · you are " + NAMES[net.role];
    if (el.textContent !== t) el.textContent = t; el.classList.toggle("wait", net.stall > .4);
  }

  // ---- main loop: fixed 60 Hz simulation ----
  function sim(dt) {
    clock += dt;
    if (mode === "title" || paused) return;
    acc += dt;
    if (net.active && net.link) {
      const mine = () => { const k = BY.sample(inputs[0], 0); k.go = netGo; netGo = false; return k; };
      let waited = true;
      while (acc >= BY.TICK) {
        if (!BY.linkStep(net.link, g, mine, netSend)) { acc = Math.min(acc, BY.TICK); break; }   // the other side's keys are not here yet
        acc -= BY.TICK; waited = false; handleEvents();
      }
      net.stall = waited && acc >= BY.TICK ? net.stall + dt : 0;
      if (net.link.desync && !net.told) { net.told = true; showMsg(); }
    } else while (acc >= BY.TICK) {
      acc -= BY.TICK;
      BY.tick(g, mode === "play" ? [BY.sample(inputs[0], 0), BY.sample(inputs[1], 0)] : []);
      handleEvents();
    }
    shake *= Math.pow(.02, dt);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 520 * dt; if (p.z < 0) { p.z = 0; p.vz *= -.35; p.vx *= .5; p.vy *= .5; } p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    sim(dt); hud(); netBar(); draw();
  }
  if (q.has("shot")) {   // a staged scene for the gallery picture
    mode = "play";
    for (const [x, y] of [[4, 4], [5, 4], [6, 4], [7, 4], [8, 4], [6, 2], [6, 3], [6, 5], [6, 6], [4, 6], [5, 6], [7, 6], [8, 6], [4, 5], [8, 5], [2, 6], [3, 6], [8, 2], [8, 3], [10, 4], [9, 4]]) { g.grid[y * W + x] = 0; g.hidden[y * W + x] = 0; }
    g.item[6 * W + 4] = 2; g.item[2 * W + 8] = 3; g.item[6 * W + 7] = 4;
    Object.assign(g.players[0], { x: 4, y: 5.6, dir: [0, 1], moving: true, walk: .3, bombs: 3, range: 3 }); Object.assign(g.players[1], { x: 10.4, y: 4, dir: [1, 0], moving: true, walk: .5, bombs: 2, range: 4, kick: true });
    g.bombs.push({ id: 1, x: 6, y: 4, vx: 0, vy: 0, owner: 0, t: .02, range: 3, pass: [] }, { id: 2, x: 2, y: 6, vx: 0, vy: 0, owner: 0, t: 1.4, range: 3, pass: [] }, { id: 3, x: 8, y: 6, vx: 0, vy: 0, owner: 1, t: 2, range: 4, pass: [] });
    g.time = 37; for (let k = 0; k < 9; k++) { BY.tick(g, []); handleEvents(); clock += 1 / 60; for (const p of parts) { p.x += p.vx / 60; p.y += p.vy / 60; p.z += p.vz / 60; } }
    paused = true;
  }
  showMsg(); hud(); draw();
  requestAnimationFrame(frame);
  // for testing in a hidden tab: drive the game by hand
  window.__by = { get g() { return g; }, inputs, BY, net, netHost, netJoin, netAccept, openPanel, start() { mode = "play"; showMsg(); }, step(sec) { const n = Math.round(sec * 60); for (let k = 0; k < n; k++) sim(1 / 60); hud(); netBar(); draw(); }, state: () => ({ mode, paused }) };
})();
</script>
