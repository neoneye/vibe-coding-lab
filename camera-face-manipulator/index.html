                if (!facing(m, sp.anchor.t)) continue;
                const [x, y] = place(m, sp.anchor);
                const age = (now - sp.born) / 1000;
                const a = Math.max(0, Math.min(1, (keep - age) / 2));
                ctx.fillStyle = splatColor(p, 0.9 * a);
                ctx.beginPath();
                ctx.ellipse(x, y, sp.r * sp.stretch, sp.r / Math.sqrt(sp.stretch), sp.ang, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (const d of boom.drops) {
            ctx.fillStyle = splatColor(p, 0.95);
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ctx.fill();
        }
        // Chunks of the eye: round, gooey pieces of its own pixels
        for (const f of boom.frags) {
            const r = Math.min(f.sw, f.sh) * 0.62;
            ctx.save();
            ctx.globalAlpha = Math.min(1, f.life / 0.4);
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rot);
            ctx.scale(f.scale, f.scale * 0.85);
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.save();
            ctx.clip();
            ctx.drawImage(f.img, f.sx, f.sy, f.sw, f.sh, -f.sw / 2, -f.sh / 2, f.sw, f.sh);
            ctx.restore();
            ctx.strokeStyle = splatColor(p, 0.9);
            ctx.lineWidth = r * 0.35;
            ctx.stroke();
            ctx.restore();
        }

        // Blobs on the camera lens: big, out of focus, slowly running down
        for (const b of boom.lens) {
            if (now < b.land) continue;
            const age = (now - b.land) / 1000;
            const a = Math.max(0, Math.min(1, (keep - (now - b.born) / 1000) / 2));
            const run = Math.min(b.r * 4, age * b.r * 0.35 * b.run);
            ctx.save();
            ctx.fillStyle = splatColor(p, 0.82 * a);
            ctx.shadowColor = splatColor(p, 0.6 * a);
            ctx.shadowBlur = b.r * 0.25;
            ctx.beginPath();
            b.pts.forEach((k, j) => {
                const t = j / b.pts.length * Math.PI * 2;
                const x = b.x + Math.cos(t) * b.r * k, y = b.y + Math.sin(t) * b.r * k;
                j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            });
            ctx.closePath();
            ctx.fill();
            if (run > 1) {
                const w = b.r * 0.35;
                ctx.beginPath();
                ctx.moveTo(b.x - w, b.y);
                ctx.lineTo(b.x - w * 0.6, b.y + b.r + run);
                ctx.arc(b.x, b.y + b.r + run, w * 0.6, Math.PI, 0, true);
                ctx.lineTo(b.x + w, b.y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
            glossSpot(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.35, 0.35 * a);
        }
        for (const f of boom.flashes) {
            const t = (now - f.t0) / 250;
            const r = f.r * (0.6 + 2.5 * t);
            const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
            g.addColorStop(0, `rgba(255,240,220,${0.8 * (1 - t)})`);
            g.addColorStop(0.5, p.xInk ? `rgba(40,40,40,${0.5 * (1 - t)})` : `rgba(200,20,10,${0.5 * (1 - t)})`);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
        }
    }

    // ---- Background removal ----
    // MediaPipe's selfie segmenter gives a person-confidence mask; the
    // person is cut out through it and laid over a replacement backdrop.
    // The model only loads the first time a backdrop is chosen.

    let vision = null;
    let segmenter = null, segState = 'idle';
    const segMaskC = document.createElement('canvas');
    const segMaskCtx = segMaskC.getContext('2d');
    const personC = document.createElement('canvas');
    const personCtx = personC.getContext('2d');
    const blurC = document.createElement('canvas');
    const blurCtx = blurC.getContext('2d');
    let segImage = null;

    async function loadSegmenter() {
        segState = 'loading';
        const note = document.getElementById('bgNote');
        note.textContent = 'Loading segmentation model…';
        try {
            segmenter = await vision.ImageSegmenter.createFromOptions(vision.resolver, {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                outputCategoryMask: false,
                outputConfidenceMasks: true
            });
            segState = 'ready';
            note.textContent = '';
        } catch (err) {
            segState = 'error';
            note.textContent = 'Segmentation failed: ' + err.message;
            console.error(err);
        }
    }

    // ---- Face + neck only, and zoom to fit ----
    //
    // The keep region is built from the landmarks in the face's own frame
    // (up = chin → forehead): the face outline pushed outwards, more
    // upwards to take in the hair, plus a neck that tapers down from the
    // jaw. It is generous on purpose: the person mask still decides the
    // exact outline, this only removes the shoulders and body.

    const keepC = document.createElement('canvas');
    const keepCtx = keepC.getContext('2d');

    function headFrame(lm, W, H) {
        const P = i => [lm[i].x * W, lm[i].y * H];
        const top = P(10), chin = P(152);
        let ux = top[0] - chin[0], uy = top[1] - chin[1];
        const hF = Math.hypot(ux, uy) || 1;
        ux /= hF; uy /= hF;
        const jl = P(172), jr = P(397);
        const jaw = Math.hypot(jr[0] - jl[0], jr[1] - jl[1]);
        const cl = P(234), cr = P(454);
        const faceW = Math.hypot(cr[0] - cl[0], cr[1] - cl[1]);
        return { P, top, chin, ux, uy, hF, jl, jr, jaw, faceW,
                 cx: (top[0] + chin[0]) / 2, cy: (top[1] + chin[1]) / 2 };
    }

    function drawHeadNeckMask(lm, W, H, neck) {
        if (!OVAL) return;
        if (keepC.width !== W || keepC.height !== H) { keepC.width = W; keepC.height = H; }
        keepCtx.clearRect(0, 0, W, H);
        const f = headFrame(lm, W, H);
        const head = OVAL.map(i => {
            const [x, y] = f.P(i);
            const dx = x - f.cx, dy = y - f.cy;
            const up = (dx * f.ux + dy * f.uy) / (f.hF / 2);
            const k = 1.3 + 0.45 * Math.max(0, up);
            return [f.cx + dx * k, f.cy + dy * k];
        });
        const sx = -f.uy, sy = f.ux;   // across the face
        const bx = f.chin[0] - f.ux * neck * f.hF, by = f.chin[1] - f.uy * neck * f.hF;
        const wN = f.jaw * 0.36;
        const neckPoly = [f.jl, f.jr, [bx + sx * wN, by + sy * wN], [bx - sx * wN, by - sy * wN]];
        // Order the bottom corners to match the jaw corners
        if ((f.jr[0] - f.jl[0]) * sx + (f.jr[1] - f.jl[1]) * sy < 0) neckPoly.push(neckPoly.splice(2, 1)[0]);

        const off = W * 4;
        keepCtx.save();
        keepCtx.shadowColor = '#fff';
        keepCtx.shadowBlur = f.hF * 0.06;
        keepCtx.shadowOffsetX = off;
        keepCtx.fillStyle = '#fff';
        for (const poly of neck > 0 ? [head, neckPoly] : [head]) {
            tracePoly(keepCtx, poly, -off);
            keepCtx.fill();
        }
        keepCtx.restore();
    }

    // Smoothed view transform: centre (cx, cy) and magnification k
    const zoom = { cx: 0, cy: 0, k: 0 };
    const zoomC = document.createElement('canvas');
    const zoomCtx = zoomC.getContext('2d');

    function zoomToFace(lm, W, H, fit, smooth, bg) {
        const f = headFrame(lm, W, H);
        const neck = num('bgNeck') / 100;
        // Head + neck extent: hair above the forehead to the neck cut
        const topX = f.top[0] + f.ux * f.hF * 0.45, topY = f.top[1] + f.uy * f.hF * 0.45;
        const botX = f.chin[0] - f.ux * Math.max(0.15, neck) * f.hF;
        const botY = f.chin[1] - f.uy * Math.max(0.15, neck) * f.hF;
        const regionH = Math.hypot(topX - botX, topY - botY);
        const regionW = f.faceW * 1.35;
        const k = Math.min(fit * H / regionH, fit * W / regionW);
        const cx = (topX + botX) / 2, cy = (topY + botY) / 2;

        if (zoom.k === 0) {
            Object.assign(zoom, { cx, cy, k });
        } else {
            const a = 1 - smooth;
            zoom.cx += (cx - zoom.cx) * a;
            zoom.cy += (cy - zoom.cy) * a;
            zoom.k *= Math.pow(k / zoom.k, a);
        }

        if (zoomC.width !== W || zoomC.height !== H) { zoomC.width = W; zoomC.height = H; }
        zoomCtx.drawImage(canvas, 0, 0);

        // Source rectangle, clipped to the frame (with the destination
        // adjusted to match), so no browser has to extrapolate.
        let sw = W / zoom.k, sh = H / zoom.k;
        let sx = zoom.cx - sw / 2, sy = zoom.cy - sh / 2;
        let dx = 0, dy = 0, dw = W, dh = H;
        const k2 = zoom.k;
        if (sx < 0) { dx -= sx * k2; dw += sx * k2; sw += sx; sx = 0; }
        if (sy < 0) { dy -= sy * k2; dh += sy * k2; sh += sy; sy = 0; }
        if (sx + sw > W) { const o = sx + sw - W; sw -= o; dw -= o * k2; }
        if (sy + sh > H) { const o = sy + sh - H; sh -= o; dh -= o * k2; }

        ctx.fillStyle = bg === 'color' ? document.getElementById('bgColor').value
                      : bg === 'fog' ? '#07090c' : '#000';
        ctx.fillRect(0, 0, W, H);
        if (sw > 1 && sh > 1) {
            ctx.save();
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(zoomC, sx, sy, sw, sh, dx, dy, dw, dh);
            ctx.restore();
        }
    }

    function replaceBackground(W, H, mirror, mode, edge, keepLm) {
        if (!vision) return;
        if (segState === 'idle') loadSegmenter();
        if (segState !== 'ready') return;

        let got = false;
        segmenter.segmentForVideo(video, performance.now(), res => {
            const mask = res.confidenceMasks && res.confidenceMasks[0];
            if (!mask) return;
            const mw = mask.width, mh = mask.height;
            const conf = mask.getAsFloat32Array();
            if (segMaskC.width !== mw || segMaskC.height !== mh) {
                segMaskC.width = mw; segMaskC.height = mh;
                segImage = segMaskCtx.createImageData(mw, mh);
            }
            // Edge: 0 = hard cut-out, 100 = soft, wide transition
            const gain = 1 + (1 - edge) * 10;
            const d = segImage.data;
            for (let i = 0; i < conf.length; i++) {
                const a = Math.min(1, Math.max(0, (conf[i] - 0.5) * gain + 0.5));
                d[i * 4 + 3] = a * 255;
            }
            segMaskCtx.putImageData(segImage, 0, 0);
            got = true;
        });
        if (!got) return;

        if (personC.width !== W || personC.height !== H) { personC.width = W; personC.height = H; }
        personCtx.globalCompositeOperation = 'source-over';
        personCtx.clearRect(0, 0, W, H);
        personCtx.drawImage(canvas, 0, 0);
        personCtx.globalCompositeOperation = 'destination-in';
        personCtx.save();
        if (mirror) { personCtx.translate(W, 0); personCtx.scale(-1, 1); }
        personCtx.drawImage(segMaskC, 0, 0, W, H);
        personCtx.restore();
        if (keepLm) {
            // Face + neck only: also cut away shoulders and body
            drawHeadNeckMask(keepLm, W, H, num('bgNeck') / 100);
            personCtx.drawImage(keepC, 0, 0);
        }
        personCtx.globalCompositeOperation = 'source-over';

        if (mode === 'blur') {
            // Cheap blur that works in every browser: shrink, then enlarge
            const bw = Math.max(4, Math.round(W / 14)), bh = Math.max(3, Math.round(H / 14));
            if (blurC.width !== bw || blurC.height !== bh) { blurC.width = bw; blurC.height = bh; }
            blurCtx.drawImage(canvas, 0, 0, bw, bh);
            ctx.save();
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(blurC, 0, 0, W, H);
            ctx.restore();
        } else if (mode === 'fog') {
            const t = performance.now() / 1000;
            ctx.fillStyle = '#07090c';
            ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < 6; i++) {
                const x = W * (0.5 + 0.45 * Math.sin(t * 0.07 * (i + 1) + i * 1.7));
                const y = H * (0.55 + 0.35 * Math.sin(t * 0.05 * (i + 2) + i * 2.3));
                const r = Math.max(W, H) * (0.35 + 0.1 * Math.sin(t * 0.1 + i));
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(120,130,140,0.16)');
                g.addColorStop(1, 'rgba(120,130,140,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
            }
        } else {
            ctx.fillStyle = mode === 'color' ? document.getElementById('bgColor').value : '#000';
            ctx.fillRect(0, 0, W, H);
        }
        ctx.drawImage(personC, 0, 0);
    }

    // ---- Init ----

    try {
        const { FaceLandmarker, FilesetResolver, ImageSegmenter } = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        );

        // Face mesh triangles: the tessellation lists each triangle as
        // three consecutive edges a→b, b→c, c→a.
        const tess = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
        TRIS = new Int32Array(tess.length);
        tess.forEach((e, i) => { TRIS[i] = e.start; });
        OVAL = FaceLandmarker.FACE_LANDMARKS_FACE_OVAL.map(e => e.start);

        const resolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        vision = { ImageSegmenter, resolver };

        const faceLandmarker = await FaceLandmarker.createFromOptions(resolver, {
            baseOptions: {
                modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
        });

        statusEl.textContent = "Starting camera...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
        });
        video.srcObject = stream;
        await video.play();

        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        document.querySelector('.stage').style.setProperty(
            '--ar', `${video.videoWidth} / ${video.videoHeight}`);
        statusEl.style.display = 'none';

        // ---- Render loop ----

        let lastT = -1;
        const seenErrors = new Set();
        let lastFaceLm = null;

        function loop() {
            if (video.currentTime !== lastT) {
                lastT = video.currentTime;
                const W = canvas.width, H = canvas.height;
                const hp = readHorror();

                // Draw video, mirrored unless camera view is selected
                const mirror = document.getElementById('mirrorView').checked;
                ctx.save();
                if (mirror) {
                    ctx.translate(W, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, W, H);
                ctx.restore();

                // Detect the face first: the face + neck cut-out needs
                // its landmarks. They must match the canvas orientation.
                let faceLm = null;
                try {
                    const res = faceLandmarker.detectForVideo(video, performance.now());
                    if (res.faceLandmarks?.length > 0) {
                        faceLm = res.faceLandmarks[0].map(p => ({
                            x: mirror ? 1 - p.x : p.x,
                            y: p.y,
                            z: p.z
                        }));
                        lastFaceLm = faceLm;
                    }
                } catch (err) {
                    if (!seenErrors.has(err.message)) {
                        seenErrors.add(err.message);
                        console.warn(err);
                    }
                }

                // Background removal comes next, so every crop and
                // effect below works on the cut-out person.
                const bg = document.getElementById('bgMode').value;
                const faceOnly = on('bgFace');
                if ((bg !== 'camera' || faceOnly) && !spaceHeld) {
                    replaceBackground(W, H, mirror, bg === 'camera' ? 'black' : bg,
                                      num('bgEdge') / 100, faceOnly ? lastFaceLm : null);
                }

                try {
                    if (faceLm) {
                        const lm = faceLm;

                        // Read settings
                        const eSrc  = document.getElementById('eyeSource').value;
                        const eSwap = document.getElementById('eyeSwap').checked;
                        const eFX   = document.getElementById('eyeFlipX').checked;
                        const eFY   = document.getElementById('eyeFlipY').checked;
                        const mFX   = document.getElementById('mouthFlipX').checked;
                        const mFY   = document.getElementById('mouthFlipY').checked;
                        const nFX   = document.getElementById('noseFlipX').checked;
                        const dL    = +document.getElementById('delayL').value;
                        const dR    = +document.getElementById('delayR').value;
                        const dM    = +document.getElementById('delayM').value;

                        const ePad = 18;
                        const lb = bbox(lm, L_EYE, W, H, ePad);
                        const rb = bbox(lm, R_EYE, W, H, ePad);
                        const mb = bbox(lm, LIPS, W, H, 12);
                        const nb = bbox(lm, NOSE, W, H, 10);

                        // Horror mode 1 goes into the frame before capture,
                        // so the black eyes move with every crop.
                        if (hp.black && !spaceHeld) {
                            drawBlackEye(lm, L_EYE, W, H, hp);
                            drawBlackEye(lm, R_EYE, W, H, hp);
                        }

                        // Capture this frame's regions before pasting anything
                        const slot = ring[frameNo % RING];
                        copyRegion(slot.l.c, slot.l.ctx, canvas, lb);
                        copyRegion(slot.r.c, slot.r.ctx, canvas, rb);
                        copyRegion(slot.m.c, slot.m.ctx, canvas, mb);
                        copyRegion(slot.n.c, slot.n.ctx, canvas, nb);

                        // Paste delayed content at the current positions
                        // (0 = this frame; clamped while history is still filling up)
                        const past = d => ring[Math.max(0, frameNo - d) % RING];
                        const srcL = past(dL), srcR = past(dR), srcM = past(dM);

                        // Holding Space shows the original camera feed:
                        // keep capturing history, but skip all pasting.
                        if (!spaceHeld) {
                            // Nose first so the eyes and mouth draw on top of it.
                            // No lag slider; flip the current frame's crop.
                            if (nFX) {
                                pasteRegion(ctx, slot.n.c, nb, true, false);
                            }

                            // Pick which eye feeds each position: a single
                            // source eye for both, or (with swap) the opposite
                            const leftCrop  = eSrc === 'left'  ? srcL.l
                                            : eSrc === 'right' ? srcL.r
                                            : eSwap ? srcL.r : srcL.l;
                            const rightCrop = eSrc === 'left'  ? srcR.l
                                            : eSrc === 'right' ? srcR.r
                                            : eSwap ? srcR.l : srcR.r;
                            if (!hp.swap) {
                                pasteRegion(ctx, leftCrop.c, lb, eFX, eFY);
                                pasteRegion(ctx, rightCrop.c, rb, eFX, eFY);
                                pasteRegion(ctx, srcM.m.c, mb, mFX, mFY);
                            } else {
                                // Horror mode 2: the chosen eye(s) and the
                                // mouth trade places, each scaled and
                                // pasted with a feathered edge.
                                const useL = hp.swapEye !== 'right';
                                const useR = hp.swapEye !== 'left';
                                const vacated = [mb];
                                if (useL) vacated.push(lb);
                                if (useR) vacated.push(rb);
                                if (hp.smudge) {
                                    // Sample every tone first, then paint,
                                    // so one patch can't tint another.
                                    const tones = vacated.map(b => skinTone(b, W, H));
                                    vacated.forEach((b, k) => fillSkin(b, tones[k]));
                                }
                                if (!useL) pasteRegion(ctx, leftCrop.c, lb, eFX, eFY);
                                if (!useR) pasteRegion(ctx, rightCrop.c, rb, eFX, eFY);

                                const f = hp.feather;
                                const mw = mb.w * hp.mouthScale, mh = mb.h * hp.mouthScale;
                                for (const [use, b] of [[useL, lb], [useR, rb]]) {
                                    if (use) pasteFeather(ctx, srcM.m.c, b.cx, b.cy, mw, mh, mFX, mFY, f);
                                }

                                const eyes = [];
                                if (useL) eyes.push([leftCrop.c, lb]);
                                if (useR) eyes.push([rightCrop.c, rb]);
                                // Keep the eyes' left-to-right order at the mouth
                                eyes.sort((a, b) => a[1].cx - b[1].cx);
                                eyes.forEach(([crop, b], k) => {
                                    const w = b.w * hp.eyeScale, h = b.h * hp.eyeScale;
                                    const x = mb.cx + (k - (eyes.length - 1) / 2) * w * 0.85;
                                    pasteFeather(ctx, crop, x, mb.cy, w, h, eFX, eFY, f);
                                });
                            }

                            // Feature transplants use this frame's crops
                            if (hp.mouthEyes) drawMouthInEyes(lm, W, H, hp, slot.m.c, mb);
                            if (hp.teethEyes) {
                                drawTeethEye(lm, L_EYE, W, H, hp);
                                drawTeethEye(lm, R_EYE, W, H, hp);
                            }
                            if (hp.eyeMouth) {
                                const eL = { crop: slot.l.c, box: lb, idx: L_EYE };
                                const eR = { crop: slot.r.c, box: rb, idx: R_EYE };
                                drawEyeInMouth(lm, W, H, hp,
                                    hp.emEye === 'left' ? [eL] : hp.emEye === 'right' ? [eR] : [eL, eR]);
                            }

                            if (hp.goth) drawGoth(lm, W, H, hp);

                            // Black mouth goes on after pasting: a wide grin
                            // reaches past the mouth's paste ellipse, and
                            // its flipped copy would leave a seam.
                            if (hp.mouth) drawBlackMouth(lm, W, H, hp);
                            if (hp.fangs) drawFangs(lm, W, H, hp, performance.now());

                            if (hp.black && hp.tears > 0) {
                                const now = performance.now();
                                drawTear(lm, L_EYE, 145, 1.3, W, H, hp, now);
                                drawTear(lm, R_EYE, 374, 4.1, W, H, hp, now);
                            }
                        }

                        // Horror mode 3: the liquid keeps flowing while
                        // Space is held, it just isn't drawn.
                        const mesh = (hp.leak || hp.explode) && TRIS ? meshFrame(lm, W, H) : null;
                        if (hp.leak && mesh) {
                            stepLeak(mesh, W, H, hp, performance.now());
                            if (!spaceHeld) drawLeak(mesh, hp);
                        }
                        if (hp.explode) {
                            const now = performance.now();
                            stepBoom(lm, mesh, W, H, hp, now);
                            if (!spaceHeld) drawBoom(lm, mesh, W, H, hp, now);
                        }

                        frameNo++;

                        // ---- Overlay ----
                        if (document.getElementById('showOverlay').checked && !spaceHeld) {
                            drawOverlay(lm, W, H);
                        }
                    }
                } catch (err) {
                    // Face detection can fail when face is partially visible;
                    // ignore and keep showing the plain camera feed. Each
                    // distinct message is logged once, to help debugging.
                    if (!seenErrors.has(err.message)) {
                        seenErrors.add(err.message);
                        console.warn(err);
                    }
                }

                if (hp.on && !spaceHeld) drawAtmosphere(W, H, hp);

                // Zoom to fit: last, so it frames everything drawn above
                if (faceOnly && on('bgZoom') && !spaceHeld && lastFaceLm) {
                    zoomToFace(lastFaceLm, W, H, num('bgFit') / 100, num('bgSmooth') / 100, bg);
                }
            }
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

    } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        console.error(err);
    }

    // ---- Slider readouts ----

    for (const el of document.querySelectorAll('label.slider input')) {
        const val = document.getElementById(el.id + 'Val');
        el.addEventListener('input', () => { val.textContent = el.value; });
    }

    // ---- Horror panel: each ticked effect shows its own parameters ----

    for (const g of document.querySelectorAll('.group[data-fx]')) {
        const cb = document.getElementById(g.dataset.fx);
        const sync = () => { g.hidden = !cb.checked; };
        cb.addEventListener('change', sync);
        sync();
    }
    document.getElementById('fxBlack').addEventListener('change', () => {
        tearStart = performance.now();
    });
    document.getElementById('fxLeak').addEventListener('change', () => {
        resetLeak();
        leak.lastT = performance.now();
    });
    document.getElementById('lWipe').addEventListener('click', resetLeak);
    document.getElementById('hTears').addEventListener('input', e => {
        // Let fresh tears run down again rather than appear at full length
        if (+e.target.value === 0) tearStart = performance.now();
    });
    document.getElementById('xBoom').addEventListener('click', () => { boom.request = true; });

    const bgMode = document.getElementById('bgMode');
    function syncBg() {
        const faceOnly = document.getElementById('bgFace').checked;
        document.getElementById('bgGroup').hidden = bgMode.value === 'camera' && !faceOnly;
        document.getElementById('bgColor').parentElement.hidden = bgMode.value !== 'color';
    }
    bgMode.addEventListener('change', syncBg);
    document.getElementById('bgFace').addEventListener('change', () => { zoom.k = 0; syncBg(); });
    syncBg();

    // ---- Keyboard ----

    document.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); spaceHeld = true; }
        if (e.code === 'KeyE' && !e.repeat) {
            document.getElementById('fxExplode').checked = true;
            document.getElementById('fxExplode').dispatchEvent(new Event('change'));
            boom.request = true;
        }
    });
    document.addEventListener('keyup', e => {
        if (e.code === 'Space') spaceHeld = false;
    });
    </script>
</body>
</html>
