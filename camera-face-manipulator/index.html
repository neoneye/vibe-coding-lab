<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Face Manipulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #ddd;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }
        #status {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #fa0;
            font-size: 0.9rem;
        }
        .stage {
            --ar: 4 / 3;
            position: relative;
            aspect-ratio: var(--ar);
            /* As wide as fits, limited by either viewport axis;
               aspect-ratio derives the height, so it never distorts. */
            width: min(calc(100vw - 36px), calc((100vh - 36px) * var(--ar)));
        }
        canvas {
            display: block;
            border: 2px solid #333;
            border-radius: 8px;
            width: 100%;
            height: 100%;
        }
        .panel {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            min-width: 180px;
            max-height: calc(100% - 24px);
            overflow-y: auto;
        }
        .panel.left {
            right: auto;
            left: 12px;
            width: 260px;
        }
        .panel h3.horror { color: #e33; }
        .panel h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 10px 0 2px;
        }
        .panel [hidden] { display: none !important; }
        .panel label.fx { font-weight: 600; }
        .panel .group {
            margin: 0 0 6px 8px;
            padding-left: 8px;
            border-left: 2px solid #422;
        }
        .panel .note {
            color: #fa0;
            font-size: 0.8rem;
            max-width: 200px;
        }
        .panel .note:empty { display: none; }
        .panel input[type="color"] {
            width: 36px;
            height: 20px;
            border: 1px solid #555;
            background: none;
            padding: 0;
        }
        .panel button kbd { font-size: 0.7rem; }
        .panel button {
            margin-top: 6px;
            background: #2a1414;
            color: #eaa;
            border: 1px solid #633;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .panel button:hover { background: #3a1a1a; }
        .panel h3 {
            font-size: 0.95rem;
            margin: 14px 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333;
        }
        .panel h3:first-child { margin-top: 0; }
        .panel h3.eyes { color: #8f8; }
        .panel h3.nose { color: #8af; }
        .panel h3.mouth { color: #f88; }
        .panel h3.lag { color: #fa0; }
        .panel label.slider input[type="range"] {
            flex: 1;
            min-width: 80px;
        }
        .panel label.slider .val {
            min-width: 3ch;
            text-align: right;
            color: #fa0;
            font-variant-numeric: tabular-nums;
        }
        .panel select {
            background: #222;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.85rem;
        }
        .panel label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .hint {
            color: #666;
            font-size: 0.8rem;
            margin-top: 14px;
            border-top: 1px solid #333;
            padding-top: 10px;
            line-height: 1.4;
        }
        kbd {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div id="status">Loading face detection model...</div>
    <div class="stage">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div class="panel">
            <h3>View</h3>
            <label><input type="checkbox" id="mirrorView" checked> Mirror (flip X)</label>
            <h3>Overlay</h3>
            <label><input type="checkbox" id="showOverlay"> Show L / R / nose / mouth</label>
            <h3 class="eyes">Eyes</h3>
            <label>Source
                <select id="eyeSource">
                    <option value="both" selected>Both</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                </select>
            </label>
            <label><input type="checkbox" id="eyeSwap" checked> Swap Left / Right</label>
            <label><input type="checkbox" id="eyeFlipX" checked> Flip X (mirror)</label>
            <label><input type="checkbox" id="eyeFlipY"> Flip Y</label>
            <h3 class="nose">Nose</h3>
            <label><input type="checkbox" id="noseFlipX"> Flip X (mirror)</label>
            <h3 class="mouth">Mouth</h3>
            <label><input type="checkbox" id="mouthFlipX" checked> Flip X (mirror)</label>
            <label><input type="checkbox" id="mouthFlipY"> Flip Y</label>
            <h3 class="lag">Lag (frames)</h3>
            <label class="slider">L eye <input type="range" id="delayL" min="0" max="30" value="0"><span class="val" id="delayLVal">0</span></label>
            <label class="slider">R eye <input type="range" id="delayR" min="0" max="30" value="0"><span class="val" id="delayRVal">0</span></label>
            <label class="slider">Mouth <input type="range" id="delayM" min="0" max="30" value="0"><span class="val" id="delayMVal">0</span></label>
            <div class="hint">
                Hold <kbd>Space</kbd> to see original<br>
                <kbd>E</kbd> explodes the eyes
            </div>
        </div>
        <div class="panel left">
            <h3 class="horror">Horror</h3>
            <label class="fx"><input type="checkbox" id="fxBlack"> Black eyes</label>
            <div class="group" data-fx="fxBlack" hidden>
                <label class="slider">Darkness <input type="range" id="hDark" min="0" max="100" value="100"><span class="val" id="hDarkVal">100</span></label>
                <label class="slider">Size <input type="range" id="hSize" min="70" max="170" value="110"><span class="val" id="hSizeVal">110</span></label>
                <label class="slider">Soft edge <input type="range" id="hSoft" min="0" max="100" value="15"><span class="val" id="hSoftVal">15</span></label>
                <label class="slider">Glint <input type="range" id="hGlint" min="0" max="100" value="60"><span class="val" id="hGlintVal">60</span></label>
                <label class="slider">Sockets <input type="range" id="hSocket" min="0" max="100" value="40"><span class="val" id="hSocketVal">40</span></label>
                <label class="slider">Tears <input type="range" id="hTears" min="0" max="100" value="0"><span class="val" id="hTearsVal">0</span></label>
            </div>
            <label class="fx"><input type="checkbox" id="fxLeak"> Leaking eyes</label>
            <div class="group" data-fx="fxLeak" hidden>
                <label class="slider">Flow <input type="range" id="lFlow" min="0" max="100" value="50"><span class="val" id="lFlowVal">50</span></label>
                <label class="slider">Runniness <input type="range" id="lSpeed" min="10" max="300" value="100"><span class="val" id="lSpeedVal">100</span></label>
                <label class="slider">Thickness <input type="range" id="lThick" min="40" max="250" value="100"><span class="val" id="lThickVal">100</span></label>
                <label class="slider">Gloss <input type="range" id="lGloss" min="0" max="100" value="60"><span class="val" id="lGlossVal">60</span></label>
                <label class="slider">Dries (s) <input type="range" id="lDry" min="5" max="120" value="45"><span class="val" id="lDryVal">45</span></label>
                <label><input type="checkbox" id="lDrip" checked> Drip off the jaw</label>
                <button type="button" id="lWipe">Wipe face</button>
            </div>
            <label class="fx"><input type="checkbox" id="fxExplode"> Exploding eyes</label>
            <div class="group" data-fx="fxExplode" hidden>
                <label>Eye
                    <select id="xEye">
                        <option value="both" selected>Both</option>
                        <option value="left">L</option>
                        <option value="right">R</option>
                    </select>
                </label>
                <label>Splatter
                    <select id="xColor">
                        <option value="blood" selected>Blood</option>
                        <option value="ink">Black ink</option>
                    </select>
                </label>
                <label class="slider">Power <input type="range" id="xPower" min="20" max="200" value="100"><span class="val" id="xPowerVal">100</span></label>
                <label class="slider">Gore <input type="range" id="xGore" min="0" max="100" value="60"><span class="val" id="xGoreVal">60</span></label>
                <label class="slider">Regrow (s) <input type="range" id="xRegrow" min="1" max="30" value="6"><span class="val" id="xRegrowVal">6</span></label>
                <label class="slider">Auto (s) <input type="range" id="xAuto" min="0" max="20" value="0"><span class="val" id="xAutoVal">0</span></label>
                <button type="button" id="xBoom">Explode! <kbd>E</kbd></button>
            </div>
            <label class="fx"><input type="checkbox" id="fxMouthEyes"> Mouth in both eyes</label>
            <div class="group" data-fx="fxMouthEyes" hidden>
                <label class="slider">Eye size <input type="range" id="meSize" min="80" max="220" value="140"><span class="val" id="meSizeVal">140</span></label>
                <label class="slider">Zoom <input type="range" id="meZoom" min="50" max="200" value="100"><span class="val" id="meZoomVal">100</span></label>
            </div>
            <label class="fx"><input type="checkbox" id="fxTeethEyes"> Teeth in both eyes</label>
            <div class="group" data-fx="fxTeethEyes" hidden>
                <label class="slider">Eye size <input type="range" id="teSize" min="80" max="250" value="150"><span class="val" id="teSizeVal">150</span></label>
                <label class="slider">Teeth <input type="range" id="teCount" min="3" max="14" value="7"><span class="val" id="teCountVal">7</span></label>
                <label class="slider">Length <input type="range" id="teLen" min="20" max="150" value="70"><span class="val" id="teLenVal">70</span></label>
                <label class="slider">Sharpness <input type="range" id="teSharp" min="0" max="100" value="70"><span class="val" id="teSharpVal">70</span></label>
                <label class="slider">Yellowing <input type="range" id="teYellow" min="0" max="100" value="35"><span class="val" id="teYellowVal">35</span></label>
            </div>
            <label class="fx"><input type="checkbox" id="fxEyeMouth"> Eye inside the mouth</label>
            <div class="group" data-fx="fxEyeMouth" hidden>
                <label>Eye
                    <select id="emEye">
                        <option value="left" selected>L</option>
                        <option value="right">R</option>
                        <option value="both">Both</option>
                    </select>
                </label>
                <label class="slider">Mouth size <input type="range" id="emSize" min="80" max="200" value="120"><span class="val" id="emSizeVal">120</span></label>
                <label class="slider">Zoom <input type="range" id="emZoom" min="50" max="250" value="110"><span class="val" id="emZoomVal">110</span></label>
            </div>
            <label class="fx"><input type="checkbox" id="fxMouth"> Black mouth</label>
            <div class="group" data-fx="fxMouth" hidden>
                <label class="slider">Opening <input type="range" id="mDark" min="0" max="100" value="100"><span class="val" id="mDarkVal">100</span></label>
                <label class="slider">Lips <input type="range" id="mLips" min="0" max="100" value="100"><span class="val" id="mLipsVal">100</span></label>
                <label class="slider">Grin width <input type="range" id="mGrin" min="100" max="220" value="100"><span class="val" id="mGrinVal">100</span></label>
                <label class="slider">Corner curl <input type="range" id="mCurl" min="-100" max="100" value="0"><span class="val" id="mCurlVal">0</span></label>
                <label class="slider">Soft edge <input type="range" id="mSoft" min="0" max="100" value="20"><span class="val" id="mSoftVal">20</span></label>
                <label class="slider">Gloss <input type="range" id="mGloss" min="0" max="100" value="40"><span class="val" id="mGlossVal">40</span></label>
            </div>
            <label class="fx"><input type="checkbox" id="fxFangs"> Dracula teeth</label>
            <div class="group" data-fx="fxFangs" hidden>
                <label class="slider">Length <input type="range" id="fLen" min="20" max="200" value="100"><span class="val" id="fLenVal">100</span></label>
                <label class="slider">Width <input type="range" id="fWidth" min="50" max="200" value="100"><span class="val" id="fWidthVal">100</span></label>
                <label class="slider">Spread <input type="range" id="fSpread" min="10" max="90" value="50"><span class="val" id="fSpreadVal">50</span></label>
                <label class="slider">Blood <input type="range" id="fBlood" min="0" max="100" value="40"><span class="val" id="fBloodVal">40</span></label>
            </div>
            <label class="fx"><input type="checkbox" id="fxSwap"> Swap eye / mouth</label>
            <div class="group" data-fx="fxSwap" hidden>
                <label>Eye
                    <select id="hSwapEye">
                        <option value="left" selected>L</option>
                        <option value="right">R</option>
                        <option value="both">Both</option>
                    </select>
                </label>
                <label class="slider">Eye size <input type="range" id="hEyeScale" min="50" max="300" value="160"><span class="val" id="hEyeScaleVal">160</span></label>
                <label class="slider">Mouth size <input type="range" id="hMouthScale" min="30" max="150" value="90"><span class="val" id="hMouthScaleVal">90</span></label>
                <label class="slider">Feather <input type="range" id="hFeather" min="0" max="100" value="40"><span class="val" id="hFeatherVal">40</span></label>
                <label><input type="checkbox" id="hSmudge" checked> Skin over originals</label>
            </div>
            <label class="fx"><input type="checkbox" id="fxGoth"> Goth simulator</label>
            <div class="group" data-fx="fxGoth" hidden>
                <label class="slider">Pale skin <input type="range" id="gPale" min="0" max="100" value="60"><span class="val" id="gPaleVal">60</span></label>
                <label class="slider">Eyeshadow <input type="range" id="gShadow" min="0" max="100" value="70"><span class="val" id="gShadowVal">70</span></label>
                <label class="slider">Eyeliner <input type="range" id="gLiner" min="0" max="100" value="60"><span class="val" id="gLinerVal">60</span></label>
                <label class="slider">Wings <input type="range" id="gWing" min="0" max="100" value="60"><span class="val" id="gWingVal">60</span></label>
                <label class="slider">Brows <input type="range" id="gBrow" min="0" max="100" value="50"><span class="val" id="gBrowVal">50</span></label>
                <label class="slider">Lipstick <input type="range" id="gLip" min="0" max="100" value="85"><span class="val" id="gLipVal">85</span></label>
                <label>Lip colour
                    <select id="gLipColor">
                        <option value="black" selected>Black</option>
                        <option value="plum">Plum</option>
                        <option value="blood">Blood red</option>
                    </select>
                </label>
            </div>
            <label class="fx"><input type="checkbox" id="fxAtmo"> Atmosphere</label>
            <div class="group" data-fx="fxAtmo" hidden>
                <label class="slider">Desaturate <input type="range" id="hDesat" min="0" max="100" value="50"><span class="val" id="hDesatVal">50</span></label>
                <label class="slider">Sickly tint <input type="range" id="hTint" min="0" max="100" value="30"><span class="val" id="hTintVal">30</span></label>
                <label class="slider">Vignette <input type="range" id="hVig" min="0" max="100" value="60"><span class="val" id="hVigVal">60</span></label>
                <label class="slider">Flicker <input type="range" id="hFlick" min="0" max="100" value="0"><span class="val" id="hFlickVal">0</span></label>
            </div>
            <h3>Background</h3>
            <label>Replace
                <select id="bgMode">
                    <option value="camera" selected>Off (camera)</option>
                    <option value="black">Black</option>
                    <option value="color">Colour</option>
                    <option value="blur">Blur</option>
                    <option value="fog">Dark fog</option>
                </select>
            </label>
            <div class="group" id="bgGroup" hidden>
                <label>Colour <input type="color" id="bgColor" value="#00b140"></label>
                <label class="slider">Edge <input type="range" id="bgEdge" min="0" max="100" value="40"><span class="val" id="bgEdgeVal">40</span></label>
                <div class="note" id="bgNote"></div>
            </div>
            <label class="fx"><input type="checkbox" id="bgFace"> Face + neck only</label>
            <div class="group" data-fx="bgFace" hidden>
                <label class="slider">Neck <input type="range" id="bgNeck" min="0" max="150" value="60"><span class="val" id="bgNeckVal">60</span></label>
                <label><input type="checkbox" id="bgZoom" checked> Zoom to fit</label>
                <label class="slider">Fit size <input type="range" id="bgFit" min="30" max="100" value="85"><span class="val" id="bgFitVal">85</span></label>
                <label class="slider">Smoothing <input type="range" id="bgSmooth" min="0" max="98" value="85"><span class="val" id="bgSmoothVal">85</span></label>
            </div>
        </div>
    </div>
    <video id="video" autoplay playsinline hidden></video>

    <script type="module">
    // MediaPipe face landmark indices
    const L_EYE = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
    const R_EYE = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
    const LIPS  = [61,146,91,181,84,17,314,405,321,375,291,308,324,318,402,317,
                   14,87,178,88,95,78,191,80,81,82,13,312,311,310,415];
    const NOSE  = [1,2,98,327,168];

    const video    = document.getElementById('video');
    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let spaceHeld = false;

    // Ring buffer of per-region crops from the last frames, so each
    // region can be pasted with its own delay (max 30 frames + current).
    const RING = 31;
    const ring = Array.from({ length: RING }, () => {
        const mk = () => {
            const c = document.createElement('canvas');
            return { c, ctx: c.getContext('2d') };
        };
        return { l: mk(), r: mk(), m: mk(), n: mk() };
    });
    let frameNo = 0;

    // ---- Helpers ----

    function bbox(lm, idx, W, H, pad) {
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const i of idx) {
            const px = lm[i].x * W, py = lm[i].y * H;
            if (px < x1) x1 = px;
            if (py < y1) y1 = py;
            if (px > x2) x2 = px;
            if (py > y2) y2 = py;
        }
        const x = Math.max(0, Math.floor(x1 - pad));
        const y = Math.max(0, Math.floor(y1 - pad));
        const w = Math.min(W - x, Math.ceil(x2 - x1 + pad * 2));
        const h = Math.min(H - y, Math.ceil(y2 - y1 + pad * 2));
        return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
    }

    function copyRegion(tc, tctx, src, b) {
        tc.width  = b.w;
        tc.height = b.h;
        tctx.drawImage(src, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
    }

    function pasteRegion(dctx, src, b, fx, fy) {
        dctx.save();
        dctx.beginPath();
        dctx.ellipse(b.cx, b.cy, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
        dctx.clip();
        dctx.translate(b.cx, b.cy);
        dctx.scale(fx ? -1 : 1, fy ? -1 : 1);
        dctx.drawImage(src, -b.w / 2, -b.h / 2, b.w, b.h);
        dctx.restore();
    }

    function drawOverlay(lm, W, H) {
        ctx.lineWidth = 2;

        // Eyes
        ctx.strokeStyle = 'rgba(0,255,120,0.5)';
        for (const idx of [L_EYE, R_EYE]) {
            const b = bbox(lm, idx, W, H, 8);
            ctx.beginPath();
            ctx.ellipse(b.cx, b.cy, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Nose
        ctx.strokeStyle = 'rgba(100,180,255,0.4)';
        const nb = bbox(lm, NOSE, W, H, 5);
        ctx.beginPath();
        ctx.ellipse(nb.cx, nb.cy, nb.w / 2, nb.h / 2, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Mouth
        ctx.strokeStyle = 'rgba(255,100,100,0.5)';
        const mb = bbox(lm, LIPS, W, H, 5);
        ctx.beginPath();
        ctx.ellipse(mb.cx, mb.cy, mb.w / 2, mb.h / 2, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Labels
        ctx.font = '11px system-ui';
        ctx.fillStyle = 'rgba(0,255,120,0.6)';
        const lb = bbox(lm, L_EYE, W, H, 8);
        const rb = bbox(lm, R_EYE, W, H, 8);
        ctx.fillText('L', lb.cx - 4, lb.y - 4);
        ctx.fillText('R', rb.cx - 4, rb.y - 4);
        ctx.fillStyle = 'rgba(100,180,255,0.5)';
        ctx.fillText('nose', nb.cx - 12, nb.y - 4);
        ctx.fillStyle = 'rgba(255,100,100,0.6)';
        ctx.fillText('mouth', mb.cx - 14, mb.y - 4);
    }

    // ---- Horror ----

    const num = id => +document.getElementById(id).value;

    const on  = id => document.getElementById(id).checked;
    const sel = id => document.getElementById(id).value;

    function readHorror() {
        return {
            on:     on('fxAtmo'),
            black:  on('fxBlack'),
            swap:   on('fxSwap'),
            leak:   on('fxLeak'),
            mouth:  on('fxMouth'),
            explode:    on('fxExplode'),
            mouthEyes:  on('fxMouthEyes'),
            teethEyes:  on('fxTeethEyes'),
            eyeMouth:   on('fxEyeMouth'),
            fangs:      on('fxFangs'),
            goth:       on('fxGoth'),
            xEye:   sel('xEye'),
            xInk:   sel('xColor') === 'ink',
            xPower: num('xPower') / 100,
            xGore:  num('xGore') / 100,
            xRegrow: num('xRegrow'),
            xAuto:  num('xAuto'),
            meSize: num('meSize') / 100,
            meZoom: num('meZoom') / 100,
            teSize: num('teSize') / 100,
            teCount: num('teCount'),
            teLen:  num('teLen') / 100,
            teSharp: num('teSharp') / 100,
            teYellow: num('teYellow') / 100,
            emEye:  sel('emEye'),
            emSize: num('emSize') / 100,
            emZoom: num('emZoom') / 100,
            fLen:   num('fLen') / 100,
            fWidth: num('fWidth') / 100,
            fSpread: num('fSpread') / 100,
            fBlood: num('fBlood') / 100,
            gPale:  num('gPale') / 100,
            gShadow: num('gShadow') / 100,
            gLiner: num('gLiner') / 100,
            gWing:  num('gWing') / 100,
            gBrow:  num('gBrow') / 100,
            gLip:   num('gLip') / 100,
            gLipColor: sel('gLipColor'),
            mDark:  num('mDark') / 100,
            mLips:  num('mLips') / 100,
            mGrin:  num('mGrin') / 100,
            mCurl:  num('mCurl') / 100,
            mSoft:  num('mSoft') / 100,
            mGloss: num('mGloss') / 100,
            flow:   num('lFlow') / 100,
            runny:  num('lSpeed') / 100,
            thick:  num('lThick') / 100,
            gloss:  num('lGloss') / 100,
            dry:    num('lDry'),
            drip:   document.getElementById('lDrip').checked,
            dark:   num('hDark') / 100,
            size:   num('hSize') / 100,
            soft:   num('hSoft') / 100,
            glint:  num('hGlint') / 100,
            socket: num('hSocket') / 100,
            tears:  num('hTears') / 100,
            swapEye:    document.getElementById('hSwapEye').value,
            eyeScale:   num('hEyeScale') / 100,
            mouthScale: num('hMouthScale') / 100,
            feather:    num('hFeather') / 100,
            smudge:     document.getElementById('hSmudge').checked,
            desat:  num('hDesat') / 100,
            tint:   num('hTint') / 100,
            vig:    num('hVig') / 100,
            flick:  num('hFlick') / 100,
        };
    }

    // Outline of the eye opening (the L_EYE / R_EYE lists walk the lid
    // contour in order), its centroid and its extent in canvas pixels.
    function eyeShape(lm, idx, W, H) {
        const pts = idx.map(i => [lm[i].x * W, lm[i].y * H]);
        let cx = 0, cy = 0;
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const [x, y] of pts) {
            cx += x; cy += y;
            x1 = Math.min(x1, x); x2 = Math.max(x2, x);
            y1 = Math.min(y1, y); y2 = Math.max(y2, y);
        }
        cx /= pts.length; cy /= pts.length;
        return { pts, cx, cy, ew: x2 - x1, eh: y2 - y1 };
    }

    function tracePoly(c, pts, dx = 0) {
        c.beginPath();
        pts.forEach(([x, y], k) => k ? c.lineTo(x + dx, y) : c.moveTo(x + dx, y));
        c.closePath();
    }

    // Iris centre (landmarks 468 / 473 in the 478-point model), falling
    // back to the lid centroid if the iris points are missing.
    function irisCentre(lm, e, W, H) {
        if (lm.length < 478) return [e.cx, e.cy];
        let best = null, bestD = Infinity;
        for (const i of [468, 473]) {
            const x = lm[i].x * W, y = lm[i].y * H;
            const d = (x - e.cx) ** 2 + (y - e.cy) ** 2;
            if (d < bestD) { bestD = d; best = [x, y]; }
        }
        return best;
    }

    // Mode 1, drawn before the regions are captured so that the black
    // eyes travel with the crops (lag, swap, flips, eye ↔ mouth).
    function drawBlackEye(lm, idx, W, H, p) {
        const e = eyeShape(lm, idx, W, H);
        const ew = Math.max(e.ew, 1);

        // Sunken sockets: a soft bruise-dark halo around the eye
        if (p.socket > 0) {
            ctx.save();
            ctx.translate(e.cx, e.cy + ew * 0.05);
            ctx.scale(ew * 0.95, ew * 0.7);
            const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
            g.addColorStop(0,   `rgba(30,8,18,${0.8 * p.socket})`);
            g.addColorStop(0.5, `rgba(30,8,18,${0.45 * p.socket})`);
            g.addColorStop(1,   'rgba(30,8,18,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // The eye opening, scaled about its centroid, filled black. The
        // soft edge is a shadow cast from a copy drawn off-canvas, since
        // shadowBlur works in every browser (ctx.filter does not).
        const poly = e.pts.map(([x, y]) =>
            [e.cx + (x - e.cx) * p.size, e.cy + (y - e.cy) * p.size]);
        if (p.dark > 0) {
            const off = W * 4;
            ctx.save();
            ctx.shadowColor = `rgba(0,0,0,${p.dark})`;
            ctx.shadowBlur = p.soft * ew * 0.25;
            ctx.shadowOffsetX = off;
            ctx.fillStyle = '#000';
            tracePoly(ctx, poly, -off);
            ctx.fill();
            ctx.restore();
        }

        // Wet glint: two highlights that follow the gaze, clipped to the
        // opening so they vanish when the eye closes.
        if (p.glint > 0) {
            const [ix, iy] = irisCentre(lm, e, W, H);
            ctx.save();
            tracePoly(ctx, poly);
            ctx.clip();
            const spot = (x, y, r, a) => {
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0,   `rgba(255,255,255,${a})`);
                g.addColorStop(0.4, `rgba(255,255,255,${a * 0.6})`);
                g.addColorStop(1,   'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            };
            spot(ix - ew * 0.09, iy - ew * 0.08, ew * 0.09, 0.9 * p.glint);
            spot(ix + ew * 0.07, iy + ew * 0.04, ew * 0.04, 0.5 * p.glint);
            ctx.restore();
        }
    }

    // Mode 4: black mouth. The outer and inner lip contours, in order.
    const LIP_OUTER = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375,
                       291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
    const LIP_INNER = [78, 95, 88, 178, 87, 14, 317, 402, 318, 324,
                       308, 415, 310, 311, 312, 13, 82, 81, 80, 191];

    // Fill a polygon black with a soft edge (shadow cast from off-canvas,
    // as for the eyes).
    function softFill(poly, alpha, blur, W) {
        if (alpha <= 0) return;
        const off = W * 4;
        ctx.save();
        ctx.shadowColor = `rgba(0,0,0,${alpha})`;
        ctx.shadowBlur = blur;
        ctx.shadowOffsetX = off;
        ctx.fillStyle = '#000';
        tracePoly(ctx, poly, -off);
        ctx.fill();
        ctx.restore();
    }

    // Drawn after the regions are pasted, at the live mouth position.
    function drawBlackMouth(lm, W, H, p) {
        const P = i => [lm[i].x * W, lm[i].y * H];
        const a = P(61), b = P(291);   // mouth corners
        const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
        const half = Math.max(1, Math.hypot(b[0] - a[0], b[1] - a[1]) / 2);
        const ux = (b[0] - a[0]) / (2 * half), uy = (b[1] - a[1]) / (2 * half);
        let vx = -uy, vy = ux;
        const chin = P(152);
        if ((chin[0] - cx) * vx + (chin[1] - cy) * vy < 0) { vx = -vx; vy = -vy; }

        // In the mouth's own frame (u along the corners, v towards the
        // chin): stretch u by Grin width, lift the corners by Corner curl.
        const warp = ([x, y]) => {
            const dx = x - cx, dy = y - cy;
            let u = dx * ux + dy * uy, v = dx * vx + dy * vy;
            const t = u / half;
            u *= p.mGrin;
            v -= p.mCurl * half * 0.4 * t * t * p.mGrin;
            return [cx + u * ux + v * vx, cy + u * uy + v * vy];
        };
        const outer = LIP_OUTER.map(i => warp(P(i)));
        const inner = LIP_INNER.map(i => warp(P(i)));
        const blur = p.mSoft * half * 0.25;

        softFill(outer, p.mLips, blur, W);
        softFill(inner, p.mDark, blur * 0.6, W);

        // Wet sheen on the blackened lips
        if (p.mGloss > 0 && p.mLips > 0.3) {
            ctx.save();
            tracePoly(ctx, outer);
            ctx.clip();
            const streak = (pt, rx, ry, alpha) => {
                ctx.save();
                ctx.translate(pt[0], pt[1]);
                ctx.transform(ux, uy, vx, vy, 0, 0);
                ctx.scale(rx, ry);
                const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
                g.addColorStop(0, `rgba(255,255,255,${alpha})`);
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(-1, -1, 2, 2);
                ctx.restore();
            };
            const mid = (i, j, f) => {
                const A = P(i), B = P(j);
                return warp([A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f]);
            };
            const al = p.mGloss * p.mLips;
            streak(mid(14, 17, 0.4), half * 0.45 * p.mGrin, half * 0.06, 0.55 * al);
            streak(mid(13, 0, 0.55), half * 0.25 * p.mGrin, half * 0.04, 0.35 * al);
            ctx.restore();
        }
    }

    // Black tears running from the lower lid down the face. They are
    // drawn after pasting, at the eye positions, and grow in over a few
    // seconds whenever horror mode is switched on.
    let tearStart = performance.now();

    function drawTear(lm, idx, lidIdx, seed, W, H, p, now) {
        const e = eyeShape(lm, idx, W, H);
        const ew = Math.max(e.ew, 1);
        const top = lm[10], chin = lm[152];
        let dx = (chin.x - top.x) * W, dy = (chin.y - top.y) * H;
        const faceH = Math.hypot(dx, dy) || 1;
        dx /= faceH; dy /= faceH;
        const nx = -dy, ny = dx;

        const grow = Math.min(1, (now - tearStart) / 4000);
        const len = p.tears * faceH * 0.55 * grow;
        if (len < 1) return;

        const x0 = lm[lidIdx].x * W, y0 = lm[lidIdx].y * H;
        const amp = ew * 0.06;
        const N = 24, left = [], right = [];
        let ex = x0, ey = y0;
        for (let k = 0; k <= N; k++) {
            const s = k / N;
            const along = s * len;
            const lat = (Math.sin(s * 6 + seed) * amp
                       + Math.sin(s * 17 + seed * 3) * amp * 0.3) * s;
            const w = ew * (0.08 * (1 - s) + 0.03) / 2;
            const x = x0 + dx * along + nx * lat;
            const y = y0 + dy * along + ny * lat;
            left.push([x + nx * w, y + ny * w]);
            right.push([x - nx * w, y - ny * w]);
            ex = x; ey = y;
        }
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.92)';
        tracePoly(ctx, left.concat(right.reverse()));
        ctx.fill();
        // Swelling drop at the end of the trail
        const r = ew * 0.05 * (1 + 0.2 * Math.sin(now / 400 + seed));
        ctx.beginPath();
        ctx.ellipse(ex + dx * r * 0.6, ey + dy * r * 0.6, r, r * 1.35,
                    Math.atan2(dy, dx) - Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ---- Mode 3: black liquid leaking from the eyes ----
    //
    // The liquid lives on the face mesh: every trail point is stored as a
    // triangle of MediaPipe's tessellation plus barycentric weights, so it
    // sticks to the skin and follows head turns, blinks and an open mouth.
    // Each stream has a head (a bead of volume V) that is fed from the eye
    // for a while, runs straight down the image (gravity) when V is above
    // its pinning threshold, and lays down a trail that costs volume. A
    // head that runs off the face outline hangs at the jaw and sheds
    // falling drops; a head that crosses a hole (eye, open mouth) floats
    // over it in screen space until it lands on skin again.

    let TRIS = null;   // landmark triplets of the face mesh
    let OVAL = null;   // face outline landmarks, in order
    const LIDS = [
        [33, 7, 163, 144, 145, 153, 154, 155, 133],    // lower lid of L_EYE
        [362, 382, 381, 380, 374, 373, 390, 249, 263], // lower lid of R_EYE
    ];
    const leak = { streams: [], drops: [], spawn: [0, 0], lastT: 0 };

    function resetLeak() {
        leak.streams.length = 0;
        leak.drops.length = 0;
        leak.spawn = [0, 0];
    }

    // This frame's mesh in canvas pixels. `front` is the winding sign of
    // camera-facing triangles (it flips with the mirror view); the scale
    // s is the distance between the eye centres.
    function meshFrame(lm, W, H) {
        const P = lm.map(p => [p.x * W, p.y * H, p.z * W]);
        const n = TRIS.length / 3;
        const area = new Float32Array(n);
        const slope = new Float32Array(n * 2);
        let sum = 0;
        for (let t = 0; t < n; t++) {
            const a = P[TRIS[t * 3]], b = P[TRIS[t * 3 + 1]], c = P[TRIS[t * 3 + 2]];
            const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
            const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
            area[t] = ux * vy - uy * vx;
            sum += area[t];
            // Surface normal, turned towards the camera (MediaPipe z is
            // smaller nearer the camera). Gravity (0,1,0) projected onto
            // the skin's tangent plane, seen in the image, is
            // (−nx·ny, 1 − ny²): flow bends around the nose and cheeks.
            let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
            const nl = Math.hypot(nx, ny, nz) || 1;
            if (nz > 0) { nx = -nx; ny = -ny; }
            nx /= nl; ny /= nl;
            slope[t * 2] = -nx * ny;
            slope[t * 2 + 1] = 1 - ny * ny;
        }
        const el = eyeShape(lm, L_EYE, W, H), er = eyeShape(lm, R_EYE, W, H);
        const s = Math.max(10, Math.hypot(er.cx - el.cx, er.cy - el.cy));
        return { P, area, slope, front: Math.sign(sum) || 1, s, oval: OVAL.map(i => P[i]) };
    }

    function facing(m, t) { return m.area[t] * m.front > 0; }

    function bary(m, t, x, y) {
        const a = m.P[TRIS[t * 3]], b = m.P[TRIS[t * 3 + 1]], c = m.P[TRIS[t * 3 + 2]];
        const d = m.area[t];
        const w0 = ((b[0] - x) * (c[1] - y) - (b[1] - y) * (c[0] - x)) / d;
        const w1 = ((c[0] - x) * (a[1] - y) - (c[1] - y) * (a[0] - x)) / d;
        const w2 = 1 - w0 - w1;
        const e = -1e-4;
        return (w0 >= e && w1 >= e && w2 >= e) ? { t, w0, w1, w2 } : null;
    }

    // Find the camera-facing triangle under (x, y); try the hint first.
    function locate(m, x, y, hint) {
        if (hint != null && facing(m, hint)) {
            const r = bary(m, hint, x, y);
            if (r) return r;
        }
        const n = m.area.length;
        for (let t = 0; t < n; t++) {
            if (!facing(m, t)) continue;
            const r = bary(m, t, x, y);
            if (r) return r;
        }
        return null;
    }

    function place(m, a) {
        const P = m.P, i = a.t * 3;
        const A = P[TRIS[i]], B = P[TRIS[i + 1]], C = P[TRIS[i + 2]];
        return [a.w0 * A[0] + a.w1 * B[0] + a.w2 * C[0],
                a.w0 * A[1] + a.w1 * B[1] + a.w2 * C[1]];
    }

    function insidePoly(poly, x, y) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const [xi, yi] = poly[i], [xj, yj] = poly[j];
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
        }
        return inside;
    }

    // Widths are stored relative to the face scale s, before Thickness.
    const trailW = V => 0.022 + 0.038 * Math.sqrt(Math.max(V, 0));
    const headR  = V => 0.024 + 0.032 * Math.sqrt(Math.max(V, 0));

    function headPos(m, h) {
        return h.anchor ? place(m, h.anchor) : [h.fx, h.fy];
    }

    function stepLeak(m, W, H, p, now) {
        const dt = Math.min(0.05, Math.max(0, (now - leak.lastT) / 1000));
        leak.lastT = now;
        const s = m.s;

        // New streams appear along the lower lids
        const active = leak.streams.filter(st => st.supply > 0).length;
        for (let eye = 0; eye < 2; eye++) {
            leak.spawn[eye] += dt * (0.08 + 0.5 * p.flow) * (p.flow > 0 ? 1 : 0);
            if (leak.spawn[eye] < 1) continue;
            leak.spawn[eye] -= 1 + Math.random() * 0.5;
            if (active >= 3 + 8 * p.flow) continue;
            const lid = LIDS[eye];
            const k = lid[Math.floor(Math.random() * lid.length)];
            const x = m.P[k][0], y = m.P[k][1] + s * 0.03;
            const anchor = locate(m, x, y, null);
            if (!anchor) continue;
            leak.streams.push({
                eye,
                pts: [{ ...anchor, w: trailW(0.4) }],
                head: { anchor, fx: x, fy: y, V: 0.4, pin: 0.3, wob: 0, hanging: false, alive: true, dir: [0, 1] },
                supply: 2 + Math.random() * 7,
                Q: 0.15 + 0.45 * p.flow,
                seed: Math.random() * 100,
                lastGrow: now,
                alpha: 1,
            });
        }
        while (leak.streams.length > 80) leak.streams.shift();

        // Wet tracks on screen: new drips are drawn into them
        const wet = [];
        for (const st of leak.streams) {
            for (let i = 0; i < st.pts.length; i += 2) {
                const [x, y] = place(m, st.pts[i]);
                wet.push(x, y, st);
            }
        }
        const R = s * 0.09;

        for (const st of leak.streams) {
            const h = st.head;
            if (st.supply > 0) {
                h.V += st.Q * dt;
                st.supply -= dt;
                st.lastGrow = now;
            }
            if (!h.alive) continue;

            if (h.hanging) {
                // Bead hanging under the jaw: shed a drop when heavy enough
                if (p.drip && h.V > 0.7) {
                    const [x, y] = headPos(m, h);
                    leak.drops.push({ x, y: y + headR(h.V) * s * p.thick, vy: 0, V: h.V * 0.6 });
                    h.V *= 0.4;
                }
                h.V = Math.min(h.V, 1.6);
            } else if (h.V > h.pin * (h.onWet ? 0.5 : 1)) {
                h.wob += (Math.random() - 0.5) * 4 * dt;
                h.wob *= 1 - 0.6 * dt;
                h.wob = Math.max(-0.5, Math.min(0.5, h.wob));
                // Downhill on the skin under the head, plus a meander
                let gx = 0, gy = 1;
                if (h.anchor) {
                    gx = m.slope[h.anchor.t * 2];
                    gy = Math.max(0.15, m.slope[h.anchor.t * 2 + 1]);
                }
                const steep = Math.hypot(gx, gy);
                const [x0, y0] = headPos(m, h);
                let ex = gx / steep + h.wob, ey = gy / steep;
                // Pulled sideways into the nearest wet track just below,
                // where it also runs with less pinning
                let best = R * R, bx = 0;
                for (let i = 0; i < wet.length; i += 3) {
                    if (wet[i + 2] === st) continue;
                    const ddx = wet[i] - x0, ddy = wet[i + 1] - y0;
                    if (ddy < 0 || ddy > R) continue;
                    const d2 = ddx * ddx + ddy * ddy;
                    if (d2 < best) { best = d2; bx = ddx; }
                }
                h.onWet = best < R * R;
                if (h.onWet) ex += 1.5 * bx / R;
                const len = Math.hypot(ex, ey);
                const dx = ex / len, dy = ey / len;
                const speed = Math.min(s * 1.2,
                    s * 0.45 * p.runny * (h.V - h.pin * (h.onWet ? 0.5 : 1)) * Math.max(0.35, steep));
                const x = x0 + dx * speed * dt, y = y0 + dy * speed * dt;
                h.V -= 0.3 * (speed * dt) / s;
                h.dir = [dx, dy];
                st.lastGrow = now;

                const a = locate(m, x, y, h.anchor ? h.anchor.t : null);
                if (a) {
                    h.anchor = a;
                    const last = st.pts[st.pts.length - 1];
                    const [lx, ly] = place(m, last);
                    if (Math.hypot(x - lx, y - ly) > Math.max(1.5, s * 0.012) && st.pts.length < 600) {
                        st.pts.push({ ...a, w: trailW(h.V) });
                    }
                } else if (insidePoly(m.oval, x, y)) {
                    // Over a hole (eye or open mouth): float across it
                    h.anchor = null;
                    h.fx = x; h.fy = y;
                } else {
                    h.hanging = true;   // ran off the face: stay at the edge
                }
            } else {
                // Pinned: soaks slowly into its trail, then may move again
                h.V -= 0.02 * dt;
                h.pin = 0.22 + Math.random() * 0.16;
            }
            if (h.V <= 0.04 && st.supply <= 0) h.alive = false;
        }

        // Drying: a stream that hasn't grown for `dry` seconds fades out
        for (const st of leak.streams) {
            const idle = (now - st.lastGrow) / 1000;
            if (idle > p.dry) st.alpha = Math.max(0, 1 - (idle - p.dry) / 4);
        }
        leak.streams = leak.streams.filter(st => st.alpha > 0);

        const g = s * 14;
        for (const d of leak.drops) {
            d.vy += g * dt;
            d.y += d.vy * dt;
        }
        leak.drops = leak.drops.filter(d => d.y < H + s);
    }

    function glossSpot(x, y, r, a) {
        if (a <= 0) return;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(255,255,255,${a})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    function drawLeak(m, p) {
        const s = m.s, k = s * p.thick;
        const LX = -0.6, LY = -0.8;   // light from the upper left
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // Liquid welling up along each lower lid while that eye is leaking
        for (let eye = 0; eye < 2; eye++) {
            const fed = leak.streams.filter(st => st.eye === eye && st.supply > 0).length;
            const level = Math.min(1, 0.35 * fed);
            if (level <= 0) continue;
            ctx.strokeStyle = `rgba(4,2,3,${0.9 * level + 0.1})`;
            ctx.lineWidth = s * 0.045 * p.thick * (0.5 + 0.5 * level);
            ctx.beginPath();
            LIDS[eye].forEach((i, j) => {
                const [x, y] = m.P[i];
                const yy = y + s * 0.012;
                j ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
            });
            ctx.stroke();
        }

        for (const st of leak.streams) {
            // Screen points plus the live head, split into visible runs
            const q = st.pts.map(a => [...place(m, a), a.w * k, facing(m, a.t)]);
            const h = st.head;
            if (h.alive && h.anchor) q.push([...place(m, h.anchor), trailW(h.V) * k, facing(m, h.anchor.t)]);
            const runs = [];
            let run = [];
            for (const pt of q) {
                if (pt[3]) run.push(pt);
                else { if (run.length > 1) runs.push(run); run = []; }
            }
            if (run.length > 1) runs.push(run);

            for (const r of runs) {
                const left = [], right = [], shine = [];
                for (let i = 0; i < r.length; i++) {
                    const a = r[Math.max(0, i - 1)], b = r[Math.min(r.length - 1, i + 1)];
                    let tx = b[0] - a[0], ty = b[1] - a[1];
                    const tl = Math.hypot(tx, ty) || 1;
                    tx /= tl; ty /= tl;
                    let nx = -ty, ny = tx;
                    const w = r[i][2] / 2;
                    left.push([r[i][0] + nx * w, r[i][1] + ny * w]);
                    right.push([r[i][0] - nx * w, r[i][1] - ny * w]);
                    if (nx * LX + ny * LY < 0) { nx = -nx; ny = -ny; }
                    shine.push([r[i][0] + nx * w * 0.45, r[i][1] + ny * w * 0.45]);
                }
                ctx.fillStyle = `rgba(4,2,3,${0.96 * st.alpha})`;
                tracePoly(ctx, left.concat(right.reverse()));
                ctx.fill();
                // Rounded start where the stream leaves the lid
                ctx.beginPath();
                ctx.arc(r[0][0], r[0][1], r[0][2] / 2, 0, Math.PI * 2);
                ctx.fill();

                const avgW = r.reduce((t, v) => t + v[2], 0) / r.length;
                if (p.gloss > 0 && avgW > 3) {
                    ctx.strokeStyle = `rgba(255,255,255,${0.22 * p.gloss * st.alpha})`;
                    ctx.lineWidth = avgW * 0.14;
                    ctx.beginPath();
                    shine.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
                    ctx.stroke();
                }
            }

            // The head: a bead stretched along its motion, longer when hanging
            if (h.alive && h.V > 0.04 && (!h.anchor || facing(m, h.anchor.t))) {
                const [x, y] = headPos(m, h);
                const r = headR(h.V) * k;
                const stretch = h.hanging ? 1.3 + 0.5 * Math.min(1, h.V) : 1.2;
                const ang = h.hanging ? 0 : Math.atan2(h.dir[0], h.dir[1]);
                ctx.fillStyle = `rgba(4,2,3,${0.97 * st.alpha})`;
                ctx.beginPath();
                ctx.ellipse(x, y + r * (stretch - 1) * 0.6, r, r * stretch, -ang, 0, Math.PI * 2);
                ctx.fill();
                glossSpot(x - r * 0.35, y - r * 0.2, r * 0.45, 0.7 * p.gloss * st.alpha);
            }
        }

        for (const d of leak.drops) {
            const r = headR(d.V) * k;
            const stretch = 1 + Math.min(1.5, d.vy / (s * 6));
            ctx.fillStyle = 'rgba(4,2,3,0.97)';
            ctx.beginPath();
            ctx.ellipse(d.x, d.y, r / Math.sqrt(stretch), r * stretch, 0, 0, Math.PI * 2);
            ctx.fill();
            glossSpot(d.x - r * 0.3, d.y - r * 0.3, r * 0.4, 0.7 * p.gloss);
        }
        ctx.restore();
    }

    // Paste src into a w×h box centred on (cx, cy), masked by an ellipse
    // whose edge fades over `feather` (0 = hard, 1 = fades from centre).
    const scratch = document.createElement('canvas');
    const sctx = scratch.getContext('2d');

    function pasteFeather(dctx, src, cx, cy, w, h, fx, fy, feather) {
        w = Math.max(1, Math.round(w));
        h = Math.max(1, Math.round(h));
        scratch.width = w;   // also clears and resets state
        scratch.height = h;
        sctx.save();
        sctx.translate(w / 2, h / 2);
        sctx.scale(fx ? -1 : 1, fy ? -1 : 1);
        sctx.drawImage(src, -w / 2, -h / 2, w, h);
        sctx.restore();
        sctx.globalCompositeOperation = 'destination-in';
        sctx.translate(w / 2, h / 2);
        sctx.scale(w / 2, h / 2);
        const g = sctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0, '#000');
        g.addColorStop(Math.min(0.995, Math.max(0, 1 - feather)), '#000');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.fillStyle = g;
        sctx.fillRect(-1, -1, 2, 2);
        dctx.drawImage(scratch, Math.round(cx - w / 2), Math.round(cy - h / 2));
    }

    // Skin tone around a region: samples a ring just outside its box and
    // averages the 40th–90th brightness percentile, which skips brows,
    // lashes and shadows.
    function skinTone(b, W, H) {
        const rx = b.w * 0.6, ry = b.h * 0.6;
        const x0 = Math.max(0, Math.floor(b.cx - rx - 1));
        const y0 = Math.max(0, Math.floor(b.cy - ry - 1));
        const x1 = Math.min(W, Math.ceil(b.cx + rx + 1));
        const y1 = Math.min(H, Math.ceil(b.cy + ry + 1));
        const bw = x1 - x0, bh = y1 - y0;
        if (bw < 2 || bh < 2) return null;
        const d = ctx.getImageData(x0, y0, bw, bh).data;
        const s = [];
        for (let k = 0; k < 48; k++) {
            const a = k / 48 * Math.PI * 2;
            const x = Math.min(bw - 1, Math.max(0, Math.round(b.cx + Math.cos(a) * rx - x0)));
            const y = Math.min(bh - 1, Math.max(0, Math.round(b.cy + Math.sin(a) * ry - y0)));
            const o = (y * bw + x) * 4;
            s.push([d[o], d[o + 1], d[o + 2], d[o] * 0.3 + d[o + 1] * 0.59 + d[o + 2] * 0.11]);
        }
        s.sort((p, q) => p[3] - q[3]);
        const pick = s.slice(Math.floor(s.length * 0.4), Math.ceil(s.length * 0.9));
        const avg = [0, 1, 2].map(c => Math.round(pick.reduce((t, v) => t + v[c], 0) / pick.length));
        return `${avg[0]},${avg[1]},${avg[2]}`;
    }

    function fillSkin(b, rgb) {
        if (!rgb) return;
        ctx.save();
        ctx.translate(b.cx, b.cy);
        ctx.scale(b.w / 2, b.h / 2);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0,    `rgba(${rgb},1)`);
        g.addColorStop(0.55, `rgba(${rgb},1)`);
        g.addColorStop(1,    `rgba(${rgb},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
    }

    // Whole-frame grade: desaturate, sickly tint, vignette, flicker.
    let flickLevel = 0;

    function drawAtmosphere(W, H, p) {
        ctx.save();
        if (p.desat > 0) {
            ctx.globalCompositeOperation = 'saturation';
            ctx.fillStyle = `rgba(128,128,128,${p.desat})`;
            ctx.fillRect(0, 0, W, H);
        }
        if (p.tint > 0) {
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = `rgba(170,205,180,${p.tint})`;
            ctx.fillRect(0, 0, W, H);
        }
        ctx.globalCompositeOperation = 'source-over';
        if (p.vig > 0) {
            const R = Math.hypot(W, H) / 2;
            const g = ctx.createRadialGradient(W / 2, H / 2, R * 0.35, W / 2, H / 2, R);
            g.addColorStop(0, 'rgba(0,0,0,0)');
            g.addColorStop(1, `rgba(0,0,0,${Math.min(1, p.vig * 1.1)})`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
        }
        if (p.flick > 0) {
            // A failing bulb: low-passed jitter plus occasional dropouts
            flickLevel = flickLevel * 0.7 + Math.random() * 0.3;
            let a = flickLevel * 0.35 * p.flick;
            if (Math.random() < 0.04 * p.flick) a = 0.5 + 0.4 * p.flick;
            ctx.fillStyle = `rgba(0,0,0,${a})`;
            ctx.fillRect(0, 0, W, H);
        }
        ctx.restore();
    }

    // ---- Shared face geometry ----

    // Upper and lower lid of an eye, scaled about its centroid. The
    // L_EYE / R_EYE lists walk the lower lid first (9 points), then the
    // upper lid back to the start.
    function eyeRows(lm, idx, W, H, sc) {
        const e = eyeShape(lm, idx, W, H);
        const pts = e.pts.map(([x, y]) => [e.cx + (x - e.cx) * sc, e.cy + (y - e.cy) * sc]);
        return {
            e, pts,
            lower: pts.slice(0, 9),
            upper: [pts[8], ...pts.slice(9), pts[0]],
            ew: Math.max(1, e.ew * sc),
        };
    }

    // n+1 points evenly spaced by arc length along a polyline
    function resample(line, n) {
        const seg = [];
        let total = 0;
        for (let i = 1; i < line.length; i++) {
            const d = Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]);
            seg.push(d);
            total += d;
        }
        const out = [];
        for (let k = 0; k <= n; k++) {
            let want = total * k / n, i = 0;
            while (i < seg.length - 1 && want > seg[i]) { want -= seg[i]; i++; }
            const f = seg[i] > 0 ? Math.min(1, want / seg[i]) : 0;
            out.push([line[i][0] + (line[i + 1][0] - line[i][0]) * f,
                      line[i][1] + (line[i + 1][1] - line[i][1]) * f]);
        }
        return out;
    }

    // The mouth's own frame: u along the corners, v towards the chin.
    function mouthFrame(lm, W, H) {
        const P = i => [lm[i].x * W, lm[i].y * H];
        const a = P(61), b = P(291);
        const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
        const half = Math.max(1, Math.hypot(b[0] - a[0], b[1] - a[1]) / 2);
        const ux = (b[0] - a[0]) / (2 * half), uy = (b[1] - a[1]) / (2 * half);
        let vx = -uy, vy = ux;
        const chin = P(152);
        if ((chin[0] - cx) * vx + (chin[1] - cy) * vy < 0) { vx = -vx; vy = -vy; }
        return { P, cx, cy, half, ux, uy, vx, vy };
    }

    function polyBox(poly) {
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const [x, y] of poly) {
            x1 = Math.min(x1, x); x2 = Math.max(x2, x);
            y1 = Math.min(y1, y); y2 = Math.max(y2, y);
        }
        return { x: x1, y: y1, w: x2 - x1, h: y2 - y1, cx: (x1 + x2) / 2, cy: (y1 + y2) / 2 };
    }

    // Sub-rectangle of a ring crop (captured from `box`) around `inner`
    function subRect(crop, box, inner) {
        const sx = Math.max(0, inner.x - box.x), sy = Math.max(0, inner.y - box.y);
        const sw = Math.min(crop.width - sx, inner.w), sh = Math.min(crop.height - sy, inner.h);
        return (sw >= 2 && sh >= 2) ? { sx, sy, sw, sh } : null;
    }

    // ---- Mouth in both eyes ----
    // The live mouth, clipped to each (enlarged) eye opening.

    function drawMouthInEyes(lm, W, H, p, mouthCrop, mb) {
        const lips = bbox(lm, LIP_OUTER, W, H, 3);
        const r = subRect(mouthCrop, mb, lips);
        if (!r) return;
        for (const idx of [L_EYE, R_EYE]) {
            const { e, pts, ew } = eyeRows(lm, idx, W, H, p.meSize);
            const box = polyBox(pts);
            const k = Math.max(box.w / r.sw, box.h / r.sh) * p.meZoom;
            ctx.save();
            tracePoly(ctx, pts);
            ctx.clip();
            ctx.fillStyle = '#1a0306';
            ctx.fill();
            ctx.drawImage(mouthCrop, r.sx, r.sy, r.sw, r.sh,
                          e.cx - r.sw * k / 2, e.cy - r.sh * k / 2, r.sw * k, r.sh * k);
            ctx.restore();
            ctx.save();
            ctx.strokeStyle = 'rgba(25,8,8,0.6)';
            ctx.lineWidth = Math.max(1, ew * 0.03);
            tracePoly(ctx, pts);
            ctx.stroke();
            ctx.restore();
        }
    }

    // ---- Teeth in both eyes ----
    // Each eye opening becomes a small mouth: dark throat, gums along the
    // lids, and a row of teeth hanging from each lid towards the middle.

    function toothPath(c, b0, b1, inX, inY, L, k) {
        const mx = (b0[0] + b1[0]) / 2, my = (b0[1] + b1[1]) / 2;
        const ux = (b1[0] - b0[0]) / 2 * 0.88, uy = (b1[1] - b0[1]) / 2 * 0.88;
        const P = (a, b) => [mx + ux * a + inX * b, my + uy * a + inY * b];
        const sh = L * 0.75 * (1 - k);
        c.beginPath();
        c.moveTo(...P(-1, -L * 0.15));
        c.lineTo(...P(-1, sh));
        c.quadraticCurveTo(...P(-(1 - k), L), ...P(0, L));
        c.quadraticCurveTo(...P(1 - k, L), ...P(1, sh));
        c.lineTo(...P(1, -L * 0.15));
        c.closePath();
        return P;
    }

    function toothColor(yellow, light) {
        const mix = (a, b) => Math.round(a + (b - a) * yellow);
        const r = mix(244, 196), g = mix(238, 168), b = mix(222, 100);
        const f = light ? 1 : 0.82;
        return `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`;
    }

    function drawTeethEye(lm, idx, W, H, p) {
        const { e, pts, lower, upper, ew } = eyeRows(lm, idx, W, H, p.teSize);
        const [cx, cy] = [e.cx, e.cy];
        ctx.save();
        tracePoly(ctx, pts);
        ctx.clip();
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, ew * 0.5);
        g.addColorStop(0, '#080002');
        g.addColorStop(1, '#3d060c');
        ctx.fillStyle = g;
        ctx.fillRect(cx - ew, cy - ew, ew * 2, ew * 2);

        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#7a1a26';
        ctx.lineWidth = ew * 0.07;
        for (const row of [lower, upper]) {
            ctx.beginPath();
            row.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
            ctx.stroke();
        }

        const n = Math.round(p.teCount);
        const L = ew * 0.2 * p.teLen;
        for (const row of [lower, upper]) {
            const q = resample(row, n);
            for (let i = 0; i < n; i++) {
                const b0 = q[i], b1 = q[i + 1];
                const mx = (b0[0] + b1[0]) / 2, my = (b0[1] + b1[1]) / 2;
                let nx = -(b1[1] - b0[1]), ny = b1[0] - b0[0];
                const nl = Math.hypot(nx, ny) || 1;
                nx /= nl; ny /= nl;
                if (nx * (cx - mx) + ny * (cy - my) < 0) { nx = -nx; ny = -ny; }
                const P = toothPath(ctx, b0, b1, nx, ny, L, p.teSharp);
                const tg = ctx.createLinearGradient(...P(0, 0), ...P(0, L));
                tg.addColorStop(0, toothColor(Math.min(1, p.teYellow * 1.3), false));
                tg.addColorStop(1, toothColor(p.teYellow * 0.6, true));
                ctx.fillStyle = tg;
                ctx.fill();
                ctx.strokeStyle = 'rgba(60,35,20,0.6)';
                ctx.lineWidth = Math.max(0.6, ew * 0.008);
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    // ---- Eye inside the mouth ----
    // The live eye(s), clipped to the (enlarged) mouth opening: invisible
    // with the mouth shut, staring out when it opens.

    function drawEyeInMouth(lm, W, H, p, crops) {
        const mf = mouthFrame(lm, W, H);
        const raw = LIP_INNER.map(mf.P);
        const c = polyBox(raw);
        // Nothing to see while the lips are together
        if (c.h < mf.half * 0.06) return;
        // Mouth size opens the hole mostly in height, so it stays
        // inside the lips instead of spreading over the cheeks.
        const sx = 1 + (p.emSize - 1) * 0.25, sy = p.emSize;
        const poly = raw.map(([x, y]) => [c.cx + (x - c.cx) * sx, c.cy + (y - c.cy) * sy]);
        const box = polyBox(poly);
        const eyes = crops.filter(Boolean).sort((a, b) => a.box.cx - b.box.cx);
        const cell = box.w / eyes.length;
        ctx.save();
        tracePoly(ctx, poly);
        ctx.clip();
        ctx.fillStyle = '#120204';
        ctx.fill();
        eyes.forEach((ey, i) => {
            const tight = bbox(lm, ey.idx, W, H, 5);
            const r = subRect(ey.crop, ey.box, tight);
            if (!r) return;
            const k = Math.max(cell / r.sw, box.h / r.sh) * p.emZoom;
            const x = box.x + cell * (i + 0.5);
            ctx.drawImage(ey.crop, r.sx, r.sy, r.sw, r.sh,
                          x - r.sw * k / 2, box.cy - r.sh * k / 2, r.sw * k, r.sh * k);
        });
        ctx.restore();
        ctx.save();
        ctx.strokeStyle = 'rgba(40,5,10,0.7)';
        ctx.lineWidth = Math.max(1, mf.half * 0.04);
        tracePoly(ctx, poly);
        ctx.stroke();
        ctx.restore();
    }

    // ---- Dracula teeth ----
    // Two fangs hanging from the inner upper lip at the canines, curving
    // slightly inwards; with the mouth shut they rest over the lower lip.

    const FANG_ROWS = [[13, 82, 81, 80, 191, 78], [13, 312, 311, 310, 415, 308]];

    function drawFangs(lm, W, H, p, now) {
        const mf = mouthFrame(lm, W, H);
        const { ux, uy, vx, vy, half } = mf;
        const w = half * 0.12 * p.fWidth;
        const L = half * 0.42 * p.fLen;
        FANG_ROWS.forEach((row, side) => {
            const f = p.fSpread * (row.length - 1);
            const i = Math.min(row.length - 2, Math.floor(f));
            const A = mf.P(row[i]), B = mf.P(row[i + 1]);
            const t = f - i;
            const bx = A[0] + (B[0] - A[0]) * t, by = A[1] + (B[1] - A[1]) * t;
            const out = Math.sign((bx - mf.cx) * ux + (by - mf.cy) * uy) || 1;
            // a: across the fang (−1..1), b: down along it (0..L)
            const P = (a, b) => {
                const curl = -out * (b / L) ** 2 * w * 0.6;
                return [bx + ux * (a * w + curl) + vx * b, by + uy * (a * w + curl) + vy * b];
            };
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(...P(-1, -w * 0.3));
            ctx.quadraticCurveTo(...P(-1, L * 0.55), ...P(-0.08, L));
            ctx.lineTo(...P(0.08, L));
            ctx.quadraticCurveTo(...P(1, L * 0.45), ...P(1, -w * 0.3));
            ctx.closePath();
            const g = ctx.createLinearGradient(...P(0, 0), ...P(0, L));
            g.addColorStop(0, '#d9cfb4');
            g.addColorStop(1, '#fffdf4');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(70,45,30,0.55)';
            ctx.lineWidth = Math.max(0.7, w * 0.08);
            ctx.stroke();
            if (p.fBlood > 0) {
                ctx.clip();
                const bg = ctx.createLinearGradient(...P(0, L * 0.45), ...P(0, L));
                bg.addColorStop(0, 'rgba(140,0,12,0)');
                bg.addColorStop(1, `rgba(140,0,12,${0.85 * p.fBlood})`);
                ctx.fillStyle = bg;
                ctx.fill();
            }
            ctx.restore();
            // Highlight down the front of the fang
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = Math.max(0.6, w * 0.15);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(...P(-0.45, L * 0.1));
            ctx.quadraticCurveTo(...P(-0.45, L * 0.5), ...P(-0.15, L * 0.75));
            ctx.stroke();
            ctx.restore();
            // A bead of blood swelling at the tip
            if (p.fBlood > 0) {
                const r = w * 0.45 * p.fBlood * (1 + 0.15 * Math.sin(now / 300 + side * 2));
                const [tx, ty] = P(0, L + r * 0.7);
                ctx.save();
                ctx.fillStyle = '#7a0008';
                ctx.beginPath();
                ctx.ellipse(tx, ty, r, r * 1.25, Math.atan2(-vx, vy), 0, Math.PI * 2);
                ctx.fill();
                glossSpot(tx - r * 0.3, ty - r * 0.35, r * 0.45, 0.6);
                ctx.restore();
            }
        });
    }

    // ---- Goth simulator ----
    // Makeup is painted through soft masks: the mask holds the shape (with
    // a blurred edge), a layer is filled with colour, cut by the mask and
    // composited with a blend mode (multiply keeps the skin's texture).

    const gothMask = document.createElement('canvas');
    const gothLayer = document.createElement('canvas');
    const gmctx = gothMask.getContext('2d');
    const glctx = gothLayer.getContext('2d');

    function startMask(W, H) {
        for (const c of [gothMask, gothLayer]) {
            if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
        }
        gmctx.clearRect(0, 0, W, H);
    }

    // Add soft shapes to the mask (several polygons, even-odd for rings)
    function maskShape(polys, blur, alpha, W) {
        const off = W * 4;
        gmctx.save();
        gmctx.shadowColor = `rgba(255,255,255,${alpha})`;
        gmctx.shadowBlur = blur;
        gmctx.shadowOffsetX = off;
        gmctx.fillStyle = '#fff';
        gmctx.beginPath();
        for (const poly of polys) {
            poly.forEach(([x, y], k) => k ? gmctx.lineTo(x - off, y) : gmctx.moveTo(x - off, y));
            gmctx.closePath();
        }
        gmctx.fill('evenodd');
        gmctx.restore();
    }

    function applyMask(W, H, color, op, alpha) {
        if (alpha <= 0) return;
        glctx.globalCompositeOperation = 'source-over';
        glctx.clearRect(0, 0, W, H);
        glctx.fillStyle = color;
        glctx.fillRect(0, 0, W, H);
        glctx.globalCompositeOperation = 'destination-in';
        glctx.drawImage(gothMask, 0, 0);
        glctx.globalCompositeOperation = 'source-over';
        ctx.save();
        ctx.globalCompositeOperation = op;
        ctx.globalAlpha = Math.min(1, alpha);
        ctx.drawImage(gothLayer, 0, 0);
        ctx.restore();
    }

    // Brow lower / upper edges that belong with L_EYE and R_EYE
    const BROWS = [
        { lower: [46, 53, 52, 65, 55],      upper: [70, 63, 105, 66, 107] },
        { lower: [276, 283, 282, 295, 285], upper: [300, 293, 334, 296, 336] },
    ];
    const LIP_COLORS = { black: '#140810', plum: '#3a0a30', blood: '#6a0010' };

    function drawGoth(lm, W, H, p) {
        const P = i => [lm[i].x * W, lm[i].y * H];
        const eyes = [L_EYE, R_EYE].map(idx => eyeRows(lm, idx, W, H, 1));
        const s = Math.hypot(eyes[1].e.cx - eyes[0].e.cx, eyes[1].e.cy - eyes[0].e.cy);

        // Pale, washed-out skin over the whole face
        if (p.gPale > 0 && OVAL) {
            startMask(W, H);
            maskShape([OVAL.map(P)], s * 0.12, 1, W);
            applyMask(W, H, 'rgb(128,128,128)', 'saturation', 0.85 * p.gPale);
            applyMask(W, H, 'rgb(235,232,240)', 'screen', 0.5 * p.gPale);
            applyMask(W, H, 'rgb(225,225,240)', 'multiply', 0.4 * p.gPale);
        }

        // Smoky eyeshadow from lid to brow, with a smudge under the eye
        if (p.gShadow > 0) {
            startMask(W, H);
            eyes.forEach((ey, k) => {
                const { e, upper, lower } = ey;
                let brow = BROWS[k].lower.map(P);
                const first = upper[upper.length - 1];
                if (Math.hypot(brow[0][0] - first[0], brow[0][1] - first[1]) >
                    Math.hypot(brow[4][0] - first[0], brow[4][1] - first[1])) brow = brow.reverse();
                brow = brow.map(([x, y]) => [x + (e.cx - x) * 0.25, y + (e.cy - y) * 0.25]);
                maskShape([upper.concat(brow)], ey.ew * 0.3, 1, W);
                const down = lower.map(([x, y]) => [x, y + ey.ew * 0.16]).reverse();
                maskShape([lower.concat(down)], ey.ew * 0.25, 0.6, W);
            });
            applyMask(W, H, '#1c0c1e', 'multiply', p.gShadow);
            applyMask(W, H, '#120812', 'source-over', 0.35 * p.gShadow);
        }

        // Darker, sharper brows
        if (p.gBrow > 0) {
            startMask(W, H);
            for (const b of BROWS) {
                maskShape([b.lower.map(P).concat(b.upper.map(P).reverse())], s * 0.02, 1, W);
            }
            applyMask(W, H, '#0d0709', 'multiply', p.gBrow);
            applyMask(W, H, '#0d0709', 'source-over', 0.5 * p.gBrow);
        }

        // Black lipstick (or plum / blood red) on the lip ring
        if (p.gLip > 0) {
            const mf = mouthFrame(lm, W, H);
            startMask(W, H);
            maskShape([LIP_OUTER.map(P), LIP_INNER.map(P)], mf.half * 0.05, 1, W);
            const col = LIP_COLORS[p.gLipColor] || LIP_COLORS.black;
            applyMask(W, H, col, 'multiply', p.gLip);
            applyMask(W, H, col, 'source-over', 0.55 * p.gLip);
        }

        // Eyeliner along both lids, with a flicked wing at the outer corner
        if (p.gLiner > 0) {
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeStyle = `rgba(5,3,5,${Math.min(1, 0.4 + p.gLiner)})`;
            ctx.fillStyle = ctx.strokeStyle;
            eyes.forEach((ey, k) => {
                const { e, upper, lower, ew } = ey;
                const line = (row, wdt) => {
                    ctx.lineWidth = wdt;
                    ctx.beginPath();
                    row.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
                    ctx.stroke();
                };
                const lw = ew * (0.02 + 0.06 * p.gLiner);
                line(upper, lw);
                line(lower, lw * 0.45);
                if (p.gWing > 0) {
                    // Outer corner: the lid end farther from the nose bridge
                    const nb = P(168);
                    const a = upper[0], b = upper[upper.length - 1];
                    const outerFirst = Math.hypot(a[0] - nb[0], a[1] - nb[1]) >
                                       Math.hypot(b[0] - nb[0], b[1] - nb[1]);
                    const o = outerFirst ? a : b;
                    const near = outerFirst ? upper[1] : upper[upper.length - 2];
                    const inner = outerFirst ? b : a;
                    let ax = o[0] - inner[0], ay = o[1] - inner[1];
                    const al = Math.hypot(ax, ay) || 1;
                    ax /= al; ay /= al;
                    const brow = P(BROWS[k].upper[2]);
                    let upx = -ay, upy = ax;
                    if (upx * (brow[0] - e.cx) + upy * (brow[1] - e.cy) < 0) { upx = -upx; upy = -upy; }
                    const L = ew * 0.38 * p.gWing;
                    const tip = [o[0] + ax * L + upx * L * 0.45, o[1] + ay * L + upy * L * 0.45];
                    ctx.beginPath();
                    ctx.moveTo(near[0] + upx * lw * 0.6, near[1] + upy * lw * 0.6);
                    ctx.lineTo(...tip);
                    ctx.lineTo(o[0] - upx * lw * 0.4, o[1] - upy * lw * 0.4);
                    ctx.closePath();
                    ctx.fill();
                }
            });
            ctx.restore();
        }
    }

    // ---- Exploding eyes ----
    // The eyeball is cut into tiles of its own pixels that fly out, spin,
    // grow (coming towards the camera) and fall. Splatter drops land on
    // the face mesh and stick there; an empty socket remains until the
    // eye regrows.

    const boom = {
        eyes: [{ gone: false, t0: 0 }, { gone: false, t0: 0 }],
        frags: [], drops: [], splats: [], flashes: [], lens: [],
        request: false, lastAuto: performance.now(), lastT: 0,
    };

    function splatColor(p, a) {
        return p.xInk ? `rgba(6,4,6,${a})` : `rgba(105,0,8,${a})`;
    }

    function detonate(lm, idx, k, W, H, p, s, now) {
        const { e, pts, ew } = eyeRows(lm, idx, W, H, 1.15);
        const box = polyBox(pts);
        const x0 = Math.max(0, Math.floor(box.x)), y0 = Math.max(0, Math.floor(box.y));
        const w = Math.min(W - x0, Math.ceil(box.w)), h = Math.min(H - y0, Math.ceil(box.h));
        if (w < 2 || h < 2) return;
        const snap = document.createElement('canvas');
        snap.width = w; snap.height = h;
        snap.getContext('2d').drawImage(canvas, x0, y0, w, h, 0, 0, w, h);

        const tile = Math.max(4, ew / 5);
        for (let ty = 0; ty < h; ty += tile) {
            for (let tx = 0; tx < w; tx += tile) {
                const cx = x0 + tx + tile / 2, cy = y0 + ty + tile / 2;
                if (!insidePoly(pts, cx, cy)) continue;
                let dx = cx - e.cx, dy = cy - e.cy;
                const dl = Math.hypot(dx, dy);
                if (dl < 1e-3) { const a = Math.random() * 6.283; dx = Math.cos(a); dy = Math.sin(a); }
                else { dx /= dl; dy /= dl; }
                const v = s * (1.5 + 3 * Math.random()) * p.xPower;
                boom.frags.push({
                    img: snap, sx: tx, sy: ty, sw: Math.min(tile, w - tx), sh: Math.min(tile, h - ty),
                    x: cx, y: cy, vx: dx * v, vy: dy * v - s * p.xPower,
                    rot: 0, vr: (Math.random() - 0.5) * 20,
                    scale: 1, vs: Math.random() * 3 * p.xPower,
                    life: 0.9 + Math.random() * 0.6,
                });
            }
        }
        const n = Math.round(8 + 60 * p.xGore);
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const v = s * (0.8 + 4 * Math.random()) * p.xPower;
            boom.drops.push({
                x: e.cx, y: e.cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - s * 0.8 * p.xPower,
                flight: 0.04 + Math.random() * 0.35,
                r: s * (0.006 + 0.022 * Math.random() ** 2),
            });
        }
        // A few big blobs hit the camera lens and run down it
        const nl = Math.round(p.xGore * 4 * Math.random() + p.xGore * 1.5);
        for (let i = 0; i < nl; i++) {
            const a = Math.random() * Math.PI * 2, d = s * (0.2 + 1.2 * Math.random());
            const pts = [];
            for (let j = 0; j < 14; j++) pts.push(0.75 + 0.5 * Math.random());
            boom.lens.push({
                x: e.cx + Math.cos(a) * d, y: e.cy + Math.sin(a) * d,
                r: s * (0.06 + 0.16 * Math.random()), pts,
                land: now + 40 + Math.random() * 160, born: now,
                run: 0.3 + Math.random(),
            });
        }
        boom.flashes.push({ x: e.cx, y: e.cy, r: ew, t0: now });
        boom.eyes[k] = { gone: true, t0: now };
    }

    function stepBoom(lm, m, W, H, p, now) {
        const dt = Math.min(0.05, Math.max(0, (now - boom.lastT) / 1000));
        boom.lastT = now;
        const s = m ? m.s : 60;
        const want = p.xEye === 'both' ? [0, 1] : p.xEye === 'left' ? [0] : [1];

        if (p.xAuto > 0 && now - boom.lastAuto > p.xAuto * 1000 &&
            want.every(k => !boom.eyes[k].gone)) boom.request = true;
        if (boom.request) {
            boom.request = false;
            boom.lastAuto = now;
            for (const k of want) {
                if (!boom.eyes[k].gone) detonate(lm, k ? R_EYE : L_EYE, k, W, H, p, s, now);
            }
        }
        for (const ey of boom.eyes) {
            if (ey.gone && now - ey.t0 > p.xRegrow * 1000) ey.gone = false;
        }

        const g = s * 10;
        for (const f of boom.frags) {
            f.vy += g * dt;
            f.x += f.vx * dt; f.y += f.vy * dt;
            f.rot += f.vr * dt;
            f.scale += f.vs * dt;
            f.life -= dt;
        }
        boom.frags = boom.frags.filter(f => f.life > 0);

        for (const d of boom.drops) {
            d.vy += g * dt;
            d.x += d.vx * dt; d.y += d.vy * dt;
            d.flight -= dt;
            if (d.flight <= 0 && !d.missed) {
                // Landing: stick to the skin if it hit the face
                const a = m && locate(m, d.x, d.y, null);
                if (a) {
                    const sp = Math.hypot(d.vx, d.vy);
                    const ang = Math.atan2(d.vy, d.vx);
                    const r = d.r * (1.5 + Math.random());
                    boom.splats.push({ anchor: a, r, ang, stretch: 1 + Math.min(2, sp / (s * 4)), born: now });
                    // Satellite droplets thrown ahead along the impact
                    const ns = Math.floor(Math.random() * 4);
                    for (let j = 1; j <= ns; j++) {
                        const dist = r * (1.6 + j * 1.1);
                        const off = (Math.random() - 0.5) * 0.6;
                        const x = d.x + Math.cos(ang + off) * dist, y = d.y + Math.sin(ang + off) * dist;
                        const sa = locate(m, x, y, a.t);
                        if (sa) boom.splats.push({ anchor: sa, r: r * (0.45 - j * 0.08), ang, stretch: 1.3, born: now });
                    }
                    d.dead = true;
                } else {
                    d.missed = true;
                }
            }
        }
        boom.drops = boom.drops.filter(d => !d.dead && d.y < H + 40 && d.x > -40 && d.x < W + 40);
        const keep = (p.xRegrow * 1.5 + 2) * 1000;
        boom.splats = boom.splats.filter(sp => now - sp.born < keep);
        boom.lens = boom.lens.filter(b => now - b.born < keep);
        boom.flashes = boom.flashes.filter(f => now - f.t0 < 250);
    }

    function drawBoom(lm, m, W, H, p, now) {
        // Empty sockets, fading out as the eye regrows
        [L_EYE, R_EYE].forEach((idx, k) => {
            const ey = boom.eyes[k];
            if (!ey.gone) return;
            const left = p.xRegrow - (now - ey.t0) / 1000;
            const a = Math.min(1, left / 0.8);
            const { e, pts, ew } = eyeRows(lm, idx, W, H, 1.2);
            softFill(pts, 0.7 * a, ew * 0.08, W);
            ctx.save();
            ctx.globalAlpha = a;
            const g = ctx.createRadialGradient(e.cx, e.cy, 0, e.cx, e.cy, ew * 0.55);
            if (p.xInk) {
                g.addColorStop(0, '#000'); g.addColorStop(1, '#1d1a1d');
            } else {
                g.addColorStop(0, '#050000'); g.addColorStop(0.6, '#2a0004'); g.addColorStop(1, '#70090f');
            }
            ctx.fillStyle = g;
            tracePoly(ctx, pts);
            ctx.fill();
            ctx.restore();
        });

        const keep = p.xRegrow * 1.5 + 2;
        if (m) {
            for (const sp of boom.splats) {
