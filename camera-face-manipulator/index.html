<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Face Manipulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #ddd;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }
        #status {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #fa0;
            font-size: 0.9rem;
        }
        .stage {
            --ar: 4 / 3;
            position: relative;
            aspect-ratio: var(--ar);
            /* As wide as fits, limited by either viewport axis;
               aspect-ratio derives the height, so it never distorts. */
            width: min(calc(100vw - 36px), calc((100vh - 36px) * var(--ar)));
        }
        canvas {
            display: block;
            border: 2px solid #333;
            border-radius: 8px;
            width: 100%;
            height: 100%;
        }
        .panel {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            min-width: 180px;
            max-height: calc(100% - 24px);
            overflow-y: auto;
        }
        .panel.left {
            right: auto;
            left: 12px;
            width: 230px;
        }
        .panel h3.horror { color: #e33; }
        .panel h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 10px 0 2px;
        }
        .panel .group[hidden] { display: none; }
        .panel button {
            margin-top: 6px;
            background: #2a1414;
            color: #eaa;
            border: 1px solid #633;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .panel button:hover { background: #3a1a1a; }
        .panel h3 {
            font-size: 0.95rem;
            margin: 14px 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333;
        }
        .panel h3:first-child { margin-top: 0; }
        .panel h3.eyes { color: #8f8; }
        .panel h3.nose { color: #8af; }
        .panel h3.mouth { color: #f88; }
        .panel h3.lag { color: #fa0; }
        .panel label.slider input[type="range"] {
            flex: 1;
            min-width: 80px;
        }
        .panel label.slider .val {
            min-width: 3ch;
            text-align: right;
            color: #fa0;
            font-variant-numeric: tabular-nums;
        }
        .panel select {
            background: #222;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.85rem;
        }
        .panel label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .hint {
            color: #666;
            font-size: 0.8rem;
            margin-top: 14px;
            border-top: 1px solid #333;
            padding-top: 10px;
            line-height: 1.4;
        }
        kbd {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div id="status">Loading face detection model...</div>
    <div class="stage">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div class="panel">
            <h3>View</h3>
            <label><input type="checkbox" id="mirrorView" checked> Mirror (flip X)</label>
            <h3>Overlay</h3>
            <label><input type="checkbox" id="showOverlay"> Show L / R / nose / mouth</label>
            <h3 class="eyes">Eyes</h3>
            <label>Source
                <select id="eyeSource">
                    <option value="both" selected>Both</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                </select>
            </label>
            <label><input type="checkbox" id="eyeSwap" checked> Swap Left / Right</label>
            <label><input type="checkbox" id="eyeFlipX" checked> Flip X (mirror)</label>
            <label><input type="checkbox" id="eyeFlipY"> Flip Y</label>
            <h3 class="nose">Nose</h3>
            <label><input type="checkbox" id="noseFlipX"> Flip X (mirror)</label>
            <h3 class="mouth">Mouth</h3>
            <label><input type="checkbox" id="mouthFlipX" checked> Flip X (mirror)</label>
            <label><input type="checkbox" id="mouthFlipY"> Flip Y</label>
            <h3 class="lag">Lag (frames)</h3>
            <label class="slider">L eye <input type="range" id="delayL" min="1" max="30" value="1"><span class="val" id="delayLVal">1</span></label>
            <label class="slider">R eye <input type="range" id="delayR" min="1" max="30" value="1"><span class="val" id="delayRVal">1</span></label>
            <label class="slider">Mouth <input type="range" id="delayM" min="1" max="30" value="1"><span class="val" id="delayMVal">1</span></label>
            <div class="hint">
                Hold <kbd>Space</kbd> to see original
            </div>
        </div>
        <div class="panel left">
            <h3 class="horror">Horror</h3>
            <label>Mode
                <select id="horrorMode">
                    <option value="off" selected>Off</option>
                    <option value="black">1 · Black eyes</option>
                    <option value="swap">2 · Swap eye / mouth</option>
                    <option value="both">1 + 2</option>
                    <option value="leak">3 · Leaking eyes</option>
                </select>
            </label>
            <div class="group" id="blackGroup" hidden>
                <h4>Black eyes</h4>
                <label class="slider">Darkness <input type="range" id="hDark" min="0" max="100" value="100"><span class="val" id="hDarkVal">100</span></label>
                <label class="slider">Size <input type="range" id="hSize" min="70" max="170" value="110"><span class="val" id="hSizeVal">110</span></label>
                <label class="slider">Soft edge <input type="range" id="hSoft" min="0" max="100" value="15"><span class="val" id="hSoftVal">15</span></label>
                <label class="slider">Glint <input type="range" id="hGlint" min="0" max="100" value="60"><span class="val" id="hGlintVal">60</span></label>
                <label class="slider">Sockets <input type="range" id="hSocket" min="0" max="100" value="40"><span class="val" id="hSocketVal">40</span></label>
                <label class="slider">Tears <input type="range" id="hTears" min="0" max="100" value="0"><span class="val" id="hTearsVal">0</span></label>
            </div>
            <div class="group" id="leakGroup" hidden>
                <h4>Leaking liquid</h4>
                <label class="slider">Flow <input type="range" id="lFlow" min="0" max="100" value="50"><span class="val" id="lFlowVal">50</span></label>
                <label class="slider">Runniness <input type="range" id="lSpeed" min="10" max="300" value="100"><span class="val" id="lSpeedVal">100</span></label>
                <label class="slider">Thickness <input type="range" id="lThick" min="40" max="250" value="100"><span class="val" id="lThickVal">100</span></label>
                <label class="slider">Gloss <input type="range" id="lGloss" min="0" max="100" value="60"><span class="val" id="lGlossVal">60</span></label>
                <label class="slider">Dries (s) <input type="range" id="lDry" min="5" max="120" value="45"><span class="val" id="lDryVal">45</span></label>
                <label><input type="checkbox" id="lDrip" checked> Drip off the jaw</label>
                <button type="button" id="lWipe">Wipe face</button>
            </div>
            <div class="group" id="swapGroup" hidden>
                <h4>Swap eye / mouth</h4>
                <label>Eye
                    <select id="hSwapEye">
                        <option value="left" selected>L</option>
                        <option value="right">R</option>
                        <option value="both">Both</option>
                    </select>
                </label>
                <label class="slider">Eye size <input type="range" id="hEyeScale" min="50" max="300" value="160"><span class="val" id="hEyeScaleVal">160</span></label>
                <label class="slider">Mouth size <input type="range" id="hMouthScale" min="30" max="150" value="90"><span class="val" id="hMouthScaleVal">90</span></label>
                <label class="slider">Feather <input type="range" id="hFeather" min="0" max="100" value="40"><span class="val" id="hFeatherVal">40</span></label>
                <label><input type="checkbox" id="hSmudge" checked> Skin over originals</label>
            </div>
            <div class="group" id="atmoGroup" hidden>
                <h4>Atmosphere</h4>
                <label class="slider">Desaturate <input type="range" id="hDesat" min="0" max="100" value="50"><span class="val" id="hDesatVal">50</span></label>
                <label class="slider">Sickly tint <input type="range" id="hTint" min="0" max="100" value="30"><span class="val" id="hTintVal">30</span></label>
                <label class="slider">Vignette <input type="range" id="hVig" min="0" max="100" value="60"><span class="val" id="hVigVal">60</span></label>
                <label class="slider">Flicker <input type="range" id="hFlick" min="0" max="100" value="0"><span class="val" id="hFlickVal">0</span></label>
            </div>
        </div>
    </div>
    <video id="video" autoplay playsinline hidden></video>

    <script type="module">
    // MediaPipe face landmark indices
    const L_EYE = [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
    const R_EYE = [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
    const LIPS  = [61,146,91,181,84,17,314,405,321,375,291,308,324,318,402,317,
                   14,87,178,88,95,78,191,80,81,82,13,312,311,310,415];
    const NOSE  = [1,2,98,327,168];

    const video    = document.getElementById('video');
    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    let spaceHeld = false;

    // Ring buffer of per-region crops from the last frames, so each
    // region can be pasted with its own delay (max 30 frames + current).
    const RING = 31;
    const ring = Array.from({ length: RING }, () => {
        const mk = () => {
            const c = document.createElement('canvas');
            return { c, ctx: c.getContext('2d') };
        };
        return { l: mk(), r: mk(), m: mk(), n: mk() };
    });
    let frameNo = 0;

    // ---- Helpers ----

    function bbox(lm, idx, W, H, pad) {
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const i of idx) {
            const px = lm[i].x * W, py = lm[i].y * H;
            if (px < x1) x1 = px;
            if (py < y1) y1 = py;
            if (px > x2) x2 = px;
            if (py > y2) y2 = py;
        }
        const x = Math.max(0, Math.floor(x1 - pad));
        const y = Math.max(0, Math.floor(y1 - pad));
        const w = Math.min(W - x, Math.ceil(x2 - x1 + pad * 2));
        const h = Math.min(H - y, Math.ceil(y2 - y1 + pad * 2));
        return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
    }

    function copyRegion(tc, tctx, src, b) {
        tc.width  = b.w;
        tc.height = b.h;
        tctx.drawImage(src, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
    }

    function pasteRegion(dctx, src, b, fx, fy) {
        dctx.save();
        dctx.beginPath();
        dctx.ellipse(b.cx, b.cy, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
        dctx.clip();
        dctx.translate(b.cx, b.cy);
        dctx.scale(fx ? -1 : 1, fy ? -1 : 1);
        dctx.drawImage(src, -b.w / 2, -b.h / 2, b.w, b.h);
        dctx.restore();
    }

    function drawOverlay(lm, W, H) {
        ctx.lineWidth = 2;

        // Eyes
        ctx.strokeStyle = 'rgba(0,255,120,0.5)';
        for (const idx of [L_EYE, R_EYE]) {
            const b = bbox(lm, idx, W, H, 8);
            ctx.beginPath();
            ctx.ellipse(b.cx, b.cy, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Nose
        ctx.strokeStyle = 'rgba(100,180,255,0.4)';
        const nb = bbox(lm, NOSE, W, H, 5);
        ctx.beginPath();
        ctx.ellipse(nb.cx, nb.cy, nb.w / 2, nb.h / 2, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Mouth
        ctx.strokeStyle = 'rgba(255,100,100,0.5)';
        const mb = bbox(lm, LIPS, W, H, 5);
        ctx.beginPath();
        ctx.ellipse(mb.cx, mb.cy, mb.w / 2, mb.h / 2, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Labels
        ctx.font = '11px system-ui';
        ctx.fillStyle = 'rgba(0,255,120,0.6)';
        const lb = bbox(lm, L_EYE, W, H, 8);
        const rb = bbox(lm, R_EYE, W, H, 8);
        ctx.fillText('L', lb.cx - 4, lb.y - 4);
        ctx.fillText('R', rb.cx - 4, rb.y - 4);
        ctx.fillStyle = 'rgba(100,180,255,0.5)';
        ctx.fillText('nose', nb.cx - 12, nb.y - 4);
        ctx.fillStyle = 'rgba(255,100,100,0.6)';
        ctx.fillText('mouth', mb.cx - 14, mb.y - 4);
    }

    // ---- Horror ----

    const num = id => +document.getElementById(id).value;

    function readHorror() {
        const mode = document.getElementById('horrorMode').value;
        return {
            on:     mode !== 'off',
            black:  mode === 'black' || mode === 'both' || mode === 'leak',
            swap:   mode === 'swap'  || mode === 'both',
            leak:   mode === 'leak',
            flow:   num('lFlow') / 100,
            runny:  num('lSpeed') / 100,
            thick:  num('lThick') / 100,
            gloss:  num('lGloss') / 100,
            dry:    num('lDry'),
            drip:   document.getElementById('lDrip').checked,
            dark:   num('hDark') / 100,
            size:   num('hSize') / 100,
            soft:   num('hSoft') / 100,
            glint:  num('hGlint') / 100,
            socket: num('hSocket') / 100,
            tears:  num('hTears') / 100,
            swapEye:    document.getElementById('hSwapEye').value,
            eyeScale:   num('hEyeScale') / 100,
            mouthScale: num('hMouthScale') / 100,
            feather:    num('hFeather') / 100,
            smudge:     document.getElementById('hSmudge').checked,
            desat:  num('hDesat') / 100,
            tint:   num('hTint') / 100,
            vig:    num('hVig') / 100,
            flick:  num('hFlick') / 100,
        };
    }

    // Outline of the eye opening (the L_EYE / R_EYE lists walk the lid
    // contour in order), its centroid and its extent in canvas pixels.
    function eyeShape(lm, idx, W, H) {
        const pts = idx.map(i => [lm[i].x * W, lm[i].y * H]);
        let cx = 0, cy = 0;
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const [x, y] of pts) {
            cx += x; cy += y;
            x1 = Math.min(x1, x); x2 = Math.max(x2, x);
            y1 = Math.min(y1, y); y2 = Math.max(y2, y);
        }
        cx /= pts.length; cy /= pts.length;
        return { pts, cx, cy, ew: x2 - x1, eh: y2 - y1 };
    }

    function tracePoly(c, pts, dx = 0) {
        c.beginPath();
        pts.forEach(([x, y], k) => k ? c.lineTo(x + dx, y) : c.moveTo(x + dx, y));
        c.closePath();
    }

    // Iris centre (landmarks 468 / 473 in the 478-point model), falling
    // back to the lid centroid if the iris points are missing.
    function irisCentre(lm, e, W, H) {
        if (lm.length < 478) return [e.cx, e.cy];
        let best = null, bestD = Infinity;
        for (const i of [468, 473]) {
            const x = lm[i].x * W, y = lm[i].y * H;
            const d = (x - e.cx) ** 2 + (y - e.cy) ** 2;
            if (d < bestD) { bestD = d; best = [x, y]; }
        }
        return best;
    }

    // Mode 1, drawn before the regions are captured so that the black
    // eyes travel with the crops (lag, swap, flips, eye ↔ mouth).
    function drawBlackEye(lm, idx, W, H, p) {
        const e = eyeShape(lm, idx, W, H);
        const ew = Math.max(e.ew, 1);

        // Sunken sockets: a soft bruise-dark halo around the eye
        if (p.socket > 0) {
            ctx.save();
            ctx.translate(e.cx, e.cy + ew * 0.05);
            ctx.scale(ew * 0.95, ew * 0.7);
            const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
            g.addColorStop(0,   `rgba(30,8,18,${0.8 * p.socket})`);
            g.addColorStop(0.5, `rgba(30,8,18,${0.45 * p.socket})`);
            g.addColorStop(1,   'rgba(30,8,18,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // The eye opening, scaled about its centroid, filled black. The
        // soft edge is a shadow cast from a copy drawn off-canvas, since
        // shadowBlur works in every browser (ctx.filter does not).
        const poly = e.pts.map(([x, y]) =>
            [e.cx + (x - e.cx) * p.size, e.cy + (y - e.cy) * p.size]);
        if (p.dark > 0) {
            const off = W * 4;
            ctx.save();
            ctx.shadowColor = `rgba(0,0,0,${p.dark})`;
            ctx.shadowBlur = p.soft * ew * 0.25;
            ctx.shadowOffsetX = off;
            ctx.fillStyle = '#000';
            tracePoly(ctx, poly, -off);
            ctx.fill();
            ctx.restore();
        }

        // Wet glint: two highlights that follow the gaze, clipped to the
        // opening so they vanish when the eye closes.
        if (p.glint > 0) {
            const [ix, iy] = irisCentre(lm, e, W, H);
            ctx.save();
            tracePoly(ctx, poly);
            ctx.clip();
            const spot = (x, y, r, a) => {
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0,   `rgba(255,255,255,${a})`);
                g.addColorStop(0.4, `rgba(255,255,255,${a * 0.6})`);
                g.addColorStop(1,   'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            };
            spot(ix - ew * 0.09, iy - ew * 0.08, ew * 0.09, 0.9 * p.glint);
            spot(ix + ew * 0.07, iy + ew * 0.04, ew * 0.04, 0.5 * p.glint);
            ctx.restore();
        }
    }

    // Black tears running from the lower lid down the face. They are
    // drawn after pasting, at the eye positions, and grow in over a few
    // seconds whenever horror mode is switched on.
    let tearStart = performance.now();

    function drawTear(lm, idx, lidIdx, seed, W, H, p, now) {
        const e = eyeShape(lm, idx, W, H);
        const ew = Math.max(e.ew, 1);
        const top = lm[10], chin = lm[152];
        let dx = (chin.x - top.x) * W, dy = (chin.y - top.y) * H;
        const faceH = Math.hypot(dx, dy) || 1;
        dx /= faceH; dy /= faceH;
        const nx = -dy, ny = dx;

        const grow = Math.min(1, (now - tearStart) / 4000);
        const len = p.tears * faceH * 0.55 * grow;
        if (len < 1) return;

        const x0 = lm[lidIdx].x * W, y0 = lm[lidIdx].y * H;
        const amp = ew * 0.06;
        const N = 24, left = [], right = [];
        let ex = x0, ey = y0;
        for (let k = 0; k <= N; k++) {
            const s = k / N;
            const along = s * len;
            const lat = (Math.sin(s * 6 + seed) * amp
                       + Math.sin(s * 17 + seed * 3) * amp * 0.3) * s;
            const w = ew * (0.08 * (1 - s) + 0.03) / 2;
            const x = x0 + dx * along + nx * lat;
            const y = y0 + dy * along + ny * lat;
            left.push([x + nx * w, y + ny * w]);
            right.push([x - nx * w, y - ny * w]);
            ex = x; ey = y;
        }
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.92)';
        tracePoly(ctx, left.concat(right.reverse()));
        ctx.fill();
        // Swelling drop at the end of the trail
        const r = ew * 0.05 * (1 + 0.2 * Math.sin(now / 400 + seed));
        ctx.beginPath();
        ctx.ellipse(ex + dx * r * 0.6, ey + dy * r * 0.6, r, r * 1.35,
                    Math.atan2(dy, dx) - Math.PI / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ---- Mode 3: black liquid leaking from the eyes ----
    //
    // The liquid lives on the face mesh: every trail point is stored as a
    // triangle of MediaPipe's tessellation plus barycentric weights, so it
    // sticks to the skin and follows head turns, blinks and an open mouth.
    // Each stream has a head (a bead of volume V) that is fed from the eye
    // for a while, runs straight down the image (gravity) when V is above
    // its pinning threshold, and lays down a trail that costs volume. A
    // head that runs off the face outline hangs at the jaw and sheds
    // falling drops; a head that crosses a hole (eye, open mouth) floats
    // over it in screen space until it lands on skin again.

    let TRIS = null;   // landmark triplets of the face mesh
    let OVAL = null;   // face outline landmarks, in order
    const LIDS = [
        [33, 7, 163, 144, 145, 153, 154, 155, 133],    // lower lid of L_EYE
        [362, 382, 381, 380, 374, 373, 390, 249, 263], // lower lid of R_EYE
    ];
    const leak = { streams: [], drops: [], spawn: [0, 0], lastT: 0 };

    function resetLeak() {
        leak.streams.length = 0;
        leak.drops.length = 0;
        leak.spawn = [0, 0];
    }

    // This frame's mesh in canvas pixels. `front` is the winding sign of
    // camera-facing triangles (it flips with the mirror view); the scale
    // s is the distance between the eye centres.
    function meshFrame(lm, W, H) {
        const P = lm.map(p => [p.x * W, p.y * H, p.z * W]);
        const n = TRIS.length / 3;
        const area = new Float32Array(n);
        const slope = new Float32Array(n * 2);
        let sum = 0;
        for (let t = 0; t < n; t++) {
            const a = P[TRIS[t * 3]], b = P[TRIS[t * 3 + 1]], c = P[TRIS[t * 3 + 2]];
            const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
            const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
            area[t] = ux * vy - uy * vx;
            sum += area[t];
            // Surface normal, turned towards the camera (MediaPipe z is
            // smaller nearer the camera). Gravity (0,1,0) projected onto
            // the skin's tangent plane, seen in the image, is
            // (−nx·ny, 1 − ny²): flow bends around the nose and cheeks.
            let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
            const nl = Math.hypot(nx, ny, nz) || 1;
            if (nz > 0) { nx = -nx; ny = -ny; }
            nx /= nl; ny /= nl;
            slope[t * 2] = -nx * ny;
            slope[t * 2 + 1] = 1 - ny * ny;
        }
        const el = eyeShape(lm, L_EYE, W, H), er = eyeShape(lm, R_EYE, W, H);
        const s = Math.max(10, Math.hypot(er.cx - el.cx, er.cy - el.cy));
        return { P, area, slope, front: Math.sign(sum) || 1, s, oval: OVAL.map(i => P[i]) };
    }

    function facing(m, t) { return m.area[t] * m.front > 0; }

    function bary(m, t, x, y) {
        const a = m.P[TRIS[t * 3]], b = m.P[TRIS[t * 3 + 1]], c = m.P[TRIS[t * 3 + 2]];
        const d = m.area[t];
        const w0 = ((b[0] - x) * (c[1] - y) - (b[1] - y) * (c[0] - x)) / d;
        const w1 = ((c[0] - x) * (a[1] - y) - (c[1] - y) * (a[0] - x)) / d;
        const w2 = 1 - w0 - w1;
        const e = -1e-4;
        return (w0 >= e && w1 >= e && w2 >= e) ? { t, w0, w1, w2 } : null;
    }

    // Find the camera-facing triangle under (x, y); try the hint first.
    function locate(m, x, y, hint) {
        if (hint != null && facing(m, hint)) {
            const r = bary(m, hint, x, y);
            if (r) return r;
        }
        const n = m.area.length;
        for (let t = 0; t < n; t++) {
            if (!facing(m, t)) continue;
            const r = bary(m, t, x, y);
            if (r) return r;
        }
        return null;
    }

    function place(m, a) {
        const P = m.P, i = a.t * 3;
        const A = P[TRIS[i]], B = P[TRIS[i + 1]], C = P[TRIS[i + 2]];
        return [a.w0 * A[0] + a.w1 * B[0] + a.w2 * C[0],
                a.w0 * A[1] + a.w1 * B[1] + a.w2 * C[1]];
    }

    function insidePoly(poly, x, y) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const [xi, yi] = poly[i], [xj, yj] = poly[j];
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
        }
        return inside;
    }

    // Widths are stored relative to the face scale s, before Thickness.
    const trailW = V => 0.022 + 0.038 * Math.sqrt(Math.max(V, 0));
    const headR  = V => 0.024 + 0.032 * Math.sqrt(Math.max(V, 0));

    function headPos(m, h) {
        return h.anchor ? place(m, h.anchor) : [h.fx, h.fy];
    }

    function stepLeak(m, W, H, p, now) {
        const dt = Math.min(0.05, Math.max(0, (now - leak.lastT) / 1000));
        leak.lastT = now;
        const s = m.s;

        // New streams appear along the lower lids
        const active = leak.streams.filter(st => st.supply > 0).length;
        for (let eye = 0; eye < 2; eye++) {
            leak.spawn[eye] += dt * (0.08 + 0.5 * p.flow) * (p.flow > 0 ? 1 : 0);
            if (leak.spawn[eye] < 1) continue;
            leak.spawn[eye] -= 1 + Math.random() * 0.5;
            if (active >= 3 + 8 * p.flow) continue;
            const lid = LIDS[eye];
            const k = lid[Math.floor(Math.random() * lid.length)];
            const x = m.P[k][0], y = m.P[k][1] + s * 0.03;
            const anchor = locate(m, x, y, null);
            if (!anchor) continue;
            leak.streams.push({
                eye,
                pts: [{ ...anchor, w: trailW(0.4) }],
                head: { anchor, fx: x, fy: y, V: 0.4, pin: 0.3, wob: 0, hanging: false, alive: true, dir: [0, 1] },
                supply: 2 + Math.random() * 7,
                Q: 0.15 + 0.45 * p.flow,
                seed: Math.random() * 100,
                lastGrow: now,
                alpha: 1,
            });
        }
        while (leak.streams.length > 80) leak.streams.shift();

        // Wet tracks on screen: new drips are drawn into them
        const wet = [];
        for (const st of leak.streams) {
            for (let i = 0; i < st.pts.length; i += 2) {
                const [x, y] = place(m, st.pts[i]);
                wet.push(x, y, st);
            }
        }
        const R = s * 0.09;

        for (const st of leak.streams) {
            const h = st.head;
            if (st.supply > 0) {
                h.V += st.Q * dt;
                st.supply -= dt;
                st.lastGrow = now;
            }
            if (!h.alive) continue;

            if (h.hanging) {
                // Bead hanging under the jaw: shed a drop when heavy enough
                if (p.drip && h.V > 0.7) {
                    const [x, y] = headPos(m, h);
                    leak.drops.push({ x, y: y + headR(h.V) * s * p.thick, vy: 0, V: h.V * 0.6 });
                    h.V *= 0.4;
                }
                h.V = Math.min(h.V, 1.6);
            } else if (h.V > h.pin * (h.onWet ? 0.5 : 1)) {
                h.wob += (Math.random() - 0.5) * 4 * dt;
                h.wob *= 1 - 0.6 * dt;
                h.wob = Math.max(-0.5, Math.min(0.5, h.wob));
                // Downhill on the skin under the head, plus a meander
                let gx = 0, gy = 1;
                if (h.anchor) {
                    gx = m.slope[h.anchor.t * 2];
                    gy = Math.max(0.15, m.slope[h.anchor.t * 2 + 1]);
                }
                const steep = Math.hypot(gx, gy);
                const [x0, y0] = headPos(m, h);
                let ex = gx / steep + h.wob, ey = gy / steep;
                // Pulled sideways into the nearest wet track just below,
                // where it also runs with less pinning
                let best = R * R, bx = 0;
                for (let i = 0; i < wet.length; i += 3) {
                    if (wet[i + 2] === st) continue;
                    const ddx = wet[i] - x0, ddy = wet[i + 1] - y0;
                    if (ddy < 0 || ddy > R) continue;
                    const d2 = ddx * ddx + ddy * ddy;
                    if (d2 < best) { best = d2; bx = ddx; }
                }
                h.onWet = best < R * R;
                if (h.onWet) ex += 1.5 * bx / R;
                const len = Math.hypot(ex, ey);
                const dx = ex / len, dy = ey / len;
                const speed = Math.min(s * 1.2,
                    s * 0.45 * p.runny * (h.V - h.pin * (h.onWet ? 0.5 : 1)) * Math.max(0.35, steep));
                const x = x0 + dx * speed * dt, y = y0 + dy * speed * dt;
                h.V -= 0.3 * (speed * dt) / s;
                h.dir = [dx, dy];
                st.lastGrow = now;

                const a = locate(m, x, y, h.anchor ? h.anchor.t : null);
                if (a) {
                    h.anchor = a;
                    const last = st.pts[st.pts.length - 1];
                    const [lx, ly] = place(m, last);
                    if (Math.hypot(x - lx, y - ly) > Math.max(1.5, s * 0.012) && st.pts.length < 600) {
                        st.pts.push({ ...a, w: trailW(h.V) });
                    }
                } else if (insidePoly(m.oval, x, y)) {
                    // Over a hole (eye or open mouth): float across it
                    h.anchor = null;
                    h.fx = x; h.fy = y;
                } else {
                    h.hanging = true;   // ran off the face: stay at the edge
                }
            } else {
                // Pinned: soaks slowly into its trail, then may move again
                h.V -= 0.02 * dt;
                h.pin = 0.22 + Math.random() * 0.16;
            }
            if (h.V <= 0.04 && st.supply <= 0) h.alive = false;
        }

        // Drying: a stream that hasn't grown for `dry` seconds fades out
        for (const st of leak.streams) {
            const idle = (now - st.lastGrow) / 1000;
            if (idle > p.dry) st.alpha = Math.max(0, 1 - (idle - p.dry) / 4);
        }
        leak.streams = leak.streams.filter(st => st.alpha > 0);

        const g = s * 14;
        for (const d of leak.drops) {
            d.vy += g * dt;
            d.y += d.vy * dt;
        }
        leak.drops = leak.drops.filter(d => d.y < H + s);
    }

    function glossSpot(x, y, r, a) {
        if (a <= 0) return;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(255,255,255,${a})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    function drawLeak(m, p) {
        const s = m.s, k = s * p.thick;
        const LX = -0.6, LY = -0.8;   // light from the upper left
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // Liquid welling up along each lower lid while that eye is leaking
        for (let eye = 0; eye < 2; eye++) {
            const fed = leak.streams.filter(st => st.eye === eye && st.supply > 0).length;
            const level = Math.min(1, 0.35 * fed);
            if (level <= 0) continue;
            ctx.strokeStyle = `rgba(4,2,3,${0.9 * level + 0.1})`;
            ctx.lineWidth = s * 0.045 * p.thick * (0.5 + 0.5 * level);
            ctx.beginPath();
            LIDS[eye].forEach((i, j) => {
                const [x, y] = m.P[i];
                const yy = y + s * 0.012;
                j ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
            });
            ctx.stroke();
        }

        for (const st of leak.streams) {
            // Screen points plus the live head, split into visible runs
            const q = st.pts.map(a => [...place(m, a), a.w * k, facing(m, a.t)]);
            const h = st.head;
            if (h.alive && h.anchor) q.push([...place(m, h.anchor), trailW(h.V) * k, facing(m, h.anchor.t)]);
            const runs = [];
            let run = [];
            for (const pt of q) {
                if (pt[3]) run.push(pt);
                else { if (run.length > 1) runs.push(run); run = []; }
            }
            if (run.length > 1) runs.push(run);

            for (const r of runs) {
                const left = [], right = [], shine = [];
                for (let i = 0; i < r.length; i++) {
                    const a = r[Math.max(0, i - 1)], b = r[Math.min(r.length - 1, i + 1)];
                    let tx = b[0] - a[0], ty = b[1] - a[1];
                    const tl = Math.hypot(tx, ty) || 1;
                    tx /= tl; ty /= tl;
                    let nx = -ty, ny = tx;
                    const w = r[i][2] / 2;
                    left.push([r[i][0] + nx * w, r[i][1] + ny * w]);
                    right.push([r[i][0] - nx * w, r[i][1] - ny * w]);
                    if (nx * LX + ny * LY < 0) { nx = -nx; ny = -ny; }
                    shine.push([r[i][0] + nx * w * 0.45, r[i][1] + ny * w * 0.45]);
                }
                ctx.fillStyle = `rgba(4,2,3,${0.96 * st.alpha})`;
                tracePoly(ctx, left.concat(right.reverse()));
                ctx.fill();
                // Rounded start where the stream leaves the lid
                ctx.beginPath();
                ctx.arc(r[0][0], r[0][1], r[0][2] / 2, 0, Math.PI * 2);
                ctx.fill();

                const avgW = r.reduce((t, v) => t + v[2], 0) / r.length;
                if (p.gloss > 0 && avgW > 3) {
                    ctx.strokeStyle = `rgba(255,255,255,${0.22 * p.gloss * st.alpha})`;
                    ctx.lineWidth = avgW * 0.14;
                    ctx.beginPath();
                    shine.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
                    ctx.stroke();
                }
            }

            // The head: a bead stretched along its motion, longer when hanging
            if (h.alive && h.V > 0.04 && (!h.anchor || facing(m, h.anchor.t))) {
                const [x, y] = headPos(m, h);
                const r = headR(h.V) * k;
                const stretch = h.hanging ? 1.3 + 0.5 * Math.min(1, h.V) : 1.2;
                const ang = h.hanging ? 0 : Math.atan2(h.dir[0], h.dir[1]);
                ctx.fillStyle = `rgba(4,2,3,${0.97 * st.alpha})`;
                ctx.beginPath();
                ctx.ellipse(x, y + r * (stretch - 1) * 0.6, r, r * stretch, -ang, 0, Math.PI * 2);
                ctx.fill();
                glossSpot(x - r * 0.35, y - r * 0.2, r * 0.45, 0.7 * p.gloss * st.alpha);
            }
        }

        for (const d of leak.drops) {
            const r = headR(d.V) * k;
            const stretch = 1 + Math.min(1.5, d.vy / (s * 6));
            ctx.fillStyle = 'rgba(4,2,3,0.97)';
            ctx.beginPath();
            ctx.ellipse(d.x, d.y, r / Math.sqrt(stretch), r * stretch, 0, 0, Math.PI * 2);
            ctx.fill();
            glossSpot(d.x - r * 0.3, d.y - r * 0.3, r * 0.4, 0.7 * p.gloss);
        }
        ctx.restore();
    }

    // Paste src into a w×h box centred on (cx, cy), masked by an ellipse
    // whose edge fades over `feather` (0 = hard, 1 = fades from centre).
    const scratch = document.createElement('canvas');
    const sctx = scratch.getContext('2d');

    function pasteFeather(dctx, src, cx, cy, w, h, fx, fy, feather) {
        w = Math.max(1, Math.round(w));
        h = Math.max(1, Math.round(h));
        scratch.width = w;   // also clears and resets state
        scratch.height = h;
        sctx.save();
        sctx.translate(w / 2, h / 2);
        sctx.scale(fx ? -1 : 1, fy ? -1 : 1);
        sctx.drawImage(src, -w / 2, -h / 2, w, h);
        sctx.restore();
        sctx.globalCompositeOperation = 'destination-in';
        sctx.translate(w / 2, h / 2);
        sctx.scale(w / 2, h / 2);
        const g = sctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0, '#000');
        g.addColorStop(Math.min(0.995, Math.max(0, 1 - feather)), '#000');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.fillStyle = g;
        sctx.fillRect(-1, -1, 2, 2);
        dctx.drawImage(scratch, Math.round(cx - w / 2), Math.round(cy - h / 2));
    }

    // Skin tone around a region: samples a ring just outside its box and
    // averages the 40th–90th brightness percentile, which skips brows,
    // lashes and shadows.
    function skinTone(b, W, H) {
        const rx = b.w * 0.6, ry = b.h * 0.6;
        const x0 = Math.max(0, Math.floor(b.cx - rx - 1));
        const y0 = Math.max(0, Math.floor(b.cy - ry - 1));
        const x1 = Math.min(W, Math.ceil(b.cx + rx + 1));
        const y1 = Math.min(H, Math.ceil(b.cy + ry + 1));
        const bw = x1 - x0, bh = y1 - y0;
        if (bw < 2 || bh < 2) return null;
        const d = ctx.getImageData(x0, y0, bw, bh).data;
        const s = [];
        for (let k = 0; k < 48; k++) {
            const a = k / 48 * Math.PI * 2;
            const x = Math.min(bw - 1, Math.max(0, Math.round(b.cx + Math.cos(a) * rx - x0)));
            const y = Math.min(bh - 1, Math.max(0, Math.round(b.cy + Math.sin(a) * ry - y0)));
            const o = (y * bw + x) * 4;
            s.push([d[o], d[o + 1], d[o + 2], d[o] * 0.3 + d[o + 1] * 0.59 + d[o + 2] * 0.11]);
        }
        s.sort((p, q) => p[3] - q[3]);
        const pick = s.slice(Math.floor(s.length * 0.4), Math.ceil(s.length * 0.9));
        const avg = [0, 1, 2].map(c => Math.round(pick.reduce((t, v) => t + v[c], 0) / pick.length));
        return `${avg[0]},${avg[1]},${avg[2]}`;
    }

    function fillSkin(b, rgb) {
        if (!rgb) return;
        ctx.save();
        ctx.translate(b.cx, b.cy);
        ctx.scale(b.w / 2, b.h / 2);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0,    `rgba(${rgb},1)`);
        g.addColorStop(0.55, `rgba(${rgb},1)`);
        g.addColorStop(1,    `rgba(${rgb},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
    }

    // Whole-frame grade: desaturate, sickly tint, vignette, flicker.
    let flickLevel = 0;

    function drawAtmosphere(W, H, p) {
        ctx.save();
        if (p.desat > 0) {
            ctx.globalCompositeOperation = 'saturation';
            ctx.fillStyle = `rgba(128,128,128,${p.desat})`;
            ctx.fillRect(0, 0, W, H);
        }
        if (p.tint > 0) {
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = `rgba(170,205,180,${p.tint})`;
            ctx.fillRect(0, 0, W, H);
        }
        ctx.globalCompositeOperation = 'source-over';
        if (p.vig > 0) {
            const R = Math.hypot(W, H) / 2;
            const g = ctx.createRadialGradient(W / 2, H / 2, R * 0.35, W / 2, H / 2, R);
            g.addColorStop(0, 'rgba(0,0,0,0)');
            g.addColorStop(1, `rgba(0,0,0,${Math.min(1, p.vig * 1.1)})`);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
        }
        if (p.flick > 0) {
            // A failing bulb: low-passed jitter plus occasional dropouts
            flickLevel = flickLevel * 0.7 + Math.random() * 0.3;
            let a = flickLevel * 0.35 * p.flick;
            if (Math.random() < 0.04 * p.flick) a = 0.5 + 0.4 * p.flick;
            ctx.fillStyle = `rgba(0,0,0,${a})`;
            ctx.fillRect(0, 0, W, H);
        }
        ctx.restore();
    }

    // ---- Init ----

    try {
        const { FaceLandmarker, FilesetResolver } = await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        );

        // Face mesh triangles: the tessellation lists each triangle as
        // three consecutive edges a→b, b→c, c→a.
        const tess = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
        TRIS = new Int32Array(tess.length);
        tess.forEach((e, i) => { TRIS[i] = e.start; });
        OVAL = FaceLandmarker.FACE_LANDMARKS_FACE_OVAL.map(e => e.start);

        const resolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        const faceLandmarker = await FaceLandmarker.createFromOptions(resolver, {
            baseOptions: {
                modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            numFaces: 1
        });

        statusEl.textContent = "Starting camera...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
        });
        video.srcObject = stream;
        await video.play();

        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        document.querySelector('.stage').style.setProperty(
            '--ar', `${video.videoWidth} / ${video.videoHeight}`);
        statusEl.style.display = 'none';

        // ---- Render loop ----

        let lastT = -1;

        function loop() {
            if (video.currentTime !== lastT) {
                lastT = video.currentTime;
                const W = canvas.width, H = canvas.height;
                const hp = readHorror();

                // Draw video, mirrored unless camera view is selected
                const mirror = document.getElementById('mirrorView').checked;
                ctx.save();
                if (mirror) {
                    ctx.translate(W, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, W, H);
                ctx.restore();

                // Detect face
                try {
                    const res = faceLandmarker.detectForVideo(video, performance.now());
                    if (res.faceLandmarks?.length > 0) {
                        // Landmarks must match the canvas orientation
                        const lm = res.faceLandmarks[0].map(p => ({
                            x: mirror ? 1 - p.x : p.x,
                            y: p.y,
                            z: p.z
                        }));

                        // Read settings
                        const eSrc  = document.getElementById('eyeSource').value;
                        const eSwap = document.getElementById('eyeSwap').checked;
                        const eFX   = document.getElementById('eyeFlipX').checked;
                        const eFY   = document.getElementById('eyeFlipY').checked;
                        const mFX   = document.getElementById('mouthFlipX').checked;
                        const mFY   = document.getElementById('mouthFlipY').checked;
                        const nFX   = document.getElementById('noseFlipX').checked;
                        const dL    = +document.getElementById('delayL').value;
                        const dR    = +document.getElementById('delayR').value;
                        const dM    = +document.getElementById('delayM').value;

                        const ePad = 18;
                        const lb = bbox(lm, L_EYE, W, H, ePad);
                        const rb = bbox(lm, R_EYE, W, H, ePad);
                        const mb = bbox(lm, LIPS, W, H, 12);
                        const nb = bbox(lm, NOSE, W, H, 10);

                        // Horror mode 1 goes into the frame before capture,
                        // so the black eyes move with every crop.
                        if (hp.black && !spaceHeld) {
                            drawBlackEye(lm, L_EYE, W, H, hp);
                            drawBlackEye(lm, R_EYE, W, H, hp);
                        }

                        // Capture this frame's regions before pasting anything
                        const slot = ring[frameNo % RING];
                        copyRegion(slot.l.c, slot.l.ctx, canvas, lb);
                        copyRegion(slot.r.c, slot.r.ctx, canvas, rb);
                        copyRegion(slot.m.c, slot.m.ctx, canvas, mb);
                        copyRegion(slot.n.c, slot.n.ctx, canvas, nb);

                        // Paste delayed content at the current positions
                        // (clamped while history is still filling up)
                        const past = d => ring[Math.max(0, frameNo - d) % RING];
                        const srcL = past(dL), srcR = past(dR), srcM = past(dM);

                        // Holding Space shows the original camera feed:
                        // keep capturing history, but skip all pasting.
                        if (!spaceHeld) {
                            // Nose first so the eyes and mouth draw on top of it.
                            // No lag slider; flip the current frame's crop.
                            if (nFX) {
                                pasteRegion(ctx, slot.n.c, nb, true, false);
                            }

                            // Pick which eye feeds each position: a single
                            // source eye for both, or (with swap) the opposite
                            const leftCrop  = eSrc === 'left'  ? srcL.l
                                            : eSrc === 'right' ? srcL.r
                                            : eSwap ? srcL.r : srcL.l;
                            const rightCrop = eSrc === 'left'  ? srcR.l
                                            : eSrc === 'right' ? srcR.r
                                            : eSwap ? srcR.l : srcR.r;
                            if (!hp.swap) {
                                pasteRegion(ctx, leftCrop.c, lb, eFX, eFY);
                                pasteRegion(ctx, rightCrop.c, rb, eFX, eFY);
                                pasteRegion(ctx, srcM.m.c, mb, mFX, mFY);
                            } else {
                                // Horror mode 2: the chosen eye(s) and the
                                // mouth trade places, each scaled and
                                // pasted with a feathered edge.
                                const useL = hp.swapEye !== 'right';
                                const useR = hp.swapEye !== 'left';
                                const vacated = [mb];
                                if (useL) vacated.push(lb);
                                if (useR) vacated.push(rb);
                                if (hp.smudge) {
                                    // Sample every tone first, then paint,
                                    // so one patch can't tint another.
                                    const tones = vacated.map(b => skinTone(b, W, H));
                                    vacated.forEach((b, k) => fillSkin(b, tones[k]));
                                }
                                if (!useL) pasteRegion(ctx, leftCrop.c, lb, eFX, eFY);
                                if (!useR) pasteRegion(ctx, rightCrop.c, rb, eFX, eFY);

                                const f = hp.feather;
                                const mw = mb.w * hp.mouthScale, mh = mb.h * hp.mouthScale;
                                for (const [use, b] of [[useL, lb], [useR, rb]]) {
                                    if (use) pasteFeather(ctx, srcM.m.c, b.cx, b.cy, mw, mh, mFX, mFY, f);
                                }

                                const eyes = [];
                                if (useL) eyes.push([leftCrop.c, lb]);
                                if (useR) eyes.push([rightCrop.c, rb]);
                                // Keep the eyes' left-to-right order at the mouth
                                eyes.sort((a, b) => a[1].cx - b[1].cx);
                                eyes.forEach(([crop, b], k) => {
                                    const w = b.w * hp.eyeScale, h = b.h * hp.eyeScale;
                                    const x = mb.cx + (k - (eyes.length - 1) / 2) * w * 0.85;
                                    pasteFeather(ctx, crop, x, mb.cy, w, h, eFX, eFY, f);
                                });
                            }

                            if (hp.black && hp.tears > 0) {
                                const now = performance.now();
                                drawTear(lm, L_EYE, 145, 1.3, W, H, hp, now);
                                drawTear(lm, R_EYE, 374, 4.1, W, H, hp, now);
                            }
                        }

                        // Horror mode 3: the liquid keeps flowing while
                        // Space is held, it just isn't drawn.
                        if (hp.leak && TRIS) {
                            const m = meshFrame(lm, W, H);
                            stepLeak(m, W, H, hp, performance.now());
                            if (!spaceHeld) drawLeak(m, hp);
                        }

                        frameNo++;

                        // ---- Overlay ----
                        if (document.getElementById('showOverlay').checked && !spaceHeld) {
                            drawOverlay(lm, W, H);
                        }
                    }
                } catch (_) {
                    // Face detection can fail when face is partially visible;
                    // ignore and keep showing the plain camera feed.
                }

                if (hp.on && !spaceHeld) drawAtmosphere(W, H, hp);
            }
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

    } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        console.error(err);
    }

    // ---- Slider readouts ----

    for (const el of document.querySelectorAll('label.slider input')) {
        const val = document.getElementById(el.id + 'Val');
        el.addEventListener('input', () => { val.textContent = el.value; });
    }

    // ---- Horror panel: show the parameters of the active mode ----

    const horrorMode = document.getElementById('horrorMode');
    function syncHorror() {
        const m = horrorMode.value;
        document.getElementById('blackGroup').hidden = !(m === 'black' || m === 'both' || m === 'leak');
        document.getElementById('leakGroup').hidden  = m !== 'leak';
        resetLeak();
        leak.lastT = performance.now();
        document.getElementById('swapGroup').hidden  = !(m === 'swap'  || m === 'both');
        document.getElementById('atmoGroup').hidden  = m === 'off';
        tearStart = performance.now();
    }
    horrorMode.addEventListener('change', syncHorror);
    document.getElementById('lWipe').addEventListener('click', resetLeak);
    document.getElementById('hTears').addEventListener('input', e => {
        // Let fresh tears run down again rather than appear at full length
        if (+e.target.value === 0) tearStart = performance.now();
    });
    syncHorror();

    // ---- Keyboard ----

    document.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); spaceHeld = true; }
    });
    document.addEventListener('keyup', e => {
        if (e.code === 'Space') spaceHeld = false;
    });
    </script>
</body>
</html>
