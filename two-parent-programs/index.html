<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Parent Programs</title>
</head>
<body>
<script id="shared-code">
// Simulation logic: no DOM. test.mjs runs TPTests in Node.
const TP = (() => {
  const GRID = 64;
  const START = [0x47, 0x45];          // "GE"
  const END = [0x4e, 0x44];            // "ND"
  const TOLERANCE = 8;                 // a lock binds a key when they differ by at most this
  const T = { MIX: 0, BODY: 1, EYE: 2, NOSE: 3, FORAGE: 4, MATE: 5, FLEE: 6 };
  const SETTINGS = { 0: 3, 1: 3, 2: 2, 3: 2, 4: 2, 5: 3, 6: 2 };
  const TYPE_NAMES = ['mix', 'body', 'eye', 'nose', 'forage', 'mate', 'flee'];
  const DEFAULT_MIX = { share: 128, cuts: 1, rate: 4 };
  const DEFAULT_BODY = { size: 64, speed: 64, metab: 128 };

  const isStart = (b, i) => b[i] === START[0] && b[i + 1] === START[1];
  const isEnd = (b, i) => b[i] === END[0] && b[i + 1] === END[1];

  // Read the genes of a genome. Everything outside GE...ND is junk.
  function parse(bytes) {
    const genes = [];
    let i = 0, codingBytes = 0;
    const n = bytes.length;
    while (i < n - 1) {
      if (!isStart(bytes, i)) { i++; continue; }
      const start = i;
      let j = i + 2, end = -1, next = -1;
      while (j < n - 1) {
        if (isEnd(bytes, j)) { end = j; break; }
        if (isStart(bytes, j)) { next = j; break; }
        j++;
      }
      if (end < 0) {
        // no end marker before the next gene or the end of the genome: broken
        const stop = next >= 0 ? next : n;
        genes.push({ type: stop > start + 2 ? bytes[start + 2] >> 4 : null, typeByte: bytes[start + 2] ?? null, settings: [...bytes.subarray(start + 3, stop)], start, end: stop, broken: true });
        i = stop;
        continue;
      }
      const typeByte = end > start + 2 ? bytes[start + 2] : null;
      const type = typeByte === null ? null : typeByte >> 4;
      const settings = [...bytes.subarray(start + 3, end)];
      const broken = type === null || !(type in SETTINGS) || settings.length !== SETTINGS[type];
      genes.push({ type, typeByte, settings, start, end: end + 2, broken });
      if (!broken) codingBytes += end + 2 - start;
      i = end + 2;
    }
    return { genes, codingBytes };
  }

  // Build the creature that a genome describes.
  function express(bytes) {
    const { genes } = parse(bytes);
    const ph = { mix: null, body: null, eyes: [], noses: [], rules: [], brokenGenes: 0 };
    genes.forEach((g, geneIndex) => {
      if (g.broken) { ph.brokenGenes++; return; }
      const s = g.settings;
      switch (g.type) {
        case T.MIX: if (!ph.mix) ph.mix = { share: s[0], cuts: s[1], rate: s[2] }; break;
        case T.BODY: if (!ph.body) ph.body = { size: s[0], speed: s[1], metab: s[2] }; break;
        case T.EYE: ph.eyes.push({ range: s[0], key: s[1], geneIndex }); break;
        case T.NOSE: ph.noses.push({ range: s[0], key: s[1], geneIndex }); break;
        case T.FORAGE: ph.rules.push({ kind: 'forage', a: s[0], lock: s[1], geneIndex }); break;
        case T.MATE: ph.rules.push({ kind: 'mate', a: s[0], b: s[1], lock: s[2], geneIndex }); break;
        case T.FLEE: ph.rules.push({ kind: 'flee', a: s[0], lock: s[1], geneIndex }); break;
      }
    });
    ph.mix = ph.mix || { ...DEFAULT_MIX };
    ph.body = ph.body || { ...DEFAULT_BODY };
    return ph;
  }

  // The sensor a rule binds to: the closest key within the tolerance, or null.
  function bindSensor(ph, rule) {
    const pool = rule.kind === 'forage' ? ph.noses : ph.eyes;
    let best = null;
    for (const s of pool) {
      const d = Math.abs(s.key - rule.lock);
      if (d <= TOLERANCE && (!best || d < Math.abs(best.key - rule.lock))) best = s;
    }
    return best;
  }

  // The fit check: every rule must bind a sensor.
  function fits(ph) {
    const checks = ph.rules.map((rule) => {
      const s = bindSensor(ph, rule);
      return { rule, lock: rule.lock, key: s ? s.key : null, ok: !!s };
    });
    return { ok: checks.every((c) => c.ok), checks };
  }

  // ---------- reproduction ----------

  // Gentle mutation. Each byte is hit with probability rate/2000. A hit in junk changes that byte freely.
  // A hit inside a gene nudges a setting by 1..3 (most often), flips the silent low bits of the type byte,
  // or rarely duplicates the gene, deletes it, or damages one of its marker bytes.
  function mutate(bytes, origin, rate, rand) {
    const b = [...bytes], o = [...origin];
    const p = rate / 2000, hits = [], mutations = [];
    for (let i = 0; i < b.length; i++) if (rand() < p) hits.push(i);
    for (let h = hits.length - 1; h >= 0; h--) {
      const i = hits[h];
      if (i >= b.length) continue;
      const g = parse(Uint8Array.from(b)).genes.find((x) => !x.broken && i >= x.start && i < x.end);
      if (!g) {
        const from = b[i];
        b[i] = Math.floor(rand() * 256);
        o[i] = 2;
        mutations.push({ offset: i, kind: 'junk', from, to: b[i] });
        continue;
      }
      const r = rand() * 100;
      if (r < 75) {
        const k = g.start + 3 + Math.floor(rand() * g.settings.length), from = b[k];
        const d = (1 + Math.floor(rand() * 3)) * (rand() < 0.5 ? -1 : 1);
        const to = from + d >= 0 && from + d <= 255 ? from + d : from - d;
        b[k] = to; o[k] = 2;
        mutations.push({ offset: k, kind: 'nudge', from, to });
      } else if (r < 85) {
        const k = g.start + 2, from = b[k];
        b[k] = from ^ (1 + Math.floor(rand() * 15)); o[k] = 2;
        mutations.push({ offset: k, kind: 'silent', from, to: b[k] });
      } else if (r < 92) {
        const copy = b.slice(g.start, g.end);
        b.splice(g.end, 0, ...copy);
        o.splice(g.end, 0, ...copy.map(() => 2));
        mutations.push({ offset: g.end, kind: 'duplicate', length: copy.length });
      } else if (r < 98) {
        b.splice(g.start, g.end - g.start);
        o.splice(g.start, g.end - g.start);
        mutations.push({ offset: g.start, kind: 'delete', length: g.end - g.start });
      } else {
        const k = [g.start, g.start + 1, g.end - 2, g.end - 1][Math.floor(rand() * 4)], from = b[k];
        b[k] = (from + 1 + Math.floor(rand() * 255)) & 255; o[k] = 2;
        mutations.push({ offset: k, kind: 'marker', from, to: b[k] });
      }
    }
    return { bytes: Uint8Array.from(b), origin: Uint8Array.from(o), mutations };
  }

  // A genome as segments: each gene together with the junk before it, keyed by (type, occurrence).
  function segments(bytes) {
    const { genes } = parse(bytes);
    const segs = [], count = {};
    let prev = 0;
    for (const g of genes) {
      const key = g.broken ? 'x' : String(g.type);
      const occ = (count[key] = (count[key] ?? -1) + 1);
      segs.push({ key: key + '#' + occ, type: g.broken ? null : g.type, occ, from: prev, to: g.end });
      prev = g.end;
    }
    return { segs, tail: [prev, bytes.length] };
  }

  function setMix(bytes, mix) {
    const g = parse(bytes).genes.find((x) => !x.broken && x.type === T.MIX);
    if (g) { bytes[g.start + 3] = mix.share; bytes[g.start + 4] = mix.cuts; bytes[g.start + 5] = mix.rate; }
  }

  // Life's way: genes are lined up by type, and each slot comes from one parent.
  // A coin flip picks whose mix gene rules the mixing; that parent is "a" and passes its mix gene on.
  function mixAligned(A, B, rand, opts = { mixEvolves: true }) {
    const parents = [A, B], S = parents.map(segments);
    const usedMixOf = rand() < 0.5 ? 0 : 1, other = 1 - usedMixOf;
    const mix = express(parents[usedMixOf]).mix;
    const keys = S[0].segs.map((x) => x.key);
    for (const x of S[1].segs) if (!keys.includes(x.key)) keys.push(x.key);
    const n = keys.length, share = mix.share / 255;
    const side = new Array(n);
    if (mix.cuts === 0) {
      for (let i = 0; i < n; i++) side[i] = rand() < share ? usedMixOf : other;
    } else {
      const bounds = [];
      for (let i = 1; i < n; i++) bounds.push(i);
      const cuts = new Set();
      while (cuts.size < Math.min(mix.cuts, bounds.length)) cuts.add(bounds[Math.floor(rand() * bounds.length)]);
      let cur = rand() < share ? usedMixOf : other;
      for (let i = 0; i < n; i++) { if (cuts.has(i)) cur = 1 - cur; side[i] = cur; }
    }
    const bytes = [], origin = [], plan = [];
    keys.forEach((key, i) => {
      let from = side[i];
      const [kind] = key.split('#');
      if (key === T.MIX + '#0' && S[usedMixOf].segs.some((x) => x.key === key)) from = usedMixOf;
      const seg = S[from].segs.find((x) => x.key === key);
      const any = S[0].segs.find((x) => x.key === key) || S[1].segs.find((x) => x.key === key);
      plan.push({ type: kind === 'x' ? null : any.type, occurrence: any.occ, from: seg ? from : null });
      if (!seg) return;
      for (let k = seg.from; k < seg.to; k++) { bytes.push(parents[from][k]); origin.push(from); }
    });
    for (let k = S[0].tail[0]; k < S[0].tail[1]; k++) { bytes.push(A[k]); origin.push(0); }
    const rate = opts.mixEvolves === false ? DEFAULT_MIX.rate : mix.rate;
    const m = mutate(Uint8Array.from(bytes), Uint8Array.from(origin), rate, rand);
    if (opts.mixEvolves === false) setMix(m.bytes, DEFAULT_MIX);
    return { bytes: m.bytes, origin: m.origin, usedMixOf, plan, mutations: m.mutations };
  }

  // Naive splicing: the front of A glued to the back of B, cut anywhere, even inside a gene.
  function mixNaive(A, B, rand) {
    const cutA = Math.floor(rand() * (A.length + 1)), cutB = Math.floor(rand() * (B.length + 1));
    const bytes = Uint8Array.from([...A.subarray(0, cutA), ...B.subarray(cutB)]);
    const origin = Uint8Array.from([...new Array(cutA).fill(0), ...new Array(B.length - cutB).fill(1)]);
    const m = mutate(bytes, origin, DEFAULT_MIX.rate, rand);
    return { bytes: m.bytes, origin: m.origin, usedMixOf: null, plan: [], cutA, cutB, mutations: m.mutations };
  }

  // One conception: two parents, one child, born or not.
  function conceive(A, B, mode, rand, opts = { fitCheck: true, mixEvolves: true }) {
    if (mode === 'naive') return { born: true, conception: mixNaive(A, B, rand), fit: null };
    const conception = mixAligned(A, B, rand, { mixEvolves: opts.mixEvolves !== false });
    const fit = fits(express(conception.bytes));
    return { born: opts.fitCheck === false || fit.ok, conception, fit };
  }

  const encodeGene = (type, settings, lowBits = 0) => [...START, ((type & 15) << 4) | (lowBits & 15), ...settings, ...END];

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hex(bytes) {
    const rows = [];
    for (let i = 0; i < bytes.length; i += 16) {
      const row = [...bytes.subarray(i, i + 16)];
      const h = row.map((b) => b.toString(16).padStart(2, '0')).join(' ').padEnd(47);
      const a = row.map((b) => (b >= 32 && b < 127 ? String.fromCharCode(b) : '.')).join('');
      rows.push(`${i.toString(16).padStart(8, '0')}  ${h}  ${a}`);
    }
    return rows.join('\n');
  }

  // Three founder lineages with different strengths. Sniffer and Saver can fit together; Runner cannot.
  const founder = (parts) => Uint8Array.from(parts.flat());
  const FOUNDERS = [
    { name: 'Sniffer', color: '#e0705a', bytes: founder([
      [0x13, 0x07], encodeGene(T.MIX, [160, 1, 6]), [0xa1, 0x9c],
      encodeGene(T.BODY, [70, 90, 200]), [0x55],
      encodeGene(T.NOSE, [210, 0x3c]), [0x02, 0x7f],
      encodeGene(T.EYE, [120, 0x90]), [0x30],
      encodeGene(T.FORAGE, [70, 0x3e]), [0x11],
      encodeGene(T.MATE, [90, 40, 0x92]), [0x9e, 0x01],
      encodeGene(T.FLEE, [60, 0x8e]), [0x66, 0x21],
    ]) },
    { name: 'Saver', color: '#5aa0e0', bytes: founder([
      [0x2a], encodeGene(T.MIX, [128, 0, 4]), [0x08, 0xd3, 0x3b],
      encodeGene(T.BODY, [60, 80, 50]), [0x91],
      encodeGene(T.NOSE, [70, 0x40]), [0x1c],
      encodeGene(T.EYE, [100, 0x94]), [0xe8, 0x05],
      encodeGene(T.FORAGE, [60, 0x3a]), [0x73],
      encodeGene(T.MATE, [80, 40, 0x96]), [0x0b],
      encodeGene(T.FLEE, [60, 0x90]), [0xc2],
    ]) },
    { name: 'Runner', color: '#7ccf6a', bytes: founder([
      [0xb4, 0x10], encodeGene(T.MIX, [100, 2, 5]), [0x3f],
      encodeGene(T.BODY, [50, 220, 150]), [0x27, 0xaa],
      encodeGene(T.NOSE, [110, 0xc8]), [0x61],
      encodeGene(T.EYE, [110, 0x20]), [0x0d],
      encodeGene(T.FORAGE, [65, 0xca]), [0xf2, 0x58],
      encodeGene(T.MATE, [85, 40, 0x22]), [0x19],
      encodeGene(T.FLEE, [60, 0x1e]), [0x83],
    ]) },
  ];

  return { GRID, START, END, TOLERANCE, T, SETTINGS, TYPE_NAMES, DEFAULT_MIX, DEFAULT_BODY,
    parse, express, fits, bindSensor, encodeGene, rng, hex, FOUNDERS, mutate, segments, mixAligned, mixNaive, conceive };
})();

const TPTests = {
  run() {
    let pass = 0, fail = 0;
    const ok = (c, name = '') => { if (c) pass++; else { fail++; console.error('FAIL', name, new Error().stack.split('\n')[2]); } };
    const eq = (a, b, name = '') => { ok(a === b, `${name} got ${JSON.stringify(a)} want ${JSON.stringify(b)}`); };
    const tests = [this.genome, this.reproduction];
    for (const t of tests) {
      try { t(ok, eq); } catch (e) { fail++; console.error('ERROR in', t.name, e.message); }
    }
    console.log(`TPTests: ${pass} passed, ${fail} failed`);
    return fail === 0;
  },

  genome(ok, eq) {
    // parse finds genes between markers and skips junk
    const g = TP.parse(new Uint8Array([0x13, ...TP.encodeGene(1, [96, 80, 40]), 0xa1, ...TP.encodeGene(2, [12, 0x3c])]));
    eq(g.genes.length, 2); eq(g.genes[0].type, 1); eq(g.genes[1].settings.join(), '12,60');
    eq(g.genes[0].start, 1); eq(g.genes[0].end, 1 + 2 + 1 + 3 + 2);
    // low bits are silent
    eq(TP.express(new Uint8Array(TP.encodeGene(1, [9, 9, 9], 0x7))).body.size, 9);
    // broken: missing end marker, wrong length, unused type
    ok(TP.parse(new Uint8Array([0x47, 0x45, 0x10, 1, 2, 3])).genes[0].broken, 'missing end');
    ok(TP.parse(new Uint8Array(TP.encodeGene(1, [1, 2]))).genes[0].broken, 'wrong length');
    ok(TP.parse(new Uint8Array(TP.encodeGene(9, [1, 2]))).genes[0].broken, 'unused type');
    // a start marker before the end marker breaks the first gene, the second still parses
    const two = new Uint8Array([0x47, 0x45, 0x10, 1, 2, ...TP.encodeGene(3, [20, 0x40])]);
    eq(TP.parse(two).genes.length, 2); ok(TP.parse(two).genes[0].broken); ok(!TP.parse(two).genes[1].broken);
    // a cut inside a marker reads as junk, the next gene still parses (Review Focus 2)
    const cut = new Uint8Array([0x47, ...TP.encodeGene(3, [20, 0x40])]);
    eq(TP.parse(cut).genes.filter((x) => !x.broken).length, 1);
    // empty and junk-only genomes express to a creature with no rules (Review Focus 1)
    eq(TP.express(new Uint8Array(0)).rules.length, 0);
    eq(TP.express(new Uint8Array([1, 2, 3, 4, 5])).rules.length, 0);
    eq(TP.express(new Uint8Array(0)).body.size, TP.DEFAULT_BODY.size);
    eq(TP.express(new Uint8Array(0)).mix.share, TP.DEFAULT_MIX.share);
    // only the first unbroken body gene counts
    eq(TP.express(Uint8Array.from([...TP.encodeGene(1, [5, 6, 7]), ...TP.encodeGene(1, [8, 9, 10])])).body.size, 5);
    // rules in genome order, with their settings
    const ph = TP.express(Uint8Array.from([...TP.encodeGene(5, [100, 30, 0x92]), ...TP.encodeGene(4, [30, 0x3d])]));
    eq(ph.rules.map((r) => r.kind).join(), 'mate,forage'); eq(ph.rules[0].a, 100); eq(ph.rules[0].b, 30); eq(ph.rules[0].lock, 0x92);
    // lock and key
    ok(TP.fits(TP.express(Uint8Array.from([...TP.encodeGene(3, [20, 0x3c]), ...TP.encodeGene(4, [30, 0x3d])]))).ok, 'binds');
    ok(!TP.fits(TP.express(Uint8Array.from([...TP.encodeGene(3, [20, 0x3c]), ...TP.encodeGene(4, [30, 0x92])]))).ok, 'no bind');
    ok(!TP.fits(TP.express(Uint8Array.from(TP.encodeGene(4, [30, 0x3d])))).ok, 'rule with no sensor');
    ok(!TP.fits(TP.express(Uint8Array.from([...TP.encodeGene(2, [20, 0x3c]), ...TP.encodeGene(4, [30, 0x3c])]))).ok, 'forage needs a nose, not an eye');
    const edge = TP.fits(TP.express(Uint8Array.from([...TP.encodeGene(2, [20, 100]), ...TP.encodeGene(6, [10, 108])])));
    ok(edge.ok, 'tolerance 8 binds'); eq(edge.checks[0].key, 100);
    ok(!TP.fits(TP.express(Uint8Array.from([...TP.encodeGene(2, [20, 100]), ...TP.encodeGene(6, [10, 109])]))).ok, 'tolerance 9 does not');
    // founders: each fits itself; Sniffer and Saver bind each other's genes; Runner binds neither
    eq(TP.FOUNDERS.map((f) => f.name).join(), 'Sniffer,Saver,Runner');
    for (const f of TP.FOUNDERS) ok(TP.fits(TP.express(f.bytes)).ok, f.name);
    const [Sn, Sa, Ru] = TP.FOUNDERS.map((f) => TP.express(f.bytes));
    const binds = (key, lock) => Math.abs(key - lock) <= TP.TOLERANCE;
    ok(binds(Sn.noses[0].key, Sa.rules.find((r) => r.kind === 'forage').lock), 'Sniffer nose fits Saver forage');
    ok(binds(Sa.noses[0].key, Sn.rules.find((r) => r.kind === 'forage').lock), 'Saver nose fits Sniffer forage');
    ok(!binds(Ru.noses[0].key, Sn.rules.find((r) => r.kind === 'forage').lock), 'Runner nose does not fit Sniffer forage');
    ok(!binds(Sn.eyes[0].key, Ru.rules.find((r) => r.kind === 'mate').lock), 'Sniffer eye does not fit Runner mate');
    ok(Sn.noses[0].range > Sa.noses[0].range && Sn.body.metab > Sa.body.metab, 'Sniffer: long nose, wasteful');
    ok(Ru.body.speed > Sn.body.speed && Ru.body.speed > Sa.body.speed, 'Runner is fastest');
    for (const f of TP.FOUNDERS) {
      const p = TP.parse(f.bytes);
      ok(p.genes.every((x) => !x.broken), f.name + ' has no broken genes');
      ok(p.codingBytes < f.bytes.length, f.name + ' has junk');
      ok(p.genes.some((x) => x.type === TP.T.MIX), f.name + ' has a mix gene');
    }
    // rng and hex
    const r1 = TP.rng(7), r2 = TP.rng(7);
    eq(r1(), r2()); ok(r1() >= 0 && r1() < 1);
    eq(TP.hex(new Uint8Array([0x47, 0x45, 0x00])), '00000000  47 45 00' + ' '.repeat(39) + '  GE.');
  },

  reproduction(ok, eq) {
    const R = TP.rng(5), [S, V, U] = TP.FOUNDERS.map((f) => f.bytes);
    // two parents of the same lineage always give a child that fits
    for (let i = 0; i < 50; i++) ok(TP.conceive(S, S, 'aligned', R).born, 'same lineage fits');
    // aligned mix keeps one gene per slot, each from one of the two parents
    const c = TP.mixAligned(S, V, R);
    ok(c.plan.every((p) => p.from === 0 || p.from === 1), 'every slot from a parent');
    ok(c.usedMixOf === 0 || c.usedMixOf === 1, 'coin flip');
    ok([...c.origin].every((o) => o <= 2), 'origin codes');
    eq(c.origin.length, c.bytes.length);
    eq(c.plan.find((p) => p.type === TP.T.MIX).from, c.usedMixOf, 'mix gene comes from the parent whose rule was used');
    eq(TP.express(c.bytes).rules.length, 3, 'child of two founders has one rule of each kind');
    // the child's mix gene is the used parent's, give or take a gentle mutation
    let close = 0;
    for (let i = 0; i < 100; i++) {
      const k = TP.mixAligned(S, V, R), used = TP.express(k.usedMixOf ? V : S).mix, got = TP.express(k.bytes).mix;
      if (Math.abs(got.share - used.share) <= 3 && got.cuts === used.cuts) close++;
    }
    ok(close >= 95, 'mix gene inherited: ' + close);
    // with mixEvolves off the child's mix gene is the default
    eq(TP.express(TP.mixAligned(S, V, R, { mixEvolves: false }).bytes).mix.share, TP.DEFAULT_MIX.share);
    // incompatible lineages: some conceptions fail the fit check, and with fitCheck off they are born
    let failed = 0;
    for (let i = 0; i < 200; i++) if (!TP.conceive(S, U, 'aligned', R).born) failed++;
    ok(failed > 0, 'Sniffer x Runner sometimes fails');
    for (let i = 0; i < 50; i++) ok(TP.conceive(S, U, 'aligned', R, { fitCheck: false, mixEvolves: true }).born, 'fit check off');
    const cf = TP.conceive(S, U, 'aligned', R);
    ok(cf.fit && Array.isArray(cf.fit.checks), 'aligned conception carries its fit check');
    // naive: child is A[0..cutA) + B[cutB..), always born, no fit check
    for (let i = 0; i < 30; i++) {
      const n = TP.mixNaive(S, V, R);
      if (!n.mutations.some((m) => m.kind === 'duplicate' || m.kind === 'delete')) eq(n.bytes.length, n.cutA + (V.length - n.cutB), 'splice length');
      eq(n.origin.length, n.bytes.length);
      const k = TP.conceive(S, V, 'naive', R);
      ok(k.born && k.fit === null, 'naive always born');
    }
    // mutation is gentle: at rate 4, almost every child keeps every founder rule
    let intact = 0;
    for (let i = 0; i < 200; i++) {
      const m = TP.mutate(S, new Uint8Array(S.length), 4, R);
      if (TP.express(m.bytes).rules.length === TP.express(S).rules.length) intact++;
    }
    ok(intact >= 190, 'gentle mutation: ' + intact);
    // nudges change a setting by at most 3
    const hot = TP.mutate(Uint8Array.from(TP.encodeGene(TP.T.BODY, [100, 100, 100])), new Uint8Array(9), 2000, TP.rng(1));
    for (const m of hot.mutations.filter((x) => x.kind === 'nudge')) ok(Math.abs(m.to - m.from) <= 3 && m.to !== m.from, 'nudge size');
    ok(hot.mutations.length > 0, 'high rate mutates');
    ok([...hot.origin].some((o) => o === 2) || hot.mutations.every((m) => m.kind === 'delete'), 'mutated bytes marked');
    // gene-count mismatch and duplicates do not break alignment (Review Focus 3)
    const dup = Uint8Array.from([...S, ...TP.encodeGene(TP.T.NOSE, [40, 0x3c])]);
    for (let i = 0; i < 20; i++) ok(TP.mixAligned(dup, V, R).bytes.length > 0);
    ok(TP.mixAligned(new Uint8Array(0), V, R).bytes !== undefined, 'empty parent');
    ok(TP.mixAligned(new Uint8Array([1, 2, 3]), new Uint8Array(0), R).bytes !== undefined, 'junk and empty parents');
    ok(TP.mixNaive(new Uint8Array(0), new Uint8Array(0), R).bytes.length === 0, 'naive of empty parents');
    // determinism
    eq(TP.hex(TP.mixAligned(S, V, TP.rng(9)).bytes), TP.hex(TP.mixAligned(S, V, TP.rng(9)).bytes));
  },
};
