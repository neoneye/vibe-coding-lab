<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continued Fractions</title>
<style>
  :root { --fg:#111; --muted:#666; --border:#ccc; --bg:#fff; --accent:#1a5fb4; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
    font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app { max-width: 960px; margin: 0 auto; padding: 20px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px 0; }
  .sub { color:var(--muted); margin:0 0 16px 0; }
  .tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab { padding:8px 16px; background:none; border:1px solid transparent; border-bottom:none;
    cursor:pointer; font:inherit; color:var(--muted); }
  .tab.active { color:var(--fg); border-color:var(--border); background:var(--bg);
    position:relative; top:1px; }
  .panel { display:none; } .panel.active { display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { padding:5px 12px; border:1px solid var(--border); background:var(--bg); cursor:pointer;
    font:inherit; border-radius:3px; color:var(--fg); }
  .chip:hover { border-color:var(--accent); }
  .chip.active { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:8px 0; }
  .muted { color:var(--muted); }
  .status { color:var(--muted); margin:8px 0 12px 0; }
  .terms { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; margin:12px 0;
    word-break:break-word; }
  .signstrip { margin-top:6px; color:var(--muted); letter-spacing:1px; word-break:break-word; }
  .tower { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; margin:12px 0 4px 0;
    overflow-x:auto; padding-bottom:4px; }
  .frac { display:inline-flex; align-items:center; vertical-align:middle; }
  .frac .stack { display:inline-flex; flex-direction:column; align-items:center; }
  .frac .num { padding:0 6px; }
  .frac .den { padding:0 6px; border-top:1px solid var(--fg); white-space:nowrap; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; font-size:13px; width:100%; }
  th, td { border-bottom:1px solid var(--border); padding:5px 10px; text-align:right;
    white-space:nowrap; font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:600; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:#f4f7fb; }
  tr.selected td { background:#eaf1fb; }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .twocol { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .twocol > * { flex:1 1 320px; min-width:0; }
  canvas { border:1px solid var(--border); max-width:100%; }
  .verdict { display:block; padding:8px 12px; border-left:3px solid var(--accent); background:#f4f7fb; }
  label { display:inline-flex; align-items:center; gap:6px; }
  select, input[type=number] { font:inherit; padding:3px 4px; }
  #simple-mode .chip { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  #simple-cascade { display:block; margin:10px 0 4px 0; }
  #cx-canvas { display:block; margin:14px 0 4px 0; }
  #bd-table { font-size:12px; }
  #bd-table th, #bd-table td { padding:4px 7px; }
  #bd-plot { display:block; margin:12px 0 4px 0; }
  .sectionhead { font-size:14px; font-weight:600; margin:22px 0 8px 0; }
  .numgrid { display:grid; grid-template-columns:repeat(24, 1fr); gap:2px; max-width:720px; }
  .numgrid div { font-size:9px; text-align:center; padding:2px 0; border-radius:2px;
    background:#f2f2f2; color:#bbb; font-variant-numeric:tabular-nums; }
  .numgrid div.both { background:#1a5fb4; color:#fff; }
  .numgrid div.prod { background:#c8dcf5; color:#1a5fb4; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin:8px 0; font-size:12px; color:var(--muted); }
  .legend span::before { content:''; display:inline-block; width:10px; height:10px; margin-right:5px;
    vertical-align:-1px; border-radius:2px; }
  .legend .k-both::before { background:#1a5fb4; }
  .legend .k-prod::before { background:#c8dcf5; }
  .legend .k-none::before { background:#f2f2f2; }
  #euler-race td:first-child, #euler-race th:first-child { text-align:left; color:var(--muted); }
</style>
</head>
<body>
<div class="app">
  <h1>Continued Fractions</h1>
  <p class="sub">Ways a constant gets built out of the integers — dividing, adding, multiplying — on the real line and in the complex plane.</p>
  <div class="tabs">

  </div>
  <div class="panel active" id="panel-simple">

  </div>
  <div class="panel" id="panel-unit">

  </div>

    <div class="chips" id="bd-mode"></div>

<script id="shared-code">
const XTests = (() => {
  const cases = [];
  const test = (name, fn) => cases.push([name, fn]);
  const eq = (a, b, msg) => {
    if (String(a) !== String(b)) throw new Error(`${msg || 'eq'}: expected ${b}, got ${a}`);
  };
  const ok = (c, msg) => { if (!c) throw new Error(msg || 'assertion failed'); };
  const run = () => {
    for (const [name, fn] of cases) {
      try { fn(); } catch (e) { throw new Error(`${name}: ${e.message}`); }
    }
    return cases.length;
  };
  return { test, eq, ok, run };
})();

const CF = (() => {
  const bgcd = (a, b) => {
    a = a < 0n ? -a : a; b = b < 0n ? -b : b;
    while (b) { const t = a % b; a = b; b = t; }
    return a;
  };

  const isqrt = (n) => {
    if (n < 0n) throw new Error('isqrt of negative');
    if (n < 2n) return n;
    let x = n, y = (x + 1n) / 2n;
    while (y < x) { x = y; y = (x + n / x) / 2n; }
    return x;
  };

  const Rat = {
    make(n, d) {
      if (d === 0n) throw new Error('zero denominator');
      if (d < 0n) { n = -n; d = -d; }
      const g = bgcd(n, d) || 1n;
      return { n: n / g, d: d / g };
    },
    fromInt(v) { return { n: BigInt(v), d: 1n }; },
    fromDecimalString(s) {
      const t = String(s).trim();
      const neg = t.startsWith('-');
      const body = neg ? t.slice(1) : t;
      const [ip, fp = ''] = body.split('.');
      const n = BigInt((ip || '0') + fp);
      return Rat.make(neg ? -n : n, 10n ** BigInt(fp.length));
    },
    add(a, b) { return Rat.make(a.n * b.d + b.n * a.d, a.d * b.d); },
    sub(a, b) { return Rat.make(a.n * b.d - b.n * a.d, a.d * b.d); },
    mul(a, b) { return Rat.make(a.n * b.n, a.d * b.d); },
    div(a, b) { if (b.n === 0n) throw new Error('division by zero'); return Rat.make(a.n * b.d, a.d * b.n); },
    neg(a) { return { n: -a.n, d: a.d }; },
    isZero(a) { return a.n === 0n; },
    cmp(a, b) { const l = a.n * b.d, r = b.n * a.d; return l < r ? -1 : l > r ? 1 : 0; },
    floor(a) {
      let q = a.n / a.d;
      if (a.n % a.d !== 0n && a.n < 0n) q -= 1n;
      return q;
    },
    toDecimalString(a, digits) {
      const neg = a.n < 0n;
      const n = neg ? -a.n : a.n;
      const ip = n / a.d;
      let rem = n % a.d;
      let out = (neg ? '-' : '') + ip.toString();
      if (digits > 0) {
        let frac = '';
        for (let i = 0; i < digits; i++) {
          rem *= 10n;
          frac += (rem / a.d).toString();
          rem %= a.d;
        }
        out += '.' + frac;
      }
      return out;
    },
    toNumber(a) { return Number(Rat.toDecimalString(a, 20)); },
  };

  // ---- series helpers, used to pin the transcribed digit strings in the tests ----

  // Truncate a rational to `digits` decimals, keeping the terms small between iterations.
  const trunc = (r, digits) => {
    const s = 10n ** BigInt(digits);
    return Rat.make((r.n * s) / r.d, s);
  };

  const ratSqrt = (n, digits) => {
    let x = Rat.fromInt(isqrt(n * 10n ** 40n) / 10n ** 20n + 1n);
    const N = Rat.fromInt(n), two = Rat.fromInt(2);
    for (let i = 0; i < 300; i++) {
      const next = trunc(Rat.div(Rat.add(x, Rat.div(N, x)), two), digits + 10);
      if (Rat.cmp(next, x) === 0) break;
      x = next;
    }
    return trunc(x, digits);
  };

  const ratCbrt = (n, digits) => {
    let x = Rat.fromInt(2);
    const N = Rat.fromInt(n), two = Rat.fromInt(2), three = Rat.fromInt(3);
    for (let i = 0; i < 400; i++) {
      const next = trunc(Rat.div(Rat.add(Rat.mul(two, x), Rat.div(N, Rat.mul(x, x))), three), digits + 10);
      if (Rat.cmp(next, x) === 0) break;
      x = next;
    }
    return trunc(x, digits);
  };

  const ratExp1 = (digits) => {
    let sum = Rat.fromInt(0), term = Rat.fromInt(1);
    const tiny = Rat.make(1n, 10n ** BigInt(digits + 10));
    for (let k = 1; k <= 400; k++) {
      sum = Rat.add(sum, term);
      term = Rat.div(term, Rat.fromInt(k));
      if (Rat.cmp(term, tiny) < 0) { sum = Rat.add(sum, term); break; }
    }
    return trunc(sum, digits);
  };

  // ln 2 = 2 * atanh(1/3) = 2 * sum_{k>=0} (1/3)^(2k+1) / (2k+1)
  const ratLn2 = (digits) => {
    let sum = Rat.fromInt(0), pow = Rat.make(1n, 3n);
    const ninth = Rat.make(1n, 9n);
    for (let k = 0; k < 600; k++) {
      sum = Rat.add(sum, Rat.div(pow, Rat.fromInt(2 * k + 1)));
      pow = trunc(Rat.mul(pow, ninth), digits + 20);
      if (Rat.isZero(pow)) break;
    }
    return trunc(Rat.mul(Rat.fromInt(2), sum), digits);
  };

  // arctan(1/m) = sum_{k>=0} (-1)^k / ((2k+1) m^(2k+1))
  const ratArctanInv = (m, digits) => {
    let sum = Rat.fromInt(0), pow = Rat.make(1n, BigInt(m));
    const sq = Rat.make(1n, BigInt(m) * BigInt(m));
    for (let k = 0; k < 2000; k++) {
      const t = Rat.div(pow, Rat.fromInt(2 * k + 1));
      sum = k % 2 === 0 ? Rat.add(sum, t) : Rat.sub(sum, t);
      pow = trunc(Rat.mul(pow, sq), digits + 20);
      if (Rat.isZero(pow)) break;
    }
    return sum;
  };

  // pi = 16 arctan(1/5) - 4 arctan(1/239)
  const ratPiMachin = (digits) => trunc(Rat.sub(
    Rat.mul(Rat.fromInt(16), ratArctanInv(5, digits + 10)),
    Rat.mul(Rat.fromInt(4), ratArctanInv(239, digits + 10))), digits);

  // ---- the constants ----
  // Every string below is TRUNCATED, never rounded up, so [lo, lo + 10^-60] really does
  // bracket the value. The tests above check each one against the series here; gamma has
  // no cheap series and is cross-checked against OEIS A002852 in the term tests instead.
  const CONSTANTS = [
    { key: 'pi',       label: 'π',   digits: '3.141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825342117067' },
    { key: 'e',        label: 'e',        digits: '2.718281828459045235360287471352662497757247093699959574966967627724076630353547594571382178525166427' },
    { key: 'sqrt2',    label: '√2',  digits: '1.41421356237309504880168872420969807856967187537694807317667', quad: { P: 0n, Q: 1n, D: 2n } },
    { key: 'sqrt3',    label: '√3',  digits: '1.73205080756887729352744634150587236694280525381038062805580', quad: { P: 0n, Q: 1n, D: 3n } },
    { key: 'sqrt5',    label: '√5',  digits: '2.23606797749978969640917366873127623544061835961152572427089', quad: { P: 0n, Q: 1n, D: 5n } },
    { key: 'phi',      label: 'φ',   digits: '1.61803398874989484820458683436563811772030917980576286213544', quad: { P: 1n, Q: 2n, D: 5n } },
    { key: 'ln2',      label: 'ln 2',     digits: '0.693147180559945309417232121458176568075500134360255254120680' },
    { key: 'gamma',    label: 'γ',   digits: '0.577215664901532860606512090082402431042159335939923598805767' },
    { key: 'cbrt2',    label: '∛2',  digits: '1.25992104989487316476721060727822835057025146470150798008197' },
    { key: 'r355_113', label: '355/113',  digits: '3.14159292035398230088495575221238938053097345132743362831858',
      exactNum: 355n, exactDen: 113n },
  ];

  const EPS = Rat.make(1n, 10n ** 60n);

  const constant = (key) => {
    const c = CONSTANTS.find(x => x.key === key);
    if (!c) throw new Error('unknown constant ' + key);
    const lo = Rat.fromDecimalString(c.digits);
    const exact = c.exactNum !== undefined ? Rat.make(c.exactNum, c.exactDen) : null;
    return { key: c.key, label: c.label, lo, hi: Rat.add(lo, EPS), exact, quad: c.quad || null };
  };

  // ---- term extraction ----



  // Terms of (P + sqrt(D)) / Q, D not a perfect square. Exact integer arithmetic, so this
  // runs as far as asked rather than stopping at the enclosure's precision.
  const quadraticTerms = (P, Q, D, maxTerms) => {
    if (isqrt(D) ** 2n === D) throw new Error('D must not be a perfect square');
    if ((D - P * P) % Q !== 0n) { P *= Q; D *= Q * Q; Q *= Q; }
    const sq = isqrt(D);
    const terms = [];
    const seen = new Map();
    let p = P, q = Q, periodStart = null, periodLength = null;
    for (let i = 0; i < maxTerms; i++) {
      const key = `${p}/${q}`;
      if (periodStart === null && seen.has(key)) {
        periodStart = seen.get(key);
        periodLength = i - periodStart;
      }
      if (!seen.has(key)) seen.set(key, i);
      const a = (p + sq) / q;   // p + sq and q stay positive for every constant shipped here
      terms.push(a);
      p = a * q - p;
      q = (D - p * p) / q;
    }
    return { terms, stopReason: periodLength ? 'periodic' : 'max-terms', periodStart, periodLength };
  };


  // ---- convergents ----

  const convergents = (terms) => {
    let pm1 = 1n, pm2 = 0n, qm1 = 0n, qm2 = 1n;
    const out = [];
    for (const a of terms) {
      const p = a * pm1 + pm2, q = a * qm1 + qm2;
      out.push({ p, q });
      pm2 = pm1; pm1 = p; qm2 = qm1; qm1 = q;
    }
    return out;
  };

  const sci = (r, sig) => {
    if (Rat.isZero(r)) return '0';
    const neg = r.n < 0n;
    let a = neg ? Rat.neg(r) : r;
    let exp = 0;
    const ten = Rat.fromInt(10), one = Rat.fromInt(1);
    while (Rat.cmp(a, ten) >= 0) { a = Rat.div(a, ten); exp++; }
    while (Rat.cmp(a, one) < 0) { a = Rat.mul(a, ten); exp--; }
    const mant = Rat.toDecimalString(a, sig - 1);
    return `${neg ? '-' : ''}${mant}e${exp < 0 ? '-' : '+'}${Math.abs(exp)}`;
  };

  const raceKind = (mode) => (mode === 'ceil' ? 'above' : 'any');

  // ---- Gaussian rationals: complex numbers with exact rational parts ----

  const cOf = (re, im) => ({ re, im });
  const cAdd = (a, b) => cOf(Rat.add(a.re, b.re), Rat.add(a.im, b.im));
  const cSub = (a, b) => cOf(Rat.sub(a.re, b.re), Rat.sub(a.im, b.im));
  const cMul = (a, b) => cOf(
    Rat.sub(Rat.mul(a.re, b.re), Rat.mul(a.im, b.im)),
    Rat.add(Rat.mul(a.re, b.im), Rat.mul(a.im, b.re)));
  const cNormSq = (z) => Rat.add(Rat.mul(z.re, z.re), Rat.mul(z.im, z.im));
  const cIsZero = (z) => Rat.isZero(z.re) && Rat.isZero(z.im);
  const cInv = (z) => {
    if (cIsZero(z)) throw new Error('complex division by zero');
    const n = cNormSq(z);
    return cOf(Rat.div(z.re, n), Rat.div(Rat.neg(z.im), n));   // conj(z)/|z|^2
  };
  const cNearestGaussian = (z) => cOf(Rat.fromInt(ratRound(z.re)), Rat.fromInt(ratRound(z.im)));
  const cStr = (z, digits) => {
    const re = Rat.toDecimalString(z.re, digits);
    const imAbs = Rat.toDecimalString(z.im.n < 0n ? Rat.neg(z.im) : z.im, digits);
    return `${re}${z.im.n < 0n ? '-' : '+'}${imAbs}i`;
  };

  // A rational L >= 0 with L^2 <= m. Used wherever |r| is needed: substituting a LOWER
  // bound for a magnitude can only enlarge an error radius, never shrink it, so the
  // enclosure stays valid. floor(sqrt(n*s^2/d))/s satisfies (L/s)^2 <= n/d by construction.
  const ratSqrtLower = (m, digits) => {
    if (m.n <= 0n) return Rat.fromInt(0);
    const s = 10n ** BigInt(digits);
    return Rat.make(isqrt((m.n * s * s) / m.d), s);
  };

  // One arithmetic interface, two instantiations, so the generalized recurrence can run
  // over the reals or the Gaussian rationals without a second copy of itself.
  const RAT_OPS = {
    add: Rat.add, sub: Rat.sub, mul: Rat.mul, div: Rat.div, neg: Rat.neg,
    isZero: Rat.isZero, zero: Rat.fromInt(0), one: Rat.fromInt(1),
    lift: (r) => r,
  };
  const CRAT_OPS = {
    add: cAdd, sub: cSub, mul: cMul,
    div: (a, b) => cMul(a, cInv(b)), neg: (a) => cSub(cOf(Rat.fromInt(0), Rat.fromInt(0)), a),
    isZero: cIsZero, zero: cOf(Rat.fromInt(0), Rat.fromInt(0)), one: cOf(Rat.fromInt(1), Rat.fromInt(0)),
    lift: (r) => (r && r.re !== undefined ? r : cOf(r, Rat.fromInt(0))),
  };

  // ---- Hurwitz continued fractions over the Gaussian integers ----

  const COMPLEX_CONSTANTS = [
    { key: 'pi_e_i',     label: 'π + e·i' },
    { key: 'rot8',       label: '(1+i)/√2' },
    { key: 'quad7',      label: 'i·√7' },
    { key: 'g45',        label: '(3+4i)/5' },
    { key: 'gamma_phi',  label: 'γ + φ·i' },
    { key: 'ln2_sqrt3',  label: 'ln 2 + √3·i' },
    // The page's real constants, so the same algorithm can be run on them for
    // comparison. A real value has no imaginary part to develop, so Hurwitz
    // degenerates to the nearest-integer expansion of the Simple tab.
    ...CONSTANTS.map(c => ({ key: c.key, label: c.label, real: true })),
  ];

  const COMPLEX_DELTA = Rat.make(1n, 10n ** 48n);

  const complexConstant = (key) => {
    const meta = COMPLEX_CONSTANTS.find(c => c.key === key);
    if (!meta) throw new Error('unknown complex constant ' + key);
    if (meta.real) {
      const k = constant(key);
      return {
        key, label: meta.label, real: true,
        centre: cOf(k.exact || trunc(k.lo, 50), Rat.fromInt(0)),
        delta: k.exact ? Rat.fromInt(0) : COMPLEX_DELTA,
      };
    }
    const c = (k) => trunc(constant(k).lo, 50);
    const half = Rat.make(1n, 2n);
    let centre, delta = COMPLEX_DELTA;
    if (key === 'pi_e_i') centre = cOf(c('pi'), c('e'));
    else if (key === 'rot8') { const h = Rat.mul(c('sqrt2'), half); centre = cOf(h, h); }
    // i*sqrt7, a root of z^2 + 7 = 0. Its real part is 0, not 1/2: a part sitting exactly
    // on a half-integer makes the nearest Gaussian integer genuinely ambiguous, and the
    // disk rule then (correctly) refuses to emit even a first term.
    else if (key === 'quad7') centre = cOf(Rat.fromInt(0), trunc(ratSqrt(7n, 50), 50));
    else if (key === 'g45') { centre = cOf(Rat.make(3n, 5n), Rat.make(4n, 5n)); delta = Rat.fromInt(0); }
    else if (key === 'gamma_phi') centre = cOf(c('gamma'), c('phi'));
    else centre = cOf(c('ln2'), c('sqrt3'));
    return { key, label: meta.label, real: false, centre, delta };
  };

  const hurwitzTerms = (centre, delta, maxTerms) => {
    const terms = [], remSqs = [];
    const half = Rat.make(1n, 2n);
    const absR = (r) => (r.n < 0n ? Rat.neg(r) : r);
    let z = centre, d = delta;
    for (let i = 0; i < maxTerms; i++) {
      const a = cNearestGaussian(z);
      // With d = 0 the value is exact and the rounding is certain by definition. The
      // strict test below would wrongly reject a part sitting exactly on 1/2, which
      // ratRound resolves deterministically (halves up).
      if (!Rat.isZero(d)) {
        const dr = absR(Rat.sub(z.re, a.re)), di = absR(Rat.sub(z.im, a.im));
        if (Rat.cmp(Rat.add(dr, d), half) >= 0 || Rat.cmp(Rat.add(di, d), half) >= 0) {
          return { terms, remSqs, stopReason: 'precision-exhausted' };
        }
      }
      terms.push(a);
      const r = cSub(z, a);
      remSqs.push(cNormSq(r));      // |z - a|^2, the distance discarded by this rounding
      if (cIsZero(r)) return { terms, remSqs, stopReason: 'exact' };
      if (!Rat.isZero(d)) {
        const L = ratSqrtLower(cNormSq(r), 40);          // L <= |r|
        if (Rat.cmp(d, L) >= 0) return { terms, remSqs, stopReason: 'precision-exhausted' };
        d = Rat.div(d, Rat.mul(L, Rat.sub(L, d)));       // |1/r - 1/r_hat| bound
      }
      z = cInv(r);
    }
    return { terms, remSqs, stopReason: 'max-terms' };
  };

  // A_k = a_k A_{k-1} + A_{k-2}; no sign choice - nearest-Gaussian rounding already
  // minimises the remainder in both coordinates, so every numerator is +1.
  const hurwitzConvergents = (terms) => {
    let Am2 = cOf(Rat.fromInt(0), Rat.fromInt(0)), Am1 = cOf(Rat.fromInt(1), Rat.fromInt(0));
    let Bm2 = cOf(Rat.fromInt(1), Rat.fromInt(0)), Bm1 = cOf(Rat.fromInt(0), Rat.fromInt(0));
    const out = [];
    for (const a of terms) {
      const A = cAdd(cMul(a, Am1), Am2), B = cAdd(cMul(a, Bm1), Bm2);
      out.push({ A, B });
      Am2 = Am1; Am1 = A; Bm2 = Bm1; Bm1 = B;
    }
    return out;
  };

  const hurwitzRows = (key, maxTerms) => {
    const k = complexConstant(key);
    const e = hurwitzTerms(k.centre, k.delta, maxTerms);
    const cs = hurwitzConvergents(e.terms);
    const rows = cs.map((c, i) => {
      const value = cIsZero(c.B) ? cOf(Rat.fromInt(0), Rat.fromInt(0)) : cMul(c.A, cInv(c.B));
      const errSq = cNormSq(cSub(k.centre, value));
      return {
        k: i, term: e.terms[i], A: c.A, B: c.B, value,
        valueStr: cStr(value, 12),
        errSq, errStr: sci(ratSqrtLower(errSq, 30), 4),
        remStr: e.remSqs[i] === undefined ? '' : Rat.toDecimalString(ratSqrtLower(e.remSqs[i], 12), 6),
      };
    });
    return { rows, stopReason: e.stopReason };
  };

  // Run a REAL constant through the complex algorithm with a tiny imaginary nudge.
  // Every inversion amplifies the imaginary part by roughly 1/|r|^2, so after k levels the
  // amplification is q_k^2 and the nudge becomes visible once eps*q_k^2 reaches the rounding
  // threshold of 1/2 - the same q^2 that governs |x - p/q| < 1/q^2 on the Simple tab.
  const imaginaryWake = (key, eps, maxTerms) => {
    const k = complexConstant(key);
    if (!k.real) throw new Error('imaginaryWake expects a real constant');
    const z = cOf(k.centre.re, eps);
    const e = hurwitzTerms(z, k.delta, maxTerms);
    const idx = e.terms.findIndex(t => !Rat.isZero(t.im));
    let predicted = null, qPredicted = null;
    if (!Rat.isZero(eps)) {
      const rows = convergentRowsFor(key, maxTerms + 4, 'nearest').rows;
      for (const r of rows) {
        if (Rat.cmp(Rat.mul(eps, Rat.fromInt(r.q * r.q)), Rat.make(1n, 2n)) >= 0) {
          predicted = r.n; qPredicted = r.q; break;
        }
      }
    }
    return { terms: e.terms, stopReason: e.stopReason,
             actual: idx < 0 ? null : idx, predicted, qPredicted };
  };

  // ---- greedy unit fractions (the Egyptian-fraction algorithm) ----
  //
  // Take the largest unit fraction that still fits under the remainder, repeatedly:
  // n = ceil(1/r) is the smallest denominator whose 1/n does not overshoot. Both
  // enclosure endpoints are carried through, so the remainder stays an interval and
  // "is this denominator certain?" is an exact question.

  const unitFractions = (lo, hi, maxTerms) => {
    const fl = Rat.floor(lo), fh = Rat.floor(hi);
    if (fl !== fh) return { whole: 0n, dens: [], stopReason: 'precision-exhausted' };
    const whole = fl;
    let a = Rat.sub(lo, Rat.fromInt(whole)), b = Rat.sub(hi, Rat.fromInt(whole));
    const dens = [];
    for (let i = 0; i < maxTerms; i++) {
      if (Rat.isZero(a) && Rat.isZero(b)) return { whole, dens, stopReason: 'exact' };
      if (Rat.isZero(a) || Rat.isZero(b)) return { whole, dens, stopReason: 'precision-exhausted' };
      const na = ratCeil(Rat.div(Rat.fromInt(1), a)), nb = ratCeil(Rat.div(Rat.fromInt(1), b));
      if (na !== nb) return { whole, dens, stopReason: 'precision-exhausted' };
      dens.push(na);
      // r - 1/n on both endpoints. The map is increasing, so the order is preserved.
      a = Rat.sub(a, Rat.make(1n, na));
      b = Rat.sub(b, Rat.make(1n, nb));
    }
    return { whole, dens, stopReason: 'max-terms' };
  };

  const unitFractionRows = (key, maxTerms) => {
    const k = constant(key);
    const x = k.exact || k.lo;
    const r = k.exact
      ? unitFractions(k.exact, k.exact, maxTerms)
      : unitFractions(k.lo, k.hi, maxTerms);
    let partial = Rat.fromInt(r.whole);
    const rows = r.dens.map((den, i) => {
      partial = Rat.add(partial, Rat.make(1n, den));
      const error = Rat.sub(x, partial);
      return {
        k: i + 1, den, digits: den.toString().length,
        partial, partialStr: Rat.toDecimalString(partial, 20),
        error, errorStr: sci(error, 5),
      };
    });
    return { whole: r.whole, rows, stopReason: r.stopReason };
  };

  // ---- semiregular continued fractions: x = a + eps/x', eps in {+1, -1} ----
  //
  // The rounding rule IS the knob. a = floor(x) puts the remainder in (0,1), forcing
  // eps = +1; a = ceil(x) puts it in (-1,0), forcing eps = -1. So "always floor" is the
  // regular expansion and "always ceiling" is the minus one; they are not separate
  // algorithms. In every mode the next value is x' = 1/|x - a|.

  const SEMI_MODES = [
    { key: 'floor',   label: '⌊x⌋ always',                      note: null },
    { key: 'nearest', label: 'nearest',                                   note: null },
    { key: 'alt',     label: '⌊x⌋ ⌈x⌉ alternating',
      note: 'a construction, not a classical expansion' },
    { key: 'ceil',    label: '⌈x⌉ always',                      note: null },
  ];

  const ratRound = (a) => {
    const f = Rat.floor(a);
    const frac = Rat.sub(a, Rat.fromInt(f));
    return Rat.cmp(frac, Rat.make(1n, 2n)) >= 0 ? f + 1n : f;   // halves round up
  };

  // level is 0-based; alt starts with floor so its first sign is +1.
  const pickInteger = (x, mode, level) => {
    if (mode === 'floor') return Rat.floor(x);
    if (mode === 'ceil') return ratCeil(x);
    if (mode === 'nearest') return ratRound(x);
    if (mode === 'alt') return level % 2 === 0 ? Rat.floor(x) : ratCeil(x);
    throw new Error('unknown mode ' + mode);
  };

  const semiregularTerms = (lo, hi, mode, maxTerms) => {
    const terms = [], signs = [];
    let a = lo, b = hi;
    for (let i = 0; i < maxTerms; i++) {
      const ia = pickInteger(a, mode, i), ib = pickInteger(b, mode, i);
      if (ia !== ib) return { terms, signs, stopReason: 'precision-exhausted' };
      const ra = Rat.sub(a, Rat.fromInt(ia)), rb = Rat.sub(b, Rat.fromInt(ib));
      if (Rat.isZero(ra) && Rat.isZero(rb)) { terms.push(ia); return { terms, signs, stopReason: 'exact' }; }
      // The SIGN must be certain too, not just the integer: an enclosure straddling ia
      // determines the term while leaving the side of it unknown.
      const sa = Rat.cmp(ra, Rat.fromInt(0)), sb = Rat.cmp(rb, Rat.fromInt(0));
      if (sa === 0 || sb === 0 || sa !== sb) return { terms, signs, stopReason: 'precision-exhausted' };
      terms.push(ia);
      signs.push(sa > 0 ? 1 : -1);
      // x -> 1/|x - a|. Both endpoints lie on the same side of ia, so the map is monotone
      // across the whole enclosure and its image is exactly the interval between the two
      // images - which way round is settled by comparing them.
      const abs = (r) => (r.n < 0n ? Rat.neg(r) : r);
      const na = Rat.div(Rat.fromInt(1), abs(ra)), nb = Rat.div(Rat.fromInt(1), abs(rb));
      if (Rat.cmp(na, nb) <= 0) { a = na; b = nb; } else { a = nb; b = na; }
    }
    return { terms, signs, stopReason: 'max-terms' };
  };

  // A_k = a_k A_{k-1} + eps_k A_{k-2}, with eps_0 = +1: there is no numerator before the
  // first term, and eps_0 only multiplies the seed. That is what makes B_0 = 1 in every mode.
  const semiregularConvergents = (terms, signs) => {
    let Am2 = 0n, Am1 = 1n, Bm2 = 1n, Bm1 = 0n;
    const out = [];
    for (let k = 0; k < terms.length; k++) {
      const e = BigInt(k === 0 ? 1 : signs[k - 1]);
      const A = terms[k] * Am1 + e * Am2, B = terms[k] * Bm1 + e * Bm2;
      out.push({ p: A, q: B });
      Am2 = Am1; Am1 = A; Bm2 = Bm1; Bm1 = B;
    }
    return out;
  };

  const expandMode = (key, mode, maxTerms) => {
    const k = constant(key);
    if (k.exact) {
      const r = semiregularTerms(k.exact, k.exact, mode, maxTerms);
      return { ...r, source: 'exact' };
    }
    // Only the floor mode has an exact periodic generator, so only it can run past the
    // enclosure's precision. The other three report what 60 digits determine.
    if (mode === 'floor' && k.quad) {
      const r = quadraticTerms(k.quad.P, k.quad.Q, k.quad.D, maxTerms);
      return { terms: r.terms, signs: r.terms.slice(1).map(() => 1),
               stopReason: r.stopReason === 'periodic' ? 'periodic' : 'max-terms',
               source: 'quadratic' };
    }
    const r = semiregularTerms(k.lo, k.hi, mode, maxTerms);
    return { ...r, source: 'interval' };
  };

  // The one-sided best approximations of x: the convergents plus the SEMICONVERGENTS
  // (p_{k-1} + j*p_k)/(q_{k-1} + j*q_k) for j = 1..a_{k+1}-1. Every fraction that is the
  // closest on its own side for its denominator appears here, so this is the right pool to
  // choose bounds from.
  const semiconvergents = (key, maxQ) => {
    const k = constant(key);
    const x = k.exact || k.lo;
    const rows = convergentRowsFor(key, 34, 'floor').rows;
    const out = [];
    const add = (p, q) => {
      if (q <= 0n || q > maxQ) return;
      const v = Rat.make(p, q), err = Rat.sub(x, v);
      if (Rat.isZero(err)) return;                   // an exact hit is neither bound
      out.push({ p, q, v, err, abs: err.n < 0n ? Rat.neg(err) : err, below: err.n > 0n });
    };
    for (let i = 0; i < rows.length; i++) {
      add(rows[i].p, rows[i].q);
      if (i + 1 < rows.length) {
        const pm = i > 0 ? rows[i - 1].p : 1n, qm = i > 0 ? rows[i - 1].q : 0n;
        for (let j = 1n; j < rows[i + 1].a; j++) add(pm + j * rows[i].p, qm + j * rows[i].q);
      }
    }
    return out;
  };

  // Choose the bracket whose MIDPOINT is best rather than whose endpoints are each best.
  // The midpoint error is |errUpper - errLower| / 2, so the pair to want is the one whose
  // two errors are closest in size - deliberately taking a worse bound on the better side
  // so the two cancel. Sorting by error magnitude puts that pair adjacent, so one scan finds it.
  const balancedPair = (key, maxQ) => {
    const pool = semiconvergents(key, maxQ);
    if (pool.length < 2) return null;
    pool.sort((a, b) => Rat.cmp(a.abs, b.abs));
    // For each element the nearest opposite-side partner in sorted order gives its smallest
    // gap, and scanning forward to the first one covers every such pair (a backward partner
    // for i is a forward partner for that earlier element). So this is exact, not a heuristic.
    let best = null;
    for (let i = 0; i + 1 < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        if (pool[i].below === pool[j].below) continue;
        const d = Rat.sub(pool[j].abs, pool[i].abs);
        const gap = d.n < 0n ? Rat.neg(d) : d;
        if (!best || Rat.cmp(gap, best.gap) < 0) {
          best = { gap, lower: pool[i].below ? pool[i] : pool[j], upper: pool[i].below ? pool[j] : pool[i] };
        }
        break;                                     // first opposite-side partner is the nearest
      }
    }
    return best;
  };

  // ---- two bounding continued fractions and their midpoint ----
  //
  // A regular expansion's convergents alternate: the even-indexed ones rise toward the
  // value from below, the odd-indexed ones fall toward it from above. Split them and you
  // have two monotone bound sequences. Level k pairs B_k = p_2k/q_2k with A_k = p_2k+1/q_2k+1.
  //
  // The midpoint (A+B)/2 has a tidy error identity: mid - x = ((B-x) + (A-x))/2, so
  // |mid - x| = |errA - errB| / 2. It therefore only beats both endpoints when the two
  // errors are close in size, which is why it wins less than half the time.
  //
  // The MEDIANT (pA+pB)/(qA+qB) is the classical way to combine two bounds - it is the next
  // semiconvergent - and it beats the midpoint far more often, with a much smaller
  // denominator. It is reported alongside rather than instead, so the comparison is visible.
  const boundRows = (key, maxLevels, mode) => {
    const k = constant(key);
    const x = k.exact || k.lo;
    const { rows, stopReason } = convergentRowsFor(key, maxLevels * 2 + 2, 'floor');
    const two = Rat.fromInt(2);
    const absR = (r) => (r.n < 0n ? Rat.neg(r) : r);
    const out = [];
    for (let i = 0; 2 * i + 1 < rows.length && out.length < maxLevels; i++) {
      let B = rows[2 * i], A = rows[2 * i + 1];
      // In balanced mode the denominator budget is the same - the larger of the two the
      // independent split would have used - but the pair is chosen to make the midpoint
      // best rather than to make each endpoint best. The independent pair is itself in the
      // pool, so balanced can never do worse.
      if (mode === 'balanced') {
        const bp = balancedPair(key, A.q > B.q ? A.q : B.q);
        if (bp) {
          B = { p: bp.lower.p, q: bp.lower.q };
          A = { p: bp.upper.p, q: bp.upper.q };
        }
      }
      const lower = Rat.make(B.p, B.q), upper = Rat.make(A.p, A.q);
      const mid = Rat.div(Rat.add(lower, upper), two);
      const mediant = Rat.make(B.p + A.p, B.q + A.q);
      const eLower = absR(Rat.sub(x, lower)), eUpper = absR(Rat.sub(x, upper));
      const eMid = absR(Rat.sub(x, mid)), eMediant = absR(Rat.sub(x, mediant));
      const width = Rat.sub(upper, lower);
      const bestEnd = Rat.cmp(eLower, eUpper) < 0 ? eLower : eUpper;
      out.push({
        k: i,
        lowerP: B.p, lowerQ: B.q, upperP: A.p, upperQ: A.q,
        lower, upper, mid, mediant,
        mediantP: B.p + A.p, mediantQ: B.q + A.q,
        eLower, eUpper, eMid, eMediant,
        eLowerStr: sci(eLower, 4), eUpperStr: sci(eUpper, 4),
        eMidStr: sci(eMid, 4), eMediantStr: sci(eMediant, 4),
        width, widthStr: sci(width, 4),
        midBeatsBoth: Rat.cmp(eMid, bestEnd) < 0,
        mediantBeatsMid: Rat.cmp(eMediant, eMid) < 0,
      });
    }
    return { rows: out, stopReason };
  };

  // ---- Mobius disks: the LFT picture of a real continued fraction ----
  //
  // T_n(z) = (A_n z + A_{n-1}) / (B_n z + B_{n-1}) has real coefficients and sends
  // 0 -> A_{n-1}/B_{n-1} and infinity -> A_n/B_n. It therefore maps the imaginary axis to
  // a circle through those two points, and the closed right half-plane to the DISK whose
  // diameter runs between consecutive convergents.
  //
  // Note the region matters: the image of the UNIT disk contains the target but successive
  // ones do NOT nest. The half-plane is the region each map sends inside itself, and its
  // images nest, shrink, and keep the target - all three asserted by tests.
  // Regular (floor) mode only. The half-plane-into-itself argument needs every numerator
  // to be +1 with positive terms; in the nearest, alternating and ceiling modes consecutive
  // convergents can land on the same side of the target, and the disk between them then
  // does not contain it at all. A test pins that failure so the restriction is not folklore.
  const mobiusDisks = (key, maxLevels) => {
    const mode = 'floor';
    const k = constant(key);
    const x = k.exact || k.lo;
    const { rows, stopReason } = convergentRowsFor(key, maxLevels + 2, mode);
    const two = Rat.fromInt(2);
    const disks = [];
    for (let n = 1; n < rows.length && disks.length < maxLevels; n++) {
      const a = Rat.make(rows[n - 1].p, rows[n - 1].q), b = Rat.make(rows[n].p, rows[n].q);
      const centre = Rat.div(Rat.add(a, b), two);
      const diff = Rat.sub(b, a);
      const radius = Rat.div(diff.n < 0n ? Rat.neg(diff) : diff, two);
      if (Rat.isZero(radius)) break;
      const off = Rat.sub(x, centre);
      const aoff = off.n < 0n ? Rat.neg(off) : off;
      const prev = disks.length ? disks[disks.length - 1] : null;
      disks.push({
        n, centre, radius,
        offset: aoff, offsetStr: sci(aoff, 4),
        offsetFrac: Rat.div(aoff, radius),
        offsetFracStr: Rat.toDecimalString(Rat.div(aoff, radius), 4),
        radiusStr: sci(radius, 4),
        shrink: prev ? Rat.div(radius, prev.radius) : null,
        shrinkStr: prev ? sci(Rat.div(radius, prev.radius), 3) : '—',
        containsTarget: Rat.cmp(off.n < 0n ? Rat.neg(off) : off, radius) <= 0,
        loLabel: `${rows[n - 1].p}/${rows[n - 1].q}`,
        hiLabel: `${rows[n].p}/${rows[n].q}`,
      });
    }
    return { disks, stopReason };
  };

  // ---- telescoping bracket cascade ----

  const cascadeRows = (key, mode, maxRows) => {
    const k = constant(key);
    const x = k.exact || k.lo;
    const { rows: cr } = convergentRowsFor(key, maxRows + 2, mode);
    const vals = cr.map(r => Rat.make(r.p, r.q));
    const labels = cr.map(r => `${r.p}/${r.q}`);
    const out = [];

    for (let n = 1; n < vals.length && out.length < maxRows; n++) {
      // Decide per row, not per mode: if consecutive convergents straddle the target the
      // bracket between them is the informative interval; otherwise the interval from the
      // target to the newer convergent is. Mixed modes need both, sometimes in one cascade.
      let lo, hi, loLabel, hiLabel;
      const a = vals[n - 1], b = vals[n];
      const aAbove = Rat.cmp(a, x) > 0, bAbove = Rat.cmp(b, x) > 0;
      if (aAbove !== bAbove) {
        if (Rat.cmp(a, b) < 0) { lo = a; hi = b; loLabel = labels[n - 1]; hiLabel = labels[n]; }
        else { lo = b; hi = a; loLabel = labels[n]; hiLabel = labels[n - 1]; }
      } else if (bAbove) {
        lo = x; hi = b; loLabel = 'x'; hiLabel = labels[n];
      } else {
        lo = b; hi = x; loLabel = labels[n]; hiLabel = 'x';
      }
      if (Rat.cmp(hi, lo) <= 0) break;            // an exact hit: nothing left to draw
      const width = Rat.sub(hi, lo);
      if (Rat.isZero(width)) break;

      // The view starts as the PREVIOUS row's interval padded 15% each side, so the nesting
      // shows. But a large term (pi's 292) can shrink a bracket thousands of times in one
      // step, collapsing it to an unreadable dot. So the view is also capped: it never spans
      // more than width/0.15, i.e. the bracket always occupies at least 15% of the row.
      // When that cap binds, the view is re-centred on this row's own bracket.
      const base = out.length ? out[out.length - 1] : { lo, hi, width };
      const pad = Rat.mul(base.width, Rat.make(15n, 100n));
      let viewLo = Rat.sub(base.lo, pad), viewHi = Rat.add(base.hi, pad);
      let span = Rat.sub(viewHi, viewLo);
      const maxSpan = Rat.div(width, Rat.make(15n, 100n));
      if (Rat.cmp(span, maxSpan) > 0) {
        const mid = Rat.div(Rat.add(lo, hi), Rat.fromInt(2));
        const half = Rat.div(maxSpan, Rat.fromInt(2));
        viewLo = Rat.sub(mid, half); viewHi = Rat.add(mid, half);
        span = maxSpan;
      }
      const pos = (v) => {
        const t = Rat.toNumber(Rat.div(Rat.sub(v, viewLo), span));
        return t < 0 ? 0 : t > 1 ? 1 : t;
      };

      out.push({
        n, lo, hi, width,
        brackets: Rat.cmp(lo, x) < 0 && Rat.cmp(x, hi) < 0,
        viewLo, viewHi,
        loPos: pos(lo), hiPos: pos(hi), targetPos: pos(x),
        loLabel, hiLabel,
        loAbove: Rat.cmp(lo, x) > 0, hiAbove: Rat.cmp(hi, x) > 0,
      });
    }
    return out;
  };

  // ---- minus ("Hirzebruch-Jung") continued fractions: b0 - 1/(b1 - 1/(b2 - ...)) ----

  const ratCeil = (a) => {
    const f = Rat.floor(a);
    return Rat.cmp(Rat.fromInt(f), a) === 0 ? f : f + 1n;
  };





  // ---- Dirichlet series and Euler products ----

  const ZETA_S = [2, 3, 4, 6];
  const MAX_ZETA_N = 200;

  const primesUpTo = (N) => {
    if (N < 2) return [];
    const sieve = new Uint8Array(N + 1);
    const out = [];
    for (let i = 2; i <= N; i++) {
      if (sieve[i]) continue;
      out.push(BigInt(i));
      for (let j = i * i; j <= N; j += i) sieve[j] = 1;
    }
    return out;
  };

  // Sum over EVERY integer up to N.
  const zetaPartialSum = (s, N) => {
    let acc = Rat.fromInt(0);
    for (let n = 1; n <= N; n++) acc = Rat.add(acc, Rat.make(1n, BigInt(n) ** BigInt(s)));
    return acc;
  };

  // Product over the PRIMES up to N: prod (1 - p^-s)^-1 = prod p^s/(p^s - 1).
  const eulerPartialProduct = (s, N) => {
    let acc = Rat.fromInt(1);
    for (const p of primesUpTo(N)) {
      const ps = p ** BigInt(s);
      acc = Rat.mul(acc, Rat.make(ps, ps - 1n));
    }
    return acc;
  };

  // One row per prime: the factor it contributes, and that factor minus 1 (the bar height).
  const primeFactorRows = (s, N) => primesUpTo(N).map(p => {
    const ps = p ** BigInt(s);
    const factor = Rat.make(ps, ps - 1n);
    return { p, factor, excess: Rat.sub(factor, Rat.fromInt(1)) };
  });

  // Integers whose prime factors are all <= N. 1 qualifies: it has no prime factors.
  const smoothNumbers = (N, limit) => {
    const ps = primesUpTo(Math.min(N, limit)).map(Number);
    const out = [];
    for (let m = 1; m <= limit; m++) {
      let r = m;
      for (const p of ps) while (r % p === 0) r /= p;
      if (r === 1) out.push(m);
    }
    return out;
  };

  const binomial = (n, k) => {
    let r = 1n;
    for (let i = 0n; i < k; i++) r = r * (n - i) / (i + 1n);
    return r;
  };

  // Apery's series: zeta(3) = (5/2) * sum_{n>=1} (-1)^(n-1) / (n^3 * C(2n,n)).
  // Gains roughly 0.6 decimal digits per term, and is exact in rationals.
  const apery = (terms) => {
    let sum = Rat.fromInt(0);
    for (let n = 1; n <= terms; n++) {
      const bn = BigInt(n);
      const t = Rat.make(1n, bn ** 3n * binomial(2n * bn, bn));
      sum = (n % 2 === 1) ? Rat.add(sum, t) : Rat.sub(sum, t);
    }
    return Rat.mul(Rat.make(5n, 2n), sum);
  };

  let APERY_CACHE = null;

  // Only s = 2, 3, 4, 6 ship: every target must be computable here. Even s comes from the
  // stored pi; zeta(3) from Apery's series. s = 5 has no closed form and no series cheap
  // enough to verify, so it is excluded rather than transcribed on faith.
  const zetaValue = (s) => {
    const pi = constant('pi').lo;
    const powPi = (k) => { let a = Rat.fromInt(1); for (let i = 0; i < k; i++) a = Rat.mul(a, pi); return a; };
    if (s === 2) return { rat: Rat.div(powPi(2), Rat.fromInt(6)),   label: 'ζ(2)', closedForm: 'π²/6' };
    if (s === 4) return { rat: Rat.div(powPi(4), Rat.fromInt(90)),  label: 'ζ(4)', closedForm: 'π⁴/90' };
    if (s === 6) return { rat: Rat.div(powPi(6), Rat.fromInt(945)), label: 'ζ(6)', closedForm: 'π⁶/945' };
    if (s === 3) {
      if (!APERY_CACHE) APERY_CACHE = trunc(apery(120), 50);
      return { rat: APERY_CACHE, label: 'ζ(3)', closedForm: null };
    }
    throw new Error(`zeta(${s}) is not shipped: only s = 2, 3, 4, 6 can be verified by this page`);
  };

  // ---- geometry: fit the largest square, repeatedly ----

  // The rectangle starts w/h = x with h = 1. Generation 0 cuts a0 squares of side h off the
  // left, leaving a taller-than-wide rectangle; generation 1 cuts a1 squares off the bottom,
  // and so on, alternating. x is rebuilt from the terms themselves, so the picture and the
  // term list can never disagree.
  const dissect = (terms, maxSquares) => {
    const cs = convergents(terms);
    const last = cs[cs.length - 1];
    const x = Rat.make(last.p, last.q);
    let rect = { x: Rat.fromInt(0), y: Rat.fromInt(0), w: x, h: Rat.fromInt(1) };
    const generations = [];
    let budget = maxSquares, truncated = false;
    for (let i = 0; i < terms.length; i++) {
      const horizontal = Rat.cmp(rect.w, rect.h) >= 0;
      const side = horizontal ? rect.h : rect.w;
      if (Rat.isZero(side)) break;
      let count = Number(terms[i]);
      if (count > budget) { count = budget; truncated = true; }
      const squares = [];
      for (let j = 0; j < count; j++) {
        const off = Rat.mul(Rat.fromInt(j), side);
        squares.push(horizontal
          ? { x: Rat.add(rect.x, off), y: rect.y, side }
          : { x: rect.x, y: Rat.add(rect.y, off), side });
      }
      const consumed = Rat.mul(Rat.fromInt(count), side);
      const next = horizontal
        ? { x: Rat.add(rect.x, consumed), y: rect.y, w: Rat.sub(rect.w, consumed), h: rect.h }
        : { x: rect.x, y: Rat.add(rect.y, consumed), w: rect.w, h: Rat.sub(rect.h, consumed) };
      generations.push({ index: i, count, side, squares, rect });   // rect is the PRE-cut rectangle
      budget -= count;
      rect = next;
      if (budget <= 0) { truncated = truncated || i < terms.length - 1; break; }
      if (Rat.isZero(rect.w) || Rat.isZero(rect.h)) break;
    }
    return { generations, truncated };
  };

  // ---- generalized continued fractions: b0 + a1/(b1 + a2/(b2 + ...)) ----

  const primes = (count) => {
    const out = [];
    const limit = Math.max(20, Math.ceil(count * (Math.log(count + 2) + Math.log(Math.log(count + 2)) + 1)));
    const sieve = new Uint8Array(limit + 1);
    for (let i = 2; i <= limit && out.length < count; i++) {
      if (sieve[i]) continue;
      out.push(BigInt(i));
      for (let j = i * i; j <= limit; j += i) sieve[j] = 1;
    }
    return out;
  };

  let PRIME_CACHE = primes(200);
  const primeAt = (n) => {
    if (n > PRIME_CACHE.length) PRIME_CACHE = primes(n * 2);
    return PRIME_CACHE[n - 1];
  };

  // Sequence values for the irrational entries are truncated to 30 decimals. The full
  // enclosure would make the exact recurrence carry thousands of digits by level 60,
  // slow enough to stutter on a slider drag; 30 decimals is far beyond what is displayed.
  const GEN_SEQ_DIGITS = 30;
  const constRat = (key) => trunc(constant(key).lo, GEN_SEQ_DIGITS);

  const SEQUENCES = [
    { key: 'one',    label: '1',            irrational: false, at: () => Rat.fromInt(1) },
    { key: 'n',      label: 'n',            irrational: false, at: (n) => Rat.fromInt(n) },
    { key: 'n1',     label: 'n + 1',        irrational: false, at: (n) => Rat.fromInt(n + 1) },
    { key: 'odd',    label: '2n − 1',  irrational: false, at: (n) => Rat.fromInt(2 * n - 1) },
    { key: 'oddp',   label: '2n + 1',       irrational: false, at: (n) => Rat.fromInt(2 * n + 1) },
    { key: 'n2',     label: 'n²',      irrational: false, at: (n) => Rat.fromInt(n * n) },
    { key: 'odd2',   label: '(2n − 1)²', irrational: false, at: (n) => Rat.fromInt((2 * n - 1) ** 2) },
    { key: 'prime',  label: 'nth prime',    irrational: false, at: (n) => ({ n: primeAt(n), d: 1n }) },
    { key: 'prime2', label: '(nth prime)²', irrational: false, at: (n) => { const q = primeAt(n); return { n: q * q, d: 1n }; } },
    { key: 'pi',     label: 'π',       irrational: true, truncated: true, at: () => constRat('pi') },
    { key: 'e',      label: 'e',            irrational: true, truncated: true, at: () => constRat('e') },
    { key: 'sqrt2',  label: '√2',      irrational: true, truncated: true, at: () => constRat('sqrt2') },
    { key: 'k',      label: 'k',            irrational: true,  at: () => Rat.fromInt(1) },
    // Complex entries. They count as irrational for the term cap: CRat values grow
    // the same way, and the recurrence costs the same.
    { key: 'i',      label: 'i',            irrational: true, complex: true,
      at: () => cOf(Rat.fromInt(0), Rat.fromInt(1)) },
    { key: 'ni',     label: 'n\u00b7i',         irrational: true, complex: true,
      at: (n) => cOf(Rat.fromInt(0), Rat.fromInt(n)) },
    { key: 'onepi',  label: '1 + i',        irrational: true, complex: true,
      at: () => cOf(Rat.fromInt(1), Rat.fromInt(1)) },
  ];

  const seq = (key, k) => {
    const s = SEQUENCES.find(x => x.key === key);
    if (!s) throw new Error('unknown sequence ' + key);
    if (key === 'k') {
      // An integer k keeps the higher term cap; only a fractional one counts as irrational.
      const v = k || Rat.fromInt(1);
      return { key, label: 'k', irrational: v.d !== 1n, at: () => v };
    }
    return s;
  };

  const MAX_GEN_TERMS_INT = 150;
  const MAX_GEN_TERMS_IRRATIONAL = 60;

  const genConvergents = ({ b0, aSeq, bSeq, negateA, terms }) => {
    const cap = (aSeq.irrational || bSeq.irrational) ? MAX_GEN_TERMS_IRRATIONAL : MAX_GEN_TERMS_INT;
    const N = Math.min(terms, cap);
    const complex = !!(aSeq.complex || bSeq.complex);
    const O = complex ? CRAT_OPS : RAT_OPS;
    let Am1 = O.one, A0 = O.lift(b0), Bm1 = O.zero, B0 = O.one;
    const values = [];
    for (let n = 1; n <= N; n++) {
      let a = O.lift(aSeq.at(n));
      if (negateA) a = O.neg(a);
      const b = O.lift(bSeq.at(n));
      const A = O.add(O.mul(b, A0), O.mul(a, Am1));
      const B = O.add(O.mul(b, B0), O.mul(a, Bm1));
      Am1 = A0; A0 = A; Bm1 = B0; B0 = B;
      values.push(O.isZero(B0) ? O.zero : O.div(A0, B0));
    }
    return { values, cap, complex };
  };

  // Constant denominators (2 and 6) ride on the `k` sequence rather than getting
  // single-purpose menu entries; the UI sets the k input when a preset is loaded.
  const GEN_PRESETS = [
    { key: 'brouncker', label: 'Brouncker: 4/π = 1 + 1²/(2 + 3²/(2 + 5²/(2 + …)))',
      b0: Rat.fromInt(1), aKey: 'odd2', bKey: 'k', kValue: Rat.fromInt(2), negateA: false, expect: null },
    { key: 'pi-6', label: 'π = 3 + 1²/(6 + 3²/(6 + 5²/(6 + …)))',
      b0: Rat.fromInt(3), aKey: 'odd2', bKey: 'k', kValue: Rat.fromInt(6), negateA: false, expect: 'pi' },
    { key: 'e-ladder', label: 'e = 2 + 2/(2 + 3/(3 + 4/(4 + …)))',
      b0: Rat.fromInt(2), aKey: 'n1', bKey: 'n1', kValue: null, negateA: false, expect: 'e' },
    { key: 'sqrt2', label: '√2 = 1 + 1/(2 + 1/(2 + …))',
      b0: Rat.fromInt(1), aKey: 'one', bKey: 'k', kValue: Rat.fromInt(2), negateA: false, expect: 'sqrt2' },
  ];

  const NAMED_VALUES = () => {
    const c = (k) => constant(k).lo;
    const R = Rat, i = Rat.fromInt;
    return [
      { label: 'π', value: c('pi') },
      { label: 'e', value: c('e') },
      { label: '√2', value: c('sqrt2') },
      { label: '√3', value: c('sqrt3') },
      { label: '√5', value: c('sqrt5') },
      { label: 'φ', value: c('phi') },
      { label: 'ln 2', value: c('ln2') },
      { label: 'γ', value: c('gamma') },
      { label: '∛2', value: c('cbrt2') },
      { label: 'π/2', value: R.div(c('pi'), i(2)) },
      { label: 'π/4', value: R.div(c('pi'), i(4)) },
      { label: '4/π', value: R.div(i(4), c('pi')) },
      { label: '2/π', value: R.div(i(2), c('pi')) },
      { label: 'π²', value: R.mul(c('pi'), c('pi')) },
      { label: 'π²/6', value: R.div(R.mul(c('pi'), c('pi')), i(6)) },
      { label: 'e − 1', value: R.sub(c('e'), i(1)) },
      { label: '1/e', value: R.div(i(1), c('e')) },
      { label: 'e²', value: R.mul(c('e'), c('e')) },
      { label: 'ln 10', value: Rat.fromDecimalString('2.302585092994045684017991454684364207601101488628772976033') },
      { label: 'Catalan G', value: Rat.fromDecimalString('0.915965594177219015054603514932384110774149374281672134266') },
      { label: 'ζ(3)', value: Rat.fromDecimalString('1.202056903159594285399738161511449990764986292340498881792') },
      { label: '1 + √2', value: R.add(i(1), c('sqrt2')) },
    ];
  };

  let NAMED = null;
  // Report the tightest precision at which a value matches something named, so the panel can
  // say "agrees to 6 digits" instead of a bare yes/no. Floors at 4 digits: looser than that,
  // an agreement is coincidence rather than evidence.
  const identifyGraded = (r, maxDigits = 12, minDigits = 4) => {
    for (let d = maxDigits; d >= minDigits; d--) {
      const hit = identify(r, d);
      if (hit.matched) return { label: hit.label, matched: true, digits: d };
    }
    return { label: 'no match in the table', matched: false, digits: 0 };
  };

  // Compare with a tolerance rather than by comparing truncated decimal strings: two values
  // differing by far less than 10^-digits still print differently across a digit boundary.
  const identify = (r, digits = 12) => {
    if (!NAMED) NAMED = NAMED_VALUES();
    const tol = Rat.make(1n, 10n ** BigInt(digits));
    for (const nv of NAMED) {
      const d = Rat.sub(r, nv.value);
      const abs = d.n < 0n ? Rat.neg(d) : d;
      if (Rat.cmp(abs, tol) < 0) return { label: nv.label, matched: true };
    }
    return { label: 'no match in the table', matched: false };
  };

  // ---- best rational approximation, checked by exhaustive search ----

  const MAX_RACE_Q = 200000;

  const bestApproximations = (key, Q, count) => {
    if (Q > MAX_RACE_Q) throw new Error(`denominator ${Q} exceeds the searchable limit ${MAX_RACE_Q}`);
    const k = constant(key);
    const x = k.exact || k.lo;
    const xd = Rat.toNumber(x);
    // Stage 1: scan in doubles. The errors being compared are of order 1/q^2 >= 2.5e-11 at
    // Q = 2e5, five orders of magnitude above double rounding noise, so the shortlist is safe.
    const shortlist = [];
    let worst = Infinity;
    for (let q = 1; q <= Q; q++) {
      const p = Math.round(xd * q);
      const err = Math.abs(xd - p / q);
      if (shortlist.length < 50 || err < worst) {
        shortlist.push({ p: BigInt(p), q: BigInt(q), err });
        shortlist.sort((a, b) => a.err - b.err);
        if (shortlist.length > 50) shortlist.pop();
        worst = shortlist[shortlist.length - 1].err;
      }
    }
    // Stage 2: re-rank the shortlist in exact arithmetic.
    return shortlist.map(c => {
      const error = Rat.sub(x, Rat.make(c.p, c.q));
      const abs = error.n < 0n ? Rat.neg(error) : error;
      return { p: c.p, q: c.q, error, abs, errorStr: sci(error, 5) };
    }).sort((a, b) => Rat.cmp(a.abs, b.abs)).slice(0, count);
  };

  const convergentRowsFor = (key, maxTerms, mode) => {
    const k = constant(key);
    const x = k.exact || k.lo;
    const e = expandMode(key, mode, maxTerms);
    const cs = semiregularConvergents(e.terms, e.signs);
    // |x_k - a_k|, the distance from the complete quotient to the integer it rounded to -
    // the part the algorithm discards. Derived from the convergents as
    // |q_k e_k| / |q_{k-1} e_{k-1}| (with the k=0 denominator 1, since q_{-1}=0, p_{-1}=1),
    // so it works whatever produced the terms, including the periodic generator.
    let prevScaled = Rat.fromInt(1);
    const rows = cs.map((c, i) => {
      const val = Rat.make(c.p, c.q);
      const error = Rat.sub(x, val);
      const abs = error.n < 0n ? Rat.neg(error) : error;
      const scaled = Rat.mul(Rat.fromInt(c.q), abs);
      const rem = Rat.isZero(prevScaled) ? Rat.fromInt(0) : Rat.div(scaled, prevScaled);
      prevScaled = scaled;
      return {
        rem, remStr: Rat.toDecimalString(rem, 6),
        n: i, a: e.terms[i], sign: i === 0 ? 1 : e.signs[i - 1], p: c.p, q: c.q,
        decimal: Rat.toDecimalString(val, 20),
        error, errorStr: sci(error, 5),
        errQ2: Rat.toDecimalString(Rat.mul(abs, Rat.fromInt(c.q * c.q)), 6),
      };
    });
    return { rows, stopReason: e.stopReason, source: e.source };
  };

  const convergentRows = (key, maxTerms) => convergentRowsFor(key, maxTerms, 'floor');

  // The closest fractions strictly ABOVE the target. Minus convergents are one-sided
  // best approximations, so this is the race they are actually the answer to.
  const bestApproximationsAbove = (key, Q, count) => {
    if (Q > MAX_RACE_Q) throw new Error(`denominator ${Q} exceeds the searchable limit ${MAX_RACE_Q}`);
    const k = constant(key);
    const x = k.exact || k.lo;
    const xd = Rat.toNumber(x);
    const shortlist = [];
    let worst = Infinity;
    for (let q = 1; q <= Q; q++) {
      const p = Math.ceil(xd * q);
      const err = p / q - xd;
      if (err < 0) continue;                       // double noise near an exact hit
      if (shortlist.length < 50 || err < worst) {
        shortlist.push({ p: BigInt(p), q: BigInt(q), err });
        shortlist.sort((a, b) => a.err - b.err);
        if (shortlist.length > 50) shortlist.pop();
        worst = shortlist[shortlist.length - 1].err;
      }
    }
    return shortlist.map(c => {
      const error = Rat.sub(x, Rat.make(c.p, c.q));
      const abs = error.n < 0n ? Rat.neg(error) : error;
      return { p: c.p, q: c.q, error, abs, errorStr: sci(error, 5) };
    })
      .filter(c => Rat.cmp(Rat.make(c.p, c.q), x) > 0)   // exact filter, not the double one
      .sort((a, b) => Rat.cmp(a.abs, b.abs))
      .slice(0, count);
  };

  return { bgcd, isqrt, Rat, trunc, ratSqrt, ratCbrt, ratExp1, ratLn2, ratArctanInv, ratPiMachin,
           CONSTANTS, constant, EPS,
           quadraticTerms, expandMode,
           convergents, sci, convergentRows, convergentRowsFor,
           MAX_RACE_Q, bestApproximations, bestApproximationsAbove,
           primes, SEQUENCES, seq, GEN_SEQ_DIGITS, MAX_GEN_TERMS_INT, MAX_GEN_TERMS_IRRATIONAL,
           genConvergents, GEN_PRESETS, identify, identifyGraded, RAT_OPS, CRAT_OPS,
           dissect,
           ZETA_S, MAX_ZETA_N, primesUpTo, zetaPartialSum, eulerPartialProduct, smoothNumbers,
           primeFactorRows, binomial, apery, zetaValue,
           ratCeil,
           cascadeRows, raceKind, mobiusDisks, boundRows, semiconvergents, balancedPair, unitFractions, unitFractionRows,
           cOf, cAdd, cSub, cMul, cNormSq, cInv, cIsZero, cNearestGaussian, cStr, ratSqrtLower,
           COMPLEX_CONSTANTS, complexConstant, hurwitzTerms, hurwitzConvergents, hurwitzRows,
           imaginaryWake,
           SEMI_MODES, ratRound, pickInteger, semiregularTerms, semiregularConvergents };
})();

XTests.test('Rat reduces and normalizes sign', () => {
  const r = CF.Rat.make(6n, -4n);
  XTests.eq(r.n, -3n); XTests.eq(r.d, 2n);
  XTests.eq(CF.Rat.make(0n, 5n).d, 1n);
});

XTests.test('Rat arithmetic', () => {
  const { Rat } = CF;
  const a = Rat.make(1n, 3n), b = Rat.make(1n, 6n);
  XTests.eq(Rat.toDecimalString(Rat.add(a, b), 4), '0.5000');
  XTests.eq(Rat.toDecimalString(Rat.sub(a, b), 4), '0.1666');
  XTests.eq(Rat.toDecimalString(Rat.mul(a, b), 6), '0.055555');
  XTests.eq(Rat.toDecimalString(Rat.div(a, b), 4), '2.0000');
  XTests.eq(Rat.cmp(a, b), 1); XTests.eq(Rat.cmp(b, a), -1); XTests.eq(Rat.cmp(a, a), 0);
});

XTests.test('Rat.floor floors, does not truncate', () => {
  XTests.eq(CF.Rat.floor(CF.Rat.make(7n, 2n)), 3n);
  XTests.eq(CF.Rat.floor(CF.Rat.make(-7n, 2n)), -4n);
  XTests.eq(CF.Rat.floor(CF.Rat.make(-4n, 2n)), -2n);
});

XTests.test('Rat decimal round trip', () => {
  const r = CF.Rat.fromDecimalString('3.14159265358979');
  XTests.eq(CF.Rat.toDecimalString(r, 14), '3.14159265358979');
  XTests.eq(CF.Rat.toDecimalString(CF.Rat.neg(r), 5), '-3.14159');

});

XTests.test('a low-precision enclosure stops honestly', () => {

  XTests.eq(r.stopReason, 'precision-exhausted');
  // Five digits of pi pin down only [3; 7]: the next complete quotient straddles
  // 15.997..16.09, so its floor is genuinely unknown and no third term is emitted.
  XTests.eq(r.terms.join(','), '3,7');
});

XTests.test('every convergent satisfies |x - p/q| q^2 < 1', () => {
  for (const key of ['pi', 'e', 'sqrt2', 'sqrt3', 'phi', 'ln2', 'gamma', 'cbrt2']) {
    const { rows } = CF.convergentRows(key, 20);
    for (const row of rows) {
      const abs = row.error.n < 0n ? CF.Rat.neg(row.error) : row.error;
      const v = CF.Rat.mul(abs, CF.Rat.fromInt(row.q * row.q));   // |x - p/q| * q^2
      XTests.ok(CF.Rat.cmp(v, CF.Rat.fromInt(1)) < 0, `${key} n=${row.n} errQ2=${row.errQ2}`);
    }
  }
});

XTests.test('every convergent of pi wins its own denominator race', () => {

  for (const row of rows) {

    const best = CF.bestApproximations('pi', Number(row.q), 1)[0];
    XTests.eq(`${best.p}/${best.q}`, `${row.p}/${row.q}`, `n=${row.n}`);

});

XTests.test('Brouncker converges to 4/pi', () => {
  const p = CF.GEN_PRESETS.find(x => x.key === 'brouncker');
  const { values } = CF.genConvergents({
    b0: p.b0, aSeq: CF.seq(p.aKey, p.kValue), bSeq: CF.seq(p.bKey, p.kValue),
    negateA: p.negateA, terms: 120 });
  const last = values[values.length - 1];
  const target = CF.Rat.div(CF.Rat.fromInt(4), CF.constant('pi').lo);
  const diff = CF.Rat.sub(last, target);
  const abs = diff.n < 0n ? CF.Rat.neg(diff) : diff;
  XTests.ok(CF.Rat.cmp(abs, CF.Rat.fromDecimalString('0.01')) < 0, `off by ${CF.sci(abs, 4)}`);
});

XTests.test('every preset converges to the constant it claims', () => {
  for (const p of CF.GEN_PRESETS) {
    if (!p.expect) continue;
    const { values } = CF.genConvergents({
      b0: p.b0, aSeq: CF.seq(p.aKey, p.kValue), bSeq: CF.seq(p.bKey, p.kValue),
      negateA: p.negateA, terms: 120 });
    const last = values[values.length - 1];
    // 5 digits, not more: the pi = 3 + 1^2/(6 + ...) form is only good to ~3e-7 after 120 levels.
    const id = CF.identify(last, 5);
    XTests.eq(id.label, CF.constant(p.expect).label, `preset ${p.key} identified as ${id.label}`);
  }
});

XTests.test('both arithmetic ops objects obey the ring laws', () => {
  const R = CF.Rat;
  const a = R.make(3n, 7n);
  XTests.eq(R.cmp(CF.RAT_OPS.add(a, CF.RAT_OPS.zero), a), 0);
  XTests.eq(R.cmp(CF.RAT_OPS.mul(a, CF.RAT_OPS.one), a), 0);
  XTests.ok(CF.RAT_OPS.isZero(CF.RAT_OPS.sub(a, a)));
  const z = CF.cOf(R.make(3n, 7n), R.make(-2n, 5n));
  const sum = CF.CRAT_OPS.add(z, CF.CRAT_OPS.zero);
  XTests.eq(R.cmp(sum.re, z.re), 0); XTests.eq(R.cmp(sum.im, z.im), 0);
  const prod = CF.CRAT_OPS.mul(z, CF.CRAT_OPS.one);
  XTests.eq(R.cmp(prod.re, z.re), 0); XTests.eq(R.cmp(prod.im, z.im), 0);
  XTests.ok(CF.CRAT_OPS.isZero(CF.CRAT_OPS.sub(z, z)));
});

XTests.test('dissection of a rational terminates on an exact square', () => {
  const terms = CF.expandMode('r355_113', 'floor', 10).terms;  // 3, 7, 16
  const d = CF.dissect(terms, 1000);
  // The final generation consumes its rectangle exactly: nothing is left over.
  const last = d.generations[d.generations.length - 1];
  const consumed = CF.Rat.mul(CF.Rat.fromInt(last.count), last.side);
  const long = CF.Rat.cmp(last.rect.w, last.rect.h) >= 0 ? last.rect.w : last.rect.h;
  XTests.eq(CF.Rat.cmp(consumed, long), 0, 'remainder was not empty');
});

XTests.test('the remainder after each generation is the reciprocal complete quotient', () => {
  // dissect rebuilds x from the terms it is given, so use enough of them that the
  // rebuilt ratio agrees with sqrt2 to the six digits compared below.
  const terms = CF.expandMode('sqrt2', 'floor', 12).terms;
  const d = CF.dissect(terms, 1000);
  const g = d.generations[1];   // the rectangle left over after generation 0
  const ratio = CF.Rat.div(g.rect.w, g.rect.h);
  const flipped = CF.Rat.cmp(ratio, CF.Rat.fromInt(1)) < 0 ? CF.Rat.div(CF.Rat.fromInt(1), ratio) : ratio;
  XTests.eq(CF.Rat.toDecimalString(flipped, 6), '2.414213');
});

});

XTests.test('every square lies inside the starting rectangle', () => {
  const terms = CF.expandMode('pi', 'floor', 6).terms;
  const d = CF.dissect(terms, 200);
  const x = CF.Rat.div(CF.Rat.fromInt(355), CF.Rat.fromInt(113));
  for (const g of d.generations) for (const sq of g.squares) {
    XTests.ok(CF.Rat.cmp(CF.Rat.add(sq.x, sq.side), CF.Rat.add(x, CF.Rat.make(1n, 1000n))) <= 0, 'square escaped in x');
    XTests.ok(CF.Rat.cmp(CF.Rat.add(sq.y, sq.side), CF.Rat.fromDecimalString('1.001')) <= 0, 'square escaped in y');
  }
});

XTests.test('zeta closed forms match powers of pi', () => {
  const pi = CF.constant('pi').lo;
  const pow = (r, k) => { let a = CF.Rat.fromInt(1); for (let i = 0; i < k; i++) a = CF.Rat.mul(a, r); return a; };
  for (const [s, k, den] of [[2, 2, 6], [4, 4, 90], [6, 6, 945]]) {
    const want = CF.Rat.div(pow(pi, k), CF.Rat.fromInt(den));
    XTests.eq(CF.Rat.toDecimalString(CF.zetaValue(s).rat, 30),
              CF.Rat.toDecimalString(want, 30), `zeta(${s})`);

});

XTests.test('zeta(3) sits inside a brute-force enclosure', () => {
  // Sum to N=2000 plus the integral tail bound 1/(2N^2) brackets zeta(3).
  const lo = CF.zetaPartialSum(3, 2000);
  const hi = CF.Rat.add(lo, CF.Rat.make(1n, 2n * 2000n * 2000n));
  const z = CF.zetaValue(3).rat;
  XTests.ok(CF.Rat.cmp(lo, z) < 0 && CF.Rat.cmp(z, hi) < 0, 'zeta(3) outside its own enclosure');
});

XTests.test('the Euler product equals the sum over smooth numbers', () => {
  // prod_{p<=N} (1-p^-s)^-1 = sum over N-smooth integers of 1/n^s. Unique factorisation.
  // The smooth sum has to stop at `limit`, so it sits just below the product. The gap must be
  // positive and no larger than the whole tail sum_{m>limit} 1/m^s < 1/((s-1) limit^(s-1)).
  for (const [s, N, limit] of [[2, 5, 20000], [2, 11, 20000], [3, 7, 4000], [4, 13, 2000]]) {
    const prod = CF.eulerPartialProduct(s, N);
    let smooth = CF.Rat.fromInt(0);
    for (const m of CF.smoothNumbers(N, limit)) {
      smooth = CF.Rat.add(smooth, CF.Rat.make(1n, BigInt(m) ** BigInt(s)));
    }
    const gap = CF.Rat.sub(prod, smooth);
    const tailBound = CF.Rat.make(1n, BigInt(s - 1) * BigInt(limit) ** BigInt(s - 1));
    XTests.ok(CF.Rat.cmp(gap, CF.Rat.fromInt(0)) > 0, `s=${s} N=${N}: smooth sum exceeded the product`);
    XTests.ok(CF.Rat.cmp(gap, tailBound) < 0,
              `s=${s} N=${N}: gap ${CF.sci(gap, 4)} exceeded the tail bound ${CF.sci(tailBound, 4)}`);
  }
});

XTests.test('both sides climb toward zeta(s) and never overshoot', () => {
  for (const s of CF.ZETA_S) {
    const z = CF.zetaValue(s).rat;
    let prevSum = null, prevProd = null;
    for (let N = 2; N <= 60; N++) {
      const sum = CF.zetaPartialSum(s, N);
      const prod = CF.eulerPartialProduct(s, N);
      XTests.ok(CF.Rat.cmp(sum, z) < 0, `sum overshot zeta(${s}) at N=${N}`);
      XTests.ok(CF.Rat.cmp(prod, z) < 0, `product overshot zeta(${s}) at N=${N}`);
      if (prevSum) XTests.ok(CF.Rat.cmp(sum, prevSum) > 0, `sum not increasing at N=${N}`);
      if (prevProd) XTests.ok(CF.Rat.cmp(prod, prevProd) >= 0, `product decreased at N=${N}`);
      prevSum = sum; prevProd = prod;
    }
  }
});

XTests.test('the product is closer than the sum for every N >= 4', () => {
  for (const s of CF.ZETA_S) {
    const z = CF.zetaValue(s).rat;
    for (let N = 4; N <= 60; N++) {
      const errSum = CF.Rat.sub(z, CF.zetaPartialSum(s, N));
      const errProd = CF.Rat.sub(z, CF.eulerPartialProduct(s, N));
      XTests.ok(CF.Rat.cmp(errProd, errSum) < 0, `s=${s} N=${N}: product error was not smaller`);
    }
  }
});

XTests.test('the diameter construction fails outside regular mode - why it is restricted', () => {
  // In nearest mode consecutive convergents of pi can sit on the SAME side of pi, so the
  // disk spanning them misses the target entirely. That is why mobiusDisks is floor-only.
  const rows = CF.convergentRowsFor('pi', 6, 'nearest').rows;
  const x = CF.constant('pi').lo;
  let sawMiss = false;
  for (let n = 1; n < rows.length; n++) {
    const a = CF.Rat.make(rows[n - 1].p, rows[n - 1].q), b = CF.Rat.make(rows[n].p, rows[n].q);
    const centre = CF.Rat.div(CF.Rat.add(a, b), CF.Rat.fromInt(2));
    const diff = CF.Rat.sub(b, a);
    const radius = CF.Rat.div(diff.n < 0n ? CF.Rat.neg(diff) : diff, CF.Rat.fromInt(2));
    const off = CF.Rat.sub(x, centre);
    if (CF.Rat.cmp(off.n < 0n ? CF.Rat.neg(off) : off, radius) > 0) sawMiss = true;
  }
  XTests.ok(sawMiss, 'expected at least one nearest-mode disk to miss the target');
});

XTests.test('a disk diameter runs between consecutive convergents', () => {
  const rows = CF.convergentRowsFor('pi', 9, 'floor').rows;

  for (const d of disks) {
    const a = CF.Rat.make(rows[d.n - 1].p, rows[d.n - 1].q);
    const b = CF.Rat.make(rows[d.n].p, rows[d.n].q);
    const mid = CF.Rat.div(CF.Rat.add(a, b), CF.Rat.fromInt(2));
    XTests.eq(CF.Rat.cmp(d.centre, mid), 0, `level ${d.n} centre`);
    const diff = CF.Rat.sub(b, a);
    const half = CF.Rat.div(diff.n < 0n ? CF.Rat.neg(diff) : diff, CF.Rat.fromInt(2));
    XTests.eq(CF.Rat.cmp(d.radius, half), 0, `level ${d.n} radius`);
  }
});

XTests.test('the unit-disk construction does NOT nest - regression guard', () => {
  // Kept so the wrong geometry cannot quietly return: the image of the UNIT disk under
  // T_n has radius 1/||B_{n-1}|^2 - |B_n|^2| and contains the target, but successive
  // ones are not nested. The half-plane image, used above, is the construction that works.
  const rows = CF.convergentRowsFor('pi', 9, 'floor').rows;
  let Am1 = 1n, Bm1 = 0n, prev = null, nested = true;
  for (const r of rows) {
    const den = Bm1 * Bm1 - r.q * r.q;
    if (den !== 0n) {
      const c = Number(Am1 * Bm1 - r.p * r.q) / Number(den), rad = 1 / Math.abs(Number(den));
      if (prev && Math.abs(c - prev.c) + rad > prev.rad * (1 + 1e-12)) nested = false;
      prev = { c, rad };
    }
    Am1 = r.p; Bm1 = r.q;
  }
  XTests.ok(!nested, 'the unit-disk images unexpectedly nested - re-check the geometry');
});

XTests.test('cascade rows stay nested and drawable in all four modes', () => {
  for (const m of CF.SEMI_MODES) {
    for (const key of ['pi', 'e', 'phi']) {

      for (let i = 1; i < rows.length; i++) {

  let rem = CF.Rat.sub(k.lo, CF.Rat.fromInt(r.whole));

    XTests.ok(CF.Rat.cmp(CF.Rat.make(1n, n), rem) <= 0, `1/${n} overshot the remainder`);

});
