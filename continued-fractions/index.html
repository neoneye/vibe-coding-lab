XTests.test('denominators strictly increase', () => {
  for (const key of ['pi', 'e', 'sqrt2', 'gamma']) {
    const { rows } = CF.unitFractionRows(key, 5);
    for (let i = 1; i < rows.length; i++) {
      XTests.ok(rows[i].den > rows[i - 1].den,
                `${key}: ${rows[i].den} did not exceed ${rows[i - 1].den}`);
    }
  }
});

XTests.test('a rational terminates exactly', () => {
  const k = CF.constant('r355_113');
  const r = CF.unitFractions(k.exact, k.exact, 40);
  XTests.eq(r.stopReason, 'exact');
  let sum = CF.Rat.fromInt(r.whole);
  for (const n of r.dens) sum = CF.Rat.add(sum, CF.Rat.make(1n, n));
  XTests.eq(CF.Rat.cmp(sum, k.exact), 0, 'partial sum did not reach 355/113');
});

XTests.test('the expansion stops when the enclosure cannot determine a denominator', () => {
  const lo = CF.Rat.fromDecimalString('3.14159');
  const hi = CF.Rat.add(lo, CF.Rat.make(1n, 100000n));
  const r = CF.unitFractions(lo, hi, 20);
  XTests.eq(r.stopReason, 'precision-exhausted');
  XTests.ok(r.dens.length < 5, `expected a short expansion, got ${r.dens.length}`);
  XTests.eq(r.dens.slice(0, 2).join(','), '8,61');
});

XTests.test('the integer part is withheld when the enclosure straddles an integer', () => {
  const lo = CF.Rat.fromDecimalString('2.9999');
  const hi = CF.Rat.fromDecimalString('3.0001');
  const r = CF.unitFractions(lo, hi, 5);
  XTests.eq(r.stopReason, 'precision-exhausted');
  XTests.eq(r.dens.length, 0);
});

XTests.test('unitFractionRows reports digits and shrinking error', () => {
  const { rows } = CF.unitFractionRows('pi', 5);
  XTests.eq(rows[0].den, 8n);
  XTests.eq(rows[0].digits, 1);
  XTests.eq(rows[3].digits, 9);            // 128541455
  XTests.eq(rows[4].digits, 18);           // 162924332716605980
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1].error, b = rows[i].error;
    XTests.ok(CF.Rat.cmp(b, a) < 0, `error did not shrink at row ${i}`);
  }
});

XTests.test('Gaussian rational arithmetic is exact', () => {
  const R = CF.Rat, i = (n) => R.fromInt(n);
  const a = CF.cOf(i(3), i(4)), b = CF.cOf(i(1), i(-2));
  XTests.eq(CF.cStr(CF.cAdd(a, b), 0), '4+2i');
  XTests.eq(CF.cStr(CF.cSub(a, b), 0), '2+6i');
  XTests.eq(CF.cStr(CF.cMul(a, b), 0), '11-2i');      // (3+4i)(1-2i) = 11 - 2i
  XTests.eq(R.toDecimalString(CF.cNormSq(a), 0), '25');
});

XTests.test('complex inversion round-trips exactly', () => {
  const R = CF.Rat;
  const z = CF.cOf(R.make(3n, 7n), R.make(-2n, 5n));
  const back = CF.cInv(CF.cInv(z));
  XTests.eq(R.cmp(back.re, z.re), 0);
  XTests.eq(R.cmp(back.im, z.im), 0);
  const one = CF.cMul(z, CF.cInv(z));
  XTests.eq(R.toDecimalString(one.re, 6), '1.000000');
  XTests.eq(R.toDecimalString(one.im, 6), '0.000000');
});

XTests.test('nearest Gaussian integer rounds each part', () => {
  const R = CF.Rat;
  XTests.eq(CF.cStr(CF.cNearestGaussian(CF.cOf(R.make(7n, 2n), R.make(-7n, 2n))), 0), '4-3i');
  XTests.eq(CF.cStr(CF.cNearestGaussian(CF.cOf(R.make(1n, 3n), R.make(5n, 3n))), 0), '0+2i');
});

XTests.test('ratSqrtLower never overestimates', () => {
  const R = CF.Rat;
  for (const [n, d] of [[2n, 1n], [1n, 2n], [7n, 3n], [1n, 1000000n], [123456n, 7n]]) {
    const m = R.make(n, d);
    const L = CF.ratSqrtLower(m, 30);
    XTests.ok(R.cmp(R.mul(L, L), m) <= 0, `L^2 exceeded m for ${n}/${d}`);
    const up = R.add(L, R.make(1n, 10n ** 30n));
    XTests.ok(R.cmp(R.mul(up, up), m) > 0, `L was far too small for ${n}/${d}`);
  }
  XTests.eq(R.toDecimalString(CF.ratSqrtLower(R.fromInt(0), 10), 4), '0.0000');
});

XTests.test('Hurwitz expansion of pi + e i', () => {
  const k = CF.complexConstant('pi_e_i');
  const r = CF.hurwitzTerms(k.centre, k.delta, 4);
  XTests.eq(r.terms.map(t => CF.cStr(t, 0)).join(' '), '3+3i 1+3i 2+1i 1+5i');
});

XTests.test('a Gaussian rational terminates exactly', () => {
  const k = CF.complexConstant('g45');
  XTests.eq(CF.Rat.isZero(k.delta), true, 'g45 must ship exactly');
  const r = CF.hurwitzTerms(k.centre, k.delta, 20);
  XTests.eq(r.stopReason, 'exact');
  XTests.eq(r.terms.map(t => CF.cStr(t, 0)).join(' '), '1+1i -2+1i');
  const cs = CF.hurwitzConvergents(r.terms);
  const last = cs[cs.length - 1];
  const v = CF.cMul(last.A, CF.cInv(last.B));
  XTests.eq(CF.Rat.cmp(v.re, k.centre.re), 0);
  XTests.eq(CF.Rat.cmp(v.im, k.centre.im), 0);
});

XTests.test('i*sqrt7 is periodic: 3i, 3i, then 6i and 3i alternating', () => {
  const k = CF.complexConstant('quad7');
  const r = CF.hurwitzTerms(k.centre, k.delta, 7);
  XTests.eq(r.terms.map(t => CF.cStr(t, 0)).join(' '), '0+3i 0+3i 0+6i 0+3i 0+6i 0+3i 0+6i');
});

XTests.test('a value on a rounding boundary yields no terms at all', () => {
  // (1 + i*sqrt7)/2 has real part exactly 1/2, so the nearest Gaussian integer is
  // genuinely ambiguous and the disk rule must refuse - even the first term.
  const half = CF.Rat.make(1n, 2n);
  const centre = CF.cOf(half, CF.Rat.mul(CF.trunc(CF.ratSqrt(7n, 50), 50), half));
  const r = CF.hurwitzTerms(centre, CF.Rat.make(1n, 10n ** 48n), 5);
  XTests.eq(r.stopReason, 'precision-exhausted');
  XTests.eq(r.terms.length, 0);
});

XTests.test('(1+i)/sqrt2 is periodic from the second term', () => {
  const k = CF.complexConstant('rot8');
  const r = CF.hurwitzTerms(k.centre, k.delta, 9);
  XTests.eq(r.terms.map(t => CF.cStr(t, 0)).join(' '),
            '1+1i -2+2i 2+2i -2+2i 2+2i -2+2i 2+2i -2+2i 2+2i');
});

XTests.test('every remainder obeys the |r|^2 <= 1/2 bound', () => {
  // Coordinate-wise rounding puts the remainder in a square of half-width 1/2,
  // so |r|^2 <= 1/4 + 1/4. Checked exactly, not in floating point.
  for (const c of CF.COMPLEX_CONSTANTS) {
    const k = CF.complexConstant(c.key);
    const r = CF.hurwitzTerms(k.centre, k.delta, 8);
    let z = k.centre;
    for (const t of r.terms) {
      const rem = CF.cSub(z, t);
      XTests.ok(CF.Rat.cmp(CF.cNormSq(rem), CF.Rat.make(1n, 2n)) <= 0,
                `${c.key}: |r|^2 exceeded 1/2`);
      if (CF.cIsZero(rem)) break;
      z = CF.cInv(rem);
    }
  }
});

XTests.test('convergent error strictly decreases', () => {
  for (const c of CF.COMPLEX_CONSTANTS) {
    const { rows } = CF.hurwitzRows(c.key, 8);
    for (let i = 1; i < rows.length; i++) {
      if (CF.Rat.isZero(rows[i - 1].errSq)) break;   // a terminating expansion is exact
      XTests.ok(CF.Rat.cmp(rows[i].errSq, rows[i - 1].errSq) < 0,
                `${c.key}: error did not shrink at row ${i}`);
    }
  }
});

XTests.test('a fat disk withholds terms', () => {
  const k = CF.complexConstant('pi_e_i');
  const tight = CF.hurwitzTerms(k.centre, k.delta, 12);
  const fat = CF.hurwitzTerms(k.centre, CF.Rat.make(1n, 1000n), 12);
  XTests.eq(fat.stopReason, 'precision-exhausted');
  XTests.ok(fat.terms.length < tight.terms.length,
            `fat disk gave ${fat.terms.length} terms, tight gave ${tight.terms.length}`);
});

XTests.test('an imaginary nudge leaves the expansion real until q^2 catches up', () => {
  // Every inversion amplifies the imaginary part by about 1/|r|^2, so after k levels the
  // amplification is q_k^2. The claim: at the level BEFORE the first complex term, the
  // perturbation has not yet reached the rounding threshold - eps*q^2 < 1.
  for (const key of ['pi', 'e', 'sqrt2', 'phi', 'gamma', 'ln2']) {
    const k = CF.complexConstant(key);
    const rows = CF.convergentRowsFor(key, 24, 'nearest').rows;
    for (let p = 4; p <= 40; p += 3) {
      const eps = CF.Rat.make(1n, 10n ** BigInt(p));
      const w = CF.imaginaryWake(key, eps, 18);
      if (w.actual === null || w.actual <= 0) continue;
      const q = rows[w.actual - 1].q;
      const v = CF.Rat.mul(eps, CF.Rat.fromInt(q * q));
      XTests.ok(CF.Rat.cmp(v, CF.Rat.fromInt(1)) < 0,
                `${key} eps=1e-${p}: eps*q^2 was already ${CF.sci(v, 4)} before the wake`);
    }
  }
});

XTests.test('a zero nudge keeps every term real', () => {
  for (const key of ['pi', 'e', 'gamma']) {
    const w = CF.imaginaryWake(key, CF.Rat.fromInt(0), 12);
    XTests.eq(w.actual, null, `${key} went complex with no nudge`);
    XTests.eq(w.predicted, null, `${key} predicted a wake with no nudge`);
    for (const t of w.terms) XTests.ok(CF.Rat.isZero(t.im), `${key} grew an imaginary part`);
  }
});

XTests.test('a large nudge wakes the expansion almost immediately', () => {
  const w = CF.imaginaryWake('pi', CF.Rat.make(1n, 100n), 12);
  XTests.ok(w.actual !== null && w.actual <= 2, `expected an early wake, got ${w.actual}`);
});

XTests.test('the discarded distance is bounded by its rounding rule', () => {
  const half = CF.Rat.make(1n, 2n), one = CF.Rat.fromInt(1);
  for (const c of CF.CONSTANTS) {
    for (const m of CF.SEMI_MODES) {
      const { rows } = CF.convergentRowsFor(c.key, 10, m.key);
      for (const r of rows.slice(0, -1)) {
        XTests.ok(CF.Rat.cmp(r.rem, one) <= 0, `${c.key}/${m.key} n=${r.n} discarded ${r.remStr}`);
        if (m.key === 'nearest') {
          XTests.ok(CF.Rat.cmp(r.rem, half) <= 0,
                    `${c.key}/nearest n=${r.n} discarded ${r.remStr}, over the half bound`);
        }
      }
    }
  }
});

XTests.test('a periodic expansion discards a constant distance', () => {
  // sqrt2 in floor mode discards sqrt2 - 1; phi discards 1/phi; phi in nearest mode 2 - phi.
  const check = (key, mode, expected) => {
    const { rows } = CF.convergentRowsFor(key, 8, mode);
    for (const r of rows.slice(0, 6)) {
      XTests.eq(CF.Rat.toDecimalString(r.rem, 6), expected, `${key}/${mode} n=${r.n}`);
    }
  };
  check('sqrt2', 'floor', '0.414213');     // sqrt2 - 1
  check('phi', 'floor', '0.618033');       // 1/phi
  check('phi', 'nearest', '0.381966');     // 2 - phi
});

XTests.test('the discarded distance predicts the next term', () => {
  // In floor mode the next term is exactly floor(1 / discarded distance).
  const { rows } = CF.convergentRowsFor('pi', 10, 'floor');
  for (let i = 0; i + 1 < rows.length; i++) {
    if (CF.Rat.isZero(rows[i].rem)) continue;
    const inv = CF.Rat.div(CF.Rat.fromInt(1), rows[i].rem);
    XTests.eq(CF.Rat.floor(inv), rows[i + 1].a, `level ${i + 1} not predicted by the remainder`);
  }
});

XTests.test('Mobius offsets sit inside their disk', () => {
  for (const c of CF.CONSTANTS) {
    for (const d of CF.mobiusDisks(c.key, 8).disks) {
      XTests.ok(CF.Rat.cmp(d.offset, d.radius) <= 0, `${c.key} level ${d.n} offset exceeded the radius`);
      XTests.ok(CF.Rat.cmp(d.offsetFrac, CF.Rat.fromInt(1)) <= 0 &&
                CF.Rat.cmp(d.offsetFrac, CF.Rat.fromInt(0)) >= 0,
                `${c.key} level ${d.n} offset fraction ${d.offsetFracStr} out of range`);
    }
  }
});

XTests.test('the two bound sequences are monotone and stay on their own side', () => {
  for (const c of CF.CONSTANTS) {
    const x = CF.constant(c.key).exact || CF.constant(c.key).lo;
    const { rows } = CF.boundRows(c.key, 6);
    let prevLo = null, prevUp = null;
    for (const r of rows) {
      XTests.ok(CF.Rat.cmp(r.lower, x) < 0, `${c.key} k=${r.k} lower bound was not below`);
      XTests.ok(CF.Rat.cmp(r.upper, x) > 0, `${c.key} k=${r.k} upper bound was not above`);
      if (prevLo) XTests.ok(CF.Rat.cmp(r.lower, prevLo) > 0, `${c.key} k=${r.k} lower did not rise`);
      if (prevUp) XTests.ok(CF.Rat.cmp(r.upper, prevUp) < 0, `${c.key} k=${r.k} upper did not fall`);
      prevLo = r.lower; prevUp = r.upper;
    }
  }
});

XTests.test('the midpoint error is exactly half the difference of the two errors', () => {
  // mid - x = ((lower - x) + (upper - x))/2, so |mid - x| = |errUpper - errLower| / 2.
  for (const c of CF.CONSTANTS) {
    for (const r of CF.boundRows(c.key, 6).rows) {
      const d = CF.Rat.sub(r.eUpper, r.eLower);
      const half = CF.Rat.div(d.n < 0n ? CF.Rat.neg(d) : d, CF.Rat.fromInt(2));
      XTests.eq(CF.Rat.cmp(r.eMid, half), 0, `${c.key} k=${r.k}`);
    }
  }
});

XTests.test('the mediant lies strictly between the bounds and has the summed denominator', () => {
  for (const c of CF.CONSTANTS) {
    for (const r of CF.boundRows(c.key, 6).rows) {
      XTests.ok(CF.Rat.cmp(r.lower, r.mediant) < 0 && CF.Rat.cmp(r.mediant, r.upper) < 0,
                `${c.key} k=${r.k} mediant escaped the bracket`);
      XTests.eq(r.mediantQ, r.lowerQ + r.upperQ, `${c.key} k=${r.k} mediant denominator`);
    }
  }
});

XTests.test('the midpoint is not uniformly better, and the mediant usually beats it', () => {
  // Recorded rather than asserted as a bound: the midpoint only wins when the two errors
  // are close in size, so it beats both endpoints well under half the time.
  let mid = 0, med = 0, n = 0;
  for (const c of CF.CONSTANTS) {
    for (const r of CF.boundRows(c.key, 6).rows) {
      n++; if (r.midBeatsBoth) mid++; if (r.mediantBeatsMid) med++;
    }
  }
  XTests.ok(n >= 20, `expected a decent sample, got ${n}`);
  XTests.ok(mid > 0 && mid < n, `midpoint won ${mid} of ${n} - expected a mix`);
  XTests.ok(med > n / 2, `mediant beat the midpoint only ${med} of ${n}`);
});

XTests.test('the semiconvergent pool respects its budget and takes a side', () => {
  const pool = CF.semiconvergents('pi', 1000n);
  XTests.ok(pool.length > 5, `expected a decent pool, got ${pool.length}`);
  const x = CF.constant('pi').lo;
  for (const z of pool) {
    XTests.ok(z.q <= 1000n && z.q > 0n, `denominator ${z.q} out of budget`);
    const cmp = CF.Rat.cmp(z.v, x);
    XTests.ok(cmp !== 0, 'an exact hit should not be in the pool');
    XTests.eq(z.below, cmp < 0, `${z.p}/${z.q} side flag wrong`);
  }
});

XTests.test('balanced bounds still bracket the value', () => {
  for (const c of CF.CONSTANTS) {
    const x = CF.constant(c.key).exact || CF.constant(c.key).lo;
    for (const r of CF.boundRows(c.key, 6, 'balanced').rows) {
      XTests.ok(CF.Rat.cmp(r.lower, x) < 0 && CF.Rat.cmp(x, r.upper) < 0,
                `${c.key} k=${r.k} balanced pair did not bracket`);
    }
  }
});

XTests.test('balanced is never worse than independent', () => {
  // The independent pair is itself in the pool, so the balanced search can only match or
  // beat it. A violation would mean the pool or the search is wrong.
  for (const c of CF.CONSTANTS) {
    const ind = CF.boundRows(c.key, 6, 'independent').rows;
    const bal = CF.boundRows(c.key, 6, 'balanced').rows;
    for (let i = 0; i < Math.min(ind.length, bal.length); i++) {
      XTests.ok(CF.Rat.cmp(bal[i].eMid, ind[i].eMid) <= 0,
                `${c.key} k=${i}: balanced ${bal[i].eMidStr} lost to independent ${ind[i].eMidStr}`);
    }
  }
});

XTests.test('balancing buys orders of magnitude on sqrt2 and nothing on phi', () => {
  // sqrt2: the search finds p/q paired with 2q/p, whose errors are nearly equal and
  // opposite, so the midpoint cancels to second order.
  const bal = CF.boundRows('sqrt2', 7, 'balanced').rows;
  const ind = CF.boundRows('sqrt2', 7, 'independent').rows;
  const last = bal.length - 1;
  XTests.ok(CF.Rat.cmp(bal[last].eMid, CF.Rat.make(1n, 10n ** 15n)) < 0,
            `expected sqrt2 balanced under 1e-15, got ${bal[last].eMidStr}`);
  XTests.ok(CF.Rat.cmp(ind[last].eMid, CF.Rat.make(1n, 10n ** 12n)) > 0,
            'expected independent sqrt2 to be much worse');
  // phi: every partial quotient is 1, so there are no semiconvergents and nothing to choose.
  const bp = CF.boundRows('phi', 6, 'balanced').rows;
  const ip = CF.boundRows('phi', 6, 'independent').rows;
  for (let i = 0; i < bp.length; i++) {
    XTests.eq(CF.Rat.cmp(bp[i].eMid, ip[i].eMid), 0, `phi k=${i} should be unimprovable`);
  }
});

XTests.test('real constants run through the complex algorithm too', () => {
  for (const c of CF.CONSTANTS) {
    const k = CF.complexConstant(c.key);
    XTests.eq(k.real, true, `${c.key} should be flagged real`);
    const r = CF.hurwitzTerms(k.centre, k.delta, 6);
    for (const t of r.terms) {
      XTests.ok(CF.Rat.isZero(t.im), `${c.key}: an imaginary part appeared in a real expansion`);
    }
  }
});

XTests.test('a real Hurwitz expansion is the nearest-integer one in all-plus-one form', () => {
  // Same magnitudes as the Simple tab nearest mode. The signs differ because this form
  // keeps every numerator at +1 and pushes the sign into the term, so each term here is
  // the nearest-mode magnitude times the RUNNING PRODUCT of that mode's +-1 numerators.
  for (const c of CF.CONSTANTS) {
    const k = CF.complexConstant(c.key);
    const h = CF.hurwitzTerms(k.centre, k.delta, 9).terms.map(t => CF.Rat.toDecimalString(t.re, 0));
    const rows = CF.convergentRowsFor(c.key, 9, 'nearest').rows;
    let run = 1;
    const predicted = rows.map(r => { run *= r.sign; return (run < 0 ? '-' : '') + String(r.a); });
    const n = Math.min(h.length, predicted.length);
    XTests.ok(n >= 3, `${c.key}: too few terms to compare`);
    XTests.eq(h.slice(0, n).join(','), predicted.slice(0, n).join(','), c.key);
  }
});

</script>

<script>
  const state = {
    simple: { key: 'pi', depth: 6, selected: null, mode: 'floor' },
  };
  const el = (id) => document.getElementById(id);
  const MAX_SIMPLE_TERMS = 60;   // high enough that the precision cutoff, not this cap, is what stops pi

  const elide = (s, max = 18) => (s.length <= max ? s : s.slice(0, 8) + '\u2026' + s.slice(-8));

  // a0 + 1/(a1 + 1/(a2 + ...)), with each level's operator taken from that level's sign.
  function towerHTML(terms, depth, signs) {
    const opAt = (i) => (signs[i] < 0 ? ' \u2212 ' : ' + ');
    const build = (i) => {
      const a = String(terms[i]);
      if (i >= depth - 1) {
        return i + 1 < terms.length ? `${a}${opAt(i + 1)}<span class="muted">\u2026</span>` : a;
      }
      return `${a}${opAt(i + 1)}<span class="frac"><span class="stack">` +
             `<span class="num">1</span><span class="den">${build(i + 1)}</span>` +
             `</span></span>`;
    };
    return build(0);
  }

  const STOP_REASON = {
    exact: 'the value is rational, so the expansion terminates \u2014 these are all the terms there are',
    periodic: 'a quadratic irrational: the terms repeat forever, so any number of them is exact',
    'precision-exhausted': 'everything the stored 60 digits determine \u2014 the next term is genuinely unknown to this page',
    'max-terms': 'stopped at the display limit',
  };

  function renderSimple() {
    const s = state.simple;
    const k = CF.constant(s.key);
    const mode = CF.SEMI_MODES.find(m => m.key === s.mode);
    const { rows, stopReason } = CF.convergentRowsFor(s.key, MAX_SIMPLE_TERMS, s.mode);
    const terms = rows.map(r => r.a);

    el('simple-mode').innerHTML = CF.SEMI_MODES
      .map(m => `<button class="chip ${m.key === s.mode ? 'active' : ''}" data-mode="${m.key}"` +
                `${m.note ? ` title="${m.note}"` : ''}>${m.label}</button>`)
      .join('');
    el('simple-mode').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      s.mode = b.dataset.mode; s.selected = null; renderSimple();
    }));

    el('simple-chips').innerHTML = CF.CONSTANTS
      .map(c => `<button class="chip ${c.key === s.key ? 'active' : ''}" data-key="${c.key}">${c.label}</button>`)
      .join('');
    el('simple-chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      s.key = b.dataset.key; s.selected = null; renderSimple();
    }));

    el('simple-depth').max = String(Math.min(30, terms.length));
    const depth = Math.min(s.depth, terms.length);
    el('simple-depth-label').textContent = `showing ${depth} of ${terms.length} terms`;
    const signs = rows.map(r => r.sign);
    el('simple-tower').innerHTML = `${k.label} = ` + towerHTML(terms, depth, signs);
    // The Depth slider governs the tower, which stops being legible past a few levels.
    // The term list is not subject to that - it shows every term the expansion produced,
    // because the sign pattern is only judgeable across many terms.
    // A leading minus marks a level whose numerator is -1.
    const allPlus = signs.slice(1).every(v => v > 0);
    const open = allPlus ? '[' : '\u27e6', close = allPlus ? ']' : '\u27e7';
    // The ellipsis says the expansion goes on forever. Only 'exact' terminates - a
    // rational running out of terms. 'periodic', 'precision-exhausted' and 'max-terms'
    // all mean there is more, whether or not this page can compute it.
    const continues = stopReason !== 'exact';
    const listed = `${open}${terms[0]}; ` +
      terms.slice(1).map((t, i) => (signs[i + 1] < 0 ? '\u2212' : '') + t).join(', ') +
      (continues ? ', \u2026' : '') + close;
    el('simple-terms').innerHTML = `<div>${listed}</div>` +
      (allPlus ? ''
        : `<div class="signstrip">signs&nbsp; ${signs.slice(1).map(v => (v < 0 ? '\u2212' : '+')).join(' ')}</div>`);
    el('simple-status').innerHTML = `${terms.length} terms \u2014 ${STOP_REASON[stopReason]}.` +
      (mode.note ? ` <em>${mode.label} is ${mode.note}.</em>` : '');

    renderSimpleTable(rows);
    renderCascade();
    renderRace(rows);
  }

  function renderSimpleTable(rows) {
    const head = '<tr><th>n</th><th>aₙ</th><th>discarded |x − aₙ|</th>' +
                 '<th>pₙ / qₙ</th><th>decimal</th>' +
                 '<th>x − pₙ/qₙ</th><th>|error| · qₙ²</th></tr>';
    const body = rows.map(r => {
      const frac = `<span title="${r.p}/${r.q}">${elide(String(r.p))}/${elide(String(r.q))}</span>`;
      const sel = state.simple.selected === r.n ? ' selected' : '';
      return `<tr class="clickable${sel}" data-n="${r.n}"><td>${r.n}</td><td>${r.a}</td>` +
             `<td class="mono">${r.remStr}</td>` +
             `<td class="mono">${frac}</td><td class="mono">${r.decimal.slice(0, 16)}</td>` +
             `<td class="mono">${r.errorStr}</td><td class="mono">${r.errQ2}</td></tr>`;
    }).join('');
    el('simple-table').innerHTML = head + body;
    el('simple-table').querySelectorAll('tr.clickable').forEach(tr =>
      tr.addEventListener('click', () => { state.simple.selected = Number(tr.dataset.n); renderSimple(); }));
  }

  function renderRace(rows) {
    const s = state.simple;
    const box = el('simple-race');
    const above = CF.raceKind(s.mode) === 'above';
    if (s.selected === null) {
      box.innerHTML = '<p class="status">Click a row to race its convergent against every ' +
        (above ? 'fraction above the target ' : 'fraction ') +
        'with a denominator that small.</p>';
      return;
    }
    const row = rows[s.selected];
    if (row.q > BigInt(CF.MAX_RACE_Q)) {
      box.innerHTML = `<p class="status">q = ${row.q} is too large to search exhaustively ` +
        `(the limit is ${CF.MAX_RACE_Q.toLocaleString()}). This page will not claim a search it did not run.</p>`;
      return;
    }
    const best = above
      ? CF.bestApproximationsAbove(s.key, Number(row.q), 5)
      : CF.bestApproximations(s.key, Number(row.q), 5);
    const winner = best.length && `${best[0].p}/${best[0].q}` === `${row.p}/${row.q}`;
    const list = best.map((b, i) => {
      const isRow = `${b.p}/${b.q}` === `${row.p}/${row.q}`;
      return `<tr class="${isRow ? 'selected' : ''}"><td>${i + 1}</td>` +
             `<td class="mono">${b.p}/${b.q}</td><td class="mono">${b.errorStr}</td></tr>`;
    }).join('');
    box.innerHTML =
      `<p class="status">Every fraction ${above ? 'above ' + CF.constant(s.key).label + ' ' : ''}` +
      `with q ≤ ${row.q} checked. ` +
      (winner
        ? `The convergent <strong>${row.p}/${row.q}</strong> is the closest` + (above ? ' of those.' : ' of them all.')
        : `The convergent ${row.p}/${row.q} did <strong>not</strong> win — worth investigating.`) +
      (above
        ? ' Minus convergents are <em>one-sided</em> best approximations: they only ever approach ' +
          'from above, so an unrestricted race can be won by a closer fraction below — 4/1 ' +
          'loses outright to 3/1, for instance.'
        : '') +
      `</p><div class="tablewrap"><table><tr><th>rank</th><th>p/q</th><th>x − p/q</th></tr>${list}</table></div>`;
  }

  const CASCADE_ROWS = 12;

  function renderCascade() {
    const s = state.simple;
    const rows = CF.cascadeRows(s.key, s.mode, CASCADE_ROWS);
    const rowH = 34, padL = 84, padR = 16, padT = 16;
    const W = 900, H = padT + Math.max(1, rows.length) * rowH + 10;
    const ctx = fitCanvas(el('simple-cascade'), W, H);
    ctx.clearRect(0, 0, W, H);
    const BELOW = '#1a5fb4', ABOVE = '#c64600';
    const inner = W - padL - padR;
    const X = (t) => padL + t * inner;

    if (!rows.length) {
      ctx.fillStyle = '#666'; ctx.font = '12px sans-serif';
      ctx.fillText('nothing left to bracket — the expansion is exact', padL, padT + 16);
      el('simple-cascade-caption').textContent = '';
      return;
    }

    rows.forEach((r, i) => {
      const y = padT + i * rowH + rowH / 2;
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();

      ctx.strokeStyle = '#999'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(X(r.loPos), y); ctx.lineTo(X(r.hiPos), y); ctx.stroke();

      // Endpoint ticks, coloured by side. An endpoint labelled "x" IS the target, already
      // drawn as the black line below, so it gets no tick of its own. The two labels are
      // staggered above and below the line: even a 15%-wide bracket is narrower than two
      // fractions like 80143857/25510582 set side by side.
      [[r.loPos, r.loLabel, r.loAbove, -1], [r.hiPos, r.hiLabel, r.hiAbove, 1]]
        .forEach(([t, label, above, dir]) => {
          if (label === 'x') return;
          ctx.strokeStyle = above ? ABOVE : BELOW; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(X(t), y - 7); ctx.lineTo(X(t), y + 7); ctx.stroke();
          ctx.fillStyle = above ? ABOVE : BELOW; ctx.font = '10px ui-monospace, Menlo, monospace';
          const w = ctx.measureText(label).width;
          const lx = Math.min(Math.max(X(t) - w / 2, padL), W - padR - w);
          ctx.fillText(label, lx, dir < 0 ? y - 11 : y + 18);
        });

      ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(r.targetPos), y - 11); ctx.lineTo(X(r.targetPos), y + 11); ctx.stroke();

      ctx.fillStyle = '#666'; ctx.font = '10px sans-serif';
      ctx.fillText(`n=${r.n}`, 4, y + 3);
      ctx.fillText(CF.sci(r.width, 3), 34, y + 3);
    });

    const bracketing = rows.filter(r => r.brackets).length;
    const target = CF.constant(s.key).label;
    el('simple-cascade-caption').textContent =
      'Each row zooms in further than the last. ' +
      (bracketing === rows.length
        ? `The two convergents land on opposite sides of ${target} and trap it between them, ` +
          'and every level tightens the trap inside the previous one.'
        : bracketing === 0
        ? `Every convergent sits on the same side of ${target} and marches onto it without ` +
          'ever crossing. Each bar runs from the target to the newest convergent.'
        : `${bracketing} of these ${rows.length} rows trap ${target} between two convergents; ` +
          'in the rest both convergents land on the same side, and the bar runs from the ' +
          'target to the newest one.') +
      ' Blue is below the target, orange above; the number on the left is the interval width.';
  }

  el('simple-depth').addEventListener('input', (e) => {
    state.simple.depth = Number(e.target.value);
    renderSimple();
  });
  renderSimple();

  // ---------- Generalized tab ----------
  state.general = { b0: 2, aKey: 'n1', bKey: 'n1', k: 2, negate: false, terms: 12 };

  function genSeqs() {
    const g = state.general;
    const kRat = CF.Rat.fromDecimalString(String(Number.isFinite(g.k) ? g.k : 1));
    return { a: CF.seq(g.aKey, kRat), b: CF.seq(g.bKey, kRat) };
  }

  // Level n of the tower is a_n over (b_n + level n+1); b0 sits outside the whole stack.
  function genTowerHTML(g, seqs, depth) {
    const fmt = (r, irr) =>
      (r && r.re !== undefined) ? CF.cStr(r, 0) : CF.Rat.toDecimalString(r, irr ? 4 : 0);
    const level = (n) => {
      const num = (g.negate ? '−' : '') + fmt(seqs.a.at(n), seqs.a.irrational);
      const den = n >= depth
        ? `${fmt(seqs.b.at(n), seqs.b.irrational)} + <span class="muted">…</span>`
        : `${fmt(seqs.b.at(n), seqs.b.irrational)} + ${level(n + 1)}`;
      return `<span class="frac"><span class="stack"><span class="num">${num}</span>` +
             `<span class="den">${den}</span></span></span>`;
    };
    return `${g.b0} + ${level(1)}`;
  }

  function fitCanvas(canvas, cssW, cssH) {
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function renderGeneral() {
    const g = state.general;
    const seqs = genSeqs();

    const opts = (sel) => CF.SEQUENCES.map(x =>
      `<option value="${x.key}" ${x.key === sel ? 'selected' : ''}>${x.label}</option>`).join('');
    el('gen-a').innerHTML = opts(g.aKey);
    el('gen-b').innerHTML = opts(g.bKey);

    const { values, cap, complex } = CF.genConvergents({
      b0: CF.Rat.fromDecimalString(String(g.b0)), aSeq: seqs.a, bSeq: seqs.b,
      negateA: g.negate, terms: g.terms });
    // |x| and differences for either arithmetic, so the table and plot below do not
    // each need to know which one ran.
    const magOf = (v) => (v.re !== undefined)
      ? CF.ratSqrtLower(CF.cNormSq(v), 30)
      : (v.n < 0n ? CF.Rat.neg(v) : v);
    const diffOf = (a, b) => (a.re !== undefined) ? CF.cSub(a, b) : CF.Rat.sub(a, b);
    const showOf = (v, d) => (v.re !== undefined) ? CF.cStr(v, d) : CF.Rat.toDecimalString(v, d);

    el('gen-terms').max = String(cap);
    el('gen-terms-label').textContent = `${values.length} levels (cap ${cap}` +
      `${cap === CF.MAX_GEN_TERMS_IRRATIONAL ? ', lowered because a sequence is irrational' : ''})`;
    el('gen-tower').innerHTML = genTowerHTML(g, seqs, Math.min(4, Math.max(1, values.length)));

    const rows = values.map((v, i) => {
      const prev = i > 0 ? values[i - 1] : null;
      const abs = prev ? magOf(diffOf(v, prev)) : null;
      return { n: i + 1, decimal: showOf(v, 14),
               step: abs ? CF.sci(abs, 4) : '—', absRat: abs };
    });
    el('gen-table').innerHTML =
      '<tr><th>level</th><th>value</th><th>|xₙ − xₙ₋₁|</th></tr>' +
      rows.map(r => `<tr><td>${r.n}</td><td class="mono">${r.decimal}</td>` +
                    `<td class="mono">${r.step}</td></tr>`).join('');

    const last = values[values.length - 1];
    const id = complex ? null : CF.identifyGraded(last, 12, 4);
    // Only the truncated entries (pi, e, sqrt2) carry an approximation caveat. The
    // complex entries are flagged irrational for the term cap, but i and 1+i are exact.
    const note = (seqs.a.truncated || seqs.b.truncated)
      ? ` Computed from the irrational sequence value to ${CF.GEN_SEQ_DIGITS} decimals — exact for that approximation, not for the constant itself.`
      : ' Computed in exact arithmetic.';
    el('gen-identify').innerHTML =
      `<span class="verdict">Value after ${values.length} levels: ` +
      `<strong class="mono">${showOf(last, 14)}</strong> — ` +
      (complex
        ? 'no identification for complex values — the table of named constants is real.'
        : id.matched
          ? `agrees with <strong>${id.label}</strong> to ${id.digits} digits.`
          : `${id.label}.`) +
      note + '</span>';

    drawGenPlot(rows);
  }

  function drawGenPlot(rows) {
    const W = 420, H = 260, pad = 40;
    const ctx = fitCanvas(el('gen-plot'), W, H);
    ctx.clearRect(0, 0, W, H);
    const pts = rows.filter(r => r.absRat && !CF.Rat.isZero(r.absRat))
      .map(r => ({ n: r.n, y: Math.log10(CF.Rat.toNumber(r.absRat)) }));
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.strokeRect(pad, 10, W - pad - 10, H - pad - 10);
    ctx.fillStyle = '#666'; ctx.font = '11px sans-serif';
    ctx.fillText('log₁₀ |xₙ − xₙ₋₁|', pad + 6, 24);
    if (!pts.length) { ctx.fillText('nothing to plot yet', pad + 6, H / 2); return; }
    const yMin = Math.min(...pts.map(p => p.y)), yMax = Math.max(...pts.map(p => p.y));
    const span = Math.max(1e-9, yMax - yMin);
    const X = (n) => pad + (n - pts[0].n) / Math.max(1, pts[pts.length - 1].n - pts[0].n) * (W - pad - 14);
    const Y = (y) => (H - pad) - (y - yMin) / span * (H - pad - 26);
    ctx.fillText(yMax.toFixed(1), 6, Y(yMax) + 4);
    ctx.fillText(yMin.toFixed(1), 6, Y(yMin) + 4);
    ctx.fillText('level', W / 2 - 14, H - 12);
    ctx.strokeStyle = '#1a5fb4'; ctx.lineWidth = 1.5; ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(X(p.n), Y(p.y)) : ctx.moveTo(X(p.n), Y(p.y))));
    ctx.stroke();
    ctx.fillStyle = '#1a5fb4';
    pts.forEach(p => ctx.fillRect(X(p.n) - 1.5, Y(p.y) - 1.5, 3, 3));
  }

  el('gen-presets').innerHTML = CF.GEN_PRESETS
    .map(p => `<button class="chip" data-key="${p.key}">${p.label}</button>`).join('');
  el('gen-presets').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const p = CF.GEN_PRESETS.find(x => x.key === b.dataset.key);
    const g = state.general;
    g.b0 = Number(CF.Rat.toDecimalString(p.b0, 0));
    g.aKey = p.aKey; g.bKey = p.bKey; g.negate = p.negateA;
    if (p.kValue) g.k = Number(CF.Rat.toDecimalString(p.kValue, 0));
    el('gen-b0').value = g.b0; el('gen-k').value = g.k; el('gen-negate').checked = g.negate;
    renderGeneral();
  }));
  el('gen-b0').addEventListener('input', e => { state.general.b0 = Number(e.target.value); renderGeneral(); });
  el('gen-k').addEventListener('input', e => { state.general.k = Number(e.target.value); renderGeneral(); });
  el('gen-a').addEventListener('change', e => { state.general.aKey = e.target.value; renderGeneral(); });
  el('gen-b').addEventListener('change', e => { state.general.bKey = e.target.value; renderGeneral(); });
  el('gen-negate').addEventListener('change', e => { state.general.negate = e.target.checked; renderGeneral(); });
  el('gen-terms').addEventListener('input', e => { state.general.terms = Number(e.target.value); renderGeneral(); });
  renderGeneral();

  // ---------- Geometry tab ----------
  state.geometry = { key: 'pi', depth: 4, zoom: 0 };

  const GEN_COLORS = ['#1a5fb4', '#c64600', '#2d7d46', '#7a4fbf', '#b5830c',
                      '#0b6e7a', '#a0355f', '#4a5568', '#8b5a2b', '#3b7d3b',
                      '#6d28d9', '#166534'];

  function renderGeometry() {
    const g = state.geometry;
    el('geo-chips').innerHTML = CF.CONSTANTS
      .map(c => `<button class="chip ${c.key === g.key ? 'active' : ''}" data-key="${c.key}">${c.label}</button>`)
      .join('');
    el('geo-chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      g.key = b.dataset.key; g.zoom = 0; el('geo-zoom').value = '0'; renderGeometry();
    }));

    const e = CF.expandMode(g.key, 'floor', 20);
    const d = CF.dissect(e.terms.slice(0, g.depth), 400);
    const zoom = Math.min(g.zoom, Math.max(0, d.generations.length - 1));
    el('geo-zoom').max = String(Math.max(0, d.generations.length - 1));

    const W = 900, H = 420, pad = 20;
    const ctx = fitCanvas(el('geo-canvas'), W, H);
    ctx.clearRect(0, 0, W, H);

    // The view is the pre-cut rectangle of the zoom generation, in continued-fraction coordinates.
    const view = d.generations[zoom].rect;
    const vx = CF.Rat.toNumber(view.x), vy = CF.Rat.toNumber(view.y);
    const vw = CF.Rat.toNumber(view.w), vh = CF.Rat.toNumber(view.h);
    const scale = Math.min((W - 2 * pad) / vw, (H - 2 * pad) / vh);
    const ox = pad + ((W - 2 * pad) - vw * scale) / 2;
    const oy = pad + ((H - 2 * pad) - vh * scale) / 2;
    const PX = (x) => ox + (x - vx) * scale;
    const PY = (y) => oy + (y - vy) * scale;

    for (const gen of d.generations) {
      const color = GEN_COLORS[gen.index % GEN_COLORS.length];
      ctx.strokeStyle = color;
      ctx.fillStyle = color + '22';
      ctx.lineWidth = 1;
      for (const sq of gen.squares) {
        const x = PX(CF.Rat.toNumber(sq.x)), y = PY(CF.Rat.toNumber(sq.y));
        const side = CF.Rat.toNumber(sq.side) * scale;
        if (side < 0.4) continue;                  // below a pixel: nothing honest to draw
        ctx.fillRect(x, y, side, side);
        ctx.strokeRect(x, y, side, side);
      }
      // Label a generation inside its first square only when the text actually fits there;
      // the colour-matched legend above the canvas carries the rest.
      const first = gen.squares[0];
      if (first) {
        const side = CF.Rat.toNumber(first.side) * scale;
        const text = `a${gen.index} = ${gen.count}`;
        ctx.font = '13px sans-serif';
        if (side > 26 && ctx.measureText(text).width < side - 10) {
          ctx.fillStyle = color;
          ctx.fillText(text, PX(CF.Rat.toNumber(first.x)) + 6, PY(CF.Rat.toNumber(first.y)) + 18);
        }
      }
    }

    el('geo-labels').innerHTML = d.generations.map(x =>
      `<span style="color:${GEN_COLORS[x.index % GEN_COLORS.length]}">a${x.index}=${x.count}</span>`
    ).join('&nbsp; ');
    const terminates = e.stopReason === 'exact';
    el('geo-status').textContent =
      `Rectangle of ratio ${CF.constant(g.key).label} : 1. Each generation fills what is left with ` +
      'the largest square that fits — and the counts are exactly the continued-fraction terms. ' +
      (terminates
        ? 'This ratio is rational, so the process ends on an exact square and the picture is finite.'
        : 'This ratio is irrational, so a remainder always survives — drag "zoom to generation" to fall into it.') +
      (d.truncated ? ' (Square budget reached; later generations are clipped.)' : '');
  }

  el('geo-depth').addEventListener('input', e => { state.geometry.depth = Number(e.target.value); renderGeometry(); });
  el('geo-zoom').addEventListener('input', e => { state.geometry.zoom = Number(e.target.value); renderGeometry(); });
  renderGeometry();

  // ---------- Euler product tab ----------
  state.euler = { s: 2, N: 30 };
  const EULER_GRID_LIMIT = 240;

  function renderEuler() {
    const e = state.euler;
    el('euler-s').innerHTML = CF.ZETA_S
      .map(s => `<button class="chip ${s === e.s ? 'active' : ''}" data-s="${s}">s = ${s}</button>`)
      .join('');
    el('euler-s').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      e.s = Number(b.dataset.s); renderEuler();
    }));

    const z = CF.zetaValue(e.s);
    const sum = CF.zetaPartialSum(e.s, e.N);
    const prod = CF.eulerPartialProduct(e.s, e.N);
    const nPrimes = CF.primesUpTo(e.N).length;
    const errSum = CF.Rat.sub(z.rat, sum);
    const errProd = CF.Rat.sub(z.rat, prod);

    el('euler-n-label').textContent =
      `${e.N} integers in the sum, ${nPrimes} primes in the product`;

    el('euler-target').innerHTML = '<span class="verdict">' +
      `<strong>${z.label}</strong> = ` +
      (z.closedForm ? `<strong>${z.closedForm}</strong> = ` : '') +
      `<span class="mono">${CF.Rat.toDecimalString(z.rat, 16)}…</span>` +
      (z.closedForm ? ''
        : ' — Apéry’s constant. No closed form is known; Apéry proved in 1978 that it is irrational.') +
      '</span>';

    el('euler-race').innerHTML =
      '<tr><th></th><th>over every integer</th><th>over the primes only</th></tr>' +
      `<tr><td>expression</td><td class="mono">Σ<sub>n≤${e.N}</sub> 1/n<sup>${e.s}</sup></td>` +
      `<td class="mono">∏<sub>p≤${e.N}</sub> (1 − p<sup>−${e.s}</sup>)<sup>−1</sup></td></tr>` +
      `<tr><td>value</td><td class="mono">${CF.Rat.toDecimalString(sum, 16)}</td>` +
      `<td class="mono">${CF.Rat.toDecimalString(prod, 16)}</td></tr>` +
      `<tr><td>still short by</td><td class="mono">${CF.sci(errSum, 5)}</td>` +
      `<td class="mono">${CF.sci(errProd, 5)}</td></tr>` +
      `<tr><td>work done</td><td>${e.N} terms</td><td>${nPrimes} factors</td></tr>`;

    renderEulerGrid();
    renderEulerBars();
  }

  function renderEulerGrid() {
    const e = state.euler;
    const smooth = new Set(CF.smoothNumbers(e.N, EULER_GRID_LIMIT));
    let html = '<div class="numgrid">';
    for (let m = 1; m <= EULER_GRID_LIMIT; m++) {
      const cls = m <= e.N ? 'both' : (smooth.has(m) ? 'prod' : '');
      html += `<div class="${cls}" title="${m}">${m}</div>`;
    }
    html += '</div><div class="legend">' +
      `<span class="k-both">reached by both (n ≤ ${e.N})</span>` +
      '<span class="k-prod">reached by the product alone</span>' +
      '<span class="k-none">reached by neither</span></div>';
    el('euler-grid').innerHTML = html;

    const extra = [...smooth].filter(m => m > e.N);
    const preview = extra.slice(0, 12).join(', ');
    el('euler-grid-caption').textContent =
      `The sum has reached ${e.N} integers. The product over ${CF.primesUpTo(e.N).length} primes ` +
      `already accounts for ${extra.length} more below ${EULER_GRID_LIMIT}` +
      (preview ? ` — ${preview}${extra.length > 12 ? ' and so on' : ''}` : '') +
      '. That is unique factorisation: the product over primes p ≤ N is exactly the sum over ' +
      'integers whose prime factors are all ≤ N.';
  }

  function renderEulerBars() {
    const e = state.euler;
    const W = 900, H = 220, padL = 40, padB = 28, padT = 14;
    const ctx = fitCanvas(el('euler-bars'), W, H);
    ctx.clearRect(0, 0, W, H);
    const rows = CF.primeFactorRows(e.s, e.N)
      .map(r => ({ p: r.p, f: r.factor, excess: CF.Rat.toNumber(r.excess) }));
    if (!rows.length) {
      ctx.fillStyle = '#666'; ctx.font = '12px sans-serif';
      ctx.fillText('no primes below N yet', padL, H / 2);
      el('euler-bars-caption').textContent = '';
      return;
    }
    const maxEx = rows[0].excess;
    const bw = (W - padL - 12) / rows.length;
    ctx.fillStyle = '#1a5fb4';
    rows.forEach((r, i) => {
      const h = (r.excess / maxEx) * (H - padB - padT);
      ctx.fillRect(padL + i * bw + 1, H - padB - h, Math.max(1, bw - 2), h);
    });
    ctx.fillStyle = '#666'; ctx.font = '10px sans-serif';
    const every = Math.max(1, Math.ceil(16 / bw));
    rows.forEach((r, i) => {
      if (i % every !== 0) return;
      ctx.fillText(String(r.p), padL + i * bw + 1, H - padB + 12);
    });
    ctx.font = '11px sans-serif';
    ctx.fillText('factor − 1', 4, padT + 4);
    ctx.fillText('prime', W / 2 - 14, H - 6);

    const first = rows.slice(0, 4).map(r => `${r.p} → ${CF.Rat.toDecimalString(r.f, 6)}`).join(', ');
    const lastRow = rows[rows.length - 1];
    el('euler-bars-caption').textContent =
      `Each prime multiplies in (1 − p⁻ˢ)⁻¹: ${first}` +
      `, and by ${lastRow.p} only ${CF.Rat.toDecimalString(lastRow.f, 6)}. ` +
      'The small primes do nearly all the work, and raising s makes the decay steeper.';
  }

  el('euler-n').addEventListener('input', ev => { state.euler.N = Number(ev.target.value); renderEuler(); });
  renderEuler();

  // ---------- Unit fractions tab ----------
  state.unit = { key: 'pi' };
  const UF_MAX_TERMS = 12;

  function renderUnit() {
    const s = state.unit;
    el('uf-chips').innerHTML = CF.CONSTANTS
      .map(c => `<button class="chip ${c.key === s.key ? 'active' : ''}" data-key="${c.key}">${c.label}</button>`)
      .join('');
    el('uf-chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      s.key = b.dataset.key; renderUnit();
    }));

    const k = CF.constant(s.key);
    const { whole, rows, stopReason } = CF.unitFractionRows(s.key, UF_MAX_TERMS);
    const continues = stopReason !== 'exact';

    el('uf-expansion').textContent = `${k.label} = ${whole}` +
      rows.map(r => ` + 1/${r.den}`).join('') + (continues ? ' + …' : '');

    el('uf-table').innerHTML =
      '<tr><th>k</th><th>nₖ</th><th>digits</th><th>partial sum</th><th>error</th></tr>' +
      rows.map(r => {
        const d = String(r.den);
        const shown = d.length <= 18 ? d : d.slice(0, 8) + '…' + d.slice(-8);
        return `<tr><td>${r.k}</td><td class="mono" title="${d}">${shown}</td>` +
               `<td>${r.digits}</td><td class="mono">${r.partialStr.slice(0, 18)}</td>` +
               `<td class="mono">${r.errorStr}</td></tr>`;
      }).join('');

    el('uf-status').textContent =
      `${rows.length} unit fractions — ` +
      (stopReason === 'exact'
        ? 'the value is rational, so the sum closes exactly and these are all there are.'
        : stopReason === 'precision-exhausted'
        ? 'everything the stored 60 digits determine. The remainder roughly squares at each ' +
          'step, so the expansion is short because it converges fast, not because the page gave up.'
        : `stopped at the display limit of ${UF_MAX_TERMS}.`);

    renderUnitCompare(rows);
  }

  // How many regular continued-fraction terms are needed to match the accuracy the
  // unit-fraction sum reached? Computed, not asserted.
  function renderUnitCompare(rows) {
    const box = el('uf-compare');
    if (!rows.length) { box.textContent = ''; return; }
    const s = state.unit;
    const target = rows[rows.length - 1].error;
    const absT = target.n < 0n ? CF.Rat.neg(target) : target;
    const cf = CF.convergentRowsFor(s.key, 40, 'floor').rows;
    const hit = cf.find(r => {
      const a = r.error.n < 0n ? CF.Rat.neg(r.error) : r.error;
      return CF.Rat.cmp(a, absT) <= 0;
    });
    const maxDigits = Math.max(...rows.map(r => r.digits));
    const cfDigits = hit ? Math.max(...cf.slice(0, hit.n + 1).map(r => String(r.a).length)) : 0;
    box.textContent =
      `${rows.length} unit fractions reach an error of ${CF.sci(absT, 4)}. ` +
      (hit
        ? `The regular continued fraction needs ${hit.n + 1} terms to match it — but its ` +
          `largest term has ${cfDigits} digits, where the largest denominator here has ${maxDigits}. ` +
          'Fast convergence bought with exploding denominators.'
        : 'The regular continued fraction does not match it within the terms this page can certify.');
  }

  renderUnit();

  // ---------- Complex tab ----------
  state.complex = { key: 'pi_e_i', nudge: 0 };   // nudge 0 = exact, else eps = 1e-(46-nudge)
  const CX_MAX_TERMS = 10;

  function renderComplex() {
    const s = state.complex;
    const chip = (c) =>
      `<button class="chip ${c.key === s.key ? 'active' : ''}" data-key="${c.key}">${c.label}</button>`;
    el('cx-chips').innerHTML = CF.COMPLEX_CONSTANTS.filter(c => !c.real).map(chip).join('');
    el('cx-chips-real').innerHTML = CF.COMPLEX_CONSTANTS.filter(c => c.real).map(chip).join('');
    document.querySelectorAll('#cx-chips .chip, #cx-chips-real .chip').forEach(b =>
      b.addEventListener('click', () => { s.key = b.dataset.key; renderComplex(); }));

    const k = CF.complexConstant(s.key);
    // The nudge only means anything for a real constant, and only above the stored
    // disk radius of 1e-48 - below that it would be smaller than the page's own
    // uncertainty, so the slider stops at 1e-45.
    el('cx-nudge-row').style.display = k.real ? '' : 'none';
    const eps = (k.real && s.nudge > 0) ? CF.Rat.make(1n, 10n ** BigInt(46 - s.nudge)) : CF.Rat.fromInt(0);
    const nudging = !CF.Rat.isZero(eps);
    el('cx-nudge').value = String(s.nudge);
    el('cx-nudge-label').textContent = nudging ? `\u03b5 = 1e-${46 - s.nudge}` : '\u03b5 = 0 (exactly real)';

    const { rows, stopReason } = nudging ? hurwitzRowsNudged(s.key, eps) : CF.hurwitzRows(s.key, CX_MAX_TERMS);
    const continues = stopReason !== 'exact';

    if (!k.real) {
      el('cx-wake').textContent = '';
    } else if (!nudging) {
      el('cx-wake').textContent =
        'The imaginary part is exactly zero, not a truncation residue, so every remainder ' +
        'stays exactly real and every term reads +0i. Drag the nudge to give it something to work on.';
    } else {
      const w = CF.imaginaryWake(s.key, eps, CX_MAX_TERMS);
      el('cx-wake').textContent =
        (w.actual === null
          ? `Still entirely real after ${w.terms.length} levels. `
          : `The imaginary part wakes at level ${w.actual}. `) +
        (w.predicted === null
          ? 'No level within reach has q large enough to amplify it to the rounding threshold.'
          : `Predicted at level ${w.predicted}, where q = ${w.qPredicted}: each inversion ` +
            'amplifies the nudge by about 1/|r|\u00b2, so after k levels it has grown by q\u2096\u00b2, ' +
            'and it becomes visible once \u03b5\u00b7q\u2096\u00b2 reaches \u00bd. That is the same q\u00b2 as ' +
            '|x \u2212 p/q| < 1/q\u00b2 on the Simple tab.');
    }

    el('cx-terms').textContent =
      `⟨${rows.map(r => CF.cStr(r.term, 0)).join('; ')}${continues ? '; …' : ''}⟩`;

    el('cx-table').innerHTML =
      '<tr><th>k</th><th>term</th><th>discarded |z − aₖ|</th><th>Aₖ / Bₖ</th>' +
        '<th>value</th><th>|z − Aₖ/Bₖ|</th></tr>' +
      rows.map(r => `<tr><td>${r.k}</td><td class="mono">${CF.cStr(r.term, 0)}</td>` +
        `<td class="mono">${r.remStr}</td>` +
        `<td class="mono">${CF.cStr(r.A, 0)} / ${CF.cStr(r.B, 0)}</td>` +
        `<td class="mono">${r.valueStr}</td><td class="mono">${r.errStr}</td></tr>`).join('');

    el('cx-status').textContent = `${rows.length} terms — ` +
      (stopReason === 'exact'
        ? 'a Gaussian rational, so the expansion terminates exactly.'
        : stopReason === 'precision-exhausted'
        ? 'everything the stored disk determines. The enclosing disk grows at every ' +
          'inversion, so the expansion stops where the nearest Gaussian integer stops being certain.'
        : `stopped at the display limit of ${CX_MAX_TERMS}.`) +
      (k.real && !nudging
        ? ' A real value has no imaginary part to develop, so this is the nearest-integer' +
          ' expansion from the Simple tab \u2014 the magnitudes are identical. The signs differ' +
          ' because this form keeps every numerator at +1 and pushes the sign into the term:' +
          ' each term here is that tab\u2019s term times the running product of its \u00b11 numerators.'
        : k.real
          ? ' With the nudge on this is no longer an expansion of the real constant at all \u2014'
            + ' it expands the nudged value, and the convergents carry Gaussian-integer parts.'
          : '');

    drawComplex(k, rows);
  }

  // hurwitzRows measures error against the shipped centre; with a nudge the target is the
  // nudged value, so the rows are rebuilt against it rather than against the real constant.
  function hurwitzRowsNudged(key, eps) {
    const k = CF.complexConstant(key);
    const target = CF.cOf(k.centre.re, eps);
    const e = CF.hurwitzTerms(target, k.delta, CX_MAX_TERMS);
    const cs = CF.hurwitzConvergents(e.terms);
    const rows = cs.map((c, i) => {
      const value = CF.cIsZero(c.B) ? CF.CRAT_OPS.zero : CF.cMul(c.A, CF.cInv(c.B));
      const errSq = CF.cNormSq(CF.cSub(target, value));
      return { k: i, term: e.terms[i], A: c.A, B: c.B, value,
               valueStr: CF.cStr(value, 12), errSq,
               errStr: CF.sci(CF.ratSqrtLower(errSq, 30), 4) };
    });
    return { rows, stopReason: e.stopReason };
  }

  function drawComplex(k, rows) {
    const W = 420, H = 420, pad = 26;
    const ctx = fitCanvas(el('cx-canvas'), W, H);
    ctx.clearRect(0, 0, W, H);
    if (!rows.length) {
      ctx.fillStyle = '#666'; ctx.font = '12px sans-serif';
      ctx.fillText('no certain terms to plot', pad, H / 2);
      el('cx-caption').textContent = '';
      return;
    }

    // Plotted straight, the convergents collapse: by k=3 they are inside one pixel of
    // the target. So this is a LOG-RADIAL view - the direction from the target is kept,
    // the distance is compressed to its logarithm. Each ring is one order of magnitude,
    // the target sits at the centre, and the spiral becomes visible.
    const num = (r) => CF.Rat.toNumber(r);
    const tx = num(k.centre.re), ty = num(k.centre.im);
    const pts = rows.map(r => {
      const dx = num(r.value.re) - tx, dy = num(r.value.im) - ty;
      return { dx, dy, mag: Math.hypot(dx, dy), k: r.k };
    }).filter(p => p.mag > 0);
    const cx = W / 2, cy = H / 2, RMAX = Math.min(W, H) / 2 - pad;
    if (!pts.length) {
      ctx.fillStyle = '#666'; ctx.font = '12px sans-serif';
      ctx.fillText('every convergent is exact', pad, H / 2);
      el('cx-caption').textContent = '';
      return;
    }
    const logs = pts.map(p => Math.log10(p.mag));
    const hi = Math.ceil(Math.max(...logs)), lo = Math.floor(Math.min(...logs));
    const span = Math.max(1, hi - lo);
    const radius = (mag) => RMAX * (Math.log10(mag) - lo) / span;

    // decade rings
    ctx.font = '9px sans-serif';
    for (let d = lo; d <= hi; d++) {
      const rr = RMAX * (d - lo) / span;
      if (rr <= 0.5) continue;
      ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#bbb';
      ctx.fillText(`1e${d}`, cx + 3, cy - rr + 10);
    }

    const P = (p) => {
      const rr = radius(p.mag), ang = Math.atan2(p.dy, p.dx);
      return [cx + rr * Math.cos(ang), cy - rr * Math.sin(ang)];
    };
    ctx.strokeStyle = '#1a5fb4'; ctx.lineWidth = 1.2; ctx.beginPath();
    pts.forEach((p, idx) => { const [x, y] = P(p); idx ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    ctx.fillStyle = '#1a5fb4'; ctx.font = '9px sans-serif';
    pts.forEach((p, idx) => {
      const [x, y] = P(p);
      ctx.beginPath(); ctx.arc(x, y, idx === pts.length - 1 ? 4 : 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillText(String(p.k), x + 5, y - 4);
    });

    ctx.strokeStyle = '#c64600'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy);
    ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6);
    ctx.stroke();

    el('cx-caption').textContent =
      `Each convergent's offset from ${k.label}, drawn in its true direction but at a ` +
      'logarithmic distance — one ring per order of magnitude, the target at the centre. ' +
      (k.real
        ? 'This value is real, so every offset points along the real axis and the spiral '
          + 'flattens to a line: left and right of centre is exactly the below/above '
          + 'alternation the Simple tab draws as a cascade.'
        : 'There is no above or below in ℂ, so nothing alternates the way a real continued '
          + 'fraction does; the convergents spiral inward instead, and the direction of each '
          + 'step is what the plain plot hides.');
  }

  el('cx-nudge').addEventListener('input', (ev) => {
    state.complex.nudge = Number(ev.target.value); renderComplex();
  });
  renderComplex();

  // ---------- Mobius tab ----------
  state.mobius = { key: 'pi' };
  const MB_LEVELS = 8;

  function renderMobius() {
    const s = state.mobius;
    el('mb-chips').innerHTML = CF.CONSTANTS
      .map(c => `<button class="chip ${c.key === s.key ? 'active' : ''}" data-key="${c.key}">${c.label}</button>`)
      .join('');
    el('mb-chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      s.key = b.dataset.key; renderMobius();
    }));

    const label = CF.constant(s.key).label;
    const { disks } = CF.mobiusDisks(s.key, MB_LEVELS);

    el('mb-intro').innerHTML =
      `Each level's map Tₙ(z) = (Aₙz + Aₙ₋₁)/(Bₙz + Bₙ₋₁) sends the whole right half-plane ` +
      `onto a disk whose diameter runs between consecutive convergents of ${label}. ` +
      'Every disk contains the target and lies inside the one before it, so the sequence ' +
      'squeezes the plane onto the value. <em>Regular mode only</em>: with ±1 numerators the ' +
      'convergents can land on the same side and the disk then misses the target entirely.';

    el('mb-table').innerHTML =
      '<tr><th>n</th><th>diameter ends</th><th>centre</th><th>radius</th>' +
      '<th>shrink</th><th>target offset</th><th>of radius</th></tr>' +
      disks.map(d => `<tr><td>${d.n}</td>` +
        `<td class="mono">${d.loLabel} ↔ ${d.hiLabel}</td>` +
        `<td class="mono">${CF.Rat.toDecimalString(d.centre, 14)}</td>` +
        `<td class="mono">${d.radiusStr}</td><td class="mono">${d.shrinkStr}</td>` +
        `<td class="mono">${d.offsetStr}</td>` +
        `<td class="mono">${d.containsTarget ? d.offsetFracStr : 'OUTSIDE'}</td></tr>`).join('');

    drawMobius(disks);
  }

  // A zoom strip: panel k frames disk k and draws disk k+1 inside it at its true relative
  // position and size. Drawn in one frame the later disks are far below a pixel, so each
  // panel re-zooms - the nesting is shown rather than asserted.
  function drawMobius(disks) {
    const cols = 4, rows = 2, gap = 10;
    const W = 900, panelW = (W - gap * (cols - 1)) / cols, panelH = 110;
    const H = rows * panelH + gap * (rows - 1);
    const ctx = fitCanvas(el('mb-canvas'), W, H);
    ctx.clearRect(0, 0, W, H);
    const pairs = [];
    for (let i = 0; i + 1 < disks.length && pairs.length < cols * rows; i++) pairs.push([disks[i], disks[i + 1]]);
    if (!pairs.length) { el('mb-caption').textContent = ''; return; }

    pairs.forEach(([outer, inner], idx) => {
      const cxp = (idx % cols) * (panelW + gap), cyp = Math.floor(idx / cols) * (panelH + gap);
      const cx = cxp + panelW / 2, cy = cyp + panelH / 2;
      const R = Math.min(panelW, panelH) / 2 - 14;
      ctx.strokeStyle = '#eee'; ctx.strokeRect(cxp + 0.5, cyp + 0.5, panelW - 1, panelH - 1);

      // outer disk fills the panel
      ctx.strokeStyle = '#1a5fb4'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

      // inner disk, positioned and scaled relative to the outer one
      const scale = R / CF.Rat.toNumber(outer.radius);
      const dx = CF.Rat.toNumber(CF.Rat.sub(inner.centre, outer.centre)) * scale;
      const rIn = Math.max(1, CF.Rat.toNumber(inner.radius) * scale);
      ctx.strokeStyle = '#c64600'; ctx.fillStyle = '#c6460022'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx + dx, cy, rIn, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#111'; ctx.font = '10px sans-serif';
      ctx.fillText(`n=${outer.n} ⊃ n=${inner.n}`, cxp + 6, cyp + 13);
      ctx.fillStyle = '#666';
      ctx.fillText(`×${inner.shrinkStr}`, cxp + 6, cyp + panelH - 6);
      if (CF.Rat.toNumber(inner.radius) * scale < 1) {
        ctx.fillStyle = '#c64600';
        ctx.fillText('drawn at 1px floor', cxp + 60, cyp + panelH - 6);
      }
    });

    el('mb-caption').textContent =
      'Each panel re-zooms so the outer disk fills it; the filled disk inside is the next ' +
      'level, at its true relative position and size. The shrink factor is printed below. ' +
      'Where the inner disk would be smaller than a pixel it is drawn at a 1px floor and ' +
      'labelled, so a visible dot is never mistaken for a measured size.';
  }

  renderMobius();

  // ---------- Bounds tab ----------
  state.bounds = { key: 'pi', mode: 'independent' };
  const BD_LEVELS = 8;

  function renderBounds() {
    const s = state.bounds;
    el('bd-chips').innerHTML = CF.CONSTANTS
      .map(c => `<button class="chip ${c.key === s.key ? 'active' : ''}" data-key="${c.key}">${c.label}</button>`)
      .join('');
    el('bd-chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      s.key = b.dataset.key; renderBounds();
    }));

    const BD_MODES = [
      { key: 'independent', label: 'each bound its own best' },
      { key: 'balanced',    label: 'bounds chosen so C is best' },
    ];
    el('bd-mode').innerHTML = BD_MODES
      .map(m => `<button class="chip ${m.key === s.mode ? 'active' : ''}" data-mode="${m.key}">${m.label}</button>`)
      .join('');
    el('bd-mode').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      s.mode = b.dataset.mode; renderBounds();
    }));

    const label = CF.constant(s.key).label;
    const { rows } = CF.boundRows(s.key, BD_LEVELS, s.mode);
    const other = CF.boundRows(s.key, BD_LEVELS,
      s.mode === 'balanced' ? 'independent' : 'balanced').rows;

    el('bd-intro').innerHTML =
      (s.mode === 'independent'
        ? `A regular expansion's convergents alternate sides, so splitting them by parity gives `
          + `<strong>two</strong> bounding sequences: the even-indexed ones rise toward ${label} `
          + 'from below, the odd-indexed ones fall toward it from above. Each bound is '
          + 'individually as close as it can be — and <strong>C</strong>, their midpoint, suffers for it.'
        : `The bounds are no longer each chosen to be closest. C's error is exactly <em>half the `
          + 'difference</em> of the two errors, so C is best when the bounds are <em>equally</em> '
          + `wrong on opposite sides of ${label} — the search deliberately takes a worse bound on `
          + 'the better side and lets the two errors cancel. Both come from the same pool of '
          + 'one-sided best approximations (convergents and semiconvergents) under the same '
          + 'denominator budget, so this never costs accuracy.') +
      ' The <strong>mediant</strong> (pᴬ+pᴮ)/(qᴬ+qᴮ) is shown beside C throughout.';

    el('bd-table').innerHTML =
      '<tr><th>k</th><th>B lower</th><th>|err B|</th><th>A upper</th><th>|err A|</th>' +
      '<th>C = (A+B)/2</th><th>|err C|</th><th>mediant</th><th>|err med|</th>' +
      '<th>best</th></tr>' +
      rows.map(r => {
        const best = r.midBeatsBoth ? 'C'
          : (CF.Rat.cmp(r.eLower, r.eUpper) < 0 ? 'B' : 'A');
        const f = (n, d) => `${elide(String(n), 12)}/${elide(String(d), 12)}`;
        return `<tr><td>${r.k}</td>` +
          `<td class="mono">${f(r.lowerP, r.lowerQ)}</td><td class="mono">${r.eLowerStr}</td>` +
          `<td class="mono">${f(r.upperP, r.upperQ)}</td><td class="mono">${r.eUpperStr}</td>` +
          `<td class="mono">${CF.Rat.toDecimalString(r.mid, 12)}</td>` +
          `<td class="mono">${r.eMidStr}</td>` +
          `<td class="mono">${f(r.mediantP, r.mediantQ)}</td>` +
          `<td class="mono">${r.eMediantStr}</td><td><strong>${best}</strong></td></tr>`;
      }).join('');

    drawBounds(rows);

    const midWins = rows.filter(r => r.midBeatsBoth).length;
    const medWins = rows.filter(r => r.mediantBeatsMid).length;
    // Report the BEST improvement across levels, not just the deepest - the two modes can
    // tie at one level while differing sharply at others. And only give the "no
    // semiconvergents" explanation when that is actually the reason, which needs every
    // partial quotient to be 1; asserting it for a constant like pi would simply be false.
    const laterTerms = CF.convergentRowsFor(s.key, 2 * BD_LEVELS + 2, 'floor').rows.slice(1);
    const noSemis = laterTerms.length > 0 && laterTerms.every(r => r.a <= 1n);
    let gain = '', bestRatio = null, bestAt = -1;
    for (let i = 0; i < Math.min(rows.length, other.length); i++) {
      const bal = s.mode === 'balanced' ? rows[i].eMid : other[i].eMid;
      const ind = s.mode === 'balanced' ? other[i].eMid : rows[i].eMid;
      if (CF.Rat.isZero(bal) || CF.Rat.cmp(bal, ind) >= 0) continue;
      const ratio = CF.Rat.div(ind, bal);
      if (!bestRatio || CF.Rat.cmp(ratio, bestRatio) > 0) { bestRatio = ratio; bestAt = i; }
    }
    if (bestRatio) {
      gain = ` Balancing helps most at level ${bestAt}, improving C by a factor of ` +
             `${CF.sci(bestRatio, 3)}.`;
    } else if (noSemis) {
      gain = ' Balancing changes nothing here: every partial quotient is 1, so there are no ' +
             'semiconvergents to choose between. This is the hardest kind of value to improve.';
    } else {
      gain = ' Balancing happens to change nothing at these levels.';
    }
    el('bd-verdict').textContent =
      `Over these ${rows.length} levels the midpoint beat both bounds ${midWins} time` +
      `${midWins === 1 ? '' : 's'}, and the mediant beat the midpoint ${medWins} time` +
      `${medWins === 1 ? '' : 's'}.` + gain;
  }

  function drawBounds(rows) {
    const W = 900, H = 300, padL = 52, padB = 34, padT = 16, padR = 90;
    const ctx = fitCanvas(el('bd-plot'), W, H);
    ctx.clearRect(0, 0, W, H);
    if (rows.length < 2) return;
    const series = [
      { name: 'B lower', color: '#1a5fb4', get: (r) => r.eLower },
      { name: 'A upper', color: '#c64600', get: (r) => r.eUpper },
      { name: 'C midpoint', color: '#2d7d46', get: (r) => r.eMid },
      { name: 'mediant', color: '#7a4fbf', get: (r) => r.eMediant },
    ];
    const logs = [];
    for (const s2 of series) for (const r of rows) {
      const v = CF.Rat.toNumber(s2.get(r));
      if (v > 0) logs.push(Math.log10(v));
    }
    const hi = Math.max(...logs), lo = Math.min(...logs);
    const span = Math.max(1, hi - lo);
    const X = (k) => padL + k / Math.max(1, rows.length - 1) * (W - padL - padR);
    const Y = (v) => (H - padB) - (Math.log10(v) - lo) / span * (H - padB - padT);

    ctx.strokeStyle = '#eee';
    for (let d = Math.floor(lo); d <= Math.ceil(hi); d++) {
      const y = Y(Math.pow(10, d));
      if (y < padT || y > H - padB) continue;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = '#bbb'; ctx.font = '9px sans-serif';
      ctx.fillText(`1e${d}`, 6, y + 3);
    }
    series.forEach((s2, si) => {
      ctx.strokeStyle = s2.color; ctx.lineWidth = 1.5; ctx.beginPath();
      let started = false;
      rows.forEach((r, k) => {
        const v = CF.Rat.toNumber(s2.get(r));
        if (!(v > 0)) return;
        started ? ctx.lineTo(X(k), Y(v)) : ctx.moveTo(X(k), Y(v));
        started = true;
      });
      ctx.stroke();
      ctx.fillStyle = s2.color;
      rows.forEach((r, k) => {
        const v = CF.Rat.toNumber(s2.get(r));
        if (v > 0) ctx.fillRect(X(k) - 2, Y(v) - 2, 4, 4);
      });
      ctx.font = '11px sans-serif';
      ctx.fillText(s2.name, W - padR + 6, padT + 14 + si * 15);
    });
    ctx.fillStyle = '#666'; ctx.font = '11px sans-serif';
    ctx.fillText('level k', (W - padR) / 2, H - 8);
  }

  renderBounds();

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.panel).classList.add('active');
  }));
</script>
</body>
</html>
