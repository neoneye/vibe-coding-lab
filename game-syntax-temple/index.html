<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax Temple</title>
<style>
:root {
  --face: #c0c0c0;
  --light: #ffffff;
  --shadow: #808080;
  --dark: #000000;
  --title: #000080;
  --ui-font: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Geneva, Verdana, sans-serif;
  --mono-font: Fixedsys, "Lucida Console", Monaco, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #1b1b4b;
  font: bold 13px/1.3 var(--ui-font);
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.raised { border: 2px solid; border-color: var(--light) var(--shadow) var(--shadow) var(--light); background: var(--face); }
.sunken { border: 2px solid; border-color: var(--shadow) var(--light) var(--light) var(--shadow); }
.win {
  background: var(--face);
  border: 1px solid var(--dark);
  box-shadow: inset 1px 1px 0 var(--light), inset -1px -1px 0 var(--shadow), inset 2px 2px 0 var(--face), 4px 4px 0 rgba(0, 0, 0, 0.5);
  padding: 4px;
  max-width: 100%;
}
.title {
  background: var(--title);
  color: #fff;
  display: flex;
  align-items: center;
  height: 22px;
  gap: 2px;
}
.title .ttext { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title .tbox {
  width: 20px; height: 20px; flex: none; margin: 1px;
  background: var(--face);
  border: 1px solid; border-color: var(--light) var(--shadow) var(--shadow) var(--light);
  position: relative;
}
.title .tbox.sys::after { content: ""; position: absolute; left: 3px; right: 3px; top: 7px; height: 4px; background: #fff; border: 1px solid #000; box-shadow: 1px 1px 0 var(--shadow); }
.title .tbox.min::after { content: ""; position: absolute; left: 5px; top: 7px; border: 4px solid transparent; border-top-color: #000; }
.title .tbox.max::after { content: ""; position: absolute; left: 5px; top: 3px; border: 4px solid transparent; border-bottom-color: #000; }
.menubar { display: flex; border-bottom: 1px solid var(--shadow); box-shadow: 0 1px 0 var(--light); margin-bottom: 5px; position: relative; }
.menu { position: relative; }
.mtitle {
  font: inherit; color: inherit; background: none; border: 0; padding: 3px 9px; margin: 0; cursor: default;
}
.menu.open .mtitle { background: var(--title); color: #fff; }
.mdrop {
  display: none; position: absolute; left: 0; top: 100%; z-index: 20; min-width: 170px;
  background: var(--face); border: 1px solid var(--dark);
  box-shadow: inset 1px 1px 0 var(--light), inset -1px -1px 0 var(--shadow), 3px 3px 0 rgba(0, 0, 0, 0.5);
  padding: 2px;
}
.menu.open .mdrop { display: block; }
.mitem {
  display: flex; justify-content: space-between; gap: 24px; width: 100%;
  font: inherit; color: inherit; background: none; border: 0; padding: 3px 12px; margin: 0; text-align: left; cursor: default; white-space: nowrap;
}
.mitem:hover:not(:disabled), .mitem:focus-visible { background: var(--title); color: #fff; outline: none; }
.mitem:disabled { color: var(--shadow); text-shadow: 1px 1px 0 var(--light); }
.client { display: flex; gap: 6px; align-items: stretch; }
.viewport { position: relative; background: #000; line-height: 0; flex: none; display: flex; justify-content: center; }
.viewport canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.notice {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  padding: 6px 12px; line-height: 1.3; white-space: nowrap; box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
}
.side { width: 200px; flex: none; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
.caption { padding: 1px 2px; }
.listbox {
  flex: 1; min-height: 120px; background: #fff; overflow: auto; padding: 3px 5px;
  font: 13px/1.45 var(--mono-font);
}
.listbox .ln { display: block; white-space: pre-wrap; padding-left: 4ch; text-indent: -4ch; }
.listbox .off { color: #909090; }
.listbox .num { color: #000080; }
.listbox .off .num { color: #909090; }
.btnrow { display: flex; gap: 6px; }
.btn {
  flex: 1; font: inherit; color: #000; background: var(--face); padding: 4px 8px; cursor: default;
  border: 2px solid; border-color: var(--light) var(--shadow) var(--shadow) var(--light);
  outline: 1px solid var(--dark); outline-offset: 0; margin: 1px;
}
.btn:active:not(:disabled) { border-color: var(--shadow) var(--light) var(--light) var(--shadow); padding: 5px 7px 3px 9px; }
.btn:disabled { color: var(--shadow); text-shadow: 1px 1px 0 var(--light); }
.btn:focus-visible { outline: 2px solid var(--dark); }
.statusbar { display: flex; gap: 4px; margin-top: 5px; }
.statusbar .cell { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 22px; font-weight: normal; }
.statusbar .cell:first-child { flex: 1; min-width: 0; }
.statusbar .cell:last-child { flex: none; min-width: 120px; }
.modal {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(0, 0, 0, 0.25);
}
.modal[hidden] { display: none; }
.dialog { width: 430px; max-height: 100%; display: flex; flex-direction: column; }
.dbody { padding: 12px 12px 6px; font-weight: normal; overflow: auto; line-height: 1.45; }
.dbody p { margin: 0 0 9px; }
.dbody table { border-collapse: collapse; width: 100%; }
.dbody td { padding: 2px 6px 2px 0; vertical-align: top; }
.dbody td:first-child { font: bold 13px var(--mono-font); white-space: nowrap; padding-right: 12px; }
.dbtns { display: flex; justify-content: center; gap: 10px; padding: 6px 12px 10px; }
.dbtns .btn { flex: none; min-width: 84px; }
@media (max-width: 640px) {
  body { align-items: flex-start; padding: 8px; }
  .client { flex-direction: column; }
  .side { width: auto; }
  .listbox { min-height: 96px; max-height: 150px; }
}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="title">
    <span class="tbox sys" aria-hidden="true"></span>
    <span class="ttext" id="titleText">Syntax Temple</span>
    <span class="tbox min" aria-hidden="true"></span>
    <span class="tbox max" aria-hidden="true"></span>
  </div>
  <div class="menubar" id="menubar"></div>
  <div class="client">
    <div class="viewport sunken">
      <canvas id="cv" width="480" height="312"></canvas>
      <div class="notice raised" id="notice" hidden>Nothing IS YOU. Press Z to undo.</div>
    </div>
    <div class="side">
      <div class="caption" id="caption">PROGRAM.RUL</div>
      <div class="listbox sunken" id="listing"></div>
      <div class="btnrow">
        <button class="btn" id="bUndo" type="button">Undo</button>
        <button class="btn" id="bRestart" type="button">Restart</button>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <div class="sunken cell" id="stLeft"></div>
    <div class="sunken cell" id="stRight"></div>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="win dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="title"><span class="tbox sys" aria-hidden="true"></span><span class="ttext" id="dlgTitle"></span></div>
    <div class="dbody" id="dlgBody"></div>
    <div class="dbtns" id="dlgBtns"></div>
  </div>
</div>
<script id="shared-code">
"use strict";
// Syntax Temple engine: pure functions over plain state objects.
// state = { w, h, ents: [{ id, word, name, x, y }], won, noYou, moves }
const SyntaxTemple = (() => {
  const NOUNS = ['HERO', 'WALL', 'KEY', 'DOOR', 'SKULL', 'FIRE', 'GEM', 'CRATE', 'WATER'];
  const PROPS = ['YOU', 'WIN', 'STOP', 'PUSH', 'DEATH', 'SINK', 'OPEN', 'SHUT'];
  const OPS = ['IS', 'AND', 'NOT', '='];
  const CTLS = ['IF', 'THEN', 'ON', 'NEAR', 'NO'];
  const KIND = {};
  NOUNS.forEach(w => KIND[w] = 'noun');
  PROPS.forEach(w => KIND[w] = 'prop');
  OPS.forEach(w => KIND[w] = 'op');
  CTLS.forEach(w => KIND[w] = 'ctl');
  // One character per tile in room rows.
  const OBJ_CH = { '@': 'HERO', '#': 'WALL', k: 'KEY', d: 'DOOR', s: 'SKULL', f: 'FIRE', g: 'GEM', c: 'CRATE', '~': 'WATER' };
  const WORD_CH = {
    H: 'HERO', W: 'WALL', K: 'KEY', D: 'DOOR', S: 'SKULL', F: 'FIRE', G: 'GEM', C: 'CRATE', A: 'WATER',
    Y: 'YOU', V: 'WIN', X: 'STOP', P: 'PUSH', Z: 'DEATH', J: 'SINK', O: 'OPEN', U: 'SHUT',
    I: 'IS', N: 'AND', T: 'NOT', E: '=', Q: 'IF', R: 'THEN', L: 'ON', M: 'NEAR', B: 'NO',
  };

  function load(rows, extra) {
    const ents = [];
    const add = (ch, x, y) => {
      if (ch === '.') return;
      if (OBJ_CH[ch]) ents.push({ id: ents.length, word: false, name: OBJ_CH[ch], x, y });
      else if (WORD_CH[ch]) ents.push({ id: ents.length, word: true, name: WORD_CH[ch], x, y });
      else throw new Error(`unknown tile character "${ch}"`);
    };
    rows.forEach((row, y) => [...row].forEach((ch, x) => add(ch, x, y)));
    (extra || []).forEach(e => add(e.ch, e.x, e.y));
    return { w: rows[0].length, h: rows.length, ents, won: false, noYou: false, moves: 0 };
  }

  // ---- parser ----
  const isNoun = w => KIND[w] === 'noun';
  const isProp = w => KIND[w] === 'prop';

  function parseStatement(tok, i) {
    if (isNoun(tok[i]) && tok[i + 1] === '=' && isNoun(tok[i + 2]) && tok[i] !== tok[i + 2]) {
      return { stmt: { type: 'assign', from: tok[i], to: tok[i + 2] }, end: i + 3 };
    }
    const subjects = [];
    let p = i;
    const subjectAt = q => {
      const not = tok[q] === 'NOT';
      return isNoun(tok[q + (not ? 1 : 0)]) ? { noun: tok[q + (not ? 1 : 0)], not, end: q + (not ? 2 : 1) } : null;
    };
    let s = subjectAt(p);
    if (!s) return null;
    for (;;) {
      subjects.push({ noun: s.noun, not: s.not });
      p = s.end;
      if (tok[p] !== 'AND') break;
      s = subjectAt(p + 1);
      if (!s) break;
    }
    if (tok[p] !== 'IS' || !isProp(tok[p + 1])) return null;
    const props = [tok[p + 1]];
    p += 2;
    while (tok[p] === 'AND' && isProp(tok[p + 1])) { props.push(tok[p + 1]); p += 2; }
    return { stmt: { type: 'is', subjects, props }, end: p };
  }

  function parseSentence(tok, i) {
    if (tok[i] !== 'IF') {
      const r = parseStatement(tok, i);
      return r && { cond: null, stmt: r.stmt, end: r.end };
    }
    let cond, p;
    if (tok[i + 1] === 'NO' && isNoun(tok[i + 2])) {
      cond = { op: 'NO', a: tok[i + 2] }; p = i + 3;
    } else if (isNoun(tok[i + 1]) && (tok[i + 2] === 'ON' || tok[i + 2] === 'NEAR') && isNoun(tok[i + 3])) {
      cond = { op: tok[i + 2], a: tok[i + 1], b: tok[i + 3] }; p = i + 4;
    } else return null;
    if (tok[p] !== 'THEN') return null;
    const r = parseStatement(tok, p + 1);
    return r && { cond, stmt: r.stmt, end: r.end };
  }

  // Sentences in listing order: horizontal by row then column, then vertical by column then row.
  function findSentences(state) {
    const grid = new Map();
    for (const e of state.ents) if (e.word) grid.set(e.x + ',' + e.y, e.name);
    const out = [];
    const scan = (dir, outer, inner) => {
      for (let a = 0; a < outer; a++) {
        let b = 0;
        while (b < inner) {
          const cells = [], tok = [];
          for (; b < inner; b++) {
            const x = dir === 'h' ? b : a, y = dir === 'h' ? a : b;
            const w = grid.get(x + ',' + y);
            if (w === undefined) break;
            cells.push({ x, y }); tok.push(w);
          }
          b++;
          for (let i = 0; i < tok.length;) {
            const r = parseSentence(tok, i);
            if (!r) { i++; continue; }
            out.push({ dir, cells: cells.slice(i, r.end), text: tok.slice(i, r.end).join(' '), cond: r.cond, stmt: r.stmt });
            i = r.end;
          }
        }
      }
    };
    scan('h', state.h, state.w);
    scan('v', state.w, state.h);
    return out;
  }

  // ---- rules ----
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

  function evalCond(c, ents) {
    if (!c) return true;
    const A = ents.filter(e => !e.word && e.name === c.a);
    if (c.op === 'NO') return A.length === 0;
    const B = ents.filter(e => !e.word && e.name === c.b);
    return A.some(a => B.some(b => a.id !== b.id &&
      (c.op === 'ON' ? a.x === b.x && a.y === b.y : Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1)));
  }

  function rulesFor(sentences, ents) {
    const props = {};
    NOUNS.forEach(n => props[n] = new Set());
    const present = NOUNS.filter(n => ents.some(e => !e.word && e.name === n));
    const listing = sentences.map(s => {
      const active = evalCond(s.cond, ents);
      if (active && s.stmt.type === 'is') {
        for (const sub of s.stmt.subjects) {
          const targets = sub.not ? present.filter(n => n !== sub.noun) : [sub.noun];
          for (const n of targets) for (const p of s.stmt.props) props[n].add(p);
        }
      }
      return { text: s.text, active, cells: s.cells, stmt: s.stmt };
    });
    return { props, listing };
  }

  // The program as it currently runs: properties per noun and the listing in execution order.
  function rules(state) {
    return rulesFor(findSentences(state), state.ents);
  }

  // Everything that happens after movement. Repeats until the room is stable, so a
  // conditional sees what this very turn destroyed or transformed (capped for programs that oscillate).
  function settleEnts(state, ents) {
    const sentences = findSentences({ w: state.w, h: state.h, ents });
    let props;
    for (let pass = 0; pass < 8; pass++) {
      let changed = false;
      for (const s of sentences) {
        if (s.stmt.type !== 'assign' || !evalCond(s.cond, ents)) continue;
        for (const e of ents) if (!e.word && e.name === s.stmt.from) { e.name = s.stmt.to; changed = true; }
      }
      props = rulesFor(sentences, ents).props;
      const has = (e, p) => !e.word && props[e.name].has(p);
      const tiles = new Map();
      for (const e of ents) {
        if (e.word) continue;
        const k = e.x + ',' + e.y;
        if (!tiles.has(k)) tiles.set(k, []);
        tiles.get(k).push(e);
      }
      const dead = new Set();
      for (const list of tiles.values()) {
        if (list.length < 2) continue;
        const opens = list.filter(e => has(e, 'OPEN'));
        for (const o of opens) {
          const sh = list.find(e => e !== o && !dead.has(e) && has(e, 'SHUT'));
          if (sh && !dead.has(o)) { dead.add(o); dead.add(sh); }
        }
        const live = list.filter(e => !dead.has(e));
        if (live.length >= 2 && live.some(e => has(e, 'SINK'))) live.forEach(e => dead.add(e));
        for (const d of list) {
          if (dead.has(d) || !has(d, 'DEATH')) continue;
          for (const y of list) if (y !== d && !dead.has(y) && has(y, 'YOU')) dead.add(y);
        }
      }
      if (dead.size) { ents = ents.filter(e => !dead.has(e)); changed = true; }
      if (!changed) break;
    }
    const has = (e, p) => !e.word && props[e.name].has(p);
    const yous = ents.filter(e => has(e, 'YOU'));
    const won = yous.some(y => ents.some(o => has(o, 'WIN') && o.x === y.x && o.y === y.y));
    return { ents, won, noYou: yous.length === 0 };
  }

  function settle(state) {
    const r = settleEnts(state, state.ents.map(e => ({ ...e })));
    return { w: state.w, h: state.h, ents: r.ents, won: r.won, noYou: r.noYou, moves: state.moves };
  }

  // One turn: every YOU object tries to move one tile, pushing chains ahead of it.
  // Returns the same state object when nothing could move.
  function step(state, dir) {
    if (state.won || state.noYou) return state;
    const [dx, dy] = DIRS[dir];
    const props = rules(state).props;
    let ents = state.ents.map(e => ({ ...e }));
    const has = (e, p) => !e.word && props[e.name].has(p);
    const gone = new Set();
    const shove = e => {
      const nx = e.x + dx, ny = e.y + dy;
      if (nx < 0 || ny < 0 || nx >= state.w || ny >= state.h) return false;
      for (const o of ents) {
        if (o === e || gone.has(o) || o.x !== nx || o.y !== ny) continue;
        const pushable = o.word || has(o, 'PUSH');
        if (!pushable && !has(o, 'STOP')) continue;
        if (pushable && shove(o)) continue;
        if ((has(e, 'OPEN') && has(o, 'SHUT')) || (has(e, 'SHUT') && has(o, 'OPEN'))) {
          gone.add(e); gone.add(o);
          return true;
        }
        return false;
      }
      e.x = nx; e.y = ny;
      return true;
    };
    const movers = ents.filter(e => has(e, 'YOU')).sort((a, b) => (b.x * dx + b.y * dy) - (a.x * dx + a.y * dy));
    let any = false;
    for (const m of movers) {
      if (gone.has(m)) continue;
      const snapshot = ents.map(e => [e.x, e.y]);
      const goneBefore = new Set(gone);
      if (shove(m)) any = true;
      else {
        ents.forEach((e, i) => { e.x = snapshot[i][0]; e.y = snapshot[i][1]; });
        gone.clear(); goneBefore.forEach(g => gone.add(g));
      }
    }
    if (!any) return state;
    ents = ents.filter(e => !gone.has(e));
    const r = settleEnts(state, ents);
    return { w: state.w, h: state.h, ents: r.ents, won: r.won, noYou: r.noYou, moves: state.moves + 1 };
  }

  // ---- rooms ----
  // rows: one character per tile (see OBJ_CH and WORD_CH). needs: rooms that must be solved first.
  // solution: a recorded winning move sequence, replayed by the tests.
  const ROOMS = [
    { name: "First Words", needs: [], rows: [
      '####################',
      '#HIY#..............#',
      '#WIX#..............#',
      '#####..............#',
      '#..................#',
      '#...GI.............#',
      '#..........V.......#',
      '#..................#',
      '#.@............g...#',
      '#..................#',
      '#..................#',
      '#..................#',
      '####################',
    ], solution: 'URRRRRRRRRRULLLLLDLUDDRRRRRRRRR' },
    { name: "Loose Ends", needs: [0], rows: [
      '####################',
      '#HIY#GIV#....#######',
      '#CIP#####....#.....#',
      '#########....#..g..#',
      '#............#.....#',
      '#............#######',
      '#..................#',
      '######.....W.......#',
      '#....#.....I.......#',
      '#.@..c.....X.......#',
      '#....#.............#',
      '######.............#',
      '####################',
    ], solution: 'RRRRURRRRRLUUUUURRRRRR' },
    { name: "Change of Self", needs: [1], rows: [
      '####################',
      '#WIX#GIV#..........#',
      '#########..........#',
      '#..................#',
      '#..######..........#',
      '#..#....#....k.....#',
      '#..#..K.#..........#',
      '#..#HIY.#.......g..#',
      '#..#....#..........#',
      '#..#.@..#..........#',
      '#..######..........#',
      '#..................#',
      '####################',
    ], solution: 'URRUULLULDRRRDD' },
    { name: "Sink or Skull", needs: [1], rows: [
      '####################',
      '#HIY.WIX.GIV.CIP...#',
      '#AIJ...............#',
      '####################',
      '#......~...........#',
      '#......~...........#',
      '#.@....~.....sss...#',
      '#...c..~.....sgs...#',
      '#......~.....sss...#',
      '#......~...........#',
      '#......~..SIZ......#',
      '#......~...........#',
      '####################',
    ], solution: 'DRRRRRRDDRRRDUUURRR' },
    { name: "Lock and Key", needs: [2], rows: [
      '####################',
      '#HIY.WIX.GIV.DIX...#',
      '#DIU.KIP...........#',
      '####################',
      '#...........#......#',
      '#....KI.....#......#',
      '#...........#......#',
      '#.@.........d...g..#',
      '#...........#......#',
      '#...k....O..#......#',
      '#...........#......#',
      '#...........#......#',
      '####################',
    ], solution: 'DDDRRRRRRRUUUURULLDDDDDLLLLUULURRRRRRRRRRRRR' },
    { name: "One Line", needs: [2], rows: [
      '####################',
      '#WIX#..............#',
      '#####.....N........#',
      '#..................#',
      '#............V.....#',
      '#..................#',
      '#....HIY...........#',
      '#..................#',
      '#..@...........###.#',
      '#..............#g#.#',
      '#..............###.#',
      '#..................#',
      '####################',
    ], solution: 'UUUUURRRRRRRRULLULDDDDRRRRRRULLLLULDD' },
    { name: "Everything But", needs: [3], rows: [
      '####################',
      '#HIY.WIX.GIV.SIZ...#',
      '#AIJ...............#',
      '####################',
      '#........s~........#',
      '#........s~........#',
      '#..HIP...s~....g...#',
      '#........s~........#',
      '#.@......s~........#',
      '#....T...s~........#',
      '#........s~........#',
      '#........s~........#',
      '####################',
    ], solution: 'RRRRDLLLDLUUUDRRRRRRRRRLLLLLLLLLUUDDRRRRRRRRRUURRRR' },
    { name: "Moat of Riches", needs: [3], rows: [
      '####################',
      '#HIY.WIX.GIV.AIJ...#',
      '####################',

  function openRoom(i) {
    const r = ROOMS[i];
    return settle(load(r.rows, r.extra));
  }

  function replay(i, moves) {
    return [...moves].reduce((st, m) => step(st, m), openRoom(i));
  }

  // ---- world map ----
  // , grass  t forest  h hills  ^ mountain  ~ water  1-9 a b c: the temple of room 1-12.
  const MAP_ROWS = [
    '^^^^^^^^^,,,tt,,,,,,^^^^',
    '^^^^^^^,,,,tt,5,,,hh,^^^',
    '^^^^^,,,,t,,,,,,,h,,,,^^',
    '^^^,,,,,tt,,,,~~,,9,,,,^',
    '^^,,,t,,,,3,,,~~,,,,h,,^',
    '^,,,tt,,,,,,,,6,,,,,,,,^',
    ',,,,,,,,,hh,,,,,,^^,,,,,',
    ',,,,,,,,,^^^,,,,^^^,,,,,',
    ',,1,,,,2,^^^^,,,^^^b,,c,',

    '~,,,tt,,,,,,,,,,,,,,,t,,',
    '~~,,,,,,,,4,,,~,,,a,,tt,',
    '~~~,,,,,,,,,,~~,,,,,,,,~',
    '~~~~,,,,h,,,,,8,,,,h,,~~',
    '~~~~~~,,,hh,,,,,,,,,~~~~',
  ];
  const MAP = (() => {
    const temples = [];
    MAP_ROWS.forEach((row, y) => [...row].forEach((ch, x) => {
      const room = '123456789abc'.indexOf(ch);
      if (room >= 0) temples.push({ room, x, y });
    }));
    temples.sort((a, b) => a.room - b.room);
    return { rows: MAP_ROWS, start: { x: 1, y: 8 }, temples };
  })();

  // Each tile belongs to its nearest temple. A tile is out of the fog once that
  // temple's room is available (everything it needs is solved) or solved.
  const MAP_OWNER = MAP.rows.map((row, y) => [...row].map((_, x) => {
    let best = 0, bestD = Infinity;
    for (const t of MAP.temples) {
      const d = (t.x - x) ** 2 + (t.y - y) ** 2;
      if (d < bestD) { bestD = d; best = t.room; }
    }
    return best;
  }));

  function roomAvailable(solved, room) {
    return solved.includes(room) || ROOMS[room].needs.every(n => solved.includes(n));
  }

  function revealed(solved) {
    const out = new Set();
    MAP_OWNER.forEach((row, y) => row.forEach((room, x) => { if (roomAvailable(solved, room)) out.add(x + ',' + y); }));
    return out;
  }

  function walkable(solved, x, y) {
    if (x < 0 || y < 0 || y >= MAP.rows.length || x >= MAP.rows[0].length) return false;
    const ch = MAP.rows[y][x];
    return ch !== '^' && ch !== '~' && roomAvailable(solved, MAP_OWNER[y][x]);
  }

  // Unsolved rooms whose temple can be reached on foot from the start tile.
  function openTemples(solved) {
    const seen = new Set([MAP.start.x + ',' + MAP.start.y]);
    const queue = [MAP.start];
    while (queue.length) {
      const { x, y } = queue.pop();
      for (const [dx, dy] of Object.values(DIRS)) {
        const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
        if (seen.has(k) || !walkable(solved, nx, ny)) continue;
        seen.add(k);
        queue.push({ x: nx, y: ny });
      }
    }
    return MAP.temples.filter(t => !solved.includes(t.room) && seen.has(t.x + ',' + t.y)).map(t => t.room);
  }

  function templeAt(x, y) {
    const t = MAP.temples.find(t => t.x === x && t.y === y);
    return t ? t.room : -1;
  }

  return { NOUNS, PROPS, OPS, CTLS, KIND, OBJ_CH, WORD_CH, load, findSentences, DIRS, rules, settle, step, ROOMS, openRoom, replay, MAP, revealed, walkable, openTemples, templeAt, roomAvailable };
})();

    // ---- rules and the turn step ----

    t('blocked move is no turn', () => { const s = run(['@', 'H', 'I', 'Y'], ''); eq(SyntaxTemple.step(s, 'L') === s, true); });
    t('stop',             () => eq(at(run(['@#.', 'HIY', 'WIX'], 'R'), 0, 0), ['HERO']));
    t('no stop = walk through', () => eq(at(run(['@#.', 'HIY'], 'R'), 1, 0).sort(), ['HERO', 'WALL']));
    t('push chain',       () => eq(at(run(['@cc.', 'HIY.', 'CIP.'], 'R'), 3, 0), ['CRATE']));
    t('push chain blocked at edge', () => eq(at(run(['@cc', 'HIY', 'CIP'], 'R'), 0, 0), ['HERO']));
    t('words always push',() => eq(at(run(['@X.', 'HIY'], 'R'), 2, 0), ['STOP']));

    t('win',              () => eq(run(['@g.', 'HIY', 'GIV'], 'R').won, true));
    t('you and win',      () => eq(run(['@..', 'HIY', 'HIV'], '').won, true));
    t('death',            () => { const s = run(['@s.', 'HIY', 'SIZ'], 'R'); eq([at(s, 1, 0), s.noYou], [['SKULL'], true]); });
    t('sink',             () => eq(at(run(['@c~', 'HIY', 'CIP', 'AIJ'], 'R'), 2, 0), []));
    t('sink spares words',() => eq(at(run(['@X~', 'HIY', 'AIJ'], 'R'), 2, 0).sort(), ['STOP', 'WATER']));
    t('open shut through stop', () => eq(at(run(['@kd..', 'HIY..', 'KIPNO', 'DIXNU'], 'R'), 2, 0), []));
    t('shut stop blocks without key', () => eq(at(run(['@d...', 'HIY..', 'DIXNU'], 'R'), 0, 0), ['HERO']));
    t('not',              () => eq(at(run(['@c..', 'HIY.', 'THIP'], 'R'), 2, 0), ['CRATE']));
    t('assignment',       () => eq(at(run(['@.s', 'HIY', 'SEK'], ''), 2, 0), ['KEY']));
    t('assignments run in order', () => eq(at(run(['@.s', 'HIY', 'SEK', 'KEG'], ''), 2, 0), ['GEM']));

    t('assignment ignores words', () => eq(SyntaxTemple.rules(run(['@.s', 'HIY', 'SEK'], '')).listing.length, 2));

    t('if no',            () => eq(SyntaxTemple.rules(run(['@.d....', 'HIY....', 'QBSRDIV'], '')).props.DOOR.has('WIN'), true));
    t('conditional sees this turn\'s destruction', () => eq(run(['@s~....', 'HIY....', 'SIPNAIJ', 'QBSRHIV'], 'R').won, true));
    t('oscillating program terminates', () => eq(run(['@sk.....', 'HIY.....', 'QBKRSEK.', 'QBSRKES.'], '').ents.length > 0, true));
    t('won state is frozen', () => { const s = run(['@g.', 'HIY', 'GIV'], 'R'); eq(SyntaxTemple.step(s, 'L') === s, true); });
    t('step does not mutate', () => { const a = run(['@..', 'HIY'], ''); const j = JSON.stringify(a); SyntaxTemple.step(a, 'R'); eq(JSON.stringify(a), j); });
    // ---- rooms ----
    const TAUGHT = [
      ['HERO', 'IS', 'YOU', 'WIN', 'WALL', 'STOP', 'GEM'], ['PUSH', 'CRATE'], ['KEY'], ['DEATH', 'SINK', 'SKULL', 'WATER'],
      ['OPEN', 'SHUT', 'DOOR'], ['AND'], ['NOT'], ['='], ['IF', 'THEN', 'ON', 'FIRE'], ['IF', 'THEN', 'NEAR', 'NO'], [], [],
    ];
    const ROOMS = SyntaxTemple.ROOMS || [];
    t('12 rooms', () => eq(ROOMS.length, 12));
    const allowed = i => {
      const seen = new Set(), words = new Set();
      const visit = j => { if (seen.has(j)) return; seen.add(j); TAUGHT[j].forEach(w => words.add(w)); ROOMS[j].needs.forEach(visit); };
      visit(i);
      return words;
    };
    const wordSig = st => st.ents.filter(e => e.word).map(e => `${e.id}:${e.x},${e.y}`).join(' ');
    const fullSig = st => st.ents.map(e => `${e.id}${e.name[0]}${e.x},${e.y}`).join(' ');
    ROOMS.forEach((r, i) => {
      const n = i + 1;
      t(`room ${n} shape`, () => eq([r.rows.length, ...new Set(r.rows.map(x => x.length))], [13, 20]));
      t(`room ${n} has a name`, () => eq(typeof r.name === 'string' && r.name.length > 0, true));
      t(`room ${n} not won at start`, () => { const s = SyntaxTemple.openRoom(i); eq([s.won, s.noYou], [false, false]); });
      t(`room ${n} solution wins`, () => eq(SyntaxTemple.replay(i, r.solution).won, true));
      t(`room ${n} wins only on last move`, () => eq(SyntaxTemple.replay(i, r.solution.slice(0, -1)).won, false));
      t(`room ${n} solution has no wasted moves`, () => eq(SyntaxTemple.replay(i, r.solution).moves, r.solution.length));
      t(`room ${n} uses only taught words`, () => {
        const ok = allowed(i);
        eq(SyntaxTemple.openRoom(i).ents.filter(e => e.word && !ok.has(e.name)).map(e => e.name), []);
      });
      t(`room ${n} needs a rule change`, () => {
        const start = SyntaxTemple.openRoom(i), words = wordSig(start);
        const seen = new Set([fullSig(start)]);
        let frontier = [start], won = false;
        while (frontier.length && !won) {
          const next = [];
          for (const st of frontier) for (const d of 'UDLR') {
            const s2 = SyntaxTemple.step(st, d);
            if (s2 === st || wordSig(s2) !== words) continue;
            if (s2.won) won = true;
            const k = fullSig(s2);
            if (!seen.has(k)) { seen.add(k); next.push(s2); }
          }
          if (seen.size > 60000) throw new Error('search too large');
          frontier = next;
        }
        eq(won, false);
      });
    });
    // ---- world map ----
    const MAP = SyntaxTemple.MAP || { rows: [], temples: [] };
    t('map shape',  () => eq([MAP.rows.length, ...new Set(MAP.rows.map(r => r.length))], [16, 24]));
    t('12 temples', () => eq(MAP.temples.map(x => x.room).sort((a, b) => a - b), [...Array(12).keys()]));
    t('start opens room 1 only', () => eq(SyntaxTemple.openTemples([]), [0]));
    t('start tile is walkable', () => eq(SyntaxTemple.walkable([], MAP.start.x, MAP.start.y), true));
    t('out of bounds is not walkable', () => eq([SyntaxTemple.walkable([], -1, 0), SyntaxTemple.walkable([], 0, 16)], [false, false]));
    t('unrevealed is not walkable', () => { const f = MAP.temples.find(x => x.room === 11); eq(SyntaxTemple.walkable([], f.x, f.y), false); });
    t('solving reveals more', () => eq(SyntaxTemple.revealed([0]).size > SyntaxTemple.revealed([]).size, true));
    t('everything revealed at the end', () => eq(SyntaxTemple.revealed([...Array(12).keys()]).size, 24 * 16));
    t('every solve order finishes and keeps a choice', () => {
      const seen = new Set();
      const visit = solved => {
        const k = solved.join(',');
        if (seen.has(k)) return;
        seen.add(k);
        if (solved.length === 12) return;
        const open = SyntaxTemple.openTemples(solved);
        if (open.length === 0) throw new Error(`stuck after [${k}]`);
        const left = branch => branch.some(r => !solved.includes(r));
        // A choice of rooms as long as neither branch of the temple is finished.
        if (solved.includes(0) && solved.includes(1) && left([2, 4, 5, 8]) && left([3, 6, 7, 9]) && open.length < 2) throw new Error(`no choice after [${k}]`);
        if (open.includes(11) && solved.length < 11) throw new Error(`finale open early after [${k}]`);
        for (const r of open) visit([...solved, r].sort((a, b) => a - b));
      };
      visit([]);
    });
    /*TESTS*/

    console.log(`${count - fails}/${count} tests passed`);
    return fails === 0;
  }
  return { run };
})();

    K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '111101101101111',
    P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
    Z: '111001010100111', '=': '000111000111000',
  };
  const KIND_COLOUR = { noun: 3, prop: 11, op: 12, ctl: 10 };
  const WALL_TINTS = [8, 9, 2, 5, 10, 3, 8, 2, 9, 5, 10, 13];
  const Z_ORDER = ['WATER', 'FIRE', 'DOOR', 'WALL', 'GEM', 'KEY', 'CRATE', 'SKULL', 'HERO'];

  function blank() {
    const c = document.createElement('canvas');
    c.width = c.height = T;
    return c;
  }
  function artSprite(rows) {
    const c = blank(), g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = PAL[parseInt(ch, 16)];
      g.fillRect(x * 2, y * 2, 2, 2);
    }));
    return c;
  }
  function wallSprite(colour) {
    const c = blank(), g = c.getContext('2d');
    g.fillStyle = PAL[0];
    g.fillRect(0, 0, T, T);
    g.fillStyle = PAL[colour];
    for (let k = 0; k < 4; k++) for (let x = -(k % 2) * 6; x < T; x += 12) g.fillRect(x, k * 6, 11, 5);
    return c;
  }
  // A word tile is a raised button. Running words are lit in their kind's colour; idle ones are dark.
  function wordSprite(word, lit) {
    const c = blank(), g = c.getContext('2d');
    const kc = KIND_COLOUR[E.KIND[word]];
    const rect = (col, x, y, w, h) => { g.fillStyle = PAL[col]; g.fillRect(x, y, w, h); };
    rect(0, 0, 0, 24, 24);
    rect(lit ? 14 : 1, 0, 0, 23, 23);
    rect(lit ? 15 : 13, 0, 0, 22, 22);
    rect(lit ? kc : 14, 1, 1, 21, 21);
    const n = word.length;
    const sx = word === '=' ? 4 : n <= 3 ? 2 : 1, sy = 2;
    const total = n * 3 * sx + (n - 1);
    let x0 = 1 + Math.floor((21 - total) / 2);
    const y0 = 6;
    g.fillStyle = PAL[lit ? 0 : kc];
    for (const ch of word) {
      const bits = FONT[ch];
      for (let i = 0; i < 15; i++) if (bits[i] === '1') g.fillRect(x0 + (i % 3) * sx, y0 + Math.floor(i / 3) * sy, sx, sy);
      x0 += 3 * sx + 1;
    }
    return c;
  }
  const SPR = {};
  for (const k of Object.keys(ART)) SPR[k] = artSprite(ART[k]);
  const WALLS = {};
  for (const tint of new Set(WALL_TINTS)) WALLS[tint] = wallSprite(tint);
  const WORDS = {};
  for (const w of Object.values(E.WORD_CH)) WORDS[w] = [wordSprite(w, false), wordSprite(w, true)];

  // ---- state ----
  const SAVE_KEY = 'syntax-temple-v1';
  const params = new URLSearchParams(location.search);
  let noSave = false;
  let screen = 'map';
  let solved = [];
  let pos = { ...E.MAP.start };
  let roomIdx = 0, st = null, undoStack = [], cache = null, wonShown = false;
  let anim = null, busy = false, busyTimer = 0;
  const queue = [];

  function readSave() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!d || !Array.isArray(d.solved)) return;
      if (!d.solved.every(n => Number.isInteger(n) && n >= 0 && n < E.ROOMS.length)) return;
      solved = [...new Set(d.solved)].sort((a, b) => a - b);
      if (d.pos && Number.isInteger(d.pos.x) && Number.isInteger(d.pos.y) && E.walkable(solved, d.pos.x, d.pos.y)) pos = { x: d.pos.x, y: d.pos.y };
    } catch (e) { /* no storage, or nothing usable in it: start fresh */ }
  }
  function writeSave() {
    if (noSave) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ solved, pos })); } catch (e) { /* play on without saving */ }
  }

  // ---- canvas ----
  const cv = $('cv'), ctx = cv.getContext('2d');
  let scale = 1;
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    const narrow = window.innerWidth <= 640;
    const availW = window.innerWidth - (narrow ? 34 : 244);
    const availH = window.innerHeight - (narrow ? 340 : 150);
    let s = Math.floor(Math.min(availW / LOG_W, availH / LOG_H) * dpr);
    if (!(s >= 1)) s = 1;
    scale = s;
    cv.width = LOG_W * s;
    cv.height = LOG_H * s;
    // Whole device pixels per art pixel. Only a window too small for 1:1 is squeezed further.
    let cssW = LOG_W * s / dpr;
    if (availW >= 120 && cssW > availW) cssW = availW;
    cv.style.width = cssW + 'px';
    cv.style.height = cssW * LOG_H / LOG_W + 'px';
    draw();
  }
  function blit(sprite, px, py) {
    ctx.drawImage(sprite, Math.round(px * scale), Math.round(py * scale), T * scale, T * scale);
  }
  function animT(now) {
    if (!anim) return 1;
    return Math.max(0, Math.min(1, (now - anim.t0) / anim.dur));
  }

  function drawRoom(now) {
    const t = animT(now);
    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, cv.width, cv.height);
    const wall = WALLS[WALL_TINTS[roomIdx]];
    const at = e => {
      const f = anim && anim.from.get(e.id);
      return f ? [(f.x + (e.x - f.x) * t) * T, (f.y + (e.y - f.y) * t) * T] : [e.x * T, e.y * T];
    };
    const objs = st.ents.filter(e => !e.word).sort((a, b) => Z_ORDER.indexOf(a.name) - Z_ORDER.indexOf(b.name));
    for (const e of objs) blit(e.name === 'WALL' ? wall : SPR[e.name], ...at(e));
    for (const e of st.ents) if (e.word) blit(WORDS[e.name][cache.lit.has(e.x + ',' + e.y) ? 1 : 0], ...at(e));
  }

  function drawMap(now) {
    const t = animT(now);
    const px = anim ? anim.fromPos.x + (pos.x - anim.fromPos.x) * t : pos.x;
    const py = anim ? anim.fromPos.y + (pos.y - anim.fromPos.y) * t : pos.y;
    const mw = E.MAP.rows[0].length, mh = E.MAP.rows.length;
    const camX = Math.max(0, Math.min(mw - VIEW_W, px + 0.5 - VIEW_W / 2));
    const camY = Math.max(0, Math.min(mh - VIEW_H, py + 0.5 - VIEW_H / 2));
    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, cv.width, cv.height);
    const seen = cache.revealed;
    const TERRAIN = { ',': 'GRASS', t: 'FOREST', h: 'HILLS', '^': 'MOUNTAIN', '~': 'WATER' };
    for (let y = Math.floor(camY); y < Math.min(mh, camY + VIEW_H + 1); y++) {
      for (let x = Math.floor(camX); x < Math.min(mw, camX + VIEW_W + 1); x++) {
        if (!seen.has(x + ',' + y)) continue;
        const sx = (x - camX) * T, sy = (y - camY) * T;
        const room = E.templeAt(x, y);
        blit(SPR[room >= 0 ? 'GRASS' : TERRAIN[E.MAP.rows[y][x]]], sx, sy);
        if (room >= 0) {
          blit(SPR.TEMPLE, sx, sy);
          if (solved.includes(room)) blit(SPR.FLAG, sx, sy);
        }
      }
    }
    blit(SPR.HERO, (px - camX) * T, (py - camY) * T);
  }

  function draw(now) {
    if (screen === 'room') drawRoom(now === undefined ? performance.now() : now);
    else drawMap(now === undefined ? performance.now() : now);
  }
  function frame(now) {
    if (!anim) return;
    draw(now);
    requestAnimationFrame(frame);
  }

  // ---- side panel, status bar, title ----
  function line(text, off, num) {
    const div = document.createElement('span');
    div.className = 'ln' + (off ? ' off' : '');
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = num;
    div.append(n, ' ' + text);
    return div;
  }
  function refresh() {
    const listing = $('listing');
    listing.textContent = '';
    if (screen === 'room') {
      const r = E.rules(st);
      cache = { lit: new Set() };
      r.listing.forEach((l, i) => {
        if (l.active) l.cells.forEach(c => cache.lit.add(c.x + ',' + c.y));
        listing.append(line(l.text, !l.active, String((i + 1) * 10).padStart(3, ' ')));
      });
      const room = E.ROOMS[roomIdx];
      $('caption').textContent = 'PROGRAM.RUL';
      $('titleText').textContent = `Syntax Temple - [${room.name}]`;
      $('stLeft').textContent = `Room ${roomIdx + 1}: ${room.name}`;
      $('stRight').textContent = `Moves: ${st.moves}`;
      $('notice').hidden = !st.noYou;
    } else {
      cache = { revealed: E.revealed(solved) };
      E.ROOMS.forEach((room, i) => {
        const known = E.roomAvailable(solved, i);
        const mark = solved.includes(i) ? '[x]' : known ? '[ ]' : '   ';
        listing.append(line(known ? room.name : '???', !known, `${mark} ${String(i + 1).padStart(2, ' ')}`));
      });
      const here = E.templeAt(pos.x, pos.y);
      $('caption').textContent = 'TEMPLES.DIR';
      $('titleText').textContent = 'Syntax Temple';
      $('stLeft').textContent = here >= 0 ? `Temple ${here + 1}: ${E.ROOMS[here].name}. Press Enter to go in.` : 'Walk to a temple and press Enter.';
      $('stRight').textContent = `${solved.length} of ${E.ROOMS.length} solved`;
      $('notice').hidden = true;
    }
    const inRoom = screen === 'room';
    $('bUndo').disabled = !inRoom || undoStack.length === 0;
    $('bRestart').disabled = !inRoom;
    for (const b of document.querySelectorAll('.mitem')) {
      const id = b.dataset.id;
      if (id === 'undo') b.disabled = !inRoom || undoStack.length === 0;
      if (id === 'restart' || id === 'map') b.disabled = !inRoom;
    }
  }

  // ---- screens and moves ----
  function stopAnim() {
    clearTimeout(busyTimer);
    anim = null;
    busy = false;
    queue.length = 0;
  }
  function enterRoom(i) {
    stopAnim();
    screen = 'room';
    roomIdx = i;
    st = E.openRoom(i);
    undoStack = [];
    wonShown = false;
    refresh();
    draw();
  }
  function showMap() {
    stopAnim();
    screen = 'map';
    refresh();
    draw();
  }
  function undo() {
    if (screen !== 'room' || !undoStack.length || dialogOpen()) return;
    stopAnim();
    st = undoStack.pop();
    wonShown = false;
    refresh();
    draw();
  }
  function restart() {
    if (screen !== 'room' || dialogOpen()) return;
    stopAnim();
    const fresh = E.openRoom(roomIdx);
    if (undoStack.length || st.moves) undoStack.push(st);
    st = fresh;
    wonShown = false;
    refresh();
    draw();
  }
  // Applies one move. Returns true if anything moved.
  function move(dir, animate) {
    if (dialogOpen()) return false;
    const t0 = performance.now();
    if (screen === 'room') {
      const next = E.step(st, dir);
      if (next === st) return false;
      undoStack.push(st);
      anim = animate ? { t0, dur: 100, from: new Map(st.ents.map(e => [e.id, { x: e.x, y: e.y }])) } : null;
      st = next;
    } else {
      const [dx, dy] = E.DIRS[dir];
      if (!E.walkable(solved, pos.x + dx, pos.y + dy)) return false;
      anim = animate ? { t0, dur: 100, fromPos: { ...pos } } : null;
      pos = { x: pos.x + dx, y: pos.y + dy };
      writeSave();
    }
    refresh();
    return true;
  }
  function afterMove() {
    if (screen === 'room' && st.won && !wonShown) {
      wonShown = true;
      roomSolved();
    }
  }
  function pump() {
    while (!busy && queue.length) {
      if (!move(queue.shift(), true)) continue;
      busy = true;
      requestAnimationFrame(frame);
      busyTimer = setTimeout(() => {
        busy = false;
        anim = null;
        draw();
        afterMove();
        pump();
      }, 100);
    }
  }
  function roomSolved() {
    const first = !solved.includes(roomIdx);
    const before = E.openTemples(solved).length;
    if (first) {
      solved = [...solved, roomIdx].sort((a, b) => a - b);
      writeSave();
    }
    const name = E.ROOMS[roomIdx].name;
    let html = `<p><b>${name}</b> is solved in ${st.moves} moves.</p>`;
    if (first && solved.length === E.ROOMS.length) {
      html += '<p>That was the last temple. Every program in the land now runs the way you wrote it.</p><p>All rooms stay open if you want to find other solutions.</p>';
    } else if (first && E.openTemples(solved).length > before - 1) {
      html += '<p>The fog lifts over new ground on the map.</p>';
    }
    showDialog('Room solved', html, [{ label: 'OK', run: showMap }]);
  }
  function enterTemple() {
    if (screen !== 'map' || dialogOpen()) return;
    const room = E.templeAt(pos.x, pos.y);
    if (room >= 0) enterRoom(room);
  }

  // ---- dialogs ----
  let dialogButtons = null;
  const dialogOpen = () => dialogButtons !== null;
  function showDialog(title, html, buttons) {
    stopAnim();
    draw();
    $('dlgTitle').textContent = title;
    $('dlgBody').innerHTML = html;
    const row = $('dlgBtns');
    row.textContent = '';
    dialogButtons = buttons;
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn';
      el.type = 'button';
      el.textContent = b.label;
      el.addEventListener('click', () => closeDialog(b));
      row.append(el);
    });
    $('modal').hidden = false;
    row.firstChild.focus();
  }
  function closeDialog(button) {
    dialogButtons = null;
    $('modal').hidden = true;
    if (button && button.run) button.run();
  }

  const MEANING = {
    HERO: 'the explorer', WALL: 'temple brickwork', KEY: 'a key', DOOR: 'a door', SKULL: 'a skull', FIRE: 'a flame',
    GEM: 'a gem', CRATE: 'a crate', WATER: 'water',
    YOU: 'moves when you press a direction', WIN: 'solves the room when something that is YOU stands on it',
    STOP: 'cannot be entered', PUSH: 'is shoved along when walked into; beats STOP',
    DEATH: 'destroys anything that is YOU on its tile', SINK: 'destroys itself and whatever shares its tile',
    OPEN: 'destroys itself and a SHUT thing when they meet', SHUT: 'destroys itself and an OPEN thing when they meet',
    IS: 'gives the things on its left the properties on its right', AND: 'joins several things, or several properties, in one line',
    NOT: 'placed before a thing: every kind of thing in the room except that one',
    '=': 'turns every thing on its left into the thing on its right. Several = lines run top to bottom, like a program',
    IF: 'starts a test; the line after THEN only runs while the test is true', THEN: 'ends the test of an IF line',
    ON: 'test: the two things share a tile', NEAR: 'test: the two things are side by side', NO: 'test: the room holds none of that thing',
  };
  function showHow() {
    showDialog('How to play', `
      <p>Every room runs a small program made of word tiles. The list beside the room shows the lines that are running right now.</p>
      <p>Walk into a word to push it. Words lined up left to right, or top to bottom, make a statement such as <b>WALL IS STOP</b>. Push a word out of line and that statement stops running.</p>
      <p>A room is solved when something that IS YOU stands on something that IS WIN. What is YOU, what is WIN and what blocks the way are all up to the program.</p>
      <p>Arrows or WASD move. Z undoes a move, R restarts the room, Esc returns to the map. On the map, walk onto a temple and press Enter. If a room has you stuck, try another temple.</p>`,
      [{ label: 'OK' }]);
  }
  function showWords() {
    const met = new Set();
    E.ROOMS.forEach((room, i) => {
      if (!E.roomAvailable(solved, i)) return;
      for (const ch of room.rows.join('')) if (E.WORD_CH[ch]) met.add(E.WORD_CH[ch]);
    });
    const order = [...E.NOUNS, ...E.PROPS, ...E.OPS, ...E.CTLS].filter(w => met.has(w));
    const rows = order.map(w => `<tr><td>${w}</td><td>${MEANING[w]}</td></tr>`).join('');
    showDialog('Word reference', `<p>The words you have met so far:</p><table>${rows}</table>`, [{ label: 'OK' }]);
  }
  function showAbout() {
    showDialog('About Syntax Temple', `
      <p><b>Syntax Temple</b></p>
      <p>A puzzle game about rewriting the rules. Twelve temples, each running a program you are free to edit.</p>
      <p>The idea of pushing rule words around a room comes from Arvi Teikari's <i>Baba Is You</i>. The rooms, the language and the art here are this game's own.</p>`,
      [{ label: 'OK' }]);
  }
  function askNewGame() {
    showDialog('New game', '<p>Start over? All solved temples will be forgotten.</p>', [
      { label: 'Cancel' },
      { label: 'Start over', run: () => {
        solved = [];
        pos = { ...E.MAP.start };
        try { if (!noSave) localStorage.removeItem(SAVE_KEY); } catch (e) { /* nothing stored */ }
        showMap();
      } },
    ]);
  }

  // ---- menus ----
  const MENUS = [
    { label: 'Game', items: [['new', 'New game...', ''], ['map', 'Return to map', 'Esc']] },
    { label: 'Room', items: [['undo', 'Undo', 'Z'], ['restart', 'Restart', 'R']] },
    { label: 'Help', items: [['how', 'How to play', ''], ['words', 'Word reference', ''], ['about', 'About Syntax Temple', '']] },
  ];
  const ACTIONS = { new: askNewGame, map: showMap, undo, restart, how: showHow, words: showWords, about: showAbout };
  const closeMenus = () => document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  function buildMenus() {
    const bar = $('menubar');
    for (const m of MENUS) {
      const menu = document.createElement('div');
      menu.className = 'menu';
      const title = document.createElement('button');
      title.className = 'mtitle';
      title.type = 'button';
      title.innerHTML = `<u>${m.label[0]}</u>${m.label.slice(1)}`;
      title.setAttribute('aria-haspopup', 'true');
      title.addEventListener('click', () => {
        const was = menu.classList.contains('open');
        closeMenus();
        if (!was) menu.classList.add('open');
        title.blur();
      });
      title.addEventListener('mouseenter', () => {
        if (document.querySelector('.menu.open') && !menu.classList.contains('open')) { closeMenus(); menu.classList.add('open'); }
      });
      const drop = document.createElement('div');
      drop.className = 'mdrop';
      for (const [id, label, key] of m.items) {
        const item = document.createElement('button');
        item.className = 'mitem';
        item.type = 'button';
        item.dataset.id = id;
        const a = document.createElement('span'), b = document.createElement('span');
        a.textContent = label;
        b.textContent = key;
        item.append(a, b);
        item.addEventListener('click', () => { closeMenus(); item.blur(); ACTIONS[id](); });
        drop.append(item);
      }
      menu.append(title, drop);
      bar.append(menu);
    }
    document.addEventListener('mousedown', e => { if (!e.target.closest('.menu')) closeMenus(); });
  }

  // ---- input ----
  const KEY_DIR = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R' };
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (dialogOpen()) {
      if (key === 'Escape') { e.preventDefault(); closeDialog(dialogButtons[0]); }
      return;
    }
    if (key === 'Escape') {
      e.preventDefault();
      if (document.querySelector('.menu.open')) closeMenus();
      else if (screen === 'room') showMap();
      return;
    }
    const dir = KEY_DIR[key];
    if (dir) {
      e.preventDefault();
      closeMenus();
      // A held key repeats only when its last press has been used up; quick taps are queued.
      if (e.repeat && (queue.length || busy)) return;
      if (queue.length < 4) queue.push(dir);
      pump();
    } else if (key === 'z') {
      e.preventDefault();
      undo();
    } else if (key === 'r') {
      e.preventDefault();
      if (!e.repeat) restart();
    } else if (key === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      enterTemple();
    }
  });
  $('bUndo').addEventListener('click', () => { $('bUndo').blur(); undo(); });
  $('bRestart').addEventListener('click', () => { $('bRestart').blur(); restart(); });
  window.addEventListener('resize', fit);

  // ---- start ----
  buildMenus();
  if (params.has('solved')) {
    noSave = true;
    solved = [...new Set(params.get('solved').split(',').map(Number).filter(n => Number.isInteger(n) && n >= 0 && n < E.ROOMS.length))].sort((a, b) => a - b);
  } else {
    readSave();
  }
  const roomParam = parseInt(params.get('room'), 10);
  if (roomParam >= 1 && roomParam <= E.ROOMS.length) {
    noSave = true;
    enterRoom(roomParam - 1);
    for (const m of params.get('moves') || '') if (E.DIRS[m]) move(m, false);
    afterMove();
  } else {
    refresh();
  }
  fit();

  // Handle for checking the page from the console or a test driver.
  window.__st = {
    enterRoom, showMap, undo, restart, draw: () => { anim = null; draw(); },
    press: dir => { stopAnim(); const moved = move(dir, false); draw(); afterMove(); return moved; },
    state: () => st, screen: () => screen, pos: () => ({ ...pos }),
    solved: () => [...solved],
    setSolved: list => { solved = [...list].sort((a, b) => a - b); refresh(); draw(); },
    scale: () => scale,
  };
})();
</script>
</body>
</html>
