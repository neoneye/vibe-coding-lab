    return out;
  }
  const nearestEra = y => clamp(Math.round((y - ERAS[0].year) / 100), 0, ERAS.length - 1);

  // -------- share links
  function encodeHash(p, eraIndex) {
    const base = paramsForEra(eraIndex), parts = ['e=' + eraIndex];
    for (const d of SCHEMA) {
      const v = p[d.key], b = base[d.key];
      if (d.kind === 'num') { const sv = snap(v, d); if (sv !== snap(b, d)) parts.push(d.key + '=' + sv); }
      else if (d.kind === 'color') { if (v !== b) parts.push(d.key + '=' + v.slice(1)); }
      else if (v !== b) parts.push(d.key + '=' + v);
    }
    return parts.join('&');
  }
  function decodeHash(str) {
    const kv = Object.create(null);
    for (const part of String(str || '').replace(/^#/, '').split('&')) { const i = part.indexOf('='); if (i > 0) kv[part.slice(0, i)] = part.slice(i + 1); }
    let e = parseInt(kv.e, 10);
    if (!(e >= 0 && e < ERAS.length)) e = 0;
    const p = paramsForEra(e);
    for (const d of SCHEMA) {
      if (!(d.key in kv)) continue;
      const s = kv[d.key];
      if (d.kind === 'num') { const n = parseFloat(s); if (isFinite(n)) p[d.key] = snap(n, d); }
      else if (d.kind === 'color') { if (/^[0-9a-fA-F]{6}$/.test(s)) p[d.key] = '#' + s.toLowerCase(); }
      else if (d.options.includes(s)) p[d.key] = s;
    }
    return { era: e, params: p };
  }

  // -------- dice
  function randomCommission(rng, mode, eraIndex, cur) {
    const base = paramsForEra(eraIndex, cur), out = Object.assign({}, base);
    for (const d of SCHEMA) {
      if (d.global) continue;
      const b = base[d.key];
      if (mode === 'wild') {
        if (d.kind === 'num') out[d.key] = snap(d.min + rng() * (d.max - d.min), d);
        else if (d.kind === 'color') out[d.key] = ROYAL[Math.floor(rng() * ROYAL.length)];
        else out[d.key] = d.options[Math.floor(rng() * d.options.length)];
      } else {
        if (d.kind === 'num') out[d.key] = snap(b + (rng() * 2 - 1) * 0.25 * (d.max - d.min), d);
        else if (d.kind === 'color') out[d.key] = jitterHex(b, rng, 1);
        else out[d.key] = rng() < 0.8 ? b : d.options[Math.floor(rng() * d.options.length)];
      }
    }
    return out;
  }

  return { TAU, clamp, lerp, smoothstep, mulberry32, decimals, snap, HEX, hexToRgb, rgbToHex, mixHex, jitterHex,
    PATTERNS, GROUPS, SCHEMA, SCHEMA_BY_KEY, ERAS, ROYAL, paramsForEra, clampParams, paramsAtYear, nearestEra, encodeHash, decodeHash, randomCommission };
})());

// ============================================================ part 1 tests
function validParams(p, label) {
  for (const d of QC.SCHEMA) {
    const v = p[d.key];
    if (d.kind === 'num') {
      assert(typeof v === 'number' && v >= d.min - 1e-9 && v <= d.max + 1e-9, `${label}: ${d.key}=${v} out of range`);
      if (d.step >= 1) assert(Number.isInteger(v), `${label}: ${d.key} must be an integer`);
    } else if (d.kind === 'color') assert(QC.HEX.test(v), `${label}: ${d.key}=${v} is not a colour`);
    else assert(d.options.includes(v), `${label}: ${d.key}=${v} is not an option`);
  }
}
QueenTests.add('schema is well formed', () => {
  const seen = new Set();
  for (const d of QC.SCHEMA) {
    assert(!seen.has(d.key), 'duplicate key ' + d.key); seen.add(d.key);
    assert(QC.GROUPS.includes(d.group), 'unknown group ' + d.group);
    if (d.kind === 'num') { assert(d.min < d.max && d.step > 0, d.key); assertNear((d.max - d.min) / d.step, Math.round((d.max - d.min) / d.step), 1e-6, d.key + ' grid'); }
    if (d.kind === 'choice') assert(d.options.length >= 2, d.key);
    if (d.global) assert(d.def !== undefined, d.key + ' global without default');
  }
  assert(QC.SCHEMA.length >= 65, 'lots of parameters');
});
QueenTests.add('era presets are complete, on the grid and in range', () => {
  assert(QC.ERAS.map(e => e.year).join() === '1500,1600,1700,1800,1900,2000', 'era years');
  const local = QC.SCHEMA.filter(d => !d.global);
  QC.ERAS.forEach((e, i) => {
    assert(Object.keys(e.params).length === local.length, `era ${i} has ${Object.keys(e.params).length} keys`);
    for (const d of local) {
      const v = e.params[d.key];
      assert(v !== undefined, `era ${i} misses ${d.key}`);
      if (d.kind === 'num') assert(QC.snap(v, d) === v, `era ${i} ${d.key}=${v} off grid`);
    }
    validParams(QC.paramsForEra(i), 'era ' + i);
    assert(e.name && e.dates && e.note.length > 80, 'era text ' + i);
  });
});
QueenTests.add('paramsAtYear hits every preset exactly and clamps outside', () => {
  QC.ERAS.forEach((e, i) => {
    const p = QC.paramsAtYear(e.year);
    for (const k of Object.keys(e.params)) assert(p[k] === e.params[k], `${e.year} ${k}: ${p[k]} vs ${e.params[k]}`);
  });
  const lo = QC.paramsAtYear(1200), hi = QC.paramsAtYear(2400);
  for (const k of Object.keys(QC.ERAS[0].params)) { assert(lo[k] === QC.ERAS[0].params[k], 'lo ' + k); assert(hi[k] === QC.ERAS[5].params[k], 'hi ' + k); }
});
QueenTests.add('morph years in between stay valid', () => {
  for (let y = 1500; y <= 2000; y += 12.5) validParams(QC.paramsAtYear(y), 'year ' + y);
});
QueenTests.add('global motion keys survive era changes and morphs', () => {
  const cur = QC.paramsForEra(0); cur.wind = 0.9; cur.motionMode = 'twirl';
  assert(QC.paramsForEra(3, cur).wind === 0.9, 'paramsForEra keeps wind');
  assert(QC.paramsAtYear(1750, cur).motionMode === 'twirl', 'paramsAtYear keeps mode');
  assert(QC.paramsForEra(3).motionMode === QC.SCHEMA_BY_KEY.motionMode.def, 'defaults without cur');
});
QueenTests.add('mixHex mixes in linear light and keeps its endpoints', () => {
  assert(QC.mixHex('#123456', '#abcdef', 0) === '#123456');
  assert(QC.mixHex('#123456', '#abcdef', 1) === '#abcdef');
  assert(QC.mixHex('#000000', '#ffffff', 0.5) === '#bcbcbc', QC.mixHex('#000000', '#ffffff', 0.5));
});
QueenTests.add('hash round-trips to step precision', () => {
  const rng = QC.mulberry32(7);
  for (let n = 0; n < 40; n++) {
    const e = n % 6, p = QC.randomCommission(rng, n % 2 ? 'wild' : 'within', e);
    p.wind = rng(); p.motionMode = 'walk';
    const d = QC.decodeHash(QC.encodeHash(p, e));
    assert(d.era === e, 'era index');
    for (const def of QC.SCHEMA) {
      const want = def.kind === 'num' ? QC.snap(p[def.key], def) : p[def.key];
      assert(d.params[def.key] === want, `${def.key}: ${d.params[def.key]} vs ${want}`);
    }
  }
  assert(QC.encodeHash(QC.paramsForEra(2), 2) === 'e=2', 'a preset is just its era');
});
QueenTests.add('garbage hashes decode safely', () => {
  for (const s of ['', '#', 'e=99', 'e=-1&waist=abc', 'waist=1e9&gownColor=zzzzzz&crown=hat', '%%%&&&==', '#e=3&hemRadius=NaN&__proto__=1&constructor=2']) {
    const d = QC.decodeHash(s);
    assert(d.era >= 0 && d.era < 6, 'era in range for ' + s);
    validParams(d.params, 'decoded ' + JSON.stringify(s));
  }
  assert(QC.decodeHash('waist=1e9').params.waist === QC.SCHEMA_BY_KEY.waist.max, 'huge values clamp');
  assert(QC.decodeHash('#e=4&crown=diadem').params.crown === 'diadem', 'valid choice applies');
});
QueenTests.add('random commissions are deterministic and valid', () => {
  for (const mode of ['within', 'wild']) for (let e = 0; e < 6; e++) {
    const a = QC.randomCommission(QC.mulberry32(42 + e), mode, e), b = QC.randomCommission(QC.mulberry32(42 + e), mode, e);
    assert(JSON.stringify(a) === JSON.stringify(b), 'same seed, same gown');
    validParams(a, mode + ' ' + e);
  }
  const w = QC.randomCommission(QC.mulberry32(1), 'within', 2), base = QC.paramsForEra(2);
  assert(Math.abs(w.pannier - base.pannier) <= 0.25 * 1.2 + 1e-9, 'within stays near the era');
});
