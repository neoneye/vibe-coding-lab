<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D Floor Plan Generator</title>
<style>
:root { --bg: #f4f4f2; --panel: #ffffff; --border: #d6d6d2; --text: #1b1b1b; --muted: #6b6b66; --accent: #1b1b1b; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; display: flex; flex-direction: column; }
header { display: flex; align-items: baseline; gap: 14px; padding: 10px 16px 8px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
header .sub { color: var(--muted); font-size: 0.85rem; }
header .spacer { flex: 1; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 12px; cursor: pointer; }
button:hover { background: #ececea; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: #333; }
.layout { display: flex; flex: 1; min-height: 0; }
aside { width: 330px; flex: 0 0 330px; overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 8px 10px 30px; }
main { flex: 1; min-width: 0; overflow: auto; background: #e9e9e6; padding: 18px; }
#paper { display: inline-block; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.18); line-height: 0; }
#paper.fit { display: block; }
#paper.fit svg { width: 100%; height: auto; }
details { border: 1px solid var(--border); border-radius: 5px; margin: 0 0 8px; background: #fff; }
details summary { cursor: pointer; padding: 6px 8px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #333; display: flex; align-items: center; }
details summary .reset { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 11px; }
details summary .reset:hover { color: var(--text); text-decoration: underline; }
details .body { padding: 2px 8px 8px; }
.ctl { display: block; margin: 7px 0 0; font-size: 12px; }
.ctl .row { display: flex; justify-content: space-between; align-items: baseline; }
.ctl .val { color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { width: 100%; margin: 2px 0 0; }
.ctl select, .ctl input[type="text"], .ctl input[type="number"] { width: 100%; margin-top: 3px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: #fff; color: var(--text); }
.ctl.check { display: flex; align-items: center; gap: 6px; }
.seedrow { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.seedrow input[type="number"] { flex: 1; margin: 0; }
.status { color: var(--muted); font-size: 11px; margin-top: 4px; }
kbd { border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 10px; background: #f6f6f4; }
</style>
</head>
<body>
<header>
  <h1>2D Floor Plan Generator</h1>
  <span class="sub">Villain mansions, supermax prisons, datacenters, power plants, malls, bunkers, police stations, the White House, fire stations, motels and robot factories. Every plan is a pure function of the seed and the sliders. Pissoirs guaranteed.</span>
  <span class="spacer"></span>
  <div class="toolbar">
    <button id="btn-random" class="primary" title="Random seed (R)">Random seed</button>
    <button id="btn-prev" title="Previous seed ([)">◀</button>
    <button id="btn-next" title="Next seed (])">▶</button>
    <button id="btn-svg">Download SVG</button>
    <button id="btn-png">Download PNG</button>
    <button id="btn-link">Copy link</button>
    <button id="btn-reset">Reset all</button>
    <label class="ctl check" style="margin:0"><input type="checkbox" id="fit"> Fit to width</label>
  </div>
</header>
<div class="layout">
  <aside id="controls"></aside>
  <main><div id="paper"></div></main>
</div>
<script id="shared-code">
// ===================== 2D Floor Plan Generator — engine =====================
// Pure JS, no DOM. Everything below is deterministic in (seed, params).
const FP = (() => {
  "use strict";

  // ---------- PRNG: sfc32 seeded through a splitmix-style mixer ----------
  function mix32(x) {
    x = (x ^ (x >>> 16)) >>> 0; x = Math.imul(x, 0x7feb352d) >>> 0;
    x = (x ^ (x >>> 15)) >>> 0; x = Math.imul(x, 0x846ca68b) >>> 0;
    return (x ^ (x >>> 16)) >>> 0;
  }
  function makeRng(seed) {
    let s = (Number(seed) || 0) >>> 0;
    let a = mix32(s + 0x9e3779b9), b = mix32(s + 0x243f6a88), c = mix32(s + 0xb7e15162), d = mix32(s + 0xdeadbeef) | 1;
    function next() {
      a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
      let t = (a + b) | 0;
      a = b ^ (b >>> 9);
      b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11);
      d = (d + 1) | 0;
      t = (t + d) | 0;
      c = (c + t) | 0;
      return (t >>> 0) / 4294967296;
    }
    for (let i = 0; i < 16; i++) next();
    const rng = {
      next,
      int(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
      range(lo, hi) { return lo + next() * (hi - lo); },
      pick(arr) { return arr[Math.floor(next() * arr.length)]; },
      chance(p) { return next() < p; },
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
        return arr;
      },
      weighted(items, weightOf) {
        let total = 0; for (const it of items) total += weightOf(it);
        let r = next() * total;
        for (const it of items) { r -= weightOf(it); if (r <= 0) return it; }
        return items[items.length - 1];
      },
    };
    return rng;
  }

  // ---------- Parameter table (single source of truth for UI + URL) ----------
  const BUILDING_IDS = ["mansion", "prison", "datacenter", "powerplant", "mall", "bunker", "police", "whitehouse", "firestation", "motel", "robotfactory"];
  const PARAMS = [
    { id: "seed", group: "Seed", label: "Seed", type: "seed", min: 0, max: 999999, step: 1, def: 1 },

    { id: "building", group: "Building", label: "Building type", type: "select", def: "mansion",
      options: [["mansion", "Evil villain mansion"], ["prison", "Supermax prison"], ["datacenter", "Datacenter"], ["powerplant", "Power plant"], ["mall", "Shopping mall"], ["bunker", "Bunker"], ["police", "Police station"], ["whitehouse", "White House"], ["firestation", "Fire department"], ["motel", "Motel"], ["robotfactory", "Robot factory"]] },
    { id: "shape", group: "Building", label: "Footprint", type: "select", def: "rect",
      options: [["rect", "Rectangle"], ["L", "L-shape"], ["U", "U-shape"], ["T", "T-shape"], ["courtyard", "Courtyard"]] },
    { id: "width", group: "Building", label: "Width (m)", type: "range", min: 12, max: 120, step: 1, def: 48 },
    { id: "depth", group: "Building", label: "Depth (m)", type: "range", min: 8, max: 80, step: 1, def: 28 },
    { id: "cell", group: "Building", label: "Grid cell (m)", type: "range", min: 0.25, max: 1, step: 0.25, def: 0.5 },
    { id: "extWall", group: "Building", label: "Exterior wall (m)", type: "range", min: 0.1, max: 1.2, step: 0.05, def: 0.4 },
    { id: "intWall", group: "Building", label: "Interior wall (m)", type: "range", min: 0.05, max: 0.6, step: 0.05, def: 0.15 },
    { id: "storey", group: "Building", label: "Storey", type: "range", min: -9, max: 9, step: 1, def: 1 },

    { id: "corridorLayout", group: "Corridors", label: "Layout", type: "select", def: "spine",
      options: [["none", "None"], ["spine", "Spine"], ["cross", "Cross"], ["loop", "Loop"]] },
    { id: "corridorWidth", group: "Corridors", label: "Width (m)", type: "range", min: 1, max: 6, step: 0.5, def: 2 },
    { id: "branches", group: "Corridors", label: "Branches", type: "range", min: 0, max: 8, step: 1, def: 2 },

    { id: "servicePassages", group: "Services", label: "Service passages", type: "select", def: "perimeter",
      options: [["none", "None"], ["perimeter", "Perimeter (three sides)"], ["ring", "Full ring"], ["interstitial", "Interstitial strips"], ["both", "Ring + interstitial"]] },
    { id: "serviceWidth", group: "Services", label: "Passage width (m)", type: "range", min: 0.5, max: 2, step: 0.25, def: 1 },
    { id: "serviceHatches", group: "Services", label: "Extra access hatches", type: "range", min: 0, max: 100, step: 1, def: 35 },
    { id: "ventShafts", group: "Services", label: "Ventilation shafts", type: "range", min: 0, max: 16, step: 1, def: 4 },
    { id: "shaftSize", group: "Services", label: "Shaft size (m)", type: "range", min: 1, max: 3, step: 0.5, def: 1.5 },
    { id: "showPipes", group: "Services", label: "Draw piping and wires", type: "check", def: true },
    { id: "pipeRuns", group: "Services", label: "Pipe / wire runs", type: "range", min: 1, max: 5, step: 1, def: 3 },

    { id: "minArea", group: "Rooms", label: "Min room area (m²)", type: "range", min: 4, max: 60, step: 1, def: 12 },
    { id: "maxArea", group: "Rooms", label: "Max room area (m²)", type: "range", min: 20, max: 600, step: 5, def: 90 },
    { id: "splitBias", group: "Rooms", label: "Split bias", type: "range", min: 0, max: 100, step: 1, def: 50 },
    { id: "aspectMax", group: "Rooms", label: "Max aspect ratio", type: "range", min: 1.2, max: 5, step: 0.1, def: 2.5 },
    { id: "hallShare", group: "Rooms", label: "Big hall share", type: "range", min: 0, max: 100, step: 1, def: 25 },
    { id: "restroomShare", group: "Rooms", label: "Restroom share", type: "range", min: 0, max: 100, step: 1, def: 20 },

    { id: "doorWidth", group: "Openings", label: "Door width (m)", type: "range", min: 0.7, max: 2.4, step: 0.1, def: 0.9 },
    { id: "doorDensity", group: "Openings", label: "Extra doors", type: "range", min: 0, max: 100, step: 1, def: 20 },
    { id: "swings", group: "Openings", label: "Door swings", type: "check", def: true },
    { id: "windowSpacing", group: "Openings", label: "Window spacing (m)", type: "range", min: 1, max: 12, step: 0.5, def: 3 },
    { id: "windowWidth", group: "Openings", label: "Window width (m)", type: "range", min: 0.4, max: 3, step: 0.1, def: 1.2 },
    { id: "secretPassages", group: "Openings", label: "Secret passages", type: "range", min: 0, max: 10, step: 1, def: 2 },
    { id: "mirrors", group: "Openings", label: "One-way mirrors", type: "range", min: 0, max: 12, step: 1, def: 4 },
    { id: "bayDoors", group: "Openings", label: "Vehicle bay doors", type: "check", def: true },

    { id: "furnitureDensity", group: "Furniture", label: "Density", type: "range", min: 0, max: 100, step: 1, def: 85 },
    { id: "symbolDetail", group: "Furniture", label: "Symbol detail", type: "select", def: "high",
      options: [["low", "Low"], ["medium", "Medium"], ["high", "High"]] },

    { id: "pissoirs", group: "Pissoirs", label: "Pissoirs per restroom", type: "range", min: 0, max: 60, step: 1, def: 9 },
    { id: "pissoirSpacing", group: "Pissoirs", label: "Pissoir spacing (m)", type: "range", min: 0.4, max: 1.2, step: 0.05, def: 0.6 },
    { id: "mania", group: "Pissoirs", label: "Pissoir mania", type: "range", min: 0, max: 100, step: 1, def: 15 },
    { id: "stalls", group: "Pissoirs", label: "Stalls", type: "range", min: 0, max: 12, step: 1, def: 2 },
    { id: "sinks", group: "Pissoirs", label: "Sinks", type: "range", min: 0, max: 12, step: 1, def: 2 },
    { id: "perimeterFixtures", group: "Pissoirs", label: "Perimeter walls", type: "select", def: "pissoirs",
      options: [["pissoirs", "Pissoirs"], ["alternating", "Pissoir / toilet alternating"], ["toilets", "Toilet stalls"]] },
    { id: "islandWalls", group: "Pissoirs", label: "Island walls", type: "select", def: "auto",
      options: [["auto", "Auto (halls and mania)"], ["off", "Off"], ["on", "On, fill the room"]] },
    { id: "islandFixtures", group: "Pissoirs", label: "Island fixtures (both sides)", type: "select", def: "pissoirs",
      options: [["pissoirs", "Pissoirs"], ["toilets", "Toilet stalls"], ["alternating", "Alternating"]] },
    { id: "corridorUrinals", group: "Pissoirs", label: "Urinals in corridors", type: "check", def: false },

    { id: "liminality", group: "Backrooms", label: "Liminality", type: "range", min: 0, max: 100, step: 1, def: 0 },
    { id: "deadEnds", group: "Backrooms", label: "Dead-end corridors", type: "range", min: 0, max: 12, step: 1, def: 0 },
    { id: "nesting", group: "Backrooms", label: "Room nesting", type: "range", min: 0, max: 100, step: 1, def: 0 },
    { id: "doorless", group: "Backrooms", label: "Doorless rooms", type: "range", min: 0, max: 100, step: 1, def: 0 },
    { id: "repetition", group: "Backrooms", label: "Repetition", type: "range", min: 0, max: 100, step: 1, def: 0 },
    { id: "labelGlitch", group: "Backrooms", label: "Label glitch", type: "range", min: 0, max: 100, step: 1, def: 0 },
    { id: "blackout", group: "Backrooms", label: "Window blackout", type: "range", min: 0, max: 100, step: 1, def: 0 },

    { id: "showLabels", group: "Annotation", label: "Room labels", type: "check", def: true },
    { id: "showDims", group: "Annotation", label: "Dimension strings", type: "check", def: true },
    { id: "dimChain", group: "Annotation", label: "Bay dimension chain", type: "check", def: true },
    { id: "showNumbers", group: "Annotation", label: "Room numbers", type: "check", def: false },
    { id: "showAreas", group: "Annotation", label: "Room areas", type: "check", def: false },
    { id: "titleBlock", group: "Annotation", label: "Title block", type: "check", def: true },
    { id: "notes", group: "Annotation", label: "General notes", type: "check", def: true },
    { id: "northArrow", group: "Annotation", label: "North arrow", type: "check", def: true },
    { id: "scaleBar", group: "Annotation", label: "Scale bar", type: "check", def: true },
    { id: "fontSize", group: "Annotation", label: "Font size (px)", type: "range", min: 6, max: 20, step: 0.5, def: 10 },
    { id: "humour", group: "Annotation", label: "Humour", type: "range", min: 0, max: 100, step: 1, def: 65 },
    { id: "sheetTitle", group: "Annotation", label: "Sheet title (blank = auto)", type: "text", def: "" },

    { id: "scale", group: "Style", label: "Scale (px per m)", type: "range", min: 8, max: 60, step: 1, def: 22 },
    { id: "lineWeight", group: "Style", label: "Line weight (px)", type: "range", min: 0.5, max: 3, step: 0.25, def: 1 },
    { id: "wallFill", group: "Style", label: "Wall fill", type: "select", def: "solid",
      options: [["solid", "Solid poché"], ["hatch", "Hatched"], ["hollow", "Double line"]] },
    { id: "margin", group: "Style", label: "Paper margin (px)", type: "range", min: 20, max: 200, step: 5, def: 70 },
  ];
  const PARAM_BY_ID = Object.fromEntries(PARAMS.map(p => [p.id, p]));
  function defaults() { const o = {}; for (const p of PARAMS) o[p.id] = p.def; return o; }
  function coerce(id, v) {
    const p = PARAM_BY_ID[id]; if (!p) return undefined;
    if (p.type === "check") return v === true || v === "1" || v === "true";
    if (p.type === "select") return p.options.some(o => o[0] === v) ? v : p.def;
    if (p.type === "text") return String(v ?? "");
    const n = Number(v); if (!Number.isFinite(n)) return p.def;
    return Math.min(p.max, Math.max(p.min, n));
  }
  function serialize(p) {
    const d = defaults(); const parts = [];
    for (const q of PARAMS) { if (p[q.id] !== d[q.id]) parts.push(q.id + "=" + encodeURIComponent(q.type === "check" ? (p[q.id] ? 1 : 0) : p[q.id])); }
    return parts.join("&");
  }
  function deserialize(str) {
    const p = defaults();
    for (const kv of String(str || "").replace(/^#/, "").split("&")) {
      if (!kv) continue; const i = kv.indexOf("="); if (i < 0) continue;
      const k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
      if (PARAM_BY_ID[k]) p[k] = coerce(k, v);
    }
    return p;
  }

  // ---------- Footprint on the cell grid ----------
  // Returns { W, D, cell, solid(Uint8Array), isSolid(x,y), poly, holes } with polygons in cell units.
  function buildFootprint(p, rng) {
    const cell = p.cell;
    const W = Math.max(8, Math.round(p.width / cell)), D = Math.max(6, Math.round(p.depth / cell));
    const solid = new Uint8Array(W * D).fill(1);
    const cut = (x, y, w, h) => {
      for (let j = Math.max(0, y); j < Math.min(D, y + h); j++) for (let i = Math.max(0, x); i < Math.min(W, x + w); i++) solid[j * W + i] = 0;
    };
    const frac = (n, lo, hi) => Math.max(2, Math.round(n * rng.range(lo, hi)));
    if (p.shape === "L") {
      const nw = frac(W, 0.3, 0.5), nd = frac(D, 0.3, 0.5), corner = rng.int(0, 3);
      cut(corner & 1 ? W - nw : 0, corner & 2 ? D - nd : 0, nw, nd);
    } else if (p.shape === "U") {
      const nw = frac(W, 0.3, 0.45), nd = frac(D, 0.35, 0.55);
      cut(Math.round((W - nw) / 2), rng.chance(0.5) ? 0 : D - nd, nw, nd);
    } else if (p.shape === "T") {
      const nw = frac(W, 0.2, 0.3), nd = frac(D, 0.35, 0.55), top = rng.chance(0.5);
      cut(0, top ? 0 : D - nd, nw, nd); cut(W - nw, top ? 0 : D - nd, nw, nd);
    } else if (p.shape === "courtyard") {
      const hw = frac(W, 0.25, 0.4), hd = frac(D, 0.25, 0.4);
      const margin = Math.max(4, Math.round((p.corridorWidth + Math.sqrt(p.minArea)) / cell) + 1);
      const hx = Math.min(W - margin - hw, Math.max(margin, Math.round((W - hw) / 2 + rng.int(-2, 2))));
      const hy = Math.min(D - margin - hd, Math.max(margin, Math.round((D - hd) / 2 + rng.int(-1, 1))));
      if (hw > 0 && hd > 0 && hx >= margin && hy >= margin) cut(hx, hy, hw, hd);
    }
    const isSolid = (x, y) => x >= 0 && y >= 0 && x < W && y < D && solid[y * W + x] === 1;
    const loops = traceLoops(W, D, isSolid);
    let outer = loops[0], best = -1;
    for (const l of loops) { const a = Math.abs(polyArea(l)); if (a > best) { best = a; outer = l; } }
    return { W, D, cell, solid, isSolid, poly: outer, holes: loops.filter(l => l !== outer) };
  }
  function polyArea(poly) {
    let a = 0; for (let i = 0; i < poly.length; i++) { const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length]; a += x1 * y2 - x2 * y1; }
    return a / 2;
  }
  // Boundary edges of a cell set, chained into closed rectilinear loops with collinear vertices merged.
  function traceLoops(W, D, inside) {
    const edges = new Map(); // "x,y" start -> [x,y] end (directed, interior on the right in screen coords)
    const add = (x1, y1, x2, y2) => edges.set(x1 + "," + y1, [x2, y2]);
    for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) {
      if (!inside(x, y)) continue;
      if (!inside(x, y - 1)) add(x, y, x + 1, y);
      if (!inside(x + 1, y)) add(x + 1, y, x + 1, y + 1);
      if (!inside(x, y + 1)) add(x + 1, y + 1, x, y + 1);
      if (!inside(x - 1, y)) add(x, y + 1, x, y);
    }
    const loops = [];
    while (edges.size) {
      const startKey = edges.keys().next().value;
      const loop = []; let key = startKey;
      while (edges.has(key)) {
        const [sx, sy] = key.split(",").map(Number); loop.push([sx, sy]);
        const e = edges.get(key); edges.delete(key); key = e[0] + "," + e[1];
      }
      // merge collinear
      const out = [];
      for (let i = 0; i < loop.length; i++) {
        const a = loop[(i + loop.length - 1) % loop.length], b = loop[i], c = loop[(i + 1) % loop.length];
        if ((a[0] === b[0] && b[0] === c[0]) || (a[1] === b[1] && b[1] === c[1])) continue;
        out.push(b);
      }
      if (out.length >= 4) loops.push(out);
    }
    return loops;
  }

  // ---------- Layout: corridors + room subdivision on the region grid ----------
  // reg: 0 outside, -1 corridor, >=1 room id. Rooms and corridors are rectangles in cells.
  function layout(p, rng, fp) {
    const { W, D, cell } = fp;
    const reg = new Int32Array(W * D);
    for (let i = 0; i < W * D; i++) reg[i] = fp.solid[i] ? -2 : 0; // -2 = free
    const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= D) ? 0 : reg[y * W + x];
    const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < D && reg[y * W + x] !== 0) reg[y * W + x] = v; };
    const cw = Math.max(1, Math.round(p.corridorWidth / cell));
    const minSideCells = Math.max(2, Math.round(Math.sqrt(p.minArea) / cell * 0.7));
    const corridorRects = []; // carve records {x,y,w,h,deadEnd}
    const carve = (x, y, w, h, deadEnd) => {
      let n = 0;
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (at(i, j) === -2) { set(i, j, -1); n++; }
      if (n) corridorRects.push({ x, y, w, h, deadEnd: !!deadEnd });
      return n;
    };
    const horizontal = W >= D;
    const layoutKind = p.corridorLayout;
    if (layoutKind !== "none") {
      const jitter = (n) => Math.round(rng.range(-n / 8, n / 8));
      const spineRow = (len, along) => Math.min(len - cw - minSideCells, Math.max(minSideCells, Math.round((len - cw) / 2) + jitter(len)));
      if (layoutKind === "spine" || layoutKind === "cross") {

        const svg = FP.render(p, m); assert(svg.includes("V.S.") || svg.includes(">VS<"), "shaft label"); assert(svg.includes("SERVICE PASSAGE"), "passage label");
        assert(!m.doors.some(d => d.a[0] === "v" || d.b[0] === "v"), "no doors into shafts");
      }
      const per = FP.generate(P({ servicePassages: "perimeter", shape: "rect" }));
      eq(per.reg[(per.D - 1) * per.W + Math.floor(per.W / 2)] === -3, false, "front face stays open");
      assert(per.reg[Math.floor(per.W / 2)] === -3, "back face is a passage");
      const ring = FP.generate(P({ servicePassages: "ring", shape: "rect" }));
      assert(ring.reg[(ring.D - 1) * ring.W + Math.floor(ring.W / 2)] === -3, "ring closes the front");
      const none = FP.generate(P({ servicePassages: "none", ventShafts: 0 })); eq(none.services.length, 0, "no passages"); eq(none.shafts.length, 0, "no shafts");
      assert(!none.doors.some(d => d.kind === "hatch"), "no hatches without passages");
    });
    test("new buildings: mirrors, observation rooms, bay doors, motel numbering, islands", () => {
      const m = FP.generate(P({ building: "police", seed: 2, width: 70, depth: 40 }));
      assert(m.mirrors.length >= 1, "mirrors placed");
      assert(m.rooms.some(r => r.kind === "observation"), "observation room");
      for (const mr of m.mirrors) { const a = m.byId.get(Number(mr.a.slice(1))), b = m.byId.get(Number(mr.b.slice(1))); assert(a && b && (a.kind === "observation" || b.kind === "observation"), "mirror joins an observation room"); }
      const svg = FP.render(P({ building: "police", seed: 2, width: 70, depth: 40 }), m); assert(svg.includes("ONE-WAY MIRROR"), "mirror label");
      eq(FP.generate(P({ building: "police", seed: 2, width: 70, depth: 40, mirrors: 0 })).mirrors.length, 0, "mirrors off");
      const f = FP.generate(P({ building: "firestation", seed: 3, width: 70, depth: 40 }));
      assert(f.doors.some(d => d.kind === "bay"), "bay doors"); assert(f.furniture.some(i => i.kind === "truck"), "trucks");
      eq(FP.generate(P({ building: "firestation", seed: 3, width: 70, depth: 40, bayDoors: false })).doors.filter(d => d.kind === "bay").length, 0, "bay doors off");
      const mo = FP.generate(P({ building: "motel", seed: 4, width: 70, depth: 40 })); assert(mo.rooms.filter(r => /^ROOM 1\d\d$/.test(r.label)).length >= 3, "numbered rooms");
      const wh = FP.generate(P({ building: "whitehouse", seed: 1 })); assert(wh.furniture.some(i => i.kind === "ovalWall"), "oval office");
      const rf = FP.generate(P({ building: "robotfactory", seed: 1 })); assert(rf.furniture.some(i => i.kind === "conveyor") && rf.furniture.some(i => i.kind === "robotArm"), "assembly line");
      // islands: alternating fixtures on both sides of a partition, everything inside the room
      const isl = FP.generate(P({ seed: 6, restroomShare: 100, minArea: 60, maxArea: 120, islandWalls: "on", islandFixtures: "alternating", mania: 0 }));
      const withIslands = isl.rooms.filter(r => r.islands > 0); assert(withIslands.length > 0, "some restroom got islands");
      assert(isl.furniture.some(i => i.kind === "partition"), "partition drawn");
      for (const r of withIslands) {
        const R = { x: r.free.x * isl.cell, y: r.free.y * isl.cell, w: r.free.w * isl.cell, h: r.free.h * isl.cell };
        const inside = isl.furniture.filter(i => i.cx > R.x && i.cx < R.x + R.w && i.cy > R.y && i.cy < R.y + R.h);
        const part = inside.find(i => i.kind === "partition"); assert(part, "partition inside");
        const horizontal = part.w > part.d;
        const sideOf = (i) => horizontal ? Math.sign(i.cy - part.cy) : Math.sign(i.cx - part.cx);
        const near = inside.filter(i => (i.kind === "urinal" || i.kind === "stall") && Math.abs(horizontal ? i.cy - part.cy : i.cx - part.cx) < 1.6);
        assert(near.some(i => sideOf(i) < 0) && near.some(i => sideOf(i) > 0), "fixtures on both sides");
        assert(near.some(i => i.kind === "urinal") && near.some(i => i.kind === "stall"), "alternating has both kinds");
        assert(r.stallCount > 0 && r.urinals > 0, "counts recorded");
      }
      const off = FP.generate(P({ seed: 6, restroomShare: 100, minArea: 60, maxArea: 120, islandWalls: "off", mania: 100 })); assert(!off.furniture.some(i => i.kind === "partition"), "islands off");
      const toil = FP.generate(P({ seed: 6, restroomShare: 100, minArea: 60, maxArea: 120, islandWalls: "on", islandFixtures: "toilets", perimeterFixtures: "toilets", mania: 0 }));
      assert(toil.furniture.filter(i => i.kind === "stall").length > toil.furniture.filter(i => i.kind === "urinal").length, "toilet mode favours stalls");
    });
    console.log(results.join("\n"));
    console.log(failed ? `${failed} test(s) FAILED` : `all ${results.length} tests passed`);
    return failed === 0;
  },
};
</script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const controls = $("controls"), paper = $("paper");
  const STORAGE_KEY = "fp-params-v1";
  let params = loadParams();
  let lastSvg = "", lastModel = null;

  function loadParams() {
    let str = location.hash.slice(1);
    if (!str) { try { str = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { str = ""; } }
    return FP.deserialize(str);
  }
  function persist() {
    const str = FP.serialize(params);
    try { history.replaceState(null, "", str ? "#" + str : location.pathname + location.search); } catch (e) { /* file:// quirks */ }
    try { localStorage.setItem(STORAGE_KEY, str); } catch (e) { /* no storage */ }
  }

  // ---- build the panel from the parameter table
  const groups = []; const groupOf = new Map();
  for (const q of FP.PARAMS) { if (!groupOf.has(q.group)) { groupOf.set(q.group, []); groups.push(q.group); } groupOf.get(q.group).push(q); }
  const inputs = new Map();
  const fmt = (q, v) => q.type === "range" || q.type === "seed" ? (Number.isInteger(q.step) ? String(v) : Number(v).toFixed(2).replace(/\.?0+$/, "")) : String(v);
  for (const g of groups) {
    const det = document.createElement("details"); det.open = g !== "Style" && g !== "Annotation" && g !== "Furniture";
    const sum = document.createElement("summary"); sum.textContent = g;
    const reset = document.createElement("span"); reset.className = "reset"; reset.textContent = "reset"; reset.title = "Reset this group";
    reset.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); for (const q of groupOf.get(g)) params[q.id] = q.def; syncInputs(); regenerate(); });
    sum.appendChild(reset); det.appendChild(sum);
    const body = document.createElement("div"); body.className = "body";
    for (const q of groupOf.get(g)) body.appendChild(buildControl(q));
    det.appendChild(body); controls.appendChild(det);
  }
  const status = document.createElement("div"); status.className = "status"; controls.appendChild(status);
  const help = document.createElement("div"); help.className = "status"; help.innerHTML = "Keys: <kbd>R</kbd> random seed, <kbd>[</kbd> / <kbd>]</kbd> previous / next seed."; controls.appendChild(help);

  function buildControl(q) {
    const wrap = document.createElement("label"); wrap.className = "ctl" + (q.type === "check" ? " check" : "");
    if (q.type === "check") {
      const inp = document.createElement("input"); inp.type = "checkbox"; inp.checked = !!params[q.id];
      inp.addEventListener("change", () => { params[q.id] = inp.checked; onChange(); });
      wrap.appendChild(inp); wrap.appendChild(document.createTextNode(" " + q.label)); inputs.set(q.id, inp); return wrap;
    }
    const row = document.createElement("div"); row.className = "row";
    const name = document.createElement("span"); name.textContent = q.label; row.appendChild(name);
    const val = document.createElement("span"); val.className = "val"; row.appendChild(val); wrap.appendChild(row);
    if (q.type === "select") {
      const sel = document.createElement("select");
      for (const [v, label] of q.options) { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); }
      sel.value = params[q.id]; sel.addEventListener("change", () => { params[q.id] = sel.value; onChange(); });
      wrap.appendChild(sel); inputs.set(q.id, sel); val.remove(); return wrap;
    }
    if (q.type === "text") {
      const inp = document.createElement("input"); inp.type = "text"; inp.value = params[q.id]; inp.placeholder = "auto";
      inp.addEventListener("input", () => { params[q.id] = inp.value; onChange(); });
      wrap.appendChild(inp); inputs.set(q.id, inp); val.remove(); return wrap;
    }
    if (q.type === "seed") {
      const sr = document.createElement("div"); sr.className = "seedrow";
      const inp = document.createElement("input"); inp.type = "number"; inp.min = q.min; inp.max = q.max; inp.step = 1; inp.value = params[q.id];
      inp.addEventListener("input", () => { params[q.id] = FP.coerce(q.id, inp.value); onChange(); });
      const rnd = document.createElement("button"); rnd.textContent = "Random"; rnd.type = "button"; rnd.addEventListener("click", randomSeed);
      sr.appendChild(inp); sr.appendChild(rnd); wrap.appendChild(sr); inputs.set(q.id, inp); val.remove(); return wrap;
    }
    const inp = document.createElement("input"); inp.type = "range"; inp.min = q.min; inp.max = q.max; inp.step = q.step; inp.value = params[q.id];
    val.textContent = fmt(q, params[q.id]);
    inp.addEventListener("input", () => { params[q.id] = FP.coerce(q.id, inp.value); val.textContent = fmt(q, params[q.id]); onChange(); });
    wrap.appendChild(inp); inputs.set(q.id, inp); inp._val = val; return wrap;
  }
  function syncInputs() {
    for (const q of FP.PARAMS) {
      const inp = inputs.get(q.id); if (!inp) continue;
      if (q.type === "check") inp.checked = !!params[q.id]; else inp.value = params[q.id];
      if (inp._val) inp._val.textContent = fmt(q, params[q.id]);
    }
  }

  // ---- generate & render
  let pending = false;
  function onChange() { persist(); if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; regenerate(); }); }
  function regenerate() {
    const t0 = performance.now();
    let svg;
    try {
      lastModel = FP.generate(params); svg = FP.render(params, lastModel);
    } catch (e) {
      console.error(e); status.textContent = "Generation failed: " + e.message; return;
    }
    lastSvg = svg; paper.innerHTML = svg;
    const urinals = lastModel.furniture.filter(f => f.kind === "urinal").length;
    status.textContent = `${lastModel.rooms.length} rooms · ${lastModel.corridors.length} corridor bays · ${lastModel.doors.length} doors · ${lastModel.windows.length} windows · ${urinals} pissoirs · ${(performance.now() - t0).toFixed(0)} ms`;
  }
  function setSeed(v) { params.seed = FP.coerce("seed", v); syncInputs(); persist(); regenerate(); }
  function randomSeed() { setSeed(Math.floor(Math.random() * 1000000)); }

  // ---- downloads
  function fileStem() { return `floor-plan-${params.building}-${params.seed}`; }
  function saveBlob(blob, name) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  $("btn-svg").addEventListener("click", () => saveBlob(new Blob([lastSvg], { type: "image/svg+xml;charset=utf-8" }), fileStem() + ".svg"));
  $("btn-png").addEventListener("click", () => {
    const m = lastSvg.match(/width="(\d+)" height="(\d+)"/); if (!m) return;
    const w = Number(m[1]), h = Number(m[2]);
    const url = URL.createObjectURL(new Blob([lastSvg], { type: "image/svg+xml;charset=utf-8" }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob((b) => saveBlob(b, fileStem() + ".png"), "image/png");
    };
    img.src = url;
  });
  $("btn-link").addEventListener("click", async () => {
    persist();
    const url = location.href;
    try { await navigator.clipboard.writeText(url); status.textContent = "Link copied."; }
    catch (e) { window.prompt("Copy this link:", url); }
  });
  $("btn-reset").addEventListener("click", () => { params = FP.defaults(); syncInputs(); persist(); regenerate(); });
  $("btn-random").addEventListener("click", randomSeed);
  $("btn-prev").addEventListener("click", () => setSeed(params.seed - 1));
  $("btn-next").addEventListener("click", () => setSeed(params.seed + 1));
  $("fit").addEventListener("change", (e) => paper.classList.toggle("fit", e.target.checked));
  document.addEventListener("keydown", (e) => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "r" || e.key === "R") randomSeed(); else if (e.key === "[") setSeed(params.seed - 1); else if (e.key === "]") setSeed(params.seed + 1);
  });
  window.addEventListener("hashchange", () => { params = FP.deserialize(location.hash.slice(1)); syncInputs(); regenerate(); });

  regenerate();
})();
</script>
</body>
</html>
