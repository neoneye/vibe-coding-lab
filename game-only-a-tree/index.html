<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Only a Tree</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9a9a9a; overflow: hidden;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex;
    align-items: center; justify-content: center; }
  body.tuning #stage { right: 320px; }
  canvas { display: block; touch-action: none; cursor: default; }
  #bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 3; }
  body.tuning #bar { right: 328px; }
  body.fs:not(.tuning) #bar { display: none; }
  body.fs canvas { cursor: none; }
  button { font: inherit; color: #aaa; background: #111; border: 1px solid #333; padding: 4px 9px;
    cursor: pointer; }
  button:hover { color: #fff; border-color: #666; }
  button.on { color: #000; background: #aaa; border-color: #aaa; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; box-sizing: border-box;
    background: #0b0b0b; border-left: 1px solid #2a2a2a; padding: 12px 14px 20px; overflow-y: auto;
    display: none; z-index: 4; }
  body.tuning #panel { display: block; }
  #panel h2 { font-size: 14px; color: #ddd; margin: 0 0 6px; font-weight: normal; letter-spacing: 1px; }
  #panel p { margin: 0 0 10px; color: #777; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 44px; column-gap: 8px; margin-bottom: 7px; }
  .row label { grid-column: 1 / 3; color: #999; }
  .row input { width: 100%; margin: 2px 0 0; accent-color: #999; }
  .row output { text-align: right; color: #ccc; }
  .sep { border-top: 1px solid #222; margin: 10px 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  @media (max-width: 760px) {
    body.tuning #stage { right: 0; bottom: 50%; }
    body.tuning #bar { right: 8px; }
    #panel { top: 50%; left: 0; width: auto; border-left: 0; border-top: 1px solid #2a2a2a; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="320" height="180"></canvas></div>
<div id="bar">
  <button id="btnTune" title="P">Tree parameters</button>
  <button id="btnMute" title="M">Sound on</button>
  <button id="btnFull" title="F">Full screen</button>
</div>
<div id="panel">
  <h2>THE TREE</h2>
  <p>The game blends from the first tree to the second as the night gets worse. Pick which one to edit. The game is paused while this panel is open.</p>
  <div class="tabs">
    <button id="tabCalm" class="on">Start of night</button>
    <button id="tabNight">At its worst</button>
  </div>
  <div class="row"><label for="blend">Preview the blend between the two</label>
    <input type="range" id="blend" min="0" max="1" step="0.01" value="0"><output id="blendOut">0.00</output></div>
  <div class="sep"></div>
  <div id="sliders"></div>
  <div class="btns">
    <button id="btnSeed">New seed</button>
    <button id="btnReset">Reset both</button>
    <button id="btnCopy">Copy as JSON</button>
    <button id="btnClose">Close</button>
  </div>
</div>
<audio id="clock" src="clock_audio.mp3" loop preload="auto"></audio>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Only a Tree. 320x180, 256 greys. You lie in bed. Time passes when you sleep.
// The tree outside only changes while your eyes are closed.
// ---------------------------------------------------------------------------
const W = 320, H = 180;
const WIN = { x0: 70, y0: 18, x1: 250, y1: 104 };          // glass, x1/y1 exclusive
const WW = WIN.x1 - WIN.x0, WH = WIN.y1 - WIN.y0;
const BED_Y = 136;
const OPEN = 18;                                             // the lower left sash is pushed up this far
const TARGET_ANGLE = -1.35;                                  // "toward the bed": left and slightly up

// key, label, min, max, step, start-of-night, at-its-worst
const PARAMS = [
  ['seed',     'Seed',                   1, 999, 1,     7,    7],
  ['bushes',   'Number of bushes',       1, 24, 1,      15,   13],
  ['lean',     'Stem lean',             -0.8, 0.8, 0.01, -0.05, -0.22],
  ['trunkW',   'Stem thickness',         3, 24, 0.5,    8,    10.5],
  ['trunkLen', 'Stem height',            10, 80, 1,     17,   24],
  ['scale',    'Closeness',              0.5, 3.5, 0.01, 2.0,  2.35],
  ['levels',   'Branch generations',     2, 8, 1,       4,    5],
  ['forks',    'Forks per joint',        1.5, 3.2, 0.05, 2.0,  2.3],
  ['spread',   'Fork angle',             0.1, 1.3, 0.01, 0.62, 0.72],
  ['decay',    'Length falloff',         0.5, 0.9, 0.01, 0.68, 0.78],
  ['gnarl',    'Crookedness',            0, 1.5, 0.01,  0.20, 1.00],
  ['droop',    'Droop',                  0, 1, 0.01,    0.30, 0.55],
  ['reach',    'Reach toward the bed',   0, 1, 0.01,    0.28, 0.75],
  ['fingers',  'Finger twigs',           0, 1, 0.01,    0.00, 1.00],
  ['foliage',  'Leaves',                 0, 1, 0.01,    0.85, 0.00],
  ['hang',     'Hanging things',         0, 1, 0.01,    0.00, 0.50],
  ['sway',     'Sway',                   0, 2, 0.01,    0.35, 1.10],
  ['handSize', 'Hand branch: size',      0, 2.2, 0.01,  1.15, 1.75],
  ['handCurl', 'Hand branch: curl',      0, 1, 0.01,    0.40, 0.75],
  ['handSpread', 'Hand branch: spread',  0, 1.2, 0.01,  0.75, 1.05],
  ['handX',    'Hand branch: position',  0.2, 0.9, 0.01, 0.55, 0.50],
  ['handY',    'Hand branch: height',    0.1, 0.8, 0.01, 0.30, 0.34],
  ['moonX',    'Moon position',          0, 1, 0.01,    0.74, 0.70],
  ['moonY',    'Moon height',            0, 1, 0.01,    0.30, 0.34],
  ['moonR',    'Moon size',              3, 24, 0.5,    9,    13],
  ['clouds',   'Clouds',                 0, 1, 0.01,    0.25, 0.60],
];
function defaultPresets() {
  const calm = {}, night = {};
  for (const p of PARAMS) { calm[p[0]] = p[5]; night[p[0]] = p[6]; }
  return { calm, night };
}
let PRESETS = defaultPresets();
try {
  const s = JSON.parse(localStorage.getItem('only-a-tree-presets') || 'null');
  if (s && s.calm && s.night) for (const p of PARAMS) {
    if (typeof s.calm[p[0]] === 'number') PRESETS.calm[p[0]] = s.calm[p[0]];
    if (typeof s.night[p[0]] === 'number') PRESETS.night[p[0]] = s.night[p[0]];
  }
} catch (e) {}
function savePresets() { try { localStorage.setItem('only-a-tree-presets', JSON.stringify(PRESETS)); } catch (e) {} }
function blendParams(v) {
  const o = {};
  for (const p of PARAMS) o[p[0]] = PRESETS.calm[p[0]] + (PRESETS.night[p[0]] - PRESETS.calm[p[0]]) * v;
  o.seed = Math.round(v < 0.999 ? PRESETS.calm.seed : PRESETS.night.seed);
  if (PRESETS.calm.seed !== PRESETS.night.seed && v > 0 && v < 0.999) o.seed = Math.round(PRESETS.calm.seed);
  return o;
}

// ---------------------------------------------------------------------------
// noise
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0;
  n = Math.imul(n ^ n >>> 13, 1274126177);
  return ((n ^ n >>> 16) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function fbm(x, y) { return vnoise(x, y) * 0.6 + vnoise(x * 2.1 + 9.2, y * 2.1 + 3.7) * 0.4; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { v = clamp((v - a) / (b - a), 0, 1); return v * v * (3 - 2 * v); };

// ---------------------------------------------------------------------------
// buffers
const fb = new Float32Array(W * H);
const staticBase = new Float32Array(W * H);
const bedShade = new Float32Array(W * H);     // 0 = not bed
const duvShade = new Float32Array(W * H);     // 0 = not duvet, else how its surface faces the window
const duv = new Float32Array(W * H);
const barMask = new Uint8Array(W * H);
const treeMask = new Uint8Array(W * H);
const nearMask = new Uint8Array(W * H);     // the branch that is right against the glass
const openMask = new Uint8Array(W * H);     // no glass here
const wet = new Float32Array(W * H);          // trails that running drops leave on the glass
const curtA = new Uint8Array(W * H);        // curtain hanging in front of the glass
const leafD = new Float32Array(W * H);      // how much leaf the moonlight has to pass through
const leafT = new Float32Array(W * H);
const out = new Uint8ClampedArray(W * H);

// The duvet: a soft height field over the legs, rebuilt every frame so that it follows them.
// Its far edge is a rolled rim that the feet stick out from.
const LEGS = [{ fx: 100, hx: 86, lx: 100, ls: 0 }, { fx: 162, hx: 188, lx: 162, ls: 0 }];   // lx: ankle now, ls: how far it is pushed out
const duvH = new Float32Array(W * H);
function duvetEdge(x) {
  let e = 146, drag = 0;
  for (const l of LEGS) {
    const q = (x - l.lx) / 11, q2 = (x - l.lx) / 24, w = Math.exp(-q2 * q2);
    e -= 3.5 * Math.exp(-q * q) + 0.32 * l.ls * w;             // lifted over the shin, tugged along when it slides out
    drag += (l.lx - l.fx) * w;
  }
  return e + 2.2 * Math.sin((x - drag * 0.6) * 0.045 + 1) + 1.2 * Math.sin((x - drag * 0.6) * 0.13 + 2);
}
function duvetH(x, y, e) {
  const d = y - e;
  if (d < 0) return 0;
  const zz = d / (H - e);
  let h = 3.5 * smooth(0, 5, d), sx = x, sy = y;
  for (const l of LEGS) {
    const cx = l.lx + (l.hx - l.lx) * Math.pow(zz, 0.8), w = 10 * (1 + 1.5 * zz), q = (x - cx) / w, k = (zz - 0.62) / 0.2;
    const g = Math.exp(-q * q);
    h += (6 + 11 * zz + 5 * Math.exp(-k * k) + 0.35 * l.ls * (1 - zz)) * g;   // shin, with the knee a little higher
    const pull = Math.exp(-q * q * 0.35) * (1 - zz);                          // the cloth near a leg is dragged with it
    sx -= (l.lx - l.fx) * pull * 0.8; sy += l.ls * pull * 0.9;
  }
  h += 5 * fbm(sx * 0.035, sy * 0.09);                                        // soft filling
  const cr = 1 - Math.abs(2 * vnoise(sx * 0.025 + sy * 0.05, sy * 0.11 - sx * 0.02 + 7) - 1);
  h -= 3.5 * cr * cr * cr;                                                    // creases
  const t = (y - BED_Y) / (H - BED_Y), side = Math.min(x - (40 - 46 * t), 232 + 46 * t - x);
  h -= 7 * (1 - smooth(0, 9, side));                                          // falls away over the sides of the bed
  return h;
}
function shadeDuvet() {
  for (let x = 0; x < W; x++) {
    const e = duvetEdge(x);
    for (let y = BED_Y - 1; y < H; y++) {
      const i = y * W + x;
      duvShade[i] = bedShade[i] && y >= e ? 1 : 0;
      duvH[i] = bedShade[i] ? duvetH(x, y, e) : 0;
    }
  }
  for (let y = BED_Y; y < H; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (!duvShade[i]) continue;
    const d = (y < H - 1 ? duvH[i + W] : duvH[i] * 2 - duvH[i - W]) - duvH[i - W], e = duvH[i - 1] - duvH[i + 1];
    duvShade[i] = clamp(0.5 + 0.22 * d + 0.17 * e, 0.05, 2.2) * (0.88 + 0.12 * bedShade[i]);
  }
}
function buildStatic() {
  // glazing bars: a mullion between the two halves, each half 2 x 3 panes under a transom
  const panes = [[WIN.x0, 158], [163, WIN.x1]];
  for (let y = WIN.y0; y < WIN.y1; y++) for (let x = WIN.x0; x < WIN.x1; x++) {
    let bar = x >= 158 && x < 163;
    for (const [a, b] of panes) {
      if (x < a || x >= b) continue;
      const mid = (a + b) >> 1;
      if (x === mid) bar = true;
      const ry = y - WIN.y0;
      if (a === WIN.x0) {                                    // left half: lower sash raised
        if (ry === 21 || ry === 22 || ry === 43 - OPEN || ry === 64 - OPEN) bar = true;
        if (ry >= WH - OPEN - 3 && ry < WH - OPEN) bar = true;
        if (ry >= WH - OPEN) { bar = false; openMask[y * W + x] = 1; }
      } else if (ry === 21 || ry === 22 || ry === 43 || ry === 64) bar = true;
    }
    if (bar) barMask[y * W + x] = 1;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const dx = Math.max(WIN.x0 - x, 0, x - WIN.x1), dy = Math.max(WIN.y0 - y, 0, y - WIN.y1);
    const d = Math.hypot(dx, dy);
    let v = 6.5 + 13 * Math.exp(-d / 22) + (fbm(x * 0.08, y * 0.08) - 0.5) * 2;   // wall
    if (y >= 141) v = 3.5 + (hash2(x >> 1, y) - 0.5);                              // floor
    if (y === 139 || y === 140) v = 10;                                            // skirting
    // curtain rod and curtains
    if ((y === 7 || y === 8) && x >= 42 && x < 278) v = 19;
    const cl = false, cr = false;                            // curtains are drawn live, see drawCurtains
    if ((cl || cr) && y >= 9 && y < 124 + Math.round(Math.sin(x * 1.3) * 1.5)) {
      const k = cl ? 70 - x : x - 249;
      const fold = Math.sin(k * 0.95 + Math.sin(y * 0.045 + (cl ? 0 : 2)) * 0.9);
      v = 9 + 6 * fold + 30 * Math.exp(-k / 3.2) * (0.6 + 0.4 * fold);
    }
    // frame and sill
    if (x >= WIN.x0 - 3 && x < WIN.x1 + 3 && y >= WIN.y0 - 3 && y < WIN.y1 + 3 && !(cl || cr)) v = 11;
    if (x >= WIN.x0 - 3 && x < WIN.x1 + 3 && y >= WIN.y0 - 3 && y < WIN.y1 + 3 &&
        (x < WIN.x0 || x >= WIN.x1 || y < WIN.y0 || y >= WIN.y1) && (cl || cr)) v = Math.min(v, 14);
    if (y >= WIN.y1 + 3 && y < WIN.y1 + 7 && x >= WIN.x0 - 8 && x < WIN.x1 + 8) v = y === WIN.y1 + 3 ? 52 : 14;
    staticBase[i] = v;
    // bed
    if (y >= BED_Y) {
      const t = (y - BED_Y) / (H - BED_Y), z = 1 - Math.pow(1 - t, 1.8);
      const xl = 40 - 46 * t, xr = 232 + 46 * t;
      if (x >= xl && x <= xr) {
        let s = 0.8 + 0.4 * fbm(x * 0.045 + 3, z * 5);
        bedShade[i] = s;
      }
    }
  }
}

// ---------------------------------------------------------------------------
// the tree
let budget = 0, trunkPts = [], stampNear = false;
// One branch hangs right against the pane: a crooked arm ending in a knot with five long, jointed,
// curling twigs. In the wind the arm swings and the twigs drum on the glass.
const HAND = { tips: [] };
function drawHand(p, time, wind, tap, tapFinger) {
  HAND.tips.length = 0;
  const S = p.handSize;
  if (S < 0.05) return;
  stampNear = true;
  const px = WIN.x0 + p.handX * WW - wind * 1.6 * p.sway, py = WIN.y0 + p.handY * WH + wind * 2.6 * p.sway;
  const R = [WIN.x1 + 8, WIN.y0 + 30], C1 = [WIN.x1 - 22, WIN.y0 - 6], C2 = [px + 40 * S, py - 20 * S];
  let lx = R[0], ly = R[1];
  for (let k = 1; k <= 26; k++) {                              // the arm
    const t = k / 26, u = 1 - t;
    const x = u * u * u * R[0] + 3 * u * u * t * C1[0] + 3 * u * t * t * C2[0] + t * t * t * px + Math.sin(t * 19) * 1.2 * S;
    const y = u * u * u * R[1] + 3 * u * u * t * C1[1] + 3 * u * t * t * C2[1] + t * t * t * py + Math.cos(t * 23) * 1.0 * S;
    const w = (9 - 4 * t) * S * (1 + 0.16 * Math.sin(t * 31));
    line(lx, ly, x, y, w, w); lx = x; ly = y;
  }
  const a0 = Math.atan2(px - C2[0], -(py - C2[1]));           // where the wrist points
  for (let yy = -4; yy <= 4; yy++) for (let xx = -5; xx <= 5; xx++)   // the knot it all grows from
    if (xx * xx / 25 + yy * yy / 16 <= 1) stamp(px + xx * S * 0.9 - Math.sin(a0) * 0 , py + yy * S * 0.9, 0.9);
  const LEN = [0.62, 0.95, 1.1, 1.0, 0.78];
  for (let i = 0; i < 5; i++) {
    const f = i / 4 - 0.5;
    let a = a0 - f * 1.5 * p.handSpread - (i === 0 ? 0.35 : 0);  // i = 0 is the thumb, set apart on the upper side
    const L = LEN[i] * 22 * S;
    const flex = 0.1 * Math.sin(time * 0.8 + i * 1.4) * p.sway - (i === tapFinger ? tap * 0.3 : tap * 0.06);
    const c = p.handCurl * 0.42 + flex;
    let x = px + Math.sin(a) * 3.5 * S, y = py - Math.cos(a) * 3.5 * S, w = (3.4 - Math.abs(f) * 0.8) * S;
    const SEG = [0.44, 0.33, 0.23];
    for (let sg = 0; sg < 3; sg++) {
      a -= c * (0.55 + 0.35 * sg);                             // every joint bends the same way, like a claw closing
      const nx = x + Math.sin(a) * L * SEG[sg], ny = y - Math.cos(a) * L * SEG[sg], w1 = w * 0.66;
      line(x, y, nx, ny, w, w1);
      stamp(nx, ny, w1 * 0.72);                                // knuckle
      x = nx; y = ny; w = w1;
    }
    a -= c * 0.9;
    const tx = x + Math.sin(a) * 3.2 * S, ty = y - Math.cos(a) * 3.2 * S;
    line(x, y, tx, ty, Math.max(1, w * 0.8), 0.6);             // the nail
    HAND.tips.push([tx, ty]);
  }
  stampNear = false;
}
function stamp(x, y, r) {
  if (r < 0.8) {
    const xi = Math.round(x), yi = Math.round(y);
    if (xi >= 0 && xi < W && yi >= 0 && yi < H) { treeMask[yi * W + xi] = 1; if (stampNear) nearMask[yi * W + xi] = 1; }
    return;
  }
  const x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(W - 1, Math.ceil(x + r));
  const y0 = Math.max(0, Math.floor(y - r)), y1 = Math.min(H - 1, Math.ceil(y + r));
  const r2 = r * r;
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
    const dx = xx - x, dy = yy - y;
    if (dx * dx + dy * dy <= r2) { treeMask[yy * W + xx] = 1; if (stampNear) nearMask[yy * W + xx] = 1; }
  }
}
function stampLeaf(x, y, r) {
  const x0 = Math.max(WIN.x0, Math.floor(x - r)), x1 = Math.min(WIN.x1 - 1, Math.ceil(x + r));
  const y0 = Math.max(WIN.y0, Math.floor(y - r)), y1 = Math.min(WIN.y1 - 1, Math.ceil(y + r));
  const r2 = r * r;
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
    const dx = xx - x, dy = yy - y, q = (dx * dx + dy * dy) / r2;
    if (q < 1) leafD[yy * W + xx] += 0.75 * (1 - q * q);
  }
}
function line(x0, y0, x1, y1, w0, w1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 1.5) + 1;
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    stamp(x0 + (x1 - x0) * f, y0 + (y1 - y0) * f, (w0 + (w1 - w0) * f) * 0.5);
  }
}
function drawTree(p, time, opt) {
  treeMask.fill(0); leafD.fill(0); nearMask.fill(0);
  opt = opt || {};
  const wind = opt.wind || 0;
  const sc = p.scale * 0.8 * (opt.zoom || 1);
  const levels = Math.round(p.levels);
  let seed = Math.round(p.seed);
  budget = 9000; trunkPts = [];
  const by = WIN.y1 + 20 + (opt.dy || 0);                      // rooted well below the sill: no trunks in view

  function leaves(x, y, r, a0) {
    const n = Math.round(p.foliage * 26);
    for (let k = 0; k < n; k++) {
      const a = r() * 6.283, d = Math.sqrt(r()) * 9 * sc, ph = r() * 6.283;
      const fl = Math.sin(time * 2.6 + ph) * 0.35 * p.sway * (1 + wind);        // each leaf flutters a little
      stampLeaf(x + Math.cos(a) * d + fl, y + Math.sin(a) * d * 0.7 + fl * 0.5, (0.8 + r() * 1.3) * (0.6 + 0.4 * p.foliage) * sc);
    }
  }
  function grow(x, y, a, len, w, gen, id) {
    if (budget-- <= 0) return;
    const r = mulberry32(Math.imul(seed, 2654435761) ^ Math.imul(id, 40503));
    const ph = r();
    if (gen > 0) a += (Math.sin(time * (0.5 + ph * 0.7) + ph * 6.283) * 0.02 + wind * 0.03) * p.sway * gen;
    const n = gen === 0 ? 6 : 4, sl = len / n, w1 = w * 0.68;
    for (let i = 0; i < n; i++) {

  }
  seed = seed0;

  if (!opt.zoom) drawHand(p, time, wind, opt.tap || 0, opt.tapFinger || 0);
}

// curtains: pinned at the rod, pushed into the room by the wind, most on the open side

    const amp = side === 0 ? 17 : 6, ph = side * 2.3;
    for (let y = 9; y < 127; y++) {
      const t = (y - 9) / 114;

      const push = amp * Math.pow(t, 1.5) * (wind * 0.75 + wave * (0.1 + 0.3 * gust));
      const xa = side === 0 ? 48 + push * 0.25 : 249 - push, xb = side === 0 ? 71 + push : 272 - push * 0.25;

        const u = (x - xa) / (xb - xa), k = (side === 0 ? 1 - u : u) * 23;
        const fold = Math.sin(k * 0.95 + Math.sin(y * 0.045 + ph) * 0.9 + push * 0.12);

        fb[i] = val;
      }

}

// feet. Each foot rocks about the ankle, and the toes spread and wiggle.
const ANKLE_Y = 152;

  const rub = smooth(0.8, 1, scr);
  FEET.forEach((f, n) => {
    let th = (fbm(time * 0.16 + n * 31, 1.7) - 0.5) * 0.42 * (1 - scr) + Math.sin(time * 0.9 + n * 2) * 0.02;
    // now and then a leg is pushed further out from under the duvet, and the shin shows
    const slide = Math.max(smooth(0.35, 0.7, vnoise(time * 0.06 + n * 13, 2.2)) * (1 - curl), n === 1 ? scr : 0);
    f.ox = 0; f.oy = -9 + lift + curl * 3 - slide * 7;                          // afraid: the feet pull back
    if (n === 1) { f.ox = -31 * scr; th -= 0.2 * scr; f.oy += Math.sin(time * 12) * 2.6 * rub - 2 * scr; }
    else { th += 0.1 * scr + Math.sin(time * 12) * 0.025 * rub; }
    th += (n === 0 ? 1 : -1) * 0.1 * curl;                     // and turn in toward each other
    th += Math.sin(time * 53 + n * 2) * 0.06 * shake; f.ox += Math.sin(time * 47 + n * 3) * 1.3 * shake;   // trembling
    f.c = Math.cos(th); f.s = Math.sin(th);
    f.spread = smooth(0.35, 0.75, vnoise(time * 0.23 + n * 17, 4.2)) * (1 - curl) * (1 - scr * (1 - n));
    f.toe = 1 - 0.28 * curl;                                   // toes clench: shorter and tucked down
    const wig = smooth(0.55, 0.8, vnoise(time * 0.31 + n * 9, 8.8)) * (1 - curl) + (n === 0 ? rub * 0.8 : 0);
    for (let k = 0; k < 5; k++) f.ty[k] = curl * 2.3 + wig * Math.sin(time * 7.5 + k * 1.25 + n) * 1.1 - f.spread * 0.6;

}
function inFoot(f, x, y) {
  y -= f.oy;
  const rx = x - f.cx - f.ox, ry = y - ANKLE_Y;
  const dx = rx * f.c + ry * f.s; y = ANKLE_Y - rx * f.s + ry * f.c;
  if (y > ANKLE_Y + 3) return false;
  if (y >= 128 - f.dir * dx * 0.2) {
    const hw = y < 136 ? 14.5 : y < 150 ? 14.5 - (y - 136) * 0.46 : 8 + (y - 150) * 0.2;
    if (Math.abs(dx) <= hw) return true;
  }
  if (y > 137) return false;
  const sp = 1 + 0.2 * f.spread;
  for (let k = 0; k < 5; k++) {
    const t = TOES[k];
    const qx = (dx - f.dir * t[0] * sp) / t[1], qy = (y - t[3] - f.ty[k]) / (t[2] * f.toe);
    if (qx * qx + qy * qy <= 1) return true;
  }
  return false;
}

// 3x5 font
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010', 8: '111101111101111',
  9: '111101111001110', '.': '000000000000010', ',': '000000000010100', ':': '000010000010000',
  "'": '010010000000000', '-': '000000111000000', z: '000000110010011', '!': '010010010000010', '?': '110001010000010'

function text(s, x, y, val, scale, center) {
  scale = scale || 1;
  const w = s.length * 4 * scale - scale;
  if (center) x = Math.round(x - w / 2);
  for (let k = 0; k < s.length; k++) {
    const g = FONT[s[k]];
    if (g) for (let j = 0; j < 15; j++) if (g[j] === '1') {
      const px = x + (k * 4 + j % 3) * scale, py = y + ((j / 3) | 0) * scale;
      for (let b = 0; b < scale; b++) for (let a = 0; a < scale; a++) {
        const X = px + a, Y = py + b;
        if (X >= 0 && X < W && Y >= 0 && Y < H) out[Y * W + X] = val;
      }
    }
  }
}

// ---------------------------------------------------------------------------
// render one frame into `out`
let frameNo = 0;
function render(v) {
  const p = v.p, time = v.time, dawn = v.dawn || 0;
  drawTree(p, time, v.inside ? { zoom: 3.4 / p.scale, dx: 20, dy: 80 } : { wind: v.wind || 0, tap: v.tap || 0, tapFinger: v.tapFinger || 0 });
  fb.set(staticBase);

  // outside
  const mx = WIN.x0 + p.moonX * WW, my = WIN.y0 + p.moonY * WH, mr = p.moonR;
  const fl = v.fl || 0, rain = v.rain || 0, cl8 = Math.min(1, p.clouds + 0.45 * rain);
  const cloudAt = (x, y) => smooth(0.62 - cl8 * 0.42, 0.9 - cl8 * 0.3, fbm((x + time * 1.6) * 0.022, y * 0.05 + 5));
  const moonVis = (1 - 0.65 * cloudAt(mx, my)) * (1 - dawn * 0.8);
  for (let y = WIN.y0; y < WIN.y1; y++) {
    const ground = WIN.y1 - 4;
    for (let x = WIN.x0; x < WIN.x1; x++) {
      const i = y * W + x;
      if (barMask[i]) { fb[i] = 4 + dawn * 10 + (openMask[i + W] ? 34 * moonVis : 0); continue; }
      if (!v.inside && treeMask[i]) { fb[i] = 8 + dawn * 14; continue; }
      const d = Math.hypot(x - mx, y - my);
      // leaves: light is absorbed on the way through, and what gets scattered inside a thin
      // leaf comes out the near side, strongest where the moon is close behind it
      let T = 1, sc8 = 0;
      const ld = v.inside ? 0 : leafD[i];
      if (ld > 0.02) {
        const dn = (ld + 0.2 * (leafD[i - 1] + leafD[i + 1] + leafD[i - W] + leafD[i + W])) / 1.8;
        T = Math.exp(-0.7 * dn);
        const fwd = Math.exp(-d / (mr * 4)) + 0.25 * Math.exp(-d / 60);
        sc8 = moonVis * (24 + 190 * fwd) * (1 - T) * Math.exp(-0.45 * dn) + (dawn * 30 + fl * 45) * (1 - T);
      }
      leafT[i] = T;
      if (y > ground + Math.sin(x * 0.045) * 1.6) { fb[i] = 2 + dawn * 12 + sc8 * 0.5; continue; }
      let s = 30 + 26 * (y - WIN.y0) / WH + 62 * Math.exp(-d / (mr * 2.4)) + 26 * Math.exp(-d / 70);
      const c = cloudAt(x, y);
      s += c * (10 + 40 * Math.exp(-d / 45));
      if (d < mr + 0.5) {
        const disc = 232 - 34 * smooth(0.45, 0.7, fbm(x * 0.33 + 40, y * 0.33)) ;
        s += (disc * (1 - 0.6 * c) - s) * clamp(mr + 0.5 - d, 0, 1);
      }

      if (v.bolt) { const bd = Math.abs(x - v.bolt[y]); s += bd < 0.8 ? 255 : 90 * Math.exp(-bd / 2.5); }
      fb[i] = s * T + sc8 + (T < 1 ? 2 : 0);
    }
  }

  const inWin = (x, y) => x >= WIN.x0 && x < WIN.x1 && y >= WIN.y0 && y < WIN.y1;
  for (let k = 0, n = Math.round(rain * 110); k < n; k++) {
    const sp = 95 + 70 * hash2(k, 5), sl = 0.25 + (v.wind || 0) * 0.5;
    const rx = WIN.x0 + hash2(k, 11) * (WW + 20) - 10, ry = WIN.y0 + (hash2(k, 29) * WH + time * sp) % WH;
    for (let j = 0; j < 4; j++) {
      const X = Math.round(rx - j * sl), Y = Math.round(ry - j);

    const put = (x, y) => { x = Math.round(x); y = Math.round(y); if (inWin(x, y) && !barMask[y * W + x]) fb[y * W + x] = 2; };
    for (let a = -sz * 0.45; a <= sz * 0.45; a += 0.5) for (let c = -sz * 0.22; c <= sz * 0.22; c += 0.5) put(bx + a, by + c);

      for (let c = -w; c <= w; c += 0.5) put(bx + c + side * r * 0.25, by - Math.sin(flap) * r * side * (hit && fall ? 0.3 : 1) - Math.cos(flap) * r * 0.15 * side + side * r * Math.cos(flap) * 0.9 * 0);
      put(bx + side * r * Math.cos(flap), by - r * Math.sin(flap));
      put(bx + side * r * Math.cos(flap), by - r * Math.sin(flap) + 1);
    }
  }
  // the glass adds a little haze; the open gap is the bare night
  for (let y = WIN.y0; y < WIN.y1; y++) for (let x = WIN.x0; x < WIN.x1; x++) {
    const i = y * W + x;
    if (!openMask[i] && !barMask[i]) fb[i] = fb[i] * 0.93 + 10 + (Math.sin((x + y * 1.4) * 0.11) > 0.93 ? 3 : 0);
    else if (openMask[i]) fb[i] *= 0.82;
    if (nearMask[i] && !barMask[i] && !v.inside) fb[i] = 0.5 + dawn * 10;      // pressed against the pane: no haze at all
  }
  if (v.tap > 0.3 && HAND.tips.length) {                       // where a twig touches, the glass answers
    const tp = HAND.tips[v.tapFinger || 0];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const X = Math.round(tp[0]) + dx, Y = Math.round(tp[1]) + dy, q = dx * dx + dy * dy;

    for (let y = WIN.y0; y < WIN.y1; y++) for (let x = WIN.x0; x < WIN.x1; x++) {

  shadeDuvet();
  for (let y = BED_Y; y < H; y++) {
    const t = (y - BED_Y) / (H - BED_Y), z = 1 - Math.pow(1 - t, 1.8);
    const vv = 0.985 - z * 1.07, s = 1 + z * 1.25, pen = (0.6 + 2.2 * z) / WW;

      G.depth = 0;
      G.creep = Math.max(0, G.creep - 0.09 * dt);
      G.hour += dt * 0.004;
    }
    if (G.state === 'play') {
      if (G.lid < 0.5) G.wasClosed = false; else if (closed) G.wasClosed = true;
      synthLevel(G.creep, closed, dt);
      clockEl.volume = closed ? 1 : 0.6;
      clockEl.playbackRate = 1 - 0.22 * G.creep * G.creep;
      if (G.hour >= 6) { G.hour = 6; G.state = 'waking'; G.t = 0; G.shown = 0; G.creep = 0; synthSilence(); clockEl.playbackRate = 1; }
    }
  } else if (s === 'taken') {
    if (G.lid < 0.5) { G.state = 'reveal'; G.t = 0; sfxDeath(); }
  } else if (s === 'reveal') {
    if (G.t > 1.5) { G.state = 'dead'; G.t = 0; }
  } else if (s === 'waking') {
    if (G.t > 1.6 && G.lid < 0.05) { G.state = 'win'; G.t = 0; }
  }
}
function draw() {
  if (G.tune) {
    const v = G.tuneBlend !== null ? G.tuneBlend : (G.tuneTab === 'calm' ? 0 : 1);
    render({ p: blendParams(v), time: G.time, wind: G.wind, gust: G.gust, tap: Math.min(1, G.jolt), tapFinger: G.tapFinger });
    return;
  }
  const s = G.state;
  if (s === 'dead') {
    out.fill(0);
    text('IT WAS NEVER A TREE', W / 2, 64, 190, 2, true);
    text('THE CLOCK STOPPED AT ' + clockString(G.hour), W / 2, 92, 110, 1, true);
    if (G.t > 1.2) text('PRESS SPACE TO TRY AGAIN', W / 2, 112, 80, 1, true);
    return;
  }
  const dawn = s === 'win' || s === 'waking' ? 1 : clamp((G.hour - 5) * 0.3, 0, 0.3);
  const view = { p: blendParams(s === 'title' || s === 'win' || s === 'waking' ? 0 : visualCreep()), time: G.time, dawn, lid: G.lid, curl: G.fear, wind: G.wind, gust: G.gust, tap: Math.min(1, G.jolt), tapFinger: G.tapFinger,
    fl: flashAt(G.flashT), bolt: G.flashT < 0.2 ? G.bolt : null, rain: s === 'play' ? G.rain : 0, bird: s === 'play' ? G.bird : null,
    smear: s === 'play' ? G.smear : null, drops: s === 'play' ? G.drops : null, shake: s === 'play' && G.startleT < 1.1 ? G.startle : 0 };
  if (s === 'title') view.dark = 0.5;
  if (s === 'reveal') {
    view.p = blendParams(1); view.inside = true; view.curl = 1;
    view.shakeX = (Math.random() - 0.5) * 7; view.shakeY = (Math.random() - 0.5) * 5;
    view.dark = G.t > 1.25 ? 0 : 1;
  }
  render(view);
  if (s === 'title') {
    text('ONLY A TREE', W / 2, 26, 235, 3, true);
    const L = ['PRESS SPACE TO CLOSE YOUR EYES, AGAIN TO OPEN THEM', 'TIME ONLY PASSES WHILE YOU SLEEP', '',
      'IT ONLY MOVES WHEN YOU ARE NOT LOOKING', 'LISTEN. OPEN YOUR EYES BEFORE IT REACHES THE GLASS',
      'WATCH IT UNTIL IT IS QUIET AGAIN', '', 'LAST UNTIL 06:00'];
    L.forEach((l, k) => text(l, W / 2, 62 + k * 9, 175, 1, true));
    if ((G.time * 1.4 | 0) % 2 === 0) text('PRESS SPACE OR CLICK TO BEGIN', W / 2, 150, 235, 1, true);
  } else if (s === 'play') {
    if (G.lid < 0.3) {
      text(clockString(G.hour), 6, 6, 120, 1);
      if (G.closes === 0) text('PRESS SPACE TO CLOSE YOUR EYES', W / 2, 170, 120, 1, true);
    } else if (G.lid > 0.95) {
      if (G.thoughtT > 0) {                                    // the inner monologue
        const a = Math.min(1, (G.thoughtD - G.thoughtT) / 0.35, G.thoughtT / 0.5), val = 12 + 140 * a;
        if (G.thought === 'ZzZz') {
          for (let k = 0; k < 4; k++) text('ZzZz'[k], W / 2 - 18 + k * 10, Math.round(92 - k * 5 + Math.sin(G.time * 1.6 + k) * 1.5), val * (0.45 + 0.18 * k), 2);
        } else text(G.thought, W / 2, 84, val, 1, true);
      }
      if (G.closes <= 2) text('PRESS SPACE TO OPEN YOUR EYES', W / 2, 168, 18, 1, true);
    }
  } else if (s === 'win') {
    text('06:00', 114, 46, 20, 3, true);
    text('MORNING.', 114, 70, 20, 1, true);
    text('IT IS ONLY A TREE.', 114, 79, 20, 1, true);
    if (G.t > 2) text('PRESS SPACE TO SLEEP ANOTHER NIGHT', W / 2, 170, 235, 1, true);
  }
}

// ---------------------------------------------------------------------------
// screen
const canvas = document.getElementById('screen'), cx = canvas.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const offCtx = off.getContext('2d'), img = offCtx.createImageData(W, H);
function resize() {
  const st = document.getElementById('stage'), dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.floor(Math.min(st.clientWidth * dpr / W, st.clientHeight * dpr / H)));
  if (canvas.width !== W * k) { canvas.width = W * k; canvas.height = H * k; }
  canvas.style.width = (W * k / dpr) + 'px'; canvas.style.height = (H * k / dpr) + 'px';
}
function present() {
  const d = img.data;
  for (let i = 0, j = 0; i < W * H; i++, j += 4) { const g = out[i]; d[j] = g; d[j + 1] = g; d[j + 2] = g; d[j + 3] = 255; }
  offCtx.putImageData(img, 0, 0);
  cx.imageSmoothingEnabled = false;
  cx.drawImage(off, 0, 0, canvas.width, canvas.height);
}
function frame(dt) { update(dt); draw(); present(); }
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  frame(dt);
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------------
// input
function press() {
  if (G.tune) return;
  if (G.state === 'title' || (G.state === 'dead' && G.t > 1.2) || (G.state === 'win' && G.t > 2)) { newNight(); return; }
  if (G.state === 'play' || G.state === 'taken') G.held = !G.held;      // one press shuts the eyes, the next opens them
}
function release() {}
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'KeyM') setMuted(!muted);
  else if (e.code === 'KeyP') setTune(!G.tune);
  else if (e.code === 'KeyF' && !e.metaKey && !e.ctrlKey) toggleFullscreen();
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(); });
canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('resize', resize);
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const rq = el.requestFullscreen || el.webkitRequestFullscreen; if (rq) { const pr = rq.call(el); if (pr && pr.catch) pr.catch(() => {}); } }
}
function onFullscreen() {       // hide the buttons while full screen, and refit the picture
  document.body.classList.toggle('fs', !!(document.fullscreenElement || document.webkitFullscreenElement));
  resize();
}
addEventListener('fullscreenchange', onFullscreen);
addEventListener('webkitfullscreenchange', onFullscreen);
document.getElementById('btnMute').onclick = e => { setMuted(!muted); e.target.blur(); };
document.getElementById('btnFull').onclick = e => { toggleFullscreen(); e.target.blur(); };
document.getElementById('btnTune').onclick = e => { setTune(!G.tune); e.target.blur(); };

// ---------------------------------------------------------------------------
// parameter panel
const sliderEls = {};
function buildPanel() {
  const host = document.getElementById('sliders');
  for (const p of PARAMS) {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = p[1]; lab.htmlFor = 'p_' + p[0];
    const inp = document.createElement('input'); inp.type = 'range'; inp.id = 'p_' + p[0];
    inp.min = p[2]; inp.max = p[3]; inp.step = p[4];
    const o = document.createElement('output');
    inp.oninput = () => {
      const val = parseFloat(inp.value);
      PRESETS[G.tuneTab][p[0]] = val;
      if (p[0] === 'seed') { PRESETS.calm.seed = val; PRESETS.night.seed = val; }
      G.tuneBlend = null; syncPanel(); savePresets();
    };
    row.append(lab, inp, o); host.append(row);
    sliderEls[p[0]] = [inp, o, p[4]];
  }
  document.getElementById('tabCalm').onclick = () => { G.tuneTab = 'calm'; G.tuneBlend = null; syncPanel(); };
  document.getElementById('tabNight').onclick = () => { G.tuneTab = 'night'; G.tuneBlend = null; syncPanel(); };
  document.getElementById('blend').oninput = e => { G.tuneBlend = parseFloat(e.target.value); syncPanel(); };
  document.getElementById('btnSeed').onclick = () => {
    const s = 1 + (Math.random() * 999 | 0); PRESETS.calm.seed = s; PRESETS.night.seed = s; syncPanel(); savePresets();
  };
  document.getElementById('btnReset').onclick = () => { PRESETS = defaultPresets(); G.tuneBlend = null; syncPanel(); savePresets(); };
  document.getElementById('btnCopy').onclick = e => {
    const s = JSON.stringify(PRESETS, null, 1);
    const done = () => { e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy as JSON', 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => prompt('Presets', s));
    else prompt('Presets', s);
  };
  document.getElementById('btnClose').onclick = () => setTune(false);
}
function syncPanel() {
  document.getElementById('tabCalm').classList.toggle('on', G.tuneTab === 'calm');
  document.getElementById('tabNight').classList.toggle('on', G.tuneTab === 'night');
  const b = G.tuneBlend !== null ? G.tuneBlend : (G.tuneTab === 'calm' ? 0 : 1);
  document.getElementById('blend').value = b;
  document.getElementById('blendOut').textContent = b.toFixed(2);
  for (const k in sliderEls) {
    const [inp, o, step] = sliderEls[k], val = PRESETS[G.tuneTab][k];
    inp.value = val; o.textContent = step >= 1 ? String(Math.round(val)) : val.toFixed(2);
  }
}
function setTune(on) {
  G.tune = on; G.held = false;
  document.body.classList.toggle('tuning', on);
  document.getElementById('btnTune').classList.toggle('on', on);
  if (on) { G.tuneBlend = null; syncPanel(); clockEl.pause(); synthSilence(); }
  else if (G.state === 'play') clockPlay();
  resize();
}

// ---------------------------------------------------------------------------
buildStatic(); buildPanel(); resize();
// review hooks: ?creep=0.8 shows the tree at that blend, ?hour=5.5 sets the clock, ?tune opens the panel
const Q = new URLSearchParams(location.search);
if (Q.has('creep') || Q.has('hour')) {
  G.state = 'play'; G.needRelease = false; G.closes = 9;
  G.hour = parseFloat(Q.get('hour') || '0'); G.shown = G.creep = parseFloat(Q.get('creep') || '0');
}
if (Q.has('state')) { G.state = Q.get('state'); G.t = 9; }
if (Q.has('tune')) setTune(true);
window.__game = { G, PRESETS: () => PRESETS, frame, update, draw, present, render, blendParams, out, resize, A };
requestAnimationFrame(loop);
</script>
